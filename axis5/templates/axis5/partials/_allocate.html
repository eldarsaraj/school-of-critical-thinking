{% if safe_payload.stem %}<p class="ax-stem">{{ safe_payload.stem }}</p>{% endif %}

<p class="ax-alloc-instruction">Distribute <strong>{{ safe_payload.total|default:100 }} points</strong> across the options. The sliders are linked — moving one limits the others.</p>

<div class="ax-choices-box">
  <div class="ax-alloc-grid">
    {% for opt in safe_payload.options %}
    <div class="ax-alloc-row">
      <label class="ax-alloc-label">{{ opt.text }}</label>
      <div class="ax-alloc-slider-wrap">
        <input
          type="range"
          class="ax-alloc-input ax-alloc-slider"
          id="alloc_{{ opt.id }}"
          name="alloc_{{ opt.id }}"
          min="0" max="{{ safe_payload.total|default:100 }}"
          value="0"
          step="1"
        >
        <span class="ax-alloc-val" id="alloc-val-{{ opt.id }}">0%</span>
      </div>
    </div>
    {% endfor %}
  </div>

  <div class="ax-alloc-total-row">
    <span class="ax-alloc-total-label">Total:</span>
    <span id="ax-alloc-total" class="ax-alloc-sum">0</span>
    <span class="ax-alloc-total-of">/ {{ safe_payload.total|default:100 }}</span>
  </div>
</div>
