  question_text: '[VISUAL: Bar graph of the number of shelves in five library sections -- History: 9, Science: 6, Art: 11, Music: 7, Travel: 5.] The History and Science sections hold 40 books per shelf, the Art section holds 25 per shelf, and the Music and Travel sections hold 50 per shelf. Which section holds the most books?'
  choice_a: Art section
  choice_b: Music section
  choice_c: Science section
  choice_d: History section
  correct_answer: D
  explanation: 'Multiply each section''s shelves by its books per shelf: History = 9 x 40 = 360, Science = 6 x 40 = 240, Art = 11 x 25 = 275, Music = 7 x 50 = 350, Travel = 5 x 50 = 250. The History section holds the most at 360. Choice A (Art) has the most shelves, 11, but at 25 books each holds only 275. Choice B (Music) reaches 350, just short. Choice C (Science) holds only 240.'
  distractor_types:
    A: fast_pattern_match
    B: wrong_setup
    C: wrong_setup
  source_ref: 2018A_Q98 (variant 2)
- section: math
  stage: hard_module
