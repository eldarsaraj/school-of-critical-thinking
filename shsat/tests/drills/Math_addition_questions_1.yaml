  passage_text: null
  question_text: Today, Mia's age is 1/5 of her aunt's age. In 4 years, Mia's age will be 1/4 of her aunt's age. How old is Mia's aunt today?
  choice_a: '12'
  choice_b: '16'
  choice_c: '60'
  choice_d: '80'
  correct_answer: C
  explanation: 'Let the aunt''s age be a, so Mia''s age is a/5. In 4 years Mia is a/5 + 4 and the aunt is a + 4, and Mia is then one-fourth as old: a/5 + 4 = (a + 4)/4. Multiplying by 20: 4a + 80 = 5a + 20, so a = 60. Choice A (12) is Mia''s current age. Choice B (16) is Mia''s age in 4 years. Choice D (80) comes from adding 4 only to Mia and not to the aunt.'
  distractor_types:
    A: partial_answer
    B: partial_answer
    D: wrong_setup
  source_ref: 2018A_Q87
