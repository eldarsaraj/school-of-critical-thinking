# SHSAT construct-mimic set -- 30 math items modeled on 2018 Form A (CORRECTED mapping)
# Each item preserves the underlying skill of its source question (named in source_ref) with fresh numbers/context.
# Grid-ins Q61 and Q62 converted to 4-choice MC. Second variants of Q76, Q87, Q98, Q106 are items 27-30.
# stage mapped from difficulty (easy->easy_module, medium->routing, hard->hard_module) as a placeholder for slotting.
- section: math
  stage: routing
  question_number: 1
  skill: number_operations
  difficulty: medium
  topic: inclusion-exclusion of two overlapping groups with a 'neither' category
  passage_group_id: null
  passage_title: null
  passage_text: null
  question_text: 'A school club surveyed its members about which instruments they play. Based on the results, all of the following statements are true: 18 members play guitar; 21 members play piano; 4 members play both guitar and piano; 7 members play neither instrument. How many members were surveyed?'
  choice_a: '35'
  choice_b: '42'
  choice_c: '46'
  choice_d: '50'
  correct_answer: B
  explanation: The number surveyed is everyone who plays at least one instrument plus everyone who plays neither. Members who play at least one instrument = 18 + 21 - 4 = 35 (the 4 who play both were counted twice, so subtract them once). Adding the 7 who play neither gives 35 + 7 = 42. Choice A (35) stops after counting instrument-players and forgets the 7 who play neither. Choice C (46) never subtracts the 4 double-counted members (18 + 21 + 7). Choice D (50) adds every number in the problem, doubling the overlap instead of removing it.
  distractor_types:
    A: partial_answer
    C: wrong_setup
    D: fast_pattern_match
  source_ref: 2018A_Q61
- section: math
  stage: routing
  question_number: 2
  skill: number_operations
  difficulty: medium
  topic: consecutive integers, transform each, then take the product
  passage_group_id: null
  passage_title: null
  passage_text: null
  question_text: The sum of two consecutive integers is -23. If 2 is added to the smaller integer and 3 is subtracted from the larger integer, what is the product of the two resulting integers?
  choice_a: '-140'
  choice_b: '132'
  choice_c: '135'
  choice_d: '140'
  correct_answer: D
  explanation: 'Two consecutive integers with sum -23 are -12 and -11. Adding 2 to the smaller: -12 + 2 = -10. Subtracting 3 from the larger: -11 - 3 = -14. Their product is (-10)(-14) = 140. Choice A (-140) makes a sign error, since two negatives multiply to a positive. Choice B (132) multiplies the original integers and ignores the changes. Choice C (135) applies the changes to the wrong integers.'
  distractor_types:
    A: sign_error
    B: fast_pattern_match
    C: wrong_setup
  source_ref: 2018A_Q62
- section: math
  stage: easy_module
