  question_text: 'A drawer holds 12 socks: 5 are white and 7 are gray. Two socks are drawn at random, one at a time without replacement. What is the probability that neither sock is white?'
  choice_a: 5/33
  choice_b: 7/22
  choice_c: 49/144
  choice_d: 7/12
  correct_answer: B
  explanation: '''Neither white'' means both socks are gray. The first gray sock has probability 7/12; with one gray sock removed, the second has probability 6/11. Multiplying: (7/12)(6/11) = 42/132 = 7/22. Choice A (5/33) finds the probability that both socks are white. Choice C (49/144) treats the draws as if the sock were replaced. Choice D (7/12) is the probability for only the first sock.'
  distractor_types:
    A: wrong_setup
    C: wrong_setup
    D: partial_answer
  source_ref: 2018A_Q78
