  question_text: A jar contains exactly 8 green marbles. The probability of drawing a green marble at random is 4/9. How many marbles in the jar are NOT green?
  choice_a: '5'
  choice_b: '8'
  choice_c: '10'
  choice_d: '18'
  correct_answer: C
  explanation: The 8 green marbles are 4/9 of the jar, so the total is 8 / (4/9) = 18 marbles. The number that are not green is 18 - 8 = 10. Choice A (5) misreads 4/9 as '4 green out of 9 total' and answers 9 - 4. Choice B (8) just repeats the green count. Choice D (18) is the total number of marbles; the final subtraction was skipped.
  distractor_types:
    A: wrong_setup
    B: fast_pattern_match
    D: last_step_trap
  source_ref: 2018A_Q73
