  difficulty: easy
  topic: metric capacity conversion after scaling up
  passage_group_id: null
  passage_title: null
  passage_text: null
  question_text: One container holds 250 milliliters of paint. How many liters of paint are in 36 of these containers?
  choice_a: 9 L
  choice_b: 90 L
  choice_c: 900 L
  choice_d: 9,000 L
  correct_answer: A
  explanation: The 36 containers hold 36 x 250 = 9,000 milliliters. Since 1,000 milliliters make 1 liter, that is 9,000 / 1,000 = 9 L. Choice B (90) divides by 100 instead of 1,000. Choice C (900) divides by 10. Choice D (9,000) reports the milliliters without converting to liters.
  distractor_types:
    B: unit_conversion_error
    C: unit_conversion_error
    D: fast_pattern_match
  source_ref: 2018A_Q64
