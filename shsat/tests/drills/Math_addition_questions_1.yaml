  passage_text: null
  question_text: Mr. Alvarez bought 4 folders for $1.25 each and 5 kilograms of rice. He paid a total of $23.00 for these items, not including tax. What was the price per kilogram of the rice?
  choice_a: $3.60
  choice_b: $4.50
  choice_c: $4.60
  choice_d: $18.00
  correct_answer: A
  explanation: The folders cost 4 x $1.25 = $5.00, so the rice cost $23.00 - $5.00 = $18.00. Spread over 5 kilograms, that is $18.00 / 5 = $3.60 per kilogram. Choice B ($4.50) divides the rice total by 4 (the folder count) instead of 5. Choice C ($4.60) divides the full $23.00 by 5 without removing the folder cost. Choice D ($18.00) is the rice subtotal, before dividing by the weight.
  distractor_types:
    B: wrong_setup
    C: wrong_setup
