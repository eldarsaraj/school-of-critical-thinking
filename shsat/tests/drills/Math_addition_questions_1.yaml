  passage_group_id: null
  passage_title: null
  passage_text: null
  question_text: Marcus starts a game with three times as many tokens as Nadia. Marcus gives Nadia 6 tokens, but he still has 8 more tokens than Nadia. How many tokens did Marcus have to start with?
  choice_a: '10'
  choice_b: '12'
  choice_c: '21'
  choice_d: '30'
  correct_answer: D
  explanation: 'Let Nadia start with n tokens, so Marcus starts with 3n. After Marcus gives away 6, he has 3n - 6 and Nadia has n + 6. Since Marcus still has 8 more: 3n - 6 = (n + 6) + 8, so 2n = 20 and n = 10. Marcus started with 3n = 30. Choice A (10) is Nadia''s starting amount. Choice B (12) ignores that giving tokens changes both counts. Choice C (21) lowers only Marcus''s side and forgets that Nadia gains 6.'
  distractor_types:
    A: partial_answer
    B: wrong_setup
    C: wrong_setup
  source_ref: 2018A_Q66
- section: math
  stage: routing
  question_number: 5
  skill: ratios_proportions
  difficulty: medium
  topic: split a perimeter using a length-to-width ratio
  passage_group_id: null
  passage_title: null
  passage_text: null
  question_text: The perimeter of a rectangle is 360 centimeters. The ratio of its length to its width is 5:4. What are the dimensions of this rectangle?
  choice_a: 80 cm by 100 cm
  choice_b: 90 cm by 90 cm
  choice_c: 100 cm by 80 cm
  choice_d: 108 cm by 72 cm
  correct_answer: C
  explanation: 'With length : width = 5 : 4, write length = 5k and width = 4k. The perimeter is 2(5k + 4k) = 18k = 360, so k = 20, giving 100 cm by 80 cm. Every pair listed has the correct perimeter of 360 cm, so the ratio is the real test. Choice A (80 by 100) assigns the ratio backward. Choice B (90 by 90) ignores the ratio and splits evenly. Choice D (108 by 72) uses a 3 : 2 ratio instead of 5 : 4.'
  distractor_types:
    A: proportion_inversion
    B: wrong_setup
    D: wrong_setup
  source_ref: 2018A_Q70
