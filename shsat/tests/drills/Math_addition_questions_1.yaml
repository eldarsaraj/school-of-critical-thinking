  skill: geometry
  difficulty: hard
  topic: circumference, then distance divided by circumference (second variant)
  passage_group_id: null
  passage_title: null
  passage_text: null
  question_text: A wheel with a radius of 21 inches rolls along the ground without slipping. How many complete revolutions does the wheel make while traveling 46,200 inches? (Use 22/7 for pi.)
  choice_a: '175'
  choice_b: '350'
  choice_c: '700'
  choice_d: 1,100
  correct_answer: B
  explanation: The wheel's circumference is 2 x pi x radius = 2 x (22/7) x 21 = 132 inches. The number of revolutions is 46,200 / 132 = 350. Choice A (175) uses 2 x pi x diameter = 264 inches, doubling the circumference. Choice C (700) uses pi x radius = 66 inches, dropping the factor of 2. Choice D (1,100) divides by the diameter, 42, leaving out pi.
  distractor_types:
    A: wrong_setup
    C: wrong_formula
    D: wrong_setup
  source_ref: 2018A_Q106 (variant 2)
