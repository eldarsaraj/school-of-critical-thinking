  topic: mean from a frequency table with zero-value and zero-frequency categories
  passage_group_id: null
  passage_title: null
  passage_text: null
  question_text: '[VISUAL: Table showing how many students read each number of books last month -- 0 books: 6 students; 1 book: 6 students; 2 books: 4 students; 3 books: 2 students; 4 books: 0 students; 5 books: 2 students.] There are 20 students in the class. What is the mean number of books read per student?'
  choice_a: '1'
  choice_b: 1 1/2
  choice_c: 2 1/2
  choice_d: 3 1/3
  correct_answer: B
  explanation: 'Multiply each number of books by how many students read that many, add, then divide by 20 students: (0 x 6 + 1 x 6 + 2 x 4 + 3 x 2 + 4 x 0 + 5 x 2) / 20 = (0 + 6 + 8 + 6 + 0 + 10) / 20 = 30 / 20 = 1 1/2. Choice A (1) drops the students who read 5 books. Choice C (2 1/2) averages the six possible book counts, 0 through 5, ignoring how many students. Choice D (3 1/3) averages the six student counts instead of the books.'
  distractor_types:
    A: partial_answer
    C: wrong_setup
    D: wrong_setup
  source_ref: 2018A_Q113
- section: math
  stage: routing
  question_number: 26
  skill: ratios_proportions
  difficulty: medium
  topic: 'multi-part ratio: fraction of the whole, then scale up'
  passage_group_id: null
  passage_title: null
  passage_text: null
  question_text: A fertilizer is mixed by weight in the ratio 5 parts nitrogen, 3 parts phosphorus, and 2 parts potassium. One garden bed needs 40 pounds of this fertilizer. How many total pounds of phosphorus are needed for 6 garden beds?
  choice_a: '12'
  choice_b: '48'
  choice_c: '72'
  choice_d: '120'
  correct_answer: C
  explanation: The fertilizer has 5 + 3 + 2 = 10 parts, and phosphorus is 3 of them. Each bed's 40 pounds contains 3/10 x 40 = 12 pounds of phosphorus, so 6 beds need 12 x 6 = 72 pounds. Choice A (12) is the amount for a single bed, not all six. Choice B (48) uses the 2 potassium parts instead of the 3 phosphorus parts. Choice D (120) uses the 5 nitrogen parts by mistake.
  distractor_types:
    A: partial_answer
    B: wrong_setup
    D: wrong_setup
  source_ref: 2018A_Q114
- section: math
  stage: hard_module
  question_number: 27
  skill: number_operations
  difficulty: hard
  topic: two overlapping percentage attributes; a different two-way-table region (second variant)
  passage_group_id: null
  passage_title: null
  passage_text: null
  question_text: At a college, 62% of students take a lab science and 48% take a foreign language. Of all students, 35% take both a lab science and a foreign language. What percent of students take a lab science but NOT a foreign language?
  choice_a: 13%
  choice_b: 14%
  choice_c: 25%
  choice_d: 27%
  correct_answer: D
  explanation: 'Students who take a lab science but not a foreign language are the lab-science students minus the ones who take both: 62 - 35 = 27%. Choice A (13) finds the opposite corner -- language but not lab (48 - 35). Choice B (14) just subtracts the two group totals (62 - 48). Choice C (25) is the ''neither'' group, 100 - (62 + 48 - 35).'
  distractor_types:
    A: partial_answer
    B: wrong_setup
    C: wrong_setup
  source_ref: 2018A_Q76 (variant 2)
- section: math
  stage: hard_module
  question_number: 28
  skill: algebra
  difficulty: hard
  topic: two-condition age relationship across two points in time (second variant)
  passage_group_id: null
  passage_title: null
  passage_text: null
  question_text: Today, Noah's age is 1/6 of his grandfather's age. In 3 years, Noah's age will be 1/5 of his grandfather's age. How old is Noah's grandfather today?
  choice_a: '12'
  choice_b: '15'
  choice_c: '72'
  choice_d: '90'
  correct_answer: C
  explanation: 'Let the grandfather''s age be g, so Noah''s age is g/6. In 3 years Noah is g/6 + 3 and the grandfather is g + 3, with Noah then one-fifth as old: g/6 + 3 = (g + 3)/5. Multiplying by 30: 5g + 90 = 6g + 18, so g = 72. Choice A (12) is Noah''s age now. Choice B (15) is Noah''s age in 3 years. Choice D (90) comes from adding 3 only to Noah, not the grandfather.'
  distractor_types:
    A: partial_answer
    B: partial_answer
    D: wrong_setup
  source_ref: 2018A_Q87 (variant 2)
