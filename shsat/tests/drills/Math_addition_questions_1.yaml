  question_text: The least of 7 consecutive integers is p, and the greatest is q. What is the value of (p + q)/2 in terms of p?
  choice_a: 2p
  choice_b: p + 6
  choice_c: p + 3
  choice_d: p + 7
  correct_answer: C
  explanation: The seven consecutive integers are p, p + 1, ..., p + 6, so the greatest is q = p + 6. Their average is (p + q)/2 = (p + p + 6)/2 = (2p + 6)/2 = p + 3, the middle integer. Choice A (2p) doubles p instead of averaging. Choice B (p + 6) is the greatest integer q itself, not the average. Choice D (p + 7) miscounts the spacing, as if seven integers span seven steps.
  distractor_types:
    A: wrong_setup
    B: last_step_trap
    D: wrong_setup
  source_ref: 2018A_Q89
