    \ the background, recalled mainly on the rare occasion when a garden sundial is\
    \ found reading an hour or two apart from a wristwatch.\r\n\r\nWhat the change\
    \ truly marked was a subtle revolution in how people understood time itself. Time\
    \ had once been something each town read from its own sky, as local and as variable\
    \ as the weather. Afterward it became something agreed upon in advance, a common\
    \ measure that allowed a vast and scattered population to move and act in concert.\
    \ The bargain was seldom spelled out, yet it was real enough: a little of each\
    \ place's individuality was traded away so that every place could share a single,\
    \ dependable now."
  question_text: According to the table, at which station does the town's own clock
    run furthest behind the railroad clock?
  choice_a: Easton
  choice_b: Dunmore
  choice_c: Colton
  choice_d: Ashford
  correct_answer: A
  explanation: '"Behind" means the town''s own clock reads an earlier time than the
    railroad clock — its local time is the smaller number. Working down the table,
    Ashford and Bregg read later than railroad time (their clocks are ahead), Colton
    matches exactly, and only Dunmore and Easton read earlier. Of those two, Easton
    is the further off: its 11:08 trails the railroad''s 11:25 by seventeen minutes,
    against Dunmore''s eight. Ashford is the trap — its gap is the largest on the
    table at thirteen minutes, but that clock runs ahead of railroad time, so size
    alone doesn''t make it the answer. Colton can''t be it either, since its clock
    agrees with the railroad exactly. The question turns on reading both how far apart
    the clocks are and which way the gap runs.'
