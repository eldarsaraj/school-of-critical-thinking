    \ vents one more plume into a common sky, the driver who adds one more car to\
    \ a crowded road, each follows the same logic as the herder, profiting privately\
    \ while the cost diffuses outward to all. In every case the lesson is the same,\
    \ and it is not the comforting lesson that people ought simply to try harder to\
    \ be good. It is the more demanding lesson that good outcomes depend less upon\
    \ the virtue of individuals than upon the structure of the choices laid before\
    \ them, and that a society wishing its members to act well must first see to it\
    \ that acting well and acting sensibly are not set at odds."
  question_text: Which statement best expresses the central idea of the passage?
  choice_a: Because no single herder can see how his own small additions accumulate
    across the village, the commons is destroyed by a kind of collective blindness.
  choice_b: A shared resource of this kind can be protected only by dividing it into
    private holdings or imposing binding limits on its use.
  choice_c: When individuals each pursue their own private advantage with little regard
    for the welfare of others, the shared resources they depend on are eventually
    ruined.
  choice_d: The commons fails not through wrongdoing but because its structure gives
    each user the full gain of overuse while splitting the cost among all.
  correct_answer: D
  explanation: 'The passage builds to a specific diagnosis, and it is careful to rule
    out the easy ones along the way. The commons is destroyed, it argues, not because
    anyone behaves badly — each herder "reasons correctly," and adding an animal is
    for him "precisely the sensible thing to do" — but because of how the situation
    is built: a herder collects the whole benefit of an extra animal while the cost
    of the wear on the shared pasture is split among everyone. That imbalance, repeated
    by every herder, is what brings ruin. D names that structural cause and the point
    that no wrongdoing is required. A reads the disaster as collective blindness,
    as though the herders simply fail to see how their additions add up; but the passage
    insists the opposite — each sees his own arithmetic perfectly, and the ruin follows
    even though, and even because, everyone reasons clearly. B states a true fact
    from the passage, that the resource can be saved only by private ownership or
    binding rules, but that is the remedy, not the central idea, which is the diagnosis
    of why the tragedy happens in the first place. C captures the shape of the problem
    — individuals pursuing private advantage until the shared resource fails — but
    it locates the cause in "little regard for others," a flaw of character, when
    the passage shows that even the herder who does regard others is trapped by the
    same structure, and it calls the ruin inevitable, ignoring the remedies the passage
    goes on to describe. Only D identifies what the passage actually blames: not the
    herders'' hearts but the arrangement that sets sensible private choices against
    the common good.'
