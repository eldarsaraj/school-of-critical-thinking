  question_text: Suppose a bat's call produces two echoes that return at the very
    same instant, but one echo is much stronger than the other. Based on the passage,
    the bat could most reasonably conclude that the two objects are
  choice_a: the same distance away and the same size.
  choice_b: at different distances, with the closer object returning the stronger
    echo.
  choice_c: moving in different directions, one toward the bat and one away.
  choice_d: about the same distance away, but one larger than the other.
  correct_answer: D
  explanation: The passage explains that a bat reads distance from how long an echo
    takes to return and size from how strong the echo is. Two echoes that return at
    the very same instant must have traveled the same distance, so the objects are
    equally far away; the one with the stronger echo must be the larger of the two.
