- section: ELA
  stage: easy_module
  question_number: 23
  question_type: multiple_choice
  skill: main_idea
  difficulty: medium
  topic: ''
  passage_group_id: ela_e_p3
  passage_title: Reading the Rings
  passage_text: "Cut across the trunk of an old tree and you will find a pattern of\
    \ rings, one for each year of its life. Most know you can count those rings to\
    \ find a tree's age, but few realize they hold far more than a number. Read with\
    \ care, they record dry years and wet ones, fires and floods, the slow turning\
    \ of the climate over centuries. The study of that record, called dendrochronology,\
    \ has become one of the most powerful tools available for dating the distant past.\r\
    \n\r\nThe underlying principle is straightforward: in most climates a tree grows\
    \ quickly in years of ample warmth and water, laying down a wide ring, and slowly\
    \ in years of drought or cold, laying down a narrow one. A single ring is therefore\
    \ a kind of report on the year that produced it, yet one tree, on its own, tells\
    \ only its own story, and no tree lives forever. The breakthrough came when researchers\
    \ recognized that the pattern of wide and narrow rings is anything but random.\
    \ Because trees in one region endure the same good and bad years, they record\
    \ an identical sequence — a fat ring here, three thin ones there, a run of ordinary\
    \ years between. That shared sequence acts like a fingerprint of the local climate,\
    \ making possible a technique called cross-dating.\r\n\r\nCross-dating is what\
    \ extends the record backward in time. Suppose a living tree, felled today, holds\
    \ rings reaching back two centuries. Somewhere in them lies a stretch matching\
    \ the outermost rings of an older, long-dead log — a beam, say, from an ancient\
    \ ruin. By aligning the overlapping stretch, a researcher can anchor the dead\
    \ log to exact calendar years, though no record survives of when its tree was\
    \ cut. That older log may overlap with one older still, and by linking sample\
    \ to sample, the chain of matching patterns reaches back not merely centuries\
    \ but thousands of years, far beyond the life of any single tree.\r\n\r\nYet the\
    \ method demands more than a simple count of rings, because the rings themselves\
    \ can mislead. Trees in mild, well-watered places grow uniform rings that vary\
    \ little from year to year and so preserve almost no signal. Only trees that have\
    \ struggled, rooted in dry or marginal ground, produce the strong, irregular patterns\
    \ cross-dating requires. A tree stressed by drought may add no ring at all one\
    \ year, or two bands in a single season, so that anyone tallying a lone trunk\
    \ could be off by years. That is why patterns are matched across many trees, never\
    \ trusted in any one.\r\n\r\nThe results have reshaped fields well beyond biology.\
    \ Archaeologists who once dated ancient timbers by guesswork can now fix a building's\
    \ construction to a single year. When dendrochronology was applied to old structures\
    \ in the American Southwest, it revealed that certain settlements had been raised\
    \ and abandoned in rapid succession, and the cause proved to be written in the\
    \ rings themselves: a run of unusually narrow bands marking a prolonged and devastating\
    \ drought. The trees had recorded the very disaster that drove an entire people\
    \ from their homes.\r\n\r\nTree rings have also become a way of checking other\
    \ methods. Radiocarbon dating, which estimates age from the gradual decay of carbon\
    \ in once-living material, was long known to drift slightly from true calendar\
    \ dates. Because dendrochronology can supply wood of exactly known age, scientists\
    \ used long ring records to correct that drift and make radiocarbon far more reliable.\
    \ A method built on nothing grander than the counting of rings thus helped sharpen\
    \ one of the most important dating tools in science.\r\nNone of this requires\
    \ anything more exotic than a patient eye and a long enough chain of samples.\
    \ The rings had always been there, in firewood and fence posts and old barn beams,\
    \ waiting to be read. What changed was the recognition that a tree is not merely\
    \ a living thing but an instrument, one that has patiently recorded the weather\
    \ for as long as it has stood."
  question_text: Which statement best expresses the central idea of the passage?
  choice_a: By matching ring patterns across many trees, scientists can extend a dated
    record back thousands of years.
  choice_b: Tree rings hold a record of the past that scientists have learned to read
    for dating.
  choice_c: Tree rings preserve a year-by-year history of a region's droughts, floods,
    and fires.
  choice_d: Reading tree rings lets archaeologists date old buildings and timbers
    to a single exact year.
  correct_answer: B
  explanation: 'Each of the four says something true about the passage; the question
    is which one is the whole idea rather than a piece of it. The passage has two
    joined halves: tree rings are a record of the past — of climate and events — and
    scientists have learned to read that record to date the past with precision. B
    holds both halves. A captures only the method, the cross-dating that stretches
    the record back, leaving out what the rings actually record. C captures only the
    first half, the rings as a history of past weather, and stops before the dating
    that the whole second part of the passage is about. D captures only one use of
    that dating — pinning down old buildings — when the passage reaches wider, to
    climate history and even to correcting radiocarbon. Each of the three is a real
    part of the passage; only B is sized to it as a whole.'
  distractor_types:
    A: misidentified_detail
    C: misidentified_detail
    D: misidentified_detail
