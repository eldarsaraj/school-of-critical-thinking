  question_text: A rectangular garden measures 12 meters by 8 meters. A walkway of
    uniform width 1 meter runs around the inside edge of the garden, as shown. What
    is the area of the walkway?
  choice_a: 19 m²
  choice_b: 36 m²
  choice_c: 40 m²
  choice_d: 60 m²
  correct_answer: B
  explanation: The walkway is what remains after removing the inner planted region,
    so its area is the whole garden minus the inner rectangle. The whole garden is
    12 × 8 = 96 square meters. Because the 1-meter walkway runs along all four sides,
    it takes 1 meter off each end of every dimension — 2 meters in total — so the
    inner rectangle is (12 − 2) × (8 − 2) = 10 × 6 = 60 square meters. The walkway
    is therefore 96 − 60 = 36 square meters. A subtracts the width only once from
    each dimension, using (12 − 1) × (8 − 1) = 77 and getting 96 − 77 = 19, but the
    walkway borders both ends, so 2 meters come off each side. C multiplies the garden's
    perimeter, 2 × (12 + 8) = 40, by the 1-meter width, which counts each of the four
    corner squares twice. D is the inner planted area — the region the walkway surrounds
    — not the walkway itself. Only 36 is the area of the walkway.
