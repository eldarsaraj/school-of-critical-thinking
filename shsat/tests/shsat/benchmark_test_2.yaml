  question_text: The difficulty that paragraph five raises for the perceiver view
    is that, taken strictly, that view
  choice_a: cannot explain why people so often agree in their judgments, since a purely
    private response would be expected to vary from person to person.
  choice_b: leaves no room for one person's taste to be better than another's, which
    clashes with our believing that taste can be refined and some judgments are more
    discerning.
  choice_c: denies that beauty can be a response at all, since responses cannot be
    argued about or taught the way matters of fact can.
  choice_d: implies that our tastes can never change, when in fact a person can learn
    to find beautiful what once seemed dull, as with a difficult piece of music.
  correct_answer: B
  explanation: 'Paragraph five grants the perceiver view and then follows it to an
    uncomfortable end. If calling something beautiful is only reporting the feeling
    one happens to have, then no such report can be wrong, and no person''s taste
    can be better than anyone else''s — each merely states a private reaction. But
    that collides with how we actually behave: we argue about beauty, we try to open
    others'' eyes, we believe taste can be cultivated and that some judgments are
    more discerning than others. A view that makes all of that incoherent, the passage
    says, has left something out. B states that difficulty exactly. A points to agreement
    as the problem, but that was paragraph two''s concern; the trouble here is different
    — it is about our ranking some tastes above others, which a pure-response view
    cannot allow. C claims the difficulty is that beauty cannot be a response at all,
    but the view''s entire premise is that beauty is a response; the paragraph presses
    on a consequence of that premise, not a denial of it. D seizes on the music example
    but turns it backward: the passage offers learning to love a once-dull piece as
    a case the strict view struggles to explain, evidence that we treat taste as something
    that can be educated — not as a change the view forbids. Only B identifies the
    actual difficulty: a strict response view erases any difference between better
    and worse taste, which is at odds with how we think and talk about beauty.'
