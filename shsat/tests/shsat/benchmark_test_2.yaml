- section: ELA
  stage: hard_module
  question_number: 28
  question_type: multiple_choice
  skill: sentence_structure
  difficulty: medium
  topic: ''
  passage_group_id: ela_h_re
  passage_title: ''
  passage_text: ''
  question_text: "Read this sentence. \r\n\r\n\"The new training program teaches volunteers\
    \ how to set up the equipment, the calibration of the sensors, and to record the\
    \ data accurately.\" \r\n\r\nWhat is the best way to revise it?"
  choice_a: The new training program teaches volunteers how to set up the equipment,
    calibrate the sensors, and record the data accurately.
  choice_b: The new training program teaches volunteers the setup of the equipment,
    the calibration of the sensors, and the recording of the data accurately.
  choice_c: The new training program teaches volunteers how to set up the equipment,
    how the sensors are calibrated, and how to record the data accurately.
  choice_d: The new training program teaches volunteers to set up the equipment, calibrate
    the sensors, and the accurate recording of the data.
  correct_answer: A
  explanation: 'The original sentence lists three things the program teaches, but
    the three are in three different grammatical forms: "how to set up the equipment"
    (an infinitive phrase), "the calibration of the sensors" (a noun phrase), and
    "to record the data accurately" (another infinitive, missing the "how"). Items
    in a series have to share a form, and the cleanest fix runs them all as parallel
    verbs under one "how to": set up, calibrate, and record. That is A — three matched
    actions the volunteer learns to perform. B does make the three parallel, but by
    turning them all into nouns — "the setup … the calibration … the recording" —
    which recasts active skills as static topics, and the last, "the recording of
    the data accurately," reads awkwardly because "accurately" wants a verb to modify,
    not a noun. C lines up three "how" clauses, so it looks parallel, but it quietly
    changes the middle item from something the volunteer does ("calibrate the sensors")
    into information about a process ("how the sensors are calibrated"), so the three
    are no longer the same kind of thing — two are skills and one is knowledge. D
    fixes the first two into parallel verbs but then ends on "the accurate recording
    of the data," a noun phrase, so the series falls out of parallel again on its
    final item, the same flaw the original had. Only A makes all three items match
    in form and in kind, as actions the program teaches volunteers to carry out.'
  distractor_types:
    B: less_precise
    C: changes_meaning
    D: introduces_new_error
