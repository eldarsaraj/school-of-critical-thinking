  passage_group_id: ela_r_re
  passage_title: Bringing Back the Creek
  passage_text: "(1) For more than a century, Cole Creek ran beneath downtown Marlon,\
    \ hidden inside a concrete pipe. (2) Engineers had buried it in the 1920s, an\
    \ era when a stream winding through a city center was treated as an obstacle rather\
    \ than an asset. (3) Recently the city reversed that decision through a process\
    \ called daylighting, in which a covered waterway is reopened to the surface.\
    \ (4) The restored creek now winds through a chain of small parks, and it has\
    \ quickly become one of Marlon's most popular gathering places.\r\n(5) Supporters\
    \ argue that daylighting offers far more than pleasant scenery. (6) A buried pipe\
    \ can carry only so much water. (7) During heavy storms the old system would overflow,\
    \ and water spilled into nearby basements. (8) An open channel, in contrast, takes\
    \ in a sudden surge, releasing it slowly, and the strain on the rest of the system\
    \ is eased. (9) The creek has also done a great deal to bring various kinds of\
    \ wildlife back to the area. (10) The pipe that once held the creek was, in its\
    \ day, considered a remarkable piece of engineering. (11) City leaders point to\
    \ climbing property values and a cluster of new businesses near the water as proof\
    \ that the project has begun to pay for itself. (12) Marlon's example has not\
    \ gone unnoticed, several neighboring cities have begun to study their own buried\
    \ streams."
  question_text: What is the best way to combine sentences 6 and 7?
  choice_a: Because a buried pipe can carry only so much water, the old system overflowed
    in heavy storms, flooding nearby basements.
  choice_b: Although a buried pipe can carry only so much water, the old system overflowed
    in heavy storms, flooding nearby basements.
  choice_c: A buried pipe can carry only so much water during heavy storms, so the
    old system flooded nearby basements.
  choice_d: A buried pipe can carry only so much water, and the old system sometimes
    overflowed in heavy storms, flooding nearby basements.
  correct_answer: A
  explanation: 'Sentence 6 gives the reason and sentence 7 gives the result: because
    the pipe could hold only so much, the system overflowed in storms. A keeps that
    cause-and-effect and states it cleanly. B looks almost identical but swaps "Because"
    for "Although," which turns the reason into a concession — as if the system overflowed
    in spite of the pipe''s limited capacity, when that limit is exactly what caused
    the overflow. C slides "during heavy storms" next to the pipe''s capacity, so
    it now reads as though the pipe could carry only so much water only in storms;
    the limit is constant, and the storms are what overwhelm it. D now carries the
    same details as A, but it joins the two ideas with a plain ''and,'' which sets
    them side by side without marking the pipe''s limited capacity as the cause of
    the overflow; the added ''sometimes'' softens the claim further. Only A combines
    the two while making the cause-and-effect explicit.'
  distractor_types:
    B: wrong_logical_relation
    C: changes_meaning
    D: less_precise
