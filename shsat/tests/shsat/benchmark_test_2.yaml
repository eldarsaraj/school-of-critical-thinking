    \ out of step with the heavens. Newspapers debated whether it was sensible, or\
    \ even proper, to let a private railroad company announce what time it was. For\
    \ a while, certain towns stubbornly kept two clocks side by side, one set to the\
    \ railroad's standard and the other to the older, local reckoning, as if reluctant\
    \ to choose between them.\r\n\r\nIn the end, the convenience proved too useful\
    \ to refuse. As more and more of ordinary life came to depend on travel and communication\
