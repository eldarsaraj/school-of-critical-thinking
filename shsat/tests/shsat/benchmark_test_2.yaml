  question_text: According to the passage, dividing the commons into private holdings
    prevents its ruin because such an arrangement
  choice_a: gives each herder a smaller piece of land, which naturally limits how
    many animals he is able to keep on it.
  choice_b: makes each herder bear the full cost of overusing his land, so that ruining
    it would now be a loss to himself alone.
  choice_c: instills in each herder a sense of ownership and pride that makes him
    take better care of what is now his own.
  choice_d: allows the most capable herders to acquire more land and manage the village's
    grazing more efficiently than before.
