  question_text: What is the best way to combine sentences 5 and 6?
  choice_a: Other branches offer free passes to local museums, while still others
    have built small recording studios where patrons produce music and podcasts.
  choice_b: Other branches offer free passes to local museums where patrons produce
    music and podcasts.
  choice_c: Other branches offer passes to nearby attractions, while still others
    have set up spaces for recording sound.
  choice_d: Because other branches offer free passes to local museums, still others
    have built small recording studios where patrons produce music and podcasts.
  correct_answer: A
  explanation: 'Sentences 5 and 6 describe two different groups of branches doing
    two different things; "while" coordinates them as parallel examples and keeps
    every detail intact. None of the distractors can be ruled out on grammar — all
    three read cleanly. B is the hardest: it combines the sentences into one fluent
    clause, but in doing so it claims patrons record music at the museums and erases
    the recording-studio branches. C keeps the correct "while" relationship but trades
    the precise nouns for vague ones. D coordinates the two ideas with "because,"
    which asserts a cause-and-effect that the original never implies.'
  distractor_types:
    B: changes_meaning
    C: less_precise
    D: wrong_logical_relation
