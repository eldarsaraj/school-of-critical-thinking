    the area. Each centimeter is 5 km, so the park is 4 × 5 = 20 km by 6 × 5 = 30
    km, and its area is 20 × 30 = 600 square km. The common mistake is to find the
    map area first (4 × 6 = 24 cm²) and multiply by 5 — but area doesn't scale by
    the linear factor, it scales by the square of it (5 × 5 = 25). That's why choice
    C, 120, is wrong (24 × 5), while the right scaling would be 24 × 25 = 600. Choice
    A, 24, is just the map area. Choice B, 100, is the actual perimeter, not the area.
