    \ herder, in short, confronts the same merciless logic as a grasping one; the\
    \ structure of the situation penalizes restraint and rewards consumption, whatever\
    \ the character of the person caught within it.\r\n\r\nThis is why appeals to\
    \ conscience, however sincere, seldom rescue a commons. The fault lies not in\
    \ the herders but in the arrangement, in the mismatch between who enjoys the benefit\
    \ of drawing upon the resource and who absorbs the cost. To alter the outcome,\
    \ one must alter that arrangement, and history records broadly two means of doing\
    \ so. The resource may be parceled into private holdings, so that each herder\
    \ owns his share and bears the full cost of overusing what is now his alone; a\
    \ man does not strip his own field bare, because the loss would fall upon him\
    \ entirely. Or the community may fix rules upon the common land, limiting by agreement\
    \ the number of animals each may graze and binding all to a discipline that none\
    \ could afford to practice in isolation. Either path works not by rendering people\
    \ more virtuous but by aligning the cost of a choice with its benefit, so that\
    \ what is sensible for each is no longer ruinous for all.\r\n\r\nThe pasture is\
    \ merely the clearest instance of a pattern that emerges wherever a benefit is\
    \ gathered into private hands while its cost is dispersed across a shared domain.\
    \ The fisherman who takes one more haul from a dwindling stock, the factory that\
    \ vents one more plume into a common sky, the driver who adds one more car to\
    \ a crowded road, each follows the same logic as the herder, profiting privately\
    \ while the cost diffuses outward to all. In every case the lesson is the same,\
    \ and it is not the comforting lesson that people ought simply to try harder to\
    \ be good. It is the more demanding lesson that good outcomes depend less upon\
    \ the virtue of individuals than upon the structure of the choices laid before\
    \ them, and that a society wishing its members to act well must first see to it\
    \ that acting well and acting sensibly are not set at odds."
  question_text: The passage presents the herder's decision to add an animal as "sensible"
    mainly to establish that
  choice_a: the destruction of the commons follows from sound reasoning, not from
    error, so correcting it requires more than urging people to think clearly
  choice_b: the herder has carefully weighed the long-term health of the pasture against
    his own short-term gain before deciding.
  choice_c: most herders are reasonable people who would gladly show restraint if
    only they understood the damage their herds were causing.
  choice_d: the herder is behaving more wisely than his neighbors, who add animals
    without the careful calculation he performs.
  correct_answer: A
  explanation: 'The word "sensible" is doing deliberate work. By insisting that adding
    an animal is the reasonable thing for the herder to do — that "there is nothing
    foolish in his reasoning" — the passage blocks the comfortable explanation that
    the commons fails because people are careless or shortsighted. If even clear,
    correct reasoning leads each herder to overuse the land, then the ruin is built
    into the situation, not into anyone''s mistake, and no amount of urging people
    to reason better will help. A draws out that purpose. B treats "sensible" as careful
    long-term deliberation, as though the herder has weighed the pasture''s future
    health against his gain; but the passage is precise about what he weighs — his
    entire private benefit against only his small fraction of the shared cost — and
    the pasture''s long-term health is exactly the part he has reason to discount,
    since most of that cost falls on others. C reads the emphasis as flattering the
    herders, suggesting they are reasonable folk who would restrain themselves if
    only they grasped the damage; but the passage''s point runs the other way — the
    herder does grasp the damage, and restraint still is not in his interest, so understanding
    changes nothing. D takes "sensible" to single this herder out as wiser than his
    neighbors, but the passage stresses that every herder performs the same calculation
    and reaches the same conclusion, so nothing distinguishes him as more prudent.
    Only A reads "sensible" as the passage intends it: a sign that the catastrophe
    grows from sound reasoning, which is why clear thinking alone cannot undo it.'
