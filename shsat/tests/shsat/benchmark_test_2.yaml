    \ as on the thing perceived, and perceivers differ, across cultures, across histories,\
    \ across individual temperaments. Consider how the very name of a style can carry\
    \ an old insult. A kind of soaring, intricate architecture that a later age came\
    \ to treasure was first called barbarous by those who preferred the calm proportions\
    \ of an earlier taste, and the label meant as scorn still clings to it today.\
