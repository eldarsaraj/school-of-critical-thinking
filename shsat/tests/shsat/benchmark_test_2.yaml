  passage_title: The Kite
  passage_text: "All morning we let the string run out,\r\nmy daughter's hands beneath\
    \ my hands,\r\nthe diamond climbing past the gulls\r\nuntil it was a thumbnail,\
    \ then a thought.\r\nShe asked me if it wanted to come down.\r\nI said a kite\
    \ is happiest like this—\r\nfar enough to feel the whole wide sky\r\nand still\
    \ held fast by something on the ground.\r\nThe wind leaned hard. The line went\
    \ tight as wire.\r\nI felt the pull of all that distance\r\ntravel down the thread\
    \ into my palm,\r\nand understood the kite was teaching me:\r\nhow much I gave\
    \ it was how high it flew,\r\nand every inch I kept was why it stayed.\r\nWhen\
    \ her arms grew tired I did not take the spool.\r\nI closed my hands a little\
    \ over hers\r\nand let her feel the weight of the far thing,\r\nthe small fierce\
    \ tug of what we cannot keep\r\nand do not, yet, let go. The afternoon\r\nwent\
    \ gold. We reeled it in by slow degrees,\r\nthe sky returning, fold by fold, to\
    \ cloth.\r\nShe held it to her chest the way you hold\r\na bird that has come\
    \ back. I did not tell her\r\nit was only paper. Some things you let them learn."
  question_text: Which statement best expresses a central idea of the poem?
  choice_a: A parent's love shows itself as much in what it holds onto as in what
    it sets free.
  choice_b: A parent's love is a constant balancing of the wish to protect a child
    against the need to set the child free.
  choice_c: A parent's love means learning, in the end, to loosen one's grip and let
    a child go.
  choice_d: Children grow best when their parents give them both freedom and a sense
    of security.
  correct_answer: A
  explanation: 'The poem keeps insisting that giving and holding are not two different
    things but one. The kite is "happiest" both "far enough to feel the whole wide
    sky" and "still held fast by something on the ground," and the turn makes it explicit:
    "how much I gave it was how high it flew, / and every inch I kept was why it stayed."
    Freedom and grip each make the other possible — that is what A captures. B treats
    the two as opposing pulls to be balanced against each other, but the poem''s point
    is the reverse: they aren''t opposites. C reads the poem as building toward release,
    yet at the close the speaker holds on — "do not, yet, let go" — and brings the
    kite back rather than freeing it. D turns the poem''s felt, particular moment
    into general advice about how children turn out, which is not what the poem is
    reaching for.'
  distractor_types:
    B: wrong_concept
    C: inference_leap
    D: too_broad
