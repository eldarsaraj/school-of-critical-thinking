  question_text: As used in the fourth paragraph, "signal" (in "preserve almost no
    signal") most nearly means
  choice_a: a visible mark or scar left on the tree by a particular past event.
  choice_b: a sign of how healthy the tree was in each year of its life.
  choice_c: the readable record of past conditions that the variation in the rings
    carries.
  choice_d: the actual weather conditions the tree lived through in each year of its
    life.
  correct_answer: C
  explanation: 'The passage says uniform rings "preserve almost no signal," and the
    task is to see what "signal" means here. It doesn''t mean a thing you could point
    to in the wood; it means readable information — the record of past conditions
    the rings carry in the way they vary from year to year. Where rings swing between
    wide and narrow, that variation is a readable record; where they stay the same,
    there is nothing to read, almost no signal. C says exactly this. A takes "signal"
    as a single mark or scar, but a uniform-ringed tree is full of rings and still
    holds almost no signal, so a signal can''t be a mark. B takes it as the tree''s
    health, yet a tree that grew well in every mild year is perfectly healthy and
    still preserves almost no signal — health isn''t the issue, variation is. D is
    the closest miss: it takes "signal" to be the weather itself, but every tree lived
    through weather year after year; what the uniform tree lacks is not weather but
    a readable record of it. The signal is the information in the pattern, not the
    conditions that produced it.'
  distractor_types:
    A: wrong_concept
    B: wrong_concept
    D: partly_true_but_wrong
