  question_text: The passage describes the trailing driver, "creeping forward at last,"
    discovering "an empty road where the trouble should have been." The road is empty
    mainly because
  choice_a: the driver who first eased off the accelerator had long since continued
    on down the road, taking the original source of the delay with him.
  choice_b: the slowdown was a wave moving through the spot rather than a fixed blockage,
    and it had already passed backward to the cars behind her.
  choice_c: the cars ahead of her had accelerated and cleared out, emptying the entire
    stretch of road in front of her position.
  choice_d: the disturbance had begun several minutes earlier, which left it more
    than enough time to fade away before she arrived.
