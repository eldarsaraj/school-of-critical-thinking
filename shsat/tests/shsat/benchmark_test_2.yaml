- section: ELA
  stage: easy_module
  question_number: 13
  question_type: multiple_choice
  skill: inference
  difficulty: medium
  topic: ''
  passage_group_id: ela_e_p1
  passage_title: Seeing with Sound
  passage_text: "On a summer evening, a bat flickers across the darkening sky, snatching\
    \ insects out of the air with a precision that seems impossible for an animal\
    \ flying blind. Bats are not blind—most see about as well as we do—but in the\
    \ dark they rely on something else entirely. They navigate and hunt by sound,\
    \ building a picture of the world from echoes. The ability, called echolocation,\
    \ lets a bat chase a moth through a tangle of branches at night without ever touching\
    \ a leaf.\r\n\r\nThe principle is simple to state. A hunting bat sends out a stream\
    \ of high-pitched calls, far too high for human ears, and then listens for the\
    \ sound to bounce back. When a call strikes an object—a twig, a wall, a flying\
    \ insect—part of it returns as an echo. From that echo the bat reads the world:\
    \ how far away the object is, judged by the time the sound takes to return; how\
    \ large it is, judged by the strength of the echo; and even which direction it\
    \ is moving, judged by subtle changes in the returning pitch. A bat does all of\
    \ this in a fraction of a second, and then again, and again, dozens of times each\
    \ second as it closes in on its prey.\r\n\r\nWhat makes the system remarkable\
    \ is not only its speed but its flexibility. When a bat is simply cruising, it\
    \ calls slowly, a few times a second, the way a driver glances now and then at\
    \ the road ahead. But the instant it detects prey, the calls come faster and faster,\
    \ until in the final rush before the catch they blur into a buzz so rapid that\
    \ researchers call it the \"feeding buzz.\" Each call updates the bat's picture\
    \ of exactly where the insect is and where it is darting next.\r\nFor all its\
    \ sophistication, the system has limits. Sound grows faint as it travels, so a\
    \ bat's world of echoes reaches only a few dozen feet ahead; past that, the returning\
    \ signal is too weak to read. Different species have met this challenge in different\
    \ ways. Some hunt in the open, sending out long, far-reaching calls that sweep\
    \ a wide patch of sky, while others thread through dense forest on short, rapid\
    \ calls suited to a cluttered world of leaves and branches. Engineers who design\
    \ sonar and radar have studied these animals closely, since a bat solves, with\
    \ a tiny brain and a pair of ears, problems that human machines handle only with\
    \ far more equipment.\r\n\r\nThe insects, of course, have not simply surrendered.\
    \ Some moths have evolved ears tuned to the precise frequencies of bat calls;\
    \ the moment they hear a hunter approaching, they fold their wings and drop out\
    \ of the sky. A few species go further still. Certain tiger moths answer a bat's\
    \ call with rapid clicks of their own, and the clicks appear to scramble the echo,\
    \ leaving the bat with a smeared and useless image. In the darkness overhead,\
    \ in other words, a contest is unfolding that we cannot hear: a hunter reading\
    \ the night by sound, and a prey that has learned to confuse the reading."
  question_text: The passage suggests that bats hunting in dense forest use short,
    rapid calls rather than long ones most likely because
  choice_a: short calls travel through the air faster than long ones and so reach
    nearby objects sooner.
  choice_b: the bat is trying to keep its calls from being overheard by the moths
    it hunts.
  choice_c: a space crowded with nearby leaves and branches calls for frequent, close-range
    information.
  choice_d: a dense forest contains fewer objects to keep track of, so a simpler stream
    of calls will do.
  correct_answer: C
  explanation: 'The passage explains that a bat''s echoes reach only a short distance
    and that forest bats face "a cluttered world of leaves and branches." In that
    crowded, close-up setting a bat needs frequent, short-range readings to thread
    past obstacles and pin down prey, which is what C describes. A sounds technical
    but is false: a call''s length doesn''t change how fast sound travels — every
    call moves at the same speed. B borrows a real detail from later in the passage,
    that some moths can hear bat calls, but the passage ties the forest bat''s short
    calls to its surroundings, not to staying quiet. D reverses the situation — a
    forest is described as cluttered, with more objects to track, not fewer, so a
    sparser pattern of calls would leave the bat less informed, not more.'
  distractor_types:
    A: wrong_concept
    B: misidentified_detail
    D: opposite
