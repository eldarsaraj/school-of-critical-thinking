    \ per hour. (14) The design of these new towers, with their frames of steel and\
    \ their walls of glass, were unlike anything the city had seen before. (15) The\
    \ skyscraper, unimaginable without the elevator, climbed floor by floor into the\
    \ vertical city we know today."
  question_text: A writer wants to add a sentence at the end of the first paragraph
    (after sentence 4) to complete the paragraph's point. Which choice best accomplishes
    this?
  choice_a: Height, in other words, was not a prize but a penalty, something a tenant
    accepted only when nothing lower was available.
  choice_b: The invention of the elevator, however, was about to overturn this arrangement
    and make the highest floors the most desirable of all.
  choice_c: Buildings of this era were rarely more than five or six stories, and their
    stairways grew narrow and dim toward the top.
  choice_d: Wealthy tenants, of course, could afford to send servants up and down
    the stairs on their behalf, sparing themselves the climb.
  correct_answer: A
  explanation: 'The first paragraph builds a single idea: because climbing stairs
    was tiring, height was undesirable, so the upper floors were the cheapest and
    the wealthy took the lower ones. A closing sentence should distill that idea,
    and A does — it states the paragraph''s conclusion outright, that height was "not
    a prize but a penalty," gathering the preceding sentences into one point. B is
    well written but ends the paragraph on the reversal that the third paragraph exists
    to deliver; placing the turn here states the paragraph''s point nowhere and steals
    the later paragraph''s work. C adds a vivid but redundant detail — that buildings
    were five or six stories with dim stairways — which merely repeats what sentences
    2 and 4 already establish, capping the paragraph with more description instead
    of a conclusion. D introduces a genuinely new claim that undercuts the paragraph:
    if the wealthy sent servants up and down, then the climb was not a real burden
    to them, which contradicts the paragraph''s premise that the burden of height
    is exactly why they took the lower floors. Only A closes the paragraph by naming
    the idea the whole paragraph has been building toward.'
  distractor_types:
    B: wrong_logical_relation
    C: less_precise
    D: changes_meaning
