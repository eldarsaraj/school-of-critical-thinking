  question_text: A rectangular garden is 4 meters longer than it is wide. If the garden's
    length were doubled while its width stayed the same, the new perimeter would be
    64 meters. What is the original width of the garden, in meters?
  choice_a: '6'
  choice_b: '8'
  choice_c: '12'
  choice_d: '14'
  correct_answer: B
  explanation: 'Let the width be w, so the length is w + 4. Doubling the length gives
    2(w + 4), while the width stays w. The new perimeter is 2[2(w + 4) + w] = 6w +
    16, and setting that equal to 64 gives 6w = 48, so w = 8 meters. (Check: width
    8, length 12; doubling the length to 24 gives perimeter 2(24 + 8) = 64.) A doubles
    both dimensions, getting 8w + 16 = 64 and w = 6. D forgets to double the length,
    using the original 12 and getting 4w + 8 = 64, so w = 14. C solves correctly for
    w but reports the length, 12, instead of the width. Only 8 doubles just the length
    and answers for the width.'
