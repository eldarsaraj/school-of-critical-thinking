  question_type: multiple_choice
  skill: usage_agreement
  difficulty: hard
  topic: ''
  passage_group_id: ela_h_p1
  passage_title: The Vertical City
  passage_text: "(1) Before the middle of the nineteenth century, the height of a\
    \ building was limited less by how it could be constructed than by how far people\
    \ were willing to climb. (2) Stairs were tiring, and so the upper floors of a\
    \ tall building, being the hardest to reach, were the least desirable and rented\
    \ for the lowest prices. (3) The wealthy occupied the lower floors, while the\
    \ poorest tenants trudged up to cramped rooms beneath the roof. (4) A building\
    \ taller than five or six stories made little economic sense, since few tenants\
    \ would willingly climb so far.\r\n\r\n(5) The safety elevator changed this logic\
    \ entirely. (6) Elevators had existed for years, but they were used mainly to\
    \ haul freight, passengers feared them because a snapped cable meant a deadly\
    \ fall. (7) In 1853, an inventor named Elisha Otis introduced a device that would\
    \ catch a falling elevator car even if its cable broke. (8) Standing on a raised\
    \ platform before a crowd, the rope holding Otis's elevator was cut on purpose,\
    \ and the car dropped only a few inches before the safety brake seized and held\
    \ it. (9) The demonstration was theatrical, but it convinced a wary public that\
    \ an elevator could be trusted.\r\n(10) With a safe elevator, the value once attached\
    \ to height was turned completely upside down and reversed. (11) The top floors,\
    \ now reached in seconds and raised above the noise and grime of the street, became\
    \ the most sought-after in the building. (12) A view that had once been the burden\
    \ of the poor was now a luxury the wealthy would pay for. (13) Modern elevators\
    \ can reach remarkable speeds, the fastest of them rising at more than forty miles\
    \ per hour. (14) The design of these new towers, with their frames of steel and\
    \ their walls of glass, were unlike anything the city had seen before. (15) The\
    \ skyscraper, unimaginable without the elevator, climbed floor by floor into the\
    \ vertical city we know today."
  question_text: What is the best way to revise sentence 14?
  choice_a: The design of these new towers, with their frames of steel and their walls
    of glass, was unlike anything the city had seen before.
  choice_b: The designs of these new towers, with their frames of steel and their
    walls of glass, were unlike anything the city had seen before.
  choice_c: The design of these new towers, with their frames of steel and their walls
    of glass, were unlike anything the city had seen before.
  choice_d: These new towers, with their frames of steel and their walls of glass,
    were unlike anything the city had seen before.
  correct_answer: A
  explanation: 'The subject of sentence 14 is "The design," which is singular, so
    it needs the singular verb "was." The plural "were" is pulled in by the nearer
    nouns — "towers," "frames," "walls" — but none of those is the subject; the design
    is. A makes the one change the sentence needs, "were" to "was," and leaves everything
    else in place. B reaches agreement a different way, by pluralizing the subject
    to "designs … were," which is grammatical but alters the meaning: the sentence
    says the towers were unlike "anything" the city had seen, treating them as one
    new kind of design, and "designs … were" implies several separate designs instead.
    C looks like it might be the fix because it reproduces the sentence, but it changes
    nothing about the verb, so the plural "were" still clashes with the singular "design."
    D sidesteps the agreement problem by making "towers" the subject, which does match
    "were," but it quietly shifts the focus from the design of the towers to the towers
    themselves — and the paragraph''s point is about the design. Only A corrects the
    agreement while keeping "design" as the subject and the meaning unchanged.'
  distractor_types:
    B: changes_meaning
    C: misattributed_error_location
    D: changes_meaning
