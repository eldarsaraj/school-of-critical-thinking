  question_text: "Read this sentence. \r\n\r\n\"The teacher handed back the essays\
    \ to the students covered in red corrections.\" \r\n\r\nHow should this sentence\
    \ be revised?"
  choice_a: The teacher handed back to the students the essays that had been covered
    in red corrections.
  choice_b: The teacher handed the essays back to the students covered in red corrections.
  choice_c: The teacher handed back the essays covered in red corrections to the students.
  choice_d: The teacher handed back the essays to the students, who were covered in
    red corrections.
  correct_answer: C
  explanation: 'The phrase "covered in red corrections" describes the essays, but
    at the end of the original sentence it sits next to "the students," so the sentence
    seems to say the students are covered in corrections. The best repair moves the
    phrase beside the noun it modifies, and C does this cleanly and directly: "the
    essays covered in red corrections." A relocates the phrase correctly too, and
    its meaning is clear, but it takes a roundabout, heavier route — "handed back
    to the students the essays that had been covered …" — where the plain version
    reads better. B looks like a fix because it shuffles "handed back" into "handed
    … back," but that leaves "covered in red corrections" exactly where it was, still
    stranded beside "students," so the modifier remains misplaced. D removes the ambiguity
    in the wrong direction: turning the phrase into the clause "who were covered in
    red corrections" attaches it firmly to the students, committing the sentence to
    the very meaning the placement got wrong. Only C puts the description beside the
    essays without adding bulk or fixing the wrong noun.'
