- section: ELA
  stage: easy_module
  question_number: 1
  question_type: multiple_choice
  skill: sentence_structure
  difficulty: easy
  topic: ''
  passage_group_id: ela_e_re
  passage_title: More Than Books
  passage_text: (1) To most people, a public library is simply a quiet building full
    of books. (2) In recent years, however, many libraries have quietly reinvented
    what they offer. (3) A growing number of branches now lend far more than printed
    books. (4) At some libraries, a visitor can borrow hand tools, board games, or
    even cake pans. (5) Other branches offer free passes to local museums. (6) Still
    others have built small recording studios where patrons produce music and podcasts.
    (7) These new services are popular, the demand for them often exceeds what a single
    branch can supply. (8) Many libraries have become places to learn practical skills.
    (9) On a given afternoon, a patron might take a free class in coding, writing
    a résumé, or how to manage a budget. (10) These classes are offered at no charge
    so they reach people who could not otherwise pay for such training. (11) The library
    also does a great many other helpful things for the community. (12) Even today,
    many visitors love the hushed, peaceful feeling of a quiet reading room. (13)
    For all of these reasons, today's library is far more than a place to borrow a
    good book.
  question_text: Which revision of sentence 7 best corrects the error in sentence
    structure while preserving the relationship between the two ideas?
  choice_a: Although these new services are popular, the demand for them often exceeds
    what a single branch can supply.
  choice_b: These new services are so popular that the demand for them often exceeds
    what a single branch can supply.
  choice_c: Because the demand for them often exceeds what a single branch can supply,
    these new services are popular.
  choice_d: These new services are popular, and the demand for them, often exceeds
    what a single branch can supply.
  correct_answer: B
  explanation: 'B fixes the splice with "so… that," which keeps the original logic
    — popularity is the cause, high demand the result. A and C are both grammatical
    and both remove the run-on, so neither can be eliminated on sight: A''s "although"
    inserts a contrast that isn''t there, and C''s "because" points the causation
    backward. D reads like a clean coordinated revision, but the comma after "them"
    severs the subject ("the demand for them") from its verb ("exceeds").'
  distractor_types:
    A: wrong_logical_relation
    C: wrong_logical_relation
    D: overcorrection
- section: ELA
  stage: easy_module
  question_number: 2
  question_type: multiple_choice
  skill: usage_agreement
  difficulty: medium
  topic: ''
  passage_group_id: ela_e_re
  passage_title: More Than Books
  passage_text: (1) To most people, a public library is simply a quiet building full
    of books. (2) In recent years, however, many libraries have quietly reinvented
    what they offer. (3) A growing number of branches now lend far more than printed
    books. (4) At some libraries, a visitor can borrow hand tools, board games, or
    even cake pans. (5) Other branches offer free passes to local museums. (6) Still
    others have built small recording studios where patrons produce music and podcasts.
    (7) These new services are popular, the demand for them often exceeds what a single
    branch can supply. (8) Many libraries have become places to learn practical skills.
    (9) On a given afternoon, a patron might take a free class in coding, writing
    a résumé, or how to manage a budget. (10) These classes are offered at no charge
    so they reach people who could not otherwise pay for such training. (11) The library
    also does a great many other helpful things for the community. (12) Even today,
    many visitors love the hushed, peaceful feeling of a quiet reading room. (13)
    For all of these reasons, today's library is far more than a place to borrow a
