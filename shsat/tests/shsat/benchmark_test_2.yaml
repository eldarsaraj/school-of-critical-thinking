  question_text: The passage discusses the herder who "resolves to add no further
    animals" mainly to show that
  choice_a: even a herder who restrains himself is acting wisely, since he at least
    avoids contributing further to the pasture's decline.
  choice_b: the problem is not caused by greed, because the same ruinous logic grips
    even the herder who wishes to do right.
  choice_c: if enough herders followed this one's example and showed restraint, the
    pasture could be saved from destruction.
  choice_d: the conscientious herder is ultimately treated unfairly, bearing a sacrifice
    while his grasping neighbors enjoy the reward.
  correct_answer: B
  explanation: 'This is the passage''s most careful move. Having raised the obvious
    objection — surely the answer is just for herders to be less greedy — the passage
    tests it by imagining a herder who already is not greedy, one who "wishes to do
    right" and stops adding animals. The point of the example is that it changes nothing:
    his neighbors keep enlarging their herds, the pasture is exhausted anyway, and
    his restraint may even leave more grass for them, so his sacrifice "quietly subsidizes
    their gain." If the conscientious herder is caught in the same ruin as the grasping
