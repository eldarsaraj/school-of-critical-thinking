  correct_answer: D
  explanation: 'The passage argues one thing across its paragraphs: the safe elevator
    reversed the value of height, turning the top floors from the cheapest space into
    the most prized. Sentence 13 steps outside that argument. How fast modern elevators
    travel — more than forty miles per hour — is a fact about present-day engineering,
    not about the nineteenth-century reversal the passage is tracing, and removing
    it costs the argument nothing. The other three only look removable. Sentence 3
    establishes the original order, the wealthy below and the poor in the attic, which
    is the very arrangement the passage later inverts; without it, the reversal in
    sentence 12 has nothing to reverse. Sentence 9 gives the outcome of Otis''s demonstration
    — that it convinced a wary public; without it, the dramatic rope-cutting leads
