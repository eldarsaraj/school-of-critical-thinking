    \ animals. His restraint, taken by itself, accomplishes nothing: his neighbors\
    \ continue to enlarge their herds, the pasture is exhausted regardless, and he\
    \ has earned only the distinction of having profited less from the ruin than they\
    \ did. Worse, his forbearance may merely leave additional grass for his neighbors'\
