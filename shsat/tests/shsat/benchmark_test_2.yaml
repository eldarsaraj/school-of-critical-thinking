  question_text: "Read this sentence. \r\n\r\n\"The principal, along with several\
    \ teachers, were invited to speak at the ceremony.\" \r\n\r\nWhat is the best\
    \ way to revise it?"
  choice_a: The principal and several teachers were invited to speak at the ceremony.
  choice_b: The principal, along with several teachers, were asked to speak at the
    ceremony.
  choice_c: The principal, along with several teachers, was invited to speak at the
    ceremony.
  choice_d: The principal, along with several teachers, will be invited to speak at
    the ceremony.
  correct_answer: C
  explanation: 'The subject of the sentence is "The principal," which is singular
    and takes the singular verb "was." The phrase "along with several teachers" names
    companions but does not join them to the subject the way "and" would, so the subject
    stays singular — the plural "were" is pulled in only by the nearby "teachers."
    C makes the one change the sentence needs, "were" to "was," and alters nothing
    else. A reaches agreement a different way, by turning the sentence into a true
    compound subject, "The principal and several teachers … were," which is grammatically
    correct — but it changes the meaning, since "along with several teachers" presents
    the principal as the main figure the teachers accompany, while "The principal
    and several teachers" makes them equal co-invitees. B swaps "invited" for "asked,"
    which looks like an edit but changes the wrong thing: the verb is still "were,"
    so it still disagrees with the singular subject. D reads correctly and fixes the
    agreement by recasting the verb as "will be invited," but in doing so it shifts
    the time of the event from the past, when they were invited, into the future,
    when they have not yet been. Only C corrects the agreement while keeping the subject,
    the meaning, and the tense intact.'
  distractor_types:
    A: changes_meaning
    B: misattributed_error_location
    D: changes_meaning
- section: ELA
  stage: hard_module
  question_number: 10
  question_type: multiple_choice
  skill: main_idea
  difficulty: hard
  topic: ''
  passage_group_id: ela_h_p1
  passage_title: Where Beauty Lies
  passage_text: "Few judgments feel more immediate than the judgment that something\
    \ is beautiful. We stand before a painting, a coastline, or a face, and the sense\
    \ of its beauty arrives at once, seemingly without reasoning, as though we were\
    \ simply registering a quality the thing possesses, the way we register its color\
    \ or its size. Yet this very immediacy conceals a question that has occupied thinkers\
    \ for centuries: when we call something beautiful, are we describing the object\
    \ before us, or are we describing something that happens within ourselves?\r\n\
    \r\nThe first view holds that beauty is a property of the object, as real as its\
    \ dimensions. On this account, a particular arrangement of features, certain proportions,\
    \ symmetries, and harmonies, simply is beautiful, and a person who fails to see\
    \ it has missed something genuinely present, much as a person who cannot hear\
    \ a note that is sounding has failed to perceive a fact about the world. This\
    \ position has an obvious appeal. It explains why people so often agree in their\
    \ judgments, why certain faces, landscapes, and melodies are admired across vastly\
    \ different cultures and eras. A simple musical octave, two notes an exact distance\
    \ apart, sounds consonant to nearly every ear that hears it, in every land and\
    \ every century. Faces judged attractive in one part of the world tend to be judged\
    \ so in others, despite the differences of custom that divide those places in\
    \ almost everything else. If beauty were merely a private reaction, the reasoning\
    \ goes, such agreement would be an unaccountable coincidence; far simpler to suppose\
    \ that these things are admired because they are, in fact, beautiful.\r\n\r\n\
    The second view turns this reasoning on its head. Beauty, it argues, is not in\
    \ the object at all but in the response of the perceiver, a feeling of a certain\
    \ kind that arises in us when we encounter particular things. On this account,\
    \ to call an object beautiful is not to report a feature it carries independently\
    \ of us, but to report the effect it produces in a mind disposed to be affected.\
    \ The proportions of a face do not contain beauty the way they contain angles;\
    \ rather, they reliably produce, in creatures constituted as we are, a distinctive\
    \ pleasure, and it is that pleasure we are naming when we speak of beauty. The\
    \ same dish that delights one diner sickens another; the same song that moves\
    \ one listener bores a second. Nothing in the food or the music has changed from\
    \ one case to the next. What differs is the person, and if the judgment tracks\
    \ the person rather than the thing, then the judgment must be a report about the\
    \ person's response.\r\n\r\nThe strongest evidence for the second view is the\
    \ very thing the first view struggled to dismiss as coincidence: disagreement.\
    \ For all the cases in which people concur, there are countless others in which\
    \ they do not. What one age finds beautiful, another finds grotesque; what delights\
    \ one person leaves another cold. If beauty were a property residing in the object,\
    \ such variation would be hard to explain, no less puzzling than if observers\
    \ disagreed about an object's weight. But if beauty is a response, variation is\
    \ exactly what we should expect, for responses depend on the perceiver as much\
    \ as on the thing perceived, and perceivers differ, across cultures, across histories,\
    \ across individual temperaments. Consider how the very name of a style can carry\
    \ an old insult. A kind of soaring, intricate architecture that a later age came\
    \ to treasure was first called barbarous by those who preferred the calm proportions\
    \ of an earlier taste, and the label meant as scorn still clings to it today.\
    \ The buildings did not change; the eyes that judged them did.\r\n\r\nYet the\
    \ second view faces a difficulty of its own, one that returns us to where we began.\
    \ If beauty is purely a matter of private response, then no judgment of beauty\
    \ can be mistaken, and no one's taste can be better than anyone else's, since\
    \ each person merely reports the feeling they happen to have. This conclusion\
    \ sits uneasily with the way we actually talk and think. We do argue about beauty;\
    \ we try to bring others to see what they have missed; we believe that taste can\
    \ be cultivated, that some judgments are more discerning than others. A child\
    \ rarely savors the bitter flavors that adults prize; a difficult piece of music\
    \ can baffle on first hearing and reward on the tenth. We treat these as cases\
    \ of learning to perceive what is already there, not merely of changing what we\
    \ happen to like. A view that makes all of this incoherent has surely left something\
    \ out.\r\n\r\nPerhaps, then, the truth lies in neither view alone. The agreement\
    \ that supports the first view and the disagreement that supports the second are\
    \ both real, and a complete account must honor each. It may be that beauty arises\
    \ only in the meeting of a certain kind of object with a certain kind of perceiver,\
    \ so that it belongs entirely to neither but emerges from their encounter, as\
    \ a spark belongs to neither the flint nor the steel but to the striking of one\
    \ against the other. Such a view would explain the agreement, since perceivers\
    \ like us, sharing a common nature, are often moved by the same things; and it\
    \ would explain the disagreement too, since that common nature is crossed by all\
    \ the differences of culture and temperament that set one perceiver apart from\
    \ the next."
  question_text: Which statement best expresses the central idea of the passage?
  choice_a: Beauty is partly a real property of the object and partly a response in
    the perceiver, each of the two opposing views having captured one of its halves.
  choice_b: Because each view rests on evidence the other cannot explain away, the
    question of where beauty lies finally has no answer.
  choice_c: Beauty is not contained in a thing or held in a mind, but comes into being
    only when the right sort of thing acts upon the right sort of viewer.
  choice_d: Beauty is the distinctive pleasure that certain objects reliably produce
    in minds like ours, and so it depends on both.
  correct_answer: C
  explanation: 'By the final paragraph the passage has set up two views and shown
    each to be incomplete, and it closes not by picking one but by proposing a third:
    beauty "belongs entirely to neither" the object nor the response "but emerges
    from their encounter," like a spark that belongs to neither the flint nor the
    steel but to the striking of one against the other. The central idea is that relational
    claim — beauty as something that exists not inside the object and not inside the
    perceiver, but only when the two come together. C states exactly that, in its
    own words: beauty is neither contained in a thing nor held in a mind, but comes
    into being only when the right sort of thing acts upon the right sort of viewer.
    The other three are all close, because each grants that both the object and the
    perceiver matter; the work is in seeing how each falls short. A treats beauty
    as split down the middle, partly a property and partly a response, as though each
    view owned one half — but the flint-and-steel image denies exactly this, locating
    beauty in the striking itself, the relation rather than a sum of parts. B reads
    the standoff as permanent, concluding that because each side has evidence, the
    question can never be settled; yet the passage does settle it, offering the encounter
    as its answer. D is the subtlest miss: it says beauty is the pleasure certain
    objects produce in minds like ours, which sounds like a synthesis because it names
    both object and mind — but this is the second view restated, with beauty still
    located in the perceiver''s response and the object reduced to a mere trigger.
    The passage''s synthesis refuses to place beauty in either one. Only C locates
    beauty where the passage finally does: in the coming-together that belongs to
    neither side alone.'
  distractor_types:
    A: partly_true_but_wrong
    B: wrong_concept
    D: partly_true_but_wrong
