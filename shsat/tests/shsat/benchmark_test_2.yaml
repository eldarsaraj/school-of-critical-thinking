  question_text: At a station, one train departs every 12 minutes and another departs
    every 18 minutes. Both depart together at 9:00 a.m. How many minutes after 9:00
    a.m. will the two trains next depart together?
  choice_a: '6'
  choice_b: '18'
  choice_c: '30'
  choice_d: '36'
  correct_answer: D
  explanation: The two trains depart together whenever the number of minutes is a
    multiple of both 12 and 18, so the next time they coincide is the least common
    multiple of 12 and 18. The multiples of 12 are 12, 24, 36, …; the multiples of
    18 are 18, 36, …; the smallest they share is 36, so the trains next depart together
    36 minutes after 9:00. A is the greatest common factor of 12 and 18 rather than
    the least common multiple, which answers a different question. B assumes the trains
    meet every 18 minutes, but at 18 minutes the first train — which leaves at 12,
    24, and 36 — has not departed, so they do not coincide. C adds the two intervals
    to get 30, yet 30 is a multiple of neither number, so neither train departs then.
    Only 36 is a moment when both trains depart at once.
