    \ even proper, to let a private railroad company announce what time it was. For\
    \ a while, certain towns stubbornly kept two clocks side by side, one set to the\
    \ railroad's standard and the other to the older, local reckoning, as if reluctant\
    \ to choose between them.\r\n\r\nIn the end, the convenience proved too useful\
    \ to refuse. As more and more of ordinary life came to depend on travel and communication\
    \ that reached across long distances, a shared clock ceased to be a railroad's\
    \ private preference and became something closer to a public necessity. Governments\
    \ eventually wrote the railroads' zones into law, transforming standard time from\
    \ a corporate arrangement into an official one. The older sense of time, anchored\
    \ to the sun above one particular place, did not so much disappear as recede into\
    \ the background, recalled mainly on the rare occasion when a garden sundial is\
