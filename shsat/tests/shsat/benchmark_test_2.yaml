  question_text: The passage states that near a certain density the system becomes
    "fragile, primed to turn a trivial disturbance into a complete standstill." This
    happens mainly because
  choice_a: the road is now carrying more cars than it can physically hold, so it
    can no longer keep all of them moving.
  choice_b: the shrinking gaps give each driver less time to react to the car ahead,
    so reactions arrive too late to prevent a stop.
  choice_c: the cars are tailgating one another, following so closely and carelessly
    that any slowdown forces a chain of hard braking.
  choice_d: the cars sit too close to leave room to absorb a slowdown, so a small
    disturbance amplifies instead of fading.
  correct_answer: D
  explanation: 'The passage is precise about what changes when a road fills up. It
    is not that the road runs out of physical space — the text says plainly that the
    road "does not need more cars than it can physically hold." What disappears is
    the cushion: when cars are packed close, a driver who slows even slightly leaves
    no room for the car behind to adjust gently, so that car must brake, the next
    must brake harder, and the small slowdown amplifies rather than dying out. D describes
    that. A reaches for the intuitive explanation — too many cars for the road — but
    that is the very reading the passage rules out; tight spacing, not overload, is
