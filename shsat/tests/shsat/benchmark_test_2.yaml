    \ is a question, not yet an answer, and an idea that cannot say how it works is\
    \ fairly held to a higher standard of doubt. What Wegener lacked was not insight\
    \ but the missing half of an explanation, the part that would not be found until\
    \ others, building on his clues, discovered the force he could not. The continents\
    \ had been drifting all along; it simply took the world a long while to learn\
    \ how."
  question_text: The detail that the small reptile "lived in fresh water" is important
    to Wegener's argument because it
  choice_a: rules out the reptile's having swum between the continents, so its presence
    on both is hard to explain unless the lands were joined.
  choice_b: shows that the reptile was a delicate creature, unlikely to have survived
    the harsh conditions of an ancient ocean crossing.
  choice_c: proves the reptile lived at a time before the Atlantic Ocean had formed
    between the two continents.
  choice_d: demonstrates that the same fresh water once flowed across both continents,
    linking their rivers and lakes into one system.
  correct_answer: A
  explanation: 'The force of the example depends entirely on the words "fresh water."
    A creature that lives in fresh water cannot survive a long journey through a salty
    ocean, so it could not have swum from one continent to the other. That closes
    off the easy explanation — the animal simply crossed the water — and leaves the
    hard one: the same reptile turns up on both sides because the two lands were once
    joined, and it lived across a single connected region before they split. A states
    that. B reads "fresh water" as a sign the reptile was generally delicate and would
    not have survived a rough crossing; but the passage''s point is precise — the
    obstacle is salt water itself, not the hardship of the trip, and even a hardy
    freshwater animal could not make it. C says the fossil proves the reptile lived
    before the Atlantic formed; the fossil does suggest a past connection, but by
    itself it dates nothing, so "proves" the timing claims more than the detail can
    carry. D imagines the same fresh water flowing across both continents and linking
    their waterways, a shared river system the passage never describes; the clue is
    where the animal was found, not any water moving between the lands. Only A uses
    the detail as Wegener does: salt water is a barrier a freshwater creature cannot
    cross, so its presence on both shores points to lands once connected.'
  distractor_types:
    B: misidentified_detail
    C: inference_leap
    D: wrong_concept
- section: ELA
  stage: routing
  question_number: 29
  question_type: multiple_choice
  skill: authors_craft
  difficulty: medium
  topic: ''
  passage_group_id: ela_r_p3
  passage_title: An Idea Ahead of Its Engine
  passage_text: "Look at a world map, and a curious thing stands out. The eastern\
    \ coast of South America and the western coast of Africa appear as though they\
    \ would fit together, like two pieces of a torn sheet of paper. The bulge of Brazil\
    \ tucks neatly into the hollow beneath the western edge of Africa, and other coastlines\
    \ too seem to echo one another across the water, their bays and headlands roughly\
    \ aligned. For centuries, mapmakers and sailors noticed this odd correspondence,\
    \ but most dismissed it as a coincidence. Surely two continents separated by a\
    \ vast ocean could have nothing to do with each other.\r\n\r\nIn the early twentieth\
    \ century, a German scientist named Alfred Wegener took the resemblance seriously.\
    \ He proposed something that struck most of his colleagues as absurd: that the\
    \ continents had once been joined together in a single great landmass, and had\
    \ slowly drifted apart over millions of years to their present positions. The\
    \ matching coastlines, he argued, were not a coincidence at all. They fit because\
    \ they had once been a single edge, later torn in two.\r\n\r\nWegener gathered\
    \ evidence from more than the shape of the coasts. He pointed to fossils of the\
    \ same extinct plants and animals found on both sides of the Atlantic, in places\
    \ now thousands of miles apart. How could identical creatures have lived on two\
    \ separate continents, with an entire ocean between them, unless those lands had\
    \ once been connected? One small reptile, a creature that lived in fresh water\
    \ and could not possibly have survived a long swim through a salty ocean, turned\
    \ up preserved in rocks on both continents, an oddity nearly impossible to explain\
    \ if the two lands had always stood apart. He noted matching rock formations as\
    \ well, mountain ranges that seemed to begin on one continent and continue on\
    \ another, as if a single range had been split and its halves carried away.\r\n\
    Yet for all the evidence he assembled, most scientists rejected Wegener's idea\
    \ for decades. The reason was not that his evidence was weak, but that he could\
    \ not explain how the continents moved. What force could possibly push a continent,\
    \ an unimaginably massive slab of rock, across the surface of the earth? Wegener\
    \ offered a few mechanisms, but none was convincing. He suggested that the continents\
    \ somehow plowed through the solid floor of the ocean, drifting forward like ships\
    \ through water. But physicists objected that no known force could push so much\
    \ rock that way, and that the hard ocean floor would have shattered any continent\
    \ that tried. Without a believable cause, his fellow scientists found the whole\
    \ notion easy to set aside. A pile of suggestive clues, they felt, was not enough;\
    \ an explanation needed a working engine, and Wegener had none to offer.\r\n\r\
    \nThe answer came only after Wegener's death. In the decades that followed, scientists\
    \ studying the floor of the ocean made a startling discovery: the seafloor itself\
    \ was spreading. Along great ridges beneath the sea, molten rock was rising from\
    \ within the earth, hardening into new stone, and pushing the older ocean floor\
    \ steadily outward on either side. The evidence came from careful mapping of those\
    \ ridges and of the magnetic patterns frozen into the rock, which recorded the\
    \ slow widening of the sea over time. Here, at last, was the engine. The continents\
    \ did not plow through the ocean floor, as Wegener had pictured; instead, they\
    \ rode atop vast plates of the earth's crust, carried along as those plates slowly\
    \ moved. The clues Wegener had collected suddenly made sense, drawn together by\
    \ a mechanism he had never found.\r\n\r\nWegener's story is often told as a tale\
    \ of a lone genius proved right, but it is also something more instructive. His\
    \ critics were not foolish to demand a mechanism; in science, a striking pattern\
    \ is a question, not yet an answer, and an idea that cannot say how it works is\
    \ fairly held to a higher standard of doubt. What Wegener lacked was not insight\
    \ but the missing half of an explanation, the part that would not be found until\
    \ others, building on his clues, discovered the force he could not. The continents\
    \ had been drifting all along; it simply took the world a long while to learn\
    \ how."
  question_text: The final paragraph mainly serves to
  choice_a: affirm the lone-genius story, crediting Wegener's lone insight for an
    idea his contemporaries were too cautious to accept.
  choice_b: set the lone-genius story aside in favor of recounting how later scientists
    found the mechanism Wegener never could.
  choice_c: extend the lone-genius story into a warning that bold thinkers like Wegener
    are too often dismissed in their own time.
  choice_d: temper the lone-genius story by showing that the resistance Wegener faced
    was a reasonable demand, not mere blindness.
  correct_answer: D
  explanation: 'The paragraph names the expected story — the lone genius proved right
    — and then turns away from it: "but it is also something more instructive." The
    instruction is a defense of the critics, who "were not foolish to demand a mechanism,"
    since in science a striking pattern is only a question until something explains
    it. So the paragraph tempers the lone-genius tale by recasting the resistance
    as a reasonable demand rather than blindness, which is D. A keeps the lone-genius
    framing intact, crediting Wegener''s insight and faulting his contemporaries''
    caution — but the paragraph calls that caution reasonable, not a failing, so it
    does not affirm this version. B is right that the paragraph moves past the lone-genius
    story, and it is tempting for that reason, but what replaces the story is a lesson
    about evidence and mechanism, not a retelling of which later scientists found
    the cause. C extends the story into a warning that visionaries are too often dismissed,
    which is nearly the reverse of the paragraph''s point: it defends the doubt Wegener
    met instead of cautioning against it. Only D captures what the paragraph does
    with the familiar tale — not affirm it, not merely drop it, not invert it, but
    qualify it by granting the critics their reason.'
  distractor_types:
    A: wrong_concept
    B: misidentified_detail
    C: partly_true_but_wrong
