  passage_title: The Logic of the Commons
  passage_text: "Imagine a pasture open to all the herders of a village, a stretch\
    \ of common ground on which anyone may graze as many animals as he pleases. For\
    \ a time the arrangement works well enough: the grass is plentiful, the herds\
    \ are modest, and the land easily supports them. The difficulty appears only as\
    \ the village prospers and the herds begin to grow, and it is a difficulty of\
    \ a peculiar kind, for it arises not from any failing of the herders but from\
    \ the very logic of their situation, a logic that drives sensible people, each\
    \ acting reasonably, toward an outcome that ruins them all.\r\n\r\nConsider the\
    \ calculation facing a single herder who is weighing whether to add one more animal\
    \ to his herd. The benefit of doing so is clear and entirely his own: one more\
    \ animal is one more animal to sell, and the whole of that gain falls to him.\
    \ The cost is just as real but of a different character, for the additional grazing\
    \ wears upon a pasture shared by everyone, and that burden is divided among all\
    \ the herders alike. The herder thus collects the entire benefit while bearing\
    \ only a fraction of the cost. To him the arithmetic is plain: the advantage of\
    \ adding an animal outweighs his small share of the resulting damage, and so he\
    \ adds it. There is nothing foolish in his reasoning; given the situation he occupies,\
    \ it is precisely the sensible thing to do.\r\nThe tragedy is that every herder\
    \ reasons in the same way, and reasons correctly. Each, finding his private gain\
    \ greater than his portion of the shared loss, adds another animal, and then another,\
    \ and the combined herd swells beyond anything the pasture can sustain. The grass,\
    \ cropped faster than it can recover, thins and fails; the common ground hardens\
    \ into mud and dust; and the animals that once depended upon it grow lean and\
    \ perish. In the end every herder is poorer than before, the resource that sustained\
    \ them all consumed by the accumulated weight of decisions each of which, considered\
    \ on its own, was entirely reasonable. What destroys the commons is not a single\
    \ villain but the sum of a hundred sensible choices.\r\n\r\nIt is tempting to\
    \ read this as a plain tale of greed, and to imagine that the remedy is for the\
    \ herders to school themselves to want less. But this mistakes the nature of the\
    \ problem, for the trap closes even upon the herder who wishes to do right. Suppose\
    \ one herder, troubled by the mounting destruction, resolves to add no further\
    \ animals. His restraint, taken by itself, accomplishes nothing: his neighbors\
    \ continue to enlarge their herds, the pasture is exhausted regardless, and he\
    \ has earned only the distinction of having profited less from the ruin than they\
    \ did. Worse, his forbearance may merely leave additional grass for his neighbors'\
    \ animals to consume, so that his sacrifice quietly subsidizes their gain. A conscientious\
    \ herder, in short, confronts the same merciless logic as a grasping one; the\
    \ structure of the situation penalizes restraint and rewards consumption, whatever\
    \ the character of the person caught within it.\r\n\r\nThis is why appeals to\
    \ conscience, however sincere, seldom rescue a commons. The fault lies not in\
    \ the herders but in the arrangement, in the mismatch between who enjoys the benefit\
    \ of drawing upon the resource and who absorbs the cost. To alter the outcome,\
    \ one must alter that arrangement, and history records broadly two means of doing\
    \ so. The resource may be parceled into private holdings, so that each herder\
    \ owns his share and bears the full cost of overusing what is now his alone; a\
    \ man does not strip his own field bare, because the loss would fall upon him\
    \ entirely. Or the community may fix rules upon the common land, limiting by agreement\
    \ the number of animals each may graze and binding all to a discipline that none\
    \ could afford to practice in isolation. Either path works not by rendering people\
    \ more virtuous but by aligning the cost of a choice with its benefit, so that\
    \ what is sensible for each is no longer ruinous for all.\r\n\r\nThe pasture is\
    \ merely the clearest instance of a pattern that emerges wherever a benefit is\
    \ gathered into private hands while its cost is dispersed across a shared domain.\
