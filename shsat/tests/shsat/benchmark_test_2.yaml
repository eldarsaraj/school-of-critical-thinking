  question_text: What is the best way to revise sentence 10?
  choice_a: With a safe elevator, the value once attached to height was changed.
  choice_b: With a safe elevator, the value once attached to height was reversed.
  choice_c: With a safe elevator, the value once attached to height was turned completely
    upside down.
  choice_d: With a safe elevator, the value once attached to height was now completely
