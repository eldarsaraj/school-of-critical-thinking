  question_text: What is the best way to revise sentence 8?
  choice_a: Standing on a raised platform before a crowd, the rope holding Otis's
    elevator was deliberately cut, and the car dropped only a few inches before the
    safety brake seized and held it.
  choice_b: Standing on a raised platform before a crowd, Otis had the rope holding
