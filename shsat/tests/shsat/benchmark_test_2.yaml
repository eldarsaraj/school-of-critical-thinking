  choice_b: The two integers are both odd.
  choice_c: The difference of the two integers is even.
  choice_d: The two integers are both even.
  correct_answer: A
  explanation: If the sum of two integers is odd, the two integers cannot share the
    same parity — one must be even and the other odd, since odd + odd and even + even
    both give an even sum. It follows that the product must be even, because any product
    that includes an even factor is even. So A must be true. B and D each claim the
    integers share a parity, but if both were odd (B) or both were even (D), the sum
    would be even, contradicting the given. C claims the difference is even, but with
    one even and one odd integer the difference is even − odd = odd — the difference
    is actually odd, just like the sum. Only the product being even must hold.
