  question_text: The author compares beauty to "a spark" from flint and steel mainly
    to make the point that beauty
  choice_a: appears suddenly and briefly, the way a struck spark flares for only an
    instant before it dies.
  choice_b: is not found in either the object or the perceiver alone but is produced
    only when the two come together.
  choice_c: results from a kind of friction or clash between the object and the perceiver,
    who resist each other before beauty is struck.
  choice_d: depends more on the perceiver than the object, just as the steel, not
    the flint, is the harder and more active part.
  correct_answer: B
  explanation: 'The image is chosen for one reason above all: a spark is not hiding
    inside the flint, waiting to be released, nor inside the steel; it exists only
    when the two are struck together. The author uses that to capture the view of
    beauty just proposed — beauty is not in the object by itself and not in the perceiver
    by itself, but comes into being only in their meeting. B states that. A picks
    out a true feature of sparks, that they flare and vanish quickly, but the passage
    is not making a point about beauty being fleeting; it draws on where the spark
    comes from, not how long it lasts. C reads "striking" as a clash, imagining the
    object and perceiver resisting each other until beauty is forced out; but the
    image is about two things combining to create something neither contains alone,
    not about conflict between them. D tries to weight the metaphor toward the perceiver,
    casting the steel as the harder, more active partner, but the whole point of the
    comparison is that the spark belongs to neither piece — it does not credit one
    side over the other. Only B reads the spark as the passage means it: something
    that exists only in the coming-together of the two.'
