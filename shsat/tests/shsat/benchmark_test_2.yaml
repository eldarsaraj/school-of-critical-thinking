  passage_title: The River's Name
  passage_text: "All its life it had a name,\r\nspoken by the towns it passed,\r\n\
    inked along the maps, and called\r\ndown from the bridges by the children\r\n\
    who let fall their leaves and watched them go.\r\nIt knew its banks the way a\
    \ hand\r\nknows the shape of what it holds;\r\nIt held its course, and the course\
    \ held it—\r\na single silver thought\r\nthreading the long green argument of\
    \ the hills.\r\nBut the land flattens at the end.\r\nThe banks let go. The water,\
    \ slowing,\r\nspreads itself thin as a breath\r\nlong held and then released,\
    \ forgetting,\r\nmile by slow mile, the trick of being narrow.\r\nAhead lies no\
    \ shape, no shore it knows—\r\nonly the gray and level shining\r\nof the sea,\
    \ which keeps no name\r\nbecause it needs none, being all\r\nthe rivers that have\
    \ ever arrived.\r\nAnd the river, at the last,\r\ndoes not so much end as widen\r\
    \npast the very use of ending,\r\nlosing the name that it had carried\r\nthe way\
    \ a voice is lost in singing—\r\nnot silenced, but joined."
  question_text: Which statement best expresses a central idea of the poem?
  choice_a: The poem is an elegy for the river's slow disappearance, mourning the
    loss of something that once had a name and its own course.
  choice_b: The poem shows that everything, no matter how distinct or sure of itself,
    must in the end dissolve and pass away.
  choice_c: The river's ending is less a loss than a merging—it surrenders its name
    but is taken up into something vast, not destroyed.
  choice_d: The river's long journey ends in triumph, arriving at last at the great
    destination it had been traveling toward all along.
  correct_answer: C
  explanation: 'The poem describes a river reaching the sea, and everything in its
    final movement could look like loss: the banks "let go," the water forgets "the
    trick of being narrow," and the river loses "the name that it had carried." But
    the poem keeps refusing that reading at the very moments it invites it. The river
    "does not so much end as widen / past the very use of ending"; the sea it enters
    holds "all / the rivers that have ever arrived"; and the closing simile is decisive
    — losing the name is like a voice "lost in singing," which the final line defines
    as "not silenced, but joined." So the ending is a merging: the river surrenders
    its separate identity but is absorbed into something larger rather than destroyed.
    C says this. A reads only the first half, taking the poem as an elegy that mourns
    the river''s disappearance; the loss imagery is real, but the poem answers it,
    recasting the loss as a joining, so "mourning" stops short of where the poem goes.
    B widens the loss into a general law — that everything distinct must finally dissolve
    — but that is the reading the poem works hardest to overturn, insisting the river
    moves "past the very use of ending" rather than simply ending. D swings to the
    opposite extreme, hearing triumph and a glorious arrival; yet the tone is quiet
    and the cost is real — the river does give up its name, its banks, its course
    — so "triumph" overstates what the restrained language supports. Only C holds
    both of the poem''s truths at once: a genuine surrender, and a joining that is
    more than loss.'
  distractor_types:
    A: partly_true_but_wrong
    B: wrong_concept
    D: inference_leap
