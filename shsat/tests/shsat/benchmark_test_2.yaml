    \ dependable now."
  question_text: The passage's account of the resistance to standard time — the newspaper
    debates and the towns that kept two clocks — most strongly suggests that
  choice_a: the few minutes between railroad time and local time were enough to disrupt
    people's daily routines and schedules.
  choice_b: people preferred to abandon fixed clock time, trusting the rhythms of
    sunrise and sunset instead.
  choice_c: people disliked that the railroads had drawn the zone boundaries to favor
    big cities and rail hubs.
  choice_d: the complaint was less about the lost minutes than about a distant power
    claiming the right to define time.
  correct_answer: D
  explanation: 'The passage is careful to say the discrepancy itself was small — the
    kind of gap that "made little difference" to ordinary life. So the resistance
    it describes can''t really be about practical disruption. What the text points
    to instead is what the change represented: surrendering "a small piece of local
    identity," and letting "a private railroad company announce what time it was."
