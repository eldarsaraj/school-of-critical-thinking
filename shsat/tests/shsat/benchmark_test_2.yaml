  question_text: The sum of three consecutive even integers is 48. What is the largest
    of the three integers?
  choice_a: '14'
  choice_b: '16'
  choice_c: '18'
  choice_d: '20'
  correct_answer: C
  explanation: 'Three consecutive even integers can be written as x, x + 2, and x
    + 4. Their sum is x + (x + 2) + (x + 4) = 3x + 6, and setting that equal to 48
    gives 3x + 6 = 48, so 3x = 42 and x = 14. The three integers are 14, 16, and 18,
    and the largest is 18. A is the smallest of the three, not the largest the question
    asks for. B comes from dividing 48 by 3 to get 16, which is the middle integer
    rather than the largest. D comes from forgetting the +2 and +4 when setting up
    the equation: solving 3x = 48 gives 16, leading to 16, 18, and 20 — but those
    three do not actually add to 48 (they sum to 54). Only 18 is the largest of the
    three even integers whose sum is 48.'
  distractor_types:
    A: last_step_trap
    B: partial_answer
    D: wrong_setup
