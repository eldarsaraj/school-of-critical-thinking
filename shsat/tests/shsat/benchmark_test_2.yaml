    \ happen to like. A view that makes all of this incoherent has surely left something\
    \ out.\r\n\r\nPerhaps, then, the truth lies in neither view alone. The agreement\
    \ that supports the first view and the disagreement that supports the second are\
    \ both real, and a complete account must honor each. It may be that beauty arises\
    \ only in the meeting of a certain kind of object with a certain kind of perceiver,\
    \ so that it belongs entirely to neither but emerges from their encounter, as\
    \ a spark belongs to neither the flint nor the steel but to the striking of one\
    \ against the other. Such a view would explain the agreement, since perceivers\
    \ like us, sharing a common nature, are often moved by the same things; and it\
    \ would explain the disagreement too, since that common nature is crossed by all\
    \ the differences of culture and temperament that set one perceiver apart from\
    \ the next."
  question_text: The passage draws a contrast between the way a face's proportions
    "contain beauty" and the way they "contain angles." This contrast is meant to
    establish that
  choice_a: the angles can be measured precisely while the beauty cannot, though both
    are features the face genuinely possesses.
  choice_b: the beauty, unlike the angles, is not held in the face itself but exists
    only in the perceiver the face affects.
  choice_c: the proportions give rise to beauty as dependably as they form their angles,
    so beauty is as fixed and certain as geometry.
  choice_d: the beauty is merely apparent while the angles are real, so the face only
    seems beautiful without truly being so.
  correct_answer: B
  explanation: 'The contrast turns on a single word, "contain." A face''s angles are
    in the face itself, there to be measured whether or not anyone is looking, part
    of the object''s own makeup. The sentence says beauty is not in the face that
    way: instead, the proportions "produce" a pleasure in us, and that pleasure is
    what we call beauty — so beauty, on this view, exists not in the object but in
    the perceiver the object affects. B states exactly that, the angles belonging
    to the face, the beauty to the one who responds. A is tempting because it seizes
    on a real difference, that angles can be measured and beauty cannot, but it then
    keeps beauty as a feature the face "genuinely possesses," which is the very thing
    the sentence denies, since beauty is removed from the object and placed in the
    response. C takes the words "reliably produce" and runs them the wrong way, concluding
    that beauty is as fixed as geometry; but "reliably produce a pleasure in us" is
    precisely not "contain," and treating it so collapses the contrast the sentence
    draws. D overshoots in the other direction, reasoning that if beauty is only a
    response then the face is not truly beautiful and only seems so; yet the view
    does not call the pleasure unreal — it is a real pleasure, simply located in the
    perceiver rather than the object. Only B keeps both halves of the contrast where
    the passage puts them: the angles in the face, the beauty in the one affected
    by it.'
