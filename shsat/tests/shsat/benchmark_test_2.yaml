  question_text: Which version of sentence 10 is punctuated correctly?
  choice_a: These classes are offered at no charge so, they reach people who could
    not otherwise pay for such training.
  choice_b: These classes are offered at no charge, so they reach people who could
    not otherwise pay for such training.
  choice_c: These classes are offered at no charge, so they reach people, who could
    not otherwise pay for such training.
  choice_d: These classes are offered at no charge; so they reach people who could
    not otherwise pay for such training.
  correct_answer: B
  explanation: Two independent clauses joined by "so" take a comma before the conjunction,
    which B does. A puts the comma on the wrong side — after "so" rather than before
    it. C adds the comma before "so" correctly but then inserts an unneeded comma
    before "who," which turns "who could not otherwise pay" into an aside rather than
    the specific group the clause is identifying. D replaces the comma-and-conjunction
    with a semicolon before "so," a combination standard punctuation doesn't use.
  distractor_types:
    A: introduces_new_error
    C: overcorrection
    D: introduces_new_error
- section: ELA
  stage: easy_module
  question_number: 7
  question_type: multiple_choice
  skill: usage_agreement
  difficulty: medium
  topic: ''
  passage_group_id: ela_r_re
  passage_title: ''
  passage_text: ''
  question_text: "Which revision of the sentence below expresses the idea most clearly\
    \ and concisely?\r\n\r\n\"In spite of the fact that it had started to rain quite\
    \ heavily, the members of the team made the decision to continue with their search\
    \ for the lost dog.\""
  choice_a: The team kept searching despite the weather.
  choice_b: Despite the fact that it had begun raining in a heavy manner, the team
    came to the decision that they would keep on searching for the dog that was lost.
  choice_c: Although it had started to rain heavily, the team decided to continue
    searching for the lost dog.
  choice_d: Although it had started to rain heavily, the team decided to search for
    the lost dog.
  correct_answer: C
  explanation: 'The original is wordy but carries three facts: it had been raining
    hard, the team made a decision, and they continued a search already underway for
    the lost dog. C trims the padding while keeping all three. A is the shortest version,
    and that is exactly the trap — "kept searching despite the weather" drops the
    lost dog, so the point of the search disappears. B stays as bloated as the original.
    D reads cleanly and is almost right, but removing "continue" changes the meaning:
    "decided to search" suggests the team was only now starting out rather than carrying
    on.'
  distractor_types:
    A: less_precise
    B: less_precise
    D: changes_meaning
- section: ELA
  stage: easy_module
  question_number: 8
  question_type: multiple_choice
  skill: usage_agreement
  difficulty: medium
  topic: ''
  passage_group_id: ela_r_re
  passage_title: ''
  passage_text: ''
  question_text: "What is the best way to combine the two sentences below?\r\n\r\n\
    \"The bridge had been closed for repairs. Commuters had to find a different route\
    \ to work.\""
  choice_a: Although the bridge had been closed for repairs, commuters had to find
    a different route to work.
  choice_b: Because the bridge had been closed for repairs, commuters chose to find
    a different route to work.
  choice_c: Because of bridge closure, people had to go a different way to get to
    work.
  choice_d: Because the bridge had been closed for repairs, commuters had to find
    a different route to work.
  correct_answer: D
  explanation: 'The closed bridge is the reason commuters had to reroute, so the combined
    sentence needs a cause-and-effect link and should preserve every detail. D does
    both. A swaps in "although," which signals a contrast — as if commuters rerouted
    in spite of the closure rather than because of it. B uses the right connector
    but changes "had to" into "chose to," turning a forced detour into a voluntary
    one. C is the closest call: it keeps "had to" and "to work," so it gives up less
    than the others, but "bridge closure" drops the reason (repairs), "people" is
    looser than "commuters," and "go a different way" is vaguer than "find a different
    route."'
  distractor_types:
    A: wrong_logical_relation
    B: changes_meaning
    C: less_precise
- section: ELA
  stage: easy_module
  question_number: 9
  question_type: multiple_choice
  skill: usage_agreement
  difficulty: medium
  topic: ''
  passage_group_id: ela_r_re
  passage_title: ''
  passage_text: ''
  question_text: "Which word best completes the sentence?\r\n\r\n\"For decades, doctors\
    \ had assumed the illness was caused by poor hygiene; the new study ___ that belief\
    \ by tracing the illness to a previously unknown bacterium.\""
  choice_a: overturned
  choice_b: confirmed
  choice_c: complicated
  choice_d: changed
  correct_answer: A
  explanation: 'The study traced the illness to a brand-new cause — a bacterium —
    which directly contradicts the long-held belief that poor hygiene was to blame.
    "Overturned" captures that reversal exactly. "Confirmed" is the opposite: it would
    mean the study backed up the hygiene belief, when in fact it replaced it. "Complicated"
    is gentler but still wrong — the belief wasn''t made messier, it was discarded.
    "Changed" is true but says almost nothing; it names that the belief shifted without
    conveying that the study overturned it.'
  distractor_types:
    B: changes_meaning
    C: changes_meaning
    D: less_precise
- section: ELA
  stage: easy_module
  question_number: 10
  question_type: multiple_choice
  skill: sentence_structure
  difficulty: medium
  topic: ''
  passage_group_id: ela_r_re
  passage_title: ''
  passage_text: ''
  question_text: "Which revision best corrects the sentence below?\r\n\r\n\"The new\
    \ policy was unpopular at first many employees changed their minds after seeing\
    \ the results.\""
  choice_a: The new policy was unpopular at first, so many employees changed their
    minds after seeing the results.
  choice_b: The new policy was unpopular at first, but many employees changed their
    minds, after seeing the results.
  choice_c: The new policy was unpopular at first, but a lot of people felt differently
    once things turned out okay.
  choice_d: The new policy was unpopular at first, but many employees changed their
    minds after seeing the results.
  correct_answer: D
  explanation: The sentence runs two complete thoughts together with no punctuation,
    and the meaning is a contrast. D joins the clauses with a comma and "but," fixing
    the run-on and signaling that contrast. A fixes the run-on but uses "so," which
    makes the early unpopularity the cause of the change rather than something it
    was overcome. B uses the right connector, but the comma before "after seeing the
    results" is unneeded — that phrase tells when the employees changed their minds
    and belongs with the verb, not set off on its own. C joins the ideas correctly
    but trades the specifics for vague wording.
  distractor_types:
    A: wrong_logical_relation
    B: overcorrection
    C: less_precise
- section: ELA
  stage: easy_module
  question_number: 11
  question_type: multiple_choice
  skill: main_idea
  difficulty: medium
  topic: ''
  passage_group_id: ela_e_p1
  passage_title: Seeing with Sound
  passage_text: "On a summer evening, a bat flickers across the darkening sky, snatching\
    \ insects out of the air with a precision that seems impossible for an animal\
    \ flying blind. Bats are not blind—most see about as well as we do—but in the\
    \ dark they rely on something else entirely. They navigate and hunt by sound,\
    \ building a picture of the world from echoes. The ability, called echolocation,\
    \ lets a bat chase a moth through a tangle of branches at night without ever touching\
    \ a leaf.\r\nThe principle is simple to state. A hunting bat sends out a stream\
    \ of high-pitched calls, far too high for human ears, and then listens for the\
    \ sound to bounce back. When a call strikes an object—a twig, a wall, a flying\
    \ insect—part of it returns as an echo. From that echo the bat reads the world:\
    \ how far away the object is, judged by the time the sound takes to return; how\
    \ large it is, judged by the strength of the echo; and even which direction it\
    \ is moving, judged by subtle changes in the returning pitch. A bat does all of\
    \ this in a fraction of a second, and then again, and again, dozens of times each\
    \ second as it closes in on its prey.\r\nWhat makes the system remarkable is not\
    \ only its speed but its flexibility. When a bat is simply cruising, it calls\
    \ slowly, a few times a second, the way a driver glances now and then at the road\
    \ ahead. But the instant it detects prey, the calls come faster and faster, until\
    \ in the final rush before the catch they blur into a buzz so rapid that researchers\
    \ call it the \"feeding buzz.\" Each call updates the bat's picture of exactly\
    \ where the insect is and where it is darting next.\r\nFor all its sophistication,\
    \ the system has limits. Sound grows faint as it travels, so a bat's world of\
    \ echoes reaches only a few dozen feet ahead; past that, the returning signal\
    \ is too weak to read. Different species have met this challenge in different\
    \ ways. Some hunt in the open, sending out long, far-reaching calls that sweep\
    \ a wide patch of sky, while others thread through dense forest on short, rapid\
    \ calls suited to a cluttered world of leaves and branches. Engineers who design\
    \ sonar and radar have studied these animals closely, since a bat solves, with\
    \ a tiny brain and a pair of ears, problems that human machines handle only with\
    \ far more equipment.\r\nThe insects, of course, have not simply surrendered.\
    \ Some moths have evolved ears tuned to the precise frequencies of bat calls;\
    \ the moment they hear a hunter approaching, they fold their wings and drop out\
    \ of the sky. A few species go further still. Certain tiger moths answer a bat's\
    \ call with rapid clicks of their own, and the clicks appear to scramble the echo,\
    \ leaving the bat with a smeared and useless image. In the darkness overhead,\
    \ in other words, a contest is unfolding that we cannot hear: a hunter reading\
    \ the night by sound, and a prey that has learned to confuse the reading."
  question_text: Which statement best expresses the central idea of the passage?
  choice_a: With nothing but a tiny brain and a pair of ears, bats do what human sonar
    and radar achieve only with far more equipment.
  choice_b: Bats hunt and find their way through darkness by producing calls and interpreting
    the echoes that return to them.
  choice_c: The night sky is the setting for a hidden contest between bats and the
    moths that have learned to evade them.
  choice_d: Bats produce echoes that travel outward and reveal the location of nearby
    objects.
  correct_answer: B
  explanation: The passage as a whole explains how bats use sound to operate in the
    dark — sending out calls and reading the echoes that bounce back in order to hunt
    and navigate — which is what B states. A restates one of the passage's most memorable
    lines, but it's a comparison meant to show how sophisticated echolocation is,
    a supporting point rather than the passage's overall subject. C is tempting because
    the passage ends on the hidden bat-and-moth contest, but that arms race is the
    closing image, not the central topic. D sounds like a fair summary until you look
    closely — bats send out calls, and it is the objects that send back echoes, so
    saying bats "produce echoes" confuses the call with the echo.
  distractor_types:
    A: misidentified_detail
    C: partly_true_but_wrong
    D: wrong_concept
