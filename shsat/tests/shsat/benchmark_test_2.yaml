  question_text: In the final paragraph, the author calls a tree "not merely a living
    thing but an instrument" mainly to
  choice_a: present the tree as deliberately keeping a record of the weather it lived
    through.
  choice_b: present the tree as a tool scientists pick up and use to read the past.
  choice_c: echo the earlier comparison of the rings to a fingerprint of the local
    climate.
  choice_d: recast the tree as a device that recorded the weather on its own.
  correct_answer: D
  explanation: 'The last line turns the whole passage into a single image: a tree
    is "not merely a living thing but an instrument." An instrument here means a recording
    device — something like a gauge or a logger that registers and stores data — and
    the tree has been doing exactly that, taking down the weather in its rings, season
    after season, with no one asking it to. D captures that. A reads "patiently recorded"
    too literally, as if the tree set out to keep a record; but the phrase personifies
    a process that happens without intent. B turns "instrument" into a tool people
