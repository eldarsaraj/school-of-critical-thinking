    reaches for the obvious explanation, but the passage has already told us those
    minutes barely mattered in daily life. B imagines the resisters wanting to give
    up clocks for natural rhythms, yet they did the opposite — they kept two clocks,
    holding onto their own clock time rather than abandoning it. C fastens onto a
    real detail about how the zones were drawn, but the people''s objection is to
    losing their local time to a distant authority, not to where the boundaries fell.
