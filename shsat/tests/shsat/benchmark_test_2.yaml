  passage_title: ''
  passage_text: ''
  question_text: "Read this sentence. \r\n\r\n\"The museum's new wing was designed\
    \ to draw younger visitors, attendance among teenagers has actually fallen since\
    \ it opened.\" \r\n\r\nWhat is the best way to revise it?"
  choice_a: The museum's new wing was designed to draw younger visitors; attendance
    among teenagers has actually fallen since it opened.
  choice_b: The museum's new wing was designed to draw younger visitors, but the response
    has actually been disappointing since it opened.
  choice_c: The museum's new wing was designed to draw younger visitors, and attendance
    among teenagers has actually fallen since it opened.
  choice_d: Although the museum's new wing was designed to draw younger visitors,
    attendance among teenagers has actually fallen since it opened.
  correct_answer: D
  explanation: 'The sentence is a comma splice: "The museum''s new wing was designed
    to draw younger visitors" and "attendance among teenagers has actually fallen
    since it opened" are each complete, and a comma alone cannot join them. But fixing
    the punctuation is only half the task, because the two clauses stand in a specific
    relationship — a contrast. The wing was meant to draw young people, and the opposite
    happened, an irony the word "actually" is there to flag. The best revision both
    resolves the splice and marks that contrast, which D does with "Although": the
    design aimed one way, the result went the other. A repairs the splice perfectly
    well with a semicolon, so it passes the punctuation test — but a semicolon only
    sets the two clauses side by side as equals, leaving the contrast unmarked, so
    the reversal reads as a flat addition. C is closer still: it fixes the splice
    and keeps the precise fact that attendance fell, failing only in that "and" simply
    tacks on the second clause instead of presenting it as the reversal of the first.
    B chooses the contrast connector "but," but then trades the specific fact for
    the vague "the response has been disappointing," losing the information that made
    the sentence worth writing. Only D marks the contrast and keeps the exact fact,
    fixing the run-on without flattening its point or blurring its detail.'
  distractor_types:
    A: wrong_logical_relation
    B: less_precise
    C: wrong_logical_relation
