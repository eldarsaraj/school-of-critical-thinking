  question_text: "The writer wants to add the following sentence to the paragraph:\r\
    \n\r\n\"These passes are especially popular with families planning a weekend outing.\"\
    \r\n\r\nWhere would the sentence best be placed?"
  choice_a: After sentence 5
  choice_b: After sentence 4
  choice_c: After sentence 6
  choice_d: After sentence 9
  correct_answer: A
  explanation: The added sentence begins with "These passes," which must point back
    to something already named. Only sentence 5 mentions passes — the free passes
    to local museums — so the new sentence belongs immediately after it. Placed after
    sentence 4, "These passes" would have no referent, since sentence 4 lists tools,
    board games, and cake pans rather than passes. Placed after sentence 6, it would
    be stranded among the recording studios, separated from the passes it describes.
    Placed after sentence 9, it would interrupt the section on classes, far from any
    mention of passes.
  distractor_types:
    B: wrong_placement
    C: wrong_placement
    D: wrong_placement
