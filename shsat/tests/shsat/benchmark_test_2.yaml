  passage_group_id: ela_r_p1
  passage_title: When Noon Stopped Being Local
  passage_text: "For most of human history, time was a local affair. Noon was simply\
    \ the moment the sun stood highest in the sky, and because the sun reaches that\
    \ point a little later as one travels west, every town kept its own slightly different\
    \ clock. A traveler moving from one city to the next might notice that the church\
    \ bells rang a few minutes apart, but hardly anyone minded. A discrepancy of several\
    \ minutes made little difference to people who rarely journeyed far and who measured\
    \ their days by sunrise, sunset, and the unhurried rhythms of work. Each community,\
    \ in effect, read the time directly from its own patch of sky.\r\n\r\nThe railroad\
    \ changed all of that. By the middle of the nineteenth century, trains could carry\
    \ passengers across hundreds of miles in a single day, far faster than anyone\
    \ had ever traveled. That new speed created a problem that had never mattered\
    \ before: the schedule. A train leaving one town at what the locals called nine\
    \ o'clock might reach a town whose clocks read several minutes earlier or later,\
    \ and the printed timetables that strung dozens of such towns together dissolved\
    \ into a tangle of tiny inconsistencies. Strung end to end across the continent,\
    \ those small gaps could add up to nearly an hour between the eastern seaboard\
    \ and the western cities. The danger went beyond mere confusion. Two trains running\
    \ toward each other on a single track had to know exactly when each would arrive\
    \ at the junction between them. When the clocks at either end disagreed, the margin\
    \ separating a safe passing from a collision could shrink to a matter of minutes.\r\
    \n\r\nThe railway companies found their own solution long before any government\
    \ acted. Rather than wait for thousands of towns to agree among themselves, the\
    \ railroads simply chose a single time and ran their lines by it. In the United\
    \ States, the major companies divided the map into a handful of broad bands, and\
    \ within each band every station kept one identical clock, no matter where the\
    \ sun happened to stand overhead. Drawing the lines was itself a kind of negotiation,\
    \ since a band wide enough to be convenient still had to bend around the cities\
    \ and rail hubs that mattered most. The time a railroad kept was not necessarily\
    \ the time shown by anyone's window; it was a deliberate convenience, a number\
    \ agreed upon so that schedules across great distances would finally line up.\
    \ A clock, in this new arrangement, no longer reported a fact about the sky. It\
    \ reported an agreement among people.\r\n\r\nNot everyone welcomed the shift.\
    \ To set a town's clocks by the standard of a distant railroad was, for some,\
    \ to surrender a small piece of local identity. A city whose noon had always meant\
    \ the sun directly overhead now discovered that its official noon arrived minutes\
    \ out of step with the heavens. Newspapers debated whether it was sensible, or\
    \ even proper, to let a private railroad company announce what time it was. For\
    \ a while, certain towns stubbornly kept two clocks side by side, one set to the\
    \ railroad's standard and the other to the older, local reckoning, as if reluctant\
    \ to choose between them.\r\n\r\nIn the end, the convenience proved too useful\
    \ to refuse. As more and more of ordinary life came to depend on travel and communication\
    \ that reached across long distances, a shared clock ceased to be a railroad's\
    \ private preference and became something closer to a public necessity. Governments\
    \ eventually wrote the railroads' zones into law, transforming standard time from\
    \ a corporate arrangement into an official one. The older sense of time, anchored\
    \ to the sun above one particular place, did not so much disappear as recede into\
    \ the background, recalled mainly on the rare occasion when a garden sundial is\
    \ found reading an hour or two apart from a wristwatch.\r\n\r\nWhat the change\
    \ truly marked was a subtle revolution in how people understood time itself. Time\
    \ had once been something each town read from its own sky, as local and as variable\
    \ as the weather. Afterward it became something agreed upon in advance, a common\
    \ measure that allowed a vast and scattered population to move and act in concert.\
    \ The bargain was seldom spelled out, yet it was real enough: a little of each\
    \ place's individuality was traded away so that every place could share a single,\
    \ dependable now."
  question_text: Which statement best expresses the central idea of the passage?
  choice_a: Conflicting local clocks made railroad travel dangerous, because two trains
    on one track could not be sure when they would meet.
  choice_b: A practical need created by the railroads led people to replace locally
    kept time with a single shared standard.
  choice_c: The rise of standard time shows that progress always comes at the cost
    of local traditions and individuality.
  choice_d: Railroad companies seized control of timekeeping from local governments
    in order to make their operations more profitable.
  correct_answer: B
  explanation: 'The passage tracks one large change from beginning to end: because
    the railroads needed their schedules to match across long distances, towns gave
    up the local, sun-based time they had always kept and adopted a single shared
    standard instead. B states that change. A is true and even dramatic, but the danger
    of colliding trains is one reason the change was needed, not the change itself.
    C borrows the passage''s own words about "local identity" and individuality, yet
    stretches them into a sweeping rule that progress "always" costs tradition; the
    text makes no such universal claim and treats the shift as a specific trade. D
    is partly right that the railroads set the standard, but it adds motives the passage
    never mentions — profit and a grab for power from local governments — when the
    text presents the railroads as solving a practical scheduling problem that governments
    later wrote into law. Only B names the central change without shrinking it, inflating
    it, or twisting its cause.'
  distractor_types:
    A: misidentified_detail
    C: wrong_concept
    D: partly_true_but_wrong
