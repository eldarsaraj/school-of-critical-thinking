    moving to its own position mainly in order to
  choice_a: stay even-handed between the two opposing views and leave readers to decide
    which one is correct.
  choice_b: trace the historical order in which various thinkers first proposed these
    competing theories of beauty.
  choice_c: build each view up convincingly so that the eventual failure of both will
    drive readers to reject the question itself.
  choice_d: show that each view captures something real, so its synthesis must honor
    the genuine evidence on both sides.
