  question_text: A two-digit number is equal to 4 times the sum of its digits. If
    the tens digit is 3, what is the number?
  choice_a: '6'
  choice_b: '12'
  choice_c: '36'
  choice_d: '39'
  correct_answer: C
  explanation: 'The number has tens digit 3 and some units digit u, so the number
    is 30 + u and its digit sum is 3 + u. The number is 4 times that sum: 30 + u =
    4(3 + u). Expanding gives 30 + u = 12 + 4u, so 18 = 3u and u = 6. The number is
    36. (Check: 4 × (3 + 6) = 4 × 9 = 36.) Choice A, 6, is just the units digit. Choice
    B, 12, takes 4 times the tens digit alone instead of 4 times the sum of both digits.
    Choice D, 39, comes from solving 18 = 3u incorrectly. Only 36 equals 4 times its
    own digit sum.'
