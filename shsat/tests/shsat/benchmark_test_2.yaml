  passage_title: More Than Books
  passage_text: (1) To most people, a public library is simply a quiet building full
    of books. (2) In recent years, however, many libraries have quietly reinvented
    what they offer. (3) A growing number of branches now lend far more than printed
    books. (4) At some libraries, a visitor can borrow hand tools, board games, or
    even cake pans. (5) Other branches offer free passes to local museums. (6) Still
    others have built small recording studios where patrons produce music and podcasts.
    (7) These new services are popular, the demand for them often exceeds what a single
    branch can supply. (8) Many libraries have become places to learn practical skills.
    (9) On a given afternoon, a patron might take a free class in coding, writing
    a résumé, or how to manage a budget. (10) These classes are offered at no charge
    so they reach people who could not otherwise pay for such training. (11) The library
    also does a great many other helpful things for the community. (12) Even today,
    many visitors love the hushed, peaceful feeling of a quiet reading room. (13)
    For all of these reasons, today's library is far more than a place to borrow a
    good book.
  question_text: Which sentence is least relevant to the paragraph's focus and should
    be deleted?
  choice_a: Sentence 1
  choice_b: Sentence 3
  choice_c: Sentence 6
  choice_d: Sentence 12
  correct_answer: D
  explanation: The paragraph argues that today's libraries offer far more than books,
    and "For all of these reasons" at the end points back to those new services. Sentence
    12 — nostalgia for a quiet reading room — supports none of those reasons and actually
    drifts back toward the old image the paragraph is arguing against, so it's the
    one to cut. The trap is that the other three all look removable. Sentence 1 also
    mentions a "quiet" library and is easy to confuse with sentence 12, but sentence
    1 sets up the impression the whole paragraph overturns, so the argument needs
    it. Sentence 3 states the main claim, and sentence 6 supplies one of its central
    examples — each can feel like "just" an opener or a detail, yet cutting any of
    them weakens the case.
  distractor_types:
    A: misattributed_error_location
    B: misattributed_error_location
    C: misattributed_error_location
