  correct_answer: C
  explanation: 'Let b be the brother''s age now and a be Anna''s age now. "Now she
    is twice as old" gives a = 2b. "Five years ago, Anna was three times as old as
    her brother" means that five years ago both were five years younger: a − 5 = 3(b
    − 5). Substituting a = 2b gives 2b − 5 = 3(b − 5) = 3b − 15, so 15 − 5 = 3b −
    2b, and b = 10. Then a = 2 × 10 = 20, so Anna is 20 now. As a check, five years
    ago Anna was 15 and her brother 5, and 15 = 3 × 5. A is the brother''s current
    age, 10, not Anna''s. B is Anna''s age five years ago, 15, rather than her age
    now. D forgets that Anna too was five years younger in the past, writing a = 3(b
