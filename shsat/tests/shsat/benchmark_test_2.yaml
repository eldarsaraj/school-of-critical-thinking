  question_text: A bag contains 4 red marbles and 6 blue marbles. Two marbles are
    drawn one after the other without replacement. What is the probability that the
    two marbles are different colors?
  choice_a: 4/15
  choice_b: 7/15
  choice_c: 12/25
  choice_d: 8/15
  correct_answer: D
  explanation: 'There are two ways to end up with two different colors: red first
    then blue, or blue first then red. Work out each one and add them. Red first then
    blue: the first marble is red with chance 4 out of 10; one marble is now gone,
    so 6 of the remaining 9 are blue, giving 4/10 × 6/9 = 24/90. Blue first then red:
    blue with chance 6 out of 10, then 4 of the remaining 9 are red, giving 6/10 ×
    4/9 = 24/90. Adding both ways: 24/90 + 24/90 = 48/90, which reduces to 8/15. Choice
    A counts only the first way (red then blue) and forgets that blue then red also
    gives two different colors. Choice B is the chance the two marbles match — both
    red or both blue — which is not what the question asks. Choice C forgets that
    the first marble is not put back, so it wrongly keeps the second draw out of 10
    instead of 9. Only 8/15 counts both orders and remembers that one marble is already
    gone on the second draw.'
