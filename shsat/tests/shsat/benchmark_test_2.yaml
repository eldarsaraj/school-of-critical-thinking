  passage_group_id: ela_h_re
  passage_title: The Vertical City
  passage_text: "(1) Before the middle of the nineteenth century, the height of a\
    \ building was limited less by how it could be constructed than by how far people\
    \ were willing to climb. (2) Stairs were tiring, and so the upper floors of a\
    \ tall building, being the hardest to reach, were the least desirable and rented\
    \ for the lowest prices. (3) The wealthy occupied the lower floors, while the\
    \ poorest tenants trudged up to cramped rooms beneath the roof. (4) A building\
    \ taller than five or six stories made little economic sense, since few tenants\
    \ would willingly climb so far.\r\n(5) The safety elevator changed this logic\
    \ entirely. (6) Elevators had existed for years, but they were used mainly to\
    \ haul freight, passengers feared them because a snapped cable meant a deadly\
    \ fall. (7) In 1853, an inventor named Elisha Otis introduced a device that would\
    \ catch a falling elevator car even if its cable broke. (8) Standing on a raised\
    \ platform before a crowd, the rope holding Otis's elevator was cut on purpose,\
    \ and the car dropped only a few inches before the safety brake seized and held\
    \ it. (9) The demonstration was theatrical, but it convinced a wary public that\
    \ an elevator could be trusted.\r\n(10) With a safe elevator, the value once attached\
    \ to height was turned completely upside down and reversed. (11) The top floors,\
    \ now reached in seconds and raised above the noise and grime of the street, became\
    \ the most sought-after in the building. (12) A view that had once been the burden\
    \ of the poor was now a luxury the wealthy would pay for. (13) Modern elevators\
    \ can reach remarkable speeds, the fastest of them rising at more than forty miles\
    \ per hour. (14) The design of these new towers, with their frames of steel and\
    \ their walls of glass, were unlike anything the city had seen before. (15) The\
    \ skyscraper, unimaginable without the elevator, climbed floor by floor into the\
    \ vertical city we know today."
  question_text: What is the best way to revise sentence 6?
  choice_a: Elevators had existed for years, but because they were used mainly to
    haul freight, passengers feared them, since a snapped cable meant a deadly fall.
  choice_b: Elevators had existed for years, but they were used mainly to haul freight;
    passengers feared them because a snapped cable meant a deadly fall.
  choice_c: Although elevators had existed for years and were used mainly to haul
    freight, passengers feared them because a snapped cable meant a deadly fall.
  choice_d: Elevators had existed for years but were used mainly to haul freight,
    passengers feared them because a snapped cable meant a deadly fall.
  correct_answer: B
  explanation: 'Sentence 6 is a comma splice: "they were used mainly to haul freight"
    and "passengers feared them because a snapped cable meant a deadly fall" are each
    complete, so a comma cannot join them. The question is which repair fixes the
    punctuation without disturbing the meaning, and three of the four make a trade.
    B uses a semicolon to mark the break while keeping the two thoughts linked, and
    changes nothing else — the contrast, the freight use, and the reason for the fear
    all stand. A removes the splice but reorganizes the logic into a false chain:
    "because they were used mainly to haul freight, passengers feared them" makes
    the freight use the cause of the fear, when the passage means the two were parallel
    facts, not cause and effect. C reads smoothly and is correctly punctuated, but
    "Although elevators … were used mainly to haul freight, passengers feared them"
    sets up a contrast that isn''t real — there is nothing surprising about people
    fearing a machine that had long been used for freight, so the concession misrepresents
    the relationship. D fixes the first half by dropping the repeated subject, which
    makes "had existed … but were used … to haul freight" a single clean clause —
    and then runs straight into the same comma splice before "passengers," leaving
    the original error untouched. Only B resolves the splice while keeping the sentence''s
    meaning intact.'
  distractor_types:
    A: introduces_new_error
    C: wrong_logical_relation
    D: introduces_new_error
