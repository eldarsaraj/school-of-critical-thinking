    \ a small slowdown instead of magnifying it. A single such vehicle, keeping a\
    \ calm and even pace, has been shown to smooth the flow of all the cars behind\
    \ it, dissolving a wave before it has the chance to form.\r\n\r\nThere is something\
    \ almost humbling in the idea. A phantom jam is not the work of a reckless few\
    \ but the unintended product of ordinary people, each driving sensibly, each reacting\
    \ just a fraction too sharply to the driver immediately ahead. The traffic that\
    \ traps them is, in a sense, something they create together without meaning to,\
