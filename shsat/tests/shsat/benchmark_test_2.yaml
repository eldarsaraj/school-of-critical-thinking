  question_text: If x + y = 12 and xy = 32, what is the value of x² + y²?
  choice_a: '32'
  choice_b: '80'
  choice_c: '112'
  choice_d: '144'
  correct_answer: B
  explanation: 'You don''t need to find x and y separately. Since (x + y)² = x² +
    2xy + y², rearranging gives x² + y² = (x + y)² − 2xy. Here x + y = 12, so (x +
    y)² = 144, and 2xy = 2 × 32 = 64. Therefore x² + y² = 144 − 64 = 80. (Check: x
    = 4 and y = 8 fit both conditions, and 4² + 8² = 16 + 64 = 80.) Choice D, 144,
    stops at (x + y)² and forgets to subtract the 2xy. Choice C, 112, subtracts xy
    once instead of 2xy. Choice A, 32, just repeats the product. Only 80 uses the
    full identity.'
