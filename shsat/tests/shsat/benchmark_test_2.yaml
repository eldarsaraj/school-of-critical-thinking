  question_text: In describing the slowdown as a "wave," the author mainly conveys
    that
  choice_a: the slowdown is a disturbance moving backward through the cars while the
    cars themselves keep going forward.
  choice_b: the slowdown grows steadily larger and more forceful as more and more
    cars are caught up in it.
  choice_c: the slowdown rolls forward along the road with the cars, spreading to
    the vehicles up ahead.
  choice_d: the slowdown obeys the same physical laws as a wave moving across the
    surface of water.
  correct_answer: A
  explanation: 'A "wave" is the right image because the author needs to convey something
    a flat word like "jam" or "blockage" would miss: the slowdown is not a thing sitting
    in the road but a disturbance that moves through the line of cars. And it moves
    in a way that seems backward — the cars roll forward, but the slowdown ripples
    back toward the vehicles behind. A captures that double motion. B is drawn from
    something the passage does say, that the slowdown amplifies as it spreads, but
    growth is not what "wave" specifically conveys; a wave can shrink as easily as
    build, and the swelling is carried by other words, not by the comparison itself.
    C gets the central idea that the slowdown travels, which is most of the work the
    metaphor does, but sends it the wrong way — forward with the cars, when the passage
    is careful to say the wave runs backward, against the flow. D takes the comparison
    too literally, treating it as a claim that traffic follows the physics of water;
    the author means it as an illustration of motion, not a statement that cars and
    water obey the same laws. Only A names what the wave image is built to show: a
    disturbance traveling backward through cars that are themselves moving forward.'
