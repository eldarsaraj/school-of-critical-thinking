    \ long sea voyage. (4) By comparing the time at sea to the time at a known port,\
    \ navigators could calculate how far east or west they had traveled. (5) Early\
    \ chronometers were expensive, and many captains could not afford one for years.\
    \ (6) This breakthrough made ocean voyages far safer and more reliable.\r\n\r\n\
    Which sentence is least relevant to the paragraph and could best be deleted?"
  choice_a: Sentence 1
  choice_b: Sentence 3
  choice_c: Sentence 5
  choice_d: Sentence 6
  correct_answer: C
  explanation: 'The paragraph builds one line of explanation: cloudy nights once made
    star navigation unreliable (sentence 1), the marine chronometer fixed that (sentence
    2), it is a clock precise enough for long voyages (sentence 3), and comparing
    sea time to port time reveals how far east or west a ship has gone (sentence 4),
    all of which made ocean travel safer (sentence 6). Every one of those serves the
    explanation of how the device solved the navigation problem. Sentence 5 steps
    outside it — how much chronometers cost and how slowly captains could afford them
    is a point about economics and adoption, not about how the instrument worked or
    what it achieved. Sentence 1 sets up the problem, sentence 3 defines the device,
    and sentence 6 states the payoff; pull any of those and the explanation loses
    a piece. Only sentence 5 can go without leaving a gap.'
