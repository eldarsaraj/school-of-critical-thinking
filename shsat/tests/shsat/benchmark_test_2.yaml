  question_text: Which revision of sentence 11 expresses the idea most clearly and
    specifically?
  choice_a: The library also provides a wide range of other valuable services to those
    it serves.
  choice_b: The library also lends tools, board games, and passes to local museums.
  choice_c: The library also offers warm public spaces in winter, free internet access,
    and quiet rooms for studying.
  choice_d: The library also helps the community in many important and meaningful
    ways.
  correct_answer: C
  explanation: 'Sentence 11 promises "other helpful things" the library does, so the
    best revision names specific services that haven''t already been mentioned. C
    does exactly that — warm winter spaces, free internet, study rooms — concrete
    and new. A and D only swap one vague phrase for another, so the sentence still
    tells the reader nothing specific. B is the trap worth slowing down for: it''s
    perfectly specific, but it lists tools, board games, and museum passes — services
    the paragraph already described — so it repeats earlier material instead of adding
    the "other" things sentence 11 is pointing to.'
  distractor_types:
    A: less_precise
    B: changes_meaning
    D: less_precise
