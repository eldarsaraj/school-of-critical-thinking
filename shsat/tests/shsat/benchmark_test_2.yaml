- section: ELA
  stage: routing
  question_number: 18
  question_type: multiple_choice
  skill: main_idea
  difficulty: medium
  topic: ''
  passage_group_id: ela_r_p2
  passage_title: A Jam Without a Cause
  passage_text: "Anyone who drives regularly has had the experience: traffic on a\
    \ highway slows to a crawl, inches forward for a few minutes, and then, just as\
    \ mysteriously, opens up again. The driver creeps past the spot where the delay\
    \ seemed worst, bracing for the wreck or the stalled truck that must have caused\
    \ it, and finds nothing at all, no accident, no closed lane, no flashing lights.\
    \ The road simply clears, as though the jam had been imagined. These vanishing\
    \ slowdowns, which traffic engineers call phantom jams, are among the most common\
    \ forms of highway congestion, and for a long time they remained among the least\
    \ understood.\r\n\r\nThe puzzle is that a phantom jam has no single cause in the\
    \ way an accident does. It is not produced by any one driver or any one obstacle;\
    \ it emerges instead from the collective behavior of many independent drivers,\
    \ no single one of whom is doing anything obviously wrong. To see how, imagine\
    \ a long line of cars traveling close together at high speed. One driver, for\
    \ any reason at all, a glance at a phone, a slight drift toward the next lane,\
    \ a moment of caution, eases off the accelerator and slows by a few miles per\
    \ hour. The driver behind, reacting an instant too late, must brake a little harder\
    \ to keep a safe distance. The next driver brakes harder still, and the one after\
    \ that harder yet. What began as a minor tap of one driver's brakes amplifies,\
    \ as it propagates backward through the line, into a complete standstill.\r\n\r\
    \nThe result is a wave, and like a wave it travels, but not in the direction the\
    \ cars are going. While each individual vehicle continues to move forward, the\
    \ slowdown itself propagates backward, against the direction of traffic, reaching\
    \ vehicles still far behind the original disturbance. A driver caught in the jam\
    \ is therefore trapped inside a disturbance that began somewhere up ahead, often\
    \ minutes earlier, set off by someone who has long since driven on. By the time\
    \ the wave reaches the rear of the line, the event responsible for triggering\
    \ it has entirely dissolved, which is precisely why the trailing driver, creeping\
    \ forward at last, discovers an empty road where the trouble should have been.\r\
    \n\r\nWhat makes such waves possible is the sheer density of cars on a busy road.\
    \ When traffic is light, a driver who slows briefly leaves plenty of room, and\
    \ the cars behind can adjust without braking sharply, so the small disturbance\
    \ dies out. But as a road fills and the gaps between cars shrink, there is less\
    \ and less room to absorb a sudden change. Beyond a certain density, that cushion\
    \ disappears, and any small slowdown, rather than fading, is amplified as it travels\
    \ down the line. The road does not need more cars than it can physically hold;\
    \ it needs only enough that drivers can no longer respond gently to one another.\
    \ At that point the system becomes fragile, primed to turn a trivial disturbance\
    \ into a complete standstill.\r\n\r\nAt the heart of the phenomenon lies an unavoidable\
    \ human limitation: reaction time. A driver cannot respond to the car ahead instantly,\
    \ and so must allow a margin of error, braking a little more than strictly necessary\
    \ simply to stay safe. Multiplied across dozens of vehicles, these small overcorrections\
    \ are what transform a ripple into a solid wall. This insight points toward a\
    \ genuinely counterintuitive conclusion. The way to prevent phantom jams may not\
    \ be to build wider roads or add more lanes, but to change how drivers, or the\
    \ cars themselves, respond to one another. Vehicles that hold a steady speed and\
    \ a consistent following distance, neither tailgating nor overreacting, can absorb\
    \ a small slowdown instead of magnifying it. A single such vehicle, keeping a\
    \ calm and even pace, has been shown to smooth the flow of all the cars behind\
    \ it, dissolving a wave before it has the chance to form.\r\n\r\nThere is something\
    \ almost humbling in the idea. A phantom jam is not the work of a reckless few\
    \ but the unintended product of ordinary people, each driving sensibly, each reacting\
    \ just a fraction too sharply to the driver immediately ahead. The traffic that\
    \ traps them is, in a sense, something they create together without meaning to,\
    \ a reminder that in a system where everyone is closely linked, even small and\
    \ reasonable actions can accumulate into consequences no one chose."
  question_text: Which statement best expresses the central idea of the passage?
  choice_a: A phantom jam has no single cause but builds from drivers' amplified overreactions,
    and steadier spacing prevents it better than more lanes.
  choice_b: A phantom jam forms when one driver's small slowdown forces the cars behind
    to brake harder and harder, growing into a standstill.
  choice_c: Phantom jams can be prevented by steadier, more even driving rather than
    by building wider roads or adding new lanes.
  choice_d: Because drivers can never react quickly enough to one another, phantom
    jams remain an unavoidable feature of any crowded highway.
  correct_answer: A
  explanation: 'The passage does two things: it explains where a phantom jam comes
    from — many drivers'' small overreactions amplified into a standstill once the
    road is crowded — and it draws a lesson from that, namely that the cure is steadier
    spacing, not more pavement. The main idea has to cover both, and A is the only
    choice that does. B is true and central, but it describes only the first half.
    C is also true, and also only half: it gives the remedy while saying nothing about
    the cause that makes the remedy work. Each is a real part of the passage, but
    a part is not the whole. D goes a different way — it takes the passage''s point
    about reaction time and stretches it past what the text supports, concluding that
    jams are "unavoidable," when the final section argues that a single steady driver
    can dissolve a wave before it forms. A holds the two halves together without shrinking
    the idea to one of them or pushing it past where the passage goes.'
  distractor_types:
    B: too_narrow
    C: too_narrow
    D: partly_true_but_wrong
