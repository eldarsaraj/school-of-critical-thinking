  question_text: Solve for x in terms of y if 4x − y = 2x + 6.
  choice_a: x = (6 − y)/2
  choice_b: x = (y + 6)/4
  choice_c: x = 2(y + 6)
  choice_d: x = (y + 6)/2
  choice_e: ''
  correct_answer: D
  explanation: "Get the x-terms on one side: subtract 2x from both sides to get 4x\
    \ − 2x − y = 6, which is 2x − y = 6. Then add y to both sides: 2x = y + 6. Finally\
    \ divide by 2: x = (y + 6)/2.\r\nA comes from a sign slip: writing 2x = 6 − y\
    \ instead of 2x = y + 6, flipping the sign of the y-term. B divides by 4 — the\
    \ original coefficient of x — instead of the 2 that remains after combining 4x\
    \ − 2x, so the wrong number is used to undo the multiplication. C multiplies by\
    \ 2 instead of dividing by it, applying the opposite operation when isolating\
    \ x."
