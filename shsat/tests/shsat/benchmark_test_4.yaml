  question_text: Which statement best expresses a central idea of the passage?
  choice_a: Out of love, the granddaughter takes over the beadwork and shields her
    grandmother so well that the old woman never learns her sight has failed.
  choice_b: Out of a sense of duty, the granddaughter deceives her grandmother about
    the beadwork, uneasy with the lie until the old woman finally frees her from it.
  choice_c: Out of love, a grandmother allows her granddaughter to take over the craft
    she can no longer manage, guiding the girl's hands until the work is safely passed
    on.
  choice_d: Out of love, the granddaughter takes over her grandmother's failing craft
    while shielding her dignity, until the woman herself admits the truth and hands
    the work on.
  choice_e: ''
  correct_answer: D
  explanation: "All four options describe a loving handover of the beadwork, so the\
    \ reader has to weigh them against exactly what happens. The story ends with the\
    \ grandmother openly saying \"I cannot see the neckline anymore, Mira\" and then\
    \ handing the fabric over \"plainly … the way you hand someone a tool when the\
    \ work has passed to them.\" Choice D matches every part: love, protected dignity,\
    \ and the grandmother's own acknowledgment and handover.\r\nA is almost right\
    \ but fails on the ending: the grandmother does not stay in the dark — she names\
    \ her blindness herself. B keeps the actions but recolors the motive and mood,\
    \ turning tenderness into \"duty\" and a guilty \"lie,\" when the narrator calls\
    \ it \"a particular kind of lie that is really a form of love.\" C reverses who\
    \ is doing what: it casts the grandmother as the one \"allowing\" and \"guiding,\"\
    \ but in the story she is the one being shielded and gently deceived, while the\
    \ girl quietly leads until the final handover."
