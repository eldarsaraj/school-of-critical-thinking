  question_text: "What is the best way to combine these sentences to clarify the relationship\
    \ between the ideas?\r\n\r\n(1) The Sahara was once a green landscape dotted with\
    \ lakes. (2) A slow shift in Earth's orbit changed the region's rainfall. (3)\
    \ Over centuries the grasslands dried into the desert we know today."
  choice_a: The Sahara was once a green landscape dotted with lakes, and a slow shift
    in Earth's orbit changed the region's rainfall, and over centuries the grasslands
    dried into the desert we know today.
  choice_b: The Sahara was once a green landscape dotted with lakes, but a slow shift
    in Earth's orbit changed the region's rainfall, so over centuries the grasslands
    dried into the desert we know today.
  choice_c: Although a slow shift in Earth's orbit changed the region's rainfall,
    the once-green Sahara dried over centuries into the desert we know today.
  choice_d: Because a slow shift in Earth's orbit changed the region's rainfall, the
    once-green, lake-dotted Sahara dried over centuries into the desert we know today.
  choice_e: ''
  correct_answer: D
  explanation: "The three sentences describe a cause and its result over time: an\
    \ orbital shift changed the rainfall, and that change dried the once-green Sahara\
    \ into a desert. The best combination makes that cause-and-effect clear in one\
    \ smooth sentence. Choice D does it with \"Because … ,\" linking the orbital change\
    \ directly to the drying.\r\nA joins everything with \"and … and,\" which keeps\
    \ all three facts but hides how they connect. B uses \"but,\" wrongly signaling\
    \ a contrast between the green past and the change in rainfall, when there is\
    \ no contrast. C uses \"Although,\" which says the Sahara dried in spite of the\
    \ rainfall change — the opposite of the truth, since the rainfall change is exactly\
    \ what dried it out."
