  passage_title: Fine Work
  passage_text: "The wedding dress had to be finished by Friday, and my grandmother\
    \ had been going blind since spring.\r\n\r\nNeither of us said the second part\
    \ aloud. We said only the first, over and over, in the small back room where she\
    \ had sewn for the families of our town for forty years — had to be finished by\
    \ Friday, as though Friday were a weather front we could prepare for with enough\
    \ thread. The dress belonged to a bride named Clara Ferrante, who would arrive\
    \ Saturday morning to try it on, and it hung now on a headless dress form in the\
    \ corner, pale as the inside of a shell, waiting for the last of its work: two\
    \ hundred tiny glass beads to be sewn along the neckline, each one no larger than\
    \ a grain of rice.\r\n\r\nMy grandmother had done the beadwork on every wedding\
    \ dress she had ever made. It was the part she was known for, the part brides\
