  question_text: The passage says a healthy reef can "keep pace with a moderate rise
    in sea level." Given this claim, which conclusion is best supported?
  choice_a: The reef crest climbs every single year, so the reef is sure to stay above
    the sea under either projection.
  choice_b: Because both sea-level projections climb faster than the reef, the reef
    will be submerged within fifty years.
  choice_c: The reef outpaces the lower projection but the higher one overtakes it,
    so its defense holds only under the slower rise.
  choice_d: Since the reef begins higher than the sea, it will protect the shore equally
    well no matter how fast the sea rises.
  choice_e: ''
  correct_answer: C
  explanation: "Two ideas have to be combined. The passage's careful wording is that\
    \ a reef keeps pace with a moderate rise — not any rise. To test that, the reader\
    \ has to compare the reef's growth against each sea-level projection: the reef\
    \ crest stays comfortably above the lower projection, and the gap even widens,\
    \ but the steeper higher projection eventually climbs above the reef crest later\
    \ in the century. So the reef's protection depends on which future the sea follows.\
    \ Choice C states exactly that.\r\nA is true that the reef keeps rising, but rising\
    \ is not enough — the higher line rises faster and passes it, so \"safe under\
    \ either projection\" is wrong. B reverses the picture: the reef clearly outpaces\
    \ the lower projection and is not overtaken by the higher one until near year\
    \ 74, not within fifty years. D leans on the head start the reef has at the start,\
    \ but a starting lead does not last when the higher line climbs more steeply and\
    \ crosses it, so \"equally well no matter how fast\" ignores the very crossing\
    \ the data reveals."
