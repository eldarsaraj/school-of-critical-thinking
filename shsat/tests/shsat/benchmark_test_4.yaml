  question_text: The author emphasizes how unexpected the experiment was mainly by
  choice_a: building suspense by withholding the experiment's outcome until the final
    paragraph.
  choice_b: describing the odd changes to the ants — pig-bristle stilts and trimmed
    legs — in a calm, matter-of-fact way.
  choice_c: stating outright that the results shocked scientists around the world.
  choice_d: comparing the ant's feat to the navigation tools that human sailors once
