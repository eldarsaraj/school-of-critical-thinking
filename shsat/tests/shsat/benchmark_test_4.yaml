  question_text: Which sentence from the passage best shows that the ant's counting
    method cannot adjust once something about the journey changes?
  choice_a: '"But a compass reveals only which direction to face, never how far one
    must travel."'
  choice_b: '"The ants had never measured the ground itself."'
  choice_c: '"The ant trusts its own tally so absolutely that a pair of stilts can
