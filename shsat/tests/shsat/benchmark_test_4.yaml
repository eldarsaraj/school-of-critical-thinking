  question_text: Which version of the sentence is punctuated correctly?
  choice_a: The expedition's final report thanked three institutions, the National
    Museum, which lent equipment, the university, which trained the divers, and a
    local fishing cooperative, which guided the boats.
  choice_b: The expedition's final report thanked three institutions; the National
    Museum, which lent equipment, the university, which trained the divers, and a
    local fishing cooperative, which guided the boats.
  choice_c: 'The expedition''s final report thanked three institutions: the National
    Museum which lent equipment, the university which trained the divers, and a local
    fishing cooperative which guided the boats.'
  choice_d: 'The expedition''s final report thanked three institutions: the National
    Museum, which lent equipment; the university, which trained the divers; and a
    local fishing cooperative, which guided the boats.'
  choice_e: ''
  correct_answer: D
  explanation: "This sentence lists three institutions, and each one carries its own\
    \ comma-filled description (\"which lent equipment,\" and so on). When the items\
    \ in a list already contain commas, the items must be separated by semicolons\
    \ so the reader can tell where one ends and the next begins — and a colon introduces\
    \ the whole list after the complete statement. Choice D uses the colon and the\
    \ three semicolons correctly.\r\nA strings everything together with commas, so\
    \ the three institutions and their descriptions blur into one long, unreadable\
    \ run. B swaps in a single semicolon after \"institutions\" where a colon belongs,\
    \ and still separates the items with commas, so the list is as muddled as before.\
    \ C uses the colon correctly but deletes the commas before each \"which,\" turning\
    \ the extra descriptions into essential (\"restrictive\") clauses and subtly changing\
    \ what the sentence claims about each institution."
