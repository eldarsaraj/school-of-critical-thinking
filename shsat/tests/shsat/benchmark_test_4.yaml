  question_text: The comparison of the grandmother's searching hand to "a bird trying
    to land on water" primarily conveys
  choice_a: the deep exhaustion of a woman who has worked with her hands for far too
    many long years.
  choice_b: the graceful futility of her effort — a skilled hand reaching for a surface
    it can no longer find.
  choice_c: the delicacy and lightness of her touch as she sets each tiny glass bead
    in place.
  choice_d: the freedom she feels now that she no longer has to depend upon her failing
    eyes to work.
  choice_e: ''
  correct_answer: B
  explanation: "A bird cannot land on water — there is no solid place to set down\
    \ — so the image is of an effort that is skilled and patient yet has nothing to\
    \ catch it. The grandmother's hand hovers above the dress, \"patient and lost,\"\
    \ hunting for a surface her eyes can no longer locate for her. Choice B captures\
    \ that mix of grace and hopelessness.\r\nA reads the image as tiredness from years\
    \ of labor, but the point is not fatigue; it is the loss of the sight that once\
    \ guided her hands. C hears \"bird\" as lightness and turns the image into a compliment\
    \ about her delicate touch — yet this is a moment of missing the fabric, not of\
    \ skilled placement. D takes the image as liberation, but \"lost\" and a bird\
    \ that cannot land are pictures of deprivation, the opposite of freedom."
