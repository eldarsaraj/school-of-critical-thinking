  question_text: "Read this sentence.\r\n\r\n\"One of the most persistent myths about\
    \ memory is people who believe they can recall events from infancy.\"\r\n\r\n\
    Which revision corrects the error in the sentence?"
  choice_a: One of the most persistent myths about memory is people believing that
    they can recall events from infancy.
  choice_b: One of the most persistent myths about memory are the people who believe
    they can recall events from infancy.
  choice_c: One of the most persistent myths about memory is that some people believe
    they can recall events from infancy.
  choice_d: One of the most persistent myths about memory is the belief that people
    can recall events from infancy.
  choice_e: ''
  correct_answer: D
  explanation: "The sentence says a \"myth … is people,\" but a myth is not people\
    \ — it is a false idea. The subject (\"myth\") and what follows the verb have\
    \ to match: a myth must equal a belief or a claim. Choice D fixes this: \"the\
    \ myth … is the belief that people can recall events from infancy.\" Now the myth\
    \ equals an idea, which is what a myth is. The error hides because the sentence\
    \ reads smoothly aloud; only checking whether the two sides of \"is\" truly match\
    \ reveals it.\r\nA changes \"people\" to \"people believing,\" but a myth still\
    \ is not \"people believing\" — the mismatch survives in a new form. B swaps \"\
    is\" for \"are,\" which repairs nothing about the meaning and adds a subject-verb\
    \ error, since the subject \"One\" is singular. C reads smoothly but shifts the\
    \ meaning: it says the myth is that people believe they can recall infancy — yet\
    \ people really do hold that belief; the false part is the recall itself, not\
    \ the believing. Only D names the myth correctly as a mistaken belief."
  distractor_types:
    A: introduces_new_error
    B: misattributed_error_location
    C: changes_meaning
- section: ELA
  stage: hard_module
  question_number: 12
  question_type: multiple_choice
  skill: main_idea
  difficulty: medium
  topic: ''
  passage_group_id: ela_h_p1
  passage_title: The Bullet Holes That Weren't There
  passage_text: "During the Second World War, the bombers that returned from raids\
    \ over Europe came home carrying the evidence of what they had survived: long\
    \ rows of bullet holes stitched across their wings, their fuselages, and their\
    \ tails. Because the aircraft were staggeringly expensive and their crews more\
    \ valuable still, the Allied command was determined to bolt protective armor onto\
    \ the planes. Armor, however, is heavy, and a bomber sheathed in steel from nose\
    \ to tail would prove far too sluggish and fuel-hungry to fly its missions at\
    \ all. Since only a few regions of each aircraft could realistically be reinforced,\
    \ the engineers confronted a deceptively simple question: where, exactly, should\
    \ the limited armor be placed?\r\n\r\nThey proceeded in the obvious manner, examining\
    \ one returning plane after another and charting the location of every hole, until\
    \ a striking and consistent pattern emerged. The damage clustered thickly along\
    \ the wings and the main body of the aircraft, yet thinned almost to nothing around\
    \ the engines. The recommendation seemed to write itself: reinforce the metal\
    \ wherever the bullets were most plainly landing, and leave the nearly untouched\
    \ engines alone.\r\nTo settle the matter, the military brought the problem to\
    \ a group of statisticians working at Columbia University, and among them was\
    \ a refugee mathematician named Abraham Wald. Wald studied the same maps the engineers\
    \ had drawn and informed the command that they had reasoned the matter exactly\
    \ backward. The armor, he insisted, belonged where the surviving planes displayed\
    \ no damage at all, which was to say on the engines. His argument turned on a\
    \ fact the engineers had entirely overlooked: their map recorded the wounds of\
    \ the planes that had managed to return, and of those alone.\r\n\r\nWald pressed\
    \ the logic one step further, and it is this step that repays close attention.\
    \ Enemy fire, he observed, does not seek out one part of an aircraft and politely\
    \ spare another; across hundreds of missions, bullets ought to strike a plane\
    \ more or less evenly over its whole surface. If the bombers limping home were\
    \ punctured almost everywhere except the engines, the near-absence of engine damage\
    \ among the survivors could mean only one thing. The planes that had been hit\
    \ in the engines were the very planes that were not coming home. A bomber struck\
    \ there had gone down over the Channel or the fields of occupied France, taking\
    \ its missing data to the bottom of the sea. The clustered holes, then, did not\
    \ mark the deadliest places for a plane to be hit; they marked the places where\
    \ a plane could be hit and still survive.\r\n\r\nThe mistake carries a name today:\
    \ survivorship bias. The sample on which the engineers had relied was, without\
    \ their noticing, filtered in advance by the very outcome they were trying to\
    \ study. By examining survivors alone, they could learn where an aircraft might\
    \ absorb a bullet and endure, but never where a bullet would destroy it, because\
    \ the machines that could have testified to the latter had been removed from the\
    \ record by the crash itself. The blank regions of the map were not evidence of\
    \ safety. They were the most important body of data in the room, and their importance\
    \ lay entirely in the fact that they were empty.\r\n\r\nWald's insight reaches\
    \ far beyond the fate of aircraft. Consider the familiar complaint that \"they\
    \ simply do not build things the way they used to,\" pronounced by anyone admiring\
    \ a barn or a stone bridge that has stood for two centuries. The structures of\
    \ the past can indeed seem sturdier than those of the present, but the flimsy\
    \ buildings of two hundred years ago fell down long ago and were carted away;\
    \ only the strongest specimens survived to be admired today. The past looks well\
    \ built because the passage of time has silently demolished all the evidence to\
    \ the contrary. Whenever a process removes cases from view — the companies that\
    \ collapse before any analyst examines them, the patients who do not live to reach\
    \ the follow-up study, the experiments that fail and are therefore never published\
    \ — what remains is a survivor's remnant, and a conclusion drawn from it may point\
    \ in exactly the wrong direction.\r\n\r\nThe successful are visible while the\
    \ vanished are not, and we are perpetually tempted to study the winners and mistake\
    \ their story for the whole of the story. The discipline Wald demanded is unnatural\
    \ and strenuous: to remember, even while staring at the evidence directly before\
    \ us, to ask what that evidence can never show, and to treat the silence where\
    \ data ought to be as a form of evidence in its own right."
  question_text: Which statement best expresses the central idea of the passage?
  choice_a: Careful measurement and thorough record-keeping are what ultimately solve
    the hardest engineering problems under the pressure of wartime.
  choice_b: Experts will often overlook the obvious solution that an outsider, arriving
    with fresh eyes, can see almost immediately.
  choice_c: Conclusions drawn only from the cases that survive a filter can be exactly
    wrong, because the missing cases often hold the crucial information.
  choice_d: Because statistics can so easily mislead the unwary, no important decision
    should ever be allowed to rest on data alone.
  choice_e: ''
  correct_answer: C
  explanation: "The passage builds one argument: the engineers studied only the planes\
    \ that came back, a sample already filtered by survival, and so their conclusion\
    \ pointed exactly the wrong way. The truly important information lay in the missing\
    \ cases — the planes that never returned, the \"blank regions\" of the map. Choice\
    \ C states that thesis: survivor-only data can reverse the truth, and the absent\
    \ cases matter most.\r\nA praises careful record-keeping, but the engineers were\
    \ careful and still reached the wrong answer; the passage's point is not diligence\
    \ but the hidden bias in the sample. B notes that Wald was an outsider, yet the\
    \ lesson is not \"outsiders see clearly\" — it is a specific flaw in reasoning\
    \ from survivors, which anyone could fall into. D offers a vague moral about data\
    \ being untrustworthy, but the passage does not say to distrust all data; it identifies\
    \ one precise failure — reasoning from a sample that the outcome itself has filtered."
  distractor_types:
    A: wrong_concept
    B: partly_true_but_wrong
    D: too_broad
