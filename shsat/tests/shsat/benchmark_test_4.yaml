  question_text: The passage's remark that a person may experience his own silent
    thoughts as "voices belonging to someone else" most strongly supports which conclusion?
  choice_a: People who hear voices experience them because their inner speech happens
    to be louder than that of most other people.
  choice_b: Inner speech is the only kind of self-generated sensation that the brain
    is ever able to fail to predict.
  choice_c: The brain is generally unable to tell the difference between its own thoughts
    and sounds from the outside world.
  choice_d: The sense that a thought is one's own is not automatic but depends on
    the brain correctly recognizing what it has produced.
  choice_e: ''
  correct_answer: D
  explanation: "The example works only if we see the larger point behind it: feeling\
    \ that a thought is yours is something the brain has to accomplish, by correctly\
    \ tagging what it itself generated. When that tagging fails, a self-produced thought\
    \ can feel as though it comes from outside. So ownership of one's own mental life\
    \ is not a given; it is produced by the same prediction machinery described throughout\
    \ the passage. Choice D draws that conclusion.\r\nA explains the voices by loudness,\
    \ a factor the passage never raises; the issue is mis-tagging, not volume. B takes\
    \ the single example of inner speech and treats it as the only thing the brain\
    \ can misjudge, but the passage presents inner speech as one instance of a general\
    \ mechanism, not the sole one. C overstates the point into a blanket claim that\
    \ the brain generally cannot separate thought from outside sound — yet the passage\
    \ says this happens only when the tagging mechanism fails, not as a rule."
  distractor_types:
    A: wrong_concept
    B: too_broad
    C: too_broad
