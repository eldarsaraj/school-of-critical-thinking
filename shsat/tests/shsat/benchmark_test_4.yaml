  question_text: The poem's repeated language of arithmetic — "subtraction," "geometry,"
    "counting," "the slow arithmetic" — chiefly serves to
  choice_a: present the whole orchard as something cold and mechanical, a lifeless
    place drained of all warmth and living feeling.
  choice_b: suggest that all of nature operates according to exact and unchanging
    mathematical laws.
  choice_c: emphasize how carefully the orchard's former keepers once measured, counted,
    and pruned each tree.
  choice_d: trace a shift from the trees as figures of loss ("subtraction") to the
    roots as a patient counting toward renewal and light.
  choice_e: ''
  correct_answer: D
  explanation: "The math imagery changes meaning as the poem moves. At first it marks\
    \ emptiness and loss: the branches are \"subtraction against the sky,\" a \"cold\
    \ geometry of having borne.\" But by the end the same vocabulary turns hopeful\
    \ — the roots are \"counting … the slow arithmetic back toward light.\" The metaphor\
    \ carries the poem from negation to expectation, mirroring its larger turn from\
    \ apparent death to waiting. Choice D captures that movement.\r\nA stops at the\
    \ chill of the early images and misses the reversal; the arithmetic ends up expressing\
    \ hidden life, not lifelessness. B inflates the imagery into a claim that nature\
    \ runs on mathematical laws — a general idea the poem never asserts. C takes \"\
    arithmetic\" literally, as human measuring and pruning, but the counting in the\
    \ poem belongs to the roots, not to absent gardeners."
