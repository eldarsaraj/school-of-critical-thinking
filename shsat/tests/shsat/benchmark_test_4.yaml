  passage_title: The Winter Orchard
  passage_text: "Nobody comes to the orchard now.\r\nThe gate has forgotten the shape\
    \ of a hand,\r\nand the path, uncertain, loses itself\r\nin a grammar of weeds\
    \ gone to seed.\r\n\r\nThe trees stand in their black arithmetic,\r\neach branch\
    \ a subtraction against the sky,\r\nholding nothing — no leaf, no fruit —\r\n\
    only the cold geometry of having borne.\r\n\r\nAnd yet the shapes are the same\
    \ shapes:\r\nthis bough still cups the ghost of an apple,\r\nthat fork still cradles\
    \ the memory of weight\r\nit carried through a hundred vanished summers.\r\n\r\
    \nA stranger would call them dead.\r\nBut the roots are only reading the dark,\r\
    \ncounting, the way a sleeper counts,\r\nthe slow arithmetic back toward light.\r\
    \n\r\nWhat looks like ending is a kind of waiting,\r\na patience so deep it resembles\
    \ stone.\r\nThe orchard is not finished with the world.\r\nIt is only holding\
    \ its breath."
  question_text: Which statement best expresses a central idea of the poem?
  choice_a: The orchard has calmly accepted its own death, waiting for the end the
    way a sleeper drifts off.
  choice_b: The orchard endures the winter by living on the memory of the fruit it
    once bore, sustained by its past rather than any future.
  choice_c: Though it appears dead, the orchard is alive and dormant, its bare stillness
    a patient waiting for spring's return.
  choice_d: Life and death are not opposites but merely different names for how patiently
    a living thing is willing to wait.
  choice_e: ''
  correct_answer: C
  explanation: "The poem turns on the difference between how the orchard looks and\
    \ what it is. It looks dead — \"black arithmetic,\" branches \"holding nothing\"\
    \ — but \"the roots are only reading the dark, / counting … the slow arithmetic\
    \ back toward light.\" The waiting points forward, toward spring: the orchard\
    \ \"is not finished with the world.\" Choice C holds both the appearance (seems\
    \ dead) and the reality (alive, waiting to renew).\r\nA uses the poem's own \"\
    sleeper\" image but sends it the wrong way — toward death and \"the end\" — when\
    \ the roots are counting toward light, that is, toward return, not extinction.\
    \ B leans on the \"ghost of an apple\" and \"memory of weight,\" but those are\
    \ backward-looking details; the poem's point is future renewal, not survival on\
    \ memory. D lifts off into a grand abstraction about life and death being the\
    \ same thing, a philosophical claim far larger and vaguer than the specific, hopeful\
    \ dormancy the poem actually describes."
  distractor_types:
    A: changes_meaning
    B: partly_true_but_wrong
    D: too_broad
