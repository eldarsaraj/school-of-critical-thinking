  question_text: A fruit punch is made by mixing cranberry juice and soda in a ratio
    of 3 to 5. If a batch uses 15 cups of cranberry juice, how many cups of soda are
    used?
  choice_a: '9'
  choice_b: '25'
  choice_c: '40'
  choice_d: '75'
  choice_e: ''
  correct_answer: B
  explanation: "The ratio 3 to 5 means every 3 cups of cranberry juice go with 5 cups\
    \ of soda. The 15 cups of cranberry juice is 15 ÷ 3 = 5 times the \"3\" in the\
    \ ratio, so the soda is 5 times its share: 5 × 5 = 25 cups.\r\nA (9) comes from\
    \ flipping the ratio and multiplying by 3/5 instead of 5/3: 15 × 3/5 = 9 — the\
    \ ratio was used upside down. C (40) is the size of the whole batch (15 cups of\
    \ juice + 25 cups of soda), not the amount of soda alone. D (75) comes from multiplying\
    \ the 15 cups directly by the other ratio number, 5, without first dividing by\
    \ the 3 — skipping the step of finding how many times the ratio fits."
