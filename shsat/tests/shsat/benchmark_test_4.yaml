  passage_text: "The wedding dress had to be finished by Friday, and my grandmother\
    \ had been going blind since spring.\r\n\r\nNeither of us said the second part\
    \ aloud. We said only the first, over and over, in the small back room where she\
    \ had sewn for the families of our town for forty years — had to be finished by\
    \ Friday, as though Friday were a weather front we could prepare for with enough\
    \ thread. The dress belonged to a bride named Clara Ferrante, who would arrive\
    \ Saturday morning to try it on, and it hung now on a headless dress form in the\
    \ corner, pale as the inside of a shell, waiting for the last of its work: two\
    \ hundred tiny glass beads to be sewn along the neckline, each one no larger than\
    \ a grain of rice.\r\n\r\nMy grandmother had done the beadwork on every wedding\
    \ dress she had ever made. It was the part she was known for, the part brides\
    \ drove in from three towns over to ask for by name. She could set a bead in the\
    \ time it took me to thread a needle, her fingers moving with a certainty that\
    \ had nothing to do with looking, and for most of my life I had believed the certainty\
    \ came from her eyes.\r\n\r\nThat June I learned it had never been her eyes at\
    \ all. It was her hands that knew, and her hands were fine. What had failed was\
    \ the narrow bridge between them and the world — the seeing that told the hands\
    \ where to begin. She would lower the needle toward the fabric and stop it half\
    \ an inch too high, or too far to the left, hunting for a surface she could no\
    \ longer quite locate, and then she would set the needle down and say the light\
    \ was poor, though the afternoon sun came through the west window like something\
    \ poured.\r\nThe first time I saw her miss, I felt the floor of my childhood tilt.\
    \ I was thirteen. You are supposed to spend those years discovering that your\
    \ grandmother is a person, ordinary and mortal, but I had not expected to learn\
    \ it from the way her hand searched the air above a wedding dress, patient and\
    \ lost, like a bird trying to land on water.\r\n\r\nSo I began to help her without\
    \ either of us deciding that I would.\r\n\r\nIt started with small things. I moved\
    \ the beads closer to her hand so she would not have to feel for the dish. I re-threaded\
    \ her needle when the thread slipped, and pretended the thread was at fault. When\
    \ she set a bead too far from the line, I would say, in the bored voice of a girl\
    \ with nothing better to do, that I wanted to practice, and she would surrender\
    \ the fabric to me with a sigh, as if she were doing me a favor, and I would place\
    \ the bead where it belonged and three or four more beside it before handing the\
    \ work back so she could feel the row and approve it.\r\n\r\nShe always approved\
    \ it. She would run her thumb along the beads I had set, reading them the way\
    \ she read everything now, by touch, and she would nod and say, \"You have a steady\
    \ hand. It skips a generation, sometimes.\" And I would say nothing, because to\
    \ answer would have been to admit what we were doing, and what we were doing only\
    \ worked so long as neither of us admitted it.\r\n\r\nThere is a particular kind\
    \ of lie that is really a form of love, and I was learning to tell it. Each afternoon\
    \ I did a little more of the dress and let her believe she had done a little less\
    \ of nothing. I learned to match the tension of her stitches so the beadwork would\
    \ look like one hand had done it, which, on the parts that mattered, one hand\
    \ had. I learned to praise the poor light before she could, so that the light\
    \ became our excuse rather than her eyes, a thing outside us both that neither\
    \ of us needed to be ashamed of.\r\n\r\nOn Thursday there were forty beads left,\
    \ and my grandmother's hands were slower than I had ever seen them. She had been\
    \ at the window since morning. When I came in she did not turn, and for a moment\
    \ I thought she had fallen asleep sitting up, the way she sometimes did now, but\
    \ her eyes were open, aimed at the dress form and the pale dress and the empty\
    \ place where the last beads would go.\r\n\r\n\"Clara Ferrante,\" she said, \"\
    has her mother's shoulders. Wide. I made her mother's dress too.\" She paused.\
    \ \"I cannot see the neckline anymore, Mira.\"\r\n\r\nI stood very still. It was\
    \ the first true thing either of us had said since spring, and it hung in the\
    \ room with the dust and the poured light.\r\n\"I know,\" I said.\r\n\r\nShe nodded\
    \ slowly, as though I had confirmed something she had spent a long time proving\
    \ to herself. Then she held out the fabric to me, not with a sigh this time, not\
    \ as a favor she was granting, but plainly, the way you hand someone a tool when\
    \ the work has passed to them.\r\n\r\n\"Then you will finish it,\" she said. \"\
    And you will not tell me the light is bad. The light is fine. Say the light is\
    \ fine.\"\r\n\r\n\"The light is fine,\" I said.\r\n\r\nI sat down where she had\
    \ been sitting, in the warm hollow her body had left in the chair, and I took\
    \ up the needle, and I set the last forty beads along the neckline of Clara Ferrante's\
    \ wedding dress while my grandmother sat beside me with her hands folded in her\
    \ lap, not watching, because she could not, but listening — to the small click\
    \ of glass against glass, the pull of thread through cloth, the sound of a thing\
    \ being finished on time. When I tied off the final knot she knew it without being\
    \ told. She reached over and found my hand and pressed it once, hard, and neither\
    \ of us said anything at all, because some things are too true to be spoiled by\
    \ saying, and the dress was done, and it was beautiful, and on Saturday the bride\
    \ would never know how many hands had made it, or whose."
