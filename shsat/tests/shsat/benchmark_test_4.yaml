  question_type: multiple_choice
  skill: usage_agreement
  difficulty: hard
  topic: ''
  passage_group_id: ela_h_re
  passage_title: The Map That Lies to Tell the Truth
  passage_text: "(1) Every flat map of a round world must distort something, and the\
    \ one that hangs in most classrooms distorts size. (2) Drawn up in 1569 by the\
    \ Flemish geographer Gerardus Mercator, the projection stretches the globe onto\
    \ a rectangle so that the compass lines on which sailors depend run perfectly\
    \ straight. (3) The distortion is negligible near the equator, but it worsens\
    \ with every degree of latitude, until near the poles the landmasses swell grotesquely\
    \ beyond their true proportions. (4) On such a map the exaggerated size of Greenland\
    \ looks far greater than Africa, even though the continent's real area is roughly\
    \ fourteen times that of the island. (5) The result is not a minor blemish but\
    \ a wholesale rearrangement of the visible world.\r\n\r\n(6) The purpose of the\
    \ projection was never to weigh one nation against another, it was to keep ships\
    \ from being lost. (7) A captain who ruled a straight line between two distant\
    \ harbors could hold to a single compass bearing all the way across the open water,\
    \ a feat that no earlier chart had ever made so effortless. (8) Before Mercator,\
    \ a navigator plotting a long voyage had to break it into many short segments,\
    \ adjusting his heading again and again as the curved lines of older maps demanded.\
    \ (9) For the urgent business of survival at sea, the distortion of distant coastlines\
    \ was a price the maritime world paid without the slightest complaint.\r\n\r\n\
    (10) In time the projection migrated from the ship's deck to the schoolroom wall,\
    \ and there its distortions began to shape something other than voyages. (11)\
    \ A handful of reformers who studied its influence grew increasingly uneasy about\
    \ the lesson it silently taught. (12) They noticed that the wealthy nations of\
    \ the far north loomed enormous on the classroom wall, while the crowded countries\
    \ near the equator were shrunk to a fraction of their real extent. (13) A child\
    \ raised on that image, they warned, absorbs a hierarchy of nations long before\
    \ a single word of geography is spoken aloud. (14) The reformers urged teachers\
    \ to hang honest, equal-area maps beside the older charts so that students might\
    \ at last see how severely they had exaggerated the lands of the north. (15) A\
    \ wall map, however, is a stubborn institution, and the Mercator projection, at\
    \ once familiar and strangely reassuring, has clung tenaciously to its place for\
    \ four and a half centuries."
  question_text: Which revision of sentence 4 corrects the mistake?
  choice_a: On such a map the exaggerated size of Greenland looks far greater than
    Africa does, even though the continent's real area is roughly fourteen times that
    of the island.
  choice_b: On such a map the exaggerated size of Greenland looks far and away greater
    than Africa, even though the continent's real area is roughly fourteen times that
    of the island.
  choice_c: On such a map the exaggerated size of Greenland looks far greater than
    that of Africa, even though the continent's real area is roughly fourteen times
    that of the island.
  choice_d: On such a map Greenland's exaggerated size looks far greater than Africa,
    even though the continent's real area is roughly fourteen times that of the island.
  choice_e: ''
  correct_answer: C
  explanation: "The sentence compares two sizes, so both sides of \"greater than\"\
    \ must be sizes. As written, \"the exaggerated size of Greenland\" is measured\
    \ against \"Africa\" — a size set against a whole continent, which do not match.\
    \ The fix is \"greater than that of Africa,\" where \"that of\" stands for \"\
    the size of,\" so a size is compared to a size. Choice C. The sentence reads smoothly\
    \ either way, so the ear is no help; the reader has to check what the two sides\
    \ of the comparison actually name.\r\nA adds \"does\" (\"than Africa does\"),\
    \ but Africa does not \"look greater,\" and the noun mismatch — a size against\
    \ a continent — survives. B inserts the intensifier \"far and away,\" making the\
    \ gap sound larger while leaving the faulty comparison untouched. D reshuffles\
    \ the opening into \"Greenland's exaggerated size\" but still compares it to \"\
    Africa,\" so the wrong part was rewritten and the actual error remains."
  distractor_types:
    A: introduces_new_error
    B: overcorrection
    D: misattributed_error_location
