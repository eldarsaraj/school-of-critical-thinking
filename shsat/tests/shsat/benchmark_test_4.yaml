  question_text: Which conclusion about the ant's journey home is best supported by
    the passage?
  choice_a: The ant can find a direct route home only if both its direction sense
    and its step count stay accurate.
  choice_b: The ant reads a pattern in scattered sunlight that human eyes cannot detect.
  choice_c: The ant relies more on counting its steps than on reading the sky.
  choice_d: The ant's straight path home proves that it must remember the landmarks
    it passed along the way.
  choice_e: ''
  correct_answer: A
  explanation: "The passage explains that the ant needs a direction (from the sky)\
    \ and a distance (from counting steps), and that throwing off either one — as\
    \ the stilt experiment throws off the step count — sends the ant to the wrong\
    \ place. Putting those ideas together leads to the conclusion that the route home\
    \ works only when both parts are accurate. The passage never says this in a single\
    \ sentence; the reader has to assemble it, which is what a conclusion requires.\r\
    \nB is a true statement copied almost word for word from the passage, but it describes\
    \ only the compass and does not draw any conclusion about the trip home, so it\
    \ answers a different question than the one asked. C ranks steps above the sky,\
    \ yet the passage treats both as necessary and never says one matters more. D\
    \ contradicts the passage directly: the text stresses that the landscape offers\
    \ \"no obvious landmarks\" and that the ant counts steps rather than remembering\
    \ the ground, so landmark memory is exactly what it does not use."
  distractor_types:
