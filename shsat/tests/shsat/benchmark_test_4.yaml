  topic: ''
  passage_group_id: ela_r_re
  passage_title: The Box that Shrank the World
  passage_text: "(1) For most of recorded history, loading a cargo ship was an undertaking\
    \ of brute and patient labor, performed by gangs of longshoremen who carried,\
    \ rolled, and stacked each barrel, sack, and crate by hand across many days on\
    \ a single vessel. (2) A ship might spend as many days lashed to the dock as it\
    \ spent crossing the open ocean, and the cost of loading it by hand was sometimes\
    \ greater than the voyage itself. (3) Cargo also sat exposed on crowded piers,\
    \ where a substantial share of it was pilfered, damaged, or simply lost before\
    \ it was ever stowed below.\r\n\r\n(4) Then, in 1956, a self-made trucking magnate\
    \ named Malcolm McLean posed a question that no shipping executive had thought\
    \ to ask: why unload the truck at all? (5) Having never spent a single day working\
    \ at sea, the entire shipping establishment was certain that an outsider who hauled\
    \ freight along highways could teach it nothing worth knowing. (6) McLean ignored\
    \ them, for his insight was to stop thinking about the goods and to start thinking\
    \ about the boxes that held them. (7) Identical steel containers could be hoisted\
    \ straight from a truck bed onto a ship, and no hand would ever touch the contents\
    \ inside.\r\n\r\n(8) The whole system, however, depended upon one profoundly unglamorous\
    \ breakthrough, a standardized set of dimensions that every port, railroad, and\
    \ crane maker on earth could agree to build around. (9) Without that dull consensus,\
    \ a container loaded in one harbor would have been useless in the next. (10) The\
    \ reason the container conquered global trade so swiftly was because it converted\
    \ a ship's most wasteful hours, the idle days once squandered loading in port,\
    \ into profitable hours spent at sea.\r\n\r\n(11) The consequences reached far\
    \ beyond the waterfront. (12) Inexpensive and dependable shipping made distant\
    \ factories practical, encouraged corporations to scatter their production across\
    \ a dozen countries, and the entire map of global manufacturing was redrawn. (13)\
    \ Raw steel and bulk grain still traveled much as they always had, yet the finished\
    \ goods on store shelves grew stranger in origin and cheaper in price. (14) In\
    \ the end, the humble steel box did something to distance that made it matter\
    \ a great deal less in the final cost of very nearly everything an ordinary person\
    \ buys."
  question_text: Which revision corrects the error in sentence 2?
  choice_a: A ship might spend as many days lashed to the dock as it spent crossing
    the open ocean, and the cost of loading it by hand was sometimes greater than
    the cost of the entire voyage.
  choice_b: A ship might spend as many days lashed to the dock as it spent crossing
    the open ocean, and the cost of loading it by hand was sometimes greater than
    the entire voyage could be.
  choice_c: A ship might spend as many days lashed to the dock as it spent crossing
    the open ocean, and loading it by hand was sometimes a greater cost than the voyage
    itself.
  choice_d: A ship might spend as many days lashed to the dock as it spent crossing
    the open ocean, and the cost of loading it by hand was sometimes far and away
    greater than the voyage itself.
  choice_e: ''
  correct_answer: A
  explanation: "The sentence compares two costs, so both sides of \"greater than\"\
    \ must name a cost. The original compares \"the cost of loading\" to \"the voyage\
    \ itself\" — a cost measured against an event, which do not match. The fix is\
    \ to compare cost to cost: \"greater than the cost of the entire voyage.\" Choice\
    \ A does this, and it reads so smoothly that the ear alone will not catch the\
    \ problem — the reader has to check what is actually being compared.\r\nB keeps\
    \ a mismatch and adds awkwardness: \"greater than the entire voyage could be\"\
    \ still sets a cost against the voyage and leaves the thought unfinished. C reshuffles\
    \ the wording so that \"loading it by hand\" becomes \"a greater cost,\" but it\
    \ is still measured \"than the voyage itself,\" so the two sides remain unmatched.\
    \ D simply inserts the emphatic \"far and away\" while leaving the faulty comparison\
    \ exactly as it was — a louder version of the same error."
  distractor_types:
    B: introduces_new_error
    C: misattributed_error_location
    D: overcorrection
