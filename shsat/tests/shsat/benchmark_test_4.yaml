  question_text: "Read this sentence.\r\n\r\n\"The storm caused a lot of damage to\
    \ the coastal town and knocked out power for a long time.\"\r\n\r\nWhich revision\
    \ of the sentence uses the most precise language?"
  choice_a: The storm destroyed more than 200 homes in the coastal town and knocked
    out power for a considerable stretch of time.
  choice_b: The storm caused widespread destruction across the coastal town and knocked
    out power for eleven days.
  choice_c: The storm destroyed more than 200 homes in the coastal town and knocked
    out power for eleven days.
  choice_d: The storm devastated the coastal town, destroying countless homes and
    cutting power for nearly two weeks.
  choice_e: ''
  correct_answer: C
  explanation: "Precise language turns vague words into exact, checkable facts. The\
    \ original has two vague spots — \"a lot of damage\" and \"a long time.\" Choice\
    \ C fixes both: \"more than 200 homes\" and \"eleven days.\" Every fuzzy phrase\
    \ becomes specific.\r\nA sharpens the damage (\"more than 200 homes\") but leaves\
    \ the duration vague (\"a considerable stretch of time\"), so it is precise in\
    \ one place and loose in the other. B is the mirror image: exact on the eleven\
    \ days but vague on \"widespread destruction.\" D sounds dramatic but loses precision\
    \ — \"countless homes\" claims the number cannot be counted, and \"nearly two\
    \ weeks\" is less exact than \"eleven days,\" so it also drifts in meaning."
  distractor_types:
    A: less_precise
    B: too_broad
    D: changes_meaning
