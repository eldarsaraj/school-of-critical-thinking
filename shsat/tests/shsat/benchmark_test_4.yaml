  question_text: A shop sold 2 jackets at $50 each, 3 jackets at $30 each, and 5 jackets
    at $22 each. What was the average price per jacket sold?
  choice_a: $22
  choice_b: $26
  choice_c: $30
  choice_d: $34
  choice_e: ''
  correct_answer: C
  explanation: "To find the average price per jacket, add up all the money taken in\
    \ and divide by the total number of jackets. The revenue is (2 × $50) + (3 × $30)\
    \ + (5 × $22) = $100 + $90 + $110 = $300, and 2 + 3 + 5 = 10 jackets were sold,\
    \ so the average is $300 ÷ 10 = $30.\r\nA ($22) is just the most common price\
    \ — the price of the 5 cheapest jackets — grabbed as if the most frequent value\
    \ were the average. B ($26) is the median price (the middle of the ten prices),\
    \ not the mean the question asks for. D ($34) averages only the three different\
    \ price tags, (50 + 30 + 22) ÷ 3, ignoring how many jackets sold at each price;\
    \ the average must be weighted by the number sold."
