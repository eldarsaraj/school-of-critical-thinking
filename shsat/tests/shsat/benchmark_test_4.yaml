  question_text: Each number in a sequence is 3 more than twice the number that comes
    just before it. If 53 is a number in the sequence, what number comes just before
    it?
  choice_a: '109'
  choice_b: '50'
  choice_c: '28'
  choice_d: '25'
  choice_e: ''
  correct_answer: D
  explanation: "If the number before 53 is x, then the rule says 53 = 2x + 3. Work\
    \ backward: subtract 3 from both sides to get 2x = 50, then divide by 2 to get\
    \ x = 25. Check: 2 × 25 + 3 = 53. ✓\r\nA (109) applies the rule the wrong way,\
    \ forward instead of backward: 2 × 53 + 3 = 109, which is the number that comes\
