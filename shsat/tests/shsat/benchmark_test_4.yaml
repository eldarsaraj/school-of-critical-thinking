- section: ELA
  stage: easy_module
  question_number: 1
  question_type: multiple_choice
  skill: sentence_structure
  difficulty: easy
  topic: ''
  passage_group_id: ela_e_re
  passage_title: The Repair Café
  passage_text: "(1) On the first Saturday of each month, a community center in Amsterdam\
    \ fills with the smell of warm solder and the steady hum of sewing machines. (2)\
    \ Clutching dented kettles, tangled cords, and torn coats, the folding tables\
    \ slowly fill as the first visitors arrive. (3) The gathering is called a Repair\
    \ Café, and it began in 2009, when a journalist named Martine Postma grew tired\
    \ of watching perfectly usable objects disappear into neighborhood landfills.\r\
    \n\r\n(4) The concept behind the events is remarkably simple. (5) Volunteers who\
    \ understand how ordinary machines work sit waiting at long tables. (6) Visitors\
    \ arrive carrying a household item that has stopped working. (7) The volunteer\
    \ and the visitor then repair the object together, an arrangement that teaches\
    \ the visitor something about how the item was assembled in the first place. (8)\
    \ A lamp that seemed hopeless often needs only a single inexpensive part, this\
    \ discovery surprises almost everyone who witnesses it.\r\n\r\n(9) Repair Cafés\
    \ have since spread to more than thirty countries around the world. (10) Amsterdam\
    \ is also famous for its canals, which attract millions of tourists every year.\
    \ (11) Some critics argue that gatherings like these cannot solve the enormous\
    \ problem of waste on there own. (12) They observe that a single volunteer holding\
    \ a screwdriver is no match for factories that deliberately design their products\
    \ to fail.\r\n\r\n(13) Supporters of the movement respond by proposing an entirely\
    \ different measure of success. (14) A Repair Café teaches ordinary people to\
    \ see a broken object as a puzzle to be solved rather than as garbage to be discarded.\
    \ (15) Consequently, that change in attitude, defenders insist, outlasts any single\
    \ afternoon of repairs. (16) The gatherings also rescue practical knowledge that\
    \ might otherwise vanish within a generation. (17) An older volunteer who once\
    \ repaired clocks professionally can hand that vanishing skill to a curious teenager\
    \ in a little under an hour. (18) In the end, the crowded tables hold far more\
    \ than tools, they hold a patient argument about what a community owes to the\
    \ things it builds and then abandons."
  question_text: Which revision corrects the error in sentence 2?
  choice_a: Clutching dented kettles, tangled cords, and torn coats, the folding tables
    slowly fill as the first visitors are arriving.
  choice_b: As the first visitors arrive clutching dented kettles, tangled cords,
    and torn coats, the folding tables slowly fill.
  choice_c: The folding tables, clutching dented kettles, tangled cords, and torn
    coats, slowly fill as the first visitors arrive.
  choice_d: Clutching dented kettles, tangled cords, and torn coats, the folding tables
    are slowly filled as the first visitors arrive.
  choice_e: ''
  correct_answer: B
  explanation: "The opening phrase \"Clutching dented kettles, tangled cords, and\
    \ torn coats\" describes whoever is holding those items. In the original sentence\
    \ the phrase sits right in front of \"the folding tables,\" so it claims the tables\
    \ are doing the clutching — which is impossible. The people clutching the broken\
    \ items are the visitors, so the sentence must be rebuilt to connect the phrase\
    \ to them. Choice B does this by making \"the first visitors\" the ones who \"\
    arrive clutching,\" and the tables simply fill.\r\nA only changes \"arrive\" to\
    \ \"are arriving\"; the descriptive phrase is still attached to the tables, so\
    \ the real problem is untouched. C moves the phrase into the middle of the sentence\
    \ but still places it next to \"the folding tables,\" so the tables are still\
    \ doing the clutching. D switches the sentence to the passive \"are slowly filled,\"\
    \ a cosmetic change that leaves the phrase dangling on the tables and adds awkwardness\
    \ without fixing the meaning."
  distractor_types:
    A: misattributed_error_location
    C: wrong_placement
