    A: less_precise
    B: introduces_new_error
    D: changes_meaning
- section: ELA
  stage: hard_module
  question_number: 6
  question_type: multiple_choice
  skill: main_idea
  difficulty: hard
  topic: ''
  passage_group_id: ela_h_re
  passage_title: The Map That Lies to Tell the Truth
  passage_text: "(1) Every flat map of a round world must distort something, and the\
    \ one that hangs in most classrooms distorts size. (2) Drawn up in 1569 by the\
    \ Flemish geographer Gerardus Mercator, the projection stretches the globe onto\
    \ a rectangle so that the compass lines on which sailors depend run perfectly\
    \ straight. (3) The distortion is negligible near the equator, but it worsens\
    \ with every degree of latitude, until near the poles the landmasses swell grotesquely\
    \ beyond their true proportions. (4) On such a map the exaggerated size of Greenland\
    \ looks far greater than Africa, even though the continent's real area is roughly\
    \ fourteen times that of the island. (5) The result is not a minor blemish but\
    \ a wholesale rearrangement of the visible world.\r\n\r\n(6) The purpose of the\
    \ projection was never to weigh one nation against another, it was to keep ships\
    \ from being lost. (7) A captain who ruled a straight line between two distant\
    \ harbors could hold to a single compass bearing all the way across the open water,\
    \ a feat that no earlier chart had ever made so effortless. (8) Before Mercator,\
    \ a navigator plotting a long voyage had to break it into many short segments,\
    \ adjusting his heading again and again as the curved lines of older maps demanded.\
    \ (9) For the urgent business of survival at sea, the distortion of distant coastlines\
    \ was a price the maritime world paid without the slightest complaint.\r\n\r\n\
    (10) In time the projection migrated from the ship's deck to the schoolroom wall,\
    \ and there its distortions began to shape something other than voyages. (11)\
    \ A handful of reformers who studied its influence grew increasingly uneasy about\
    \ the lesson it silently taught. (12) They noticed that the wealthy nations of\
    \ the far north loomed enormous on the classroom wall, while the crowded countries\
    \ near the equator were shrunk to a fraction of their real extent. (13) A child\
    \ raised on that image, they warned, absorbs a hierarchy of nations long before\
    \ a single word of geography is spoken aloud. (14) The reformers urged teachers\
    \ to hang honest, equal-area maps beside the older charts so that students might\
    \ at last see how severely they had exaggerated the lands of the north. (15) A\
    \ wall map, however, is a stubborn institution, and the Mercator projection, at\
    \ once familiar and strangely reassuring, has clung tenaciously to its place for\
    \ four and a half centuries."
  question_text: Which concluding sentence would best capture the central idea of
    the passage?
  choice_a: Mercator's projection endures in classrooms today only because no one
    has yet managed to draw a flat map that keeps every single country's size and
    shape perfectly true.
  choice_b: The lesson of Mercator's map is that no flat map can ever be trusted,
    since every projection sacrifices truth for the sake of convenience.
  choice_c: Because it distorts the relative sizes of nations so severely, the Mercator
    projection ought to be removed from every classroom without any further delay.
  choice_d: A tool built to solve a sailor's problem became, on the classroom wall,
    a distortion of how the world's nations are seen — and there it has stubbornly
    stayed.
  choice_e: ''
  correct_answer: D
  explanation: "The passage traces one arc: an honest navigation tool (straight compass\
    \ lines for sailors) becomes, when hung in a classroom, a quiet source of a distorted\
    \ picture of the world's nations — and it persists anyway. Choice D holds all\
    \ three beats: the original purpose, the distortion of worldview, and the stubborn\
    \ survival.\r\nA gives the wrong reason for the map's survival. The passage says\
    \ honest equal-area maps do exist and keep sizes true; the map endures because\
    \ a \"wall map … is a stubborn institution,\" out of habit, not because no fair\
    \ map can be drawn. B inflates the point into blanket distrust of all maps, but\
    \ the passage is about this specific size-distortion shaping how nations are seen,\
    \ not a warning that no map can be believed. C leaps to a call for action — remove\
    \ the map \"without delay\" — that the reflective, descriptive passage never issues."
  distractor_types:
    A: partly_true_but_wrong
    B: too_broad
    C: inference_leap
- section: ELA
  stage: hard_module
  question_number: 7
  question_type: multiple_choice
  skill: usage_agreement
  difficulty: hard
  topic: ''
  passage_group_id: ''
  passage_title: ''
  passage_text: ''
  question_text: "Read this sentence.\r\n\r\n\"Unlike the calm, predictable orbits\
    \ of the outer planets, astronomers have found that comets travel on wildly elongated\
    \ paths that can carry them far beyond Neptune.\"\r\n\r\nWhich revision corrects\
    \ the faulty comparison in the sentence?"
  choice_a: Unlike the calm, predictable orbits of the outer planets, astronomers
    have found comets to travel on wildly elongated paths that can carry them far
    beyond Neptune.
  choice_b: Unlike the very calm and predictable orbits of the outer planets, astronomers
    have found that comets travel on wildly elongated paths that can carry them far
    beyond Neptune.
  choice_c: Unlike the outer planets, which follow calm, predictable orbits, comets
    travel on wildly elongated paths that can carry them far beyond Neptune.
  choice_d: Unlike the calm, predictable orbits of the outer planets, comets are what
    astronomers have found to travel on wildly elongated paths far beyond Neptune.
  choice_e: ''
  correct_answer: C
  explanation: "An opening \"Unlike ___\" phrase must be followed by something that\
    \ can be compared to it. As written, \"Unlike the calm, predictable orbits of\
    \ the outer planets\" is followed by \"astronomers\" — so the sentence compares\
    \ orbits to astronomers, which do not match. The clean fix compares like to like.\
    \ Choice C sets \"the outer planets\" (which follow calm orbits) against \"comets,\"\
    \ two kinds of bodies that can properly be compared.\r\nA only reshuffles the\
    \ main clause to \"astronomers have found comets to travel,\" but the introductory\
    \ phrase still lands on \"astronomers,\" so orbits are still compared to astronomers.\
    \ B pads the opening phrase with \"very … and\" and leaves the mismatch exactly\
    \ where it was. D makes \"comets\" the subject but in an awkward cleft (\"comets\
    \ are what astronomers have found to travel\"), and it still sets the orbits against\
    \ comets rather than against another set of bodies."
  distractor_types:
    A: misattributed_error_location
    B: overcorrection
    D: introduces_new_error
