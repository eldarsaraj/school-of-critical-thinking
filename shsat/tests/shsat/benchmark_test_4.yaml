  choice_a: A captain who drew a straight line between two faraway harbors could just
    keep to one bearing the whole way across, which no older chart ever let him do.
  choice_b: A captain, ruling a straight line between two distant harbors, and holding
    to a single compass bearing across the ocean, a convenience no earlier chart had
    offered.
  choice_c: A captain who ruled a straight line between two distant harbors could
    hold to a single compass bearing across the entire ocean, an ease no earlier chart
    had ever afforded.
  choice_d: A captain who ruled a straight line between two distant harbors could
    hold to a single compass bearing across the ocean, guaranteeing that he would
    never once drift off course.
  choice_e: ''
  correct_answer: C
  explanation: "The passage keeps an elevated, formal register throughout (\"negligible,\"\
    \ \"grotesquely,\" \"without the slightest complaint\"). The best revision matches\
    \ that dignity while saying the same thing. Choice C does — \"hold to a single\
    \ compass bearing … an ease no earlier chart had ever afforded\" — staying formal\
    \ and faithful.\r\nA slides into casual speech (\"just keep to one bearing,\"\
    \ \"faraway,\" \"let him do\"), breaking the tone. B sounds formal but is not\
    \ a sentence at all — \"A captain … and holding … a convenience\" has no main\
    \ verb, so it is a fragment. D keeps the formal tone but changes the meaning:\
    \ \"guaranteeing that he would never once drift off course\" claims a certainty\
    \ the original never promised, overstating what a single bearing could do."
