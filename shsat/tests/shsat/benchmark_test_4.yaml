  question_type: multiple_choice
  skill: evidence_selection
  difficulty: medium
  topic: ''
  passage_group_id: ela_e_p3
  passage_title: The Wall that Builds Itself
  passage_text: "At the lowest tide of the month the reef breaks the surface like\
    \ the spine of some half-buried animal, and Marisol Vega wades out to meet it.\
    \ A coastal ecologist who has studied this stretch of the Chesapeake for eleven\
    \ years, she crouches over the jagged gray mass and turns her ear toward it. The\
    \ reef is loud. Water hisses through a million shells, small crabs tick against\
    \ one another in the shadows, and here and there an oyster, briefly exposed to\
    \ the air, pulls itself shut with an audible clap. \"People look at this and see\
    \ a rock,\" Vega says. \"What they are really hearing is the wall defending itself.\"\
    \r\n\r\nThe wall she means is not the reef alone but the idea behind it, an idea\
    \ now spreading along the eastern coast of the United States, where towns that\
    \ once answered a rising sea with poured concrete have begun to plant living oysters\
    \ instead, wagering that biology can accomplish what engineering has struggled\
    \ for a century to guarantee. That century of engineering produced the seawall,\
    \ a slab of concrete set squarely between the town and the tide, and for generations\
    \ it was simply what a threatened shoreline bought. Yet a seawall carries a defect\
    \ written into it from the very first day. \"The morning you pour a seawall is\
    \ the best day of its life,\" says Tomas Brill, a coastal engineer who has designed\
    \ dozens of them. \"From that morning on, it is only getting weaker.\"\r\n\r\n\
    The reasons are ordinary and relentless: waves excavate the sand from beneath\
    \ a wall until whole sections hang unsupported over hollow space, while salt water\
    \ threads into hairline fractures, freezes, and pries them steadily wider. Storm\
    \ after storm the barrier surrenders a little more of its strength, until after\
    \ roughly thirty years it must be demolished and reconstructed from nothing. An\
    \ oyster reef, left undisturbed in the water that suits it, spends those same\
    \ decades performing the exact opposite feat, which is to say it grows.\r\n\r\n\
    An oyster reef is a structure assembled almost entirely out of animals. Each young\
    \ oyster, arriving as a nearly invisible drifting larva, settles onto the shells\
    \ of the generations before it and cements itself permanently in place, so that\
    \ the reef climbs upward as a kind of dense apartment building of the living and\
    \ the dead, the spent shells of the departed forming the foundation on which the\
    \ newcomers build. \"A reef is the only coastal defense that reproduces,\" Vega\
    \ says. \"You do not have to manufacture more of it. It manufactures itself.\"\
    \ In water carrying enough food at the right salinity, a thriving reef can accrete\
    \ upward quickly enough to keep pace with a moderate rise in sea level, lifting\
    \ its own crest steadily as the ocean climbs toward it. Whether the reef can climb\
    \ quickly enough is the question that settles its future, and the answer depends\
    \ on how fast the sea itself rises.\r\n\r\nThen there is the matter of storms,\
    \ in which the reef behaves in a manner that unsettles the engineering mind. A\
    \ wave powerful enough to fracture reinforced concrete does something almost generous\
    \ to a reef: it tears loose fragments of shell, lifts clouds of larvae from the\
    \ bottom, and hurls that living mixture across the structure, where a great deal\
    \ of it lodges, settles, and takes permanent hold. The very force dispatched to\
    \ destroy the barrier winds up delivering the raw material required to enlarge\
    \ it. \"We have watched reefs come out of a hurricane larger than they went into\
    \ it,\" Vega says. \"I cannot name another kind of infrastructure you can say\
    \ that about.\"\r\n\r\nA reef guards the shore not by halting the sea but by exhausting\
    \ it. Positioned in shallow water a short distance offshore, it compels incoming\
    \ waves to trip and break prematurely, draining their energy well before they\
    \ can reach inhabited land. In the sheltered, slackened water behind the reef,\
    \ drifting sediment sinks and accumulates, and marsh grasses root themselves in\
    \ the fresh mud and hold it fast, so that over the years the protected zone fills,\
    \ firms, and pushes the shoreline itself gradually toward the sea. A seawall,\
    \ in its finest hour, can defend only the single line on which it stands; a reef\
    \ can march that line outward into the ocean.\r\n\r\nNone of this would persuade\
    \ a town treasurer if the economics collapsed, so before committing public money,\
    \ planners in one Chesapeake Bay community weighed the leading options against\
    \ one another. A concrete seawall, they found, was the most expensive to build\
    \ and the only choice that sheltered nothing alive; a planted marsh was far cheaper\
    \ to install but had to be uprooted and replaced within a single generation; a\
    \ rock breakwater lasted longer yet offered little to the creatures around it.\
    \ The oyster reef fell in the middle to construct, cost almost nothing to maintain\
    \ from year to year, and alone among the candidates never reached the end of its\
    \ serviceable life. Stretched across fifty years, a reef built for less than half\
    \ the price of a seawall would outlast two such walls without demanding a single\
    \ rebuild. \"Once we finally counted the maintenance and the replacements, it\
    \ stopped being a close call,\" says Dana Whitfield, the town planner who assembled\
    \ the figures. \"The reef was cheaper, and it happened to be alive.\"\r\nThat\
    \ word, alive, marks the reef's limits as plainly as its promise. Reefs are no\
    \ universal cure, for they demand brackish water, a firm bottom on which to establish\
    \ themselves, and durable protection from disease and overharvesting, and no reef\
    \ will ever shield a deepwater shipping port or a dense city built flush against\
    \ the tide. Vega is the first to concede the point. \"I am not here to announce\
    \ that concrete is finished,\" she says, straightening in the draining shallows\
    \ as the tide begins to turn beneath her. \"I am telling you that wherever a reef\
    \ will grow, you can have a seawall that heals itself and a nursery thrown into\
    \ the bargain. Ask any town when a slab of concrete last offered it either one.\""
  question_text: Which sentence from the passage best supports the idea that an oyster
    reef becomes stronger over time rather than wearing down?
  choice_a: '"A thriving reef can accrete upward quickly enough to keep pace with
    a moderate rise in sea level."'
  choice_b: '"Each young oyster … settles onto the shells of the generations before
    it and cements itself permanently in place."'
  choice_c: '"The very force dispatched to destroy the barrier winds up delivering
    the raw material required to enlarge it."'
  choice_d: '"Drifting sediment sinks and accumulates, and marsh grasses root themselves
    in the fresh mud and hold it fast."'
  choice_e: ''
  correct_answer: C
  explanation: "The claim is not just that the reef grows, but that it grows stronger\
    \ instead of breaking down — the opposite of a decaying wall. That requires evidence\
    \ of the reef gaining from the very forces that damage other structures. Choice\
    \ C is the one: a destructive wave ends up handing the reef the material to enlarge\
    \ itself.\r\nA does show growth, but it is growth measured against the rising\
    \ sea, not proof that the reef toughens against the forces that would wear it\
    \ away. B describes how the reef is assembled, one oyster cementing to the next\
    \ — a single building step, not the net result of surviving and gaining from stress.\
    \ D is about material settling behind the reef and building the shoreline; that\
    \ describes the marsh and mud, not the reef itself growing stronger, so it points\
    \ at the wrong object."
  distractor_types:
    A: partly_true_but_wrong
    B: too_narrow
    D: misidentified_detail
- section: ELA
  stage: hard_module
