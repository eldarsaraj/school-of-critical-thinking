  question_text: The passage implies that when a person moves his own eyes across
    a room, the room appears to stay still because
  choice_a: the brain predicts the visual shift its own eye movement causes and cancels
    it, so only unexpected motion is seen.
  choice_b: the eyes move too quickly for the brain to register the change in the
    scene.
  choice_c: the room genuinely does not move at all, so there is nothing there for
    the brain to notice or correct.
  choice_d: the brain pays closer attention to the room itself than it does to its
    own eye movements.
  choice_e: ''
  correct_answer: A
  explanation: "The passage lists \"the movement of your own eyes from the movement\
    \ of the world across them\" as another case handled by the same machinery. Applied\
    \ here: when you move your eyes, the image sweeps across them, but the brain predicts\
    \ the sweep its own command will cause and subtracts it, leaving the room looking\
    \ still. Only motion it did not cause survives. Choice A supplies that mechanism.\r\
    \nB blames the speed of the eyes, but the passage's explanation is prediction,\
    \ not quickness. C is literally true — the room itself does not move — yet it\
