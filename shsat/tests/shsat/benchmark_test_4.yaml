  question_text: The passage suggests that the long-legged ants overshot the nest
    because
  choice_a: the stilts made walking so difficult that the ants slowed down and lost
    track of how many steps they had taken.
  choice_b: they took a greater number of steps than usual on the way back, adding
    extra distance to the journey home.
  choice_c: their longer strides covered more ground per step, so the same step count
    carried them past the nest.
  choice_d: the added leg length interfered with their sky compass, sending them in
    a slightly wrong direction well past the nest entrance.
  choice_e: ''
  correct_answer: C
  explanation: "The ant measures distance by counting steps, and during training each\
    \ of its steps covered a normal, fixed amount of ground. When scientists glued\
    \ on stilts, each step suddenly covered more ground, but the ant kept \"counting\
    \ to\" the same number it had recorded on the way out. Reaching that count now\
    \ placed it well beyond the nest, so it overshot. C states exactly this.\r\nA\
    \ blames the difficulty of walking and a lost count, but the passage never says\
    \ the ants struggled or miscounted — their counting worked fine; it was the length\
    \ of each step that changed. B says they took more steps, but the trap is the\
    \ reverse: with longer legs the ant needs the same count of steps, and each one\
    \ simply goes farther. D points to the sky compass, yet the experiment changed\
    \ the ants' legs, not their view of the sky, so their direction was never the\
    \ problem — only their distance."
  distractor_types:
    A: wrong_concept
    B: partly_true_but_wrong
    D: causal_confusion
