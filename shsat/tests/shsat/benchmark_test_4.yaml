  question_text: "Which sentence is least relevant to the third paragraph and should\
    \ be deleted?\r\n\r\n(9) Repair Cafés have since spread to more than thirty countries\
    \ around the world. (10) Amsterdam is also famous for its canals, which attract\
    \ millions of tourists every year. (11) Some critics argue that gatherings like\
    \ these cannot solve the enormous problem of waste on there own. (12) They observe\
    \ that a single volunteer holding a screwdriver is no match for factories that\
    \ deliberately design their products to fail."
  choice_a: Sentence 9
  choice_b: Sentence 10
  choice_c: Sentence 11
  choice_d: Sentence 12
  choice_e: ''
  correct_answer: B
  explanation: "The paragraph makes one point: Repair Cafés have spread widely, but\
    \ critics doubt they can fix the waste problem on their own. Sentence 10 is about\
    \ Amsterdam's canals and tourism, which has nothing to do with repair or waste\
    \ — it interrupts the paragraph and should be removed.\r\n\r\nSentence 9 is the\
    \ topic sentence that sets up the paragraph's subject, so it belongs. Sentence\
    \ 11 introduces the critics' argument, which is the heart of the paragraph. Sentence\
    \ 12 explains that argument with a concrete image, directly supporting sentence\
    \ 11. Only sentence 10 pulls the reader away from the paragraph's focus.In sentence\
    \ 1, the comma after \"week\" is a genuine error and should be deleted, but the\
    \ subject \"The paper\" is singular, so changing \"is\" to \"are\" would create\
    \ a new mistake — only one of the two edits is valid. In sentence 3, \"which dries\"\
    \ really should be \"which dry\" because it refers to the plural \"sheets,\" but\
    \ the comma before \"which\" is correct and must stay, so deleting it spoils the\
    \ fix. In sentence 4, the sentence is already correct: the commas around \"smooth\
    \ and bright\" belong there, and the plural \"sheets\" needs \"are,\" so both\
    \ proposed changes would damage a sentence that has no error at all."
  distractor_types:
    A: too_broad
    C: wrong_concept
    D: misidentified_detail
