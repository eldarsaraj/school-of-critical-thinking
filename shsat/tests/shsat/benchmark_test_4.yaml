  passage_title: The Last Good Skipping Stone
  passage_text: "Theo had promised to teach me before he left, and because there was\
    \ only the single afternoon left to spend, we went down to the reservoir with\
    \ our pockets already sagging, having filled them at the gravel margin without\
    \ discussing why.\r\n\r\nHe worked by a method I was never allowed to learn. He\
    \ would crouch, revolve a stone slowly between two fingers as a suspicious man\
    \ turns a coin he half believes is counterfeit, and then either return it to the\
    \ water or surrender it into my palm without comment. The ones he chose for me\
    \ were invariably flat and river-cold, and they settled into the curl of my finger\
    \ as though they had been lying in the silt through the whole long summer, waiting\
    \ for precisely this. I did not ask how he could tell the good from the worthless.\
    \ To ask would have been to squander the little time we had.\r\n\r\n\"You're throwing\
    \ from the arm,\" he said, after a stone of mine vanished with the blunt, swallowed\
    \ sound of failure. \"It was never about the arm.\"\r\n\r\nHe demonstrated once\
    \ more. At the final instant his wrist performed some small, decisive motion I\
    \ could observe but never reproduce, and the stone traveled out low and quick\
    \ and grazed the surface four times, five, six, basting a seam of silver across\
    \ the water before the reservoir gathered it quietly back.\r\n\r\n\"Six,\" I announced.\r\
    \n\r\n\"I've managed nine.\"\r\n\r\n\"You have not.\"\r\n\r\n\"Ask the water,\"\
    \ he said, which was the sort of extravagant thing he offered only when he was\
    \ happy, and I resolved to believe him, because believing him cost me nothing\
    \ I could not spare.\r\n\r\nThe light was thickening toward amber, the particular\
    \ exhausted gold of late August, when the entire season seems to tilt and lean\
    \ toward some conclusion no one has named. On the opposite bank a heron kept its\
    \ vigil in the shallows, immobile and patient as a fence post, and Theo studied\
    \ it a long while and said nothing whatsoever, and I understood, without instruction,\
    \ that silence was expected of me as well.\r\n\r\nMy following stone skipped twice,\
    \ the one after that three times, and he acknowledged each with a nod, as though\
