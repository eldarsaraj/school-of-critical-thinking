  correct_answer: B
  explanation: "The original links two complete statements with only a comma, a run-on.\
    \ The second statement does not contrast with the first or merely add to it —\
    \ it spells out what the purpose actually was. A colon is the right mark when\
    \ what follows explains or completes what came before, so B is correct.\r\nA repairs\
    \ the run-on with a semicolon but then inserts \"however,\" which tells the reader\
