    \ have since spread to more than thirty countries around the world. (10) Amsterdam\
    \ is also famous for its canals, which attract millions of tourists every year.\
    \ (11) Some critics argue that gatherings like these cannot solve the enormous\
    \ problem of waste on there own. (12) They observe that a single volunteer holding\
    \ a screwdriver is no match for factories that deliberately design their products\
    \ to fail.\r\n\r\n(13) Supporters of the movement respond by proposing an entirely\
    \ different measure of success. (14) A Repair Café teaches ordinary people to\
    \ see a broken object as a puzzle to be solved rather than as garbage to be discarded.\
    \ (15) Consequently, that change in attitude, defenders insist, outlasts any single\
    \ afternoon of repairs. (16) The gatherings also rescue practical knowledge that\
    \ might otherwise vanish within a generation. (17) An older volunteer who once\
    \ repaired clocks professionally can hand that vanishing skill to a curious teenager\
    \ in a little under an hour. (18) In the end, the crowded tables hold far more\
    \ than tools, they hold a patient argument about what a community owes to the\
    \ things it builds and then abandons."
  question_text: "How should sentence 8 be revised?\r\n\r\n(8) A lamp that seemed\
    \ hopeless often needs only a single inexpensive part, this discovery surprises\
    \ almost everyone who witnesses it."
  choice_a: A lamp that seemed hopeless often needs only a single inexpensive part,
    and this fact about the discovery is something that surprises almost everyone
    who witnesses it.
  choice_b: A lamp that seemed hopeless often needs only a single inexpensive part;
    surprising almost everyone who witnesses it.
  choice_c: A lamp that seemed hopeless often needs only a single inexpensive part,
    a discovery that surprises almost everyone who witnesses it.
  choice_d: A lamp that seemed hopeless often needs only a single inexpensive part,
    therefore this discovery surprises almost everyone who witnesses it.
  choice_e: ''
  correct_answer: C
  explanation: "The original sentence glues two complete sentences together with only\
    \ a comma — \"A lamp ... needs only a single inexpensive part\" and \"this discovery\
    \ surprises almost everyone\" — which is a run-on. The cleanest repair turns the\
    \ second half into a phrase that describes the first: \"a discovery that surprises\
    \ almost everyone.\" Now there is one complete sentence, and nothing is lost.\
    \ Choice C does this.\r\nA does fix the run-on by adding \"and,\" but it swells\
    \ into \"this fact about the discovery is something that,\" which is padded and\
    \ weak when \"a discovery that surprises\" says the same thing. B replaces the\
    \ comma with a semicolon, but a semicolon must join two complete sentences, and\
    \ \"surprising almost everyone who witnesses it\" is only a fragment — so it trades\
    \ one error for another. D swaps in \"therefore\" but keeps the comma, and a word\
    \ like \"therefore\" cannot hold two complete sentences together with just a comma,\
    \ so the run-on remains."
  distractor_types:
    A: less_precise
    B: introduces_new_error
    D: introduces_new_error
