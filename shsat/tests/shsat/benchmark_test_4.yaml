  question_text: Let x be an odd integer. What is the sum of the three smallest even
    integers that are greater than x? Express your answer in terms of x.
  choice_a: 2x + 4
  choice_b: 3x + 6
  choice_c: 3x + 9
  choice_d: 3x + 12
  choice_e: ''
  correct_answer: C
  explanation: "Since x is odd, the smallest even integer greater than x is x + 1.\
    \ Even integers go up by 2, so the next two are x + 3 and x + 5. Their sum is\
    \ (x + 1) + (x + 3) + (x + 5) = 3x + 9. (Check with x = 5: the even numbers are\
    \ 6, 8, 10, which sum to 24, and 3·5 + 9 = 24.)\r\nA (2x + 4) adds only the first\
    \ two even integers, (x + 1) + (x + 3), stopping one short of three. B (3x + 6)\
    \ counts by 1 instead of by 2 — using x + 1, x + 2, x + 3 — but x + 2 is odd,\
    \ so those aren't all even. D (3x + 12) starts at x + 2 as if x were even, giving\
    \ x + 2, x + 4, x + 6, which are actually odd when x is odd."
  distractor_types:
    A: partial_answer
    B: wrong_setup
    D: wrong_setup
