  question_text: A student concludes that copying the habits of the most popular YouTubers
    is a reliable path to becoming famous. Based on the passage, what is the flaw
    in this reasoning?
  choice_a: The habits that made those YouTubers popular in years past will no longer
    work in a rapidly changing online world.
  choice_b: The most popular YouTubers are quite unlikely to reveal the real secrets
    behind their success to ordinary viewers.
  choice_c: The student studies only creators who succeeded and ignores the many who
    used the same habits and failed, so the habits may not explain the success.
  choice_d: Fame is really mostly a matter of luck, so no particular set of habits
    could ever improve a creator's chances at all.
  choice_e: ''
  correct_answer: C
  explanation: "This is survivorship bias applied to social media. The famous creators\
    \ are the \"returning planes\" — visible survivors. The student never sees the\
    \ enormous number of people who posted the same way, followed the same advice,\
    \ and got nowhere, because they vanished from view. Without those failures, there\
    \ is no way to know whether the habits caused the fame or merely happened to accompany\
    \ it. Choice C is that reasoning.\r\nA raises a different objection — that trends\
    \ go stale — which is not the passage's point about missing cases. B suggests\
    \ the stars are hiding their secrets, a matter of deception rather than a flawed\
    \ sample. D leaps to the opposite extreme, declaring fame \"mostly luck\" and\
    \ habits useless; the passage does not claim luck rules everything — only that\
    \ studying survivors alone cannot tell you what works, because the failures are\
    \ unseen."
