  question_text: Which statement best expresses a central idea of the passage?
  choice_a: The narrator has been sincerely haunted his entire life by a single cruel
    moment that he has never been able to forgive in himself.
  choice_b: When people are desperate to belong, they will abandon even the friends
    who matter most to them.
  choice_c: The narrator's long remorse is a form of self-flattery, letting him feel
    decent while sparing him the harder work of making amends.
  choice_d: Feeling sorry means nothing unless a person is willing to change and repair
    the harm he has done.
  choice_e: ''
  correct_answer: C
  explanation: "The confession turns at the end: the narrator admits his years of\
    \ remembering have cost him less than a real apology would have, and that he keeps\
    \ the memory \"the way some people keep a scar they are secretly proud of\" —\
    \ it lets him \"feel I have a conscience without ever requiring me to use one.\"\
