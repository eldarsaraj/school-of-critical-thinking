  question_text: "Which edit should be made to correct this sentence?\r\n\r\n\"Any\
    \ student who arrives late to the exam, will not be given extra time to finish.\""
  choice_a: Insert a comma after student.
  choice_b: Delete the comma after exam.
  choice_c: Change the comma after exam to a semicolon.
  choice_d: Insert a comma after given.
  choice_e: ''
  correct_answer: B
  explanation: "The subject of the sentence is the whole phrase \"Any student who\
    \ arrives late to the exam,\" and its verb is \"will not be given.\" A single\
    \ comma should never split a subject from its verb, yet that is exactly what the\
    \ comma after \"exam\" does. The clause \"who arrives late to the exam\" is essential\
    \ — it tells you which students — so it is not extra information to be fenced\
    \ off. The fix is to remove the comma. So B.\r\nA adds a second comma after \"\
    student,\" which sets off \"who arrives late to the exam\" as if it were removable\
    \ extra information — but then the sentence would suggest every student arrives\
    \ late, changing the meaning. C swaps the comma for a semicolon, but a semicolon\
    \ must join two complete sentences, and \"will not be given extra time to finish\"\
    \ cannot stand alone. D inserts a comma after \"given,\" splitting \"given\" from\
    \ \"extra time,\" which breaks up words that belong together."
  distractor_types:
    A: changes_meaning
    C: introduces_new_error
    D: wrong_placement
