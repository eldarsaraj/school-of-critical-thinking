  question_text: "Read this paragraph.\r\n\r\n(1) The ancient Romans built a vast\
    \ network of paved roads across their empire. (2) These roads were so well engineered\
    \ that many remain in use today, they have survived nearly two thousand years\
    \ of traffic and weather. (3) Each was designed to provide drainage, to withstand\
    \ heavy carts, and stability.\r\n\r\nWhich pair of revisions needs to be made\
    \ in this paragraph?"
  choice_a: In sentence 2, change "today, they" to "today. They"; and in sentence
    3, change "to withstand heavy carts" to "withstanding heavy carts."
  choice_b: In sentence 1, change "roads across" to "roads, across"; and in sentence
    3, change "and stability" to "and to remain stable."
  choice_c: In sentence 2, change "today, they" to "today. They"; and in sentence
    3, change "and stability" to "and to remain stable."
  choice_d: In sentence 2, change "many remain" to "many remained"; and in sentence
    3, change "and stability" to "and stableness."
  choice_e: ''
  correct_answer: C
  explanation: "Two things are wrong. Sentence 2 joins two complete statements with\
    \ only a comma (\"in use today, they have survived\") — a run-on that needs a\
    \ full stop: \"today. They have survived.\" Sentence 3 lists three things a road\
    \ was designed to do, but the list mixes forms: \"to provide … , to withstand\
    \ … , and stability.\" The first two are \"to ___\" phrases, so the third must\
    \ match: \"and to remain stable.\" Choice C makes both of these fixes.\r\nA fixes\
    \ sentence 2 correctly but then changes the wrong part of sentence 3: turning\
    \ \"to withstand\" into \"withstanding\" only breaks the list in a new place.\
    \ B leaves sentence 2's run-on untouched and invents an unneeded comma in sentence\
    \ 1, even though its sentence-3 fix is right — so the pair is still wrong. D changes\
    \ \"remain\" to \"remained,\" which does nothing about the run-on, and \"stableness\"\
    \ is awkward and still not parallel with the \"to ___\" phrases."
