    \ weight placed upon it. The streamside willow so often credited to the Yellowstone\
    \ wolves recovered during years of rising rainfall, and elk numbers were already\
    \ falling under drought and human hunting as much as under predation. \r\n\r\n\
    Several careful studies have found the recovery patchy and mostly limited to the\
    \ wetter sites, just where water, rather than wolves, would lead us to expect\
    \ it. Even the landscape of fear, so central to the argument for reintroduction,\
    \ has failed to hold up cleanly when other researchers have tried to confirm it.\r\
    \n\r\nNone of this means predators do not matter, or that the wolf has no place\
    \ in Yellowstone; where a population is already established and thriving, few\
    \ would now remove it. But an appealing example is not a warrant for policy. Separating\
    \ the effect of a single predator from a tangle of overlapping causes is a hard\
    \ problem that has not been solved, and to treat one uncertain success as a general\
    \ recipe for redesigning ecosystems is to mistake a story for a science.\r\n\r\
    \nThat mistake is not free of cost. The confidence it breeds is spent at the expense\
    \ of others, for it is used to override the interests of ranchers and rural communities,\
    \ who must live with decisions made on their behalf. A landscape reshaped across\
    \ a century is not a machine that can be reset at will, and the humility this\
    \ demands falls not on the enthusiasts but on the people nearest the wolves. Until\
    \ the evidence is firmer and those costs are fairly weighed, restraint, not eagerness,\
    \ is the wiser course."
  question_text: How would the author of Passage 1 most likely respond to Passage
    2's claim that Yellowstone is "one uncertain success" too weak to justify a general
    policy?
  choice_a: By conceding that a single case is insufficient and calling for a halt
    to all reintroductions until more data arrive.
  choice_b: By insisting that the rainfall in Yellowstone had no effect on the willows
    whatsoever.
  choice_c: By claiming that the costs to ranchers are too small to matter in the
    decision.
  choice_d: By arguing that the same pattern appears in several independent systems,
    so the case does not rest on Yellowstone alone.
  choice_e: ''
  correct_answer: D
  explanation: "Passage 2's objection is that a single, murky success cannot support\
    \ a broad policy. Passage 1 has already answered exactly this worry: the Yellowstone\
    \ pattern \"is echoed in unrelated systems, from sea otters and kelp in the North\
    \ Pacific to the big cats and grazers of the African plains,\" and \"such agreement\
    \ across independent cases lends the idea a weight no single study could provide.\"\
