  question_text: Suppose the diagram could be redrawn to include the bombers that
    were shot down as well as those that came back. Based on the passage, how would
    this complete diagram most likely differ from the one shown?
  choice_a: The now-blank areas — the engines and cockpit — would fill with hits,
    and the damage would look spread fairly evenly over the whole plane.
  choice_b: The downed planes would show even heavier damage on the wings and fuselage,
    where the returning planes are already hit the most.
  choice_c: The complete diagram would look almost the same as this one, since bullets
    tend to strike every plane in the same places.
  choice_d: The downed planes would show very few holes anywhere, since they were
    destroyed before they could take much fire.
  choice_e: ''
  correct_answer: A
  explanation: "The passage says bullets strike a plane \"more or less evenly,\" yet\
    \ the diagram of survivors is lopsided — almost no hits on the engines. Wald's\
    \ explanation is that the planes hit in the engines are missing from the picture\
    \ because they crashed. So if you added those downed planes back in, their hits\
    \ would land in the blank spots, and the whole map would even out. Choice A follows\
