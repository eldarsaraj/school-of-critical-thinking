  question_text: In sentence 7, which is the most precise revision of the phrase "teaches
    the visitor something about how the item was assembled in the first place"?
  choice_a: shows the visitor how the item was originally put together
  choice_b: teaches the visitor something or other about the item's assembly
  choice_c: teaches the visitor how items like it are usually assembled in factories
  choice_d: teaches the visitor how the item works
  choice_e: ''
  correct_answer: A
  explanation: "The phrase is vague because of the filler word \"something\" and the\
    \ padding \"in the first place.\" A precise revision keeps the exact idea — the\
    \ visitor learns how this particular object was built — while cutting the vagueness.\
    \ Choice A does this: \"shows the visitor how the item was originally put together\"\
    \ is specific and clean.\r\nB keeps the vagueness and even adds to it with \"\
    something or other,\" so it is less precise, not more. C sounds specific but widens\
    \ the meaning from this one object to \"items like it ... in factories,\" which\
    \ the sentence never claims. D is the shortest and looks tempting, but \"how the\
    \ item works\" is a different idea from how it was built — a working lamp and\
    \ an assembled lamp are not the same thing — so it changes the meaning."
  distractor_types:
    B: less_precise
    C: too_broad
    D: changes_meaning
- section: ELA
  stage: easy_module
  question_number: 7
  question_type: multiple_choice
  skill: punctuation
  difficulty: medium
  topic: ''
  passage_group_id: ''
  passage_title: ''
  passage_text: ''
  question_text: "Read this paragraph.\r\n\r\n(1) The paper that families set aside\
    \ each week, is trucked to a mill on the edge of town. (2) At the mill, the bales\
    \ of paper, are soaked in warm water until it is soft enough to shred. (3) Rollers\
    \ press the wet pulp into thin sheets, which dries under rows of heated lamps.\
    \ (4) The recycled sheets, smooth and bright, are ready for a second life as newspapers\
    \ and boxes.\r\n\r\nWhich revisions correct the errors in the paragraph?"
  choice_a: 'Sentence 1: Delete the comma after "week" AND change "is" to "are".'
  choice_b: 'Sentence 2: Delete the comma after "paper" AND change "it is" to "they
    are".'
  choice_c: 'Sentence 3: Delete the comma after "sheets" AND change "dries" to "dry".'
  choice_d: 'Sentence 4: Delete the comma after "bright" AND change "are" to "is".'
  choice_e: ''
  correct_answer: B
  explanation: "Each choice proposes two changes, and the right answer is the only\
    \ one where both changes are actually needed. In sentence 2, the comma after \"\
    paper\" wrongly splits the subject (\"the bales of paper\") from its verb (\"\
    are soaked\"), so it must go — and the material that becomes soft is the plural\
    \ bales, so \"until it is soft\" should read \"until they are soft.\" Both edits\
    \ are required, so B is correct.\r\nIn sentence 1, the comma after \"week\" is\
    \ a real error and should be deleted, but the subject \"The paper\" is singular,\
    \ so changing \"is\" to \"are\" would create a new mistake. In sentence 3, \"\
    which dries\" really should be \"which dry\" because it refers to the plural \"\
    sheets,\" but the comma before \"which\" is correct and must stay, so deleting\
    \ it spoils the fix. In sentence 4, the sentence is already correct: the commas\
    \ around \"smooth and bright\" belong there, and the plural \"sheets\" needs \"\
    are,\" so both proposed changes would damage a sentence that has no error at all."
  distractor_types:
    A: overcorrection
    C: introduces_new_error
    D: overcorrection
- section: ELA
  stage: easy_module
  question_number: 8
  question_type: multiple_choice
  skill: sentence_structure
  difficulty: hard
  topic: ''
  passage_group_id: ''
  passage_title: ''
  passage_text: ''
  question_text: "Read this sentence.\r\n\r\n\"The new library's collection of graphic\
    \ novels is larger than the old branch.\"\r\n\r\nWhich revision corrects the error\
    \ in the sentence?"
  choice_a: The new library's collection of graphic novels is larger in comparison
    than the old branch.
  choice_b: The new library's collection of graphic novels is larger than the old
    branch has.
  choice_c: The new library's collection of graphic novels is larger than the old
    branch's.
  choice_d: The new library's collection of graphic novels is larger than the ones
    at the old branch.
  choice_e: ''
  correct_answer: C
  explanation: "The sentence compares two things, so both sides must match. It means\
    \ the new library's collection is larger than the old branch's collection. As\
    \ written, it compares a \"collection\" to a whole \"branch\" — a stack of books\
    \ measured against a building, which makes no sense. Choice C fixes this with\
    \ the possessive \"the old branch's,\" which stands for \"the old branch's collection,\"\
    \ so a collection is compared to a collection.\r\nA inserts \"in comparison,\"\
    \ which is redundant and still compares the collection to the branch. B adds \"\
    has,\" but \"larger than the old branch has\" leaves the comparison unfinished\
    \ — has what? — so the two sides still don't line up. D compares the collection\
    \ to \"the ones at the old branch,\" meaning the individual novels, so it measures\
    \ a whole collection against single books rather than against the other collection."
  distractor_types:
    A: overcorrection
    B: introduces_new_error
    D: wrong_logical_relation
- section: ELA
  stage: easy_module
  question_number: 9
  question_type: multiple_choice
  skill: usage_agreement
  difficulty: medium
  topic: ''
  passage_group_id: ''
  passage_title: ''
  passage_text: ''
  question_text: "Read this sentence.\r\n\r\n\"Neither the store's managers nor its\
    \ owner were willing to lower the price.\"\r\n\r\nWhich revision corrects the\
    \ error in the sentence?"
  choice_a: Neither the store's managers nor its owner were willing to lower the prices.
  choice_b: Neither the store's managers nor its owners was willing to lower the price.
  choice_c: Not the store's managers nor its owner were willing to lower the price.
  choice_d: Neither the store's managers nor its owner was willing to lower the price.
  choice_e: ''
  correct_answer: D
  explanation: "In a \"neither ... nor\" sentence, the verb matches the part of the\
    \ subject that sits closest to it. Here the nearer part is \"its owner,\" which\
    \ is singular, so the verb must be the singular \"was.\" The plural \"managers\"\
    \ earlier in the sentence does not control the verb. Choice D makes this fix and\
    \ changes nothing else.\r\nA only changes \"price\" to \"prices,\" which does\
    \ nothing about the verb and leaves the real error in place. B changes \"owner\"\
    \ to \"owners\" so that both parts are now plural, yet pairs them with the singular\
    \ \"was,\" creating a fresh mismatch. C swaps \"Neither\" for \"Not,\" which breaks\
    \ the fixed \"neither ... nor\" pairing and still leaves the wrong verb \"were.\"\
    \ Only D lines the verb up with the nearest subject."
  distractor_types:
    A: misattributed_error_location
    B: overcorrection
    C: introduces_new_error
- section: ELA
  stage: easy_module
  question_number: 10
  question_type: multiple_choice
  skill: usage_agreement
  difficulty: medium
  topic: ''
  passage_group_id: ''
  passage_title: ''
  passage_text: ''
  question_text: "Read this sentence.\r\n\r\n\"By the time the referee blew the final\
    \ whistle, the home team scored three unanswered goals.\"\r\n\r\nWhich revision\
    \ corrects the error in the sentence?"
  choice_a: By the time the referee blew the final whistle, the home team has scored
    three unanswered goals.
  choice_b: By the time the referee had blown the final whistle, the home team scored
    three unanswered goals.
  choice_c: By the time the referee blew the final whistle, the home team was scoring
    three unanswered goals.
  choice_d: By the time the referee blew the final whistle, the home team had scored
    three unanswered goals.
  choice_e: ''
  correct_answer: D
  explanation: "The sentence describes two past events in order: first the team scored\
    \ the goals, then the referee blew the whistle. When one past action is completed\
    \ before another past action, the earlier one uses \"had\" + the verb. So the\
    \ goals \"had scored\" — actually \"had been scored,\" but here \"the home team\
    \ had scored\" — happened before the whistle \"blew.\" Choice D uses \"had scored\"\
    \ for the earlier event and keeps \"blew\" for the later one.\r\n\r\nA uses \"\
    has scored,\" but \"has\" is for something connected to the present, which clashes\
    \ with the finished, past-time story the sentence tells. B puts \"had\" on the\
    \ wrong verb, making the whistle the earlier event, which reverses the real order.\
    \ C changes \"scored\" to \"was scoring,\" which turns a completed accomplishment\
    \ into an action still in progress — but the goals were already in by the time\
    \ the whistle blew."
  distractor_types:
    A: introduces_new_error
    B: misattributed_error_location
    C: changes_meaning
- section: ELA
  stage: easy_module
  question_number: 11
  question_type: multiple_choice
  skill: punctuation
  difficulty: easy
  topic: ''
  passage_group_id: ''
  passage_title: ''
  passage_text: ''
  question_text: "Read this sentence.\r\n\r\n\"The kit includes everything a beginner\
    \ needs, a screwdriver, a coil of wire, and a small manual.\"\r\n\r\nWhich revision\
    \ corrects the error in the sentence?"
  choice_a: 'The kit includes everything a beginner needs: a screwdriver, a coil of
    wire, and a small manual.'
  choice_b: The kit includes everything a beginner needs; a screwdriver, a coil of
    wire, and a small manual.
  choice_c: The kit includes everything a beginner needs, which is a screwdriver,
    a coil of wire, and a small manual.
  choice_d: 'The kit includes everything: a beginner needs a screwdriver, a coil of
    wire, and a small manual.'
  choice_e: ''
  correct_answer: A
  explanation: "The first part, \"The kit includes everything a beginner needs,\"\
    \ is a complete statement, and the rest of the sentence lists what that \"everything\"\
    \ is. When a complete statement is followed by a list that spells it out, a colon\
    \ is the correct mark. Choice A places the colon after \"needs,\" so the list\
    \ clearly explains what the kit contains.\r\nB uses a semicolon, but a semicolon\
    \ joins two complete statements, and \"a screwdriver, a coil of wire, and a small\
    \ manual\" is only a list, not a full sentence. C adds \"which is\" in front of\
    \ a plural list, which is both awkward and mismatched, and it is wordier than\
    \ a simple colon. D moves the colon up after \"everything,\" which breaks the\
    \ sentence so that \"a beginner needs a screwdriver ...\" becomes a separate thought,\
    \ changing what the sentence says."
  distractor_types:
    B: introduces_new_error
    C: less_precise
    D: changes_meaning
- section: ELA
  stage: easy_module
  question_number: 12
  question_type: multiple_choice
  skill: main_idea
  difficulty: medium
  topic: ''
  passage_group_id: ela_e_p1
  passage_title: The Ant that Counts Its Steps
  passage_text: "The Saharan desert ant emerges from its nest at midday, when the\
    \ sand has grown hot enough to kill nearly any other insect that lingers on its\
    \ surface. That lethal heat is the ant's protection, because the lizards and spiders\
    \ that would happily devour it have already retreated into shade. The ant searches\
    \ for insects that have perished in the sun, wandering along a meandering, looping\
    \ path across a landscape that offers no obvious landmarks. Then, the instant\
    \ it discovers a meal, it wheels around and races in an almost perfectly straight\
    \ line toward a nest entrance only a few millimeters wide. Many ant species navigate\
    \ by following a chemical trail, but on scorching sand any such scent would evaporate\
    \ within seconds. The desert ant, therefore, must carry its directions entirely\
    \ inside itself.\r\n\r\nResearchers already understood that the ant determines\
    \ direction by reading the sky. Sunlight scatters through the atmosphere in a\
    \ pattern invisible to human eyes, yet perfectly visible to the ant, providing\
    \ it with a dependable compass. But a compass reveals only which direction to\
    \ face, never how far one must travel. To relocate an opening the width of a pin,\
    \ the ant additionally needs to gauge its distance from home, and for many years\
    \ no scientist could explain how it accomplished that measurement.\r\n\r\nThe\
    \ explanation arrived through an experiment that sounds almost like a prank. Investigators\
    \ trained ants to march from the nest to a feeder along a straight channel. When\
    \ the ants arrived, the scientists captured them and altered the length of their\
    \ legs, cementing miniature stilts fashioned from pig bristle onto some individuals\
    \ and trimming the legs of others. The elongated ants overshot the nest and continued\
    \ searching well beyond it. The shortened ants halted prematurely, hunting for\
    \ an entrance that was not yet beneath them. The ants had never measured the ground\
    \ itself. They had been counting their strides, and longer or shorter steps distorted\
    \ the total.\r\n\r\nWhat the desert ant performs amounts to a kind of continuous\
    \ arithmetic. With every stride it revises a single quantity, a combined direction\
    \ and distance that together indicate the precise route back to the nest, so that\
    \ when food materializes it can abandon its wandering path and seize the shortcut\
    \ home. The technique is remarkably powerful, yet it is equally stubborn. The\
    \ ant trusts its own tally so absolutely that a pair of stilts can dispatch it\
    \ marching into empty desert, convinced with every step that home lies exactly\
    \ where its calculations insist it should be."
  question_text: Which statement best expresses the central idea of the passage?
  choice_a: The ant finds home by combining a sky compass for direction with a count
    of its steps for distance, a pairing that is exact yet easily fooled.
  choice_b: The ant finds its way home mainly by counting its steps, a distance measure
    so reliable that it seldom needs any sense of direction at all.
  choice_c: The ant counts its steps in order to work out which direction to face,
    then follows that heading in a straight line back to the nest.
  choice_d: By counting steps and reading the sky, the ant measures the ground it
    crosses so accurately that altering its legs makes no difference to the route
    home.
  choice_e: ''
  correct_answer: A
  explanation: "The passage makes clear that the ant needs two different things: a\
    \ direction, which it gets from the sky compass, and a distance, which it gets\
    \ by counting steps. It combines them into one running calculation that points\
    \ home — a system exact enough to hit a pinhole nest but rigid enough that fake\
    \ legs throw it off. Only A holds all of these pieces together.\r\nB mentions\
    \ step-counting but claims the ant \"seldom needs any sense of direction,\" when\
    \ the passage stresses that a compass alone is not enough and direction is essential\
    \ — it drops half the system. C also mentions steps but assigns them the wrong\
    \ job: the ant counts steps to measure distance, not to figure out direction,\
    \ which comes from the sky. D names both parts correctly but then reverses the\
    \ whole point of the experiment — the passage shows that changing the ants' legs\
    \ made them overshoot or fall short, so the leg length matters enormously, and\
    \ it also says the ant never measured the ground itself."
  distractor_types:
    B: too_narrow
    C: causal_confusion
    D: opposite
