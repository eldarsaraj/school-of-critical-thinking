  question_text: The author's decision to quote Tomas Brill, an engineer who has designed
    many seawalls, mainly serves to
  choice_a: make the criticism of seawalls more convincing by having a seawall expert
    concede the flaw himself.
  choice_b: lend expert authority to the case for oyster reefs by having an engineer
    speak in their favor.
  choice_c: strengthen the argument by revealing that seawall engineers have begun
    abandoning concrete themselves.
  choice_d: add credibility by having an engineer explain the technical steps by which
    a seawall breaks down.
  choice_e: ''
  correct_answer: A
  explanation: "Brill designs seawalls, so his admission that a seawall's best day\
    \ is the day it is poured damages his own trade — which is exactly why it is persuasive.\
    \ The force of the quote comes from an insider conceding a weakness, and A names\
    \ that.\r\nB keeps the idea of expert authority but points it the wrong way: Brill\
    \ says nothing in favor of reefs; he only criticizes seawalls. C takes the concession\
    \ too far, turning \"this flaw exists\" into \"engineers are abandoning concrete,\"\
    \ which the passage never claims — Brill still designs seawalls. D also sounds\
    \ right, but Brill's quoted words assert that seawalls weaken, not how; the technical\
    \ steps (waves scouring sand, salt prying cracks) appear in the next paragraph\
    \ and are not part of his quote, so the credibility does not rest on a technical\
    \ explanation."
