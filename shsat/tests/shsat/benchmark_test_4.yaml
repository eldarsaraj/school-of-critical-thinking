    \ stammering voice, a voice that was not even a good imitation, and the table\
    \ laughed, and Peter looked down its length to where I sat, not with any expectation,\
    \ I think, but simply to locate me, the way you check for a landmark to be sure\
    \ of where you are.\r\n\r\nAnd I laughed too. It was not a large laugh. I have\
    \ spent a great deal of energy over the years on the size of that laugh, as though\
    \ there were some threshold beneath which it would not count. I laughed, and I\
    \ looked at the table, and I did not stop looking at the table until Peter had\
    \ gathered his notebook and gone.\r\n\r\nWe never sat together again. I have described\
    \ this, at various times, as a drifting apart, as the natural way of things at\
    \ that age, as something that simply happened to the two of us, like weather.\
    \ But weather is no one's fault, and this was mine. Peter did not drift. Peter\
    \ was told, in the only language that is never misunderstood, exactly where he\
    \ now stood, and he had the dignity to believe me.\r\n\r\nHere is the thing I\
    \ have never told anyone. When he stood up with his notebook, he looked at me\
    \ one last time and nodded — a small nod, almost courteous. It took me years to\
    \ understand it. He was not begging me to take it back, and he was not accusing\
    \ me; he was not even surprised. He had understood, before I did, exactly what\
    \ I was, and the nod only confirmed it — the way a signature confirms that a package\
    \ has arrived. He was letting me know that the message had reached him, and that\
    \ it matched what he had already come to expect of me. That was the worst of it:\
    \ not that I had wounded him, but that I had merely proven him right.\r\n\r\n\
    People who hear this story want to comfort me, and I have learned to let them,\
    \ because refusing comfort is its own kind of vanity. They say we were only children.\
    \ They say everyone did such things. They say I have surely more than paid for\
    \ so small a cruelty with so many years of remembering it. Perhaps they are right.\
    \ But I notice that the remembering has always cost me less than an apology would\
    \ have, and that I have chosen it, year after year, for the very reason that it\
    \ is cheaper. I keep the memory the way some people keep a scar they are secretly\
    \ proud of. It lets me feel I have a conscience without ever requiring me to use\
    \ one."
  question_text: As it is used in the first paragraph ("tell it without the usual
    varnish"), the word "varnish" most nearly means
  choice_a: a shiny protective coating brushed onto wood
  choice_b: a flattering polish that makes something look better than it is
  choice_c: a long and rambling way of explaining things
  choice_d: an honest, unflinching account of events
  choice_e: ''
  correct_answer: B
  explanation: "The narrator promises to tell the story \"without the usual varnish\"\
    \ — that is, without the flattering coat he normally applies to make himself \"\
    come out of it well.\" Figuratively, varnish is a glossy finish that improves\
    \ appearances, so here it means the self-serving polish he usually adds. Choice\
    \ B.\r\nA gives the literal, hardware-store meaning — a wood coating — but the\
    \ sentence is about how he tells a story, not about furniture. C confuses varnish\
    \ with wordiness, which is not what the term means. D is the trap: \"without varnish\"\
    \ does signal honesty, so a hasty reader may decide \"varnish\" itself means honesty\
    \ — but it means the opposite, the gloss that hides the truth, which is exactly\
    \ what removing it exposes."
  distractor_types:
    A: too_literal
    C: wrong_concept
    D: opposite
- section: ELA
  stage: hard_module
  question_number: 24
  question_type: multiple_choice
  skill: main_idea
  difficulty: medium
  topic: ''
  passage_group_id: ela_h_p3
  passage_title: 'Two Views: Should We Bring Back Vanished Predators?'
  passage_text: "Passage 1\r\n\r\nWhere suitable habitat and prey still remain, the\
    \ deliberate return of a vanished top predator is a step we should take rather\
    \ than resist. The ecological reasoning behind that claim has become hard to dispute.\
    \ It rests on two well-established ideas: the keystone species, an animal whose\
    \ influence on its community is far greater than its numbers would suggest, and\
    \ the trophic cascade, in which the effect of predators at the top of a food web\
    \ spreads downward through each level in turn. \r\n\r\nWhen a top predator is\
    \ removed, the plant-eaters are freed not only from being hunted but from the\
    \ caution that a predator's mere presence forces upon them. This second effect,\
    \ known as the landscape of fear, may matter as much as the hunting itself, for\
    \ elk that must watch for wolves feed less boldly, letting young willows recover.\r\
    \n\r\nYellowstone offers the clearest case. After the gray wolf was wiped out,\
    \ decades of heavy elk feeding stripped the streamside willow and aspen, and beaver,\
    \ songbirds, and even the shape of the streams declined along with them. After\
    \ the wolf returned in 1995, years of monitoring recorded a partial recovery of\
    \ those same communities. The evidence is only correlational, and separating it\
    \ from a warming climate is difficult, yet the pattern fits the cascade idea and\
    \ is echoed in unrelated systems, from sea otters and kelp in the North Pacific\
    \ to the big cats and grazers of the African plains. Such agreement across independent\
    \ cases lends the idea a weight no single study could provide.\r\n\r\nThe costs\
    \ to ranchers are real, and livestock losses deserve compensation and support.\
    \ But those costs are local and easily measured, while the costs of a broken food\
    \ web are spread thin, long-lasting, and easily ignored, since no ledger records\
    \ them. Because the ecological gains are broad and the human costs narrow and\
    \ manageable, the balance tips clearly toward restoration. To bring back a lost\
    \ predator is to repair a working system we took apart before we understood how\
    \ it ran.\r\n\r\nPassage 2\r\n\r\nBefore we set about returning predators to the\
    \ lands they once roamed, we should be far more cautious than today's enthusiasm\
    \ allows. The case for reintroduction leans heavily on a single, flattering story,\
    \ and that story does not bear the weight placed upon it. The streamside willow\
    \ so often credited to the Yellowstone wolves recovered during years of rising\
    \ rainfall, and elk numbers were already falling under drought and human hunting\
    \ as much as under predation. \r\n\r\nSeveral careful studies have found the recovery\
    \ patchy and mostly limited to the wetter sites, just where water, rather than\
    \ wolves, would lead us to expect it. Even the landscape of fear, so central to\
    \ the argument for reintroduction, has failed to hold up cleanly when other researchers\
    \ have tried to confirm it.\r\n\r\nNone of this means predators do not matter,\
    \ or that the wolf has no place in Yellowstone; where a population is already\
    \ established and thriving, few would now remove it. But an appealing example\
    \ is not a warrant for policy. Separating the effect of a single predator from\
    \ a tangle of overlapping causes is a hard problem that has not been solved, and\
    \ to treat one uncertain success as a general recipe for redesigning ecosystems\
    \ is to mistake a story for a science.\r\n\r\nThat mistake is not free of cost.\
    \ The confidence it breeds is spent at the expense of others, for it is used to\
    \ override the interests of ranchers and rural communities, who must live with\
    \ decisions made on their behalf. A landscape reshaped across a century is not\
    \ a machine that can be reset at will, and the humility this demands falls not\
    \ on the enthusiasts but on the people nearest the wolves. Until the evidence\
    \ is firmer and those costs are fairly weighed, restraint, not eagerness, is the\
    \ wiser course."
  question_text: Which statement best expresses the central claim of Passage 2?
  choice_a: Predators such as the wolf no longer belong in our modern ecosystems and
    ought not to be reintroduced at all.
  choice_b: The recovery of the Yellowstone willows was caused almost entirely by
    rising rainfall rather than by the return of the wolves.
  choice_c: Because the case for reintroduction is weaker than it looks and its costs
    fall on real communities, we should approach it with caution, not confidence.
  choice_d: Scientists disagree about the trophic cascade, so more research is needed
    before any firm conclusion can be reached.
  choice_e: ''
  correct_answer: C
  explanation: "Passage 2 does not oppose predators; it opposes confidence. It argues\
    \ that the evidence for reintroduction's benefits is shakier than it seems and\
    \ that the costs land on ranchers and rural communities, so we should be restrained\
    \ rather than eager. Choice C holds both halves — weak case and human cost — and\
    \ the cautious stance that follows.\r\nA overshoots into a flat anti-predator\
    \ position, which the passage explicitly rejects (\"where a population is already\
    \ established and thriving, few would now remove it\"). B seizes one supporting\
    \ detail — the rainfall point — and mistakes it for the whole argument. D captures\
    \ the \"it's contested\" note but flattens the passage into a mild call for more\
    \ study, dropping the real thesis: that we should not act confidently, and that\
    \ the costs fall on specific people."
  distractor_types:
    A: wrong_concept
    B: too_narrow
    D: partly_true_but_wrong
