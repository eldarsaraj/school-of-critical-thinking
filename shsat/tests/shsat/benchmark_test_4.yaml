  question_text: According to the graph, 100 years from now, about how much higher
    does the oyster reef's crest stand than the lower sea-level projection?
  choice_a: about 25 centimeters
  choice_b: about 35 centimeters
  choice_c: about 60 centimeters
  choice_d: about 85 centimeters
  choice_e: ''
  correct_answer: B
  explanation: "At the 100-year mark on the graph, the oyster reef crest line sits\
    \ at about 60 centimeters above today's sea level, and the lower sea-level projection\
    \ sits at about 25 centimeters. The question asks how much higher the reef is,\
    \ so subtract: 60 − 25 = about 35 centimeters. Choice B.\r\nA gives 25, which\
    \ is the height of the lower projection by itself, not the gap between the two\
    \ lines. C gives 60, the reef crest by itself, again skipping the comparison the\
    \ question asks for. D gives about 85, which is what you get by adding the two\
    \ heights (60 + 25) instead of subtracting them, so it measures nothing real on\
    \ the graph."
