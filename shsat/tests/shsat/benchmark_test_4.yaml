  passage_group_id: ela_r_p1
  passage_title: The Sensation You Cannot Give Yourself
  passage_text: "Try, for a moment, to tickle yourself. Whatever you attempt, the\
    \ effect is oddly muted, a pale imitation of what another person's fingers would\
    \ produce against the same skin. The puzzle is real, and its solution has almost\
    \ nothing to do with the skin itself. The reason you cannot tickle yourself lies\
    \ in the brain's relentless habit of predicting the consequences of its own commands\
    \ before those consequences arrive.\r\n\r\nWhenever the brain orders a movement,\
    \ it does not simply dispatch the command and wait to see what happens. It also\
    \ retains a copy of that command and forwards it to an internal predictor, a system\
    \ centered in the cerebellum, which calculates in advance the sensations the movement\
    \ ought to produce. When the predicted sensation and the actual one match, as\
    \ they do when your own hand strokes your own arm, the brain subtracts the expected\
    \ feeling and registers what remains, which is very little. A touch you generated\
    \ yourself is a touch you saw coming, and the brain, having anticipated it, largely\
    \ ignores it.\r\n\r\nThe most persuasive evidence comes from an experiment that\
    \ let people tickle themselves at a distance. Volunteers moved one hand, and a\
    \ robotic arm reproduced the motion against the other palm a fraction of a second\
    \ later. When the machine copied the movement faithfully and instantly, the subjects\
    \ felt almost nothing, exactly as if they had touched themselves directly. But\
    \ as the researchers introduced a delay, or rotated the direction of the robot's\
    \ touch away from the direction of the hand, the tickle returned, and it grew\
    \ steadily stronger as the mismatch widened. The brain cancels only what it can\
    \ predict; the moment its forecast fails, the sensation floods back in.\r\n\r\n\
    What looks like a trick of the skin is therefore a window onto how the brain treats\
    \ experience in general. A large share of its labor is spent forecasting the sensory\
    \ results of its own actions and then paying attention chiefly to the difference\
    \ between prediction and reality. This is how you distinguish pushing from being\
    \ pushed, or the movement of your own eyes from the movement of the world across\
    \ them. Perception, on this account, is not a faithful transcript of the senses\
    \ but a running comparison, in which the expected is discarded and only the surprising\
    \ survives. When the machinery falters, the effects can be profound: some researchers\
    \ suspect that when the brain fails to tag inner speech as self-generated, a person\
    \ may experience his own silent thoughts as voices belonging to someone else.\r\
    \n\r\nThere is something humbling in the discovery that you cannot startle yourself,\
    \ cannot surprise your own hand, cannot deliver to your own skin the sensation\
    \ a stranger delivers effortlessly. It means that a portion of every experience\
    \ is being edited away before you are ever aware of it, deleted for the simple\
    \ crime of having been expected. The reason you cannot tickle yourself, in the\
    \ end, is that some part of you always knows you are coming."
  question_text: Which conclusion about everyday perception does the passage most
    strongly support?
  choice_a: People perceive the actions of others more accurately than they perceive
    their own.
  choice_b: A person notices a sensation only when it is caused by something outside
    his own body.
  choice_c: The more accurately a person can predict a sensation, the less vividly
    he is likely to perceive it.
  choice_d: The brain devotes most of its resources to producing movement rather than
    to interpreting sensation.
  choice_e: ''
  correct_answer: C
  explanation: "The passage's larger claim is that the brain subtracts whatever it\
    \ predicted and reacts mainly to the surprising — \"the expected is discarded\
    \ and only the surprising survives.\" Follow that through and you reach the conclusion\
    \ that good prediction dims perception: the better you can forecast a sensation,\
    \ the less of it reaches your awareness. Choice C states that inverse relationship.\r\
    \nA shifts the point to comparing perception of others versus oneself, a claim\
    \ about accuracy the passage never makes; the issue is vividness, not who is judged\
    \ more correctly. B sounds close but swaps the real criterion — predictability\
    \ — for \"outside the body.\" A predictable outside touch would also be dampened,\
    \ and self-generated touches are not truly unnoticed (the passage says \"very\
    \ little,\" not nothing), so \"only when caused by something outside\" is too\
    \ absolute. D invents a claim about the brain spending most of its resources on\
    \ movement, when the passage stresses the labor it spends on forecasting and comparing\
    \ sensation."
  distractor_types:
    A: inference_leap
    B: too_broad
    D: wrong_concept
