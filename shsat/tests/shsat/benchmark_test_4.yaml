  question_text: Which revision of sentence 14 most clearly expresses the intended
    meaning?
  choice_a: The reformers urged teachers to hang honest, equal-area maps beside the
    older charts so that students might at last see how severely the equal-area maps
    had exaggerated the lands of the north.
  choice_b: The reformers urged teachers to hang honest, equal-area maps beside the
    older charts so that students might at last see how severely these maps had exaggerated
    the lands of the north.
  choice_c: The reformers urged teachers to hang honest, equal-area maps beside the
    older charts so that they might at last see how severely the older charts had
    exaggerated the lands of the north.
  choice_d: The reformers urged teachers to hang honest, equal-area maps beside the
    older charts so that students might at last see how severely the older charts
    had exaggerated the lands of the north.
  choice_e: ''
  correct_answer: D
  explanation: "In the original, \"how severely they had exaggerated\" leaves \"they\"\
    \ floating between two sets of maps just named. Context makes the intended meaning\
    \ clear — the reformers want students to see the distortion of the older Mercator\
    \ charts, not of the honest new maps — so the clearest revision names \"the older\
    \ charts\" as the exaggerators. Choice D does this and keeps every other reference\
    \ clear.\r\nA picks the wrong culprit, blaming \"the equal-area maps,\" which\
    \ the passage calls \"honest\" — the exact reverse of the point. B swaps the vague\
    \ \"they\" for the equally vague \"these maps,\" which could still mean either\
    \ kind of map, so the sentence stays ambiguous. C correctly names \"the older\
    \ charts\" as the exaggerators but then changes \"students\" to \"they,\" planting\
    \ a fresh ambiguity at the front of the clause — now it is unclear who is meant\
    \ to see."
