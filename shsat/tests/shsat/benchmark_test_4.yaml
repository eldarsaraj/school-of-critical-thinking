    is the area of the first triangle than the area of the second?
  choice_a: '6'
  choice_b: '27'
  choice_c: '54'
  choice_d: '63'
  choice_e: ''
  correct_answer: B
  explanation: "Area of a triangle is ½ × base × height. The first triangle's area\
    \ is ½ × 14 × 9 = 63 cm², and the second's is ½ × 8 × 9 = 36 cm². The difference\
    \ is 63 − 36 = 27 cm².\r\nA (6) is just the difference of the two bases (14 −\
    \ 8) and never turns that into an area. C (54) finds the difference correctly\
    \ as ½ × (14 − 8) × 9 but forgets the ½, computing 6 × 9 = 54. D (63) is the area\
    \ of the first triangle alone, stopping before subtracting the second triangle's\
    \ area."
