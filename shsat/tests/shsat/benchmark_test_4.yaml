  question_text: "Read this sentence.\r\n\r\n\"The city's new library is a large building\
    \ that cost a lot to build and holds many books.\"\r\n\r\nWhich revision of the\
    \ sentence uses the most precise language?"
  choice_a: The city's new library is a spacious building that was quite expensive
    to construct and holds a great many books.
  choice_b: The city's new library is a four-story building that cost $40 million
    to construct and holds over 500,000 books.
  choice_c: The city's new library is a four-story building that cost $40 million
    to construct and holds hundreds of thousands of books.
  choice_d: The city's new library is an impressive building that cost tens of millions
    of dollars and holds countless books.
  choice_e: ''
  correct_answer: B
  explanation: "Precise language replaces vague words with exact, verifiable detail.\
    \ The original leans on \"large,\" \"a lot,\" and \"many.\" Choice B pins down\
    \ all three: \"four-story,\" \"$40 million,\" and \"over 500,000 books.\" Every\
    \ fuzzy word becomes specific.\r\nC is the close trap: it matches B on the building's\
    \ height and cost but slips back to \"hundreds of thousands of books,\" which\
    \ is less exact than \"over 500,000\" — so it is precise in two places and vague\
    \ in the third. A stays general throughout (\"spacious,\" \"quite expensive,\"\
    \ \"a great many\"). D sounds detailed but actually loses precision and shifts\
    \ meaning: \"impressive\" is an opinion rather than a fact, and \"countless\"\
    \ claims the books cannot be counted, which is not what the sentence means."
