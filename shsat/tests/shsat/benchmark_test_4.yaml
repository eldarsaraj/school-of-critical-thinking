  question_text: "Read this sentence.\r\n\r\n\"Historians have long noted that the\
    \ population of medieval London, despite the city's fame and its constant influx\
    \ of newcomers, remained smaller than many provincial towns whose names are now\
    \ forgotten.\"\r\n\r\nWhich revision corrects the error in the sentence?"
  choice_a: Historians have long noted that the population of medieval London, despite
    the city's fame and its constant influx of newcomers, remained smaller than that
    of many provincial towns whose names are now forgotten.
  choice_b: Historians have long noted that the population of medieval London, despite
    the city's fame and its constant influx of newcomers, remained smaller than many
    provincial towns whose names are now forgotten did.
  choice_c: Historians have long noted that the population of medieval London, despite
    the city's fame and its constant influx of newcomers, remained smaller than the
    many provincial towns whose names are now forgotten.
  choice_d: Historians have long noted that the population of medieval London, despite
    the city's fame and its constant influx of newcomers, remained far smaller than
    many provincial towns whose names are now forgotten.
  choice_e: ''
  correct_answer: A
  explanation: "Strip the sentence to its comparison and it reads \"the population\
    \ of medieval London remained smaller than many provincial towns.\" That sets\
    \ a population against towns — a number against places, which cannot be compared.\
    \ The subject on the left is \"the population,\" so the right side must also be\
    \ a population. Choice A supplies \"that of,\" where \"that\" stands in for \"\
    the population of,\" so the sentence compares London's population to the populations\
    \ of the provincial towns.\r\nB adds \"did\" at the end, but \"than many provincial\
    \ towns … did\" still measures London's population against the towns themselves\
    \ and leaves the mismatch in place. C inserts \"the\" before \"many provincial\
    \ towns,\" a cosmetic change that touches nothing that was wrong — the comparison\
    \ is still population versus towns. D adds the intensifier \"far,\" making the\
    \ gap sound larger while leaving the faulty comparison exactly as it was."
