  question_text: How does the second paragraph contribute to the development of the
    passage?
  choice_a: It offers scientific proof that the ant's sky compass matters far more
    than its ability to judge the distance back home.
  choice_b: It summarizes the experiment's later findings about how the ant manages
    to measure both its direction and its distance.
  choice_c: It introduces a competing theory about ant navigation that the experiments
    in later paragraphs set out to disprove.
  choice_d: It shows what the ant's navigation still lacked — a way to gauge distance
    — setting up the question the next paragraph answers.
  choice_e: ''
  correct_answer: D
  explanation: "The second paragraph explains that the sky gives the ant a compass,\
    \ but a compass only tells direction, not distance — and it ends by saying no\
    \ one could explain how the ant measured distance. That leaves an open question,\
    \ which the third paragraph's stilt experiment then answers. So the paragraph's\
    \ job is to set up the problem. Choice D describes this role.\r\nA claims the\
    \ paragraph ranks the compass as more important than distance, but the paragraph\
    \ actually argues the opposite — that a compass alone is not enough, because distance\
    \ still has to be measured. B describes the findings about counting steps, which\
    \ appear in later paragraphs, not this one; this paragraph raises the question\
    \ rather than answering it. C invents a \"competing theory\" that the passage\
    \ never presents, so it misreads what the paragraph is doing."
