aving warmly toward a keeper who fed them and squirting water at one who did not. Some octopuses gather coconut shells and broken halves of clamshells, carry them across the seafloor, and fit them together into portable shelters, a behavior that looks remarkably like using tools. Researchers who work with octopuses report that different individuals seem to have different personalities: some are shy, some are bold, and some appear to be mischievous. Most surprising of all, the majority of an octopus's nerve cells are not located in its brain at all. They are spread throughout its eight arms, so that each arm can taste, touch, and react to the world almost on its own.\r\n\r\nFor all of these remarkable gifts, octopuses live very short lives, often only one or two years. A female octopus lays thousands of eggs and then guards them faithfully, fanning them with fresh seawater and never leaving them, even to hunt. By the time the eggs finally hatch, she has usually used up the last of her strength and does not survive. The brief, solitary, and brilliant life of the octopus remains one of the ocean's great mysteries, and scientists are only beginning to understand it.\r\n\r\n[FIGURE: a labeled diagram of an octopus showing its eight arms, its mantle (the rounded body), the siphon used for jet propulsion, and an enlarged inset of color-changing skin cells called chromatophores]"
  question_text: The passage's description of octopuses escaping from aquarium tanks mainly supports the idea that octopuses are —
  choice_a: too large to be kept safely in any tank
  choice_b: both flexible and clever enough to take advantage of small openings
  choice_c: friendly toward the people who feed them
  choice_d: unable to survive for long outside the ocean
  correct_answer: B
  explanation: 'The escape stories combine two traits: a boneless body that squeezes through tiny gaps (flexibility) and the cleverness to find and use those gaps. Choice A misses the point, since the passage emphasizes flexibility rather than size. Choice C belongs to a different detail (recognizing faces). Choice D is never claimed; the escapes show what octopuses can do, not what they cannot.'
  distractor_types:
    A: misidentified_detail
    C: misidentified_detail
    D: inference_leap
