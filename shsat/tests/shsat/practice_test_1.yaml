  passage_text: "\"Hope\" is the thing with feathers\r\nThat perches in the soul,\r\nAnd sings the tune without the words,\r\nAnd never stops at all,\r\n\r\nAnd sweetest in the gale is heard;\r\nAnd sore must be the storm\r\nThat could abash the little bird\r\nThat kept so many warm.\r\n\r\nI've heard it in the chillest land,\r\nAnd on the strangest sea;\r\nYet, never, in extremity,\r\nIt asked a crumb of me."
  question_text: According to the poem, when is the bird's song described as "sweetest"?
  choice_a: during a storm or gale
  choice_b: in the warmth of early spring
  choice_c: when the speaker feeds it
  choice_d: while it crosses the strangest sea
  correct_answer: A
  explanation: The poem states, 'And sweetest in the gale is heard,' so the song is sweetest in the storm. Choice B invents a season the poem never mentions. Choice C contradicts the poem, since the bird never asks to be fed. Choice D names where hope is heard, not where its song is sweetest.
