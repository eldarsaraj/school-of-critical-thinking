  question_text: "Which revision best corrects the error in the sentence below?\r\n\r\n\"Walking home from school, the sudden rainstorm soaked Priya before she could reach shelter.\""
  choice_a: Walking home from school, the sudden rainstorm had soaked Priya before she could reach shelter.
  choice_b: Walking home from school, Priya was soaked by the sudden rainstorm before she could reach shelter.
  choice_c: The sudden rainstorm, walking home from school, soaked Priya before she could reach shelter.
  choice_d: No change is needed.
  correct_answer: B
  explanation: 'The opening phrase ''Walking home from school'' is a dangling modifier: as written, it describes ''the sudden rainstorm,'' but a rainstorm cannot walk home from school. The correct fix makes Priya — the one actually walking — the subject of the main clause. Choice A only changes the verb tense and leaves the modifier still attached to the rainstorm. Choice C moves the phrase but still places it next to the rainstorm, keeping the illogical connection. Choice D treats a real grammatical error as acceptable.'
  distractor_types:
    D: semantic_over_syntactic
    A: misattributed_error_location
    C: overcorrection
