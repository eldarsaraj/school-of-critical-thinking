  choice_d: wears down and reshapes the rock beneath it
  correct_answer: D
  explanation: The sandpaper image explains how rocks frozen into the ice 'grind against the ground, gouging out deep grooves and crushing solid stone into fine powder.' Choice A concerns how glaciers form, not the comparison. Choice B is never mentioned. Choice C contradicts the passage, which stresses that glaciers move slowly.
