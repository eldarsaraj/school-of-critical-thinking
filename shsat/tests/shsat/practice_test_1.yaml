  passage_title: The Invention of Braille
  passage_text: (1) For most of history, blind people had no easy way to read on their own. (2) That changed because of a French boy named Louis Braille, who lost his sight in an accident at the age of three. (3) As a teenager, Braille invented a system of raised dots that a reader could feel with the fingertips. (4) Each pattern of dots stand for a letter, a number, or even a musical note. (5) Today, the system he created is used in nearly every language on Earth, it has opened the world of reading to millions of people.
  question_text: "Which revision corrects the error in sentence 4?\r\n\r\n(4) Each pattern of dots stand for a letter, a number, or even a musical note."
  choice_a: Change 'dots' to 'dot'
  choice_b: Change 'stand' to 'stands'
  choice_c: Change 'Each pattern' to 'The patterns'
  choice_d: No change is needed.
  correct_answer: B
  explanation: The subject is 'Each pattern.' Because 'each' is singular, the verb must be 'stands.' The phrase 'of dots' is a prepositional phrase and does not control the verb. Choice A changes the wrong word. Choice C would fix the agreement but only by rewriting the subject and changing the sentence's meaning, which is unnecessary. Choice D leaves the subject–verb error in place.
  distractor_types:
    D: semantic_over_syntactic
    A: misattributed_error_location
    C: overcorrection
