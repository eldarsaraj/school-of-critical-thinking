  passage_text: "My father worked nights for most of my childhood, and so I grew up in a house organized around his sleep. The curtains in his room were lined with something heavy and black, and we learned to move through the afternoon as though the floorboards themselves might wake him. To me, this seemed not strange but simply the shape of the world: fathers were people who slept while the sun was up and disappeared into the dark while you dreamed.\r\n\r\nHe drove a delivery truck through the empty streets of a city that, in my imagination, belonged to him alone after midnight. I pictured the traffic lights changing for no one, the storefronts dark, my father moving through it all like the last man awake on Earth. In the morning I would find evidence of his return, a jacket over a chair, a cup still warm, the newspaper opened to a page I had not opened. He was a presence assembled from clues, a man I reconstructed each dawn from the things he left behind.\r\n\r\nOn Sundays the spell broke. He woke when we woke, and for one strange, bright day he belonged to the ordinary world of daylight and noise. I remember being almost shy with him on those days, this rumpled stranger at the breakfast table who knew, somehow, the names of all my teachers. I did not understand then what those Sundays cost him, the body forced back onto a schedule it had unlearned, the Monday night that must have felt like climbing out of a warm bed into freezing water.\r\n\r\nI am older now than he was then, and I understand at last that the man I had invented, the solitary king of the midnight streets, was simply tired. He was not living a secret adventure. He was earning the daylight the rest of us spent so freely. What I had mistaken for mystery was only love, performed in the dark, where I was not awake to see it."
  question_text: The narrator describes the father as 'a presence assembled from clues' chiefly to emphasize that —
  choice_a: the narrator knew the father mainly through small traces rather than direct contact
  choice_b: the father left messes for the family to clean each morning
  choice_c: the father worked as a detective by profession
  choice_d: the narrator could not remember the father at all
  correct_answer: A
  explanation: A still-warm cup, a jacket over a chair, an opened newspaper — the child 'reconstructed' the father each dawn from these leftover signs, because their waking hours rarely overlapped. Choice B reads 'clues' too literally. Choice C mistakes the metaphor for a job. Choice D is too extreme; the narrator does know the father, only indirectly.
  distractor_types:
    B: too_literal
    C: too_literal
    D: inference_leap
