  question_text: "Which edit should be made to the sentence below?\r\n\r\n\"There is several good reasons why the museum decided to extend its hours this summer.\""
  choice_a: Change 'its' to 'their'
  choice_b: Change 'is' to 'are'
  choice_c: Change 'decided' to 'had decided'
  choice_d: No change is needed.
  correct_answer: B
  explanation: In a sentence beginning with 'There is/are,' the verb agrees with the noun that follows it. Here that noun is 'reasons' (plural), so the verb must be 'are.' Choice A is wrong because 'its' correctly refers to the singular noun 'museum.' Choice C changes a verb tense that is already correct. Choice D overlooks the agreement error.
  distractor_types:
    D: semantic_over_syntactic
    A: overgeneralized_rule
    C: overcorrection
