  choice_b: Change 'coins' to 'coin.'
  choice_c: Change 'were' to 'was.'
  choice_d: No change is needed.
  correct_answer: C
  explanation: The subject is 'collection' (singular); neither the phrase 'of rare coins' nor the clause 'that the museum displays' changes its number, so the verb must be 'was donated.' Choice A would create a new error, since the singular 'museum' takes 'displays.' Choice B changes the wrong word. Choice D leaves the subject–verb error in place.
