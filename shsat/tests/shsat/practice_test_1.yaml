  passage_title: Building the Brooklyn Bridge
  passage_text: "(1) In the middle of the nineteenth century, the great city of New York and the neighboring city of Brooklyn were divided by the East River. (2) Every day, thousands of people crossed the water on ferries, which were slow and often dangerous in ice and fog. (3) Many people believed that a bridge long enough to span the river could never be built. (4) One engineer, John Roebling, disagreed.\r\n\r\n(5) Roebling had already designed several successful suspension bridges, in which the roadway hangs from steel cables strung between tall towers. (6) He proposed a suspension bridge across the East River that would be the longest in the world. (7) In 1869, just as construction was about to begin, Roebling's foot was crushed in an accident at the river's edge, and he died of an infection a few weeks later. (8) His son, Washington Roebling, took over the enormous project.\r\n\r\n(9) To anchor the towers, workers first had to dig down to solid rock far beneath the riverbed. (10) They labored inside gigantic wooden boxes called caissons, which were sunk underwater and filled with pressurized air to hold back the river. (11) Deep below the surface, the intense pressure caused a mysterious and agonizing illness that the workers called \"the bends.\" (12) Men grew dizzy, ached terribly in their joints, and sometimes collapsed; several died. (13) Washington Roebling himself was left permanently disabled after spending long hours in the caissons. (14) The wooden caissons were among the largest structures of their kind ever built, each covering an area greater than a city block. (15) Unable to return to the site, Roebling continued to direct the work from his apartment, watching through a telescope while his wife carried his instructions to the engineers below.\r\n\r\n(16) The person who kept the project alive was Washington's wife, Emily Warren Roebling. (17) She studied engineering, mathematics, and the science of bridge construction so that she could relay her husband's detailed instructions and answer the workers' questions herself. (18) For more than ten years, she managed much of the daily work of building the bridge. (19) When the Brooklyn Bridge finally opened in 1883, Emily Roebling was the first person to ride across it.\r\n\r\n(20) On opening day, thousands of people streamed across the bridge, marveling at a structure that many of them had once believed to be impossible. (21) The Brooklyn Bridge was, at the time, the longest suspension bridge in the world, and its towers were among the tallest structures in the entire country. (22) More than a way across the river, it became a symbol of human determination, proof that patience and ingenuity could overcome even the deepest doubts. (23) Today, well over a century later, it still carries travelers between the two halves of the city it helped to join.\r\n\r\n[FIGURE: a horizontal timeline of the Brooklyn Bridge's construction with three labeled points: 1869 (work begins; John Roebling dies), 1872 (Washington Roebling disabled by \"the bends\"), and 1883 (the bridge opens)]"
  question_text: According to the passage, why did many people doubt that the bridge could be built?
  choice_a: The two cities did not want to be connected to each other.
  choice_b: There was not enough money to pay the workers.
  choice_c: No bridge had ever spanned a river as wide as the East River.
  choice_d: The ferries crossing the river were already fast and safe.
  correct_answer: C
  explanation: The passage says, 'Many people believed that a bridge long enough to span the river could never be built.' The doubt was about the unprecedented length. Choice A is not supported. Choice B is never mentioned. Choice D contradicts the passage, which describes the ferries as 'slow and often dangerous.'
  distractor_types:
    A: inference_leap
    B: misidentified_detail
    D: opposite
