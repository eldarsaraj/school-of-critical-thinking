  passage_title: Should Schools Assign Homework Every Night? Two Views
  passage_text: "Passage A: The Case Against Nightly Homework\r\n\r\n(1) A growing number of educators now question whether assigning homework every night truly helps students learn. (2) Studies of younger students, in particular, have found little connection between piles of nightly assignments and better grades. (3) Critics argue that hours of after-school work crowd out sleep, family time, exercise, and the unstructured play through which children also learn a great deal. (4) A student who is exhausted and anxious, they point out, is not a student who is learning well. (5) Opponents also warn that homework can deepen unfairness. (6) A child with a quiet room, a reliable computer, and a parent free to help enjoys an enormous advantage over a classmate who has none of these things. (7) For reasons like these, some schools have begun to replace nightly assignments with a single, simple request: read something you enjoy. (8) Education, the supporters of this view insist, should not follow children home and swallow every hour of their evenings.\r\n\r\nPassage B: The Case for Nightly Homework\r\n\r\n(9) Defenders of nightly homework argue that short, regular practice is essential to genuine learning. (10) Skills such as solving equations or writing a clear paragraph, they say, are rarely mastered during class time alone; they demand repetition until they become almost automatic. (11) Homework, in this view, is like practicing an instrument, because no one expects to improve at the piano without playing between lessons. (12) Supporters also claim that homework builds responsibility, time management, and the discipline to work without a teacher standing nearby. (13) These habits, they argue, may matter as much as the academic content itself. (14) Homework also offers parents a window into what their children are studying and a chance to remain involved in their education. (15) Used wisely and kept reasonable in length, its defenders conclude, homework stretches learning beyond the few short hours of the school day. (16) The real problem, they suggest, is not homework itself but homework that is excessive, repetitive, or carelessly designed."
  question_text: According to Passage A, one reason to reduce nightly homework is that it can —
  choice_a: make tests much easier for teachers to grade
  choice_b: replace the need for teachers in the classroom
  choice_c: guarantee that every student earns higher grades
  choice_d: crowd out sleep, family time, exercise, and free play
  correct_answer: D
  explanation: Passage A states that 'hours of after-school work crowd out sleep, family time, exercise, and the unstructured play through which children also learn.' Choice A is never claimed. Choice B is an exaggeration the passage does not support. Choice C is the opposite of Passage A's point; it argues against assuming homework raises grades.
  distractor_types:
    A: misidentified_detail
    B: inference_leap
    C: opposite
