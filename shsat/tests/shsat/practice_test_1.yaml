  passage_group_id: ela_h_p3
  passage_title: In Praise of Boredom
  passage_text: "We are, perhaps for the first time in human history, a people who need never be bored. The moment a line grows long or an elevator slow, a glowing rectangle appears in our hands, ready to fill the smallest gap of empty time with a flood of words, images, and sound. Boredom, that familiar ache of the understimulated mind, can now be banished instantly and forever. This looks at first like a triumph. I want to suggest that it may be a quiet loss.\r\n\r\nBoredom has long enjoyed a bad reputation, and not without reason. It is unpleasant; it feels like waste; parents have been hearing children complain of it for as long as there have been children. But unpleasant is not the same as useless. A growing body of research suggests that boredom is not merely an empty state to be escaped but a productive one, a signal and an invitation. When the mind is denied external stimulation, it does not simply switch off. It turns inward and begins, restlessly, to generate. Psychologists have found that people who are first made mildly bored go on to perform better on tasks that demand creativity and original thought, as though the idle mind, starved of input, sets about manufacturing its own.\r\n\r\nThis makes a certain intuitive sense. Many of us can recall that our best ideas arrived not at our desks, straining for them, but in the shower, on a long walk, or while staring out a train window, precisely the unoccupied moments we now rush to abolish. The wandering mind, free to drift and connect, is the mind that makes unexpected leaps. Daydreaming, once scolded as the enemy of attention, turns out to be one of the ways the brain solves problems and rehearses the future.\r\n\r\nThere is a second loss, subtler than the first. The capacity to tolerate boredom may be inseparable from the capacity to tolerate solitude, and from the deeper ability to be alone with one's own thoughts. A person who cannot bear a single unstimulated minute, who reaches for distraction at the faintest hint of emptiness, has in a sense lost the ability to keep himself company. He is never quite alone with his mind, because he never lets his mind be quiet long enough to hear it. We may be raising a generation superbly skilled at avoiding boredom and strangely unpracticed at the thing boredom was always secretly teaching: how to sit with oneself.\r\n\r\nNone of this is an argument for manufacturing misery, or for romanticizing the dull. It is only a plea for restraint. The next time you find yourself waiting, with nothing to do and the familiar itch to reach for the screen, you might try, just once, to do nothing instead. Let the boredom come. Let the mind grow restless and then watch where it goes. You may find that the empty minute was not empty after all, and that we were never meant to fill every silence the instant it appeared."
  question_text: The author’s main claim is that the power to banish boredom instantly is —
  choice_a: a convenience that may also carry a hidden cost
  choice_b: one of the greatest achievements of modern life
  choice_c: something almost no one is able to resist
  choice_d: harmful only to very young children
  correct_answer: A
  explanation: The author says the end of boredom 'looks at first like a triumph' but 'may be a quiet loss,' framing it as a mixed blessing. Choice B states only the surface view the author goes on to question. Choices C and D are not the central claim.
  distractor_types:
    B: misidentified_detail
    C: inference_leap
    D: too_narrow
