  passage_title: The First Sandwich
  passage_text: (1) The sandwich is one of the most popular foods in the world. (2) It is named after an English nobleman, the Earl of Sandwich, who lived in the 1700s. (3) According to the story, the earl loved card games so much that he did not want to leave the table to eat. (4) He asked a servant to bring him slices of meat tucked between two pieces of bread, this clever idea let him keep playing while he ate.
  question_text: "Which revision of sentence 4 corrects the error?\r\n\r\n(4) He asked a servant to bring him slices of meat tucked between two pieces of bread, this clever idea let him keep playing while he ate."
  choice_a: Insert a comma after 'meat.'
  choice_b: Delete the comma after 'bread.'
  choice_c: Change the comma after 'bread' to a semicolon.
  choice_d: No change is needed.
  correct_answer: C
  explanation: 'Sentence 4 is a comma splice: ''...two pieces of bread'' and ''this clever idea let him...'' are each complete sentences joined by only a comma. A semicolon correctly connects them. Choice A adds an unneeded comma inside a clause. Choice B would remove the comma entirely and fuse the two sentences, making the run-on worse. Choice D leaves the splice uncorrected.'
