  passage_title: Rivers of Ice
  passage_text: "High in the mountains and across the frozen poles lie some of the most powerful sculptors on Earth. They do not work with hammers or chisels. They are glaciers, enormous and slow-moving rivers of ice, and over thousands of years they have carved deep valleys, ground down mountains, and shaped much of the land we live on today.\r\n\r\nA glacier is born from snow. In places where more snow falls each winter than melts away each summer, the snow never fully disappears. Instead, layer piles upon layer, year after year. The weight of the snow above slowly presses the snow below into dense ice, much as a snowball packs tighter the harder you squeeze it. When the ice grows thick and heavy enough, often hundreds of feet deep, something remarkable happens. Pulled steadily by gravity, the entire frozen mass begins, very slowly, to move.\r\n\r\nThere are two main kinds of glaciers. Valley glaciers flow downhill through mountain valleys like frozen streams. Continental glaciers, also called ice sheets, are vast domes of ice that can bury an entire landmass; today they cover most of Greenland and Antarctica. During the last ice age, ice sheets thousands of feet thick spread across much of North America and Europe before melting back to where they remain today.\r\n\r\nGlaciers move so slowly that the motion is almost impossible to see. Many creep forward only a few inches a day. Yet over centuries this patient movement reshapes the world. As a glacier flows, it behaves like a giant sheet of sandpaper. Rocks frozen into the bottom of the ice grind against the ground, gouging out deep grooves and crushing solid stone into fine powder. A valley that began as a narrow, V-shaped notch cut by a stream is slowly widened and deepened into a broad, U-shaped trough with steep walls. Many of the most dramatic landscapes on Earth, from the deep fjords of Norway to the towering cliffs of Yosemite Valley, were sculpted in exactly this way.\r\n\r\nWhen a glacier finally melts, it leaves behind clues that tell its story. It drops the rocks and dirt it has carried for miles, sometimes piling them into long ridges called moraines. Occasionally it strands a boulder the size of a house far from any rock like it, a puzzle that once baffled scientists who could not imagine what force had carried it there. Meltwater fills the hollows the ice scooped out, forming lakes. The Great Lakes of North America, which together hold about one-fifth of the world's fresh surface water, sit in enormous basins carved by glaciers during the last ice age.\r\n\r\nToday, many of the world's glaciers are shrinking, and scientists study them with growing concern. Glaciers store huge amounts of fresh water that whole regions depend on, releasing it slowly each summer as they melt. The ice also holds a frozen record of the distant past. Bubbles trapped deep within a glacier contain tiny samples of ancient air, allowing researchers to learn what the planet's atmosphere was like many thousands of years ago. These rivers of ice move far too slowly for us to watch, yet they have written much of the story of our planet, and they are still writing it today.\r\n\r\n[FIGURE: a side-by-side comparison diagram showing a narrow V-shaped river valley on the left and a wide U-shaped glacial valley on the right, with an arrow indicating how a glacier reshapes the valley over time]"
  question_text: According to the passage, how does a glacier first begin to form?
  choice_a: Rivers freeze solid during an unusually cold winter.
  choice_b: A large lake overflows its banks and then freezes.
  choice_c: Strong winds blow loose ice into a mountain valley.
  choice_d: Snow builds up year after year in a place where more falls than melts.
  correct_answer: D
  explanation: The passage explains that 'in places where more snow falls each winter than melts away each summer, the snow never fully disappears,' and the buildup is slowly pressed into ice. Choices A, B, and C describe processes the passage never mentions as the way glaciers form.
  distractor_types:
    A: misidentified_detail
    B: inference_leap
    C: inference_leap
