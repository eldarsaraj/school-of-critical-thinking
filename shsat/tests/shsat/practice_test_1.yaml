  passage_group_id: ela_r_p1
  passage_title: 'Bioluminescence: Living Light'
  passage_text: "On a dark night far from shore, the ocean can suddenly begin to glow. A breaking wave glitters with blue-green fire; a swimmer's hand leaves a trail of sparks in the water. This light is not a reflection of the moon or the stars. It is made by living things, a phenomenon called bioluminescence.\r\n\r\nBioluminescence is the production of light by a living organism. It happens when a molecule called luciferin reacts with oxygen, releasing its energy as light rather than as heat. Because almost none of the energy escapes as warmth, scientists sometimes call it \"cold light.\" A firefly blinking in a summer field and a fish glowing in the deep sea are using nearly the same chemical trick.\r\n\r\nIn the deep ocean, where sunlight never reaches, bioluminescence is everywhere. Some animals use it to hunt. The anglerfish, for example, dangles a glowing lure in front of its mouth to draw curious prey straight toward its jaws. Other animals use light to survive an attack. When a certain squid is threatened, it does not release dark ink the way a shallow-water octopus does; instead, it sprays out a cloud of glowing liquid that startles and confuses the predator while the squid escapes into the dark. Still other creatures flash patterns of light to signal to mates they could never see otherwise.\r\n\r\nScientists have even learned to put bioluminescence to work. By borrowing the genes that make certain jellyfish glow, researchers can attach a kind of living light to individual cells and watch processes inside the body that were once completely invisible. A trick that evolved at the bottom of the sea has quietly become one of the most powerful tools in modern biology.\r\n\r\n[FIGURE: a labeled diagram of an anglerfish in the dark deep ocean, showing its glowing lure extended in front of its mouth and a small fish swimming toward the light]"
  question_text: According to the passage, what makes bioluminescence different from ordinary light such as that given off by a flame?
  choice_a: It can be seen only in the deep ocean, where sunlight never reaches.
  choice_b: It is produced by a chemical reaction inside a living organism rather than by burning.
  choice_c: It gives off a great deal of heat as it shines.
  choice_d: It is always exactly the same shade of blue-green.
  correct_answer: B
  explanation: 'The passage explains that bioluminescence is ''light made by living things,'' produced when luciferin reacts with oxygen and releases energy ''as light rather than as heat'' — unlike a flame, which burns. Choice A names one place the light appears, not what makes it different. Choice C is the opposite of the truth: the passage calls it ''cold light'' because it produces almost no heat. Choice D mistakes one example of its color for a defining feature.'
  distractor_types:
    A: misidentified_detail
    C: opposite
    D: misidentified_detail
