- section: ELA
  stage: easy_module
  question_number: 5
  question_type: multiple_choice
  skill: supporting_detail
  difficulty: easy
  topic: ''
  passage_group_id: ela_e_p1
  passage_title: The Amazing Octopus
  passage_text: "The octopus may be one of the strangest and most intelligent animals on Earth. It has no bones, eight arms instead of legs, three hearts, and blue blood. Two of its hearts pump blood to the gills, while the third drives blood through the rest of the body. For centuries, frightened sailors told stories about giant octopuses that could wrap their arms around a ship and drag it beneath the waves. The truth about these animals turns out to be far stranger, and far more wonderful, than the legends.\r\n\r\nAn octopus is a master of disguise. Special cells in its skin, called chromatophores, can change color in less than a second, letting the animal blend into sand, rock, or coral almost perfectly. Some species can also change the texture of their skin, raising tiny bumps to imitate the rough surface of a reef or the ripple of seaweed. A hunting octopus can melt into the seafloor and then reappear, seemingly out of nowhere, to seize a passing crab. The strangest part is that octopuses are very likely colorblind, yet somehow they match the colors around them with astonishing accuracy, and scientists still do not completely understand how.\r\n\r\nIf hiding does not work, the octopus has other tricks. When a predator comes too close, it can shoot out a cloud of dark ink and jet away, using a muscular tube called a siphon to push water and rocket backward through the sea. Because its body contains no bones, an octopus the size of a large dog can squeeze through an opening no wider than a coin. Aquarium keepers have learned this the hard way. Octopuses have escaped their tanks through tiny gaps in the lid, slithered across the floor, and even climbed into neighboring tanks to hunt before sneaking back to their own.\r\n\r\nWhat surprises scientists most is how clever octopuses are. In laboratory experiments, they have learned to open screw-top jars to reach the food inside, to find their way through simple mazes, and even to tell one human face from another, behaving warmly toward a keeper who fed them and squirting water at one who did not. Some octopuses gather coconut shells and broken halves of clamshells, carry them across the seafloor, and fit them together into portable shelters, a behavior that looks remarkably like using tools. Researchers who work with octopuses report that different individuals seem to have different personalities: some are shy, some are bold, and some appear to be mischievous. Most surprising of all, the majority of an octopus's nerve cells are not located in its brain at all. They are spread throughout its eight arms, so that each arm can taste, touch, and react to the world almost on its own.\r\n\r\nFor all of these remarkable gifts, octopuses live very short lives, often only one or two years. A female octopus lays thousands of eggs and then guards them faithfully, fanning them with fresh seawater and never leaving them, even to hunt. By the time the eggs finally hatch, she has usually used up the last of her strength and does not survive. The brief, solitary, and brilliant life of the octopus remains one of the ocean's great mysteries, and scientists are only beginning to understand it.\r\n\r\n[FIGURE: a labeled diagram of an octopus showing its eight arms, its mantle (the rounded body), the siphon used for jet propulsion, and an enlarged inset of color-changing skin cells called chromatophores]"
  question_text: According to the passage, how is an octopus able to change color so quickly?
  choice_a: It uses special skin cells called chromatophores.
  choice_b: It swims into patches of differently colored water.
  choice_c: It grows a new layer of skin each day.
  choice_d: It releases a cloud of dark ink.
  correct_answer: A
  explanation: The passage states that 'special cells in its skin, called chromatophores, can change color in less than a second.' Choices B and C are not supported anywhere in the text. Choice D confuses the color-changing ability with the separate ink-and-escape defense.
  distractor_types:
    B: misidentified_detail
    C: inference_leap
    D: misidentified_detail
