  passage_text: "(1) For as long as species have vanished from the Earth, their disappearance has been treated as final. (2) Extinction, in the famous phrase, is forever. (3) A small group of scientists now believes that this may no longer be entirely true. (4) Using advances in genetics, they hope to bring vanished species, or something close to them, back into the living world, a project known as de-extinction.\r\n\r\n(5) The methods under development are remarkable. (6) Researchers can read the genetic code preserved in museum specimens and frozen remains, then attempt to edit the DNA of a living relative until it resembles that of the lost animal. (7) The woolly mammoth, gone for thousands of years, is a favorite target; so is the passenger pigeon, a bird once so numerous that its flocks darkened American skies before hunting drove it to extinction in 1914. (8) To their supporters, these efforts are not science fiction but the logical next step in humanity's growing power over life itself.\r\n\r\n(9) Advocates argue that de-extinction is, above all, a matter of repair. (10) Human beings caused many of these extinctions, they point out, and we therefore bear a responsibility to undo the damage where we can. (11) Restoring a lost species, they add, could revive whole ecosystems that collapsed when that species disappeared. (12) Some scientists imagine herds of mammoths one day trampling the Arctic tundra, helping to slow the thawing of frozen ground that now releases harmful gases into the atmosphere.\r\n\r\n(13) Critics are far less enthusiastic. (14) They warn, first, that the money and effort poured into resurrecting the dead might be far better spent protecting the thousands of species still clinging to survival today. (15) Every dollar devoted to the mammoth, they argue, is a dollar not spent saving the elephants that are vanishing in our own time. (16) Others raise a deeper objection. (17) A revived species would return to a world that has moved on without it, a world whose forests have been cleared, whose climate has shifted, and whose other creatures have continued to evolve. (18) An animal restored to such a world, critics suggest, might be less a returning native than a stranger with nowhere to belong.\r\n\r\n(19) Beneath the scientific debate lies an uncomfortable question about human ambition. (20) The same technology that could heal old wounds could also encourage a careless attitude toward extinction itself: if the dead can always be brought back, why work so hard to keep the living alive? (21) De-extinction forces us to decide not only what we are able to do, but what we ought to do, and those are not the same question. (22) The power to reverse extinction, if it ever truly arrives, will test not only our science but our wisdom."
  question_text: Which sentence best states the central idea of the passage?
  choice_a: Scientists have already succeeded in bringing the woolly mammoth back to life.
  choice_b: The passenger pigeon was hunted to extinction in the year 1914.
  choice_c: New genetic tools may make a limited form of de-extinction possible, but pursuing it raises difficult scientific and ethical questions.
  choice_d: Money spent on endangered species today is almost always wasted.
  correct_answer: C
  explanation: The passage lays out both the promise of de-extinction (genetic tools, ecological repair) and its perils (cost, a changed world, moral hazard), so the central idea is that the possibility is real but deeply uncertain. Choice A overstates the science, which the passage calls 'under development.' Choice B is a single supporting detail. Choice D distorts the critics' argument and is not the passage's claim.
  distractor_types:
    A: inference_leap
    B: too_narrow
    D: opposite
