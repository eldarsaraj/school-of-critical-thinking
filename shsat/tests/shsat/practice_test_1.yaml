  question_text: "Which edit should be made to the sentence below?\r\n\r\n\"The bouquet of bright spring flowers were placed in the center of the long table.\""
  choice_a: Change 'flowers' to 'flower'
  choice_b: Change 'bright spring flowers' to 'flowers, bright and spring,'
  choice_c: No change is needed.
  choice_d: Change 'were' to 'was'
  correct_answer: D
  explanation: The subject of the sentence is 'bouquet,' which is singular; 'of bright spring flowers' is a prepositional phrase that does not change the number of the subject. The verb must therefore be 'was.' Choice A targets the wrong word — the noun closest to the verb is not necessarily the subject. Choice B needlessly rewrites a phrase that has no error. Choice C ignores a real subject–verb agreement problem.
  distractor_types:
    C: semantic_over_syntactic
    A: misattributed_error_location
    B: overcorrection
