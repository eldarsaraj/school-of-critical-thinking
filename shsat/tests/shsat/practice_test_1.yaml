  passage_text: "In the summer of 1960, a young Englishwoman stepped off a boat onto the shore of a remote forest in what is now Tanzania. She was twenty-six years old, she had no college degree, and she had been sent to do something no scientist had ever managed: to live among wild chimpanzees and learn how they truly behaved. Her name was Jane Goodall, and the work she began that summer would slowly change the way the world understood both animals and ourselves.\r\n\r\nAs a child in England, Goodall had dreamed of living among the animals of Africa. She had loved animals from the time she was small, once spending hours hidden in a hot henhouse simply to discover how a hen laid an egg. Most adults told her that traveling to Africa to study wild creatures was an impossible dream, especially for a girl with little money. But a famous scientist named Louis Leakey came to believe that her patience and her fresh, untrained eyes might be exactly what the study of chimpanzees required. He chose her in part because she had not been taught to think the way other scientists did.\r\n\r\nAt first, the chimpanzees of Gombe fled whenever Goodall came near. For months she saw them only as distant shapes through her binoculars. Rather than chase them, she waited. Every single day she returned to the same hillside, sitting quietly, asking nothing of them, until slowly the animals decided that she was no threat at all. After more than a year of this patient watching, the chimpanzees finally allowed her into their world, and she was able to observe them from only a few feet away.\r\n\r\nWhat she saw astonished the scientific community. One morning she watched a chimpanzee she had named David Greybeard carefully strip the leaves from a twig and poke the bare stem into a termite mound, pulling it out covered with insects to eat. Goodall had just witnessed a wild animal not only using a tool but making one. Until that moment, many scientists had insisted that toolmaking was the single ability that set human beings apart from every other creature on Earth. When Goodall reported what she had seen, Leakey famously declared that science must now either redefine the word \"tool,\" redefine the word \"man,\" or else accept chimpanzees as humanity's close relatives. In the years that followed, she observed even more surprising behavior, including chimpanzees hunting other animals and eating meat, something earlier researchers had not believed they did.\r\n\r\nGoodall broke with scientific tradition in another way as well. Other researchers gave their animals numbers; Goodall gave hers names, such as David Greybeard, Flo, and Goliath, and she wrote about their distinct personalities, their friendships, their playfulness, and their grief. Some scientists criticized her sharply, arguing that she was imagining human feelings in creatures that could not really have them. Over the following decades, however, careful research confirmed a great deal of what she had described. Chimpanzees, it turned out, do form deep and lasting family bonds, do comfort one another in times of distress, and can even wage something disturbingly like war between rival groups.\r\n\r\nAs the years passed, Goodall's attention widened far beyond Gombe. She watched the forests where chimpanzees lived being cut down, and she saw the animals themselves being hunted and captured. In 1977 she founded an institute to protect wild chimpanzees and their shrinking habitat. Eventually she made the difficult decision to leave the forest she loved in order to travel the world as one of the planet's most tireless voices for conservation. She was especially determined to reach young people, founding a youth program called Roots & Shoots that has since spread to more than sixty countries.\r\n\r\nJane Goodall began as a young woman with no degree and an \"impossible\" dream. By refusing to look away, by waiting patiently when others would have given up, and by daring to see chimpanzees as individuals rather than mere specimens, she did far more than study a group of animals in a distant forest. She\
    \ quietly redrew the boundary that people had long imagined between human beings and the rest of the living world."
  question_text: The passage suggests that Louis Leakey chose Jane Goodall partly because —
  choice_a: she already held advanced university degrees in science
  choice_b: her lack of traditional training might let her observe chimpanzees with fresh eyes
  choice_c: she had spent years studying chimpanzees in zoos
  choice_d: she happened to live very close to the Gombe forest
  correct_answer: B
  explanation: The passage says Leakey 'chose her in part because she had not been taught to think the way other scientists did.' Choice A contradicts the passage, which stresses that she had no degree. Choices C and D are not supported anywhere in the text.
  distractor_types:
    A: opposite
    C: misidentified_detail
    D: inference_leap
