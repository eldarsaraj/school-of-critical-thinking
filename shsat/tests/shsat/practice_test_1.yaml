  question_text: "Which revision best corrects the error in the sentence below?\r\n\r\n\"My brother enjoys hiking, swimming, and to ride his bicycle on weekends.\""
  choice_a: Change 'swimming' to 'to swim.'
  choice_b: Change 'enjoys' to 'enjoy.'
  choice_c: Change 'to ride' to 'riding.'
  choice_d: No change is needed.
  correct_answer: C
  explanation: Items in a series should share the same grammatical form (parallel structure). Because 'hiking' and 'swimming' are -ing forms, the third item must be 'riding.' Choice A would make the list parallel only by breaking the first two items. Choice B introduces a subject–verb error ('brother enjoy'). Choice D overlooks the faulty parallelism.
  distractor_types:
    D: semantic_over_syntactic
    A: overcorrection
    B: misattributed_error_location
