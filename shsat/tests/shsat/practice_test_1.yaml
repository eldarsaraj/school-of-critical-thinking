  passage_title: Emily Dickinson, "Hope is the thing with feathers"
  passage_text: "\"Hope\" is the thing with feathers\r\nThat perches in the soul,\r\nAnd sings the tune without the words,\r\nAnd never stops at all,\r\n\r\nAnd sweetest in the gale is heard;\r\nAnd sore must be the storm\r\nThat could abash the little bird\r\nThat kept so many warm.\r\n\r\nI've heard it in the chillest land,\r\nAnd on the strangest sea;\r\nYet, never, in extremity,\r\nIt asked a crumb of me."
  question_text: In the poem, where does the speaker say that hope lives?
  choice_a: in the soul
  choice_b: on the strangest sea
  choice_c: in the gale
  choice_d: in a faraway, frozen land
  correct_answer: A
  explanation: The poem's second line states that hope 'perches in the soul.' Choices B, C, and D all name places where hope is heard or tested later in the poem — the gale, the chillest land, the strangest sea — but the soul is where the poem says hope actually lives.
  distractor_types:
    B: misidentified_detail
    C: misidentified_detail
    D: misidentified_detail
