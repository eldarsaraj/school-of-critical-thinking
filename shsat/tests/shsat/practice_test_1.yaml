  question_text: Why does the author begin the passage by mentioning the frightening stories sailors once told about giant octopuses?
  choice_a: to contrast old legends with the more surprising truth the passage will explain
  choice_b: to prove that octopuses really are dangerous to ships
  choice_c: to explain how an octopus defends itself from predators
  choice_d: to argue that sailors of the past were foolish
  correct_answer: A
  explanation: The opening recalls the legends and then says 'the truth about these animals turns out to be far stranger, and far more wonderful, than the legends,' setting up a contrast between myth and fact. Choice B contradicts the passage, which corrects the scary stories. Choice C names a topic from later in the text. Choice D misreads the author's friendly tone.
