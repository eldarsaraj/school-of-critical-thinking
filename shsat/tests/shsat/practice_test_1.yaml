  passage_title: The Blue Door
  passage_text: "For as long as Maya could remember, the door of the house next to hers had been blue, the deep, chipped blue of an old rowboat. The woman who lived behind it was named Mrs. Okafor, and she was, in Maya's opinion, the slowest person in the world. It took Mrs. Okafor a full minute to climb her three front steps. It took her even longer to fit her key into the lock, and Maya, racing past on her bicycle, often wondered how anyone could move so carefully through a day.\r\n\r\nThat summer, Maya's mother began sending her next door with covered plates—rice and stew on Sundays, slices of cake on birthdays. \"Stay and talk a little,\" her mother always said. \"She lives alone.\" Maya did not want to stay and talk. She wanted to be at the park, where the others were already choosing teams without her.\r\n\r\nThe first afternoon, she handed over the plate at the blue door and turned to leave. \"You are in a great hurry,\" Mrs. Okafor said. It was not a question. Maya stopped. \"Come. You can spare an old woman ten minutes.\" Her voice was warm but left no room for argument.\r\n\r\nInside, the apartment smelled of cloves and old paper. Every surface held something: small carved animals, photographs in mismatched frames, a clock that ticked too loudly. Mrs. Okafor lowered herself into a chair as slowly as ever and gestured for Maya to sit. Then she picked up a wooden bird from the table and turned it over in her hands. \"My husband carved this,\" she said. \"He was a teacher. He could not sit still either, when he was young. Like you.\" She smiled at Maya as if they shared a secret.\r\n\r\nShe began to talk—about the country she had left long ago, about the ship that had carried her across an ocean, about learning a new language one stubborn word at a time. Maya, who had meant to leave after ten minutes, found that an hour had passed and she had not once thought about the park.\r\n\r\nShe came back the next day without being sent. And the day after that. Mrs. Okafor taught her to fold paper into cranes and to say \"thank you\" in three languages. Maya taught Mrs. Okafor the names of the players on her favorite team, and Mrs. Okafor pretended, badly, to care. Some afternoons they simply sat, the loud clock ticking, and said nothing at all.\r\n\r\nIt was on one of those quiet afternoons that Maya understood something. Mrs. Okafor did not move slowly because she was old and tired. She moved slowly because she had decided, somewhere along the way, that the small things—the key in the lock, the bird in her hands, the face of a child at her door—were worth the time it took to notice them.\r\n\r\nWhen Maya rode past the blue door now, she did not race. She slowed down, and sometimes she stopped, and the summer, which she had been so afraid of wasting, did not feel wasted at all."
  question_text: According to the story, what did Mrs. Okafor teach Maya to do?
  choice_a: ride a bicycle slowly and carefully
  choice_b: carve small animals out of wood
  choice_c: fold paper into cranes and say 'thank you' in three languages
  choice_d: play on her favorite sports team
  correct_answer: C
  explanation: The story states, 'Mrs. Okafor taught her to fold paper into cranes and to say "thank you" in three languages.' Choice A is not taught. Choice B describes the husband, who carved the wooden bird. Choice D reverses the roles — Maya taught Mrs. Okafor about the team.
  distractor_types:
    A: misidentified_detail
    B: misidentified_detail
    D: misidentified_detail
