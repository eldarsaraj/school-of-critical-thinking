  question_text: The poet compares hope to a bird mainly in order to suggest that hope —
  choice_a: stays with a person and keeps singing even in the hardest times
  choice_b: is delicate and easily destroyed by trouble
  choice_c: flies away exactly when a person needs it most
  choice_d: belongs only to people who are naturally cheerful
  correct_answer: A
  explanation: Across the poem, the bird 'never stops at all,' is heard 'sweetest in the gale,' and survives 'the chillest land' and 'the strangest sea.' The comparison casts hope as constant and resilient. Choices B and C are the opposite of what the poem shows. Choice D adds a condition the poem never suggests; in fact hope 'asked a crumb of' no one.
