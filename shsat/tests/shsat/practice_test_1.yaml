  question_text: "Which revision best corrects the error in the sentence below?\r\n\r\n\"The new librarian explained that our school's collection of graphic novels is now larger than the public library.\""
  choice_a: Change 'than the public library' to 'than the public library’s.'
  choice_b: Change 'is now larger' to 'is now the largest.'
  choice_c: Change 'collection' to 'collections.'
  choice_d: No change is needed.
  correct_answer: A
  explanation: 'As written, the sentence compares our ''collection'' to ''the public library'' itself, but a collection and a building cannot logically be compared. ''The public library’s'' is shorthand for ''the public library’s collection,'' which makes the comparison parallel: collection to collection. Choice B swaps a comparative for a superlative without fixing the faulty comparison. Choice C creates an agreement problem. Choice D leaves the illogical comparison standing.'
