  question_text: The author's use of the phrase 'wild storm-culture' most strongly suggests
    that he regards storms as
  choice_a: a danger that the forest has learned to survive by chance
  choice_b: a force that shapes the forest the way a gardener tends a bed
  choice_c: an unfortunate cost of the beauty the mountains provide
  choice_d: a subject that scientists have not yet studied properly
  choice_e: an influence that matters only to the youngest trees
  correct_answer: B
  explanation: '''Culture'' here carries its old sense of cultivation, and the passage has
    already compared avalanches to ''a gardener'' trimming a bed and described the winds as
    ''measured and bestowed with love''. Storms do the tending, which is B. A keeps the danger
    and removes the design the phrase implies. C treats the storms as a price paid rather
    than the means of the result. E contradicts the passage, which follows the storms through
    centuries and across full-grown giants. D raises a question about scientific study that
    the passage never takes up.'
