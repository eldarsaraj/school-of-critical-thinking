  question_text: As used in the passage, 'verdict' ('what it hands her is a verdict') most
    nearly means
  choice_a: a punishment handed down
  choice_b: a strongly held opinion
  choice_c: an official ruling in a court
  choice_d: a decision made without care
  choice_e: a judgment given without the reasoning behind it
  correct_answer: E
  explanation: 'The sentence completes itself: what she hands over is a verdict, ''and the
    learner needed the reasoning''. The word is doing the work of naming a conclusion stripped
    of its steps, which is E. C is the literal courtroom sense and is the main trap. B is
    close but leaves out the missing reasoning, which is the whole contrast. D adds carelessness,
    though the passage insists the expert reports ''accurately''. A takes the legal sense
    one step further into punishment.'
  distractor_types:
    A: wrong_concept
