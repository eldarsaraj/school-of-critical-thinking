- section: reading_comprehension
  stage: routing
  question_number: 10
  question_type: multiple_choice
  skill: inference
  difficulty: hard
  topic: ''
  passage_group_id: T3-P2
  passage_title: The Substitute
  passage_text: 'Ms. Ferrar came in October and stayed nine weeks, which nobody expected,
    and on the first morning she read the roll and got to me and said Daniel, and I said here.


    My name is not Daniel. There is a Daniel Ortiz in our class who sits by the window, and
    he was absent that day, and the roll must have had the two of us next to each other. She
    looked up when I answered, and matched my face to the name, and that was that.


    I meant to fix it at lunch. I had the sentence ready. Then it was the second day, and
    the sentence had gotten heavier overnight. On the third day Daniel Ortiz came back and
    she called him Daniel too, and neither of us said anything, and he looked at me for about
    a second from across the room and then he looked down at his desk. I have thought about
    that second more than I have thought about almost anything.


    Here is the part I cannot explain. Daniel is better than me. Not at school. At the other
    thing, the one where you walk into a room and people are glad. And for nine weeks I got
    to be him for forty-five minutes a day.


    Ms. Ferrar liked Daniel. She would say, Daniel, come look at this, and I would come look
    at it, and whatever it was would turn out to be worth looking at, because she only showed
    you things she thought were worth it. Once she kept a bird''s nest in a shoebox for a
    week so we could see how it was built from the inside, and she held the box out to me
    first.


    I was not pretending. That is the thing I want to say and cannot get right. I did not
    act like him. I answered to it, and the answering was the whole of it.


    In December she left. On the last day she went around and shook everybody''s hand, which
    nobody does, and when she got to me she said, take care of yourself, Daniel. I said you
    too. Then she got to Daniel Ortiz and said the same words in the same voice.


    At the door she stopped and looked back at the room the way you look at a room you are
    not coming back to. I do not know what she saw. I have decided that she knew, and I am
    aware that I decided it rather than found it out, and I have not changed my mind.


    Daniel and I are not friends. We are something, though. In the hall we do a thing with
    our chins. It is not much. It is more than we did before.'
  question_text: The narrator says the sentence he had ready 'had gotten heavier overnight'.
    This most nearly means that
  choice_a: he had forgotten the exact words he meant to use
  choice_b: he had begun to enjoy the mistake too much to end it
  choice_c: he was afraid Ms. Ferrar would be angry with him
  choice_d: correcting the error had become harder the longer it stood
  choice_e: he no longer believed the correction would be understood
  correct_answer: D
  explanation: 'The weight is a measure of difficulty, and it grows with time rather than
    with anything he learns: he meant to fix it at lunch, and by the second day the same sentence
    costs more. That is D. B names something the story does show later, in the fourth paragraph,
    but not what this phrase reports at this point. C supplies a fear of punishment the passage
    never mentions; Ms. Ferrar is nowhere shown as frightening. A makes it a lapse of memory,
    though he says the sentence was ready. E imports a doubt about being understood that does
    not appear.'
  distractor_types:
    A: too_literal
    B: partly_true_but_wrong
    C: inference_leap
    E: wrong_concept
