  question_text: Twenty-four students took a test and every score was recorded. Which of the
    following must be true?
  choice_a: If the median is 80, then at least 12 students scored 80 or higher.
  choice_b: If the mean is 80, then at least one student scored exactly 80.
  choice_c: If the mode is 80, then more than half the students scored 80.
  choice_d: If the range is 40, then the highest score is 80.
  choice_e: ''
  correct_answer: A
  explanation: With 24 scores the median is the average of the 12th and 13th values in order.
    The 13th value is at least as large as the median, and the 12 scores from the 13th to
    the 24th are each at least as large as the 13th, so at least 12 students scored 80 or
    higher. None of the others is guaranteed. A mean of 80 can arise with no student scoring
    exactly 80, as when half score 70 and half score 90. The mode is only the most common
    score and might occur just twice. And a range of 40 fixes the gap between highest and
    lowest, not the highest score itself.
  distractor_types:
    B: wrong_setup
    C: fast_pattern_match
    D: procedure_substitution
