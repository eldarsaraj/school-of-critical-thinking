  choice_a: allows a person to concentrate on more than one thing at once
  choice_b: is acquired only after many years of daily practice
  choice_c: buys freed attention at the cost of being able to describe the steps
  choice_d: makes a difficult task feel easier than it really is
  choice_e: is more easily explained in physical skills than in mental ones
