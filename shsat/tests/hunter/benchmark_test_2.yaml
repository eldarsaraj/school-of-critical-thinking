    of a beetle, however, a cubic meter of fog holds a considerable quantity of water, provided
    the beetle can persuade it to hold still.


    Certain darkling beetles of the Namib have solved this, and their solution has two parts,
    one in what they do and one in how they are built.


    The behavior is the strange part to watch. Before dawn, on nights when the fog comes,
    the beetle climbs the face of a dune to the crest, turns to face the incoming wind, and
    tips forward into a headstand, bracing its front legs and lifting its rear so that its
    hardened back forms a ramp angled into the moving air. Then it holds still, sometimes
    for an hour.


    The structure is what makes the posture pay. The beetle''s back is not smooth. It carries
    a field of small bumps separated by shallow channels. Fog droplets that strike a bump
    are caught there and merge with the droplets already collected, and while a droplet remains
    small its grip on the surface easily outmatches the pull of gravity. As it grows, that
    balance tips. At a certain size the droplet can no longer hold on; it releases and runs
    down the channels, which, because the beetle is standing on its head, lead directly to
    its mouth.


    What is worth noticing is that no part of this is the beetle doing work. It does not pump
    or filter or drink in any active sense. It sets its body at an angle in a wind and waits
    for physics to deliver the drink. Engineers building fog-harvesting nets for dry regions
    have taken the same lesson, and the difficulty they report is the one the beetle had already
    settled: catching droplets is the easy half, and persuading them to let go and run somewhere
    useful is the whole of the problem.'
  question_text: According to the passage, what causes a droplet on the beetle's back to begin
    running down toward its mouth?
