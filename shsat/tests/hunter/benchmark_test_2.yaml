  passage_text: ''
  question_text: In a class of 30 students, 18 play an instrument and 14 play a sport. Six
    students do both. If one student is chosen at random, what is the probability that the
    student does neither?
  choice_a: 1/15
  choice_b: 1/5
  choice_c: 13/15
  choice_d: 2/15
  choice_e: ''
  correct_answer: D
  explanation: 'Two steps. First count the students who do at least one activity, being careful
    not to count the six twice: 18 + 14 - 6 = 26. Then the students who do neither number
    30 - 26 = 4, so the probability is 4/30 = 2/15. The traps: B adds 18 and 14 without removing
    the overlap, leaving 30 - 32 and forcing a guess; C gives the probability of doing at
    least one activity; A is a slip in reducing the fraction.'
  distractor_types:
    A: arithmetic_slip
    B: wrong_setup
    C: last_step_trap
