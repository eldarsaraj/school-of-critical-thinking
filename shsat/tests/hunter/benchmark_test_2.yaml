  choice_b: A change in the wind that pushes the droplet along the channel
  choice_c: The warmth of the beetle's back, which loosens the droplet's hold
  choice_d: The droplet growing heavy enough for gravity to overcome its grip
  choice_e: The channels filling with water until they overflow
  correct_answer: D
