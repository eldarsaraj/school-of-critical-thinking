  choice_c: It cannot be determined.
  choice_d: It stays 40.
  choice_e: ''
  correct_answer: D
  explanation: 'With nine scores the median is the fifth one in order. The four scores that
    changed are all above it, so the fifth score is untouched and its position in the order
    is untouched too: the median is still 40. The traps: A adds the increase to the median
