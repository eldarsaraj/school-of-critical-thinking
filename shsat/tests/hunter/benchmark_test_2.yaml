  question_text: According to the passage, the Yellow Pine is overturned more often than any
    other Sierra tree for which combination of reasons?
  choice_a: It grows taller than other pines and its wood is unusually brittle.
  choice_b: Its foliage is heavy for its height, it often grows sparsely, and its soil is
    less firm.
  choice_c: It grows near the summits, where the winds are strongest and most sudden.
  choice_d: Its roots are shallower than those of the Juniper and the Dwarf Pine.
  choice_e: It is the only Sierra tree whose branches cannot bend in a strong wind.
  correct_answer: B
  explanation: 'The passage gives three reasons together: its ''leaves and branches form a
    larger mass in proportion to its height'', it is ''planted sparsely, leaving open lanes
    through which storms may enter with full force'', and the soil beneath it, longer exposed
    since the ice-sheet retreated, ''offers a less secure anchorage for the roots''. That
    is B. C reverses its position, since it grows along the lower portion of the range. A
    and E supply brittleness and rigid branches that the passage never mentions, and the Sugar
    Pine, not the Yellow Pine, is the one singled out for height. D compares roots, when the
    passage points to the soil around them.'
