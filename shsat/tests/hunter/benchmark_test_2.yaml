  question_text: Which detail from the passage most directly supports the idea that a tree
    survives a gale by yielding to it rather than by resisting it?
  choice_a: Pines six feet in diameter bend like grasses before a mountain gale.
  choice_b: The alpine conifers are protected by their toughness and the closeness of their
    growth.
  choice_c: The Silver Firs in most places keep their ranks well together in united strength.
  choice_d: The Juniper's cord-like branches bend round compliantly, offering but slight holds
    for winds.
  choice_e: The Yellow Pine grows in soil that has been longer exposed to weathering.
  correct_answer: D
  explanation: The Juniper is named as one of two trees 'never blown down', and the reason
    given is that its branches bend and so give the wind almost nothing to push against. Yielding
    is presented there as the cause of survival, which is D. A shows bending, but the sentence
    it comes from is about how alarming the storm looks, and it is paired with giants falling.
    B and C name survival by toughness and by massed strength, which is the opposite mechanism.
    E explains a failure rather than a survival, and it concerns soil rather than the tree's
    response to wind.
