  question_text: "A bicycle costs $80.00.\r\n\r\nColumn A: The price after two successive\
    \ increases of 10 percent\r\n\r\nColumn B: The price after a single increase of 21 percent"
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e: ''
  correct_answer: C
  explanation: 'Column A: the first increase brings $80 to $88, and the second 10 percent
    is figured on $88, adding $8.80 for a price of $96.80. Column B: a single 21 percent increase
    adds 0.21 x 80 = $16.80, also giving $96.80. The two are equal, because raising a price
    by 10 percent twice multiplies it by 1.10 x 1.10 = 1.21, which is exactly a 21 percent
    rise. Anyone who assumes two 10 percent rises must equal a 20 percent rise will pick A.'
