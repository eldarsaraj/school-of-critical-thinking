  passage_title: The Beetle That Drinks Fog
  passage_text: 'The Namib is one of the oldest and driest deserts on earth. Some places along
    its coast go years without measurable rain, and across a bad decade the total may amount
    to less than a person spills making coffee. Nothing about the sand suggests it could support
    an animal larger than an ant.


    It supports beetles the size of a thumbnail, and it does so because the desert is dry
    in only one of the two senses that matter.


    Rain is one way water arrives. Fog is another. Off the Namibian coast the Benguela current
    carries cold water north along a hot shore, and where the two meet, fog banks form and
    roll inland at night, sometimes fifty kilometers deep. This fog is not rain and never
    becomes rain. Its droplets are far too small to fall, so they drift instead. A person
    standing in it grows damp over an hour without ever seeing a drop. From the point of view
    of a beetle, however, a cubic meter of fog holds a considerable quantity of water, provided
    the beetle can persuade it to hold still.


    Certain darkling beetles of the Namib have solved this, and their solution has two parts,
    one in what they do and one in how they are built.


    The behavior is the strange part to watch. Before dawn, on nights when the fog comes,
    the beetle climbs the face of a dune to the crest, turns to face the incoming wind, and
    tips forward into a headstand, bracing its front legs and lifting its rear so that its
    hardened back forms a ramp angled into the moving air. Then it holds still, sometimes
    for an hour.


    The structure is what makes the posture pay. The beetle''s back is not smooth. It carries
    a field of small bumps separated by shallow channels. Fog droplets that strike a bump
    are caught there and merge with the droplets already collected, and while a droplet remains
    small its grip on the surface easily outmatches the pull of gravity. As it grows, that
    balance tips. At a certain size the droplet can no longer hold on; it releases and runs
    down the channels, which, because the beetle is standing on its head, lead directly to
    its mouth.


    What is worth noticing is that no part of this is the beetle doing work. It does not pump
    or filter or drink in any active sense. It sets its body at an angle in a wind and waits
    for physics to deliver the drink. Engineers building fog-harvesting nets for dry regions
    have taken the same lesson, and the difficulty they report is the one the beetle had already
    settled: catching droplets is the easy half, and persuading them to let go and run somewhere
    useful is the whole of the problem.'
  question_text: The passage says the Namib 'is dry in only one of the two senses that matter'.
    The two senses are best described as
  choice_a: the dryness of the sand and the dryness of the air
  choice_b: the dryness of the coast and the dryness of the interior
  choice_c: the dryness of a bad decade and the dryness of a good one
  choice_d: the dryness a person feels and the dryness an insect feels
  choice_e: the absence of rain and the presence or absence of water in any form
  correct_answer: E
  explanation: 'The next paragraph draws the distinction explicitly: ''Rain is one way water
    arrives. Fog is another.'' The desert lacks rain but not water, which is E. D is the closest
    trap, since the passage does contrast what a person notices with what matters to a beetle,
    but that contrast concerns who can use the water, not the two senses of dryness. A, B,
    and C divide dryness by material, by region, and by decade, none of which the passage
    uses.'
  distractor_types:
    A: wrong_concept
    B: misidentified_detail
    C: misidentified_detail
    D: partly_true_but_wrong
