  question_text: "A rectangle has a perimeter of 40 centimeters, and it is not a square.\r\
    \n\r\nColumn A: The area of the rectangle\r\n\r\nColumn B: 100 square centimeters"
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e: ''
  correct_answer: B
  explanation: 'A perimeter of 40 means the length and width add to 20. Test the possibilities:
    10 by 10 gives 100, but that is the square the question rules out. 9 by 11 gives 99, 8
    by 12 gives 96, 5 by 15 gives 75, and every further step away from equal sides makes the
    area smaller still. The square is the largest-area rectangle for a given perimeter, so
    once it is excluded the area is always below 100 and Column B is greater. The trap is
    testing only 10 by 10 and answering C, or seeing that the sides can vary and answering
    D without noticing that the comparison points the same way every time.'
