  correct_answer: B
  explanation: Count them. The factors of 36 are 1, 2, 3, 4, 6, 9, 12, 18, and 36, which is
    nine of them. The factors of 48 are 1, 2, 3, 4, 6, 8, 12, 16, 24, and 48, which is ten.
    Since 10 is greater than 9, Column B is greater. The trap is assuming the two counts must
    match because both numbers are close in size, or that 36 must have more factors because
