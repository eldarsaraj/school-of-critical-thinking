    easily outmatches the pull of gravity', and that as it grows 'that balance tips' until
    at a certain size it 'can no longer hold on'. Size, and therefore weight, is the trigger,
    which is D. A is ruled out by the beetle holding still, sometimes for an hour. B gives
    the wind a role it does not have once the droplet has landed. C introduces warmth, which
    the passage never mentions. E has the channels fill, whereas they carry water that has
    already been released.
