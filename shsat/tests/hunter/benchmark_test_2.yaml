  question_text: As used in the passage, 'deplore' ('we cease to deplore the violence of her
    most destructive gales') most nearly means
  choice_a: regret and condemn
  choice_b: describe in careful detail
  choice_c: make preparations against
  choice_d: exaggerate for effect
  choice_e: fail to take notice of
  correct_answer: A
  explanation: 'The word marks the change the paragraph has produced: once ''faith in Nature''s
    forestry is established'', the reader stops holding the gales against Nature. To cease
    to deplore is to stop lamenting and blaming, which is A. E is the closest trap, since
    one might stop noticing rather than stop objecting, but the passage''s whole point is
    that the storms are seen more clearly, not overlooked. B, C, and D reach for other things
    one might do with a gale, none of which the sentence is about.'
