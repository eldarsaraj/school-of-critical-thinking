  passage_text: 'Ask a fluent reader to explain how they read and you will get very little.
    They will tell you that they look at the page and the words are simply there, which is
    true and useless. The information you wanted, how the marks became sounds and how the
    sounds became sense, has been paved over. It was there once. It is gone now, and its disappearance
    is what fluency consists of.


    This is why the person who knows the most about a subject is so often the worst person
    to learn it from. The usual objection, that such people have simply never been taught
    how to teach, misses what is happening to them. The trouble is not a shortage of patience
    or method. The trouble is that they no longer have access to the thing they would need
    to describe.


    Consider what expertise does. It takes a procedure that once ran in a dozen conscious
    steps and folds it into one. The new driver thinks about the clutch. The practiced driver
    thinks about the exit and arrives at it with the clutch handled. Something has been gained,
    which is attention freed for the road, and something has been lost, which is any ability
    to say what the foot did.


    The expert, asked to explain, therefore reaches for the only account still available to
    her, which is the finished one. She says you should feel where the note wants to go. She
    says the sentence is obviously too long. She is not withholding anything; she is reporting,
    accurately, what her own mind now hands her. But what it hands her is a verdict, and the
    learner needed the reasoning, which no longer exists in any form that could be passed
    across.


    There is a further difficulty, and it is the harder one. The expert cannot tell which
    parts of the task are difficult, because none of them are difficult for her. Ask her which
    step trips people up and she will guess, and her guess will be shaped by what was hard
    for her twenty years ago, in a different order, with a different mind. The learner''s
    real sticking point is usually something so elementary that it does not occur to her to
    mention it, and it does not occur to him to ask, because he cannot yet see it clearly
    enough to give it a name.


    What follows from this is not that experts should be kept away from beginners. It is that
    the useful teacher is rarely the most accomplished person in the building. More often
    it is somebody two steps ahead, who still remembers being stuck and has not yet forgotten
    what the confusion felt like from the inside. Schools tend to arrange the opposite. They
    put the strongest practitioner in front of the newest students, on the reasonable-sounding
    principle that more knowledge is better, without noticing that the knowledge which matters
    here, the knowledge of not knowing, is the one thing expertise reliably destroys.'
  question_text: As used in the passage, 'elementary' ('something so elementary that it does
    not occur to her to mention it') most nearly means
  choice_a: relating to the earliest grades of school
  choice_b: so basic that it seems not worth saying
  choice_c: impossible to explain in words
  choice_d: unimportant to the task as a whole
  choice_e: already familiar to most beginners
  correct_answer: B
  explanation: 'The word explains why the expert passes over the learner''s real difficulty:
    it is so far beneath notice that mentioning it does not occur to her. That is B. A is
    the common school sense of the word and the strongest trap here, given the passage''s
    closing paragraph about schools. D changes basic into unimportant, but the sentence says
    this is precisely where the learner is stuck. E reverses the situation, since the learner
    has not grasped it. C imports a difficulty of expression the passage does not claim at
    this point.'
  distractor_types:
    A: surface_match
    C: wrong_concept
    D: changes_meaning
    E: opposite
