  question_text: "A cyclist rides 45 km at an average speed of 15 km/h and then rides 40 km\
    \ at an average speed of 20 km/h.\r\n\r\nColumn A: The total time for the cyclist's two\
    \ rides\r\n\r\nColumn B: The time taken to ride 90 km at a steady 20 km/h"
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e: ''
  correct_answer: A
  explanation: Time is distance divided by speed. The first ride takes 45 / 15 = 3 hours and
    the second takes 40 / 20 = 2 hours, so Column A is 5 hours. Column B is 90 / 20 = 4.5
    hours. Since 5 is greater than 4.5, Column A is greater. The trap is comparing distances,
    where 45 + 40 = 85 km falls short of 90 km and points the other way; the slower first
    leg more than makes up the difference in time.
