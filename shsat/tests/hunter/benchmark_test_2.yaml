  question_text: A theater seats 1,500 people at each show and ran 2 shows on Friday and 2
    shows on Saturday. It sold 1,248 tickets on Friday and 1,586 on Saturday. How many seats
    went unsold over the two nights?
  choice_a: '166'
  choice_b: '338'
  choice_c: 2,834
  choice_d: 3,166
  choice_e: ''
  correct_answer: D
  explanation: 'Two steps. First find the total capacity: 4 shows at 1,500 seats each is 6,000
    seats. Then subtract the tickets sold: 1,248 + 1,586 = 2,834, so 6,000 - 2,834 = 3,166
    seats went unsold. The traps: C stops at the tickets sold; A uses only one night''s capacity
    of 3,000; B gives the difference between the two nights'' sales.'
  distractor_types:
    A: wrong_setup
    B: partial_answer
    C: last_step_trap
