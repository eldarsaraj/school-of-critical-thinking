    the giants of the lower zones. The kingly Sugar Pine, towering aloft to a height of more
    than 200 feet, offers a fine mark to storm-winds; but it is not densely foliaged, and
    its long, horizontal arms swing round compliantly in the blast, like tresses of green,
    fluent algae in a brook; while the Silver Firs in most places keep their ranks well together
    in united strength. The Yellow or Silver Pine is more frequently overturned than any other
    tree on the Sierra, because its leaves and branches form a larger mass in proportion to
    its height, while in many places it is planted sparsely, leaving open lanes through which
    storms may enter with full force. Furthermore, because it is distributed along the lower
    portion of the range, which was the first to be left bare on the breaking up of the ice-sheet
    at the close of the glacial winter, the soil it is growing upon has been longer exposed
    to post-glacial weathering, and consequently is in a more crumbling, decayed condition
    than the fresher soils farther up the range, and therefore offers a less secure anchorage
    for the roots.'
