  question_text: A standard six-sided number cube is rolled twice. What is the probability
    that the first roll shows a greater number than the second?
  choice_a: 5/12
  choice_b: 1/6
  choice_c: 1/2
  choice_d: 7/12
  choice_e: ''
  correct_answer: A
  explanation: 'There are 36 equally likely pairs. In 6 of them the two rolls are equal. That
    leaves 30 pairs, and by symmetry the first roll is the greater one in exactly half of
    them, which is 15. The probability is 15/36 = 5/12. The traps: C forgets the six ties
    and splits all 36 pairs evenly; D counts the ties on the wrong side, giving 21/36; B gives
    the probability of a tie.'
  distractor_types:
