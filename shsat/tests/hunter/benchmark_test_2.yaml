  question_text: The mean of six numbers is 23. When one of the numbers is removed, the mean
    of the remaining five is 25. What number was removed?
  choice_a: '13'
  choice_b: '2'
  choice_c: '15'
  choice_d: '25'
  choice_e: ''
  correct_answer: A
  explanation: 'Work through the totals. The six numbers total 6 x 23 = 138. The five that
    remain total 5 x 25 = 125. The number removed is 138 - 125 = 13. It is below the old mean,
    which is why taking it away pulled the mean up. The traps: B reports the change in the
    mean rather than the number; D repeats the new mean; C is a slip in the subtraction.'
  distractor_types:
    B: wrong_setup
    C: arithmetic_slip
    D: fast_pattern_match
