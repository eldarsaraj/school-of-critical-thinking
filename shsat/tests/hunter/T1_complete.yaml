  - H2-Q10
- id: T1-R38
  passage_id: T1-P5
  section: reading_comprehension
  item_type: reading_mc
  question_number: 38
  skill: figurative_craft
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The comparison in line 18 suggests that the boy walks the circle with
  choice_a: fear of the people around him
  choice_b: more seriousness than it needs
  choice_c: anger at being kept indoors
  choice_d: skill he learned at school
  choice_e: boredom that has no outlet
  correct_answer: B
  distractor_types:
    A: wrong_concept
    C: inference_leap
    D: misidentified_detail
    E: partly_true_but_wrong
  explanation: 'A log over a creek punishes a wrong step. A painted circle on a gym floor punishes nothing
    at all. By reaching for the first to describe the second, the poem shows a boy giving a harmless line
    the whole of his attention, arms out, heel to toe, as though there were a drop. A borrows fear from
    the comparison and points it at the sleepers, though the boy is absorbed in the floor and the poem
    never has him look up. C invents a grievance; a child furious at being indoors does not walk a circle
    with this much care. D reads the balancing as training, but the poem says plainly that he has never
    seen a game played here. E is the strongest miss, since a bored child does invent games — and boredom
    would explain that he walks the line, not why he walks it as though it mattered, which is what the
    comparison is about.

    '
  source_ref:
  - H1-Q8
  - H2-Q24
- id: T1-R39
  passage_id: T1-P5
  section: reading_comprehension
