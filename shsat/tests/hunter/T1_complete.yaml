  target_word:
  question_text: The poem is mainly about
  choice_a: a father teaching his child the names of birds
  choice_b: the danger that birds pose to traffic
  choice_c: the reasons starlings fly south for the winter
  choice_d: a family's ordinary drive home at night
  choice_e: the strange beauty of a flock that moves as one without any leader
  correct_answer: E
  distractor_types:
    A: misidentified_detail
    B: wrong_concept
    C: wrong_concept
    D: too_narrow
  explanation: |-
    The poem watches the flock 'pour itself / out of one shape and into the next' with 'no single bird' in charge, and closes in wonder — its subject is that leaderless, unified motion. A and E seize on the father or the drive, small parts of the scene; C and D invent dangers and migrations the poem never mentions.
  source_ref:
