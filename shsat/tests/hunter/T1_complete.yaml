  skill: figurative_craft
  construct: Interpret the central figurative phrase ('quiet desperation').
  difficulty: medium
  dok: 3
  target_word:
  question_text: By saying that most men lead "lives of quiet desperation," the speaker suggests that their unhappiness is
  choice_a: caused mainly by loud quarrels
  choice_b: something that has appeared only recently
  choice_c: limited to the very poor
  choice_d: easily and quickly cured
  choice_e: felt deeply but kept silent and hidden
  correct_answer: E
  distractor_types:
    A: opposite
    B: wrong_concept
    C: too_narrow
    D: opposite
  explanation: |-
    'Quiet' is the heart of the image: the despair is concealed, even under 'games and amusements,' rather than open or loud. A contradicts 'quiet'; C and D add a time and a class the phrase does not; E denies the settled, 'confirmed' quality the speaker gives it.
  source_ref:
