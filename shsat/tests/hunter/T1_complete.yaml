- id: T1-Q27
  section: quantitative_reasoning
  item_type: quant_comparison
  question_number: 27
  skill: Algebraic Concepts
  construct: Compute travel time as distance ÷ rate for two options and compare; the longer, faster route can take exactly as long as the shorter, slower one.
  difficulty: hard
  dok: 3
  shared_information: To reach the lake, the Ruiz family can take the county road for 90 miles at an average speed of 45 miles per hour, or the state highway for 140 miles at an average speed of 70 miles per hour.
  question_text: Compare the quantity in Column A with the quantity in Column B.
  column_a: The time the trip takes by county road
  column_b: The time the trip takes by state highway
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e:
  correct_answer: C
  distractor_types:
    A: magnitude_misjudged
    B: magnitude_misjudged
    D: picks_D_when_determinable
  distractor_trace:
    A: assumes the slower speed must mean a longer time and picks the county road
    B: assumes the longer distance must mean a longer time and picks the highway
    D: thinks two different routes cannot possibly tie
  explanation: 'Time is distance divided by speed. County road: 90 ÷ 45 = 2 hours. State highway: 140 ÷ 70 = 2 hours. Both trips take exactly 2 hours, so the two quantities are equal. The extra distance on the highway is offset exactly by its higher speed. Verified: 2 = 2.'
  source_ref:
  - PT-QR-24
- id: T1-Q28
  section: quantitative_reasoning
  item_type: quant_comparison
  question_number: 28
  skill: Algebraic Concepts
  construct: Find slope two ways — by rearranging a linear equation into y = mx + b and by using rise-over-run between two points — and compare, with sign as the discriminator.
  difficulty: medium
  dok: 3
  shared_information: Line m has the equation x + 2y = 8.
  question_text: Compare the quantity in Column A with the quantity in Column B.
  column_a: The slope of line m
  column_b: The slope of the line through the points (0, 0) and (4, −6)
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e:
  correct_answer: A
  distractor_types:
    B: sign_error
    C: sign_error
    D: picks_D_when_determinable
  distractor_trace:
    B: drops a negative sign somewhere and ranks the more-negative slope as larger
    C: computes both slopes as the same size and, ignoring sign, calls them equal
    D: thinks slope cannot be found from the given forms
