  question_number: 37
  skill: figurative_craft
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The description of the morning light in lines 14-16 presents the light as
  choice_a: a warning of the coming heat
  choice_b: a reminder of the world outside
  choice_c: a sign that the storm has passed
  choice_d: one more thing taken in for shelter
  choice_e: a shape laid out on the floor
  correct_answer: D
  distractor_types:
    A: wrong_concept
    B: partly_true_but_wrong
    C: inference_leap
    E: too_literal
  explanation: 'The light does not fall or shine in these lines. It lies down on the boards, and it is
    described as something let in for the night — the phrase you would use of a person or an animal admitted
    at the door. The poem puts the light on the floor in the same posture as everyone else in the room,
    which is D. A takes rectangles of sun and predicts weather from them; nothing in the poem is warm
    or warned about. B is true in a small way, since the light does come from outside, but the image works
    to bring the light in rather than to point back out, and the poem''s outside is water rather than
    sky. C uses the sunrise as evidence the danger is over, which the last stanza contradicts — the water
    is still deciding. E stops at the literal geometry. The light does arrive in four rectangles and does
    lie on the boards, so the description is accurate as far as it goes, but it misses the phrase the
    item turns on, which admits the light the way you would admit a guest at the door.

    '
  source_ref:
