  difficulty: hard
  dok: 3
  target_word:
  question_text: The lines "a larger mind assembles over the traffic, / with no head in which to think, and thinks" (lines 13-14) most nearly mean that
  choice_a: the flock behaves like a single thinking thing though nothing is directing it
  choice_b: the birds are more intelligent than people are
  choice_c: one clever bird leads and directs all the rest
  choice_d: the birds are confused by the noise of the traffic
  choice_e: the speaker imagines seeing a face up in the sky
  correct_answer: A
  distractor_types:
    B: inference_leap
    C: opposite
    D: wrong_concept
    E: too_literal
  explanation: |-
    With each bird only 'holding its small distance,' the flock as a whole acts as if it had one mind, yet 'no single bird decides it' — order without a director. A and E take 'mind' as a claim about cleverness or a literal face; B supplies the leader the poem explicitly denies; D invents confusion the coordinated motion contradicts.
  source_ref:
