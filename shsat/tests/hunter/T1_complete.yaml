  dok: 2
  question_text: '[VISUAL: a square with side 8 cm and a circle inscribed inside it, touching all four sides. The four corner regions inside the square but outside the circle are shaded.] What is the total area of the shaded region? (Area of a circle = πr².)'
  column_a:
  column_b:
  choice_a: 32 − 16π cm²
  choice_b: 64 − 8π cm²
  choice_c: 64 − 64π cm²
  choice_d: 64 − 16π cm²
  choice_e:
  correct_answer: D
  distractor_types:
    A: wrong_setup
    B: wrong_formula
    C: wrong_formula
  distractor_trace:
