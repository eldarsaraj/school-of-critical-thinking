    C: inference_leap
    E: true_but_irrelevant
  explanation: 'The passage opens on an old rule (repairs should be invisible), explains why that rule was given up, and then defends what replaced it: repairs that can be undone and that can be seen. Everything in the passage — the wrong arms, the reversibility rule, the gray plaster, the crack that records a fire — serves that single argument, so D is the only option that covers the whole piece. A is true and is one of the passage''s steps, but the old restorers'' errors are the reason for the argument, not the argument itself. B misreads lines 15-16: varnish is mentioned as an example of a confident mistake, and no method of removing it safely is described. C over-reads the claim that a seamless restoration is dishonest into a claim that museums as a whole are untrustworthy, which the passage never says. E reports a real detail (line 30, visitors are unsettled) but that reaction is a consequence the author mentions in passing, not the subject of the passage.

    '
  source_ref:
  - H2-Q19
  - H2-Q49
- id: T1-R02
  passage_id: T1-P1
  section: reading_comprehension
  item_type: reading_mc
  question_number: 2
  skill: authors_purpose
  difficulty: hard
  dok: 3
  target_word:
  question_text: The examples given in lines 13-16 are included mainly to
  choice_a: show how confident a wrong repair looks
  choice_b: praise the technical skill of the earlier restorers
  choice_c: describe the kinds of damage objects suffer
  choice_d: condemn the taste of the nineteenth century
  choice_e: explain how Roman sculpture was originally displayed
  correct_answer: A
  distractor_types:
    B: opposite
    C: misidentified_detail
    D: partly_true_but_wrong
    E: wrong_concept
  explanation: 'The new arms and the stripped varnish are both repairs that looked right to the people who made them and turned out to be wrong. The sentence that follows them (lines 16-17) says so directly: the mistakes were made carefully, by experts, with confidence. The examples exist to show that confidence is no protection against error, which is what makes the reversibility rule necessary. B reverses the point: the passage grants that these restorers were skilled, but it raises their skill only to show that skill did not save them. C treats the examples as a catalogue of damage, when what is described is the repair, not the injury. D is close enough to tempt — the examples are unflattering — but the passage explicitly refuses to blame these restorers, calling their work careful and expert. E takes "Roman statues" as the subject; the passage says nothing about how the statues were displayed.

    '
  source_ref:
  - H2-Q2
  - H1-Q10
- id: T1-R03
  passage_id: T1-P1
  section: reading_comprehension
  item_type: reading_mc
  question_number: 3
  skill: inference
  difficulty: hard
  dok: 3
  target_word:
  question_text: The requirement that every treatment be reversible suggests that conservators regard their own conclusions as
  choice_a: worthless
  choice_b: private
  choice_c: flawless
  choice_d: unpopular
  choice_e: temporary
  correct_answer: E
  distractor_types:
    A: too_broad
    B: wrong_concept
    C: opposite
    D: true_but_irrelevant
  explanation: 'A conservator builds a repair that can be taken back out because she expects someone later to want it out. Lines 20-22 make the assumption explicit: a person in 2150 will know things she does not. Work built to be undone is work its maker treats as good for now rather than settled, which is what "temporary" names. A pushes that modesty too far. The passage says conservators lost confidence on purpose, not that they think their judgments have no value; a worthless judgment would not be worth making reversible. B has no support: nothing in the passage suggests conservators keep their conclusions to themselves, and the visible mend argues the opposite. C states the belief the whole passage was written against. D is true of the results — line 30 says the visible seam unsettles visitors — but the item asks how conservators regard their conclusions, not how visitors receive them.

    '
  source_ref:
  - H1-Q32
  - H2-Q5
- id: T1-R04
  passage_id: T1-P1
  section: reading_comprehension
  item_type: reading_mc
  question_number: 4
  skill: vocabulary_in_context
  difficulty: medium
  dok: 2
  target_word: sound
  question_text: As used in line 34, "sound" most nearly means
  choice_a: sensible
  choice_b: undamaged
  choice_c: audible
  choice_d: valuable
  choice_e: thorough
  correct_answer: B
  distractor_types:
    A: wrong_concept
    C: surface_match
    D: inference_leap
    E: less_precise
  explanation: 'The sentence describes what happens when a crack is smoothed away: the object looks sound. The contrast is with the damage that has just been erased, so "sound" here means whole and unbroken. Every other sense of the word is grammatically possible and contextually wrong. A is the common sense of "sound" in phrases like sound advice, and the passage is full of reasoning, which makes the misreading easy — but an object, not an argument, is what looks sound in this line. C reaches for the noun most students meet first; the word is an adjective here and nothing in the passage makes noise. D imports a judgment the passage does not make: the argument is about honesty, not price. E catches the right family of meaning (as in a sound sleep) but describes completeness of an action rather than the physical wholeness of a thing.

    '
  source_ref:
  - H1-Q33
  - H2-Q7
- id: T1-R05
  passage_id: T1-P1
  section: reading_comprehension
  item_type: reading_mc
  question_number: 5
  skill: inference
  difficulty: medium
  dok: 3
  target_word:
  question_text: The description of the plaster fill in lines 25-28 suggests that the conservator wants a visitor to
  choice_a: fail to notice the repair at all
  choice_b: admire the skill behind the fill
  choice_c: see the repair on looking closely
  choice_d: learn when the damage first occurred
  choice_e: doubt whether the mosaic is genuine
  correct_answer: C
  distractor_types:
    A: opposite
    B: true_but_irrelevant
    D: referent_slippage
    E: inference_leap
  explanation: 'The fill is tinted to two different distances at once. From across the room the eye does not snag on it; from close up it does not fool anyone, and the seam appears. That is a repair built to be missed at a glance and found on inspection, which is exactly what C describes. A is the standard the passage says has been abandoned — it is what an invisible repair would achieve. B is genuinely true of the work (the tinting is skilled) but the passage treats the skill as a means; the fill is designed to inform, not to be admired. D takes a real claim from elsewhere in the passage — damage is evidence, a crack records a fall or a fire (lines 32-33) — and attaches it to the wrong thing: the plaster is the new material, and it dates nothing. E overshoots. A visible seam tells a visitor which part is modern, which is the reverse of casting doubt on the original.

    '
  source_ref:
  - H2-Q8
  - H1-Q32
- id: T1-R06
  passage_id: T1-P1
  section: reading_comprehension
  item_type: reading_mc
  question_number: 6
  skill: structure
  difficulty: hard
  dok: 3
  target_word:
  question_text: The passage moves from
  choice_a: a method to its inventor
  choice_b: an error to its correction
  choice_c: a warning to its evidence
  choice_d: a standard to its replacement
  choice_e: a dispute to its settlement
  correct_answer: D
  distractor_types:
    A: wrong_concept
    B: too_narrow
    C: wrong_logical_relation
    E: partly_true_but_wrong
  explanation: 'The first third of the passage sets out the old rule — invisible repair, the object made whole. The middle explains why that rule failed and what replaced it: reversible treatment, then findable treatment. The last third defends the replacement. One standard gives way to another, which is D. A names a person the passage never introduces; no inventor of any method appears. B narrows the passage to one movement inside it. The confident mistakes and the rule that answered them are genuinely there, but they occupy the middle stretch rather than the whole, and the argument keeps going after them. C inverts the order of the parts. The passage puts its cautionary examples early and its claims late, so any warning arrives before its evidence rather than after. E is the closest miss: there is a real disagreement here, and the author clearly takes a side, but the passage ends by marking the limit of present knowledge rather than by settling anything.

    '
  source_ref:
  - H2-Q20
- id: T1-R07
  passage_id: T1-P1
  section: reading_comprehension
  item_type: reading_mc
  question_number: 7
  skill: inference
  difficulty: medium
  dok: 3
  target_word:
  question_text: The passage suggests that a crack in an object is best understood as
  choice_a: a record of the object's history
  choice_b: a defect the maker failed to prevent
  choice_c: a sign the object was stored badly
  choice_d: a warning that the object is fragile
  choice_e: a detail most visitors would prefer hidden
  correct_answer: A
  distractor_types:
    B: wrong_concept
    C: inference_leap
    D: partly_true_but_wrong
    E: true_but_irrelevant
  explanation: 'Damage is evidence, the passage says, and it then lists what the evidence is of: a fall, a fire, a route through a war. A crack is thus a trace of what has happened to the object since it was made, which is why erasing it makes the object answer questions wrongly. B locates the crack at the moment of manufacture. The passage places it afterward — in the object''s life, not in its making. C picks one possible cause and treats it as the meaning; the passage''s examples are accidents and history, and none of them is neglect in storage. D is partly right, since a cracked object is fragile, but fragility is a fact about the object''s future and the passage is interested in what the crack tells us about its past. E reports something the passage does say (line 30, visitors are unsettled) and then treats visitor preference as the measure of what a crack is.

    '
  source_ref:
  - H1-Q32
  - H2-Q5
- id: T1-R08
  passage_id: T1-P1
  section: reading_comprehension
  item_type: reading_mc
  question_number: 8
  skill: vocabulary_in_context
  difficulty: medium
  dok: 2
  target_word: arrested
  question_text: As used in line 38, "arrested" most nearly means
  choice_a: captured
  choice_b: delayed
  choice_c: halted
  choice_d: shielded
  choice_e: undone
  correct_answer: C
  distractor_types:
    A: surface_match
    B: less_precise
    D: wrong_concept
    E: opposite
  explanation: 'The passage glosses its own word in the next clause: conservators stop a process without concluding it. Work that has been stopped rather than completed is halted, so C. A is the meaning most students meet first, and it is a real sense of the word — it is simply the wrong one for a process rather than a person. B is the strongest lure, because delay and stoppage are close in ordinary speech; the passage''s own wording ("they stop a process") rules it out, since a delay implies the process will resume on schedule. D describes a plausible aim of conservation but not the meaning of this word; shielding an object is what a conservator may do, not what "arrested" says. E points the opposite way: an arrested process has been stopped where it stands, while an undone one has been reversed.

    '
  source_ref:
  - H1-Q34
  - H2-Q1
- id: T1-R09
  passage_id: T1-P1
  section: reading_comprehension
  item_type: reading_mc
  question_number: 9
  skill: inference
  difficulty: hard
  dok: 3
  target_word:
  question_text: The line drawn across an object in lines 40-42 suggests that the conservator
  choice_a: distrusts her own training
  choice_b: expects to be corrected later
  choice_c: refuses to repair the object
  choice_d: wants her work to be found
  choice_e: believes the object resists understanding
  correct_answer: B
  distractor_types:
    A: partly_true_but_wrong
    C: opposite
    D: referent_slippage
    E: too_broad
  explanation: 'The line marks where the conservator''s knowledge ends and someone else''s begins — which means she assumes there is someone else, and that this person will know more. Marking the boundary of your own understanding is a way of leaving the correction to be made, so B. A pushes a real feature of the passage into overstatement. Conservators became less confident on purpose, but the passage credits their training throughout; deliberate humility is not distrust. C reverses the point. The line is drawn across a repair that has been made, not instead of one. D borrows a true claim from lines 24-25 — the best fills are findable — and applies it to the wrong subject: what is meant to be found is the repair, not the conservator''s reputation. E converts a limit on present knowledge into a claim that the object cannot be understood at all, which the passage never approaches.

    '
  source_ref:
  - H2-Q8
  - H2-Q27
- id: T1-R10
  passage_id: T1-P2
  section: reading_comprehension
  item_type: reading_mc
  question_number: 10
  skill: figurative_craft
  difficulty: hard
  dok: 3
  target_word:
  question_text: The grandfather's remark in lines 9-11 suggests that he
  choice_a: worries about scratching the metal
  choice_b: keeps a neater table than others
  choice_c: wants the tools to sell quickly
  choice_d: treats the tools as still useful
  choice_e: dislikes the folding table he uses
  correct_answer: D
  distractor_types:
    A: too_literal
    B: inference_leap
    C: opposite
    E: misidentified_detail
  explanation: 'A thing laid on bare metal looks discarded; a thing laid on a blanket looks kept. The grandfather''s objection is not to the surface but to what the surface says about the object resting on it. He is arranging his table so that the tools read as working equipment rather than as junk, which is D. A takes the remark at face value, as a concern about physical damage; the sentence is about how a tool looks, not about what happens to it. B turns a statement about meaning into a statement about tidiness, and about other sellers the passage never describes. C reverses the motive: goods staged to look discarded are goods staged to move fast, and the grandfather has spent years refusing to move his best one. E fastens on the wrong noun — the table is mentioned, but the remark concerns the blanket over it.

    '
  source_ref:
  - H1-Q1
  - H2-Q9
- id: T1-R11
  passage_id: T1-P2
  section: reading_comprehension
  item_type: reading_mc
  question_number: 11
  skill: figurative_craft
  difficulty: hard
  dok: 3
  target_word:
  question_text: The way Dennis laughs each month suggests that he
  choice_a: finds the grandfather amusing
  choice_b: is embarrassed by his own request
  choice_c: has given up wanting the plane
  choice_d: is friendlier than the other regular buyers
  choice_e: does not expect the refusal to last
  correct_answer: E
  distractor_types:
    A: too_literal
    B: wrong_concept
    C: opposite
    D: inference_leap
  explanation: 'Dennis treats the refusal as a bit the two of them perform together, which means he does not hear it as final. A man who believed the answer would take it once and stop asking; Dennis asks again the next month, and the month after, because to him the no is part of a negotiation still running. A reads the laugh as ordinary amusement and stops there, missing what a laugh does when the answer was serious. B has no support: Dennis is entirely at ease, and his asking is a routine he has built. C is the reverse of what the monthly return demonstrates — he wants it enough to keep coming. D generalizes from one man to a comparison the passage never sets up; the only other buyer described is the young man, and no ranking of manners is offered.

    '
  source_ref:
  - H2-Q9
  - H1-Q36
- id: T1-R12
  passage_id: T1-P2
  section: reading_comprehension
  item_type: reading_mc
  question_number: 12
  skill: vocabulary_in_context
  difficulty: medium
  dok: 2
  target_word: keen
  question_text: As used in line 29, "keen" most nearly means
  choice_a: eager
  choice_b: sharp
  choice_c: clever
  choice_d: polished
  choice_e: new
  correct_answer: B
  distractor_types:
    A: surface_match
    C: wrong_concept
    D: less_precise
    E: inference_leap
  explanation: 'The word describes the edge of a blade that has just been worked on a whetstone with oil, and that the grandfather forbids the narrator to touch with her thumb. An edge dangerous to a thumb is a sharp one, so B. A is the sense students meet most often, in phrases like keen to go, and it is a real meaning of the word applied to people rather than to blades. C reaches for another human sense — a keen mind — which cannot apply to an edge. D is nearly right and lands one step off: sharpening does leave a bright surface, but "keen" names the cutting quality, not the shine. E infers a restoration the passage does not claim; the plane is decades old, and dressing an edge does not make it new.

    '
  source_ref:
  - H1-Q2
  - H2-Q22
- id: T1-R13
  passage_id: T1-P2
  section: reading_comprehension
  item_type: reading_mc
  question_number: 13
  skill: inference
  difficulty: hard
  dok: 3
  target_word:
  question_text: The detail about Saturday night in lines 29-31 suggests that the grandfather
  choice_a: sharpens every tool each week
  choice_b: was trying to impress the buyer
  choice_c: had already decided to sell it
  choice_d: was worried the blade would rust
  choice_e: had planned to use the plane himself
  correct_answer: C
  distractor_types:
    A: too_broad
    B: causal_confusion
    D: wrong_concept
    E: opposite
  explanation: 'The sharpening happened the night before, at the kitchen table, when no buyer existed yet. A man does not put an edge on a tool he means to keep refusing to sell. The narrator herself only understands this in the moment she is describing — "which I had not thought about until then" — and what she understands is that the decision was made before Sunday. A stretches one Saturday into a habit; the passage marks this sharpening as the exception that caught her attention. B gets the sequence backwards, treating work done the night before as a response to a man who had not yet walked up. D substitutes a maintenance worry for a decision, and nothing in the passage mentions rust or storage. E is the reverse: the plane leaves in a stranger''s trunk, and the narrator never suggests her grandfather intended to use it.

    '
  source_ref:
  - H2-Q5
  - H1-Q17
- id: T1-R14
  passage_id: T1-P2
  section: reading_comprehension
  item_type: reading_mc
  question_number: 14
  skill: inference
  difficulty: hard
  dok: 3
  target_word:
  question_text: The narrator's account of Dennis's earlier offer suggests that the grandfather's price was
  choice_a: chosen for reasons other than money
  choice_b: the most the plane could bring
  choice_c: a mistake he came to regret
  choice_d: decided before the young man arrived
  choice_e: the usual price for such tools
  correct_answer: A
  distractor_types:
    B: opposite
    C: inference_leap
    D: referent_slippage
    E: misidentified_detail
  explanation: 'Sixty dollars from a stranger, four hundred refused from Dennis. The grandfather knew both numbers, and he set the low one for the buyer who wanted to put the plane back to work on a bad floor. Price, for him, was doing something other than measuring value. B is contradicted by the figure the narrator supplies from March; the plane could plainly bring far more. C reads regret into a silence, but the grandfather never looks back at the sale — he closes the gap on the table and changes the subject. D takes the sharpest inference in the passage, the whetstone on Saturday night, which shows the decision was made before any buyer walked up. It then attaches it to the wrong thing: what was settled in advance was whether to sell, not what to charge. E treats sixty dollars as a market rate, which the four-hundred-dollar offer rules out.

    '
  source_ref:
  - H2-Q8
  - H2-Q49
- id: T1-R15
  passage_id: T1-P2
  section: reading_comprehension
  item_type: reading_mc
  question_number: 15
  skill: inference
  difficulty: medium
  dok: 3
  target_word:
  question_text: The grandfather's behavior in lines 46-49 suggests that he
  choice_a: has grown forgetful with age
  choice_b: is pleased with the money he made
  choice_c: wants to go home early
  choice_d: dislikes the crowd in the lot
  choice_e: is avoiding the subject
  correct_answer: E
  distractor_types:
    A: inference_leap
    B: opposite
    C: wrong_concept
    D: true_but_irrelevant
  explanation: 'He straightens the blanket, sits, looks at nothing in particular, and then says something about the weather that is not true. Every one of those actions is a way of not talking about what just left the table, and the narrator''s flat last line makes sure the reader notices the remark was cover rather than observation. A explains the false remark as confusion, but a man who has just arranged the table so the gap will not show is tracking the situation closely. B misreads the mood: sixty dollars for a four-hundred-dollar plane is not what a pleased man counts, and he says nothing about the sale at all. C invents an intention the passage never gives; he settles into his chair rather than packing up. D notes the crowd, which the passage does mention, and turns a direction of gaze into a dislike.

    '
  source_ref:
  - H1-Q17
  - H2-Q5
- id: T1-R16
  passage_id: T1-P2
  section: reading_comprehension
  item_type: reading_mc
  question_number: 16
  skill: tone_attitude
  difficulty: medium
  dok: 3
  target_word:
  question_text: The narrator's attitude toward her grandfather is best described as
  choice_a: impatient
  choice_b: amused
  choice_c: resentful
  choice_d: watchful
  choice_e: anxious
  correct_answer: D
  distractor_types:
    A: partly_true_but_wrong
    B: wrong_concept
    C: too_broad
    E: inference_leap
  explanation: 'She records everything: the rubber band on the cigar box, the worn knob, the newspaper he uses for nothing else, the way his hands move when he explains. She is keeping track of a man she is trying to read, and D is the word for that. A catches one real moment — the single word "Grandpa" is a protest — but one interruption in a day of close attention does not describe her stance. B fits her handling of Dennis, whose "young lady" she clearly finds tiresome, rather than her handling of her grandfather. C converts a flicker of objection about money into a settled grievance the passage never shows; she does not complain again after he declines to look at her. E supplies a worry she never voices; she is observing him, not fearing for him.

    '
  source_ref:
  - H1-Q37
  - H2-Q42
- id: T1-R17
  passage_id: T1-P2
  section: reading_comprehension
  item_type: reading_mc
  question_number: 17
  skill: point_of_view
  difficulty: hard
  dok: 3
  target_word:
  question_text: The events of the passage are described by someone who
  choice_a: understands her grandfather completely
  choice_b: reports more than she explains
  choice_c: disapproves of the sale throughout
  choice_d: knows nothing about the tools
  choice_e: learned about the day afterward
  correct_answer: B
  distractor_types:
    A: too_broad
    C: partly_true_but_wrong
    D: opposite
    E: misidentified_detail
  explanation: 'The narrator gives us the whetstone, the newspaper, the closed-up gap on the table and the untrue remark about June, and she interprets none of them. The reader assembles the meaning out of details she has noticed and set down without comment, which is B. A claims a completeness she disclaims herself; the line "which I had not thought about until then" admits she is still catching up to him. C is true for one line and false for the rest — after "Grandpa" she stops objecting and starts watching. D is contradicted by everything she names: jointer, block plane, squares, level, and the book where she records offers. E puts her at a distance the passage does not allow, since she is behind the table for the whole scene.

    '
  source_ref:
  - H1-Q22
- id: T1-R18
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 18
  skill: main_idea
  difficulty: hard
  dok: 3
  target_word:
  question_text: A good title for this passage would be
  choice_a: Four Ways to Be Poor
  choice_b: The Hardest Work in the World
  choice_c: A Christmas Without Father
  choice_d: Each Sister Speaks for Herself
  choice_e: Sacrifices Gladly Made
  correct_answer: D
  distractor_types:
    A: too_narrow
    B: misidentified_detail
    C: partly_true_but_wrong
    E: opposite
  explanation: 'Almost every line is a sister saying what she wants or what she suffers, and each complaint fits only the girl who makes it — the one who mourns a dress, the one who wants a book, the one who wants pencils, the one who says nothing about herself until the others press on. The passage is a set of self-portraits delivered as grumbling, which is D. A covers only the money, and the girls are quarrelling about work, school and a father as much as about being poor. B lifts one sister''s phrase about washing dishes out of a single speech and hangs the whole scene on it. C names something real and central — the silence when the father is mentioned is the heaviest moment here — but that hush occupies a few lines and the rest of the passage talks past it. E takes Meg''s own words and reverses them, since what she actually says is that she ought to make her sacrifices gladly and is afraid she does not.

    '
  source_ref:
  - H2-Q19
  - H2-Q30
- id: T1-R19
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 19
  skill: vocabulary_in_context
  difficulty: medium
  dok: 2
  target_word: altered
  question_text: As used in line 15, "altered" most nearly means
  choice_a: repaired
  choice_b: changed
  choice_c: raised
  choice_d: improved
  choice_e: gentle
  correct_answer: B
  distractor_types:
    A: surface_match
    C: wrong_concept
    D: inference_leap
    E: less_precise
  explanation: 'The word describes Meg''s tone after a silence. She has been complaining about being poor; now she explains her mother''s reasoning. Her manner of speaking is different from what it was a moment before, so B. A is the sense of the word students meet most often in a house where clothes are made over, and the passage has just mentioned Meg''s old dress, which makes the wrong sense easy to reach for — but a tone is not taken in at the seams. C picks a single kind of change, volume, that the passage does not indicate. D adds a judgment: the tone is different, and the passage never says it is better. E describes how the new tone might sound rather than what the word claims, which is only that it is not the earlier tone.

    '
  source_ref:
  - H1-Q26
  - H2-Q3
- id: T1-R20
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 20
  skill: supporting_detail
  difficulty: medium
  dok: 2
  target_word:
  question_text: According to lines 15-23, the sisters are going without presents because
  choice_a: their mother thinks the winter will be hard
  choice_b: their father asked them to save money
  choice_c: they each agreed to give up a dollar
  choice_d: the money is being sent to the army
  choice_e: the family cannot afford anything at all
  correct_answer: A
  distractor_types:
    B: inference_leap
    C: misidentified_detail
    D: causal_confusion
    E: partly_true_but_wrong
  explanation: 'Meg reports the reason directly: their mother proposed no presents because the winter is going to be hard for everyone, and she thinks they should not spend on pleasure while the men in the army are suffering. The proposal is the mother''s, and the stated ground is the hard winter. B moves the decision to the father, who is far away and is never said to have asked for anything. C confuses two different dollars: each girl still has hers, and the question of giving them up is what they are arguing about. D turns a comparison into a transaction — the army is the reason for restraint, not the destination of the money, and nothing is sent anywhere. E overstates the poverty; the girls have a dollar each and are debating how to spend it, so the obstacle is a decision rather than an inability.

    '
  source_ref:
  - H1-Q35
  - H1-Q13
- id: T1-R21
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 21
  skill: inference
  difficulty: hard
  dok: 3
  target_word:
  question_text: Jo's remarks about how she will spend her dollar suggest that she
  choice_a: is the least generous of the sisters
  choice_b: disagrees with her mother's judgment
  choice_c: wants to impress her older sister
  choice_d: has more money than the others
  choice_e: cares more for books than for clothes
  correct_answer: E
  distractor_types:
    A: inference_leap
    B: partly_true_but_wrong
    C: wrong_concept
    D: misidentified_detail
  explanation: 'Jo wants one thing, a book she has wanted a long time, and the narrator adds that she is a bookworm. Set that beside the sister who is looking down at her old dress and the sister who wants drawing pencils, and beside Jo''s own indifference to the state of her shoes, and the preference is plain. A generalizes from one purchase to a character judgment the passage does not support; Jo is the one who argues the others should have what they want too. B is close, since Jo does push back on the plan, but she frames it as reading her mother''s wishes rather than opposing them. C invents an audience: Jo''s stated reason is how long she has wanted the book. D misreads the arithmetic, since the passage says each girl has a dollar.

    '
  source_ref:
  - H1-Q17
  - H2-Q5
- id: T1-R22
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 22
  skill: figurative_craft
  difficulty: hard
  dok: 3
  target_word:
  question_text: The mention of the hearth brush and kettle-holder in lines 30-32 suggests that Beth
  choice_a: spends her time on household work
  choice_b: is speaking to no one in particular
  choice_c: keeps her disappointment to herself
  choice_d: prefers the kitchen to the parlor
  choice_e: is the quietest of the four sisters
  correct_answer: C
  distractor_types:
    A: true_but_irrelevant
    B: too_literal
    D: inference_leap
    E: partly_true_but_wrong
  explanation: 'Naming the only two things that heard the sigh is a way of saying that none of her sisters did. Beth has a wish and a small sorrow about it, and she lets both out where no person is listening, which is C. A is true of Beth elsewhere in the passage, where she says washing dishes is the worst work in the world, but the objects here are witnesses rather than chores. B takes the joke at face value, as though the point were the direction she faced; the point is who failed to notice. D builds a preference between rooms out of two household objects that happen to sit near the fire. E is the strongest lure because it is broadly true of Beth, but a standing trait is not what this image reports — it reports one sigh that went unheard, which sets up the second sigh that does not.

    '
  source_ref:
  - H1-Q8
  - H2-Q23
- id: T1-R23
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 23
  skill: vocabulary_in_context
  difficulty: medium
  dok: 2
  target_word: cross
  question_text: As used in line 50, "cross" most nearly means
  choice_a: angry
  choice_b: ashamed
  choice_c: opposed
  choice_d: irritable
  choice_e: unwell
  correct_answer: D
  distractor_types:
    A: less_precise
    B: wrong_concept
    C: surface_match
    E: inference_leap
  explanation: 'Beth is describing what dishwashing does to her: it puts her out of temper and stiffens her hands so she cannot practice. The word names a small, ordinary bad mood, which is D. A is in the right family and one degree too strong; a girl who begins by calling it naughty to fret is not reporting anger. B swaps a mood for a judgment about herself, and her shame, if any, is about complaining rather than about the work. C reaches for the sense of the word that means set against something, which is the meaning most visible in the spelling and the wrong one here. E converts a temper into an illness by borrowing the stiff hands from the next clause.

    '
  source_ref:
  - H1-Q28
  - H2-Q7
- id: T1-R24
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 24
  skill: inference
  difficulty: hard
  dok: 3
  target_word:
  question_text: The difference between Beth's two sighs in lines 30-32 and 48-52 suggests that she
  choice_a: has grown angrier as the talk went on
  choice_b: is less patient than her sisters
  choice_c: wants her sisters to pity her
  choice_d: finds housework harder than music
  choice_e: lets her feelings show only gradually
  correct_answer: E
  distractor_types:
    A: inference_leap
    B: opposite
    C: wrong_concept
    D: misidentified_detail
  explanation: 'The first sigh is heard by nobody in the room. The second is one that anyone could hear. The passage marks the change deliberately, and what has changed is not the strength of Beth''s feeling but how much of it reaches the surface, which is E. A reads a louder sigh as a hotter one; the girl sighing has just said it is naughty to fret, which is not the language of rising anger. B reverses her: Beth is the one who opens with gratitude and closes with an apology for complaining. C supplies a motive the passage withholds — she never addresses her sisters or asks anything of them. D compares two burdens the passage does not weigh against each other; the music is what she cannot practice, not a task she prefers.

    '
  source_ref:
  - H2-Q8
  - H1-Q24
- id: T1-R25
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 25
  skill: inference
  difficulty: medium
  dok: 3
  target_word:
  question_text: Taken together, the four sisters' complaints suggest that each of them
  choice_a: blames the others for her troubles
  choice_b: wishes to leave the family home
  choice_c: finds her own burden the heaviest
  choice_d: regrets the promise she made
  choice_e: has forgotten her father's absence
  correct_answer: C
  distractor_types:
    A: wrong_concept
    B: inference_leap
    D: partly_true_but_wrong
    E: opposite
  explanation: 'Each girl answers the previous complaint by topping it. One says her work is hard, the next says the other does not have half such a hard time, the third calls her own the worst work in the world, and the fourth says she does not believe any of them suffer as she does. The shape of the exchange is four people each certain her own case is the worst, which is C. A misplaces the grievance: their complaints are about children, an old lady, dishes and schoolmates, not about one another. B invents a wish for escape that nobody voices. D catches a real moment, since Meg admits she does not make her sacrifices gladly, but regret about the promise is Meg''s alone and the item asks what is true of each. E is contradicted by the silence that falls when the father is mentioned.

    '
  source_ref:
  - H1-Q19
  - H2-Q5
- id: T1-R26
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 26
  skill: tone_attitude
  difficulty: hard
  dok: 3
  target_word:
  question_text: The narrator's attitude toward the sisters is best described as
  choice_a: indulgent
  choice_b: severe
  choice_c: mournful
  choice_d: admiring
  choice_e: detached
  correct_answer: A
  distractor_types:
    B: opposite
    C: partly_true_but_wrong
    D: less_precise
    E: wrong_concept
  explanation: 'The narrator lets the girls squabble and adds small amused touches — a sister examining her shoe heels in a gentlemanly manner, a sigh overheard only by a hearth brush. The girls are being teased by someone clearly fond of them, which is A. B is the reverse: nothing in the telling scolds them, and their least attractive moments are handled lightly. C fits one passage of the scene, the hush when the father is mentioned, and then misdescribes the rest, which is brisk and comic. D is close and one shade off — the narrator is amused by these girls rather than impressed by them, and admiration would not permit the teasing. E claims a distance the narration does not keep; a detached narrator would not supply the affectionate asides.

    '
  source_ref:
  - H1-Q31
  - H2-Q33
- id: T1-R27
  passage_id: T1-P4
  section: reading_comprehension
  item_type: reading_mc
  question_number: 27
  skill: main_idea
  difficulty: hard
  dok: 3
  target_word:
  question_text: The writer's chief point about the Chalmers family is that they
  choice_a: are poorer than she first expected
  choice_b: have been worn down by the work
  choice_c: work hard without ever getting ahead
  choice_d: have chosen a hard place to settle
  choice_e: keep their religion above all else
  correct_answer: C
  distractor_types:
    A: inference_leap
    B: partly_true_but_wrong
    D: too_narrow
    E: misidentified_detail
  explanation: 'The passage sets two things side by side and refuses to let either cancel the other. The family rises early and works till evening, and after nine years they have only the bare necessaries. Everything between those two facts — the mill that fails daily, the cabin left in ruins, the harness held together with rope — explains the gap, and the gap is the point. A supposes a comparison with an earlier expectation that the passage never records. B is the conclusion the facts seem to invite, given nine years of labour and nothing to show but the bare necessaries. The passage insists on the opposite about the family itself, calling them frugal, sober and hard-working, rising early and labouring till evening. Their trouble is not exhaustion. D shifts the blame to the ground, which the passage never faults; the water power is called invaluable. E takes a real feature of the household and makes it the thesis, when religion appears here only in the phrase about courtesy being a work of the flesh.

    '
  source_ref:
  - H2-Q19
  - H2-Q49
- id: T1-R28
  passage_id: T1-P4
  section: reading_comprehension
  item_type: reading_mc
  question_number: 28
  skill: vocabulary_in_context
  difficulty: medium
  dok: 2
  target_word: invaluable
  question_text: As used in line 2, "invaluable" most nearly means
  choice_a: worthless
  choice_b: priceless
  choice_c: unmeasured
  choice_d: unusual
  choice_e: abundant
  correct_answer: B
  distractor_types:
    A: surface_match
    C: less_precise
    D: wrong_concept
    E: inference_leap
  explanation: 'The word describes the water power that comes with the claim — the one asset the family possesses outright, and the thing that makes a sawmill possible at all. It is being praised, so B. A is the trap the word is built on. The prefix looks like the one in "invisible" or "incomplete," so students read it as not valuable, which reverses the meaning exactly. C catches the idea that no figure is given and mistakes that for the claim being made; the passage is not saying the value is unknown but that it is very great. D substitutes rarity for worth. E borrows from water, of which there is presumably plenty, and applies plenty to the wrong noun — the sentence values the power, not the volume.

    '
  source_ref:
  - H1-Q33
  - H2-Q4
- id: T1-R29
  passage_id: T1-P4
  section: reading_comprehension
  item_type: reading_mc
  question_number: 29
  skill: inference
  difficulty: medium
  dok: 3
  target_word:
  question_text: The list of things that go wrong on the claim suggests that the trouble comes from
  choice_a: a failure to keep things in repair
  choice_b: bad luck that no one could prevent
  choice_c: land too poor to support a family
  choice_d: a shortage of money to buy tools
  choice_e: too few hands to do the work
  correct_answer: A
  distractor_types:
    B: opposite
    C: wrong_concept
    D: inference_leap
    E: misidentified_detail
  explanation: 'Every item on the list is small and fixable in advance: a missing shoe nail, a broken buckle, a wheel, a strap, a foundation dug and then abandoned. None of them is a disaster. What they share is that each could have been seen to before it stopped the work, and none was. B is the reading the family might prefer, and the passage is built to refuse it — a run of accidents this uniform is not chance. C blames the ground, though the passage calls the water power invaluable and never says the land is bad. D supposes poverty caused the breakdowns, but a shoe nail and a buckle are not what a family cannot afford, and the passage puts the poverty at the end of the chain rather than the start. E is contradicted a few lines later, where the household is said to include a grown son and a hired man.

    '
  source_ref:
  - H1-Q32
  - H2-Q5
- id: T1-R30
  passage_id: T1-P4
  section: reading_comprehension
  item_type: reading_mc
  question_number: 30
  skill: vocabulary_in_context
  difficulty: medium
  dok: 2
  target_word: want
  question_text: As used in line 12, "want" most nearly means
  choice_a: desire
  choice_b: lack
  choice_c: neglect
  choice_d: delay
  choice_e: expense
  correct_answer: B
  distractor_types:
    A: surface_match
    C: less_precise
    D: wrong_concept
    E: inference_leap
  explanation: 'A horse goes lame for want of a shoe nail. The nail is missing, and its absence is what lames the horse, so B. A is the meaning students meet in nearly every other sentence they read, and here it produces nonsense: a horse does not go lame because it desires a nail. C is the closest miss and worth dwelling on, because neglect is exactly what the paragraph is diagnosing — but the word names the missing thing, not the carelessness that let it go missing, and the passage supplies that judgment elsewhere. D turns an absence into a delay, which fits the mill''s stoppages but not this phrase. E imports cost into a sentence about a nail nobody bought.

    '
  source_ref:
  - H1-Q34
  - H2-Q6
- id: T1-R31
  passage_id: T1-P4
  section: reading_comprehension
  item_type: reading_mc
  question_number: 31
  skill: inference
  difficulty: hard
  dok: 3
  target_word:
  question_text: The writer's remarks about Chalmers in lines 16-20 suggest that she believes
  choice_a: he works harder than his neighbours do
  choice_b: his religion has made him idle
  choice_c: he has been unlucky with weather
  choice_d: hard work is not enough by itself
  choice_e: his family gives him little help
  correct_answer: D
  distractor_types:
    A: inference_leap
    B: opposite
    C: wrong_concept
    E: misidentified_detail
  explanation: 'The sentence begins with "Yet," and the word is doing the whole job. She has just catalogued nine years of things left undone; now she grants that the man is frugal, sober and hard-working, and that he and two others are at it from dawn to dark. Granting the effort and keeping the verdict means the effort was never the missing piece. A invents a comparison with neighbours who do not appear. B reverses the passage twice over: Chalmers is called hard-working, and his religion is described as narrow rather than as an excuse for idleness. C reaches for the standard explanation of a failed claim, and no weather is mentioned anywhere in the excerpt. E notes the family, who do appear, and misassigns the failure to them, when the same sentence has the son and the hired man labouring alongside him.

    '
  source_ref:
  - H1-Q32
  - H2-Q8
- id: T1-R32
  passage_id: T1-P4
  section: reading_comprehension
  item_type: reading_mc
  question_number: 32
  skill: tone_attitude
  difficulty: hard
  dok: 3
  target_word:
  question_text: The writer's attitude toward the family is best described as
  choice_a: critical but not unkind
  choice_b: amused and superior
  choice_c: openly hostile toward them
  choice_d: respectful of their beliefs
  choice_e: anxious about her safety
  correct_answer: A
  distractor_types:
    B: partly_true_but_wrong
    C: too_broad
    D: misidentified_detail
    E: inference_leap
  explanation: 'Her descriptions are severe — a sour girl, hard un-child-like children, a voice that carries a reproach — and yet she says she thinks the wife suffers, wishes she could show them something better, and admits she writes the judgment reluctantly. Both halves are in the passage, and A is the only choice that holds them together. B catches her class and her distance, and she is at moments both, but amusement does not survive the sentence about the wife''s suffering or the reluctance at the end. C keeps the severity and drops everything that qualifies it. D takes her account of their religion, which she calls narrow, and turns her notice of it into approval. E supplies a fear the passage never shows; she is lodging with them, observing closely, and troubled by their manners rather than by any danger.

    '
  source_ref:
  - H1-Q37
  - H2-Q11
- id: T1-R33
  passage_id: T1-P4
  section: reading_comprehension
  item_type: reading_mc
  question_number: 33
  skill: inference
  difficulty: hard
  dok: 3
  target_word:
  question_text: The way the family treats the writer suggests that they regard her as
  choice_a: a guest who must be honoured
  choice_b: a servant they have lately hired
  choice_c: a spy sent to watch them
  choice_d: a stranger whose manners puzzle them
  choice_e: an idler who does no work
  correct_answer: E
  distractor_types:
    A: opposite
    B: wrong_concept
    C: inference_leap
    D: partly_true_but_wrong
  explanation: 'Three details point one way. The wife refers to her as "that woman." The family knocks her belongings over without apology. And she says outright that she feels they think it sinful that she does not work as hard as they do. In a house where everything but work is despised, a woman who reads and knits is a woman doing nothing. A is the reverse of every detail given. B mistakes their coldness for a working arrangement; she is a paying lodger, not staff, and nobody sets her tasks. C dramatizes their suspicion into something the passage never suggests. D is the strongest of the four, because their blank amazement at being thanked really is bewilderment — but puzzlement is a mild word for a family that regards her as living in sin against labour.

    '
  source_ref:
  - H2-Q5
  - H1-Q19
- id: T1-R34
  passage_id: T1-P4
  section: reading_comprehension
  item_type: reading_mc
  question_number: 34
  skill: authors_purpose
  difficulty: hard
  dok: 3
  target_word:
  question_text: The writer ends with the statement in lines 43-45 mainly to
  choice_a: excuse herself for having stayed so long
  choice_b: explain why she dislikes the West
  choice_c: show the judgment was not lightly made
  choice_d: apologize to the family she describes
  choice_e: warn other travellers away from Colorado
  correct_answer: C
  distractor_types:
    A: wrong_concept
    B: misidentified_detail
    D: inference_leap
    E: too_broad
  explanation: 'She has just made a sweeping charge about what the pursuit of gain is doing to family life in the West. Then she notes that she writes it unwillingly and only after two years in the country. Both halves of that sentence are credentials: the reluctance answers the suspicion that she enjoys the verdict, and the two years answer the suspicion that she reached it in haste. A treats the sentence as being about her own conduct rather than about the reliability of her claim. B inverts the logic — the reluctance exists because she does not wish to dislike the place, and a writer explaining a dislike would not call herself unwilling. D imagines an audience that will never read it; these are private letters, and no apology is offered to anyone. E turns an observation into travel advice, which the passage never gives.

    '
  source_ref:
  - H2-Q2
  - H1-Q10
- id: T1-R35
  passage_id: T1-P5
  section: reading_comprehension
  item_type: reading_mc
  question_number: 35
  skill: inference
  difficulty: medium
  dok: 3
  target_word:
  question_text: The detail that the men set each cot inside a painted line suggests that they
  choice_a: were following an order they were given
  choice_b: took the marks as instructions
  choice_c: wanted to keep the cots from sliding
  choice_d: hoped to make the room look tidy
  choice_e: knew the game the lines were for
  correct_answer: B
  distractor_types:
    A: opposite
    C: wrong_concept
    D: partly_true_but_wrong
    E: inference_leap
  explanation: 'The poem gives the reason and then removes the obvious explanation for it. The men set the cots inside the lines because the lines were there — and the next sentence says that nobody told them to. A mark on a floor, with no rule attached and no one enforcing it, was enough to decide where forty beds went. A is ruled out by three words. "Nobody told them to" exists in the poem precisely to close off the reading that someone was directing the work. C supplies a practical purpose, but paint does not hold a cot in place and the poem offers no such motive. D is partly right, since the result is orderly, but tidiness would not require the beds to land inside the markings rather than merely in rows. E credits the men with knowledge the poem never gives them, and the boy later in the poem shows that knowing the game is not what the lines depend on.

    '
  source_ref:
  - H1-Q9
  - H1-Q12
- id: T1-R36
  passage_id: T1-P5
  section: reading_comprehension
  item_type: reading_mc
  question_number: 36
  skill: figurative_craft
  difficulty: hard
  dok: 3
  target_word:
  question_text: The comparison of the dark scoreboard to a stopped clock suggests that the people
  choice_a: expect the power to return soon
  choice_b: have lost track of the days
  choice_c: resent being kept in the gym
  choice_d: no longer notice the board at all
  choice_e: keep a habit that no longer helps
  correct_answer: E
  distractor_types:
    A: inference_leap
    B: partly_true_but_wrong
    C: wrong_concept
    D: opposite
  explanation: 'You glance at a clock you already know has stopped. The glance is not a question; it is something your eyes do on their way past. The poem says the people still look at a board that has been dark for days, and the comparison tells you the looking has stopped meaning anything. A turns a habit into an expectation. Someone confident the power was returning would look at the board with a purpose, which is the opposite of what the image describes. B is close to something true — the poem does open with "Tuesday" and then stops counting — but a stopped clock in this line is being looked at, not consulted, and losing track of days is not what the glance shows. C imports a resentment that appears nowhere in a poem whose people sweep a clean floor and square their shoes. D is the reading the first line invites. A board that has been dark for days is a board most people would have stopped seeing, and a student who stops there will choose it. The next line refutes it: they still look. That is the whole point of the comparison, since a stopped clock is something you go on checking after it has ceased to tell you anything.

    '
  source_ref:
  - H1-Q11
  - H2-Q34
- id: T1-R37
  passage_id: T1-P5
  section: reading_comprehension
  item_type: reading_mc
  question_number: 37
  skill: figurative_craft
  difficulty: hard
  dok: 3
  target_word:
  question_text: The description of the morning light in lines 14-16 presents the light as
  choice_a: a warning of the coming heat
  choice_b: a reminder of the world outside
  choice_c: a sign that the storm has passed
  choice_d: one more thing taken in for shelter
  choice_e: a shape laid out on the floor
  correct_answer: D
  distractor_types:
    A: wrong_concept
    B: partly_true_but_wrong
    C: inference_leap
    E: too_literal
  explanation: 'The light does not fall or shine in these lines. It lies down on the boards, and it is described as something let in for the night — the phrase you would use of a person or an animal admitted at the door. The poem puts the light on the floor in the same posture as everyone else in the room, which is D. A takes rectangles of sun and predicts weather from them; nothing in the poem is warm or warned about. B is true in a small way, since the light does come from outside, but the image works to bring the light in rather than to point back out, and the poem''s outside is water rather than sky. C uses the sunrise as evidence the danger is over, which the last stanza contradicts — the water is still deciding. E stops at the literal geometry. The light does arrive in four rectangles and does lie on the boards, so the description is accurate as far as it goes, but it misses the phrase the item turns on, which admits the light the way you would admit a guest at the door.

    '
  source_ref:
  - H1-Q8
  - H2-Q10
- id: T1-R38
  passage_id: T1-P5
  section: reading_comprehension
  item_type: reading_mc
  question_number: 38
  skill: figurative_craft
  difficulty: hard
  dok: 3
  target_word:
  question_text: The comparison in line 18 suggests that the boy walks the circle with
  choice_a: fear of the people around him
  choice_b: more seriousness than it needs
  choice_c: anger at being kept indoors
  choice_d: skill he learned at school
  choice_e: boredom that has no outlet
  correct_answer: B
  distractor_types:
    A: wrong_concept
    C: inference_leap
    D: misidentified_detail
    E: partly_true_but_wrong
  explanation: 'A log over a creek punishes a wrong step. A painted circle on a gym floor punishes nothing at all. By reaching for the first to describe the second, the poem shows a boy giving a harmless line the whole of his attention, arms out, heel to toe, as though there were a drop. A borrows fear from the comparison and points it at the sleepers, though the boy is absorbed in the floor and the poem never has him look up. C invents a grievance; a child furious at being indoors does not walk a circle with this much care. D reads the balancing as training, but the poem says plainly that he has never seen a game played here. E is the strongest miss, since a bored child does invent games — and boredom would explain that he walks the line, not why he walks it as though it mattered, which is what the comparison is about.

    '
  source_ref:
  - H1-Q8
  - H2-Q24
- id: T1-R39
  passage_id: T1-P5
  section: reading_comprehension
  item_type: reading_mc
  question_number: 39
  skill: inference
  difficulty: hard
  dok: 3
  target_word:
  question_text: Mr. Alvarez's answer in lines 25-26 suggests that the painted line gives him
  choice_a: a memory of playing as a young man
  choice_b: a way to pass the time indoors
  choice_c: a small order he can rely on
  choice_d: a place to keep his shoes safe
  choice_e: a claim to more room than others
  correct_answer: C
  distractor_types:
    A: opposite
    B: wrong_concept
    D: too_literal
    E: inference_leap
  explanation: 'He does not say the stripe reminds him of anything. He says a man likes to know where his feet go. In a room where nothing else is settled — not the water, not how long they will stay — a painted line is one thing that holds still and tells him where he stands. A is the sentimental reading and the poem blocks it: he has not played anything in fifty years, and his answer is about the present rather than the past. B treats squared shoes as entertainment, though the gesture takes a moment and is done once. D stops at the literal surface, as if paint protected footwear. E turns a modest act into a territorial one; his shoes are on a stripe, not spread across the floor, and nothing suggests he is claiming space.

    '
  source_ref:
  - H1-Q12
  - H2-Q8
- id: T1-R40
  passage_id: T1-P5
  section: reading_comprehension
  item_type: reading_mc
  question_number: 40
  skill: tone_attitude
  difficulty: medium
  dok: 3
  target_word:
  question_text: The speaker's attitude toward the people in the gym is best described as
  choice_a: respectful
  choice_b: impatient
  choice_c: pitying
  choice_d: amused
  choice_e: detached
  correct_answer: A
  distractor_types:
    B: wrong_concept
    C: less_precise
    D: partly_true_but_wrong
    E: opposite
  explanation: 'The speaker notices what people do to keep themselves in order: sweeping a floor that does not need it, squaring a pair of shoes, walking a line with care. These are recorded as things worth recording, and the old man is given his own words rather than being explained. That is respect. B has no support in a poem that watches this patiently. C is the near miss and the one most worth rejecting deliberately: pity would look down at these people, and the speaker is one of them, saying "we came in" and "the floor arranged us." D catches a flicker — there is something wry in sweeping an empty floor — but amusement cannot account for the last stanza. E is contradicted by the plural pronouns; a detached speaker would not be sleeping in the room.

    '
  source_ref:
  - H2-Q33
  - H1-Q6
- id: T1-R41
  passage_id: T1-P5
  section: reading_comprehension
  item_type: reading_mc
  question_number: 41
  skill: tone_attitude
  difficulty: medium
  dok: 3
  target_word:
  question_text: In the final stanza (lines 27-32) the tone of the poem becomes more
  choice_a: bitter
  choice_b: playful
  choice_c: fearful
  choice_d: hurried
  choice_e: wondering
  correct_answer: E
  distractor_types:
    A: wrong_concept
    B: opposite
    C: inference_leap
    D: misidentified_detail
  explanation: 'For four stanzas the poem reports: cots, a dark board, light, a boy, an old man. In the last stanza it stands back and says something it finds remarkable — that a floor arranged people in a language none of them was taught and all of them can read. The register lifts from noticing to marvelling. A hears complaint where the poem offers none; nothing in the closing lines blames anyone. B reverses the movement, since the ending is the most serious part of the poem. C reaches for the water, and the water is mentioned only to say it has not decided — the stanza turns inward and away from it. D describes a pace the lines do not have; the final sentence is the longest and slowest in the poem.

    '
  source_ref:
  - H2-Q39
  - H2-Q35
- id: T1-R42
  passage_id: T1-P5
  section: reading_comprehension
  item_type: reading_mc
  question_number: 42
  skill: main_idea
  difficulty: hard
  dok: 3
  target_word:
  question_text: Throughout the poem, the speaker comes to see that
  choice_a: a storm can force strangers together
  choice_b: a gym makes a poor shelter
  choice_c: the boy has learned something new
  choice_d: old lines still arrange new people
  choice_e: the people long to go home
  correct_answer: D
  distractor_types:
    A: too_broad
    B: opposite
    C: too_narrow
    E: inference_leap
  explanation: 'Every scene in the poem is the same discovery made again. Men lay beds inside markings nobody enforces. A boy treats a circle as a beam. An old man sets his shoes on a stripe. The last stanza names what they have in common: the floor arranged us. Markings made for a game are still telling people where to be, and D says so. A is true of the situation and would be true of any shelter anywhere; it does not touch the lines, which are what the poem keeps returning to. B reverses the poem''s finding, since the room turns out to serve these people better than they expected. C takes one figure of the four and makes him the subject, and the boy is presented as an instance rather than a learner. E supplies a longing the poem never voices — nobody in it speaks of home.

    '
  source_ref:
  - H2-Q19
  - H2-Q30
- id: T1-R43
  passage_id: T1-P6
  section: reading_comprehension
  item_type: reading_mc
  question_number: 43
  skill: main_idea
  difficulty: hard
  dok: 3
  target_word:
  question_text: The passage is best described as an explanation of
  choice_a: why highways are built too narrow
  choice_b: how drivers can avoid being late
  choice_c: why a jam can outlast its cause
  choice_d: what happens when drivers follow closely
  choice_e: why drivers brake more than they should
  correct_answer: C
  distractor_types:
    A: wrong_concept
    B: inference_leap
    D: too_narrow
    E: partly_true_but_wrong
  explanation: 'The whole passage is built to answer one question: how can you sit in a jam for twenty minutes and then find nothing at the end of it? The answer is that the jam is a wave rather than a place, that it travels away from whatever started it, and that the cause was gone long before you arrived. C names that. A blames the road, which the passage never does; the highway in it is working normally. B treats the piece as advice for the reader, but the remedy near the end helps the drivers behind rather than the one who applies it. D names the condition a jam wave needs, and the passage does say that drivers travel closer to one another than judgment advises. But that is the setup rather than the subject, and everything the passage finds interesting happens after it. E names something the passage explicitly describes — drivers do overcorrect — but that is one step in the mechanism, not what the passage sets out to explain.

    '
  source_ref:
  - H1-Q38
  - H2-Q19
- id: T1-R44
  passage_id: T1-P6
  section: reading_comprehension
  item_type: reading_mc
  question_number: 44
  skill: supporting_detail
  difficulty: medium
  dok: 2
  target_word:
  question_text: According to lines 12-20, the disturbance grows as it travels backward because each driver
  choice_a: reacts late and brakes too hard
  choice_b: is driving faster than the one ahead
  choice_c: wants to leave a larger gap
  choice_d: cannot see the road far enough ahead
  choice_e: is distracted by something in the car
  correct_answer: A
  distractor_types:
    B: wrong_concept
    C: opposite
    D: inference_leap
    E: misidentified_detail
  explanation: 'The passage states the mechanism directly: each driver reacts a fraction of a second late and overcorrects slightly to make up for the delay. Lateness plus overcorrection is what makes each braking a little sharper than the one before it, until someone twenty cars back has to stop. B substitutes a difference in speed for a difference in timing; the passage has the traffic flowing evenly before the first tap. C reverses the situation, since the cars are following closer than judgment would advise, and leaving a larger gap is the remedy offered at the end. D supplies an explanation for the late reaction that the passage does not give and does not need. E fastens on the phrase "for reasons of his own," which the passage uses to withhold the first driver''s reason rather than to identify it, and which in any case applies to one driver instead of each.

    '
  source_ref:
  - H1-Q35
  - H1-Q40
- id: T1-R45
  passage_id: T1-P6
  section: reading_comprehension
  item_type: reading_mc
  question_number: 45
  skill: vocabulary_in_context
  difficulty: medium
  dok: 2
  target_word: absorb
  question_text: As used in line 33, "absorb" most nearly means
  choice_a: soak up spilled water
  choice_b: pass along to others
  choice_c: come to understand fully
  choice_d: reduce gradually over time
  choice_e: take in and hold
  correct_answer: E
  distractor_types:
    A: surface_match
    B: opposite
    C: wrong_concept
    D: less_precise
  explanation: 'The sentence sets absorbing against passing on. The driver receives the disturbance and does not send it further: she coasts, spends her gap, and the cars behind her get nothing. To take the wave in and keep it is E. A is the meaning the word carries most often, and the passage has already compared traffic to water, which makes the wrong sense unusually easy to reach for here — but no liquid is involved. B is the exact behaviour the sentence rules out with the words "instead of." C is the sense in "absorb a lesson," which cannot apply to a wave in traffic. D is close and one step off: the wave is stopped at this driver rather than worn down slowly, and the passage gives no span of time over which it fades.

    '
  source_ref:
  - H1-Q33
  - H1-Q29
- id: T1-R46
  passage_id: T1-P6
  section: reading_comprehension
  item_type: reading_mc
  question_number: 46
  skill: inference
  difficulty: hard
  dok: 3
  target_word:
  question_text: The statement in lines 20-27 that the jam has outlived its own contents means that
  choice_a: the jam has lasted longer than expected
  choice_b: the drivers have grown tired of waiting
  choice_c: no original car remains inside the jam
  choice_d: the jam has moved past where it formed
  choice_e: the cars inside it are no longer moving
  correct_answer: C
  distractor_types:
    A: wrong_concept
    B: inference_leap
    D: partly_true_but_wrong
    E: opposite
  explanation: 'Cars enter the jam at its back and leave from its front while the jam itself slides the other way. Given enough time, every car that was in the original slowdown has driven off, and the jam is still there, made entirely of vehicles that arrived later. The thing has survived a complete change of parts. A reads "outlived" as merely lasting a long time and loses the comparison the word is making — the jam has outlived something specific. B moves the sentence from the jam to the drivers'' patience, which the passage never discusses. D is true and is the closest miss: the jam does travel backward from where it began. But moving away from a place is not the same as replacing everything inside it, and it is the second that "contents" names. E contradicts the same sentence, which says every car inside the jam is travelling forward.

    '
  source_ref:
  - H1-Q32
  - H2-Q8
- id: T1-R47
  passage_id: T1-P6
  section: reading_comprehension
  item_type: reading_mc
  question_number: 47
  skill: inference
  difficulty: medium
  dok: 3
  target_word:
  question_text: The passage suggests that a driver who looks for the cause of a jam is likely to
  choice_a: find a stalled vehicle further ahead
  choice_b: find nothing where the jam ends
  choice_c: blame the driver directly in front
  choice_d: reach home later than expected
  choice_e: discover a lane closed for work
  correct_answer: B
  distractor_types:
    A: opposite
    C: inference_leap
    D: true_but_irrelevant
    E: misidentified_detail
  explanation: 'The passage opens on exactly this search and reports its result: you round the curve braced for wreckage and there is nothing there. It then explains why the search must fail — the tap that started the jam happened twenty minutes ago and four miles back, and the driver who made it is home. A and E are the two things the passage lists in order to say they are absent; a stalled truck and a closed lane are named as what you do not find. C supposes a reaction the passage does not describe, and the driver in front is as blameless as everyone else in the wave. D is true of anyone stuck in traffic and has nothing to do with searching for a cause.

    '
  source_ref:
  - H1-Q32
  - H1-Q19
- id: T1-R48
  passage_id: T1-P6
  section: reading_comprehension
  item_type: reading_mc
  question_number: 48
  skill: vocabulary_in_context
  difficulty: medium
  dok: 2
  target_word: signal
  question_text: As used in line 35, "signal" most nearly means
  choice_a: a light at the intersection
  choice_b: a blinking turn indicator
  choice_c: a shouted word of warning
  choice_d: a cue to brake
  choice_e: a message sent by radio
  correct_answer: D
  distractor_types:
    A: surface_match
    B: wrong_concept
    C: too_literal
    E: inference_leap
  explanation: 'What the cars behind never receive is the thing that has been passing backward through the traffic all along — the sight of brake lights ahead, which tells the next driver to slow. The coasting driver never brakes, so that prompt is never sent. D names it. A is the trap the item is built on. In a passage about highways, "signal" pulls hard toward traffic lights, and no intersection appears anywhere in the piece. B stays inside the car and picks the other roadway sense of the word, which has nothing to do with slowing. C imagines drivers calling to one another. E supposes a technology the passage never mentions; what travels between these cars is visible, not transmitted.

    '
  source_ref:
  - H1-Q34
  - H2-Q1
- id: T1-R49
  passage_id: T1-P6
  section: reading_comprehension
  item_type: reading_mc
  question_number: 49
  skill: authors_purpose
  difficulty: hard
  dok: 3
  target_word:
  question_text: The author opens the passage with the words "Nothing happened" mainly to
  choice_a: name the puzzle before explaining it
  choice_b: announce the answer at the start
  choice_c: show that the writer was there too
  choice_d: criticize the design of modern roads
  choice_e: suggest the problem cannot be solved
  correct_answer: A
  distractor_types:
    B: wrong_logical_relation
    C: inference_leap
    D: misidentified_detail
    E: opposite
  explanation: 'Two words state the whole mystery: you were delayed, and there was no reason for it at the place you were delayed. Everything after them is the explanation. Beginning with the puzzle also puts the reader in the position of the baffled driver, which is why the next sentences say "you" rather than "a driver." B has the right instinct about placement and the wrong idea about content. A short opening line often does carry the main claim, which is why this is tempting. Here it carries the mystery instead: nothing happened is what needs explaining, and the explanation takes the rest of the passage. C reads the flat opening as personal testimony, though the passage never uses "I" and gives no account of the writer''s own trip. D borrows the passage''s later interest in highways and turns an explanation into a complaint about how roads are built. E is contradicted by the last third of the passage, which describes a remedy and cites evidence that it works.

    '
  source_ref:
  - H2-Q2
  - H1-Q10
- id: T1-R50
  passage_id: T1-P6
  section: reading_comprehension
  item_type: reading_mc
  question_number: 50
  skill: inference
  difficulty: hard
  dok: 3
  target_word:
  question_text: The passage suggests that the remedy it describes is rarely used because drivers
  choice_a: do not know that it exists
  choice_b: cannot judge distances well enough
  choice_c: would rather arrive home sooner
  choice_d: believe engineers should fix the road
  choice_e: experience the gap as a loss
  correct_answer: E
  distractor_types:
    A: inference_leap
    B: wrong_concept
    C: partly_true_but_wrong
    D: misidentified_detail
  explanation: 'The passage says the obstacle is human rather than technical, and then says what the human obstacle is: the gap feels to the driver keeping it like ground she has already paid for and is now giving away. It is a remedy that registers as a defeat, which is why it goes unused even when it works. A supplies ignorance as the barrier, and the passage rules that out by locating the difficulty in how the gap feels rather than in what drivers know. B invents a limit on skill; nothing in the passage suggests drivers misjudge the distance. C is close to the feeling described and misses its shape — the driver is not calculating arrival time but reacting to the sight of space she could be occupying. D moves the explanation to an opinion about whose job it is, an argument the passage never raises.

    '
  source_ref:
  - H2-Q5
  - H2-Q49
- id: T1-Q01
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 1
  skill: Data Analysis & Probability
  construct: Read six values off a bar graph and compute their arithmetic mean.
  difficulty: easy
  dok: 2
  question_text: "[VISUAL: bar graph 'MONTHLY RAINFALL IN TOWN R', rainfall in centimeters: Jan 6.0, Feb 3.5, Mar 8.0, Apr 5.5, May 9.0, Jun 4.0.] The graph shows the rainfall for six months in Town R. What was the mean monthly rainfall?"
  column_a:
  column_b:
  choice_a: 6.0 cm
  choice_b: 6.5 cm
  choice_c: 7.2 cm
  choice_d: 9.0 cm
  choice_e:
  correct_answer: A
  distractor_types:
    B: estimation_failure
    C: wrong_setup
    D: fast_pattern_match
  distractor_trace:
    B: eyeballs a middle height instead of adding and dividing
    C: divides the total 36 by 5 instead of 6
    D: reads off the tallest bar and calls it the average
  explanation: 'Add the six months: 6.0 + 3.5 + 8.0 + 5.5 + 9.0 + 4.0 = 36.0 cm. Divide by the 6 months: 36.0 ÷ 6 = 6.0 cm. Choice C divides by 5 by mistake; D reports the single tallest bar, which is the maximum, not the mean. Verified: total 36, mean 6.0.'
  source_ref:
  - PT-QR-1
- id: T1-Q02
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 2
  skill: Algebraic Concepts
  construct: See that the requested expression is a constant multiple of the given expression, so its value scales without solving for the variable.
  difficulty: medium
  dok: 2
  question_text: If 3y − 2 = 10, then what must 6y − 4 equal?
  column_a:
  column_b:
  choice_a: '4'
  choice_b: '12'
  choice_c: '20'
  choice_d: '24'
  choice_e:
  correct_answer: C
  distractor_types:
    A: partial_answer
    B: partial_answer
    D: last_step_trap
  distractor_trace:
    A: solves for y = 4 and reports that
    B: reports the given quantity 3y − 2 = 12 after finding 3y
    D: doubles to get 6y = 24 but forgets the − 4
  explanation: 'Notice that 6y − 4 is exactly twice 3y − 2. Since 3y − 2 = 10, doubling both sides gives 6y − 4 = 20, with no need to find y. (Checking: 3y − 2 = 10 gives y = 4, and 6·4 − 4 = 20.) A reports y itself; B reports the original 12; D forgets to subtract 4. Verified: 20.'
  source_ref:
  - PT-QR-10
- id: T1-Q03
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 3
  skill: Number & Operations (Decimals, Percents, Fractions)
  construct: 'Increase a quantity by a percent greater than 100%: add that many percent of the original to the original.'
  difficulty: medium
  dok: 2
  question_text: A colony of 24 ants increased by 250%. What is the total number of ants after the increase?
  column_a:
  column_b:
  choice_a: '30'
  choice_b: '60'
  choice_c: '84'
  choice_d: '274'
  choice_e:
  correct_answer: C
  distractor_types:
    A: wrong_setup
    B: last_step_trap
    D: unit_conversion_error
  distractor_trace:
    A: reads 250% as a 25% increase, so 24 × 1.25 = 30
    B: finds the increase 250% of 24 = 60 but forgets to add the original
    D: adds the number 250 to 24
  explanation: '250% of 24 is 2.5 × 24 = 60, the amount of increase. The new total is the original plus the increase: 24 + 60 = 84. A confuses 250% with 25%; B stops at the increase and never adds the starting 24; D treats the percent as a plain number. Verified: increase 60, total 84.'
  source_ref:
  - PT-QR-11
- id: T1-Q04
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 4
  skill: Data Analysis & Probability
  construct: Compute the probability of two independent trials both succeeding by finding the single-trial probability and squaring it.
  difficulty: medium
  dok: 3
  question_text: A computer picks a whole number from 1 to 6 at random for each trial. What is the probability that the numbers picked on the first two trials are both greater than 2?
  column_a:
  column_b:
  choice_a: 1/9
  choice_b: 4/9
  choice_c: 1/2
  choice_d: 2/3
  choice_e:
  correct_answer: B
  distractor_types:
    A: wrong_setup
    C: wrong_setup
    D: partial_answer
  distractor_trace:
    A: squares the complement P(≤2) = 1/3 instead of P(>2)
    C: miscounts 'greater than 2' as 3 of 6 outcomes
    D: finds the single-trial probability 2/3 and forgets to square it
  explanation: 'The numbers greater than 2 are 3, 4, 5, 6 — that is 4 of the 6 outcomes, so one trial succeeds with probability 4/6 = 2/3. The two trials are independent, so both succeed with probability 2/3 × 2/3 = 4/9. D stops after one trial; A uses the wrong four numbers (1 and 2). Verified: 4/9.'
  source_ref:
  - PT-QR-12
- id: T1-Q05
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 5
  skill: Geometry
  construct: Identify the three-dimensional solid formed by folding a net, using the shape and count of its faces (two triangular ends + rectangular sides = triangular prism).
  difficulty: medium
  dok: 3
  question_text: '[VISUAL: a net made of two identical triangles (top and bottom) joined by a row of three rectangles with dashed fold lines. The four answer choices are drawings of solids: (A) a triangular prism; (B) a rectangular box; (C) a square pyramid; (D) a triangular pyramid.] The pattern shown can be folded into a solid. Which solid results?'
  column_a:
  column_b:
  choice_a: Triangular prism (drawing)
  choice_b: Rectangular box (drawing)
  choice_c: Square pyramid (drawing)
  choice_d: Triangular pyramid (drawing)
  choice_e:
  correct_answer: A
  distractor_types:
    B: wrong_setup
    C: fast_pattern_match
    D: fast_pattern_match
  distractor_trace:
    B: counts only the three rectangles and ignores the two triangular caps
    C: sees rectangles-plus-a-point and guesses a pyramid
    D: sees triangles and jumps to a pyramid
  explanation: 'Two parallel triangular faces joined by rectangles fold into a prism whose ends are triangles — a triangular prism. A pyramid would need all side faces meeting at a single apex, which this net does not have; a box would need six rectangles and no triangles. Verified by face count: 2 triangles + 3 rectangles = triangular prism.'
  source_ref:
  - PT-QR-13
- id: T1-Q06
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 6
  skill: Algebraic Concepts
  construct: Recognize a doubling (geometric) pattern and invert it — find the exponent that produces a given value.
  difficulty: medium
  dok: 2
  question_text: "[VISUAL: table 'Correct Answers | Points': 1 → 2, 2 → 4, 3 → 8. Points double with each additional correct answer.] A student earned 64 points. How many correct answers did the student give?"
  column_a:
  column_b:
  choice_a: '6'
  choice_b: '7'
  choice_c: '8'
  choice_d: '32'
  choice_e:
  correct_answer: A
  distractor_types:
    B: last_step_trap
    C: fast_pattern_match
    D: wrong_setup
  distractor_trace:
    B: counts one doubling too many
    C: divides 64 by the last listed value 8
    D: treats points as 2 × answers and computes 64 ÷ 2
  explanation: 'The points follow 2, 4, 8, 16, 32, 64 — that is 2 raised to the number of correct answers. Since 2⁶ = 64, the student answered 6 correctly. D assumes a simple ×2 rule; C divides by 8. Verified: 2⁶ = 64.'
  source_ref:
