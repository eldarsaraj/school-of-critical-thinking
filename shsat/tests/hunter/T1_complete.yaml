    Scouring the outer bank and building up the inner one make each bend sharper, so the curve feeds its own growth. A reads 'deepens' as water depth; C supplies a digger, though the passage stresses there is no design; D invents a rule about depth and sharpness; E describes the opposite of a growing bend.
  source_ref:
  - H1-Q17
- id: T1-R49
  passage_id: T1-P6
  section: reading_comprehension
