- id: T1-Q08
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 8
  skill: Algebraic Concepts
  construct: Model total cost as a per-unit charge times quantity plus a fixed fee, and recover the fixed fee from a table of order totals.
  difficulty: medium
  dok: 3
  question_text: "[VISUAL: table 'T-SHIRT ORDERS' (Number of T-shirts | Total Cost of Order): 1 → $13.80, 2 → $22.60, 3 → $31.40, 5 → $49.00.] Each T-shirt costs $8.00 plus 10% sales tax per shirt, and one fixed shipping fee is added to each order. What is the shipping fee per order?"
  column_a:
  column_b:
  choice_a: $5.00
  choice_b: $5.80
  choice_c: $8.00
  choice_d: $8.80
  choice_e:
  correct_answer: A
  distractor_types:
    B: arithmetic_slip
    C: partial_answer
    D: procedure_substitution
  distractor_trace:
    B: subtracts the untaxed $8.00 instead of the taxed price
    C: reports the base shirt price
    D: reports the taxed shirt price
  explanation: 'With tax, one shirt costs $8.00 × 1.10 = $8.80. For a one-shirt order, $13.80 − $8.80 = $5.00 is the shipping fee. Check: 2 shirts, 2 × $8.80 + $5.00 = $22.60; 5 shirts, 5 × $8.80 + $5.00 = $49.00. B forgets the tax; C and D report a shirt price rather than the fee. Verified across all rows.'
  source_ref:
  - PT-QR-16
- id: T1-Q09
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 9
  skill: Algebraic Concepts
  construct: Model cumulative geometric growth over several days and select the summation expression that includes the originator and every day's new people.
  difficulty: hard
  dok: 3
  question_text: On Day 1, one person (the founder) tells a rumor to 5 people. On each following day, every person who heard it the day before tells 5 new people. This continues through Day 4. Which expression gives the total number of people who know the rumor at the end of Day 4, including the founder?
  column_a:
  column_b:
  choice_a: 1 + 5⁴
  choice_b: 5 + 5² + 5³ + 5⁴
  choice_c: 1 + 5 + 5² + 5³ + 5⁴ + 5⁵
  choice_d: 1 + 5 + 5² + 5³ + 5⁴
  choice_e:
  correct_answer: D
  distractor_types:
    A: wrong_setup
    B: partial_answer
    C: last_step_trap
  distractor_trace:
    A: counts only the founder and the last day
    B: adds every day but forgets the founder
    C: runs one extra day to Day 5
  explanation: The founder is 1. Day 1 adds 5 new people; Day 2 adds 5 × 5 = 5²; Day 3 adds 5³; Day 4 adds 5⁴. The running total is 1 + 5 + 5² + 5³ + 5⁴. B omits the +1 founder; C adds a fifth day that never happens; A skips the middle days. Verified by term-by-term count.
