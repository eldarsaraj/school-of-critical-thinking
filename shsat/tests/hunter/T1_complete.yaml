  target_word:
  question_text: The image of the birds "pretending to be leaves" (line 24) suggests that, once in the tree, they
  choice_a: have actually turned into leaves
  choice_b: are busy eating the leaves
  choice_c: will burst out and fly off again at once
  choice_d: settle and fall still, hidden among the branches like part of the tree
  choice_e: are beginning to die
  correct_answer: D
  distractor_types:
    A: too_literal
    B: wrong_concept
    C: opposite
    E: inference_leap
  explanation: |-
    Settling into one tree, the loud flock goes quiet and blends in, so the tree looks ordinary though it is full of birds — they 'pretend' to be foliage. A takes the pretending literally; C invents feeding; D reverses the settling; E darkens a playful image into death.
  source_ref:
