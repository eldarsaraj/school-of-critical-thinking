- id: T1-R02
  passage_id: T1-P1
  section: reading_comprehension
  item_type: reading_mc
  question_number: 2
  skill: authors_purpose
  construct: Purpose of a specific extended example (the 1:1 map) within the argument.
  difficulty: hard
  dok: 3
  target_word:
  question_text: The author describes the map 'drawn to the scale of the country itself' (lines 5-13) mainly in order to
  choice_a: prove that such a map could never actually be built
  choice_b: show that a description which leaves nothing out is of no use
  choice_c: suggest that mapmakers waste effort on needless detail
  choice_d: demonstrate how accurate modern maps have become
  choice_e: explain why paper maps are being replaced by screens
  correct_answer: B
  distractor_types:
    A: misidentified_detail
    C: inference_leap
    D: opposite
    E: wrong_concept
  explanation: |-
    The full-scale map is an extreme case: perfectly complete and perfectly useless, which is exactly the author's claim about completeness. A fixes on whether such a map is possible, a question the passage never raises; C blames the mapmaker, when the point is about detail itself; D and E import ideas (real accuracy, screens) the passage does not discuss.
  source_ref:
  - H2-Q2
- id: T1-R03
  passage_id: T1-P1
  section: reading_comprehension
  item_type: reading_mc
  question_number: 3
  skill: structure
  construct: How the passage is organized / its progression from case to principle.
  difficulty: hard
  dok: 3
  target_word:
  question_text: The passage as a whole moves from
  choice_a: a general rule to the exceptions that overturn it
  choice_b: a problem to the person responsible for causing it
  choice_c: a single example to the wider principle it illustrates
  choice_d: a claim to the objections that have been raised against it
  choice_e: a history of maps to a prediction about their future
  correct_answer: C
  distractor_types:
    A: wrong_logical_relation
    B: wrong_concept
    D: partly_true_but_wrong
    E: wrong_concept
  explanation: |-
    The map begins as one concrete case and then widens into a rule about descriptions, notes, measurements, and understanding in general. A reverses the movement (no exceptions overturn the rule); C invents a culprit; D expects a debate the passage never stages; E promises history and prophecy the passage does not contain.
  source_ref:
  - H2-Q20
