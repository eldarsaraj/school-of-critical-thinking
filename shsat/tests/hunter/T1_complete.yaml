  skill: Number & Operations (Decimals, Percents, Fractions)
  construct: 'Recognize that a square root does not distribute over a sum: √(a+b) ≠ √a + √b.'
  difficulty: medium
  dok: 3
  question_text: Compare the quantity in Column A with the quantity in Column B.
  column_a: √(36 + 64)
  column_b: √36 + √64
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e:
  correct_answer: B
  distractor_types:
    A: magnitude_misjudged
    C: special_case_overgeneralized
    D: picks_D_when_determinable
  distractor_trace:
    A: computes both but misjudges which is larger
    C: assumes the root distributes, so √(36+64) = √36 + √64, and calls them equal
    D: thinks the expressions cannot be compared without a calculator, though both are exact
  explanation: 'Column A: √(36 + 64) = √100 = 10. Column B: √36 + √64 = 6 + 8 = 14. Since 14 is greater than 10, Column B is greater. The trap is assuming the square root of a sum equals the sum of the square roots; it does not. Verified: 10 vs 14.'
  source_ref:
  - PT-QR-21
