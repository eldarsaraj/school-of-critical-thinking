  item_type: word_problem
  question_number: 3
  skill: Algebraic Concepts
  construct: Interpret the constant term of a linear cost model as the value when the variable is zero (a fixed base amount).
  difficulty: medium
  dok: 3
  question_text: A plumber's total charge is given by y = 45x + 60 dollars for a job that lasts x hours. What does the 60 represent?
  column_a:
  column_b:
  choice_a: The plumber charges $60 for each hour of work.
  choice_b: For every 60 hours worked, the charge rises by $1.
  choice_c: After 45 hours of work, the charge is $60.
  choice_d: The charge is $60 before any hours are worked.
  choice_e:
  correct_answer: D
  distractor_types:
    A: wrong_setup
    B: fast_pattern_match
    C: wrong_setup
  distractor_trace:
    A: treats 60 as the hourly rate, which is actually 45
    B: reads the numbers as a rate in the wrong direction
    C: attaches 60 to 45 hours instead of 0 hours
  explanation: Setting x = 0 (no hours worked) gives y = 45·0 + 60 = 60, so 60 is the fixed base charge that applies before any time is billed; the 45 is the hourly rate. Verified by evaluating at x = 0.
  source_ref:
  - PT-MA-15
