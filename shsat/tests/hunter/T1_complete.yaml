  source_type: public_domain_excerpt
  source_citation: 'Nathaniel Hawthorne, "The House of the Seven Gables" (Boston: Ticknor, Reed, and Fields, 1851), Chapter 1, "The Old Pyncheon Family." Project Gutenberg etext 77, https://www.gutenberg.org/cache/epub/77/pg77.txt. Public domain in the United States.'
  excerpt_start_anchor: The House of the Seven Gables, antique as it now looks, was not the first habitation
  excerpt_end_anchor: was executed for the crime of witchcraft.
  setting_place: Pyncheon Street in an old New England town; the site of the house
  setting_period: colonial New England, roughly a century and a half before the narrator's day
  narrator_pov: third-person, grave and lightly ironic
  central_relationship: Colonel Pyncheon and Matthew Maule (antagonists over the land)
  topic: the disputed origin of the Pyncheon house — how a powerful man's claim displaced an obscure settler
  mood: grave, ironic, morally weighted
  word_count: 452
  line_count: 42
  fk_grade: 14.2
  n_items: 9
  skills_covered: main_idea; tone_attitude; supporting_detail; figurative_craft; vocabulary_in_context; inference
  vocab_words_tested: plausible; obscure
  layout_rule: paragraph breaks preserved; wrapped at 11 words per line; every 5th line numbered
  text: |2
       The House of the Seven Gables, antique as it now looks,
       was not the first habitation erected by civilized man on precisely
       the same spot of ground. Pyncheon Street formerly bore the humbler
       appellation of Maule's Lane, from the name of the original occupant
     5 of the soil, before whose cottage-door it was a cow-path. A
       natural spring of soft and pleasant water—a rare treasure on the
       sea-girt peninsula where the Puritan settlement was made—had early induced Matthew
       Maule to build a hut, shaggy with thatch, at this point,
       although somewhat too remote from what was then the centre of
    10 the village. In the growth of the town, however, after some
       thirty or forty years, the site covered by this rude hovel
       had become exceedingly desirable in the eyes of a prominent and
       powerful personage, who asserted plausible claims to the proprietorship of this
       and a large adjacent tract of land, on the strength of
    15 a grant from the legislature. Colonel Pyncheon, the claimant, as we
       gather from whatever traits of him are preserved, was characterized by
       an iron energy of purpose. Matthew Maule, on the other hand,
       though an obscure man, was stubborn in the defence of what
       he considered his right; and, for several years, he succeeded in
    20 protecting the acre or two of earth which, with his own
       toil, he had hewn out of the primeval forest, to be
       his garden ground and homestead. No written record of this dispute
       is known to be in existence. Our acquaintance with the whole
       subject is derived chiefly from tradition. It would be bold, therefore,
    25 and possibly unjust, to venture a decisive opinion as to its
       merits; although it appears to have been at least a matter
       of doubt, whether Colonel Pyncheon's claim were not unduly stretched, in
       order to make it cover the small metes and bounds of
       Matthew Maule. What greatly strengthens such a suspicion is the fact
    30 that this controversy between two ill-matched antagonists—at a period, moreover, laud
       it as we may, when personal influence had far more weight
       than now—remained for years undecided, and came to a close only
       with the death of the party occupying the disputed soil. The
       mode of his death, too, affects the mind differently, in our
    35 day, from what it did a century and a half ago.
       It was a death that blasted with strange horror the humble
       name of the dweller in the cottage, and made it seem
       almost a religious act to drive the plough over the little
       area of his habitation, and obliterate his place and memory from
    40 among men.
       Old Matthew Maule, in a word, was executed for the crime
       of witchcraft.
  mean_sentence_length: 34.8
- id: T1-P4
  test_id: Test 1 (baseline)
  slot: 4
  title: Economy (excerpt)
  genre: classic_literary_nonfiction
  era: classic
  source_type: public_domain_excerpt
  source_citation: 'Henry David Thoreau, "Walden; or, Life in the Woods" (Boston: Ticknor and Fields, 1854), Chapter 1, "Economy." Project Gutenberg etext 205, https://www.gutenberg.org/cache/epub/205/pg205.txt. Public domain in the United States.'
  excerpt_start_anchor: The mass of men lead lives of quiet desperation.
  excerpt_end_anchor: and in others still are entirely unknown.
  setting_place: none — a reflective essay
  setting_period: 1850s New England
  narrator_pov: first-person essayist addressing the reader
  central_relationship: none — the writer and society at large
  topic: a challenge to accept inherited ways of living; most lives are lived in 'quiet desperation'
  mood: challenging, skeptical, reflective
  word_count: 560
  line_count: 52
  fk_grade: 9.0
  n_items: 8
  skills_covered: main_idea; authors_purpose; tone_attitude; figurative_craft; vocabulary_in_context; inference
  vocab_words_tested: resignation; necessaries
  layout_rule: paragraph breaks preserved; wrapped at 11 words per line; every 5th line numbered
  text: |2
       The mass of men lead lives of quiet desperation. What is
       called resignation is confirmed desperation. From the desperate city you go
       into the desperate country, and have to console yourself with the
       bravery of minks and muskrats. A stereotyped but unconscious despair is
     5 concealed even under what are called the games and amusements of
       mankind. There is no play in them, for this comes after
       work. But it is a characteristic of wisdom not to do
       desperate things.
       When we consider what, to use the words of the catechism,
    10 is the chief end of man, and what are the true
       necessaries and means of life, it appears as if men had
       deliberately chosen the common mode of living because they preferred it
       to any other. Yet they honestly think there is no choice
       left. But alert and healthy natures remember that the sun rose
    15 clear. It is never too late to give up our prejudices.
       No way of thinking or doing, however ancient, can be trusted
       without proof. What everybody echoes or in silence passes by as
       true to-day may turn out to be falsehood to-morrow, mere smoke
       of opinion, which some had trusted for a cloud that would
    20 sprinkle fertilizing rain on their fields. What old people say you
       cannot do you try and find that you can. Old deeds
       for old people, and new deeds for new. Old people did
       not know enough once, perchance, to fetch fresh fuel to keep
       the fire a-going; new people put a little dry wood under
    25 a pot, and are whirled round the globe with the speed
       of birds, in a way to kill old people, as the
       phrase is. Age is no better, hardly so well, qualified for
       an instructor as youth, for it has not profited so much
       as it has lost. One may almost doubt if the wisest
    30 man has learned any thing of absolute value by living. Practically,
       the old have no very important advice to give the young,
       their own experience has been so partial, and their lives have
       been such miserable failures, for private reasons, as they must believe;
       and it may be that they have some faith left which
    35 belies that experience, and they are only less young than they
       were. I have lived some thirty years on this planet, and
       I have yet to hear the first syllable of valuable or
       even earnest advice from my seniors. They have told me nothing,
       and probably cannot tell me any thing to the purpose. Here
    40 is life, an experiment to a great extent untried by me;
       but it does not avail me that they have tried it.
       If I have any experience which I think valuable, I am
       sure to reflect that this my Mentors said nothing about.
       One farmer says to me, "You cannot live on vegetable food
    45 solely, for it furnishes nothing to make bones with;" and so
       he religiously devotes a part of his day to supplying his
       system with the raw material of bones; walking all the while
       he talks behind his oxen, which, with vegetable-made bones, jerk him
       and his lumbering plough along in spite of every obstacle. Some
    50 things are really necessaries of life in some circles, the most
       helpless and diseased, which in others are luxuries merely, and in
       others still are entirely unknown.
  mean_sentence_length: 23.3
