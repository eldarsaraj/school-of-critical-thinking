  dok: 3
  target_word:
  question_text: When the author writes that "the river has edited itself" (line 30), the comparison suggests that the river has
  choice_a: written a message down along its banks
  choice_b: made an error and then corrected it on purpose
  choice_c: followed a careful plan to shorten its course
  choice_d: cut away a loop it no longer used, the way a writer strikes out needless words
  choice_e: copied the course of a neighboring river
