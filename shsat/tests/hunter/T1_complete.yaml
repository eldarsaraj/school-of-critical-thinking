  text: "    Nothing happened. That is the strangest feature of the ordinary traffic\n    jam, and the\
    \ part most drivers refuse to believe. You crawl\n    for twenty minutes, you round a curve braced\
    \ for the wreckage\n    that must be causing it, and there is nothing there: no\n5   collision, no\
    \ stalled truck, no lane closed for work. The road\n    opens and you drive away wondering what you\
    \ sat in. Traffic\n    engineers have a name for it: they call it a jam\n    wave, and the word wave\
    \ is doing real work in that\n    phrase. What moved backward through the highway was a disturbance\
    \ travelling\n10  through the cars, in the way a ripple travels through water\n    without carrying\
    \ the water along with it. Here is how one\n    begins. Traffic is dense but flowing, every driver\
    \ a little closer\n    to the next than judgment would advise. One driver taps the\n    brake for\
    \ reasons of his own, and the driver behind him\n15  is following too closely to respond gently, so\
    \ she brakes somewhat\n    harder. The next brakes harder still. Because each driver reacts a\n  \
    \  fraction of a second late and overcorrects slightly to make up\n    for it, the disturbance grows\
    \ as it travels backward, and perhaps\n    twenty cars behind the first tap, someone is brought to\
    \ a\n20  complete stop. That stopping point is the jam, and the stopping\n    point moves. As the\
    \ cars at its front accelerate away and\n    fresh cars pile in at its back, the jam slides backward\n\
    \    along the road at roughly twelve miles an hour, steady and\n    indifferent, while every car\
    \ inside it is travelling forward. Follow it\n25  long enough and none of the vehicles caught in the\
    \ original\n    slowdown is still in it. The jam has outlived its own\n    contents. This is why the\
    \ search for a cause fails so\n    reliably. The tap on the brake that began the whole thing\n   \
    \ happened twenty minutes ago and four miles up the road, and\n30  the driver who made it noticed\
    \ nothing and is home by\n    now. The same reasoning points to a remedy that feels like\n    surrender.\
    \ A driver who leaves a wide gap ahead of her\n    can absorb the wave instead of passing it on: when\
    \ the\n    car in front stops, she coasts, spending the gap rather than\n35  the brake, and the cars\
    \ behind her never receive the signal.\n    Experiments on test tracks, and measurements taken from\
    \ instrumented highways, suggest\n    that a small fraction of drivers doing this can smooth the\n\
    \    flow for everyone behind them. The obstacle is human rather than\n    technical, since the gap\
    \ looks to every other driver like an\n40  invitation to merge, and to the driver keeping it like\
    \ ground\n    she has already paid for and is now giving away.\n"
items:
- id: T1-R01
  passage_id: T1-P1
  section: reading_comprehension
  item_type: reading_mc
  question_number: 1
  skill: main_idea
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The passage is mainly concerned with
  choice_a: the mistakes earlier restorers made in good faith
  choice_b: the methods used for removing old varnish safely
  choice_c: the reasons a museum's objects cannot be trusted
  choice_d: why conservators now let their repairs be seen
  choice_e: how visitors respond to a partly filled object
  correct_answer: D
  distractor_types:
    A: too_narrow
    B: misidentified_detail
    C: inference_leap
    E: true_but_irrelevant
  explanation: 'The passage opens on an old rule (repairs should be invisible), explains why that rule
    was given up, and then defends what replaced it: repairs that can be undone and that can be seen.
    Everything in the passage — the wrong arms, the reversibility rule, the gray plaster, the crack that
    records a fire — serves that single argument, so D is the only option that covers the whole piece.
    A is true and is one of the passage''s steps, but the old restorers'' errors are the reason for the
    argument, not the argument itself. B misreads lines 15-16: varnish is mentioned as an example of a
    confident mistake, and no method of removing it safely is described. C over-reads the claim that a
    seamless restoration is dishonest into a claim that museums as a whole are untrustworthy, which the
    passage never says. E reports a real detail (line 30, visitors are unsettled) but that reaction is
    a consequence the author mentions in passing, not the subject of the passage.

    '
  source_ref:
  - H2-Q19
  - H2-Q49
- id: T1-R02
  passage_id: T1-P1
  section: reading_comprehension
  item_type: reading_mc
  question_number: 2
  skill: authors_purpose
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The examples given in lines 13-16 are included mainly to
  choice_a: show how confident a wrong repair looks
  choice_b: praise the technical skill of the earlier restorers
  choice_c: describe the kinds of damage objects suffer
  choice_d: condemn the taste of the nineteenth century
  choice_e: explain how Roman sculpture was originally displayed
  correct_answer: A
  distractor_types:
    B: opposite
    C: misidentified_detail
    D: partly_true_but_wrong
    E: wrong_concept
  explanation: 'The new arms and the stripped varnish are both repairs that looked right to the people
    who made them and turned out to be wrong. The sentence that follows them (lines 16-17) says so directly:
    the mistakes were made carefully, by experts, with confidence. The examples exist to show that confidence
    is no protection against error, which is what makes the reversibility rule necessary. B reverses the
    point: the passage grants that these restorers were skilled, but it raises their skill only to show
    that skill did not save them. C treats the examples as a catalogue of damage, when what is described
    is the repair, not the injury. D is close enough to tempt — the examples are unflattering — but the
    passage explicitly refuses to blame these restorers, calling their work careful and expert. E takes
    "Roman statues" as the subject; the passage says nothing about how the statues were displayed.

    '
  source_ref:
  - H2-Q2
  - H1-Q10
- id: T1-R03
  passage_id: T1-P1
  section: reading_comprehension
  item_type: reading_mc
  question_number: 3
  skill: inference
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The requirement that every treatment be reversible suggests that conservators regard
    their own conclusions as
  choice_a: worthless
  choice_b: private
  choice_c: flawless
  choice_d: unpopular
  choice_e: temporary
  correct_answer: E
  distractor_types:
    A: too_broad
    B: wrong_concept
    C: opposite
    D: true_but_irrelevant
  explanation: 'A conservator builds a repair that can be taken back out because she expects someone later
    to want it out. Lines 20-22 make the assumption explicit: a person in 2150 will know things she does
    not. Work built to be undone is work its maker treats as good for now rather than settled, which is
    what "temporary" names. A pushes that modesty too far. The passage says conservators lost confidence
    on purpose, not that they think their judgments have no value; a worthless judgment would not be worth
    making reversible. B has no support: nothing in the passage suggests conservators keep their conclusions
    to themselves, and the visible mend argues the opposite. C states the belief the whole passage was
    written against. D is true of the results — line 30 says the visible seam unsettles visitors — but
    the item asks how conservators regard their conclusions, not how visitors receive them.

    '
  source_ref:
  - H1-Q32
  - H2-Q5
- id: T1-R04
  passage_id: T1-P1
  section: reading_comprehension
  item_type: reading_mc
  question_number: 4
  skill: vocabulary_in_context
  difficulty: medium
  dok: 2
  target_word: sound
  question_text: As used in line 34, "sound" most nearly means
  choice_a: sensible
  choice_b: undamaged
  choice_c: audible
  choice_d: valuable
  choice_e: thorough
  correct_answer: B
  distractor_types:
    A: wrong_concept
    C: surface_match
    D: inference_leap
    E: less_precise
  explanation: 'The sentence describes what happens when a crack is smoothed away: the object looks sound.
    The contrast is with the damage that has just been erased, so "sound" here means whole and unbroken.
    Every other sense of the word is grammatically possible and contextually wrong. A is the common sense
    of "sound" in phrases like sound advice, and the passage is full of reasoning, which makes the misreading
    easy — but an object, not an argument, is what looks sound in this line. C reaches for the noun most
    students meet first; the word is an adjective here and nothing in the passage makes noise. D imports
    a judgment the passage does not make: the argument is about honesty, not price. E catches the right
    family of meaning (as in a sound sleep) but describes completeness of an action rather than the physical
    wholeness of a thing.

    '
  source_ref:
  - H1-Q33
  - H2-Q7
- id: T1-R05
  passage_id: T1-P1
  section: reading_comprehension
  item_type: reading_mc
  question_number: 5
  skill: inference
  difficulty: medium
  dok: 3
  target_word: null
  question_text: The description of the plaster fill in lines 25-28 suggests that the conservator wants
    a visitor to
  choice_a: fail to notice the repair at all
  choice_b: admire the skill behind the fill
  choice_c: see the repair on looking closely
  choice_d: learn when the damage first occurred
  choice_e: doubt whether the mosaic is genuine
  correct_answer: C
  distractor_types:
    A: opposite
    B: true_but_irrelevant
    D: referent_slippage
    E: inference_leap
  explanation: 'The fill is tinted to two different distances at once. From across the room the eye does
    not snag on it; from close up it does not fool anyone, and the seam appears. That is a repair built
    to be missed at a glance and found on inspection, which is exactly what C describes. A is the standard
    the passage says has been abandoned — it is what an invisible repair would achieve. B is genuinely
    true of the work (the tinting is skilled) but the passage treats the skill as a means; the fill is
    designed to inform, not to be admired. D takes a real claim from elsewhere in the passage — damage
    is evidence, a crack records a fall or a fire (lines 32-33) — and attaches it to the wrong thing:
    the plaster is the new material, and it dates nothing. E overshoots. A visible seam tells a visitor
    which part is modern, which is the reverse of casting doubt on the original.

    '
  source_ref:
  - H2-Q8
  - H1-Q32
- id: T1-R06
  passage_id: T1-P1
  section: reading_comprehension
  item_type: reading_mc
  question_number: 6
  skill: structure
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The passage moves from
  choice_a: a method to its inventor
  choice_b: an error to its correction
  choice_c: a warning to its evidence
  choice_d: a standard to its replacement
  choice_e: a dispute to its settlement
  correct_answer: D
  distractor_types:
    A: wrong_concept
    B: too_narrow
    C: wrong_logical_relation
    E: partly_true_but_wrong
  explanation: 'The first third of the passage sets out the old rule — invisible repair, the object made
    whole. The middle explains why that rule failed and what replaced it: reversible treatment, then findable
    treatment. The last third defends the replacement. One standard gives way to another, which is D.
    A names a person the passage never introduces; no inventor of any method appears. B narrows the passage
    to one movement inside it. The confident mistakes and the rule that answered them are genuinely there,
    but they occupy the middle stretch rather than the whole, and the argument keeps going after them.
    C inverts the order of the parts. The passage puts its cautionary examples early and its claims late,
    so any warning arrives before its evidence rather than after. E is the closest miss: there is a real
    disagreement here, and the author clearly takes a side, but the passage ends by marking the limit
    of present knowledge rather than by settling anything.

    '
  source_ref:
  - H2-Q20
- id: T1-R07
  passage_id: T1-P1
  section: reading_comprehension
  item_type: reading_mc
  question_number: 7
  skill: inference
  difficulty: medium
  dok: 3
  target_word: null
  question_text: The passage suggests that a crack in an object is best understood as
  choice_a: a record of the object's history
  choice_b: a defect the maker failed to prevent
  choice_c: a sign the object was stored badly
  choice_d: a warning that the object is fragile
  choice_e: a detail most visitors would prefer hidden
  correct_answer: A
  distractor_types:
    B: wrong_concept
    C: inference_leap
    D: partly_true_but_wrong
    E: true_but_irrelevant
  explanation: 'Damage is evidence, the passage says, and it then lists what the evidence is of: a fall,
    a fire, a route through a war. A crack is thus a trace of what has happened to the object since it
    was made, which is why erasing it makes the object answer questions wrongly. B locates the crack at
    the moment of manufacture. The passage places it afterward — in the object''s life, not in its making.
    C picks one possible cause and treats it as the meaning; the passage''s examples are accidents and
    history, and none of them is neglect in storage. D is partly right, since a cracked object is fragile,
    but fragility is a fact about the object''s future and the passage is interested in what the crack
    tells us about its past. E reports something the passage does say (line 30, visitors are unsettled)
    and then treats visitor preference as the measure of what a crack is.

    '
  source_ref:
  - H1-Q32
  - H2-Q5
- id: T1-R08
  passage_id: T1-P1
  section: reading_comprehension
  item_type: reading_mc
  question_number: 8
  skill: vocabulary_in_context
  difficulty: medium
  dok: 2
  target_word: arrested
  question_text: As used in line 38, "arrested" most nearly means
  choice_a: captured
  choice_b: delayed
  choice_c: halted
  choice_d: shielded
  choice_e: undone
  correct_answer: C
  distractor_types:
    A: surface_match
    B: less_precise
    D: wrong_concept
    E: opposite
  explanation: 'The passage glosses its own word in the next clause: conservators stop a process without
    concluding it. Work that has been stopped rather than completed is halted, so C. A is the meaning
    most students meet first, and it is a real sense of the word — it is simply the wrong one for a process
    rather than a person. B is the strongest lure, because delay and stoppage are close in ordinary speech;
    the passage''s own wording ("they stop a process") rules it out, since a delay implies the process
    will resume on schedule. D describes a plausible aim of conservation but not the meaning of this word;
    shielding an object is what a conservator may do, not what "arrested" says. E points the opposite
    way: an arrested process has been stopped where it stands, while an undone one has been reversed.

    '
  source_ref:
  - H1-Q34
  - H2-Q1
- id: T1-R09
  passage_id: T1-P1
  section: reading_comprehension
  item_type: reading_mc
  question_number: 9
  skill: inference
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The line drawn across an object in lines 40-42 suggests that the conservator
  choice_a: distrusts her own training
  choice_b: expects to be corrected later
  choice_c: refuses to repair the object
  choice_d: wants her work to be found
  choice_e: believes the object resists understanding
  correct_answer: B
  distractor_types:
    A: partly_true_but_wrong
    C: opposite
    D: referent_slippage
    E: too_broad
  explanation: 'The line marks where the conservator''s knowledge ends and someone else''s begins — which
    means she assumes there is someone else, and that this person will know more. Marking the boundary
    of your own understanding is a way of leaving the correction to be made, so B. A pushes a real feature
    of the passage into overstatement. Conservators became less confident on purpose, but the passage
    credits their training throughout; deliberate humility is not distrust. C reverses the point. The
    line is drawn across a repair that has been made, not instead of one. D borrows a true claim from
    lines 24-25 — the best fills are findable — and applies it to the wrong subject: what is meant to
    be found is the repair, not the conservator''s reputation. E converts a limit on present knowledge
    into a claim that the object cannot be understood at all, which the passage never approaches.

    '
  source_ref:
  - H2-Q8
  - H2-Q27
- id: T1-R10
  passage_id: T1-P2
  section: reading_comprehension
  item_type: reading_mc
  question_number: 10
  skill: figurative_craft
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The grandfather's remark in lines 9-11 suggests that he
  choice_a: worries about scratching the metal
  choice_b: keeps a neater table than others
  choice_c: wants the tools to sell quickly
  choice_d: treats the tools as still useful
  choice_e: dislikes the folding table he uses
  correct_answer: D
  distractor_types:
    A: too_literal
    B: inference_leap
    C: opposite
    E: misidentified_detail
  explanation: 'A thing laid on bare metal looks discarded; a thing laid on a blanket looks kept. The
    grandfather''s objection is not to the surface but to what the surface says about the object resting
    on it. He is arranging his table so that the tools read as working equipment rather than as junk,
    which is D. A takes the remark at face value, as a concern about physical damage; the sentence is
    about how a tool looks, not about what happens to it. B turns a statement about meaning into a statement
    about tidiness, and about other sellers the passage never describes. C reverses the motive: goods
    staged to look discarded are goods staged to move fast, and the grandfather has spent years refusing
    to move his best one. E fastens on the wrong noun — the table is mentioned, but the remark concerns
    the blanket over it.

    '
  source_ref:
  - H1-Q1
  - H2-Q9
- id: T1-R11
  passage_id: T1-P2
  section: reading_comprehension
  item_type: reading_mc
  question_number: 11
  skill: figurative_craft
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The way Dennis laughs each month suggests that he
  choice_a: finds the grandfather amusing
  choice_b: is embarrassed by his own request
  choice_c: has given up wanting the plane
  choice_d: is friendlier than the other regular buyers
  choice_e: does not expect the refusal to last
  correct_answer: E
  distractor_types:
    A: too_literal
    B: wrong_concept
    C: opposite
    D: inference_leap
  explanation: 'Dennis treats the refusal as a bit the two of them perform together, which means he does
    not hear it as final. A man who believed the answer would take it once and stop asking; Dennis asks
    again the next month, and the month after, because to him the no is part of a negotiation still running.
    A reads the laugh as ordinary amusement and stops there, missing what a laugh does when the answer
    was serious. B has no support: Dennis is entirely at ease, and his asking is a routine he has built.
    C is the reverse of what the monthly return demonstrates — he wants it enough to keep coming. D generalizes
    from one man to a comparison the passage never sets up; the only other buyer described is the young
    man, and no ranking of manners is offered.

    '
  source_ref:
  - H2-Q9
  - H1-Q36
- id: T1-R12
  passage_id: T1-P2
  section: reading_comprehension
  item_type: reading_mc
  question_number: 12
  skill: vocabulary_in_context
  difficulty: medium
  dok: 2
  target_word: keen
  question_text: As used in line 29, "keen" most nearly means
  choice_a: eager
  choice_b: sharp
  choice_c: clever
  choice_d: polished
  choice_e: new
  correct_answer: B
  distractor_types:
    A: surface_match
    C: wrong_concept
    D: less_precise
    E: inference_leap
  explanation: 'The word describes the edge of a blade that has just been worked on a whetstone with oil,
    and that the grandfather forbids the narrator to touch with her thumb. An edge dangerous to a thumb
    is a sharp one, so B. A is the sense students meet most often, in phrases like keen to go, and it
    is a real meaning of the word applied to people rather than to blades. C reaches for another human
    sense — a keen mind — which cannot apply to an edge. D is nearly right and lands one step off: sharpening
    does leave a bright surface, but "keen" names the cutting quality, not the shine. E infers a restoration
    the passage does not claim; the plane is decades old, and dressing an edge does not make it new.

    '
  source_ref:
  - H1-Q2
  - H2-Q22
- id: T1-R13
  passage_id: T1-P2
  section: reading_comprehension
  item_type: reading_mc
  question_number: 13
  skill: inference
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The detail about Saturday night in lines 29-31 suggests that the grandfather
  choice_a: sharpens every tool each week
  choice_b: was trying to impress the buyer
  choice_c: had already decided to sell it
  choice_d: was worried the blade would rust
  choice_e: had planned to use the plane himself
  correct_answer: C
  distractor_types:
    A: too_broad
    B: causal_confusion
    D: wrong_concept
    E: opposite
  explanation: 'The sharpening happened the night before, at the kitchen table, when no buyer existed
    yet. A man does not put an edge on a tool he means to keep refusing to sell. The narrator herself
    only understands this in the moment she is describing — "which I had not thought about until then"
    — and what she understands is that the decision was made before Sunday. A stretches one Saturday into
    a habit; the passage marks this sharpening as the exception that caught her attention. B gets the
    sequence backwards, treating work done the night before as a response to a man who had not yet walked
    up. D substitutes a maintenance worry for a decision, and nothing in the passage mentions rust or
    storage. E is the reverse: the plane leaves in a stranger''s trunk, and the narrator never suggests
    her grandfather intended to use it.

    '
  source_ref:
  - H2-Q5
  - H1-Q17
- id: T1-R14
  passage_id: T1-P2
  section: reading_comprehension
  item_type: reading_mc
  question_number: 14
  skill: inference
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The narrator's account of Dennis's earlier offer suggests that the grandfather's price
    was
  choice_a: chosen for reasons other than money
  choice_b: the most the plane could bring
  choice_c: a mistake he came to regret
  choice_d: decided before the young man arrived
  choice_e: the usual price for such tools
  correct_answer: A
  distractor_types:
    B: opposite
    C: inference_leap
    D: referent_slippage
    E: misidentified_detail
  explanation: 'Sixty dollars from a stranger, four hundred refused from Dennis. The grandfather knew
    both numbers, and he set the low one for the buyer who wanted to put the plane back to work on a bad
    floor. Price, for him, was doing something other than measuring value. B is contradicted by the figure
    the narrator supplies from March; the plane could plainly bring far more. C reads regret into a silence,
    but the grandfather never looks back at the sale — he closes the gap on the table and changes the
    subject. D takes the sharpest inference in the passage, the whetstone on Saturday night, which shows
    the decision was made before any buyer walked up. It then attaches it to the wrong thing: what was
    settled in advance was whether to sell, not what to charge. E treats sixty dollars as a market rate,
    which the four-hundred-dollar offer rules out.

    '
  source_ref:
  - H2-Q8
  - H2-Q49
- id: T1-R15
  passage_id: T1-P2
  section: reading_comprehension
  item_type: reading_mc
  question_number: 15
  skill: inference
  difficulty: medium
  dok: 3
  target_word: null
  question_text: The grandfather's behavior in lines 46-49 suggests that he
  choice_a: has grown forgetful with age
  choice_b: is pleased with the money he made
  choice_c: wants to go home early
  choice_d: dislikes the crowd in the lot
  choice_e: is avoiding the subject
  correct_answer: E
  distractor_types:
    A: inference_leap
    B: opposite
    C: wrong_concept
    D: true_but_irrelevant
  explanation: 'He straightens the blanket, sits, looks at nothing in particular, and then says something
    about the weather that is not true. Every one of those actions is a way of not talking about what
    just left the table, and the narrator''s flat last line makes sure the reader notices the remark was
    cover rather than observation. A explains the false remark as confusion, but a man who has just arranged
    the table so the gap will not show is tracking the situation closely. B misreads the mood: sixty dollars
    for a four-hundred-dollar plane is not what a pleased man counts, and he says nothing about the sale
    at all. C invents an intention the passage never gives; he settles into his chair rather than packing
    up. D notes the crowd, which the passage does mention, and turns a direction of gaze into a dislike.

    '
  source_ref:
  - H1-Q17
  - H2-Q5
- id: T1-R16
  passage_id: T1-P2
  section: reading_comprehension
  item_type: reading_mc
  question_number: 16
  skill: tone_attitude
  difficulty: medium
  dok: 3
  target_word: null
  question_text: The narrator's attitude toward her grandfather is best described as
  choice_a: impatient
  choice_b: amused
  choice_c: resentful
  choice_d: watchful
  choice_e: anxious
  correct_answer: D
  distractor_types:
    A: partly_true_but_wrong
    B: wrong_concept
    C: too_broad
    E: inference_leap
  explanation: 'She records everything: the rubber band on the cigar box, the worn knob, the newspaper
    he uses for nothing else, the way his hands move when he explains. She is keeping track of a man she
    is trying to read, and D is the word for that. A catches one real moment — the single word "Grandpa"
    is a protest — but one interruption in a day of close attention does not describe her stance. B fits
    her handling of Dennis, whose "young lady" she clearly finds tiresome, rather than her handling of
    her grandfather. C converts a flicker of objection about money into a settled grievance the passage
    never shows; she does not complain again after he declines to look at her. E supplies a worry she
    never voices; she is observing him, not fearing for him.

    '
  source_ref:
  - H1-Q37
  - H2-Q42
- id: T1-R17
  passage_id: T1-P2
  section: reading_comprehension
  item_type: reading_mc
  question_number: 17
  skill: point_of_view
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The events of the passage are described by someone who
  choice_a: understands her grandfather completely
  choice_b: reports more than she explains
  choice_c: disapproves of the sale throughout
  choice_d: knows nothing about the tools
  choice_e: learned about the day afterward
  correct_answer: B
  distractor_types:
    A: too_broad
    C: partly_true_but_wrong
    D: opposite
    E: misidentified_detail
  explanation: 'The narrator gives us the whetstone, the newspaper, the closed-up gap on the table and
    the untrue remark about June, and she interprets none of them. The reader assembles the meaning out
    of details she has noticed and set down without comment, which is B. A claims a completeness she disclaims
    herself; the line "which I had not thought about until then" admits she is still catching up to him.
    C is true for one line and false for the rest — after "Grandpa" she stops objecting and starts watching.
    D is contradicted by everything she names: jointer, block plane, squares, level, and the book where
    she records offers. E puts her at a distance the passage does not allow, since she is behind the table
    for the whole scene.

    '
  source_ref:
  - H1-Q22
- id: T1-R18
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 18
  skill: main_idea
  difficulty: hard
  dok: 3
  target_word: null
  question_text: A good title for this passage would be
  choice_a: Four Ways to Be Poor
  choice_b: The Hardest Work in the World
  choice_c: A Christmas Without Father
  choice_d: Each Sister Speaks for Herself
  choice_e: Sacrifices Gladly Made
  correct_answer: D
  distractor_types:
    A: too_narrow
    B: misidentified_detail
    C: partly_true_but_wrong
    E: opposite
  explanation: 'Almost every line is a sister saying what she wants or what she suffers, and each complaint
    fits only the girl who makes it — the one who mourns a dress, the one who wants a book, the one who
    wants pencils, the one who says nothing about herself until the others press on. The passage is a
    set of self-portraits delivered as grumbling, which is D. A covers only the money, and the girls are
    quarrelling about work, school and a father as much as about being poor. B lifts one sister''s phrase
    about washing dishes out of a single speech and hangs the whole scene on it. C names something real
    and central — the silence when the father is mentioned is the heaviest moment here — but that hush
    occupies a few lines and the rest of the passage talks past it. E takes Meg''s own words and reverses
    them, since what she actually says is that she ought to make her sacrifices gladly and is afraid she
    does not.

    '
  source_ref:
  - H2-Q19
  - H2-Q30
- id: T1-R19
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 19
  skill: vocabulary_in_context
  difficulty: medium
  dok: 2
  target_word: altered
  question_text: As used in line 15, "altered" most nearly means
  choice_a: repaired
  choice_b: changed
  choice_c: raised
  choice_d: improved
  choice_e: gentle
  correct_answer: B
  distractor_types:
    A: surface_match
    C: wrong_concept
    D: inference_leap
    E: less_precise
  explanation: 'The word describes Meg''s tone after a silence. She has been complaining about being poor;
    now she explains her mother''s reasoning. Her manner of speaking is different from what it was a moment
    before, so B. A is the sense of the word students meet most often in a house where clothes are made
    over, and the passage has just mentioned Meg''s old dress, which makes the wrong sense easy to reach
    for — but a tone is not taken in at the seams. C picks a single kind of change, volume, that the passage
    does not indicate. D adds a judgment: the tone is different, and the passage never says it is better.
    E describes how the new tone might sound rather than what the word claims, which is only that it is
    not the earlier tone.

    '
  source_ref:
  - H1-Q26
  - H2-Q3
- id: T1-R20
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 20
  skill: supporting_detail
  difficulty: medium
  dok: 2
  target_word: null
  question_text: According to lines 15-23, the sisters are going without presents because
  choice_a: their mother thinks the winter will be hard
  choice_b: their father asked them to save money
  choice_c: they each agreed to give up a dollar
  choice_d: the money is being sent to the army
  choice_e: the family cannot afford anything at all
  correct_answer: A
  distractor_types:
    B: inference_leap
    C: misidentified_detail
    D: causal_confusion
    E: partly_true_but_wrong
  explanation: 'Meg reports the reason directly: their mother proposed no presents because the winter
    is going to be hard for everyone, and she thinks they should not spend on pleasure while the men in
    the army are suffering. The proposal is the mother''s, and the stated ground is the hard winter. B
    moves the decision to the father, who is far away and is never said to have asked for anything. C
    confuses two different dollars: each girl still has hers, and the question of giving them up is what
    they are arguing about. D turns a comparison into a transaction — the army is the reason for restraint,
    not the destination of the money, and nothing is sent anywhere. E overstates the poverty; the girls
    have a dollar each and are debating how to spend it, so the obstacle is a decision rather than an
    inability.

    '
  source_ref:
  - H1-Q35
  - H1-Q13
- id: T1-R21
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 21
  skill: inference
  difficulty: hard
  dok: 3
  target_word: null
  question_text: Jo's remarks about how she will spend her dollar suggest that she
  choice_a: is the least generous of the sisters
  choice_b: disagrees with her mother's judgment
  choice_c: wants to impress her older sister
  choice_d: has more money than the others
  choice_e: cares more for books than for clothes
  correct_answer: E
  distractor_types:
    A: inference_leap
    B: partly_true_but_wrong
    C: wrong_concept
    D: misidentified_detail
  explanation: 'Jo wants one thing, a book she has wanted a long time, and the narrator adds that she
    is a bookworm. Set that beside the sister who is looking down at her old dress and the sister who
    wants drawing pencils, and beside Jo''s own indifference to the state of her shoes, and the preference
    is plain. A generalizes from one purchase to a character judgment the passage does not support; Jo
    is the one who argues the others should have what they want too. B is close, since Jo does push back
    on the plan, but she frames it as reading her mother''s wishes rather than opposing them. C invents
    an audience: Jo''s stated reason is how long she has wanted the book. D misreads the arithmetic, since
    the passage says each girl has a dollar.

    '
  source_ref:
  - H1-Q17
  - H2-Q5
- id: T1-R22
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 22
  skill: figurative_craft
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The mention of the hearth brush and kettle-holder in lines 30-32 suggests that Beth
  choice_a: spends her time on household work
  choice_b: is speaking to no one in particular
  choice_c: keeps her disappointment to herself
  choice_d: prefers the kitchen to the parlor
  choice_e: is the quietest of the four sisters
  correct_answer: C
  distractor_types:
    A: true_but_irrelevant
    B: too_literal
    D: inference_leap
    E: partly_true_but_wrong
  explanation: 'Naming the only two things that heard the sigh is a way of saying that none of her sisters
    did. Beth has a wish and a small sorrow about it, and she lets both out where no person is listening,
    which is C. A is true of Beth elsewhere in the passage, where she says washing dishes is the worst
    work in the world, but the objects here are witnesses rather than chores. B takes the joke at face
    value, as though the point were the direction she faced; the point is who failed to notice. D builds
    a preference between rooms out of two household objects that happen to sit near the fire. E is the
    strongest lure because it is broadly true of Beth, but a standing trait is not what this image reports
    — it reports one sigh that went unheard, which sets up the second sigh that does not.

    '
  source_ref:
  - H1-Q8
  - H2-Q23
- id: T1-R23
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 23
  skill: vocabulary_in_context
  difficulty: medium
  dok: 2
  target_word: cross
  question_text: As used in line 50, "cross" most nearly means
  choice_a: angry
  choice_b: ashamed
  choice_c: opposed
  choice_d: irritable
  choice_e: unwell
  correct_answer: D
  distractor_types:
    A: less_precise
    B: wrong_concept
    C: surface_match
    E: inference_leap
  explanation: 'Beth is describing what dishwashing does to her: it puts her out of temper and stiffens
    her hands so she cannot practice. The word names a small, ordinary bad mood, which is D. A is in the
    right family and one degree too strong; a girl who begins by calling it naughty to fret is not reporting
    anger. B swaps a mood for a judgment about herself, and her shame, if any, is about complaining rather
    than about the work. C reaches for the sense of the word that means set against something, which is
    the meaning most visible in the spelling and the wrong one here. E converts a temper into an illness
    by borrowing the stiff hands from the next clause.

    '
  source_ref:
  - H1-Q28
  - H2-Q7
- id: T1-R24
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 24
  skill: inference
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The difference between Beth's two sighs in lines 30-32 and 48-52 suggests that she
  choice_a: has grown angrier as the talk went on
  choice_b: is less patient than her sisters
  choice_c: wants her sisters to pity her
  choice_d: finds housework harder than music
  choice_e: lets her feelings show only gradually
  correct_answer: E
  distractor_types:
    A: inference_leap
    B: opposite
    C: wrong_concept
    D: misidentified_detail
  explanation: 'The first sigh is heard by nobody in the room. The second is one that anyone could hear.
    The passage marks the change deliberately, and what has changed is not the strength of Beth''s feeling
    but how much of it reaches the surface, which is E. A reads a louder sigh as a hotter one; the girl
    sighing has just said it is naughty to fret, which is not the language of rising anger. B reverses
    her: Beth is the one who opens with gratitude and closes with an apology for complaining. C supplies
    a motive the passage withholds — she never addresses her sisters or asks anything of them. D compares
    two burdens the passage does not weigh against each other; the music is what she cannot practice,
    not a task she prefers.

    '
  source_ref:
  - H2-Q8
  - H1-Q24
- id: T1-R25
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 25
  skill: inference
  difficulty: medium
  dok: 3
  target_word: null
  question_text: Taken together, the four sisters' complaints suggest that each of them
  choice_a: blames the others for her troubles
  choice_b: wishes to leave the family home
  choice_c: finds her own burden the heaviest
  choice_d: regrets the promise she made
  choice_e: has forgotten her father's absence
  correct_answer: C
  distractor_types:
    A: wrong_concept
    B: inference_leap
    D: partly_true_but_wrong
    E: opposite
  explanation: 'Each girl answers the previous complaint by topping it. One says her work is hard, the
    next says the other does not have half such a hard time, the third calls her own the worst work in
    the world, and the fourth says she does not believe any of them suffer as she does. The shape of the
    exchange is four people each certain her own case is the worst, which is C. A misplaces the grievance:
    their complaints are about children, an old lady, dishes and schoolmates, not about one another. B
    invents a wish for escape that nobody voices. D catches a real moment, since Meg admits she does not
    make her sacrifices gladly, but regret about the promise is Meg''s alone and the item asks what is
    true of each. E is contradicted by the silence that falls when the father is mentioned.

    '
  source_ref:
  - H1-Q19
  - H2-Q5
- id: T1-R26
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 26
  skill: tone_attitude
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The narrator's attitude toward the sisters is best described as
  choice_a: indulgent
  choice_b: severe
  choice_c: mournful
  choice_d: admiring
  choice_e: detached
  correct_answer: A
  distractor_types:
    B: opposite
    C: partly_true_but_wrong
    D: less_precise
    E: wrong_concept
  explanation: 'The narrator lets the girls squabble and adds small amused touches — a sister examining
    her shoe heels in a gentlemanly manner, a sigh overheard only by a hearth brush. The girls are being
    teased by someone clearly fond of them, which is A. B is the reverse: nothing in the telling scolds
    them, and their least attractive moments are handled lightly. C fits one passage of the scene, the
    hush when the father is mentioned, and then misdescribes the rest, which is brisk and comic. D is
    close and one shade off — the narrator is amused by these girls rather than impressed by them, and
    admiration would not permit the teasing. E claims a distance the narration does not keep; a detached
    narrator would not supply the affectionate asides.

    '
  source_ref:
  - H1-Q31
  - H2-Q33
- id: T1-R27
  passage_id: T1-P4
  section: reading_comprehension
  item_type: reading_mc
  question_number: 27
  skill: main_idea
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The writer's chief point about the Chalmers family is that they
  choice_a: are poorer than she first expected
  choice_b: have been worn down by the work
  choice_c: work hard without ever getting ahead
  choice_d: have chosen a hard place to settle
  choice_e: keep their religion above all else
  correct_answer: C
  distractor_types:
    A: inference_leap
    B: partly_true_but_wrong
    D: too_narrow
    E: misidentified_detail
  explanation: 'The passage sets two things side by side and refuses to let either cancel the other. The
    family rises early and works till evening, and after nine years they have only the bare necessaries.
    Everything between those two facts — the mill that fails daily, the cabin left in ruins, the harness
    held together with rope — explains the gap, and the gap is the point. A supposes a comparison with
    an earlier expectation that the passage never records. B is the conclusion the facts seem to invite,
    given nine years of labour and nothing to show but the bare necessaries. The passage insists on the
    opposite about the family itself, calling them frugal, sober and hard-working, rising early and labouring
    till evening. Their trouble is not exhaustion. D shifts the blame to the ground, which the passage
    never faults; the water power is called invaluable. E takes a real feature of the household and makes
    it the thesis, when religion appears here only in the phrase about courtesy being a work of the flesh.

    '
  source_ref:
  - H2-Q19
  - H2-Q49
- id: T1-R28
  passage_id: T1-P4
  section: reading_comprehension
  item_type: reading_mc
  question_number: 28
  skill: vocabulary_in_context
  difficulty: medium
  dok: 2
  target_word: invaluable
  question_text: As used in line 2, "invaluable" most nearly means
  choice_a: worthless
  choice_b: priceless
  choice_c: unmeasured
  choice_d: unusual
  choice_e: abundant
  correct_answer: B
  distractor_types:
    A: surface_match
    C: less_precise
    D: wrong_concept
    E: inference_leap
  explanation: 'The word describes the water power that comes with the claim — the one asset the family
    possesses outright, and the thing that makes a sawmill possible at all. It is being praised, so B.
    A is the trap the word is built on. The prefix looks like the one in "invisible" or "incomplete,"
    so students read it as not valuable, which reverses the meaning exactly. C catches the idea that no
    figure is given and mistakes that for the claim being made; the passage is not saying the value is
    unknown but that it is very great. D substitutes rarity for worth. E borrows from water, of which
    there is presumably plenty, and applies plenty to the wrong noun — the sentence values the power,
    not the volume.

    '
  source_ref:
  - H1-Q33
  - H2-Q4
- id: T1-R29
  passage_id: T1-P4
  section: reading_comprehension
  item_type: reading_mc
  question_number: 29
  skill: inference
  difficulty: medium
  dok: 3
  target_word: null
  question_text: The list of things that go wrong on the claim suggests that the trouble comes from
  choice_a: a failure to keep things in repair
  choice_b: bad luck that no one could prevent
  choice_c: land too poor to support a family
  choice_d: a shortage of money to buy tools
  choice_e: too few hands to do the work
  correct_answer: A
  distractor_types:
    B: opposite
    C: wrong_concept
    D: inference_leap
    E: misidentified_detail
  explanation: 'Every item on the list is small and fixable in advance: a missing shoe nail, a broken
    buckle, a wheel, a strap, a foundation dug and then abandoned. None of them is a disaster. What they
    share is that each could have been seen to before it stopped the work, and none was. B is the reading
    the family might prefer, and the passage is built to refuse it — a run of accidents this uniform is
    not chance. C blames the ground, though the passage calls the water power invaluable and never says
    the land is bad. D supposes poverty caused the breakdowns, but a shoe nail and a buckle are not what
    a family cannot afford, and the passage puts the poverty at the end of the chain rather than the start.
    E is contradicted a few lines later, where the household is said to include a grown son and a hired
    man.

    '
  source_ref:
  - H1-Q32
  - H2-Q5
- id: T1-R30
  passage_id: T1-P4
  section: reading_comprehension
  item_type: reading_mc
  question_number: 30
  skill: vocabulary_in_context
  difficulty: medium
  dok: 2
  target_word: want
  question_text: As used in line 12, "want" most nearly means
  choice_a: desire
  choice_b: lack
  choice_c: neglect
  choice_d: delay
  choice_e: expense
  correct_answer: B
  distractor_types:
    A: surface_match
    C: less_precise
    D: wrong_concept
    E: inference_leap
  explanation: 'A horse goes lame for want of a shoe nail. The nail is missing, and its absence is what
    lames the horse, so B. A is the meaning students meet in nearly every other sentence they read, and
    here it produces nonsense: a horse does not go lame because it desires a nail. C is the closest miss
    and worth dwelling on, because neglect is exactly what the paragraph is diagnosing — but the word
    names the missing thing, not the carelessness that let it go missing, and the passage supplies that
    judgment elsewhere. D turns an absence into a delay, which fits the mill''s stoppages but not this
    phrase. E imports cost into a sentence about a nail nobody bought.

    '
  source_ref:
  - H1-Q34
  - H2-Q6
- id: T1-R31
  passage_id: T1-P4
  section: reading_comprehension
  item_type: reading_mc
  question_number: 31
  skill: inference
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The writer's remarks about Chalmers in lines 16-20 suggest that she believes
  choice_a: he works harder than his neighbours do
  choice_b: his religion has made him idle
  choice_c: he has been unlucky with weather
  choice_d: hard work is not enough by itself
  choice_e: his family gives him little help
  correct_answer: D
  distractor_types:
    A: inference_leap
    B: opposite
    C: wrong_concept
    E: misidentified_detail
  explanation: 'The sentence begins with "Yet," and the word is doing the whole job. She has just catalogued
    nine years of things left undone; now she grants that the man is frugal, sober and hard-working, and
    that he and two others are at it from dawn to dark. Granting the effort and keeping the verdict means
    the effort was never the missing piece. A invents a comparison with neighbours who do not appear.
    B reverses the passage twice over: Chalmers is called hard-working, and his religion is described
    as narrow rather than as an excuse for idleness. C reaches for the standard explanation of a failed
    claim, and no weather is mentioned anywhere in the excerpt. E notes the family, who do appear, and
    misassigns the failure to them, when the same sentence has the son and the hired man labouring alongside
    him.

    '
  source_ref:
  - H1-Q32
  - H2-Q8
- id: T1-R32
  passage_id: T1-P4
  section: reading_comprehension
  item_type: reading_mc
  question_number: 32
  skill: tone_attitude
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The writer's attitude toward the family is best described as
  choice_a: critical but not unkind
  choice_b: amused and superior
  choice_c: openly hostile toward them
  choice_d: respectful of their beliefs
  choice_e: anxious about her safety
  correct_answer: A
  distractor_types:
    B: partly_true_but_wrong
    C: too_broad
    D: misidentified_detail
    E: inference_leap
  explanation: 'Her descriptions are severe — a sour girl, hard un-child-like children, a voice that carries
    a reproach — and yet she says she thinks the wife suffers, wishes she could show them something better,
    and admits she writes the judgment reluctantly. Both halves are in the passage, and A is the only
    choice that holds them together. B catches her class and her distance, and she is at moments both,
    but amusement does not survive the sentence about the wife''s suffering or the reluctance at the end.
    C keeps the severity and drops everything that qualifies it. D takes her account of their religion,
    which she calls narrow, and turns her notice of it into approval. E supplies a fear the passage never
    shows; she is lodging with them, observing closely, and troubled by their manners rather than by any
    danger.

    '
  source_ref:
  - H1-Q37
  - H2-Q11
- id: T1-R33
  passage_id: T1-P4
  section: reading_comprehension
  item_type: reading_mc
  question_number: 33
  skill: inference
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The way the family treats the writer suggests that they regard her as
  choice_a: a guest who must be honoured
  choice_b: a servant they have lately hired
  choice_c: a spy sent to watch them
  choice_d: a stranger whose manners puzzle them
  choice_e: an idler who does no work
  correct_answer: E
  distractor_types:
    A: opposite
    B: wrong_concept
    C: inference_leap
    D: partly_true_but_wrong
  explanation: 'Three details point one way. The wife refers to her as "that woman." The family knocks
    her belongings over without apology. And she says outright that she feels they think it sinful that
    she does not work as hard as they do. In a house where everything but work is despised, a woman who
    reads and knits is a woman doing nothing. A is the reverse of every detail given. B mistakes their
    coldness for a working arrangement; she is a paying lodger, not staff, and nobody sets her tasks.
    C dramatizes their suspicion into something the passage never suggests. D is the strongest of the
    four, because their blank amazement at being thanked really is bewilderment — but puzzlement is a
    mild word for a family that regards her as living in sin against labour.

    '
  source_ref:
  - H2-Q5
  - H1-Q19
- id: T1-R34
  passage_id: T1-P4
  section: reading_comprehension
  item_type: reading_mc
  question_number: 34
  skill: authors_purpose
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The writer ends with the statement in lines 43-45 mainly to
  choice_a: excuse herself for having stayed so long
  choice_b: explain why she dislikes the West
  choice_c: show the judgment was not lightly made
  choice_d: apologize to the family she describes
  choice_e: warn other travellers away from Colorado
  correct_answer: C
  distractor_types:
    A: wrong_concept
    B: misidentified_detail
    D: inference_leap
    E: too_broad
  explanation: 'She has just made a sweeping charge about what the pursuit of gain is doing to family
    life in the West. Then she notes that she writes it unwillingly and only after two years in the country.
    Both halves of that sentence are credentials: the reluctance answers the suspicion that she enjoys
    the verdict, and the two years answer the suspicion that she reached it in haste. A treats the sentence
    as being about her own conduct rather than about the reliability of her claim. B inverts the logic
    — the reluctance exists because she does not wish to dislike the place, and a writer explaining a
    dislike would not call herself unwilling. D imagines an audience that will never read it; these are
    private letters, and no apology is offered to anyone. E turns an observation into travel advice, which
    the passage never gives.

    '
  source_ref:
  - H2-Q2
  - H1-Q10
- id: T1-R35
  passage_id: T1-P5
  section: reading_comprehension
  item_type: reading_mc
  question_number: 35
  skill: inference
  difficulty: medium
  dok: 3
  target_word: null
  question_text: The detail that the men set each cot inside a painted line suggests that they
  choice_a: were following an order they were given
  choice_b: took the marks as instructions
  choice_c: wanted to keep the cots from sliding
  choice_d: hoped to make the room look tidy
  choice_e: knew the game the lines were for
  correct_answer: B
  distractor_types:
    A: opposite
    C: wrong_concept
    D: partly_true_but_wrong
    E: inference_leap
  explanation: 'The poem gives the reason and then removes the obvious explanation for it. The men set
    the cots inside the lines because the lines were there — and the next sentence says that nobody told
    them to. A mark on a floor, with no rule attached and no one enforcing it, was enough to decide where
    forty beds went. A is ruled out by three words. "Nobody told them to" exists in the poem precisely
    to close off the reading that someone was directing the work. C supplies a practical purpose, but
    paint does not hold a cot in place and the poem offers no such motive. D is partly right, since the
    result is orderly, but tidiness would not require the beds to land inside the markings rather than
    merely in rows. E credits the men with knowledge the poem never gives them, and the boy later in the
    poem shows that knowing the game is not what the lines depend on.

    '
  source_ref:
  - H1-Q9
  - H1-Q12
- id: T1-R36
  passage_id: T1-P5
  section: reading_comprehension
  item_type: reading_mc
  question_number: 36
  skill: figurative_craft
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The comparison of the dark scoreboard to a stopped clock suggests that the people
  choice_a: expect the power to return soon
  choice_b: have lost track of the days
  choice_c: resent being kept in the gym
  choice_d: no longer notice the board at all
  choice_e: keep a habit that no longer helps
  correct_answer: E
  distractor_types:
    A: inference_leap
    B: partly_true_but_wrong
    C: wrong_concept
    D: opposite
  explanation: 'You glance at a clock you already know has stopped. The glance is not a question; it is
    something your eyes do on their way past. The poem says the people still look at a board that has
    been dark for days, and the comparison tells you the looking has stopped meaning anything. A turns
    a habit into an expectation. Someone confident the power was returning would look at the board with
    a purpose, which is the opposite of what the image describes. B is close to something true — the poem
    does open with "Tuesday" and then stops counting — but a stopped clock in this line is being looked
    at, not consulted, and losing track of days is not what the glance shows. C imports a resentment that
    appears nowhere in a poem whose people sweep a clean floor and square their shoes. D is the reading
    the first line invites. A board that has been dark for days is a board most people would have stopped
    seeing, and a student who stops there will choose it. The next line refutes it: they still look. That
    is the whole point of the comparison, since a stopped clock is something you go on checking after
    it has ceased to tell you anything.

    '
  source_ref:
  - H1-Q11
  - H2-Q34
- id: T1-R37
  passage_id: T1-P5
  section: reading_comprehension
