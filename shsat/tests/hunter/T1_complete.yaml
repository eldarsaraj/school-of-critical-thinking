  question_number: 48
  skill: vocabulary_in_context
  difficulty: medium
  dok: 2
  target_word: signal
  question_text: As used in line 35, "signal" most nearly means
  choice_a: a light at the intersection
  choice_b: a blinking turn indicator
  choice_c: a shouted word of warning
  choice_d: a cue to brake
  choice_e: a message sent by radio
  correct_answer: D
  distractor_types:
    A: surface_match
    B: wrong_concept
    C: too_literal
    E: inference_leap
  explanation: 'What the cars behind never receive is the thing that has been passing backward through
    the traffic all along — the sight of brake lights ahead, which tells the next driver to slow. The
    coasting driver never brakes, so that prompt is never sent. D names it. A is the trap the item is
    built on. In a passage about highways, "signal" pulls hard toward traffic lights, and no intersection
    appears anywhere in the piece. B stays inside the car and picks the other roadway sense of the word,
    which has nothing to do with slowing. C imagines drivers calling to one another. E supposes a technology
    the passage never mentions; what travels between these cars is visible, not transmitted.

    '
  source_ref:
  - H1-Q34
  - H2-Q1
- id: T1-R49
  passage_id: T1-P6
  section: reading_comprehension
  item_type: reading_mc
  question_number: 49
  skill: authors_purpose
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The author opens the passage with the words "Nothing happened" mainly to
  choice_a: name the puzzle before explaining it
  choice_b: announce the answer at the start
  choice_c: show that the writer was there too
  choice_d: criticize the design of modern roads
  choice_e: suggest the problem cannot be solved
  correct_answer: A
  distractor_types:
    B: wrong_logical_relation
    C: inference_leap
    D: misidentified_detail
    E: opposite
  explanation: 'Two words state the whole mystery: you were delayed, and there was no reason for it at
    the place you were delayed. Everything after them is the explanation. Beginning with the puzzle also
    puts the reader in the position of the baffled driver, which is why the next sentences say "you" rather
    than "a driver." B has the right instinct about placement and the wrong idea about content. A short
    opening line often does carry the main claim, which is why this is tempting. Here it carries the mystery
    instead: nothing happened is what needs explaining, and the explanation takes the rest of the passage.
    C reads the flat opening as personal testimony, though the passage never uses "I" and gives no account
    of the writer''s own trip. D borrows the passage''s later interest in highways and turns an explanation
    into a complaint about how roads are built. E is contradicted by the last third of the passage, which
    describes a remedy and cites evidence that it works.

    '
  source_ref:
  - H2-Q2
  - H1-Q10
- id: T1-R50
  passage_id: T1-P6
  section: reading_comprehension
  item_type: reading_mc
  question_number: 50
  skill: inference
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The passage suggests that the remedy it describes is rarely used because drivers
  choice_a: do not know that it exists
  choice_b: cannot judge distances well enough
  choice_c: would rather arrive home sooner
  choice_d: believe engineers should fix the road
  choice_e: experience the gap as a loss
  correct_answer: E
  distractor_types:
    A: inference_leap
    B: wrong_concept
    C: partly_true_but_wrong
    D: misidentified_detail
  explanation: 'The passage says the obstacle is human rather than technical, and then says what the human
    obstacle is: the gap feels to the driver keeping it like ground she has already paid for and is now
    giving away. It is a remedy that registers as a defeat, which is why it goes unused even when it works.
    A supplies ignorance as the barrier, and the passage rules that out by locating the difficulty in
    how the gap feels rather than in what drivers know. B invents a limit on skill; nothing in the passage
    suggests drivers misjudge the distance. C is close to the feeling described and misses its shape —
    the driver is not calculating arrival time but reacting to the sight of space she could be occupying.
    D moves the explanation to an opinion about whose job it is, an argument the passage never raises.

    '
  source_ref:
  - H2-Q5
  - H2-Q49
- id: T1-Q01
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 1
  skill: Algebraic Concepts
  difficulty: medium
  dok: 3
  question_text: If 3n + 7 is an even number, which of the following must also be an even number?
  column_a: null
  column_b: null
  choice_a: n + 1
  choice_b: n
  choice_c: 2n + 1
  choice_d: 3n
  choice_e: null
  correct_answer: A
  distractor_types:
    B: wrong_setup
    C: fast_pattern_match
    D: procedure_substitution
  distractor_trace:
    B: assumes n itself is even; checked against every n satisfying the condition, n is always odd
    C: sees 2n and stops, reasoning that an even number plus one is what is wanted
    D: reuses the coefficient from the stem without testing parity
  explanation: 'Work backwards from the condition. If 3n + 7 is even, then 3n must be odd, because an
    odd number added to an odd number gives an even one. And 3n is odd only when n is odd, since multiplying
    by 3 does not change whether a number is odd or even. So n is odd. Now test each choice with an odd
    n. n + 1 is odd plus one, which is even, so A is always correct. B fails because n is odd, not even.
    C fails because 2n is even and 2n + 1 is therefore odd. D fails because 3 times an odd number is odd.
    Checked in Python across every n from 1 to 200 that satisfies the condition: n + 1 is even in all
    cases and each of the other three is even in none.

    '
  source_ref:
  - PT-QR-17
  - PT-QR-14
- id: T1-Q02
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 2
  skill: Algebraic Concepts
  difficulty: hard
  dok: 3
  question_text: In a chorus, the ratio of altos to sopranos is 2 to 3, and the ratio of sopranos to tenors
    is 4 to 5. There are 140 singers in the chorus altogether. How many are tenors?
  column_a: null
  column_b: null
  choice_a: 32
  choice_b: 40
  choice_c: 48
  choice_d: 60
  choice_e: null
  correct_answer: D
  distractor_types:
    A: partial_answer
    B: proportion_inversion
    C: last_step_trap
  distractor_trace:
    A: bridges the ratios correctly and reports the altos, 32
    B: finds the altos as 32 and then applies 4 to 5 to that number instead of to the sopranos, giving
      40
    C: bridges the ratios correctly and reports the sopranos, 48
  explanation: 'The two ratios share sopranos, so make the soprano numbers match before combining them.
    Altos to sopranos is 2 to 3, which is the same as 8 to 12. Sopranos to tenors is 4 to 5, which is
    the same as 12 to 15. Now the sopranos read 12 in both, so altos to sopranos to tenors is 8 to 12
    to 15. Those parts add to 35, and 140 divided by 35 is 4, so one part is 4 singers. The tenors are
    15 parts, or 60. Checking: altos 32, sopranos 48, tenors 60, which total 140. A and C are the other
    two groups, correct in themselves but not what was asked. B skips the bridging step and applies the
    second ratio to the altos, which the ratio does not describe.

    '
  source_ref:
  - PT-QR-3
  - PT-QR-18
- id: T1-Q03
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 3
  skill: Algebraic Concepts
  difficulty: medium
  dok: 3
  question_text: Maya has 22 coins, all of them nickels and dimes, worth $1.70 in total. How many of the
    coins are dimes?
  column_a: null
  column_b: null
  choice_a: 10
  choice_b: 11
  choice_c: 12
  choice_d: 17
  choice_e: null
  correct_answer: C
  distractor_types:
    A: partial_answer
    B: fast_pattern_match
    D: procedure_substitution
  distractor_trace:
    A: solves correctly and reports the nickels, 10; the same value also comes from swapping the two coin
      values
    B: splits 22 evenly without using the money at all
    D: divides 170 cents by 10 and ignores the coin count entirely
  explanation: 'If all 22 coins were nickels they would be worth 110 cents. The actual total is 170 cents,
    which is 60 cents more. Every dime swapped in for a nickel adds 5 cents, so there must be 60 divided
    by 5, or 12 dimes. That leaves 10 nickels. Check: 12 dimes is 120 cents, 10 nickels is 50 cents, and
    120 plus 50 is 170. A is the number of nickels rather than dimes, and it is worth noting that a student
    who mixes up the two coin values also arrives at 10, so this choice catches two different mistakes.
    B halves the coin count and never uses the $1.70. D produces a number larger than it should be and
    does not satisfy the 22-coin condition at all.

    '
  source_ref:
  - SQ-QR-3
  - PT-QR-16
- id: T1-Q04
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 4
  skill: Algebraic Concepts
  difficulty: hard
  dok: 3
  question_text: The first term of a sequence is 4. Each term after the first is found by multiplying
    the previous term by 3 and then subtracting 5. Which is the first term of the sequence greater than
    100?
  column_a: null
  column_b: null
  choice_a: the fourth term
  choice_b: the fifth term
  choice_c: the sixth term
  choice_d: the seventh term
  choice_e: null
  correct_answer: B
  distractor_types:
    A: procedure_substitution
    C: wrong_setup
    D: estimation_failure
  distractor_trace:
    A: drops the subtraction and builds 4, 12, 36, 108, where the fourth term is the first over 100
    C: builds the sequence correctly but calls the starting value term zero, shifting every answer by
      one
    D: assumes the growth is slower than it is and does not build the sequence out
  explanation: 'Build the sequence one term at a time, applying both operations each time. The first term
    is 4. Then 3 times 4 minus 5 is 7. Then 3 times 7 minus 5 is 16. Then 3 times 16 minus 5 is 43. Then
    3 times 43 minus 5 is 124. The fourth term, 43, is still below 100, and the fifth term, 124, is the
    first above it. A comes from forgetting the subtraction, which makes the sequence grow faster and
    reach 108 a term earlier. C is the counting error: the problem calls 4 the first term, not the term
    before the first. D underestimates how quickly tripling accumulates.

    '
  source_ref:
  - PT-QR-10
  - PT-QR-17
- id: T1-Q05
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 5
  skill: Data Analysis & Probability
  difficulty: medium
  dok: 3
  question_text: The mean of five numbers is 12. A sixth number is added to the group, and the mean of
    all six numbers becomes 13. What is the sixth number?
  column_a: null
  column_b: null
  choice_a: 18
  choice_b: 19
  choice_c: 25
  choice_d: 78
  choice_e: null
  correct_answer: A
  distractor_types:
    B: wrong_setup
    C: fast_pattern_match
    D: partial_answer
  distractor_trace:
    B: adds the number of values to the new mean, 13 plus 6
    C: adds the two means together
    D: computes the new total, 78, and reports it as the new number
  explanation: 'A mean is a total divided by a count, so turn both means back into totals. Five numbers
    averaging 12 have a total of 60. Six numbers averaging 13 have a total of 78. The sixth number is
    whatever closed that gap: 78 minus 60, which is 18. There is a second way to see it. The new number
    has to cover the old total''s share and lift every one of the six values by one, so it is 12 plus
    6, again 18. B uses the right ingredients in the wrong combination. C never uses the counts at all.
    D stops one step early, at the total rather than the single number.

    '
  source_ref:
  - PT-QR-2
  - PT-QR-9
- id: T1-Q06
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 6
  skill: Data Analysis & Probability
  difficulty: medium
  dok: 3
  question_text: A bag holds 3 red marbles, 4 blue marbles, and 5 green marbles. One marble is drawn and
    not put back, and it is green. What is the probability that the next marble drawn is also green?
  column_a: null
  column_b: null
  choice_a: 1/3
  choice_b: 4/11
  choice_c: 5/12
  choice_d: 5/11
  choice_e: null
  correct_answer: B
  distractor_types:
    A: wrong_setup
    C: fast_pattern_match
    D: last_step_trap
  distractor_trace:
    A: reduces the green count but not the total, giving 4 out of 12, which simplifies to 1/3
    C: ignores the draw altogether and answers for a full bag, 5 out of 12
    D: reduces the total but forgets that the marble removed was itself green, giving 5 out of 11
  explanation: 'The bag started with 12 marbles, 5 of them green. One green marble has been taken out
    and not replaced, so two things changed at once: there are now 4 green marbles, and there are now
    11 marbles in total. The probability is therefore 4 out of 11. The three wrong answers each update
    one number and forget the other, or forget both. A drops the green count from 5 to 4 but leaves the
    total at 12. D drops the total from 12 to 11 but leaves the green count at 5, which is the most common
    version of the mistake because it remembers that something was removed without noticing what. C treats
    the first draw as though it had not happened.

    '
  source_ref:
  - SQ-QR-7
  - PT-QR-12
- id: T1-Q07
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 7
  skill: Data Analysis & Probability
  difficulty: medium
  dok: 3
  question_text: In a class of 30 students, 18 study Spanish, 15 study French, and 7 study both languages.
    How many students study neither language?
  column_a: null
  column_b: null
  choice_a: 4
  choice_b: 7
  choice_c: 12
  choice_d: 26
  choice_e: null
  correct_answer: A
  distractor_types:
    B: fast_pattern_match
    C: wrong_setup
    D: partial_answer
  distractor_trace:
    B: repeats the number given for students taking both
    C: subtracts only the Spanish students from the class, 30 minus 18
    D: computes the number studying at least one language, 26, and stops there
  explanation: 'Adding 18 and 15 gives 33, which is more than the class holds. The reason is that the
    7 students taking both languages have been counted twice, once in each subject. Subtracting them once
    corrects the count: 18 plus 15 minus 7 is 26 students taking at least one language. The class has
    30 students, so 30 minus 26, or 4 students, take neither. B is a number lifted straight from the question.
    C forgets that some of the French students are already among the Spanish ones. D is the correct intermediate
    figure and answers a different question than the one asked.

    '
  source_ref:
  - PT-QR-1
  - PT-QR-12
- id: T1-Q08
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 8
  skill: Number & Operations (Decimals, Percents, Fractions)
  difficulty: hard
  dok: 3
  question_text: A shop reduces the price of a coat by 20 percent. Later it takes a further 25 percent
    off the reduced price. The coat now costs $60. What was the original price?
  column_a: null
  column_b: null
  choice_a: $75
  choice_b: $87
  choice_c: $90
  choice_d: $100
  choice_e: null
  correct_answer: D
  distractor_types:
    A: partial_answer
    B: wrong_setup
    C: procedure_substitution
  distractor_trace:
    A: undoes only the second reduction, 60 divided by 0.8, and stops at 75
    B: treats the two cuts as a single 45 percent cut and computes 60 times 1.45
    C: multiplies the final price up by 1.2 and 1.25 instead of dividing back, giving 90
  explanation: 'Undo the reductions one at a time, in reverse order. The last step took 25 percent off,
    so $60 is 75 percent of the price before it. That price is 60 divided by 0.75, which is $80. The step
    before took 20 percent off, so $80 is 80 percent of the original. The original is 80 divided by 0.8,
    which is $100. Check forwards: 20 percent off 100 is 80, and 25 percent off 80 is 60. A performs one
    of the two steps. B adds the percentages, which does not work because the second cut applies to an
    already reduced price rather than to the original. C is the subtlest error: raising a price by 20
    percent does not undo a 20 percent cut, because the increase is taken on a smaller number.

    '
  source_ref:
  - PT-QR-4
  - SQ-QR-1
- id: T1-Q09
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 9
  skill: Number & Operations (Decimals, Percents, Fractions)
  difficulty: medium
  dok: 3
  question_text: A tank is 3/8 full. After 24 more litres are poured in, the tank is 5/8 full. What is
    the capacity of the tank, in litres?
  column_a: null
  column_b: null
  choice_a: 48
  choice_b: 64
  choice_c: 96
  choice_d: 192
  choice_e: null
  correct_answer: C
  distractor_types:
    A: wrong_setup
    B: proportion_inversion
    D: procedure_substitution
  distractor_trace:
    A: reads the change as half the tank and divides 24 by 1/2
    B: treats the 24 litres as the 3/8 already in the tank and divides 24 by 3/8
    D: multiplies 24 by the denominator 8, ignoring that the gap is two eighths rather than one
  explanation: 'The 24 litres did not fill the tank. They moved it from 3/8 full to 5/8 full, so they
    filled the difference between those two fractions, which is 2/8, or 1/4 of the tank. If 1/4 of the
    tank is 24 litres, the whole tank is 4 times 24, or 96 litres. Check: 3/8 of 96 is 36 litres, and
    5/8 of 96 is 60 litres, a difference of 24. A misreads which fraction the 24 litres represent. B attaches
    the 24 litres to the starting level instead of the change. D uses the right denominator with the wrong
    numerator, filling one eighth rather than two.

    '
  source_ref:
  - PT-QR-11
  - PT-QR-6
- id: T1-Q10
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 10
  skill: Geometry
  difficulty: hard
  dok: 3
  question_text: A rectangle has a perimeter of 36 centimetres. Its length is 3 centimetres more than
    twice its width. What is the area of the rectangle, in square centimetres?
  column_a: null
  column_b: null
  choice_a: 18
  choice_b: 65
  choice_c: 72
  choice_d: 90
  choice_e: null
  correct_answer: B
  distractor_types:
    A: partial_answer
    C: wrong_setup
    D: arithmetic_slip
  distractor_trace:
    A: reports the half-perimeter, length plus width, without going on to the area
    C: drops the extra 3 and uses length equal to twice the width, giving 6 by 12
    D: solves 3w plus 3 equals 18 as though it were 3w equals 18, giving width 6 and length 15
  explanation: 'A perimeter counts each side twice, so length plus width is half of 36, which is 18. The
    length is 3 more than twice the width. Writing the width as w, the length is 2w + 3, and the two together
    give w + 2w + 3 = 18. That is 3w + 3 = 18, so 3w = 15 and w = 5. The length is 2 times 5 plus 3, which
    is 13. Check the perimeter: 2 times 13 plus 5 is 36. The area is 13 times 5, or 65 square centimetres.
    A stops at the half-perimeter, which is a real step in the work. C ignores the words "3 more than."
    D loses the 3 when isolating w, and the resulting rectangle has a perimeter of 42 rather than 36,
    which a student who checked would catch.

    '
  source_ref:
  - PT-QR-13
  - SQ-QR-5
- id: T1-Q11
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 11
  skill: Measurement
  difficulty: hard
  dok: 3
  question_text: A recipe uses 350 grams of flour to make 10 muffins. Flour is sold in 1-kilogram bags.
    What is the greatest number of muffins that can be made from 2 bags of flour?
  column_a: null
  column_b: null
  choice_a: 50
  choice_b: 57
  choice_c: 60
  choice_d: 66
  choice_e: null
  correct_answer: B
  distractor_types:
    A: wrong_setup
    C: last_step_trap
    D: estimation_failure
  distractor_trace:
    A: counts only whole recipes, 5 of them, and reports 50 muffins
    C: rounds 5.7 recipes up to 6 and reports 60 muffins, which the flour cannot cover
    D: rounds 35 grams per muffin down to 30 and divides 2000 by 30
  explanation: 'Two 1-kilogram bags are 2000 grams, since a kilogram is 1000 grams. That conversion is
    the first thing to get right. The recipe gives the flour for 10 muffins, so one muffin takes 350 divided
    by 10, or 35 grams. Then 2000 divided by 35 is 57 with 5 grams left over, so 57 muffins can be made.
    A assumes muffins can only be made in batches of ten, which the question does not say. C makes the
    opposite mistake and rounds up, but 60 muffins would need 2100 grams and only 2000 are available.
    D uses a convenient round number for the flour per muffin and overshoots, since cutting the amount
    each muffin uses raises the count.

    '
  source_ref:
  - PT-QR-5
- id: T1-Q12
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 12
  skill: Algebraic Concepts
  difficulty: medium
  dok: 3
  question_text: When a whole number k is divided by 6, the remainder is 4. What is the remainder when
    k is divided by 3?
  column_a: null
  column_b: null
  choice_a: 0
  choice_b: 1
  choice_c: 2
  choice_d: 4
  choice_e: null
  correct_answer: B
  distractor_types:
    A: wrong_setup
    C: procedure_substitution
    D: fast_pattern_match
  distractor_trace:
    A: reasons that 6 is divisible by 3 and concludes the whole number must be too, ignoring the remainder
    C: halves the remainder, 4 divided by 2, because 6 was halved to 3
    D: repeats the remainder given in the question
  explanation: 'Any number that leaves a remainder of 4 when divided by 6 can be written as a multiple
    of 6 plus 4. Try a few: 4, 10, 16, 22, 28. Now divide each by 3. Every multiple of 6 is also a multiple
    of 3, so the multiple-of-6 part contributes nothing to the remainder. What is left is the 4, and 4
    divided by 3 leaves 1. Check the list: 4 leaves 1, 10 leaves 1, 16 leaves 1, 22 leaves 1. A forgets
    the remainder entirely. C halves the remainder because the divisor was halved, which is not how remainders
    behave. D is worth a second look for a different reason: 4 cannot be a remainder when dividing by
    3 at all, since any remainder must be smaller than the divisor. Verified over every k below 2000 that
    leaves remainder 4 on division by 6; the remainder on division by 3 is 1 in every case.

    '
  source_ref:
  - PT-QR-17
  - PT-QR-16
- id: T1-Q13
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 13
  skill: Algebraic Concepts
  difficulty: hard
  dok: 3
  question_text: One printer prints 6 pages every 2 minutes. A second printer prints 10 pages every 5
    minutes. If both printers run at the same time, how many minutes will it take them to print 120 pages
    altogether?
  column_a: null
  column_b: null
  choice_a: 24
  choice_b: 40
  choice_c: 48
  choice_d: 100
  choice_e: null
  correct_answer: A
  distractor_types:
    B: partial_answer
    C: wrong_setup
    D: procedure_substitution
  distractor_trace:
    B: uses only the faster printer, 120 divided by 3
    C: averages the two rates instead of adding them, giving 2.5 pages a minute
    D: works out how long each printer would take alone, 40 and 60, and adds the two times
  explanation: 'Turn each printer into pages per minute before combining them. The first prints 6 pages
    in 2 minutes, which is 3 pages a minute. The second prints 10 pages in 5 minutes, which is 2 pages
    a minute. Running together, they produce 3 plus 2, or 5 pages every minute. So 120 pages take 120
    divided by 5, which is 24 minutes. Check: in 24 minutes the first prints 72 pages and the second prints
    48, and 72 plus 48 is 120. B forgets the second printer. C averages when it should add — averaging
    would be right for a typical rate, not a combined one, and it makes two printers slower than one of
    them. D is the most tempting: adding the solo times gives 100 minutes, which is longer than either
    printer would take alone, and that impossibility is the signal that the method is wrong.

    '
  source_ref:
  - PT-QR-3
  - SQ-QR-3
- id: T1-Q14
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 14
  skill: Algebraic Concepts
  difficulty: hard
  dok: 3
  question_text: A pattern is made from square tiles. Figure 1 uses 5 tiles, figure 2 uses 9 tiles, figure
    3 uses 13 tiles, and the pattern continues in the same way. How many tiles does figure 20 use?
  column_a: null
  column_b: null
  choice_a: 77
  choice_b: 80
  choice_c: 81
  choice_d: 100
  choice_e: null
  correct_answer: C
  distractor_types:
    A: wrong_setup
    B: last_step_trap
    D: procedure_substitution
  distractor_trace:
    A: finds the rule correctly but applies it to figure 19
    B: multiplies 4 by 20 and stops, dropping the constant
    D: multiplies figure 1's tile count by 20, treating the pattern as repeated copies
  explanation: 'Each figure adds 4 tiles to the one before: 5, then 9, then 13. So the count grows by
    4 each time, and the rule has the form 4 times the figure number, plus something. For figure 1, 4
    times 1 is 4, and the figure uses 5, so the something is 1. The rule is 4n + 1. Check it: figure 2
    gives 4 times 2 plus 1, which is 9, and figure 3 gives 13. Figure 20 uses 4 times 20 plus 1, which
    is 81 tiles. B is the near miss and the most common one, dropping the +1 that the pattern''s starting
    value supplies. A applies the right rule one figure early. D assumes each figure is a fresh copy of
    the first, which the growing counts rule out.

    '
  source_ref:
  - PT-QR-10
  - PT-QR-18
- id: T1-Q15
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 15
  skill: Data Analysis & Probability
  difficulty: hard
  dok: 3
  question_text: 'Seven students scored the following points in a game: 11, 15, 15, 18, 20, 22, 60. By
    how much does the mean of the scores exceed the median?'
  column_a: null
  column_b: null
  choice_a: 1
  choice_b: 3
  choice_c: 5
  choice_d: 8
  choice_e: null
  correct_answer: C
  distractor_types:
    A: wrong_setup
    B: arithmetic_slip
    D: procedure_substitution
  distractor_trace:
    A: takes the sixth value, 22, as the middle one
    B: takes the fifth value, 20, as the middle one
    D: uses the mode, 15, in place of the median
  explanation: 'The scores are already in order, so the median is the middle one of seven, which is the
    fourth value: 18. Three scores sit below it and three above. The mean is the total divided by 7. The
    scores add to 161, and 161 divided by 7 is 23. The mean exceeds the median by 23 minus 18, which is
    5. It is worth seeing why the two differ so much. Six of the seven scores are between 11 and 22, and
    the single score of 60 drags the mean upward while leaving the middle value untouched. That is what
    a mean does with an extreme value and a median does not. A and B both miscount which value sits in
    the middle; with seven scores the middle is the fourth, not the fifth or sixth. D confuses the most
    common score with the middle score, and here they are different numbers.

    '
  source_ref:
  - PT-QR-2
  - PT-QR-9
- id: T1-Q16
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 16
  skill: Data Analysis & Probability
  difficulty: medium
  dok: 3
  question_text: A spinner is divided into 12 equal sections numbered 1 through 12. What is the probability
    that the arrow stops on a number that is both even and greater than 4?
  column_a: null
  column_b: null
  choice_a: 1/6
  choice_b: 1/4
  choice_c: 1/3
  choice_d: 1/2
  choice_e: null
  correct_answer: C
  distractor_types:
    A: wrong_setup
    B: arithmetic_slip
    D: fast_pattern_match
  distractor_trace:
    A: counts only the even numbers above 8, giving 10 and 12
    B: finds three qualifying numbers instead of four, missing 6
    D: counts every even number and ignores the second condition
  explanation: 'Both conditions have to hold at once. Take the even numbers first: 2, 4, 6, 8, 10, 12.
    Now keep only those greater than 4: 6, 8, 10, 12. That is 4 numbers. There are 12 sections in all,
    so the probability is 4 out of 12, which simplifies to 1/3. The word "and" is what the item turns
    on. D keeps only the first condition and gets 6 out of 12. A applies the second condition too strictly
    and drops 6 and 8. B loses a single number, most often 6, because 6 sits just past the boundary and
    is easy to overlook when scanning upward.

    '
  source_ref:
  - SQ-QR-7
  - PT-QR-12
- id: T1-Q17
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 17
  skill: Number & Operations (Decimals, Percents, Fractions)
  difficulty: medium
  dok: 3
  question_text: At a school, 60 percent of the students take music. Of the students who take music, 25
    percent also take art. What percent of all the students at the school take both music and art?
  column_a: null
  column_b: null
  choice_a: 15
  choice_b: 25
  choice_c: 35
  choice_d: 85
  choice_e: null
  correct_answer: A
  distractor_types:
    B: fast_pattern_match
    C: wrong_setup
    D: procedure_substitution
  distractor_trace:
    B: reports the 25 percent given in the question without noticing what it is a percent of
    C: subtracts the two percentages
    D: adds the two percentages
  explanation: 'The second percentage is not taken out of the whole school. It is taken out of the music
    students only, and that is the whole point of the item. Imagine 100 students. Then 60 take music.
    A quarter of those 60 also take art, and a quarter of 60 is 15. So 15 students out of 100, or 15 percent,
    take both. B is the trap the wording sets: 25 percent is a real number in the question, but it describes
    a share of the music group rather than of the school. C and D combine the two percentages directly,
    which cannot be right, because the answer has to be smaller than either group.

    '
  source_ref:
  - PT-QR-4
  - PT-QR-11
- id: T1-Q18
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 18
  skill: Number & Operations (Decimals, Percents, Fractions)
  difficulty: hard
  dok: 3
  question_text: A ribbon 5 metres long is cut into as many pieces as possible, each 3/8 of a metre long.
    How much ribbon is left over?
  column_a: null
  column_b: null
  choice_a: 1/8 of a metre
  choice_b: 1/3 of a metre
  choice_c: 3/8 of a metre
  choice_d: 1/2 of a metre
  choice_e: null
  correct_answer: A
  distractor_types:
    B: wrong_setup
    C: last_step_trap
    D: arithmetic_slip
  distractor_trace:
    B: divides to get 13.33 and reads the decimal tail as a fraction of a metre
    C: assumes a full piece is left over, which would mean 14 pieces fit
    D: cuts only 12 pieces and reports what remains after those
  explanation: 'First find how many pieces fit. Dividing 5 by 3/8 is the same as multiplying 5 by 8/3,
    which gives 40/3, or 13 and a third. So 13 whole pieces can be cut, and the fourteenth would not fit.
    Now find how much ribbon those 13 pieces use: 13 times 3/8 is 39/8, which is 4 and 7/8 metres. What
    remains is 5 minus 4 and 7/8, which is 1/8 of a metre. B is the most instructive error. The "and a
    third" left over by the division is a third of a piece, not a third of a metre, and a third of a 3/8
    piece is 1/8 — which is the right answer arrived at by the wrong route. C would require 14 pieces
    to fit, and 14 pieces need 5 and 1/4 metres, more ribbon than there is.

    '
  source_ref:
  - PT-QR-6
  - SQ-QR-1
- id: T1-Q19
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 19
  skill: Geometry
  difficulty: medium
  dok: 3
  question_text: In a triangle, the second angle measures twice the first, and the third angle measures
    20 degrees more than the first. What is the measure of the largest angle, in degrees?
  column_a: null
  column_b: null
  choice_a: 40
  choice_b: 60
  choice_c: 65
  choice_d: 80
  choice_e: null
  correct_answer: D
  distractor_types:
    A: partial_answer
    B: last_step_trap
    C: wrong_setup
  distractor_trace:
    A: solves for the first angle and stops at 40
    B: reports the third angle, 60, on the assumption that the one with 20 added is the biggest
    C: drops the extra 20 from the equation, gets a first angle of 45, and reports that triangle's third
      angle
  explanation: 'Call the first angle a. Then the second is 2a and the third is a + 20. The three angles
    of a triangle add to 180, so a + 2a + a + 20 = 180. That gives 4a + 20 = 180, so 4a = 160 and a =
    40. The three angles are 40, 80 and 60. Check: they add to 180. The largest is 80. B is the trap.
    The third angle is the one described as "20 degrees more," which makes it sound like the biggest,
    but doubling the first angle produces a larger increase than adding 20 does. A answers with the variable
    rather than the question. C loses the constant when setting up, which produces a triangle of 45, 90
    and 65 that does not match the description.

    '
  source_ref:
  - PT-QR-13
  - PT-QR-7
- id: T1-Q20
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 20
  skill: Measurement
  difficulty: hard
  dok: 3
  question_text: A cyclist rides 12 kilometres at a speed of 24 kilometres per hour, and then rides a
    further 12 kilometres at a speed of 8 kilometres per hour. What is her average speed for the whole
    ride, in kilometres per hour?
  column_a: null
  column_b: null
  choice_a: 8
  choice_b: 12
  choice_c: 16
  choice_d: 32
  choice_e: null
  correct_answer: B
  distractor_types:
    A: fast_pattern_match
    C: wrong_setup
    D: estimation_failure
  distractor_trace:
    A: reports the slower of the two speeds
    C: averages the two speeds, 24 and 8, without weighting them by time
    D: adds the two speeds
  explanation: 'Average speed is total distance divided by total time, so both totals are needed. The
    first stretch: 12 kilometres at 24 km per hour takes half an hour. The second: 12 kilometres at 8
    km per hour takes an hour and a half. Total distance is 24 kilometres and total time is 2 hours, so
    the average speed is 12 km per hour. C is the answer almost everyone reaches for, and it is worth
    understanding why it fails. The two speeds are not held for equal amounts of time. She spends three
    times as long on the slow stretch as on the fast one, so the average has to sit closer to 8 than to
    24 — and 12 does, while 16 sits exactly halfway. A takes the slow speed alone. D adds speeds, which
    produces a figure faster than either part of the ride.

    '
  source_ref:
  - PT-QR-5
  - PT-QR-15
- id: T1-Q21
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 21
  skill: Number & Operations (Whole Numbers)
  difficulty: hard
  dok: 3
  question_text: How many whole numbers from 1 to 200 are divisible by 6 but not divisible by 4?
  column_a: null
  column_b: null
  choice_a: 8
  choice_b: 16
  choice_c: 17
  choice_d: 33
  choice_e: null
  correct_answer: C
  distractor_types:
    A: wrong_setup
    B: last_step_trap
    D: partial_answer
  distractor_trace:
    A: counts multiples of 24, treating "divisible by 6 and by 4" as divisible by their product
    B: counts the overlap, the multiples of 12, and reports it instead of subtracting it
    D: counts all the multiples of 6 and never applies the second condition
  explanation: 'Start with the multiples of 6 up to 200. Since 6 times 33 is 198 and 6 times 34 is 204,
    there are 33 of them. Now remove the ones that are also divisible by 4. A number divisible by both
    6 and 4 is divisible by 12 — not by 24, because 6 and 4 share a factor of 2. Since 12 times 16 is
    192, there are 16 such numbers. So the count is 33 minus 16, which is 17. A makes the classic mistake
    of multiplying the two divisors instead of finding their least common multiple, which undercounts
    the overlap badly. B finds the overlap correctly and then reports it rather than subtracting it. D
    never gets to the second condition. As a check, 16 and 17 add back to 33, which confirms the two groups
    split the multiples of 6 exactly.

    '
  source_ref:
  - PT-QR-8
  - PT-QR-22
- id: T1-Q22
  section: quantitative_reasoning
  item_type: quant_comparison
  question_number: 22
  skill: Algebraic Concepts
  difficulty: hard
  dok: 3
  shared_information: x is a whole number greater than 1.
  column_a: x²
  column_b: 2x
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e: null
  correct_answer: D
  distractor_types:
    A: special_case_overgeneralized
    B: magnitude_misjudged
    C: misses_D_when_indeterminate
  distractor_trace:
    A: tries x = 3, 4, 5, finds Column A larger every time, and generalizes without testing the smallest
      allowed value
    B: believes doubling outpaces squaring
    C: tries x = 2 only, finds the two equal, and stops
  explanation: 'The domain starts at x = 2, and that is where the item turns. At x = 2: Column A is 2
    × 2 = 4, and Column B is 2 × 2 = 4. The two are equal. At x = 3: Column A is 9 and Column B is 6,
    so Column A is greater. At x = 10: Column A is 100 and Column B is 20, so Column A is far greater.
    Both outcomes occur inside the allowed values, so the relationship is not determined and the answer
    is D. The item rewards testing the boundary. Squaring beats doubling for every whole number from 3
    upward, and a student who begins at 3 will never see the tie. Checked across x from 2 to 500: the
    quantities are equal at x = 2 and Column A is greater at every other value.

    '
  source_ref:
  - PT-QR-20
  - PT-QR-24
- id: T1-Q23
  section: quantitative_reasoning
  item_type: quant_comparison
  question_number: 23
  skill: Algebraic Concepts
  difficulty: medium
  dok: 2
  shared_information: 2(n + 3) = 3n − 4
  column_a: n − 4
  column_b: '6'
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e: null
  correct_answer: C
  distractor_types:
    A: magnitude_misjudged
    B: sign_error
    D: picks_D_when_determinable
  distractor_trace:
    A: solves for n and then compares n itself with 6 rather than comparing n − 4 with 6
    B: drops the minus when moving 3n across, solving 2n + 6 = 3n + 4 to get n = 2, which puts Column
      A below 6
    D: sees a letter in the shared information and assumes nothing can be pinned down
  explanation: 'The equation fixes n, so there is nothing indeterminate here. Expand the left side: 2n
    + 6 = 3n − 4. Subtract 2n from both sides: 6 = n − 4. Add 4: n = 10. Check by substituting: 2(10 +
    3) = 26, and 3(10) − 4 = 26. Column A is n − 4, which is 10 − 4, or 6. Column B is 6. The two are
    equal, so C. Notice that the second line of the working, 6 = n − 4, is Column A already. A student
    who spots that can answer without isolating n at all. D is the choice to resist. A letter in a comparison
    does not by itself make the relationship unknown; here the equation determines a single value of n.

    '
  source_ref:
  - PT-QR-19
  - SQ-QR-4
- id: T1-Q24
  section: quantitative_reasoning
  item_type: quant_comparison
  question_number: 24
  skill: Algebraic Concepts
  difficulty: hard
  dok: 3
  shared_information: y is a negative number.
  column_a: y³
  column_b: y²
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e: null
  correct_answer: B
  distractor_types:
    A: sign_error
    C: neglects_equality_case
    D: misses_D_when_indeterminate
  distractor_trace:
    A: treats an odd power of a negative number as positive and then compares sizes
    C: assumes y = −1 makes the two equal, without checking that it gives −1 and 1
    D: assumes that because y could be any negative number, the outcome must vary
  explanation: 'Sign settles this before size ever matters. A negative number multiplied by itself three
    times stays negative, because two negatives make a positive and the third makes it negative again.
    So Column A is always negative. A negative number multiplied by itself twice is positive. So Column
    B is always positive. Any positive number is greater than any negative number, so Column B is greater,
    whatever the size of y. The answer is B. It is worth testing the values that usually break these items.
    At y = −1/2: Column A is −1/8, Column B is 1/4. At y = −1: Column A is −1, Column B is 1 — close,
    but not equal, which is what rules out C. At y = −100: Column A is −1,000,000 and Column B is 10,000,
    and Column B is still the greater one because the other is negative. Checked across roughly 300 negative
    values including fractions between −1 and 0: Column B is greater in every single case.

    '
  source_ref:
  - PT-QR-24
  - PT-QR-25
- id: T1-Q25
  section: quantitative_reasoning
  item_type: quant_comparison
  question_number: 25
  skill: Data Analysis & Probability
  difficulty: medium
  dok: 3
  shared_information: A bag contains 4 red marbles and 6 blue marbles. Two more red marbles are then added
    to the bag.
  column_a: the probability of drawing a red marble from the bag
  column_b: 1/2
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e: null
  correct_answer: C
  distractor_types:
    A: magnitude_misjudged
    B: special_case_overgeneralized
    D: picks_D_when_determinable
  distractor_trace:
    A: adds the two red marbles to the red count but not to the total, giving 6 out of 10
    B: answers from the original bag, where red was 4 out of 10, and never applies the change
    D: assumes that because marbles are drawn at random the probability cannot be pinned down
  explanation: 'Adding marbles changes two numbers at once, and the item is built on remembering the second.
    The bag starts with 4 red and 6 blue, which is 10 marbles. Two red marbles are added, so there are
    now 6 red and still 6 blue, and the total is 12. The probability of drawing red is 6 out of 12, which
    is exactly 1/2. The two quantities are equal, so C. A is the common slip: the red count rises to 6
    but the total is left at 10, which would give 3/5 and make Column A look greater. B answers the question
    the bag used to pose, when red was 4 out of 10, or 2/5, and Column B really was greater. D misreads
    what randomness means. Each individual draw is uncertain, but the probability itself is a fixed number
    determined by the contents of the bag.

    '
  source_ref:
  - PT-QR-30
  - PT-QR-31
- id: T1-Q26
  section: quantitative_reasoning
  item_type: quant_comparison
  question_number: 26
  skill: Data Analysis & Probability
  difficulty: hard
  dok: 3
  shared_information: The mean of six numbers is 12. The mean of four of those six numbers is 9.
  column_a: the mean of the remaining two numbers
  column_b: '16'
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e: null
  correct_answer: A
  distractor_types:
    B: magnitude_misjudged
    C: special_case_overgeneralized
    D: misses_D_when_indeterminate
  distractor_trace:
    B: estimates that two numbers cannot pull the average up far and settles below the true value
    C: divides the leftover total by 4 instead of 2, arriving at 9 and then guessing at equality
    D: assumes that because the individual numbers are unknown, their mean must be too
  explanation: 'Means hide totals, so convert both means into totals first. Six numbers with a mean of
    12 have a total of 72. Four of them with a mean of 9 have a total of 36. The remaining two numbers
    must therefore total 72 − 36, which is 36. Two numbers totalling 36 have a mean of 18. Column A is
    18 and Column B is 16, so Column A is greater and the answer is A. D is the choice worth arguing with,
    because the six numbers really are unknown — there are endless sets that fit. But every one of those
    sets gives the same answer here, since only the totals matter and both totals are fixed. Unknown values
    do not always mean an unknown result. B underestimates how hard two numbers must work. Four values
    sitting three below the overall mean leave a deficit of 12, and only two numbers are left to make
    it up, which lifts them six above the mean rather than three.

    '
  source_ref:
  - PT-QR-26
  - SQ-QR-8
- id: T1-Q27
  section: quantitative_reasoning
  item_type: quant_comparison
  question_number: 27
  skill: Number & Operations (Whole Numbers)
  difficulty: hard
  dok: 3
  shared_information: null
  column_a: the number of whole-number factors of 36
  column_b: the number of whole-number factors of 48
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e: null
  correct_answer: B
  distractor_types:
    A: special_case_overgeneralized
    C: magnitude_misjudged
    D: picks_D_when_determinable
  distractor_trace:
    A: reasons that a perfect square must have more factors than a nearby number that is not one
    C: assumes two numbers of similar size have similar factor counts and calls it a tie
    D: treats the counting as too laborious to complete and gives up on determining it
  explanation: 'Both counts are fixed numbers, so list them carefully. Factors of 36, taken in pairs from
    the outside in: 1 and 36, 2 and 18, 3 and 12, 4 and 9, and then 6, which pairs with itself. That is
    9 factors. Factors of 48: 1 and 48, 2 and 24, 3 and 16, 4 and 12, 6 and 8. That is 10 factors. So
    48 has more factors, and the answer is B. The pairing method is what makes this quick, and it also
    explains why 36 has an odd count: it is a perfect square, so one of its factors pairs with itself
    and is counted once. A takes that same fact and draws the wrong conclusion from it — being a perfect
    square makes the count odd, not large. Size is a poor guide here too, since factor counts depend on
    how a number breaks into primes rather than on how big it is.

    '
  source_ref:
  - PT-QR-22
  - PT-QR-21
- id: T1-Q28
  section: quantitative_reasoning
  item_type: quant_comparison
  question_number: 28
  skill: Geometry
  difficulty: hard
  dok: 3
  shared_information: Two sides of a triangle have lengths 5 centimetres and 9 centimetres.
  column_a: the length of the third side, in centimetres
  column_b: '4'
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e: null
  correct_answer: A
  distractor_types:
    B: magnitude_misjudged
    C: neglects_equality_case
    D: misses_D_when_indeterminate
  distractor_trace:
    B: assumes the third side must be the shortest of the three
    C: takes 4 to be an allowed length, treating the flattened case as a triangle
    D: sees that the third side has no single value and concludes the comparison cannot be settled
  explanation: 'The third side is not a single number, but it is still confined, and the confinement is
    enough. For three lengths to close into a triangle, any two of them must add to more than the third.
    That forces the third side to be less than 5 + 9, or 14, and greater than 9 − 5, or 4. So the third
    side lies strictly between 4 and 14. It can be 4.1, or 7, or 13.9 — but it can never be 4 or less,
    because a side of exactly 4 would lay the 5 and the 4 flat along the 9 and close no triangle at all.
    Column A therefore exceeds 4 in every legal case, and the answer is A. D is the choice this item is
    built to catch, and it is a reasonable instinct: the third side genuinely is unknown. But a quantity
    can be unknown and still be known to sit above a particular number. C fails on the strictness of the
    inequality, which is exactly where the triangle rule does its work. Checked across several hundred
    sampled lengths in the legal range: every one exceeds 4.

    '
  source_ref:
  - PT-QR-29
  - PT-QR-27
- id: T1-Q29
  section: quantitative_reasoning
  item_type: quant_comparison
  question_number: 29
  skill: Number & Operations (Decimals, Percents, Fractions)
  difficulty: hard
  dok: 3
  shared_information: p is a number between 0 and 1.
  column_a: p × 3/4
  column_b: p ÷ 3/4
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e: null
  correct_answer: B
  distractor_types:
    A: magnitude_misjudged
    C: special_case_overgeneralized
    D: misses_D_when_indeterminate
  distractor_trace:
    A: carries over the rule that multiplying enlarges and dividing shrinks, which holds for whole numbers
    C: notices the same fraction on both sides and assumes the operations cancel out
    D: assumes that because p is not pinned to one value, the comparison must vary with it
  explanation: 'The value of p never matters here, only that it is positive. Multiplying by 3/4 takes
    three quarters of a number, which makes it smaller. Dividing by 3/4 asks how many three-quarters fit
    into the number, and since each piece is less than a whole, more than one fits — so dividing makes
    it larger. Dividing by 3/4 is the same as multiplying by 4/3. So Column A shrinks p and Column B grows
    it. As long as p is positive, Column B is greater, and the answer is B. Try p = 1/2: Column A is 3/8
    and Column B is 2/3. Try p = 0.9: Column A is 0.675 and Column B is 1.2. A applies a rule learned
    on whole numbers, where multiplying does enlarge — that rule reverses once the multiplier drops below
    1. The only value that would make the two equal is p = 0, and the shared information rules it out.
    Checked across all 999 values of p from 0.001 to 0.999: Column B is greater in every case.

    '
  source_ref:
  - PT-QR-21
  - PT-QR-32
- id: T1-Q30
  section: quantitative_reasoning
  item_type: quant_comparison
  question_number: 30
  skill: Algebraic Concepts
  difficulty: medium
  dok: 3
  shared_information: 5x − 3 = 2x + 9
  column_a: x²
  column_b: 4x
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e: null
  correct_answer: C
  distractor_types:
    A: magnitude_misjudged
    B: sign_error
    D: picks_D_when_determinable
  distractor_trace:
    A: assumes squaring must beat multiplying by 4, without solving for x
    B: gathers the constants as 9 − 3 instead of 9 + 3, solving 3x = 6 to get x = 2, which gives 4 against
      8
    D: recognises the shape of the earlier item comparing a square with a multiple and answers D from
      memory rather than from the equation
  explanation: 'The equation pins x to a single value, so the comparison is settled once that value is
    found. Subtract 2x from both sides: 3x − 3 = 9. Add 3 to both sides: 3x = 12, so x = 4. Check by substituting:
    5(4) − 3 = 17, and 2(4) + 9 = 17. Column A is 4², which is 16. Column B is 4 × 4, which is also 16.
    The two are equal, so C. B comes from a specific slip: moving the −3 across the equals sign turns
    it into +3, giving 3x = 12, but a student who subtracts instead gets 3x = 6 and x = 2, which makes
    Column B the larger. Substituting back into the original equation would catch it, since 5(2) − 3 is
    7 while 2(2) + 9 is 13. D deserves a note. An earlier comparison in this section put x² against 2x
    with x left free, and the answer there was that the relationship could not be determined. Here x is
    fixed, and the same-looking columns have a definite answer. The shape of an item is not its answer.

    '
  source_ref:
  - PT-QR-19
  - PT-QR-24
- id: T1-Q31
  section: quantitative_reasoning
  item_type: quant_comparison
  question_number: 31
  skill: Algebraic Concepts
  difficulty: medium
  dok: 2
  shared_information: a is a whole number and 3 < a < 8.
  column_a: the number of possible values of a
  column_b: '5'
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e: null
  correct_answer: B
  distractor_types:
    A: magnitude_misjudged
    C: neglects_equality_case
    D: picks_D_when_determinable
  distractor_trace:
    A: counts both endpoints as allowed, listing 3 through 8 for six values
    C: counts one endpoint as allowed, giving five values and an apparent tie
    D: reads "a is a whole number" as leaving a unspecified and concludes nothing can be counted
  explanation: 'Both signs are strict, so neither 3 nor 8 is allowed. List what is left: 4, 5, 6, 7. That
    is four values. Column A is 4 and Column B is 5, so Column B is greater and the answer is B. C is
    the near miss and comes from letting one endpoint slip in, which would give five values and make the
    two columns equal. A lets both in and gives six. The item is testing whether "less than" is read as
    strictly less than, and the two distractors sit one step and two steps away from that reading. D confuses
    an unknown value with an uncountable set. The value of a is genuinely unspecified, but how many values
    it could take is a fixed number.

    '
  source_ref:
  - SQ-QR-4
  - PT-QR-25
- id: T1-Q32
  section: quantitative_reasoning
  item_type: quant_comparison
  question_number: 32
  skill: Data Analysis & Probability
  difficulty: hard
  dok: 3
  shared_information: A spinner has 5 equal sections numbered 1 through 5. The spinner is spun twice.
  column_a: the probability that both spins land on an odd number
  column_b: 1/3
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e: null
  correct_answer: A
  distractor_types:
    B: special_case_overgeneralized
    C: magnitude_misjudged
    D: picks_D_when_determinable
  distractor_trace:
    B: treats the second spin as though a section had been used up, computing 3/5 × 2/4 and getting 3/10
    C: works out 9/25 and judges it close enough to a third to call the two equal
    D: assumes that because the outcome of a spin is random, the probability cannot be compared to a fixed
      number
  explanation: 'Three of the five sections are odd: 1, 3 and 5. So a single spin lands odd with probability
    3/5. A spinner has no memory. The second spin has the same five sections available as the first, so
    the probability that both land odd is 3/5 × 3/5, which is 9/25. Now compare 9/25 with 1/3. As decimals,
    9/25 is 0.36 and 1/3 is about 0.333, so Column A is greater and the answer is A. To compare without
    decimals, put both over 75: 9/25 is 27/75 and 1/3 is 25/75. B applies the rule for drawing objects
    and not replacing them, which is right for marbles in a bag and wrong for a spinner. C is the reason
    the item uses 1/3 rather than a distant number: 0.36 and 0.333 are close enough that eyeballing fails
    and the comparison has to be done.

    '
  source_ref:
  - PT-QR-26
  - PT-QR-31
- id: T1-Q33
  section: quantitative_reasoning
  item_type: quant_comparison
  question_number: 33
  skill: Number & Operations (Decimals, Percents, Fractions)
  difficulty: hard
  dok: 3
  shared_information: The price of a jacket is increased by 20 percent. The new price is then decreased
    by 20 percent.
  column_a: the final price of the jacket
  column_b: the original price of the jacket
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e: null
  correct_answer: B
  distractor_types:
    A: magnitude_misjudged
    C: special_case_overgeneralized
    D: picks_D_when_determinable
  distractor_trace:
    A: reasons that the rise came first and therefore counts for more
    C: treats a 20 percent rise and a 20 percent fall as operations that undo each other
    D: notes that no actual price is given and concludes the comparison depends on it
  explanation: 'Take a price of $100, since the answer will turn out not to depend on which price is chosen.
    A 20 percent increase brings it to $120. A 20 percent decrease is then taken on $120, not on $100,
    and 20 percent of 120 is $24, leaving $96. The final price is below the original, so Column B is greater
    and the answer is B. The reason is worth stating plainly: both changes are 20 percent, but the fall
    is taken on a larger amount than the rise was, so it removes more than the rise added. In every case
    the final price works out to 24/25 of the original, a loss of 4 percent. C is the intuition the item
    is built to defeat, and it is a strong one, because with addition and subtraction the two would cancel.
    Percentages do not work that way. D is the choice worth thinking hardest about, since the original
    price really is unknown. But the ratio of final to original is the same for every starting price —
    verified across several hundred values including fractions — so the comparison is settled without
    knowing it.

    '
  source_ref:
  - PT-QR-23
  - PT-QR-32
- id: T1-Q34
  section: quantitative_reasoning
  item_type: quant_comparison
  question_number: 34
  skill: Number & Operations (Decimals, Percents, Fractions)
  difficulty: medium
  dok: 3
  shared_information: null
  column_a: 3/8 of 48
  column_b: 5/12 of 36
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e: null
  correct_answer: A
  distractor_types:
    B: special_case_overgeneralized
    C: magnitude_misjudged
    D: picks_D_when_determinable
  distractor_trace:
    B: compares only the two fractions, notices that 5/12 is larger than 3/8, and stops
    C: assumes the larger fraction of the smaller number must balance the smaller fraction of the larger
      number
    D: treats two unlike fractions as not directly comparable
  explanation: 'Work out each column rather than comparing the fractions. Column A: an eighth of 48 is
    6, so three eighths is 18. Column B: a twelfth of 36 is 3, so five twelfths is 15. Column A is greater,
    so the answer is A. B is the trap, and the fraction comparison it rests on is correct as far as it
    goes: 5/12 is about 0.417 and 3/8 is 0.375, so 5/12 really is the larger fraction. But the fractions
    are taken of different amounts, and 48 is enough larger than 36 to more than make up the difference.
    A fraction on its own says nothing until you know what it is a fraction of. C assumes those two effects
    cancel, which is a reasonable guess and happens to be wrong here.

    '
  source_ref:
  - PT-QR-21
  - SQ-QR-2
- id: T1-Q35
  section: quantitative_reasoning
  item_type: quant_comparison
  question_number: 35
  skill: Geometry
  difficulty: medium
  dok: 3
  shared_information: 'The three angles of a triangle are in the ratio 2 : 3 : 4.'
  column_a: the measure of the largest angle, in degrees
  column_b: '90'
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e: null
  correct_answer: B
  distractor_types:
    A: magnitude_misjudged
    C: special_case_overgeneralized
    D: picks_D_when_determinable
  distractor_trace:
    A: assumes that the largest angle of a triangle must exceed a right angle
    C: assumes a triangle described by a ratio of this kind is a right triangle
    D: reads a ratio as leaving the actual sizes unknown
  explanation: 'A ratio does not give the angles directly, but the angle sum does the rest. The ratio
    2 : 3 : 4 means the angles are 2, 3 and 4 equal parts. That is 9 parts altogether, and the angles
    of any triangle add to 180 degrees, so one part is 180 ÷ 9, or 20 degrees. The three angles are 40,
    60 and 80 degrees. They add to 180, which checks. The largest is 80, which is less than 90, so Column
    B is greater and the answer is B. A is the assumption that a triangle''s biggest angle must be obtuse
    or right, which fails for every acute triangle, this one included. C guesses at a right triangle,
    and it is worth noting that a right triangle would need the largest part to be exactly half the total:
    a ratio like 2 : 3 : 5 would do it, but 2 : 3 : 4 does not. D underrates what a ratio plus a known
    total can pin down.

    '
  source_ref:
  - PT-QR-29
  - PT-QR-27
- id: T1-Q36
  section: quantitative_reasoning
  item_type: quant_comparison
  question_number: 36
  skill: Geometry
  difficulty: medium
  dok: 3
  shared_information: One triangle has a base of 10 centimetres and a height of 6 centimetres. A second
    triangle has a base of 12 centimetres and a height of 4 centimetres.
  column_a: the area of the first triangle
  column_b: the area of the second triangle
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e: null
  correct_answer: A
  distractor_types:
    B: magnitude_misjudged
    C: special_case_overgeneralized
    D: picks_D_when_determinable
  distractor_trace:
    B: takes the longer base as decisive and ignores the height
    C: adds base and height instead of multiplying, getting 16 for both triangles and concluding they
      are equal
    D: assumes that triangles of unstated shape cannot have their areas compared
  explanation: 'The area of a triangle is half the base times the height, and both measurements are given
    for both triangles. First triangle: half of 10 × 6, which is half of 60, or 30 square centimetres.
    Second triangle: half of 12 × 4, which is half of 48, or 24 square centimetres. Column A is greater,
    so the answer is A. C is the distractor worth studying. Adding base and height gives 16 for the first
    triangle and 16 for the second, an exact tie — which is why a student who reaches for addition finds
    a clean-looking answer and stops. The numbers were chosen so that the wrong operation produces a result
    that looks like confirmation. B assumes the base carries more weight than the height, though the formula
    treats them alike. D overlooks that base and height are all the area formula needs; the angles and
    side lengths of the triangles do not matter.

    '
  source_ref:
  - PT-QR-29
  - PT-QR-30
- id: T1-Q37
  section: quantitative_reasoning
  item_type: quant_comparison
  question_number: 37
  skill: Measurement
  difficulty: medium
  dok: 3
  shared_information: null
  column_a: the number of hours in one week
  column_b: the number of minutes in three hours
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e: null
  correct_answer: B
  distractor_types:
    A: magnitude_misjudged
    C: special_case_overgeneralized
    D: picks_D_when_determinable
  distractor_trace:
    A: reasons that a week is a far longer stretch of time than three hours, so its count must be larger
    C: expects two tidy conversions to land on the same figure
    D: treats the two quantities as measuring different things and therefore incomparable
  explanation: 'Both columns are counts, so work each one out. Column A: a week has 7 days and each day
    has 24 hours, so 7 × 24 = 168 hours. Column B: each hour has 60 minutes, so three hours have 3 × 60
    = 180 minutes. 168 is less than 180, so Column B is greater and the answer is B. A is the intuition
    the item is built against, and it is worth naming clearly. A week really is much longer than three
    hours. But the columns do not compare the two stretches of time; they compare how many units each
    contains, and the second column uses a much smaller unit. Counting a short period in small units can
    easily beat counting a long period in large ones. D mistakes a difference in units for an obstacle.
    Both columns reduce to plain numbers, and plain numbers can always be compared.

    '
  source_ref:
  - PT-QR-27
  - PT-QR-28
- id: T1-M01
  section: math_achievement
  item_type: word_problem
  question_number: 1
  skill: Algebraic Concepts
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: If x = −2, what is the value of 3x² + 4x − 1?
  choice_a: '3'
  choice_b: '5'
  choice_c: '19'
  choice_d: '27'
  choice_e: null
  correct_answer: A
  distractor_types:
    B: arithmetic_slip
    C: sign_error
    D: order_of_operations
  distractor_trace:
    B: computes 12 − 8 + 1, adding the final constant instead of subtracting it
    C: drops the sign on the middle term and computes 12 + 8 − 1
    D: squares 3x rather than x alone, computing (−6)² − 8 − 1
  explanation: 'Substitute carefully and take the terms one at a time. First term: x² means (−2) × (−2),
    which is 4, and 3 × 4 is 12. The exponent applies to x only, not to the 3 in front of it. Second term:
    4x is 4 × (−2), which is −8. Third term: subtract 1. So the value is 12 − 8 − 1, which is 3. D is
    the error worth naming: 3x² is not the same as (3x)². Without brackets the power attaches to x alone.
    C loses the negative in the middle term, which is easy to do once the first term has turned positive.
    B mishandles the last step.

    '
  source_ref:
  - PT-MA-5
  - PT-MA-22
- id: T1-M02
  section: math_achievement
  item_type: word_problem
  question_number: 2
  skill: Algebraic Concepts
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: 'Solve for y: 5(y − 2) = 3y + 8'
  choice_a: −1
  choice_b: '5'
  choice_c: '9'
  choice_d: '18'
  choice_e: null
  correct_answer: C
  distractor_types:
    A: sign_error
    B: procedure_substitution
    D: last_step_trap
  distractor_trace:
    A: combines the constants as 8 − 10 instead of 8 + 10, giving 2y = −2
    B: multiplies only the y by 5, solving 5y − 2 = 3y + 8
    D: reaches 2y = 18 and reports 18 without dividing
  explanation: 'Distribute the 5 across both terms in the bracket: 5y − 10 = 3y + 8. Subtract 3y from
    both sides: 2y − 10 = 8. Add 10 to both sides: 2y = 18, so y = 9. Check by substituting: 5(9 − 2)
    is 5 × 7, or 35, and 3(9) + 8 is 27 + 8, also 35. B forgets that the 5 multiplies everything inside
    the bracket, including the −2. A moves the −10 across the equals sign without changing its sign. D
    does all the work and stops one division short, which is why substituting the answer back is worth
    the few seconds it takes.

    '
  source_ref:
  - PT-MA-15
  - SQ-MA-3
- id: T1-M03
  section: math_achievement
  item_type: word_problem
  question_number: 3
  skill: Algebraic Concepts
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: Three less than twice a number is 17. What is the number?
  choice_a: '7'
  choice_b: '10'
  choice_c: '20'
  choice_d: '37'
  choice_e: null
  correct_answer: B
  distractor_types:
    A: sign_error
    C: last_step_trap
    D: procedure_substitution
  distractor_trace:
    A: subtracts the 3 instead of adding it, computing (17 − 3) ÷ 2
    C: adds the 3 correctly but never halves, stopping at 20
    D: applies the operations forward to 17 rather than undoing them, computing 2 × 17 + 3
  explanation: 'Write the sentence as an equation. "Twice a number" is 2n, and "three less than" that
    is 2n − 3. So 2n − 3 = 17. To undo the equation, reverse the operations in reverse order. Add 3 to
    both sides: 2n = 20. Then divide by 2: n = 10. Check: twice 10 is 20, and three less than 20 is 17.
    A is the most common slip, because the word "less" pulls toward subtracting even when the step calls
    for adding. D runs the operations in the direction the sentence describes rather than undoing them,
    which finds the wrong number entirely.

    '
  source_ref:
  - PT-MA-10
  - PT-MA-30
- id: T1-M04
  section: math_achievement
  item_type: word_problem
  question_number: 4
  skill: Algebraic Concepts
  difficulty: medium
  dok: 2
  figure_description: '[FIGURE: an input-output table with two columns headed Input and Output, and three
    rows of values: 2 and 7; 5 and 16; 8 and 25]'
  question_text: The table shows the results of applying the same rule to each input. What is the output
    when the input is 12?
  choice_a: '34'
  choice_b: '36'
  choice_c: '37'
  choice_d: '40'
  choice_e: null
  correct_answer: C
  distractor_types:
    A: wrong_setup
    B: last_step_trap
    D: arithmetic_slip
  distractor_trace:
    A: adds 3 once for each listed input beyond 8 and stops at 11, giving 25 + 9
    B: applies 3 times the input and drops the constant, giving 36
    D: adds 3 five times instead of four, giving 25 + 15
  explanation: 'Find the rule from the pattern in the table. Going from input 2 to input 5 is 3 steps,
    and the output rises from 7 to 16, a rise of 9. That is 3 per step, so the rule multiplies by 3. Now
    find the constant. If the rule were 3 times the input, an input of 2 would give 6, but the table shows
    7. So the rule is 3 times the input, plus 1. Check the other rows: 3(5) + 1 is 16, and 3(8) + 1 is
    25. Both match. For an input of 12: 3(12) + 1, which is 37. B finds the multiplier and forgets the
    constant, which is why checking a second row matters. A and D both try to extend the table by counting
    steps rather than using the rule, and miscount how many steps separate 8 from 12.

    '
  source_ref:
  - PT-MA-28
  - PT-MA-34
- id: T1-M05
  section: math_achievement
  item_type: word_problem
  question_number: 5
  skill: Algebraic Concepts
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: The first term of a sequence is 7, and each term after the first is 4 more than the term
    before it. What is the 15th term?
  choice_a: '56'
  choice_b: '60'
  choice_c: '63'
  choice_d: '67'
  choice_e: null
  correct_answer: C
  distractor_types:
    A: partial_answer
    B: wrong_setup
    D: last_step_trap
  distractor_trace:
    A: computes 14 × 4 and forgets to add the first term
    B: computes 15 × 4, using the wrong number of steps and omitting the first term
    D: adds 4 fifteen times to the first term instead of fourteen
  explanation: 'The first term is already 7 before any 4 is added. Getting from the 1st term to the 15th
    takes 14 steps, not 15 — the same reason there are 14 gaps between 15 fence posts. So the 15th term
    is 7 + 14 × 4, which is 7 + 56, or 63. Check the pattern on small cases: the 2nd term is 7 + 4 = 11,
    the 3rd is 7 + 8 = 15. In each case the number of 4s is one less than the term number. D is the off-by-one,
    and it is the error this item is built around. A and B lose the starting value, which is easy to do
    once attention shifts to the repeated addition.

    '
  source_ref:
  - PT-MA-34
  - PT-MA-42
- id: T1-M06
  section: math_achievement
  item_type: word_problem
  question_number: 6
  skill: Algebraic Concepts
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: What is the smallest whole number n for which 4n + 7 is greater than 30?
  choice_a: '6'
  choice_b: '8'
  choice_c: '23'
  choice_d: '30'
  choice_e: null
  correct_answer: A
  distractor_types:
    B: procedure_substitution
    C: partial_answer
    D: fast_pattern_match
  distractor_trace:
    B: ignores the +7 and solves 4n greater than 30, giving n greater than 7.5
    C: subtracts 7 from 30 and reports 23 without dividing
    D: repeats the number that appears in the question
  explanation: 'Subtract 7 from both sides: 4n must be greater than 23. Divide by 4: n must be greater
    than 5.75. The smallest whole number above 5.75 is 6. Always test the boundary on an inequality. With
    n = 6: 4(6) + 7 is 31, which is greater than 30. With n = 5: 4(5) + 7 is 27, which is not. So 6 is
    the smallest that works. C stops after the subtraction. B drops the 7 and lands two above the right
    answer. Note that 5.75 rounds to 6 here because the question asks for a value greater than 5.75 —
    rounding to the nearest whole number and rounding up to the next one happen to agree in this case,
    but they do not always, so it is the inequality rather than the rounding rule that decides.

    '
  source_ref:
  - PT-MA-22
  - SQ-MA-4
- id: T1-M07
  section: math_achievement
  item_type: word_problem
  question_number: 7
  skill: Algebraic Concepts
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: The formula F = 9/5 C + 32 converts a temperature from degrees Celsius to degrees Fahrenheit.
    What is 45 degrees Celsius in degrees Fahrenheit?
  choice_a: '57'
  choice_b: '77'
  choice_c: '81'
  choice_d: '113'
  choice_e: null
  correct_answer: D
  distractor_types:
    A: proportion_inversion
    B: partial_answer
    C: last_step_trap
  distractor_trace:
    A: uses 5/9 in place of 9/5, computing 25 + 32
    B: adds 32 and never multiplies
    C: multiplies by 9/5 and forgets to add 32
  explanation: 'Substitute 45 for C and follow the order of operations: multiply first, then add. Multiply:
    9/5 of 45. A fifth of 45 is 9, and nine fifths is 9 × 9, or 81. Then add 32: 81 + 32 = 113. So 45
    degrees Celsius is 113 degrees Fahrenheit. C performs the harder half of the work and stops before
    the easier half. A uses the fraction the other way up, which is the formula for converting in the
    opposite direction — a sensible check here is that Fahrenheit numbers run higher than Celsius ones
    above freezing, so an answer of 57 for 45 degrees is suspiciously close to the input. B skips the
    multiplication entirely.

    '
  source_ref:
  - PT-MA-5
  - SQ-MA-3
- id: T1-M08
  section: math_achievement
  item_type: word_problem
  question_number: 8
  skill: Algebraic Concepts
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: Which expression is equivalent to 4(2x + 3) − 3(x − 5)?
  choice_a: 5x − 3
  choice_b: 5x + 27
  choice_c: 8x + 24
  choice_d: 11x + 27
  choice_e: null
  correct_answer: B
  distractor_types:
    A: sign_error
    C: procedure_substitution
    D: arithmetic_slip
  distractor_trace:
    A: distributes the −3 as −3x − 15, then combines 12 − 15 to get −3
    C: multiplies only the constant inside the second bracket, computing 8x + 12 − 3 + 15
    D: adds the two x terms instead of subtracting, giving 8x + 3x
  explanation: 'Distribute each bracket, watching the sign in front of the second one. First bracket:
    4(2x + 3) is 8x + 12. Second bracket: the minus sign applies to the whole of 3(x − 5). Since 3(x −
    5) is 3x − 15, subtracting it gives −3x + 15. Now combine: 8x − 3x is 5x, and 12 + 15 is 27. The expression
    is 5x + 27. A is the classic sign error: subtracting a negative gives a positive, so the −15 becomes
    +15, and missing that turns 27 into −3. C forgets that the 3 multiplies the x as well as the 5. A
    quick check on any of these is to substitute a value: at x = 1 the original expression gives 4(5)
    − 3(−4), which is 20 + 12, or 32, and only 5x + 27 gives 32.

    '
  source_ref:
  - PT-MA-15
  - PT-MA-42
- id: T1-M09
  section: math_achievement
  item_type: word_problem
  question_number: 9
  skill: Algebraic Concepts
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: 'Solve for n: (3n + 4) ÷ 2 = n + 6'
  choice_a: '1'
  choice_b: '2'
  choice_c: '8'
  choice_d: '16'
  choice_e: null
  correct_answer: C
  distractor_types:
    A: procedure_substitution
    B: arithmetic_slip
    D: last_step_trap
  distractor_trace:
    A: clears the fraction on the left without multiplying the right side, solving 3n + 4 = n + 6
    B: doubles only the n on the right, solving 3n + 4 = 2n + 6
    D: solves correctly and then doubles the answer, undoing the wrong step
  explanation: 'Clear the fraction first by multiplying both sides by 2. Both sides, not just the one
    with the fraction in it. Left side: 3n + 4. Right side: 2(n + 6), which is 2n + 12. So 3n + 4 = 2n
    + 12. Subtract 2n: n + 4 = 12. Subtract 4: n = 8. Check by substituting into the original: (3 × 8
    + 4) ÷ 2 is 28 ÷ 2, or 14, and 8 + 6 is also 14. A is the error the item is built to catch — multiplying
    one side of an equation and not the other breaks the balance. B multiplies the right side only partly,
    doubling the n but not the 6. D does everything right and then applies one operation too many.

    '
  source_ref:
  - SQ-MA-4
  - PT-MA-15
- id: T1-M10
  section: math_achievement
  item_type: word_problem
  question_number: 10
  skill: Algebraic Concepts
  difficulty: medium
  dok: 3
  figure_description: null
  question_text: The sum of three consecutive even integers is 84. What is the largest of the three integers?
  choice_a: '26'
  choice_b: '28'
  choice_c: '29'
  choice_d: '30'
  choice_e: null
  correct_answer: D
  distractor_types:
    A: partial_answer
    B: arithmetic_slip
    C: procedure_substitution
  distractor_trace:
    A: solves correctly and reports the smallest of the three
    B: divides 84 by 3 to get the middle value and reports that as the largest
    C: uses consecutive integers rather than consecutive even integers, giving 27, 28 and 29
  explanation: 'Consecutive even integers go up in twos, so call them n, n + 2 and n + 4. Their sum is
    n + (n + 2) + (n + 4), which is 3n + 6. Setting that equal to 84 gives 3n = 78, so n = 26. The three
    integers are 26, 28 and 30, and they do add to 84. The largest is 30. There is a faster route worth
    knowing. In any evenly spaced set of three numbers, the middle one is the mean, so it must be 84 ÷
    3, or 28. The others sit 2 below and 2 above, giving 26 and 30. B uses that shortcut and then answers
    the wrong question, reporting the middle number as though it were the largest. C misses the word "even"
    and steps by 1 instead of 2. A reports the first value it solved for rather than the one asked about.

    '
  source_ref:
  - PT-MA-8
  - SQ-MA-3
- id: T1-M11
  section: math_achievement
  item_type: word_problem
  question_number: 11
  skill: Number & Operations (Whole Numbers)
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: What is the value of 60 − 4 × (7 − 3)² ÷ 8?
  choice_a: '40'
  choice_b: '52'
  choice_c: '58'
  choice_d: '112'
  choice_e: null
  correct_answer: B
  distractor_types:
    A: wrong_formula
    C: procedure_substitution
    D: order_of_operations
  distractor_trace:
    A: expands the squared bracket as 7² − 3², giving 40 in place of 16
    C: ignores the exponent and treats (7 − 3)² as 4
    D: works strictly left to right, computing (60 − 4) × 16 ÷ 8
  explanation: 'Follow the order of operations: brackets first, then the exponent, then multiplication
    and division from left to right, and subtraction last. Brackets: 7 − 3 is 4. Exponent: 4² is 16. Multiply
    and divide, left to right: 4 × 16 is 64, and 64 ÷ 8 is 8. Subtract: 60 − 8 is 52. A makes an error
    worth naming clearly. Squaring a difference is not the same as subtracting the squares: (7 − 3)² is
    16, while 7² − 3² is 40. The bracket has to be evaluated before the power is applied. D ignores the
    hierarchy entirely and reads the expression like a sentence, which is the single most common source
    of error on this kind of item.

    '
  source_ref:
  - PT-MA-12
  - PT-MA-19
- id: T1-M12
  section: math_achievement
  item_type: word_problem
  question_number: 12
  skill: Number & Operations (Whole Numbers)
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: Two lighthouses flash at regular intervals. One flashes every 12 seconds and the other
    every 18 seconds. If they flash together at midnight, how many seconds later will they next flash
    together?
  choice_a: '6'
  choice_b: '30'
  choice_c: '36'
  choice_d: '216'
  choice_e: null
  correct_answer: C
  distractor_types:
    A: wrong_formula
    B: procedure_substitution
    D: last_step_trap
  distractor_trace:
    A: finds the greatest common factor instead of the least common multiple
    B: adds the two intervals
    D: multiplies the two intervals without reducing to the least common multiple
  explanation: 'The lighthouses flash together at any time that is a multiple of both 12 and 18, so the
    next one is the least common multiple. List the multiples: 12, 24, 36, 48 and 18, 36, 54. The first
    number in both lists is 36. Check: 36 ÷ 12 is 3 flashes for the first lighthouse and 36 ÷ 18 is 2
    flashes for the second, so both land on 36 seconds. No smaller number does. D is the tempting shortcut.
    Multiplying gives 216, which is a common multiple — both lighthouses do flash together then — but
    it is not the first one, and the question asks for the next. A reaches for the other common operation
    on a pair of numbers; the greatest common factor answers a different kind of question, about dividing
    things up rather than about when cycles meet.

    '
  source_ref:
  - PT-MA-19
  - PT-MA-25
- id: T1-M13
  section: math_achievement
  item_type: word_problem
  question_number: 13
  skill: Number & Operations (Whole Numbers)
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: What is the greatest prime factor of 210?
  choice_a: '7'
  choice_b: '21'
  choice_c: '42'
  choice_d: '105'
  choice_e: null
  correct_answer: A
  distractor_types:
    B: procedure_substitution
    C: wrong_setup
    D: last_step_trap
  distractor_trace:
    B: finds a factor of 210 and reports it without testing whether it is prime
    C: reaches for a large factor on the assumption that greatest means biggest factor
    D: halves 210 and stops at 105, which is a factor but not a prime one
  explanation: 'Break 210 down into primes. It is even, so 210 = 2 × 105. Then 105 = 3 × 35, and 35 =
    5 × 7. So 210 = 2 × 3 × 5 × 7, and every one of those four is prime. The greatest of them is 7. All
    three wrong answers are genuine factors of 210, which is what makes them tempting: 21, 42 and 105
    all divide it exactly. None of them is prime. 21 is 3 × 7, 42 is 2 × 3 × 7, and 105 is 3 × 5 × 7.
    The word doing the work in this question is "prime." Asked for the greatest factor, 105 would be a
    reasonable answer to reach for. Asked for the greatest prime factor, the search stops at the largest
    number in the prime breakdown, and prime numbers here are small.

    '
  source_ref:
  - PT-MA-25
  - PT-MA-31
- id: T1-M14
  section: math_achievement
  item_type: word_problem
  question_number: 14
  skill: Number & Operations (Whole Numbers)
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: The number 6,748 is rounded to the nearest hundred and also rounded to the nearest thousand.
    What is the difference between the two rounded values?
  choice_a: '48'
  choice_b: '52'
  choice_c: '252'
  choice_d: '300'
  choice_e: null
  correct_answer: D
  distractor_types:
    A: partial_answer
    B: arithmetic_slip
    C: wrong_setup
  distractor_trace:
    A: reports the part of the number below the hundred, 6,748 − 6,700
    B: measures the distance up to 6,800 instead of down to 6,700
    C: measures from the original number to the nearest thousand rather than between the two rounded values
  explanation: 'Do the two roundings separately, then compare them. To the nearest hundred: the digits
    after the hundreds place are 48, which is below 50, so the number rounds down to 6,700. To the nearest
    thousand: the digits after the thousands place are 748, which is 500 or more, so the number rounds
    up to 7,000. The difference is 7,000 − 6,700, which is 300. The item turns on the two roundings going
    in opposite directions, which is why it is worth doing each one from its own digit rather than assuming
    both go the same way. B rounds the hundred up, as though 48 were 50 or more. C compares the original
    number with one of the rounded values instead of comparing the two rounded values with each other.

    '
  source_ref:
  - PT-MA-2
  - PT-MA-12
- id: T1-M15
  section: math_achievement
  item_type: word_problem
  question_number: 15
  skill: Number & Operations (Whole Numbers)
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: A school needs to transport 197 students. Each bus holds 45 students. What is the least
    number of buses needed to carry all the students?
  choice_a: '4'
  choice_b: '5'
  choice_c: '17'
  choice_d: '45'
  choice_e: null
  correct_answer: B
  distractor_types:
    A: last_step_trap
    C: partial_answer
    D: fast_pattern_match
  distractor_trace:
    A: divides and rounds down, leaving 17 students behind
    C: reports the remainder rather than the number of buses
    D: repeats the bus capacity given in the question
  explanation: 'Divide 197 by 45. Four buses hold 4 × 45, which is 180 students. That leaves 197 − 180,
    or 17 students with no seat. Those 17 still have to travel, so a fifth bus is needed. Five buses hold
    225 seats, more than enough. The answer is 5. A is the error this item exists to catch. Division gives
    4 remainder 17, and in most arithmetic the remainder is set aside — but when the remainder is people,
    it needs a bus of its own. The question asks for the least number that works, so the answer always
    rounds up whenever anything is left over, however small. C answers with the remainder itself, which
    is a real number in the working but not what was asked.

    '
  source_ref:
  - PT-MA-2
  - PT-MA-31
- id: T1-M16
  section: math_achievement
  item_type: word_problem
  question_number: 16
  skill: Number & Operations (Whole Numbers)
  difficulty: medium
  dok: 1
  figure_description: null
  question_text: What is the value of the digit 6 in the number 3,624,905?
  choice_a: '6'
  choice_b: '600'
  choice_c: 60,000
  choice_d: 600,000
  choice_e: null
  correct_answer: D
  distractor_types:
    A: partial_answer
    B: wrong_setup
    C: arithmetic_slip
  distractor_trace:
    A: reports the digit itself rather than the value it stands for
    B: reads the 6 as occupying the hundreds place
    C: lands one place short, at ten thousands rather than hundred thousands
  explanation: 'Name the places from the right: 5 is ones, 0 is tens, 9 is hundreds, 4 is thousands, 2
    is ten thousands, 6 is hundred thousands, and 3 is millions. The 6 sits in the hundred thousands place,
    so its value is 6 × 100,000, which is 600,000. A useful check is to read the number aloud: three million,
    six hundred twenty-four thousand, nine hundred five. The "six hundred" in that reading belongs to
    the thousands, which is 600,000. C is the near miss and comes from counting the places one short.
    Counting from the right rather than the left avoids it, since the places have fixed names in that
    direction.

    '
  source_ref:
  - PT-MA-2
  - PT-MA-12
- id: T1-M17
  section: math_achievement
  item_type: word_problem
  question_number: 17
  skill: Number & Operations (Whole Numbers)
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: What is the greatest common factor of 84 and 126?
  choice_a: '42'
  choice_b: '84'
  choice_c: '126'
  choice_d: '252'
  choice_e: null
  correct_answer: A
  distractor_types:
    B: partial_answer
    C: fast_pattern_match
    D: wrong_formula
  distractor_trace:
    B: reports one of the two given numbers without checking that it divides the other
    C: reports the larger of the two given numbers
    D: finds the least common multiple instead of the greatest common factor
  explanation: 'Break both numbers into primes. 84 is 2 × 2 × 3 × 7. 126 is 2 × 3 × 3 × 7. The factors
    they share are one 2, one 3 and one 7, and 2 × 3 × 7 is 42. Check: 84 ÷ 42 is 2 and 126 ÷ 42 is 3,
    so 42 divides both exactly, and nothing larger does. B is worth testing rather than assuming: 84 divides
    84, but 126 ÷ 84 is not a whole number, so 84 is not a common factor at all. D confuses the two standard
    operations on a pair of numbers. A quick sanity check separates them: a common factor must be no larger
    than the smaller number, while a common multiple must be at least as large as the larger one. Since
    252 is bigger than both, it cannot be a factor of either.

    '
  source_ref:
  - PT-MA-19
  - PT-MA-25
- id: T1-M18
  section: math_achievement
  item_type: word_problem
  question_number: 18
  skill: Number & Operations (Whole Numbers)
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: A factory packs 24 jars into each box and 15 boxes into each crate. How many jars are
    in 7 crates?
  choice_a: '360'
  choice_b: 2,520
  choice_c: 2,880
  choice_d: 25,200
  choice_e: null
  correct_answer: B
  distractor_types:
    A: partial_answer
    C: wrong_setup
    D: arithmetic_slip
  distractor_trace:
    A: works out the jars in a single crate and stops at 360
    C: multiplies by 8 crates instead of 7
    D: misplaces a digit, giving a result ten times too large
  explanation: 'Build up one layer at a time. One crate holds 15 boxes, and each box holds 24 jars, so
    one crate holds 15 × 24, which is 360 jars. Seven crates hold 7 × 360, which is 2,520 jars. A does
    the harder multiplication and stops before the easy one, which is why it is the most attractive wrong
    answer here — the student has done most of the work. A useful estimate guards against D: 24 is roughly
    25 and 15 × 7 is 105, so the answer should be near 25 × 105, or about 2,600. That rules out 25,200
    immediately.

    '
  source_ref:
  - PT-MA-12
  - PT-MA-31
- id: T1-M19
  section: math_achievement
  item_type: word_problem
  question_number: 19
  skill: Number & Operations (Whole Numbers)
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: How many whole numbers between 100 and 200 are multiples of 7?
  choice_a: '14'
  choice_b: '15'
  choice_c: '28'
  choice_d: '100'
  choice_e: null
  correct_answer: A
  distractor_types:
    B: last_step_trap
    C: partial_answer
    D: fast_pattern_match
  distractor_trace:
    B: adds one too many when counting the run of multiples
    C: counts every multiple of 7 up to 200 without excluding those below 100
    D: repeats a number from the question
  explanation: 'Find the first and last multiples of 7 in the range. 7 × 15 is 105, which is the first
    one above 100. 7 × 28 is 196, which is the last one below 200. So the multiples run from the 15th
    to the 28th, and the count is 28 − 15 + 1, which is 14. Adding the 1 matters, because both ends are
    being counted. A smaller version makes it clear: from the 3rd multiple to the 5th is 3 numbers, not
    2. C counts all 28 multiples of 7 up to 200 and forgets to remove the 14 that fall below 100. Those
    two counts, 14 and 14, happening to match is a coincidence of this particular range, not a rule.

    '
  source_ref:
  - PT-MA-25
  - PT-MA-31
- id: T1-M20
  section: math_achievement
  item_type: word_problem
  question_number: 20
  skill: Number & Operations (Decimals, Percents, Fractions)
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: What is the value of 4.5 − 0.6 × 2.5?
  choice_a: '3'
  choice_b: '4.35'
  choice_c: '9.75'
  choice_d: '11.25'
  choice_e: null
  correct_answer: A
  distractor_types:
    B: arithmetic_slip
    C: order_of_operations
    D: wrong_setup
  distractor_trace:
    B: multiplies correctly but misplaces the decimal point, treating 0.6 × 2.5 as 0.15
    C: works left to right, computing (4.5 − 0.6) × 2.5
    D: ignores the 0.6 and multiplies 4.5 by 2.5
  explanation: 'Multiplication comes before subtraction, so deal with 0.6 × 2.5 first. To multiply decimals,
    multiply as whole numbers and then count the decimal places: 6 × 25 is 150, and there are two decimal
    places altogether, one in each factor, so the answer is 1.50. Then subtract: 4.5 − 1.5 is 3. C is
    the most common error and comes from reading the expression from left to right like a sentence. B
    gets the digits right and the decimal point wrong, which is worth guarding against by estimating first:
    0.6 is a little over a half, and a little over half of 2.5 should be around 1.5, not 0.15.

    '
  source_ref:
  - PT-MA-6
  - PT-MA-18
- id: T1-M21
  section: math_achievement
  item_type: word_problem
  question_number: 21
  skill: Number & Operations (Decimals, Percents, Fractions)
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: A jacket costs $85. The store adds a sales tax of 8 percent. What is the total cost of
    the jacket?
  choice_a: $6.80
  choice_b: $78.20
  choice_c: $85.00
  choice_d: $91.80
  choice_e: null
  correct_answer: D
  distractor_types:
    A: partial_answer
    B: sign_error
    C: fast_pattern_match
  distractor_trace:
    A: works out the tax and reports it instead of the total
    B: subtracts the tax from the price instead of adding it
    C: repeats the price given in the question
  explanation: 'Find the tax, then add it on. One percent of $85 is $0.85, so 8 percent is 8 × 0.85, which
    is $6.80. The total is 85 + 6.80, which is $91.80. A quicker route is to notice that the total is
    108 percent of the price, so 1.08 × 85 = 91.80, which gives the same answer in one step. A stops at
    the tax, which is a real intermediate figure. B moves the tax the wrong way — tax is added to what
    a customer pays, never taken off. A sanity check catches both: the total has to be a bit more than
    $85, which rules out every option except $91.80.

    '
  source_ref:
  - PT-MA-6
  - PT-MA-40
- id: T1-M22
  section: math_achievement
  item_type: word_problem
  question_number: 22
  skill: Number & Operations (Decimals, Percents, Fractions)
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: A recipe calls for 3/4 cup of milk. Nina makes only 2/3 of the recipe. How much milk
    does she use?
  choice_a: 1/12 cup
  choice_b: 1/2 cup
  choice_c: 9/8 cups
  choice_d: 17/12 cups
  choice_e: null
  correct_answer: B
  distractor_types:
    A: procedure_substitution
    C: proportion_inversion
    D: wrong_setup
  distractor_trace:
    A: subtracts the two fractions
    C: divides 3/4 by 2/3
    D: adds the two fractions
  explanation: 'Taking a fraction "of" another amount means multiplying. Two thirds of 3/4 is 2/3 × 3/4.
    Multiply the numerators and the denominators: 6/12, which simplifies to 1/2 cup. There is a check
    available before any arithmetic. Nina is making less than the full recipe, so she must use less than
    3/4 cup. That rules out both 9/8 and 17/12 immediately, since each is more than one cup. And 1/12
    is far too small, since she is making most of the recipe rather than a twelfth of it. C is the error
    worth naming: dividing by a fraction less than 1 makes a number bigger, which is the opposite of what
    taking a part of something should do.

    '
  source_ref:
  - PT-MA-18
  - PT-MA-40
- id: T1-M23
  section: math_achievement
  item_type: word_problem
  question_number: 23
  skill: Number & Operations (Decimals, Percents, Fractions)
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: Which of the following has the greatest value?
  choice_a: 1/3
  choice_b: 3/8
  choice_c: 2/5
  choice_d: 5/12
  choice_e: null
  correct_answer: D
  distractor_types:
    A: wrong_setup
    B: estimation_failure
    C: fast_pattern_match
  distractor_trace:
    A: picks the fraction with the smallest denominator, assuming that makes it largest
    B: compares by eye without converting and settles on a middle value
    C: recognises 2/5 as 0.4 and assumes a familiar decimal must be the largest
  explanation: 'Convert each fraction to a decimal, or put them all over a common denominator. As decimals:
    1/3 is about 0.333, 3/8 is 0.375, 2/5 is 0.4, and 5/12 is about 0.417. The greatest is 5/12. Over
    a common denominator of 120: 1/3 is 40/120, 3/8 is 45/120, 2/5 is 48/120, and 5/12 is 50/120. The
    order is the same. A applies a rule that works only when the numerators match. With 1/3 against 1/12
    the smaller denominator does win, but these numerators are all different, so the rule does not apply.
    C is the subtle one: 2/5 converts to a clean 0.4, which makes it feel like a landmark value, and 5/12
    is only a little above it.

    '
  source_ref:
  - PT-MA-18
  - PT-MA-6
- id: T1-M24
  section: math_achievement
  item_type: word_problem
  question_number: 24
  skill: Number & Operations (Decimals, Percents, Fractions)
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: The membership of a club rose from 200 to 250. By what percent did the membership increase?
  choice_a: 20 percent
  choice_b: 25 percent
  choice_c: 50 percent
  choice_d: 125 percent
  choice_e: null
  correct_answer: B
  distractor_types:
    A: proportion_inversion
    C: partial_answer
    D: last_step_trap
  distractor_trace:
    A: divides the increase by the new membership rather than the original
    C: reports the raw increase as though it were already a percentage
    D: expresses the new membership as a percent of the old rather than the increase
  explanation: 'A percent increase compares the change with the starting amount. The increase is 250 −
    200, which is 50 members. As a fraction of the original: 50/200, which is 1/4, or 25 percent. A is
    the error this item is built around, and it is easy to make because both 200 and 250 are sitting in
    the question. The denominator has to be where the change started from. Dividing by 250 answers a different
    question: what percent of the new membership the growth represents. D computes 250/200, which is 125
    percent — a true statement about the new size relative to the old, but the question asks by how much
    it increased, and that is the extra 25 percent. C forgets to divide at all.

    '
  source_ref:
  - PT-MA-40
  - PT-MA-6
- id: T1-M25
  section: math_achievement
  item_type: word_problem
  question_number: 25
  skill: Number & Operations (Decimals, Percents, Fractions)
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: A 2.5-litre bottle of juice costs $4.50. What is the cost per litre?
  choice_a: $1.80
  choice_b: $2.25
  choice_c: $4.50
  choice_d: $11.25
  choice_e: null
  correct_answer: A
  distractor_types:
    B: estimation_failure
    C: fast_pattern_match
    D: proportion_inversion
  distractor_trace:
    B: rounds 2.5 litres down to 2 and divides by that
    C: repeats the price given in the question
    D: multiplies the price by the volume instead of dividing
  explanation: 'Cost per litre means the total cost shared out over the number of litres, so divide. 4.50
    ÷ 2.5. Multiplying both numbers by 10 clears the decimals without changing the answer: 45 ÷ 25, which
    is 1.8. So the juice costs $1.80 per litre. Check by working forwards: 1.80 × 2.5 is 4.50, which matches
    the price given. D is the standard trap on rate questions. A quick estimate settles it: the bottle
    holds more than one litre and costs $4.50 altogether, so one litre has to cost less than $4.50. That
    rules out C and D before any division is done.

    '
  source_ref:
  - PT-MA-6
  - PT-MA-18
- id: T1-M26
  section: math_achievement
  item_type: word_problem
  question_number: 26
  skill: Number & Operations (Decimals, Percents, Fractions)
  difficulty: hard
  dok: 2
  figure_description: null
  question_text: A board is 5 1/4 feet long. A piece 2 2/3 feet long is cut from it. How long is the remaining
    piece?
  choice_a: 2 5/12 feet
  choice_b: 2 7/12 feet
  choice_c: 3 feet
  choice_d: 3 5/12 feet
  choice_e: null
  correct_answer: B
  distractor_types:
    A: arithmetic_slip
    C: wrong_setup
    D: sign_error
  distractor_trace:
    A: converts 2 2/3 to 34/12 instead of 32/12 when finding a common denominator
    C: subtracts the whole numbers and ignores the fractions entirely
    D: subtracts the smaller fraction from the larger regardless of order, computing 3 + (2/3 − 1/4)
  explanation: 'Turn both mixed numbers into improper fractions so the borrowing takes care of itself.
    5 1/4 is 21/4, and 2 2/3 is 8/3. Put them over a common denominator of 12: 21/4 is 63/12, and 8/3
    is 32/12. Subtract: 63/12 − 32/12 is 31/12, which is 2 and 7/12 feet. D is the most instructive error.
    Splitting the problem into whole numbers and fractions gives 3 and then 1/4 − 2/3, which is negative
    — and rather than borrow, a student flips the subtraction to make it come out positive. That turns
    a shortfall into a surplus and lands 5/6 of a foot too high. Working with improper fractions avoids
    the situation entirely. A quick estimate confirms the answer: 5 1/4 is about 5.25 and 2 2/3 is about
    2.67, so the remainder should be a bit under 2.6.

    '
  source_ref:
  - PT-MA-18
  - PT-MA-40
- id: T1-M27
  section: math_achievement
  item_type: word_problem
  question_number: 27
  skill: Number & Operations (Decimals, Percents, Fractions)
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: A bicycle originally priced at $240 is on sale at 35 percent off. How much money does
    a buyer save?
  choice_a: $84
  choice_b: $156
  choice_c: $205
  choice_d: $324
  choice_e: null
  correct_answer: A
  distractor_types:
    B: partial_answer
    C: procedure_substitution
    D: sign_error
  distractor_trace:
    B: computes the sale price rather than the saving
    C: subtracts 35 dollars instead of 35 percent
    D: adds 35 percent instead of taking it off
  explanation: 'The saving is the discount itself, so find 35 percent of $240. Ten percent of 240 is 24,
    so 30 percent is 72. Five percent is half of 24, which is 12. Adding those gives 72 + 12, or $84.
    The buyer saves $84, and would pay 240 − 84, or $156. B is the trap, and it is the more natural quantity
    to compute — most discount questions ask for the price paid. This one asks what is saved, so the answer
    is the part taken off rather than the part left. Reading the final sentence twice is what separates
    the two. C treats a percentage as a dollar amount, and D moves the price in the wrong direction, giving
    a sale price higher than the original.

    '
  source_ref:
  - PT-MA-40
  - PT-MA-6
- id: T1-M28
  section: math_achievement
  item_type: word_problem
  question_number: 28
  skill: Number & Operations (Decimals, Percents, Fractions)
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: What is 3/4 of 2/5 of 120?
  choice_a: '18'
  choice_b: '24'
  choice_c: '36'
  choice_d: '48'
  choice_e: null
  correct_answer: C
  distractor_types:
    A: wrong_setup
    B: arithmetic_slip
    D: partial_answer
  distractor_trace:
    A: takes 3/4 of 24 rather than of 48
    B: computes 1/5 of 120 instead of 2/5
    D: works out 2/5 of 120 and stops there
  explanation: 'Work from the inside out. First, 2/5 of 120. A fifth of 120 is 24, so two fifths is 48.
    Then 3/4 of 48. A quarter of 48 is 12, so three quarters is 36. The answer is 36. The order does not
    matter here, which makes a useful check: 3/4 of 120 is 90, and 2/5 of 90 is 36 as well. Multiplying
    the fractions first gives the same result, since 3/4 × 2/5 is 6/20, or 3/10, and 3/10 of 120 is 36.
    D is the most common wrong answer, because 48 is a real step in the working and the question has two
    stages where a reader might expect one.

    '
  source_ref:
  - PT-MA-18
  - PT-MA-40
- id: T1-M29
  section: math_achievement
  item_type: word_problem
  question_number: 29
  skill: Data Analysis & Probability
  difficulty: hard
  dok: 3
  figure_description: null
  question_text: The heights of five plants, in centimetres, are 12, 18, 9, 15, and 21. A sixth plant
    is added to the group, and the range of the six heights is 17 centimetres. What is the greatest possible
    height of the sixth plant, in centimetres?
  choice_a: '4'
  choice_b: '5'
  choice_c: '21'
  choice_d: '26'
  choice_e: null
  correct_answer: D
  distractor_types:
    A: partial_answer
    B: arithmetic_slip
    C: fast_pattern_match
  distractor_trace:
    A: finds the other value that produces a range of 17 and reports the least rather than the greatest
    B: subtracts 16 from 21 instead of working from the correct endpoint
    C: reports the tallest plant already in the group
  explanation: 'Range is the tallest minus the shortest. At present the plants run from 9 to 21, a range
    of 12. Adding a sixth plant can only widen that range, and it must widen it to exactly 17. There are
    two ways to do it. Make the new plant the shortest: if the tallest stays 21, the shortest must be
    21 − 17, or 4. Make the new plant the tallest: if the shortest stays 9, the tallest must be 9 + 17,
    or 26. Both work, so the sixth plant could be 4 or 26. The question asks for the greatest, so 26.
    A is the strongest distractor precisely because it is correct arithmetic answering the other half
    of the question. Both endpoints have to be found before the question can be answered, and then the
    right one chosen. Note that no height between 4 and 26 works: any value inside the current spread
    leaves the range at 12.

    '
  source_ref:
  - PT-MA-7
  - PT-MA-23
- id: T1-M30
  section: math_achievement
  item_type: word_problem
  question_number: 30
  skill: Data Analysis & Probability
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: 'Six students scored the following points: 14, 9, 22, 17, 11, 20. What is the median
    score?'
  choice_a: '14'
  choice_b: '15.5'
  choice_c: '17'
  choice_d: '19.5'
  choice_e: null
  correct_answer: B
  distractor_types:
    A: last_step_trap
    C: arithmetic_slip
    D: wrong_setup
  distractor_trace:
    A: sorts correctly and reports the third value alone
    C: sorts correctly and reports the fourth value alone
    D: averages the two middle numbers of the unsorted list, 22 and 17
  explanation: 'Put the scores in order first: 9, 11, 14, 17, 20, 22. With six values there is no single
    middle one. The two in the middle are the third and fourth, which are 14 and 17. The median is their
    average: (14 + 17) ÷ 2, which is 15.5. D is the error that matters most, and it is the reason sorting
    comes first. In the original list the two middle entries are 22 and 17, which average to 19.5 — a
    number that is not the median of anything. A and C sort correctly but stop before averaging, which
    works for an odd number of values and fails for an even one. A median need not be one of the values
    in the list, and with an even count it usually is not.

    '
  source_ref:
  - PT-MA-23
  - PT-MA-7
- id: T1-M31
  section: math_achievement
  item_type: word_problem
  question_number: 31
  skill: Data Analysis & Probability
  difficulty: hard
  dok: 3
  figure_description: null
  question_text: 'A team scored the following numbers of goals in seven games: 1, 2, 2, 4, 7, 7, 7. What
    is the difference between the mode and the median of these numbers?'
  choice_a: '2'
  choice_b: '3'
  choice_c: '4'
  choice_d: '7'
  choice_e: null
  correct_answer: B
  distractor_types:
    A: wrong_setup
    C: partial_answer
    D: fast_pattern_match
  distractor_trace:
    A: takes 2 as the mode because it also repeats, without comparing how often each value occurs
    C: reports the median and stops
    D: reports the mode and stops
  explanation: 'Two different measures are needed, so find each separately. The mode is the value that
    appears most often. Here 2 appears twice and 7 appears three times, so the mode is 7. The median is
    the middle value. The list is already in order and has seven entries, so the middle is the fourth:
    4. The difference is 7 − 4, which is 3. A is a real trap rather than a slip. The list has two repeated
    values, and a student who notices 2 repeating may settle on it without checking that 7 repeats more
    often. C and D each compute half the item correctly and then answer with that half, which is worth
    guarding against on any question that asks for a difference between two statistics.

    '
  source_ref:
  - PT-MA-23
  - PT-MA-38
- id: T1-M32
  section: math_achievement
  item_type: word_problem
  question_number: 32
  skill: Data Analysis & Probability
  difficulty: medium
  dok: 2
  figure_description: '[FIGURE: a bar graph titled Books Read This Month, with four vertical bars labelled
    along the horizontal axis and a vertical scale marked in units of 1 from 0 to 16. The bars are Ana
    12, Ben 8, Cara 15, Dev 9]'
  question_text: According to the graph, how many more books did Ana and Cara read together than Ben and
    Dev read together?
  choice_a: '3'
  choice_b: '7'
  choice_c: '9'
  choice_d: '10'
  choice_e: null
  correct_answer: D
  distractor_types:
    A: wrong_setup
    B: arithmetic_slip
    C: fast_pattern_match
  distractor_trace:
    A: compares Cara with Ana instead of comparing the two pairs
    B: compares Cara with Ben, the largest bar against the smallest
    C: reports one of the values read from the graph
  explanation: 'Read each bar, then combine before comparing. Ana read 12 and Cara read 15, so together
    they read 27. Ben read 8 and Dev read 9, so together they read 17. The difference is 27 − 17, which
    is 10. A and B both compare two individual bars rather than the two pairs the question names. The
    wording matters here: "Ana and Cara together" is a single quantity, and so is "Ben and Dev together,"
    so the comparison is between two sums rather than between two readers. A useful check is that all
    four values add to 44, and 27 + 17 does equal 44.

    '
  source_ref:
  - PT-MA-14
  - PT-MA-38
- id: T1-M33
  section: math_achievement
  item_type: word_problem
  question_number: 33
  skill: Data Analysis & Probability
  difficulty: medium
  dok: 2
  figure_description: '[FIGURE: a two-column table headed Day and Number of Students, with four rows:
    Monday 24; Tuesday 30; Wednesday 27; Thursday 19]'
  question_text: The table shows how many students attended an after-school club on each of four days.
    What was the mean number of students per day?
  choice_a: '24'
  choice_b: '24.5'
  choice_c: '25'
  choice_d: '100'
  choice_e: null
  correct_answer: C
  distractor_types:
    A: fast_pattern_match
    B: arithmetic_slip
    D: partial_answer
  distractor_trace:
    A: reports the first value in the table
    B: adds the four numbers as 98 rather than 100, then divides
    D: reports the total attendance instead of the mean
  explanation: 'A mean is the total divided by how many values there are. Add the four days: 24 + 30 is
    54, plus 27 is 81, plus 19 is 100. Divide by 4: the mean is 25 students per day. D is the most attractive
    wrong answer because 100 is a real figure in the working and a round one. A mean has to sit inside
    the range of the data, between 19 and 30 here, which rules out 100 at a glance and is worth checking
    on every mean question. B shows why adding twice is worth the time; a single-unit slip in the total
    shifts the mean by a quarter of a student, which looks plausible enough to pass unnoticed.

    '
  source_ref:
  - PT-MA-14
  - PT-MA-23
- id: T1-M34
  section: math_achievement
  item_type: word_problem
  question_number: 34
  skill: Data Analysis & Probability
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: A number cube has faces numbered 1 through 6. The cube is rolled once. What is the probability
    that the number rolled is NOT a multiple of 3?
  choice_a: 1/3
  choice_b: 1/2
  choice_c: 2/3
  choice_d: 5/6
  choice_e: null
  correct_answer: C
  distractor_types:
    A: partial_answer
    B: wrong_setup
    D: arithmetic_slip
  distractor_trace:
    A: answers for the numbers that are multiples of 3
    B: counts three faces as multiples of 3
    D: rules out only one face rather than two
  explanation: 'List the faces: 1, 2, 3, 4, 5, 6. The multiples of 3 among them are 3 and 6, which is
    two faces. That leaves 1, 2, 4 and 5, which is four faces out of six. The probability is 4/6, or 2/3.
    There is a shortcut worth knowing. The probability of something not happening is 1 minus the probability
    that it does. Here that is 1 − 2/6, which is 4/6, or 2/3 again. A is the trap the capitalised NOT
    is guarding against, and it is the most common wrong answer on complement questions: the student computes
    correctly and answers the opposite question. D forgets that 6 is a multiple of 3 as well as 3 itself.

    '
  source_ref:
  - PT-MA-38
  - PT-MA-14
- id: T1-M35
  section: math_achievement
  item_type: word_problem
  question_number: 35
  skill: Data Analysis & Probability
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: A café offers 4 kinds of sandwich, 3 kinds of soup, and 2 kinds of drink. How many different
    meals consisting of one sandwich, one soup, and one drink are possible?
  choice_a: '9'
  choice_b: '12'
  choice_c: '14'
  choice_d: '24'
  choice_e: null
  correct_answer: D
  distractor_types:
    A: wrong_setup
    B: partial_answer
    C: arithmetic_slip
  distractor_trace:
    A: adds the three counts instead of multiplying
    B: multiplies sandwiches by soups and forgets the drinks
    C: multiplies the first two and then adds the third
  explanation: 'Each choice is made independently, so the counts multiply. For every one of the 4 sandwiches
    there are 3 soups, giving 12 sandwich-and-soup pairs. For every one of those 12 pairs there are 2
    drinks, giving 24 complete meals. So 4 × 3 × 2, which is 24. A is the error worth naming: adding gives
    9, which is fewer meals than the 12 pairings that exist before drinks are even considered, and that
    impossibility is a signal the method is wrong. Multiplying is right whenever one choice does not restrict
    another. A smaller version makes the structure visible: with 2 sandwiches and 2 soups there are 4
    combinations, not 4 items.

    '
  source_ref:
  - PT-MA-38
  - PT-MA-7
- id: T1-M36
  section: math_achievement
  item_type: word_problem
  question_number: 36
  skill: Data Analysis & Probability
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: The mean of four test scores is 82. Three of the scores are 78, 85, and 91. What is the
    fourth score?
  choice_a: '74'
  choice_b: '82'
  choice_c: '85'
  choice_d: '254'
  choice_e: null
  correct_answer: A
  distractor_types:
    B: fast_pattern_match
    C: estimation_failure
    D: partial_answer
  distractor_trace:
    B: reports the mean as though it were the missing value
    C: averages only the three given scores, about 84.7, and rounds to 85
    D: reports the total of the three given scores
  explanation: 'Turn the mean back into a total. Four scores averaging 82 must add to 4 × 82, which is
    328. The three known scores add to 78 + 85 + 91, which is 254. The fourth score is 328 − 254, which
    is 74. Check: 78 + 85 + 91 + 74 is 328, and 328 ÷ 4 is 82. C is the sharpest distractor here for two
    reasons. The three given scores average about 84.7, which rounds to 85, and 85 is also one of the
    scores printed in the question, so it looks familiar twice over. B assumes the missing value must
    equal the mean, which is only true when the other values already average to it — and here they average
    above 82, so the fourth score has to pull downward.

    '
  source_ref:
  - PT-MA-23
  - PT-MA-14
- id: T1-M37
  section: math_achievement
  item_type: word_problem
  question_number: 37
  skill: Data Analysis & Probability
  difficulty: hard
  dok: 3
  figure_description: null
  question_text: A bag contains 20 tiles numbered 1 through 20. One tile is drawn at random. What is the
    probability that the number on the tile is a multiple of 4 or a multiple of 5?
  choice_a: 1/4
  choice_b: 2/5
  choice_c: 9/20
  choice_d: 1/2
  choice_e: null
  correct_answer: B
  distractor_types:
    A: partial_answer
    C: wrong_setup
    D: arithmetic_slip
  distractor_trace:
    A: counts the multiples of 4 only
    C: adds the two counts without noticing that 20 belongs to both
    D: arrives at a count of 10 tiles
  explanation: 'List each set. Multiples of 4 up to 20: 4, 8, 12, 16, 20 — that is 5 tiles. Multiples
    of 5 up to 20: 5, 10, 15, 20 — that is 4 tiles. Adding gives 9, but 20 appears in both lists and has
    been counted twice. There is only one tile numbered 20, so subtract the repeat: 5 + 4 − 1, which is
    8 tiles. The probability is 8 out of 20, which simplifies to 2/5. C is the answer this item is built
    to catch, and the only way to avoid it is to write both lists out and look for shared numbers. A number
    counted twice must be removed once — not removed entirely, since 20 does qualify. Listing the eight
    winning tiles confirms the count: 4, 5, 8, 10, 12, 15, 16, 20.

    '
  source_ref:
  - PT-MA-38
  - PT-MA-23
- id: T1-M38
  section: math_achievement
  item_type: word_problem
  question_number: 38
  skill: Measurement
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: A train leaves a station at 9:50 a.m. The journey takes 3 hours and 40 minutes. At what
    time does the train arrive?
  choice_a: 12:10 p.m.
  choice_b: 12:30 p.m.
  choice_c: 1:30 p.m.
  choice_d: 3:30 p.m.
  choice_e: null
  correct_answer: C
  distractor_types:
    A: sign_error
    B: arithmetic_slip
    D: unit_conversion_error
  distractor_trace:
    A: adds the 3 hours and then subtracts the 40 minutes instead of adding them
    B: adds 2 hours 40 minutes, losing one hour
    D: reaches 13:30 on a 24-hour clock and reads it as 3:30 by dropping the leading digit
  explanation: 'Add the hours first, then the minutes. Three hours after 9:50 a.m. is 12:50 p.m. Adding
    the remaining 40 minutes: 50 + 40 is 90 minutes, which is 1 hour and 30 minutes, so the arrival is
    1:30 p.m. Working the other way round gives the same answer: 9:50 plus 40 minutes is 10:30, and three
    hours later is 1:30 p.m. D is the trap worth naming. Adding on a 24-hour clock gives 13:30, and converting
    to afternoon time means subtracting 12, not dropping the 1. A is the reverse-operation slip, and crossing
    noon is what makes it hard to spot, since 12:10 p.m. still looks like an afternoon arrival.

    '
  source_ref:
  - PT-MA-9
  - PT-MA-27
- id: T1-M39
  section: math_achievement
  item_type: word_problem
  question_number: 39
  skill: Measurement
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: On a map, 1 centimetre represents 8 kilometres. Two towns are 5.5 centimetres apart on
    the map. What is the actual distance between the towns?
  choice_a: 8 kilometres
  choice_b: 13.5 kilometres
  choice_c: 44 kilometres
  choice_d: 88 kilometres
  choice_e: null
  correct_answer: C
  distractor_types:
    A: fast_pattern_match
    B: wrong_setup
    D: arithmetic_slip
  distractor_trace:
    A: repeats the scale given in the question
    B: adds the two numbers instead of multiplying
    D: uses 16 kilometres per centimetre, doubling the scale
  explanation: 'Each centimetre on the map stands for 8 kilometres, so 5.5 centimetres stand for 5.5 lots
    of 8. Split it up: 5 centimetres is 40 kilometres, and the remaining half centimetre is 4 kilometres.
    Together that is 44 kilometres. B is the standard error on scale questions, and an estimate rules
    it out: the distance must be several times 8 kilometres, since the map length is more than 5 centimetres,
    so an answer of 13.5 is far too small. D doubles the scale somewhere in the working, which is easy
    to do when the half centimetre is handled separately and then counted twice.

    '
  source_ref:
  - PT-MA-9
  - PT-MA-35
- id: T1-M40
  section: math_achievement
  item_type: word_problem
  question_number: 40
  skill: Measurement
  difficulty: hard
  dok: 2
  figure_description: null
  question_text: A rectangular tank measures 40 centimetres long, 25 centimetres wide, and 30 centimetres
    deep. Given that 1,000 cubic centimetres equals 1 litre, how many litres of water does the tank hold
    when it is full?
  choice_a: '30'
  choice_b: '95'
  choice_c: '300'
  choice_d: 30,000
  choice_e: null
  correct_answer: A
  distractor_types:
    B: wrong_formula
    C: unit_conversion_error
    D: last_step_trap
  distractor_trace:
    B: adds the three dimensions instead of multiplying them
    C: divides by 100 rather than 1,000
    D: computes the volume correctly and reports it in cubic centimetres
  explanation: 'Find the volume first, then convert. Volume is length times width times depth: 40 × 25
    is 1,000, and 1,000 × 30 is 30,000 cubic centimetres. Now convert. Every 1,000 cubic centimetres is
    one litre, so divide by 1,000: the tank holds 30 litres. D is the most attractive wrong answer because
    all the hard work has been done and only the final conversion is missing. The question asks for litres,
    and 30,000 is an answer in different units. A sense check helps: 30 litres is roughly what a large
    aquarium holds, which fits a tank about 40 by 25 by 30 centimetres. Three hundred litres would be
    a bathtub several times over.

    '
  source_ref:
  - PT-MA-27
  - PT-MA-35
- id: T1-M41
  section: math_achievement
  item_type: word_problem
  question_number: 41
  skill: Measurement
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: A jug holds 1.5 litres of juice and a glass holds 250 millilitres. How many full glasses
    can be poured from 3 full jugs?
  choice_a: '6'
  choice_b: '18'
  choice_c: '45'
  choice_d: 4,500
  choice_e: null
  correct_answer: B
  distractor_types:
    A: partial_answer
    C: unit_conversion_error
    D: last_step_trap
  distractor_trace:
    A: works out the glasses from a single jug and stops at 6
    C: divides by 100 instead of 250
    D: converts to millilitres and reports that figure
  explanation: 'Put both measurements in the same unit before dividing. Three jugs hold 3 × 1.5, which
    is 4.5 litres. Since 1 litre is 1,000 millilitres, that is 4,500 millilitres. Each glass takes 250
    millilitres, so the number of glasses is 4,500 ÷ 250, which is 18. Check it the other way: 18 glasses
    × 250 millilitres is 4,500 millilitres, or 4.5 litres. A is the strongest distractor because 6 glasses
    per jug is a correct and useful step; the question asks about three jugs. D reports a volume where
    a count was asked for, which is worth catching by rereading the final sentence.

    '
  source_ref:
  - PT-MA-35
  - PT-MA-9
- id: T1-M42
  section: math_achievement
  item_type: word_problem
  question_number: 42
  skill: Measurement
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: A recipe uses 300 grams of butter to make 24 biscuits. How many kilograms of butter are
    needed to make 200 biscuits?
  choice_a: '2.5'
  choice_b: '25'
  choice_c: '250'
  choice_d: 2,500
  choice_e: null
  correct_answer: A
  distractor_types:
    B: unit_conversion_error
    C: arithmetic_slip
    D: last_step_trap
  distractor_trace:
    B: divides the gram total by 100 rather than 1,000
    C: divides the gram total by 10
    D: reports the answer in grams
  explanation: 'Find the butter for one biscuit, scale up, then convert. One biscuit takes 300 ÷ 24, which
    is 12.5 grams. Two hundred biscuits take 200 × 12.5, which is 2,500 grams. Since 1,000 grams is a
    kilogram, 2,500 grams is 2.5 kilograms. D is the trap the question sets by asking for kilograms while
    giving the recipe in grams. All three wrong answers here are the same quantity of butter expressed
    with the decimal point in the wrong place, which is what makes an estimate valuable: 200 biscuits
    is about eight times the recipe, and eight times 300 grams is 2,400 grams, so the answer must be a
    little over 2 kilograms.

    '
  source_ref:
  - PT-MA-27
  - PT-MA-9
- id: T1-M43
  section: math_achievement
  item_type: word_problem
  question_number: 43
  skill: Measurement
  difficulty: hard
  dok: 3
  figure_description: '[FIGURE: a rectangle labelled 12 m along its longer side and 8 m along its shorter
    side, enclosed by a shaded border of uniform width labelled 1 m on all four sides]'
  question_text: A rectangular garden measures 12 metres by 8 metres. A path 1 metre wide runs all the
    way around the outside of the garden. What is the total area of the garden and the path together,
    in square metres?
  choice_a: '44'
  choice_b: '96'
  choice_c: '120'
  choice_d: '140'
  choice_e: null
  correct_answer: D
  distractor_types:
    A: partial_answer
    B: fast_pattern_match
    C: wrong_setup
  distractor_trace:
    A: works out the area of the path alone
    B: reports the area of the garden without the path
    C: adds the path to one dimension only, computing 12 × 10
  explanation: 'The path runs around the whole garden, so it adds 1 metre at each end of every dimension,
    not just one. The length becomes 12 + 1 + 1, which is 14 metres. The width becomes 8 + 1 + 1, which
    is 10 metres. The total area is 14 × 10, which is 140 square metres. C is the error this item is built
    around: adding the path once rather than twice per dimension. Sketching the shape makes it visible,
    since the path appears on the left and the right, and again at the top and the bottom. A is worth
    a second look. The path alone covers 140 − 96, which is 44 square metres — a correct and useful figure,
    but the question asks for the garden and the path together.

    '
  source_ref:
  - PT-MA-35
  - PT-MA-27
- id: T1-M44
  section: math_achievement
  item_type: word_problem
  question_number: 44
  skill: Geometry
  difficulty: medium
  dok: 2
  figure_description: null
  question_text: Two angles are supplementary. One of the angles measures three times the other. What
    is the measure of the larger angle, in degrees?
  choice_a: '45'
  choice_b: '60'
  choice_c: '90'
  choice_d: '135'
  choice_e: null
  correct_answer: D
  distractor_types:
    A: partial_answer
    B: wrong_setup
    C: wrong_formula
  distractor_trace:
    A: solves for the smaller angle and reports it
    B: divides 180 by 3 without accounting for both angles
    C: assumes supplementary angles are two right angles
  explanation: 'Supplementary angles add to 180 degrees. Call the smaller angle x. The larger is 3x, and
    together they make 180, so x + 3x = 180. That is 4x = 180, giving x = 45. The two angles are 45 and
    135 degrees. They add to 180, and 135 is indeed three times 45. The larger is 135. B divides by 3
    because the word "three" appears, but the total has to be shared into 4 parts, not 3 — one part for
    the smaller angle and three for the larger. C reaches for 90 because supplementary angles often come
    up alongside right angles, but two 90-degree angles are equal rather than one being triple the other.
    A is the familiar trap of solving for the variable and answering with it; the question asks for the
    larger angle, which is 3x rather than x.

    '
  source_ref:
  - PT-MA-11
  - PT-MA-33
- id: T1-M45
  section: math_achievement
  item_type: word_problem
  question_number: 45
  skill: Geometry
  difficulty: medium
  dok: 2
  figure_description: '[FIGURE: a coordinate grid with x and y axes marked in units from 0 to 10, showing
    a rectangle with vertices plotted and labelled at (2, 1), (8, 1), (8, 5) and (2, 5)]'
  question_text: A rectangle has vertices at (2, 1), (8, 1), (8, 5), and (2, 5) on a coordinate grid.
    What is the area of the rectangle, in square units?
  choice_a: '10'
  choice_b: '12'
  choice_c: '20'
  choice_d: '24'
  choice_e: null
  correct_answer: D
  distractor_types:
    A: wrong_setup
    B: wrong_formula
    C: partial_answer
  distractor_trace:
    A: adds the two side lengths instead of multiplying them
    B: halves the product as though the shape were a triangle
    C: computes the perimeter
  explanation: 'Find the side lengths from the coordinates before doing anything else. The bottom side
    runs from x = 2 to x = 8 at the same height, so its length is 8 − 2, which is 6. The left side runs
    from y = 1 to y = 5 at the same x value, so its length is 5 − 1, which is 4. Area is length times
    width: 6 × 4, which is 24 square units. C is the most attractive wrong answer, since 20 is the perimeter
    and perimeter and area are easy to mix up when both are available. The units are the giveaway: area
    is measured in square units, and the question asks for square units. Counting squares on the grid
    confirms it — the rectangle is 6 squares across and 4 up, which is 24 squares in all.

    '
  source_ref:
  - PT-MA-33
  - PT-MA-11
- id: T1-M46
  section: math_achievement
  item_type: word_problem
  question_number: 46
  skill: Geometry
  difficulty: hard
  dok: 3
  figure_description: '[FIGURE: an L-shaped figure formed from a rectangle 10 cm wide and 8 cm tall, with
    a rectangular piece 4 cm wide and 3 cm tall removed from the top right corner. All four measurements
    are labelled: 10 cm along the bottom, 8 cm along the left side, 4 cm along the top of the removed
    piece, and 3 cm along its right side]'
  question_text: The figure shows an L-shaped piece of card. What is the area of the card, in square centimetres?
  choice_a: '12'
  choice_b: '56'
  choice_c: '68'
  choice_d: '80'
  choice_e: null
  correct_answer: C
  distractor_types:
    A: partial_answer
    B: arithmetic_slip
    D: fast_pattern_match
  distractor_trace:
    A: computes the area of the removed corner rather than the card
    B: subtracts 24 instead of 12, doubling the removed piece
    D: computes the full rectangle and forgets that a corner is missing
  explanation: 'Treat the L as a complete rectangle with a corner taken out. The complete rectangle would
    be 10 by 8, which is 80 square centimetres. The missing corner is 4 by 3, which is 12 square centimetres.
    The card is what remains: 80 − 12, which is 68 square centimetres. There is a second route that gives
    the same answer and is worth knowing, because it works when the outer rectangle is not obvious. Split
    the L into two rectangles: a piece 10 by 5 across the bottom, which is 50, and a piece 6 by 3 above
    it, which is 18. Together that is 68. D is the answer of a student who reads the outer dimensions
    and stops. A computes the piece that was removed rather than the piece that remains, which is a real
    step in the working.

    '
  source_ref:
  - PT-MA-11
  - PT-MA-33
- id: T1-M47
  section: math_achievement
  item_type: word_problem
  question_number: 47
  skill: Geometry
  difficulty: hard
  dok: 3
  figure_description: null
  question_text: A cube has a total surface area of 150 square centimetres. What is the volume of the
    cube, in cubic centimetres?
  choice_a: '125'
  choice_b: '150'
  choice_c: '300'
  choice_d: '750'
  choice_e: null
  correct_answer: A
  distractor_types:
    B: fast_pattern_match
    C: wrong_setup
    D: wrong_formula
  distractor_trace:
    B: repeats the surface area given in the question
    C: doubles the surface area instead of working back to the edge length
    D: multiplies the surface area by the edge length
  explanation: 'This one runs backwards: from surface area to edge length, then forwards to volume. A
    cube has 6 identical square faces, so one face has area 150 ÷ 6, which is 25 square centimetres. A
    square of area 25 has sides of 5 centimetres, since 5 × 5 is 25. The volume is edge cubed: 5 × 5 ×
    5, which is 125 cubic centimetres. Check forwards: a cube of edge 5 has six faces of 25, which is
    150 square centimetres, matching the question. B is the trap of answering with a number already given.
    The two figures are close enough in size to look interchangeable, and the units settle it: 150 is
    in square centimetres and the question asks for cubic centimetres. Working through the edge length
    is the only route, and it is the step both C and D skip.

    '
  source_ref:
  - PT-MA-33
  - PT-MA-11
writing_assignment:
  id: T1-W1
  test_id: Test 1 (baseline)
  section: writing
  item_type: writing_prompt
  question_number: 1
  mode: personal
  difficulty: hard
  time_allowed: about 40 minutes
  length_guidance: no more than two pages
  prompt: "Most of the time we are the ones being taught. Someone older shows us how to do\nsomething,\
    \ and we are the ones listening, or watching, or getting it wrong until\nwe get it right.\n\nBut everyone\
    \ has been on the other side of that at least once. There is something\nyou know how to do that someone\
    \ else did not, and at some point you were the one\ndoing the explaining — to a younger brother or\
    \ sister, a cousin, a friend, a\nneighbour, a grandparent, someone at school.\n\nWrite an essay or\
    \ tell a true story about a time you taught someone else something.\nIt does not need to be an important\
    \ skill, and it does not need to have gone well.\n\nYour essay or story must:\n\n  - describe the\
    \ person you were teaching and what you were trying to teach them\n  - use specific detail so the\
    \ reader can picture what actually happened\n  - show how you tried to explain it, including anything\
    \ that did not work\n  - make clear what the experience showed you\n"
  rubric:
    dimensions_note: 'Five dimensions, scored independently. The descriptors below separate the top band
      from a competent middle band, since that is the distinction that decides this section — nearly every
      student reaching the writing sample can already write correct, organised prose.

      '
    voice_and_originality:
      top_band: 'Sounds like a particular person and nobody else. The subject is chosen because the writer
        actually has something to say about it rather than because it sounds impressive. Humour, if it
        appears, arises from the material. The reader finishes with a clear sense of how this writer notices
        things.

        '
      middle_band: 'Pleasant and sincere, but interchangeable with many other papers. The subject is a
        safe one and the writer''s attitude toward it stays general. Nothing is wrong; nothing is anyone''s
        in particular.

        '
    organization:
      top_band: 'Shape follows the thinking. The piece begins where the story actually begins, spends
        the most space where the most is happening, and ends at a point the writer chose rather than at
        the point where time ran out. Transitions are invisible because the order makes sense.

        '
      middle_band: 'Clear beginning, middle and end, with signposts doing the work that structure should
        do — first, then, next, finally. Every stage of the event gets roughly equal space whether or
        not it earns it.

        '
    development_and_detail:
      top_band: 'Details are specific, chosen, and could not belong to anyone else''s version of the event.
        The writer knows which moment matters and slows down for it. What went wrong is included rather
        than tidied away.

        '
      middle_band: 'Details are present and relevant but generic — the kind that could be supplied by
        anyone imagining the scene rather than remembering it. The account tends to summarise the event
        evenly rather than dwelling where it should.

        '
    language_and_vocabulary:
      top_band: 'Word choice is precise and unforced. Sentence lengths vary because the content varies,
        with short sentences used deliberately for weight. Ambitious words appear only where they are
        the right ones.

        '
      middle_band: 'Vocabulary is correct and sometimes reached for. Sentences run to a similar length
        and rhythm. Occasional large words are used slightly off, in ways that show they came from a list
        rather than from use.

        '
    mechanics:
      top_band: 'Spelling, punctuation and grammar are secure enough to be invisible. Any departure from
        standard usage is clearly deliberate and controlled, such as a fragment used for emphasis.

        '
      middle_band: 'Generally correct, with scattered errors that do not obstruct meaning — comma splices,
        an inconsistent tense, a few misspellings of harder words.

        '
    scoring_guidance: 'A paper can be flawless in mechanics and organisation and still sit in the middle
      band, and frequently does. Voice, originality and detail are what separate the top papers, because
      they are the dimensions that cannot be prepared in advance. Readers should be careful not to reward
      length, handwriting or an impressive topic, none of which predicts the qualities this section exists
      to find.

      '
  annotated_model_response:
    length: 384 words, 9 paragraphs
    readability_note: 'Flesch-Kincaid grade 5.0, mean sentence length 13.2 words, ranging from 4 words
      to 42. The low readability figure is a feature rather than a fault: the vocabulary is plain and
      the sentences are mostly short, and the quality lives in what is noticed rather than in how elaborately
      it is said. A model written at a higher grade level would misrepresent what a strong 6th-grade paper
      looks like.

      '
    text: 'My cousin Dalia is seven and she wanted to learn to float. She had been at the

      pool all summer holding onto the wall.


      The first thing I told her was to lie back, and she did lie back, but she also

      held her breath and made her whole body stiff like a board, and she sank. Not

      all the way. Just enough that water went up her nose. She came up mad at me.


      I tried explaining it three different ways. I said imagine you are lying on your

      bed. I said pretend there is a hand under you. I said just relax, which is the

      worst thing you can tell somebody, because nobody in history has ever relaxed

      from being told to relax.


      What finally worked was an accident. She got tired of me and started floating on

      her back while she was complaining about how she couldn''t float. She was talking

      the whole time, saying it''s not working, it''s not working, and her ears were

      under and her stomach was up and she was completely floating. I did not say

      anything. I have never wanted to say something so much in my life. I just let her

      keep complaining until she noticed.


      When she noticed she screamed and sank. Then she did it four more times on purpose.


      Here is the part I keep thinking about. I did not teach her anything. Everything

      I said was useless. Floating is not something you do, it is something you stop

      doing, and there is no way to explain that to a person. They have to be distracted

      into it.


      My mom taught me to float when I was six and I do not remember one thing she said.

      What I remember is the sound of being just under the water, how everything gets far

      away and close at the same time. That is probably all Dalia will remember too.


      She is a better floater than me now. She does it in the deep end with her arms out

      and her eyes shut, and she stays up as long as she wants, and when I ask her how

      she does it she says I don''t know, you just do it.


      Which is exactly right, and also completely useless, which I guess is the point.

      '
    annotations:
    - paragraph: 1
      note: 'Two sentences and the situation is complete: who, how old, what she wanted, how long she
        had been stuck. "Holding onto the wall" does the work that a paragraph of description would do
        badly. The piece begins where the story begins, with no throat-clearing about how the writer has
        always loved swimming.

        '
      dimension: organization
    - paragraph: 2
      note: '"Stiff like a board" is ordinary; "water went up her nose" is not, because it is what actually
        happens and most writers would leave it out as unglamorous. "She came up mad at me" is the first
        sign the writer will not tidy the event into a success story.

        '
      dimension: development_and_detail
    - paragraph: 3
      note: 'Three failed explanations listed in three parallel sentences, then a joke the material earned:
        nobody has ever relaxed from being told to relax. This is voice — an observation the writer made
        rather than borrowed. The prompt asked for what did not work, and this paper treats that instruction
        as the interesting part rather than an obligation.

        '
      dimension: voice_and_originality
    - paragraph: 4
      note: 'The longest paragraph sits on the moment that matters, which is correct proportioning. The
        run-on in the middle — "and her ears were under and her stomach was up and she was completely
        floating" — imitates the rush of noticing. "I have never wanted to say something so much in my
        life" is restraint described rather than claimed.

        '
      dimension: development_and_detail
    - paragraph: 5
      note: 'Sixteen words after an eighty-word paragraph. The contrast gives the sentence its weight,
        and "four more times on purpose" conveys the child''s delight without narrating it.

        '
      dimension: language_and_vocabulary
    - paragraph: 6
      note: 'The reflection arrives as a genuine puzzle rather than a lesson: the writer concludes that
        the teaching failed and the learning happened anyway. "Floating is not something you do, it is
        something you stop doing" is the paper''s real idea, and it is specific to floating rather than
        a general moral that could be pasted onto any story.

        '
      dimension: voice_and_originality
    - paragraph: 7
      note: 'Widening the frame at exactly the right moment. The writer''s own memory contains no instruction
        either, which quietly confirms the idea instead of restating it. "Everything gets far away and
        close at the same time" is the one lyrical sentence in the piece, and it works because the writer
        has spent eight paragraphs earning it.

        '
      dimension: development_and_detail
    - paragraph: 8
      note: 'Dalia''s own words, unquoted and unpunctuated, land better than dialogue with quotation marks
        would. The detail that she is now better than the writer is generous and slightly funny, and a
        weaker paper would have kept the writer at the centre.

        '
      dimension: voice_and_originality
    - paragraph: 9
      note: 'Ends on a shrug rather than a conclusion, and is the stronger for it. Compare the version
        this paper avoided: "I learned that teaching someone is really about patience." The ending it
        has is truer and sounds like a person; the ending it avoided is what most papers do.

        '
      dimension: organization
    why_this_sits_in_the_top_band: 'The mechanics are sound but unremarkable, and that is not what earns
      the score. What earns it is that the paper reports a failure honestly, arrives at an idea the writer
      clearly reached rather than retrieved, proportions its paragraphs to what matters, and sounds like
      one specific twelve-year-old throughout. A reader could pick this paper out of a hundred.

      '
  common_pitfalls:
  - pitfall: The tacked-on moral
    description: 'The paper narrates an event competently and then closes with a sentence stating what
      was learned, in language borrowed from adults: teaching taught me patience, I realised helping others
      is its own reward. The reflection sits on top of the story rather than growing out of it, and readers
      spot it instantly because the register changes in the final line.

      '
    what_to_do_instead: 'Let the thinking happen inside the story. If the writer cannot say what the experience
      showed them without sounding like a greeting card, the honest move is to describe what puzzled them
      about it, as the model does.

      '
  - pitfall: Events without weight
    description: 'A list of what happened, in order, with every stage given the same amount of space.
      First we went to the pool, then I showed her, then she tried, then she did it, then we went home.
      Nothing is wrong and nothing is chosen.

      '
    what_to_do_instead: 'Find the single moment the story is actually about and give it the most room.
      Everything before it is setup and can be brief.

      '
  - pitfall: Choosing an impressive subject over a real one
    description: 'Reaching for something that sounds significant — teaching a younger sibling to read,
      helping a grandparent through an illness — and then having nothing specific to say about it, because
      it was chosen for how it sounds rather than for what the writer remembers.

      '
    what_to_do_instead: 'Pick the memory with the most detail attached to it, however small the subject.
      A paper about teaching someone to whistle, told precisely, beats a vague paper about something momentous.

      '
  - pitfall: Vocabulary worn as decoration
    description: 'Large words inserted to signal effort, often slightly misused, in sentences that are
      otherwise plain. A word that came from a vocabulary list rather than from the writer''s own speech
      is visible immediately and works against the paper.

      '
    what_to_do_instead: 'Use the word that is exactly right, which is usually a plain one. Precision reads
      as sophistication; reaching does not.

      '
