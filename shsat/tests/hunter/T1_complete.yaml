    Editing here means removing what is not needed: in a flood the river abandons the long loop, as a writer deletes a passage 'it no longer had a use for.' A takes 'edited' literally; C adds intention and error the passage does not claim; D imports a 'plan,' though the passage insists none is needed; E invents copying.
