  explanation: |-
    A map 'faithful to the land beneath it' is one that reports the land truly, so 'accurate' fits. 'Loyal' and 'obedient' borrow the sense of faithful used of people; 'religious' reaches for another common meaning; 'steady' names constancy rather than truth to a thing.
