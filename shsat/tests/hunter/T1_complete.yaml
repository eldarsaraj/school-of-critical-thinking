  question_number: 40
  skill: tone_attitude
  difficulty: medium
  dok: 3
  target_word: null
  question_text: The speaker's attitude toward the people in the gym is best described as
  choice_a: respectful
  choice_b: impatient
  choice_c: pitying
  choice_d: amused
  choice_e: detached
  correct_answer: A
  distractor_types:
    B: wrong_concept
    C: less_precise
    D: partly_true_but_wrong
    E: opposite
  explanation: 'The speaker notices what people do to keep themselves in order: sweeping a floor that
    does not need it, squaring a pair of shoes, walking a line with care. These are recorded as things
    worth recording, and the old man is given his own words rather than being explained. That is respect.
    B has no support in a poem that watches this patiently. C is the near miss and the one most worth
    rejecting deliberately: pity would look down at these people, and the speaker is one of them, saying
    "we came in" and "the floor arranged us." D catches a flicker — there is something wry in sweeping
    an empty floor — but amusement cannot account for the last stanza. E is contradicted by the plural
