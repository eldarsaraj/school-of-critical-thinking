  text: "    They have one hundred and sixty acres of land, a \"Squatter's\n    claim,\" and an invaluable\
    \ water power. He is a lumberer, and\n    has a saw-mill of a very primitive kind. I notice that\n\
    \    every day something goes wrong with it, and this is the\n5   case throughout. If he wants to\
    \ haul timber down, one or\n    other of the oxen cannot be found; or if the timber\n    is actually\
    \ under way, a wheel or a part of the\n    harness gives way, and the whole affair is at a standstill\n\
    \    for days. The cabin is hardly a shelter, but is allowed\n10  to remain in ruins because the foundation\
    \ of a frame house\n    was once dug. A horse is always sure to be lame\n    for want of a shoe nail,\
    \ or a saddle to be\n    useless from a broken buckle, and the wagon and harness are\n    a marvel\
    \ of temporary shifts, patchings, and insecure linkings with strands\n15  of rope. Nothing is ever\
    \ ready or whole when it is\n    wanted. Yet Chalmers is a frugal, sober, hard-working man, and he,\n\
    \    his eldest son, and a \"hired man\" \"Rise early,\" \"going forth\n    to their work and labor\
    \ till the evening\"; and if they\n    do not \"late take rest,\" they truly \"eat the bread of\n\
    20  carefulness.\" It is hardly surprising that nine years of persevering shiftlessness\n    should\
    \ have resulted in nothing but the ability to procure the\n    bare necessaries of life.\n    Of Mrs.\
    \ C. I can say less. She looks like one\n    of the English poor women of our childhood--lean, clean,\
    \ toothless, and\n25  speaks, like some of them, in a piping, discontented voice, which\n    seems\
    \ to convey a personal reproach. All her waking hours are\n    spent in a large sun-bonnet. She is\
    \ never idle for one\n    minute, is severe and hard, and despises everything but work. I\n    think\
    \ she suffers from her husband's shiftlessness. She always speaks of\n30  me as \"This\" or \"that\
    \ woman.\" The family consists of a\n    grown-up son, a shiftless, melancholy-looking youth, who\
    \ possibly pines for a\n    wider life; a girl of sixteen, a sour, repellent-looking creature, with\n\
    \    as much manners as a pig; and three hard, un-child-like younger\n    children. By the whole family\
    \ all courtesy and gentleness of act\n35  or speech seem regarded as \"works of the flesh,\" if not\n\
    \    of \"the devil.\" They knock over all one's things without apologizing\n    or picking them up,\
    \ and when I thank them for anything\n    they look grimly amazed. I feel that they think it sinful\n\
    \    that I do not work as hard as they do. I\n40  wish I could show them \"a more excellent way.\"\
    \ This hard\n    greed, and the exclusive pursuit of gain, with the indifference to\n    all which\
    \ does not aid in its acquisition, are eating up\n    family love and life throughout the West. I\
    \ write this reluctantly,\n    and after a total experience of nearly two years in the\n45  United\
    \ States.\n"
