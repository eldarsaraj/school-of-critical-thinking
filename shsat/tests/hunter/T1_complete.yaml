  difficulty: hard
  dok: 3
  target_word:
  question_text: The mood at the end of the poem (lines 22-26) is chiefly one of
  choice_a: relief that the birds have finally gone
  choice_b: a hushed wonder too deep to speak of
  choice_c: disappointment at how the evening ended
  choice_d: fear of the gathering dark
  choice_e: impatience to get home at last
  correct_answer: B
  distractor_types:
    A: opposite
    C: opposite
    D: wrong_concept
    E: misidentified_detail
  explanation: |-
    The birds fall silent 'pretending to be leaves,' the sky is 'the sky again,' and 'neither of us says what we saw' — a quiet too full for words. A and C mistake awe for relief or letdown; D adds a fear the ending does not carry; E takes the literal drive home as impatience, though the silence is reverence.
  source_ref:
  - H2-Q39
- id: T1-R38
  passage_id: T1-P5
