- id: T1-Q26
  section: quantitative_reasoning
  item_type: quant_comparison
  question_number: 26
  skill: Number & Operations (Decimals, Percents, Fractions)
  construct: Compare a single percent discount with two successive discounts of half that rate; successive discounts of 15% then 15% remove less than one 30% cut.
  difficulty: medium
  dok: 3
  shared_information: The original price of a coat was $200.00.
  question_text: Compare the quantity in Column A with the quantity in Column B.
  column_a: The amount saved with a single 30% discount
  column_b: The amount saved with two separate discounts of 15% and then another 15%
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e:
  correct_answer: A
  distractor_types:
    B: magnitude_misjudged
    C: special_case_overgeneralized
    D: picks_D_when_determinable
  distractor_trace:
    B: believes taking 15% twice removes more than 30% at once
    C: adds 15% + 15% = 30% and concludes the two columns are equal
    D: thinks the answer depends on unknown information, though the price is given
  explanation: 'Column A: a 30% discount on $200 saves 0.30 × 200 = $60. Column B: the first 15% brings $200 to $170 (saving $30); the second 15% is taken on $170, bringing it to $144.50 (saving $25.50 more), for $55.50 saved in all. Because the second 15% is figured on the already-reduced price, the two cuts save less than one 30% cut. Since $60 > $55.50, Column A is greater. Verified: 60 vs 55.5.'
  source_ref:
