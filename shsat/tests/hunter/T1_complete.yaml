    A: picks a rising line but the shallower one
    C: picks the steepest line overall, ignoring that it falls
    D: picks a falling line
  explanation: 'An increase means a positive slope, so only the rising lines A and B qualify. Of those, B is steeper, so its y-value climbs fastest. C is the steepest line but it decreases, so its rate is negative, not the greatest increase. Verified by comparing slopes: +3 beats +1, and the negative slopes are not increases.'
