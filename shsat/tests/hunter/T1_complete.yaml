  register_collision_check: 'Checked against all 11 real passages and the empty T1 rows. No prior passage is contemporary informational, none is set in a museum or conservation studio, none uses third-person expository voice (H1-E is a first-person essayist), and none has an absent central relationship of this kind. Deliberately avoids the two Nebraska-farm settings (H1-F, H2-E) and adds no fourth first-person-boy narrator (H1-A, H1-F, H2-D). Neither "sound" nor "arrested" appears in vocab_words_tested.

