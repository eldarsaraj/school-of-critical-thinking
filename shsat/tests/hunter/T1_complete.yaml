  difficulty: medium
  dok: 2
  target_word: resignation
  question_text: As used in the passage, "resignation" ('What is called resignation is confirmed desperation') most nearly means
  choice_a: passive acceptance of one's lot
  choice_b: the act of quitting a job
  choice_c: open anger
  choice_d: physical tiredness
  choice_e: willing forgiveness
  correct_answer: A
  distractor_types:
    B: surface_match
    C: opposite
    D: less_precise
    E: wrong_concept
  explanation: |-
    Here resignation is the settled giving-in that the speaker equates with despair — passive acceptance. 'Quitting a job' is the common modern sense and the trap; 'anger' is its opposite; 'tiredness' and 'forgiveness' name other states entirely.
  source_ref:
