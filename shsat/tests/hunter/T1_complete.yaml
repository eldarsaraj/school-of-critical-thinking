  source_ref:
  - H1-Q20
- id: T1-R48
  passage_id: T1-P6
  section: reading_comprehension
  item_type: reading_mc
  question_number: 48
  skill: inference
  construct: Inference from a compressed causal phrase ('the curve deepens itself').
  difficulty: hard
  dok: 3
  target_word:
  question_text: The statement that "the curve, in short, deepens itself" (lines 19-20) mainly means that
  choice_a: the river grows physically deeper at every bend
  choice_b: someone digs the curves out to make them deeper
  choice_c: a bend, once begun, causes itself to grow still more curved
  choice_d: deep rivers curve more sharply than shallow ones do
  choice_e: the curve slowly fills with sand until it disappears
  correct_answer: C
  distractor_types:
    A: too_literal
    B: wrong_concept
    D: inference_leap
    E: opposite
