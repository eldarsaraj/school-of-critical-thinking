  shared_information: y = 3x + 2.
  question_text: Compare the quantity in Column A with the quantity in Column B.
  column_a: The value of x when y = 20
  column_b: The value of y when x = 6
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e:
  correct_answer: B
  distractor_types:
    A: magnitude_misjudged
    C: magnitude_misjudged
    D: picks_D_when_determinable
  distractor_trace:
    A: solves both correctly (x = 6, y = 20) but reports the smaller as larger
    C: sees the numbers 6 and 20 appear in both computations and calls them equal
    D: treats the two columns as unrelated and gives up, though both are fully determined
  explanation: "Column A: set y = 20, so 3x + 2 = 20, 3x = 18, x = 6. Column B: put x = 6 in, y = 3(6) + 2 = 20. So Column A is 6 and Column B is 20, and Column B is greater. The two columns use the same rule but ask for different things, which is why the answer is not 'equal.' Verified: x = 6 and y = 20."
  source_ref:
  - PT-QR-19
