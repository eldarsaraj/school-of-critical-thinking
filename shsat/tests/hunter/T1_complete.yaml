  question_text: The father says the starlings are "only going to roost" (line 15). The speaker's comment on this suggests that the father
  choice_a: knows a great deal about the habits of birds
  choice_b: is bored by the whole spectacle
  choice_c: is frightened by the enormous flock
  choice_d: wants to leave before his child is ready to
  choice_e: offers a plain fact because he cannot, or will not, name the larger feeling
  correct_answer: E
  distractor_types:
    A: too_literal
    B: opposite
    C: wrong_concept
    D: misidentified_detail
  explanation: |-
