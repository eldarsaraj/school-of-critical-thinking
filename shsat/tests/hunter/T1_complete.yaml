  choice_a: luxuries
  choice_b: essentials
  choice_c: tools
  choice_d: daily chores
  choice_e: small comforts
  correct_answer: B
  distractor_types:
    A: opposite
    C: less_precise
    D: wrong_concept
    E: less_precise
  explanation: |-
    The 'necessaries of life' are the things truly required to live — essentials — which the passage sets against mere 'luxuries.' A is the opposite; 'tools' and 'comforts' name narrower or lesser goods; 'chores' confuses things needed with tasks done.
  source_ref:
