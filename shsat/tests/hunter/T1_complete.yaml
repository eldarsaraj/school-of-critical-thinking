  title: A Squatter's Claim
  genre: classic_literary_nonfiction
  era: classic
  source_type: public_domain_excerpt
  source_citation: 'Isabella L. Bird, "A Lady''s Life in the Rocky Mountains" (London: John Murray, 1879), from the letter headed "Canyon, September" — two consecutive paragraphs describing the Chalmers household. Project Gutenberg etext 755, https://www.gutenberg.org/cache/epub/755/pg755.txt. Public domain in the United States.

    '
  excerpt_start_anchor: They have one hundred and sixty acres of land
  excerpt_end_anchor: nearly two years in the United States.
  setting_place: a squatter's claim and primitive sawmill in the Colorado foothills
  setting_period: 1873
  narrator_pov: first-person, an Englishwoman travelling alone, writing letters home to her sister
  central_relationship: the writer and the frontier family she is lodging with
  topic: a household that works without rest and stays poor, and what the writer makes of it
  mood: exact, unsparing, reluctant
  word_count: 479
  line_count: 45
  n_items: 8
  skills_covered: main_idea; vocabulary_in_context; inference; tone_attitude; authors_purpose
  vocab_words_tested: invaluable; want
  layout_rule: paragraph breaks preserved; wrapped at exactly 11 words per line; no paragraph shares a line; every 5th line numbered
  register_collision_check: 'Period 1873 is unoccupied — the corpus runs 1830s, 1840s, 1880s, 1890s, 1900s, 1910s and mid-20th century, and slot 3 took the 1860s. Colorado and the American West appear nowhere in the corpus. The narrator is a first-person woman travelling alone and reporting on strangers, which separates her from H2-A (Douglass, first-person male autobiography about his own bondage) and from H1-E (first-person essayist meditating on a natural wonder); this passage is social observation with no landscape and no self-history. Nearest collision is the pair of Nebraska-farm passages, H1-F and H2-E, since this is also land being worked. The distinction is deliberate and holds: Cather''s farms are settings for coming-of-age narratives told from inside the household, whereas this is an outsider''s report on a failing timber claim, and the writer is a lodger who will leave. No fourth first-person-boy narrator. Neither "invaluable" nor "want" appears in vocab_words_tested.

    '
  text: "    They have one hundred and sixty acres of land, a \"Squatter's\n    claim,\" and an invaluable water power. He is a lumberer, and\n    has a saw-mill of a very primitive kind. I notice that\n    every day something goes wrong with it, and this is the\n5   case throughout. If he wants to haul timber down, one or\n    other of the oxen cannot be found; or if the timber\n    is actually under way, a wheel or a part of the\n    harness gives way, and the whole affair is at a standstill\n    for days. The cabin is hardly a shelter, but is allowed\n10  to remain in ruins because the foundation of a frame house\n    was once dug. A horse is always sure to be lame\n    for want of a shoe nail, or a saddle to be\n    useless from a broken buckle, and the wagon and harness are\n    a marvel of temporary shifts, patchings, and insecure linkings with strands\n15  of rope. Nothing is ever ready or whole when it is\n    wanted. Yet Chalmers is a frugal, sober, hard-working man, and he,\n    his eldest son, and a \"hired man\" \"Rise early,\" \"going forth\n    to their work and labor till the evening\"; and if they\n    do not \"late take rest,\" they truly \"eat the bread of\n20  carefulness.\" It is hardly surprising that nine years of persevering shiftlessness\n    should have resulted in nothing but the ability to procure the\n    bare necessaries of life.\n    Of Mrs. C. I can say less. She looks like one\n    of the English poor women of our childhood--lean, clean, toothless, and\n25  speaks, like some of them, in a piping, discontented voice, which\n    seems to convey a personal reproach. All her waking hours are\n    spent in a large sun-bonnet. She is never idle for one\n    minute, is severe and hard, and despises everything but work. I\n    think she suffers from her husband's shiftlessness. She always speaks of\n30  me as \"This\" or \"that woman.\" The family consists of a\n    grown-up son, a shiftless, melancholy-looking youth, who possibly pines for a\n    wider life; a girl of sixteen, a sour, repellent-looking creature, with\n    as much manners as a pig; and three hard, un-child-like younger\n    children. By the whole family all courtesy and gentleness of act\n35  or speech seem regarded as \"works of the flesh,\" if not\n    of \"the devil.\" They knock over all one's things without apologizing\n    or picking them up, and when I thank them for anything\n    they look grimly amazed. I feel that they think it sinful\n    that I do not work as hard as they do. I\n40  wish I could show them \"a more excellent way.\" This hard\n    greed, and the exclusive pursuit of gain, with the indifference to\n    all which does not aid in its acquisition, are eating up\n    family love and life throughout the West. I write this reluctantly,\n    and after a total experience of nearly two years in the\n45  United States.\n"
