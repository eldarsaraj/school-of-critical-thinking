- id: T1-Q29
  section: quantitative_reasoning
  item_type: quant_comparison
  question_number: 29
  skill: Data Analysis & Probability
  construct: "Predict a full-population count from a sample: recover the group size from the survey fraction, apply the sample's YES rate, then compare the two predictions — raw YES counts mislead."
  difficulty: hard
  dok: 3
  shared_information: "[VISUAL: a table titled 'Survey Results' with columns Group, Percent of Group Surveyed, YES votes, NO votes. Row X: 20%, 18, 12. Row Y: 60%, 30, 30.] To predict how two groups will vote, a sample of each group was surveyed. The table shows the percent of each group surveyed and the YES and NO counts in each sample."
  question_text: Compare the quantity in Column A with the quantity in Column B.
  column_a: The predicted number of YES votes if everyone in Group X votes
  column_b: The predicted number of YES votes if everyone in Group Y votes
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e:
  correct_answer: A
  distractor_types:
    B: magnitude_misjudged
    C: magnitude_misjudged
    D: picks_D_when_determinable
  distractor_trace:
    B: compares the raw YES counts (30 for Y beats 18 for X) and never scales up to the full group
    C: scales one group but not the other and lands on equal
    D: thinks a prediction cannot be made from a sample
  explanation: "First find each group's size. Group X: the 18 + 12 = 30 people surveyed are 20% of the group, so the group has 30 ÷ 0.20 = 150 people; the YES rate is 18/30 = 0.6, predicting 0.6 × 150 = 90 YES. Group Y: the 30 + 30 = 60 surveyed are 60% of the group, so it has 60 ÷ 0.60 = 100 people; the YES rate is 30/60 = 0.5, predicting 0.5 × 100 = 50 YES. Since 90 > 50, Column A is greater, even though Y had more YES votes in the sample. Verified: 90 vs 50."
  source_ref:
  - PT-QR-26
- id: T1-Q30
  section: quantitative_reasoning
  item_type: quant_comparison
  question_number: 30
  skill: Measurement
  construct: Recognize that any right-angled 'staircase' path between two corners of a rectangle has the same total length as the two-sided L-path, so the shortcut saves nothing.
  difficulty: medium
  dok: 3
  shared_information: "[VISUAL: two routes from corner P to corner Q on a grid. 'Normal route': an L-shaped path going 600 ft east then 400 ft south. 'Shortcut': a right-angled staircase (east, south, east, south, and so on) that also goes 600 ft east and 400 ft south in total. All turns are right angles.]"
  question_text: Compare the quantity in Column A with the quantity in Column B.
  column_a: The distance saved by taking the shortcut instead of the normal route
  column_b: 150 ft
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e:
  correct_answer: B
  distractor_types:
    A: special_case_overgeneralized
    C: magnitude_misjudged
    D: picks_D_when_determinable
  distractor_trace:
    A: assumes a zig-zag that 'cuts across' must be shorter and reports a positive saving
    C: guesses the staircase saves about 150 ft and calls the columns equal
    D: thinks the saving cannot be found without exact segment lengths
  explanation: 'Both routes go the same 600 ft east and 400 ft south overall; they only differ in the order of the steps. The normal route is 600 + 400 = 1000 ft, and the staircase, adding up all its horizontal pieces (600 ft) and all its vertical pieces (400 ft), is also 1000 ft. The shortcut saves 0 ft. Since 150 ft > 0 ft, Column B is greater. Verified: saved = 0.'
  source_ref:
  - PT-QR-27
- id: T1-Q31
  section: quantitative_reasoning
  item_type: quant_comparison
  question_number: 31
  skill: Geometry
  construct: Compare a shaded region with its unshaded complement by computing the area cut away — four congruent corner triangles — and seeing that the remainder is more than half.
  difficulty: medium
  dok: 3
  shared_information: "[VISUAL: a large square. A small right triangle is removed (left unshaded/white) from each of the four corners; each corner triangle has two legs equal to one-fourth of the square's side. The entire central region is shaded gray.]"
  question_text: Compare the quantity in Column A with the quantity in Column B.
  column_a: The area of the shaded region
  column_b: The area of the unshaded region
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e:
  correct_answer: A
  distractor_types:
    B: magnitude_misjudged
    C: special_case_overgeneralized
    D: picks_D_when_determinable
  distractor_trace:
    B: overestimates the corner triangles and thinks the white area wins
    C: assumes the cut-off corners take away exactly half
    D: thinks no comparison is possible without the square's side length
  explanation: "Let the square's side be s. Each corner triangle has legs s/4, so its area is ½ · (s/4) · (s/4) = s²/32. The four corners remove 4 · s²/32 = s²/8, which is one-eighth of the square. That leaves seven-eighths shaded. Since seven-eighths is much more than one-eighth, the shaded area is greater — and the comparison holds for any side length. Verified for s = 8: shaded 62 vs unshaded 2."
  source_ref:
  - PT-QR-29
