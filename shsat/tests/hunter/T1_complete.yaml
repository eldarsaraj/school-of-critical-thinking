  skill: tone_attitude
  difficulty: medium
  dok: 3
  target_word: null
  question_text: In the final stanza (lines 27-32) the tone of the poem becomes more
  choice_a: bitter
  choice_b: playful
  choice_c: fearful
  choice_d: hurried
  choice_e: wondering
  correct_answer: E
  distractor_types:
    A: wrong_concept
    B: opposite
    C: inference_leap
