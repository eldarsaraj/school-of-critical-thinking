  text: "    Christmas won't be Christmas without any presents,\" grumbled Jo, lying on\n    the rug.\n\
    \    \"It's so dreadful to be poor!\" sighed Meg, looking down at\n    her old dress.\n5   \"I don't\
    \ think it's fair for some girls to have plenty\n    of pretty things, and other girls nothing at\
    \ all,\" added little\n    Amy, with an injured sniff.\n    \"We've got Father and Mother, and each\
    \ other,\" said Beth contentedly\n    from her corner.\n10  The four young faces on which the firelight\
    \ shone brightened at\n    the cheerful words, but darkened again as Jo said sadly, \"We\n    haven't\
    \ got Father, and shall not have him for a long\n    time.\" She didn't say \"perhaps never,\" but\
    \ each silently added it,\n    thinking of Father far away, where the fighting was.\n15  Nobody spoke\
    \ for a minute; then Meg said in an altered\n    tone, \"You know the reason Mother proposed not having\
    \ any presents\n    this Christmas was because it is going to be a hard\n    winter for everyone;\
    \ and she thinks we ought not to spend\n    money for pleasure, when our men are suffering so in the\n\
    20  army. We can't do much, but we can make our little\n    sacrifices, and ought to do it gladly.\
    \ But I am afraid\n    I don't,\" and Meg shook her head, as she thought regretfully\n    of all the\
    \ pretty things she wanted.\n    \"But I don't think the little we should spend would do\n25  any\
    \ good. We've each got a dollar, and the army wouldn't\n    be much helped by our giving that. I agree\
    \ not to\n    expect anything from Mother or you, but I do want to\n    buy Undine and Sintran for\
    \ myself. I've wanted it so long,\"\n    said Jo, who was a bookworm.\n30  \"I planned to spend mine\
    \ in new music,\" said Beth, with\n    a little sigh, which no one heard but the hearth brush\n  \
    \  and kettle-holder.\n    \"I shall get a nice box of Faber's drawing pencils; I\n    really need\
    \ them,\" said Amy decidedly.\n35  \"Mother didn't say anything about our money, and she won't wish\n\
    \    us to give up everything. Let's each buy what we want,\n    and have a little fun; I'm sure we\
    \ work hard enough\n    to earn it,\" cried Jo, examining the heels of her shoes\n    in a gentlemanly\
    \ manner.\n40  \"I know I do--teaching those tiresome children nearly all day, when\n    I'm longing\
    \ to enjoy myself at home,\" began Meg, in the\n    complaining tone again.\n    \"You don't have\
    \ half such a hard time as I do,\"\n    said Jo. \"How would you like to be shut up for\n45  hours\
    \ with a nervous, fussy old lady, who keeps you trotting,\n    is never satisfied, and worries you\
    \ till you're ready to fly\n    out the window or cry?\"\n    \"It's naughty to fret, but I do think\
    \ washing dishes and\n    keeping things tidy is the worst work in the world. It\n50  makes me cross,\
    \ and my hands get so stiff, I can't\n    practice well at all.\" And Beth looked at her rough hands\n\
    \    with a sigh that any one could hear that time.\n"
