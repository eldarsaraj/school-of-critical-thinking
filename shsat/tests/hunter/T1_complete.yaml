  difficulty: medium
  dok: 3
  question_text: A computer picks a whole number from 1 to 6 at random for each trial. What is the probability that the numbers picked on the first two trials are both greater than 2?
  column_a:
  column_b:
  choice_a: 1/9
  choice_b: 4/9
  choice_c: 1/2
  choice_d: 2/3
  choice_e:
  correct_answer: B
  distractor_types:
    A: wrong_setup
    C: wrong_setup
    D: partial_answer
  distractor_trace:
    A: squares the complement P(≤2) = 1/3 instead of P(>2)
    C: miscounts 'greater than 2' as 3 of 6 outcomes
    D: finds the single-trial probability 2/3 and forgets to square it
  explanation: 'The numbers greater than 2 are 3, 4, 5, 6 — that is 4 of the 6 outcomes, so one trial succeeds with probability 4/6 = 2/3. The two trials are independent, so both succeed with probability 2/3 × 2/3 = 4/9. D stops after one trial; A uses the wrong four numbers (1 and 2). Verified: 4/9.'
