  question_text: The statement that "alert and healthy natures remember that the sun rose clear" most nearly suggests that
  choice_a: early morning is the best time to work
  choice_b: healthy people tend to wake up early
  choice_c: clear-minded people see that each new day offers a fresh chance to choose differently
  choice_d: the weather has a strong effect on one's mood
  choice_e: the past can never be undone
  correct_answer: C
  distractor_types:
    A: too_literal
    B: too_literal
    D: wrong_concept
    E: inference_leap
  explanation: |-
    The clear sunrise stands for a fresh start, paired with 'it is never too late to give up our prejudices' — the alert person sees each day as a new chance. A and B read the sun and waking literally; D turns it into a claim about weather and mood; E draws a gloomy lesson opposite to the hopeful one.
