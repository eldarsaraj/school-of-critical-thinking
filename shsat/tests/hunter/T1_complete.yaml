  question_text: The passage is mainly concerned with
  choice_a: why a useful account of something must leave the right things out
  choice_b: why simplified diagrams are easier to read than detailed ones
  choice_c: how mapmakers decide which features to draw and which to erase
  choice_d: the errors people make when taking notes or recording measurements
  choice_e: how a map can mislead the person who trusts it
  correct_answer: A
  distractor_types:
    B: too_narrow
    C: too_narrow
    D: too_narrow
    E: partly_true_but_wrong
  explanation: |-
    The whole passage argues that usefulness comes from purposeful omission, moving from the map example to note-taking and measurement to the mind itself. C states that thesis. A, B, and D each name a real part of the passage but only a part; E treats the 'deliberate untruth' remark as the point, when it is one step in the larger argument.
  source_ref:
