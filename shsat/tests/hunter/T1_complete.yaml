    A: misidentified_detail
    B: wrong_concept
    C: misidentified_detail
    D: wrong_concept
  explanation: |-
    The passage says that 'along the inner side, where the current slackens, the river lets fall the sand' and 'a small beach is built up.' A names the outer side, which is scoured instead; D borrows the 'neck' from the oxbow paragraph; B and E contradict the passage's careful split between the two banks.
  source_ref:
  - H1-Q40
- id: T1-R46
  passage_id: T1-P6
  section: reading_comprehension
