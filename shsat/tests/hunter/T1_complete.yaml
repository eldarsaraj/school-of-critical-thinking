  choice_a: worn away
  choice_b: searched
  choice_c: flooded
  choice_d: scrubbed clean
  choice_e: frozen over
  correct_answer: A
  distractor_types:
    B: surface_match
    C: wrong_concept
    D: less_precise
    E: wrong_concept
  explanation: |-
    The outer bank is 'scoured and cut back' by the faster water, so scoured means eroded, worn away. 'Searched' is the common other sense of scour (to scour the woods) and the trap; 'scrubbed clean' catches the washing sense but misses that material is removed; 'flooded' and 'frozen' do not fit.
  source_ref:
  - H1-Q28
- id: T1-R47
  passage_id: T1-P6
  section: reading_comprehension
