  question_text: As used in line 47, "contrived" most nearly means
  choice_a: faked
  choice_b: imagined
  choice_c: refused
  choice_d: rushed
  choice_e: managed
  correct_answer: E
  distractor_types:
    A: surface_match
    B: wrong_concept
    C: opposite
    D: wrong_concept
  explanation: |-
    The best map 'has contrived, with purpose and with skill, to leave behind' what is not needed, so 'contrived' here means brought about by skillful effort — managed. 'Faked' is the everyday sense of contrived (as in a contrived excuse) and is the trap; the others do not fit an act done on purpose and with skill.
  source_ref:
  - H1-Q26
- id: T1-R06
  passage_id: T1-P1
  section: reading_comprehension
  item_type: reading_mc
  question_number: 6
  skill: inference
  construct: Inference about the reason behind a stated contrast (hiker vs pilot).
  difficulty: medium
  dok: 3
  target_word:
  question_text: The passage suggests that a chart useful to a hiker is useless to a pilot (lines 25-28) because
  choice_a: each chart omits the very things the other's user needs
  choice_b: pilots need more accurate charts than hikers do
  choice_c: the two charts are drawn to different scales
  choice_d: hikers and pilots travel at very different speeds
  choice_e: one chart contains more detail than the other
  correct_answer: A
  distractor_types:
    B: opposite
    C: misidentified_detail
    D: inference_leap
    E: opposite
  explanation: |-
    The passage says the difference is 'not because either is the more faithful' but because the two 'have elected to disregard entirely different things.' C restates that. A and E make it a matter of accuracy or amount of detail, which the passage explicitly rules out; B borrows 'scale' from the earlier map example; D adds a fact the passage never uses.
  source_ref:
  - H1-Q19
- id: T1-R07
  passage_id: T1-P1
  section: reading_comprehension
  item_type: reading_mc
  question_number: 7
  skill: inference
  construct: Inference synthesizing two parallel examples (verbatim notes; over-reported measurement).
  difficulty: hard
  dok: 3
  target_word:
  question_text: The author's point about copying a lecture word for word and recording extra decimal places (lines 30-36) is that both
  choice_a: require special training to do at all
  choice_b: hold more than the purpose requires and are the worse for it
  choice_c: fail because they leave out something important
  choice_d: show that their makers did not try hard enough
  choice_e: are more accurate than shorter versions would be
  correct_answer: B
  distractor_types:
    A: wrong_concept
    C: opposite
    D: opposite
    E: partly_true_but_wrong
  explanation: |-
    Both examples pile up detail beyond the need, and the passage says such excess 'obscures' rather than refines. C captures this. B reverses the fault (the trouble is too much, not too little); D reverses the effort (both take more work, not less); E repeats the very error the passage corrects, since the extra decimals are 'not the more exact.'
  source_ref:
  - H1-Q41
- id: T1-R08
  passage_id: T1-P1
  section: reading_comprehension
  item_type: reading_mc
  question_number: 8
  skill: inference
  construct: Inference from a charged phrase ('the labor of exclusion').
  difficulty: medium
  dok: 3
  target_word:
  question_text: The phrase "the labor of exclusion" (line 43) suggests that the author regards leaving details out as
  choice_a: a sign of laziness
  choice_b: a task only trained experts should attempt
  choice_c: harder work than adding detail is
  choice_d: a regrettable thing forced on the mapmaker
  choice_e: something that cannot be done well
  correct_answer: C
  distractor_types:
    A: opposite
    B: too_broad
    D: partly_true_but_wrong
    E: opposite
  explanation: |-
    Calling omission 'labor' — and adding that 'Addition asks little of anyone' — frames leaving out as the harder, more skilled act. A and E treat it as easy or hopeless, the reverse of the point; C overstates it into a job for experts only; D reads omission as a regret, when the passage treats it as an accomplishment.
  source_ref:
  - H1-Q17
- id: T1-R09
  passage_id: T1-P1
  section: reading_comprehension
  item_type: reading_mc
  question_number: 9
  skill: inference
  construct: Inference that pulls the thesis together (good description vs. a copy).
  difficulty: hard
  dok: 3
  target_word:
  question_text: The passage implies that what most distinguishes a good description from a mere copy is that a good description
  choice_a: contains no errors of any kind
  choice_b: is simply shorter than the original
  choice_c: takes less effort to produce
  choice_d: is shaped to answer a particular question
  choice_e: can be understood by anyone at all
  correct_answer: D
  distractor_types:
    A: wrong_concept
    B: less_precise
    C: opposite
    E: inference_leap
  explanation: |-
    Throughout, what saves a description from being a useless copy is that it selects with a purpose — 'the particular question the map has been made to settle.' C names that. B mistakes mere shortness for purposeful selection; A and E add tests the passage never applies; D reverses the effort, since selecting is the harder labor.
  source_ref:
  - H2-Q49
- id: T1-R10
  passage_id: T1-P2
  section: reading_comprehension
  item_type: reading_mc
  question_number: 10
  skill: point_of_view
  construct: 'Characterize the narrating stance: reports closely observed detail, interprets little.'
  difficulty: hard
  dok: 3
  target_word:
  question_text: The events of the passage are told by someone who
  choice_a: understands exactly why her uncle behaves as he does
  choice_b: disapproves of the way her uncle runs the course
  choice_c: shares in every decision her uncle makes that day
  choice_d: is looking back on the day from many years later
  choice_e: reports what she notices without fully explaining it
  correct_answer: E
  distractor_types:
    A: too_broad
    B: wrong_concept
    C: opposite
    D: misidentified_detail
  explanation: |-
    The narrator records the covers, the worn grass, the counted quarters, and the running windmill, and leaves the meaning for the reader to assemble; her closing line admits some things her uncle 'would rather keep to himself.' A claims a completeness she disclaims; C invents disapproval; D is contradicted by his refusing to let her lay the covers; E moves her to a distance the same-day telling does not allow.
  source_ref:
  - H1-Q22
- id: T1-R11
  passage_id: T1-P2
  section: reading_comprehension
  item_type: reading_mc
  question_number: 11
  skill: tone_attitude
  construct: The narrator's attitude toward her uncle (compound-adjective options, as in the real set).
  difficulty: medium
  dok: 3
  target_word:
  question_text: The narrator's attitude toward her uncle is best described as
  choice_a: affectionate and watchful
  choice_b: impatient and critical
  choice_c: amused and teasing
  choice_d: anxious and fearful
  choice_e: distant and cold
  correct_answer: A
  distractor_types:
    B: partly_true_but_wrong
    C: wrong_concept
    D: inference_leap
    E: opposite
  explanation: |-
    She stays close to him, notices his small habits with evident fondness, and reads his silences with care — affectionate and watchful. A catches nothing warm in her; C mistakes her steadiness for teasing; D turns attentiveness into fear she never voices; E is the opposite of a narrator who lingers over every detail of him.
  source_ref:
  - H2-Q42
- id: T1-R12
  passage_id: T1-P2
  section: reading_comprehension
  item_type: reading_mc
  question_number: 12
  skill: figurative_craft
  construct: Interpret an image (worn artificial grass compared to a path across a lawn).
  difficulty: medium
  dok: 3
  target_word:
  question_text: The comparison of the worn grass to "a path worn across a lawn" (lines 24-26) mainly suggests
  choice_a: that the course has been badly cared for
  choice_b: that a whole season of use has left its trace on the greens
  choice_c: that the grass is real and needs to be mowed
  choice_d: that the narrator would rather be on a lawn
  choice_e: that the coming winter has already damaged the course
  correct_answer: B
  distractor_types:
    A: partly_true_but_wrong
    C: too_literal
    D: inference_leap
    E: wrong_concept
  explanation: |-
    The pale, flattened lanes record where 'a whole summer of sneakers' has crossed, so the image shows the season made visible. A reads the wear as neglect, but the point is the mark of use, not poor care; C takes 'grass' literally though it is artificial; D and E chase ideas the image does not raise.
  source_ref:
  - H2-Q24
- id: T1-R13
  passage_id: T1-P2
  section: reading_comprehension
  item_type: reading_mc
  question_number: 13
  skill: figurative_craft
  construct: Interpret a character's figurative phrasing ('children who would wake in April').
  difficulty: medium
  dok: 3
  target_word:
  question_text: Uncle Ray's way of speaking of the greens as "children who would wake in April" (lines 3-5) most suggests that he
  choice_a: wishes he had children of his own
  choice_b: finds the work of closing the course childish
  choice_c: thinks of the course as something he tends and will bring back to life
  choice_d: is afraid the course will not reopen in the spring
  choice_e: expects the greens to be ruined over the winter
  correct_answer: C
  distractor_types:
    A: inference_leap
    B: opposite
    D: partly_true_but_wrong
    E: wrong_concept
  explanation: |-
    'Putting it to bed,' with the greens as sleeping children, casts the closing as tender care for something living that will return — his attachment to the place. A leaps to a wish the passage never states; C reverses his seriousness about the task; D borrows the later mood of worry and forces it onto a gentle phrase; E contradicts the promise of April.
  source_ref:
  - H2-Q23
- id: T1-R14
  passage_id: T1-P2
  section: reading_comprehension
  item_type: reading_mc
  question_number: 14
  skill: vocabulary_in_context
  construct: Vocabulary in context; the common sense ('cautious') is the trap.
  difficulty: medium
  dok: 2
  target_word: careful
  question_text: As used in line 41, "careful" most nearly means
  choice_a: cautious
  choice_b: watchful
  choice_c: gentle
  choice_d: thrifty
  choice_e: generous
  correct_answer: D
  distractor_types:
    A: surface_match
    B: less_precise
    C: wrong_concept
    E: opposite
  explanation: |-
    'He is careful with his money' and 'counts the taffy quarters into paper rolls' — careful here means sparing with money, thrifty. 'Cautious' is the everyday sense of careful and the trap; 'watchful' is close but is about attention, not money; 'generous' is the opposite of what the counting shows.
  source_ref:
  - H2-Q6
- id: T1-R15
  passage_id: T1-P2
  section: reading_comprehension
  item_type: reading_mc
  question_number: 15
  skill: inference
  construct: Motive inference from a small refusal.
  difficulty: medium
  dok: 3
  target_word:
  question_text: Uncle Ray will not let the narrator lay the plywood covers (lines 9-11) chiefly because he
  choice_a: does not trust her with any part of the work
  choice_b: is annoyed with her that day
  choice_c: wants to get the covers done faster by himself
  choice_d: thinks the covers are too heavy for her to lift
  choice_e: believes the task must be done with a care he does not yet expect of her
  correct_answer: E
  distractor_types:
    A: too_broad
    B: wrong_concept
    C: inference_leap
    D: misidentified_detail
  explanation: |-
    He insists 'you have to set them down and not drop them, and there is a difference' — the covering is a careful act he keeps for himself. A overstates it, since he lets her pull flags and stack clubs; C invents a mood; D makes it about speed, though doing it himself is slower; E supplies a reason (weight) the passage never gives.
  source_ref:
  - H2-Q29
- id: T1-R16
  passage_id: T1-P2
  section: reading_comprehension
  item_type: reading_mc
  question_number: 16
  skill: inference
  construct: Inference about the subtext of a line of dialogue.
  difficulty: hard
  dok: 3
  target_word:
  question_text: The narrator's remark that Ray's answer, "Costs about nothing," "was not really an answer" (line 40) suggests that
  choice_a: Ray's real reason for leaving the windmill on is something he is not saying
  choice_b: Ray has made a mistake in his arithmetic
  choice_c: the narrator does not believe electricity is cheap
  choice_d: Ray cannot actually afford to run the windmill
  choice_e: the narrator wishes the windmill were shut off
  correct_answer: A
  distractor_types:
    B: too_literal
    C: misidentified_detail
    D: opposite
    E: inference_leap
  explanation: |-
    By calling the reply 'not really an answer,' the narrator signals that money is a cover for the real, unspoken reason. A treats it as a math error; B misreads the doubt as being about the cost of power; D flips the meaning, since he can plainly afford it; E invents a wish she never expresses.
  source_ref:
  - H2-Q31
- id: T1-R17
  passage_id: T1-P2
  section: reading_comprehension
  item_type: reading_mc
  question_number: 17
  skill: inference
  construct: Inference about the narrator's understanding in the closing lines.
  difficulty: hard
  dok: 3
  target_word:
  question_text: The last sentence (lines 51-56) suggests that the narrator
  choice_a: is annoyed that her uncle keeps things from her
  choice_b: has sensed something about her uncle that he has not put into words
  choice_c: intends to ask him about the windmill on the way home
  choice_d: believes he has simply forgotten to switch it off
  choice_e: has decided she no longer wants to help him
  correct_answer: B
  distractor_types:
    A: partly_true_but_wrong
    C: inference_leap
    D: opposite
    E: wrong_concept
  explanation: |-
    She leaves the windmill unmentioned 'because there are things you can see your uncle would rather keep to himself' — she has read a feeling he will not name and chooses not to press it. A hardens her tact into irritation; C has her breaking the silence she keeps; D misses that he chose to leave it on; E invents a decision the passage never reports.
  source_ref:
  - H2-Q48
- id: T1-R18
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 18
  skill: main_idea
  construct: Whole-passage main idea of an inserted classic excerpt.
  difficulty: hard
  dok: 3
  target_word:
  question_text: The passage is mainly concerned with
  choice_a: the design and architecture of an old New England house
  choice_b: how the town around Pyncheon Street was first founded
  choice_c: the troubling way the Pyncheon land was taken from Matthew Maule
  choice_d: the history of witchcraft trials throughout New England
  choice_e: a close friendship between Colonel Pyncheon and Matthew Maule
  correct_answer: C
  distractor_types:
    A: too_narrow
    B: too_broad
    D: too_broad
    E: opposite
  explanation: |-
    The excerpt traces how a powerful man's 'plausible claims' displaced an obscure settler and ends on Maule's death, so it is centrally about the dubious origin of the Pyncheon land. A shrinks it to the house; B and D swell it to the whole town or the whole witchcraft era; E reverses the relationship of the 'two ill-matched antagonists.'
  source_ref:
  - H2-Q30
- id: T1-R19
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 19
  skill: tone_attitude
  construct: The narrator's attitude toward Colonel Pyncheon's claim.
  difficulty: medium
  dok: 3
  target_word:
  question_text: The narrator's attitude toward Colonel Pyncheon's claim to the land is best described as
  choice_a: openly admiring
  choice_b: completely neutral
  choice_c: openly frightened
  choice_d: carefully suspicious
  choice_e: lightly amused
  correct_answer: D
  distractor_types:
    A: opposite
    B: partly_true_but_wrong
    C: wrong_concept
    E: wrong_concept
  explanation: |-
    The narrator withholds a flat verdict yet lets the phrase 'unduly stretched' and the hint of 'personal enmity' color the account against Pyncheon — a careful suspicion. A takes his side; C mistakes the narrator's caution for having no lean at all; D and E name feelings the measured prose never shows.
  source_ref:
  - H1-Q37
- id: T1-R20
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 20
  skill: supporting_detail
  construct: Locate a stated fact against near-miss detail.
  difficulty: medium
  dok: 2
  target_word:
  question_text: According to the passage, the long dispute between Pyncheon and Maule was finally ended by
  choice_a: a ruling handed down by the town court
  choice_b: a written agreement signed by both men
  choice_c: Maule's decision to give up his claim
  choice_d: the sale of the land to a third party
  choice_e: the death of Matthew Maule
  correct_answer: E
  distractor_types:
    A: misidentified_detail
    B: wrong_concept
    C: opposite
    D: misidentified_detail
  explanation: |-
    The passage states the quarrel 'remained for years undecided, and came to a close only with the death of the party occupying the disputed soil' — Maule. A and E invent a court ruling and a sale; B is ruled out by 'no written record'; D reverses the story, since Maule never surrendered his claim.
  source_ref:
  - H1-Q13
- id: T1-R21
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 21
  skill: figurative_craft
  construct: Interpret a metaphor of character ('iron energy of purpose').
  difficulty: medium
  dok: 3
  target_word:
  question_text: The description of Colonel Pyncheon as a man of "iron energy of purpose" mainly suggests that he was
  choice_a: determined and hard to turn aside
  choice_b: unusually strong in body
  choice_c: cruel simply for the pleasure of it
  choice_d: skilled at working with iron
  choice_e: calm, slow, and patient
  correct_answer: A
  distractor_types:
    B: too_literal
    C: inference_leap
    D: too_literal
    E: opposite
  explanation: |-
    'Iron' here names the hardness of his will, not his body or his trade: a forceful, unyielding determination. A and D read 'iron' literally; C leaps past 'determined' to deliberate cruelty the phrase does not assert; E is the opposite of iron energy.
  source_ref:
  - H1-Q44
- id: T1-R22
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 22
  skill: vocabulary_in_context
  construct: Vocabulary in context of an inserted passage; common wrong sense trap.
  difficulty: medium
  dok: 2
  target_word: plausible
  question_text: As used in the passage, "plausible" (Pyncheon 'asserted plausible claims') most nearly means
  choice_a: dishonest
  choice_b: seemingly reasonable
  choice_c: generous
  choice_d: strictly legal
  choice_e: perfectly obvious
  correct_answer: B
  distractor_types:
    A: wrong_concept
    C: wrong_concept
    D: less_precise
    E: less_precise
  explanation: |-
    A plausible claim is one that looks reasonable on its face, whatever the truth beneath it. 'Dishonest' imports the suspicion the narrator only hints at; 'strictly legal' and 'perfectly obvious' overstate it into proof; 'generous' does not fit a claim on someone else's land.
  source_ref:
  - H2-Q4
- id: T1-R23
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 23
  skill: vocabulary_in_context
  construct: Vocabulary in context; common wrong sense ('unclear') trap.
  difficulty: medium
  dok: 2
  target_word: obscure
  question_text: As used in the passage, "obscure" (Maule 'an obscure man') most nearly means
  choice_a: hard to understand
  choice_b: dishonest
  choice_c: little known
  choice_d: foreign
  choice_e: poor
  correct_answer: C
  distractor_types:
    A: surface_match
    B: wrong_concept
    D: wrong_concept
    E: less_precise
  explanation: |-
    Set against the 'prominent and powerful' Pyncheon, an 'obscure man' is one of no standing or fame — little known. 'Hard to understand' is the common sense of obscure and the trap; 'poor' is close to his condition but not what the word names; 'dishonest' and 'foreign' have no basis.
  source_ref:
  - H1-Q29
- id: T1-R24
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 24
  skill: inference
  construct: Motive inference grounded in the excerpt's account of the growing town.
  difficulty: hard
  dok: 3
  target_word:
  question_text: The passage suggests that Colonel Pyncheon most likely pressed his claim to Maule's ground because
  choice_a: he admired the sturdy hut Maule had built
  choice_b: he wished to punish Maule for a crime
  choice_c: the legislature had ordered him to seize it
  choice_d: the once-humble spot had grown valuable as the town spread
  choice_e: Maule had offered to sell it to him
  correct_answer: D
  distractor_types:
    A: opposite
    B: inference_leap
    C: misidentified_detail
    E: wrong_concept
  explanation: |-
    The passage notes the site 'had become exceedingly desirable' as the town grew, which is what draws the 'powerful personage' to claim it. A reverses his interest; C jumps to punishment, which belongs to the later witchcraft turn; D misreads the legislative grant as a command; E invents an offer that never occurs.
  source_ref:
  - H1-Q46
- id: T1-R25
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 25
  skill: inference
  construct: Inference about the narrator's stance from a deliberate hedge.
  difficulty: hard
  dok: 3
  target_word:
  question_text: The narrator's remark that it would be "bold... and possibly unjust, to venture a decisive opinion" about the dispute suggests that the narrator
  choice_a: truly has no opinion about who was right
  choice_b: thinks both men were equally to blame
  choice_c: regards the whole quarrel as unimportant
  choice_d: admires the Colonel's boldness in claiming the land
  choice_e: leans toward Maule but will not claim it as certain fact
  correct_answer: E
  distractor_types:
    A: opposite
    B: partly_true_but_wrong
    C: wrong_concept
    D: opposite
  explanation: |-
    The hedge is paired with 'unduly stretched,' so the narrator plainly leans toward Maule while refusing to state it as proven — the caution of one who suspects but cannot document. A takes the disclaimer at face value; B splits the blame the narrator does not split; D dismisses a matter the narrator treats seriously; E admires what the narrator quietly questions.
  source_ref:
  - H1-Q24
- id: T1-R26
  passage_id: T1-P3
  section: reading_comprehension
  item_type: reading_mc
  question_number: 26
  skill: inference
  construct: Inference about the function of a stated detail ('no written record').
  difficulty: hard
  dok: 3
  target_word:
  question_text: The detail that "no written record of this dispute is known to be in existence" mainly serves to suggest that
  choice_a: what is known rests on passed-down tradition, so certainty is impossible
  choice_b: the dispute never actually took place
  choice_c: Maule was without doubt the rightful owner
  choice_d: the Pyncheons deliberately destroyed the records
  choice_e: the town kept careful records of everything else
  correct_answer: A
  distractor_types:
    B: inference_leap
    C: partly_true_but_wrong
    D: inference_leap
    E: wrong_concept
  explanation: |-
    With nothing written and knowledge 'derived chiefly from tradition,' the narrator warns that the truth cannot be fixed with certainty, which is why he hedges his judgment. A over-reads absence of records into absence of events; B claims the certainty the detail denies; D invents a cover-up; E adds a contrast the passage never draws.
  source_ref:
  - H1-Q35
- id: T1-R27
  passage_id: T1-P4
  section: reading_comprehension
  item_type: reading_mc
  question_number: 27
  skill: main_idea
  construct: Whole-passage main idea / central urging of an inserted reflective essay.
  difficulty: hard
  dok: 3
  target_word:
  question_text: The passage is mainly concerned with urging readers to
  choice_a: work harder in order to escape poverty
  choice_b: question the customary way of living instead of assuming it is the only one
  choice_c: trust the advice handed down by their elders
  choice_d: give up all games and amusements
  choice_e: leave the city and take up farming
  correct_answer: B
  distractor_types:
    A: wrong_concept
    C: opposite
    D: too_narrow
    E: misidentified_detail
  explanation: |-
    The speaker calls settled habits into doubt — 'No way of thinking or doing, however ancient, can be trusted without proof' — and insists a different life can be chosen. B is the reverse of his view of elders; A and E take single images (work, the farmer) as the message; D lifts the 'games and amusements' remark out of its place as one example.
  source_ref:
  - H2-Q19
- id: T1-R28
  passage_id: T1-P4
  section: reading_comprehension
  item_type: reading_mc
  question_number: 28
  skill: authors_purpose
  construct: Purpose of a specific illustration (the farmer and his ox).
  difficulty: hard
  dok: 3
  target_word:
  question_text: The example of the farmer who insists one cannot live without meat, even as his ox drags the plough on 'vegetable-made bones,' is included mainly to
  choice_a: prove that a meat-free diet is the healthiest one
  choice_b: praise the strength of well-fed oxen
  choice_c: show that what people call a necessity may be mere habit that the facts contradict
  choice_d: explain the daily routine of running a farm
  choice_e: argue that farmers are made to work too hard
  correct_answer: C
  distractor_types:
    A: inference_leap
    B: too_literal
    D: misidentified_detail
    E: partly_true_but_wrong
  explanation: |-
    The ox, strong on the very food the farmer calls insufficient, quietly refutes the farmer's certainty and shows a 'necessity' that is only assumption. A turns the joke into a health claim the passage avoids; C and D take the ox and the farm literally; E borrows a different Thoreauvian theme not at work here.
  source_ref:
  - H2-Q2
- id: T1-R29
  passage_id: T1-P4
  section: reading_comprehension
