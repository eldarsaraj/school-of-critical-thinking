  target_word:
  question_text: The speaker's remarks about the advice of his 'seniors' imply that he believes
  choice_a: the young always know better than the old
  choice_b: the old should not be spoken to at all
  choice_c: experience is the only true teacher
  choice_d: growing old teaches a person little of real value
  choice_e: the old have simply forgotten what they once knew
  correct_answer: D
  distractor_types:
    A: too_broad
    B: inference_leap
    C: opposite
    E: misidentified_detail
  explanation: |-
    Having 'yet to hear the first syllable of valuable... advice' from his elders, the speaker doubts that age brings wisdom worth passing on. A overshoots into a claim that youth is always right; C turns doubt into refusing to speak with them; D reverses his low view of accumulated experience; E says they forgot, when he says they never learned much of value.
  source_ref:
