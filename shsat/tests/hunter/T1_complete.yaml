  question_text: The flock is described as "now a fist, now a sheet snapped sideways" (line 8) mainly to convey
  choice_a: how violent the birds have become
  choice_b: the great strength of the wind
  choice_c: the flock's constant, sudden changes of shape
  choice_d: the exact number of birds in the sky
  choice_e: that a storm is about to arrive
  correct_answer: C
  distractor_types:
    A: inference_leap
    B: misidentified_detail
    D: less_precise
    E: wrong_concept
  explanation: |-
    Two swiftly traded images — fist, then sheet — show a shape that will not hold still, the flock reforming moment to moment. A reads 'fist' as violence; C credits a wind the poem says 'stirs nothing else'; D and E look for a count or a storm the lines do not give.
  source_ref:
