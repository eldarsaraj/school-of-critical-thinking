writing_assignment:
  id: T1-W1
  test_id: Test 1 (baseline)
  section: writing
  item_type: writing_prompt
  question_number: 1
  mode: personal
  difficulty: hard
  time_allowed: about 40 minutes
  length_guidance: no more than two pages
  prompt: "Most of the time we are the ones being taught. Someone older shows us how to do\nsomething, and we are the ones listening, or watching, or getting it wrong until\nwe get it right.\n\nBut everyone has been on the other side of that at least once. There is something\nyou know how to do that someone else did not, and at some point you were the one\ndoing the explaining — to a younger brother or sister, a cousin, a friend, a\nneighbour, a grandparent, someone at school.\n\nWrite an essay or tell a true story about a time you taught someone else something.\nIt does not need to be an important skill, and it does not need to have gone well.\n\nYour essay or story must:\n\n  - describe the person you were teaching and what you were trying to teach them\n  - use specific detail so the reader can picture what actually happened\n  - show how you tried to explain it, including anything that did not work\n  - make clear what the experience showed you\n"
  rubric:
    dimensions_note: 'Five dimensions, scored independently. The descriptors below separate the top band from a competent middle band, since that is the distinction that decides this section — nearly every student reaching the writing sample can already write correct, organised prose.

      '
    voice_and_originality:
      top_band: 'Sounds like a particular person and nobody else. The subject is chosen because the writer actually has something to say about it rather than because it sounds impressive. Humour, if it appears, arises from the material. The reader finishes with a clear sense of how this writer notices things.

        '
      middle_band: 'Pleasant and sincere, but interchangeable with many other papers. The subject is a safe one and the writer''s attitude toward it stays general. Nothing is wrong; nothing is anyone''s in particular.

        '
    organization:
      top_band: 'Shape follows the thinking. The piece begins where the story actually begins, spends the most space where the most is happening, and ends at a point the writer chose rather than at the point where time ran out. Transitions are invisible because the order makes sense.

        '
      middle_band: 'Clear beginning, middle and end, with signposts doing the work that structure should do — first, then, next, finally. Every stage of the event gets roughly equal space whether or not it earns it.

        '
    development_and_detail:
      top_band: 'Details are specific, chosen, and could not belong to anyone else''s version of the event. The writer knows which moment matters and slows down for it. What went wrong is included rather than tidied away.

        '
      middle_band: 'Details are present and relevant but generic — the kind that could be supplied by anyone imagining the scene rather than remembering it. The account tends to summarise the event evenly rather than dwelling where it should.

        '
    language_and_vocabulary:
      top_band: 'Word choice is precise and unforced. Sentence lengths vary because the content varies, with short sentences used deliberately for weight. Ambitious words appear only where they are the right ones.

        '
      middle_band: 'Vocabulary is correct and sometimes reached for. Sentences run to a similar length and rhythm. Occasional large words are used slightly off, in ways that show they came from a list rather than from use.

        '
    mechanics:
      top_band: 'Spelling, punctuation and grammar are secure enough to be invisible. Any departure from standard usage is clearly deliberate and controlled, such as a fragment used for emphasis.

        '
      middle_band: 'Generally correct, with scattered errors that do not obstruct meaning — comma splices, an inconsistent tense, a few misspellings of harder words.

        '
    scoring_guidance: 'A paper can be flawless in mechanics and organisation and still sit in the middle band, and frequently does. Voice, originality and detail are what separate the top papers, because they are the dimensions that cannot be prepared in advance. Readers should be careful not to reward length, handwriting or an impressive topic, none of which predicts the qualities this section exists to find.

      '
  annotated_model_response:
    length: 384 words, 9 paragraphs
    readability_note: 'Flesch-Kincaid grade 5.0, mean sentence length 13.2 words, ranging from 4 words to 42. The low readability figure is a feature rather than a fault: the vocabulary is plain and the sentences are mostly short, and the quality lives in what is noticed rather than in how elaborately it is said. A model written at a higher grade level would misrepresent what a strong 6th-grade paper looks like.

      '
    text: 'My cousin Dalia is seven and she wanted to learn to float. She had been at the

      pool all summer holding onto the wall.


      The first thing I told her was to lie back, and she did lie back, but she also

      held her breath and made her whole body stiff like a board, and she sank. Not

      all the way. Just enough that water went up her nose. She came up mad at me.


      I tried explaining it three different ways. I said imagine you are lying on your

      bed. I said pretend there is a hand under you. I said just relax, which is the

      worst thing you can tell somebody, because nobody in history has ever relaxed

      from being told to relax.


      What finally worked was an accident. She got tired of me and started floating on

      her back while she was complaining about how she couldn''t float. She was talking

      the whole time, saying it''s not working, it''s not working, and her ears were

      under and her stomach was up and she was completely floating. I did not say

      anything. I have never wanted to say something so much in my life. I just let her

      keep complaining until she noticed.


      When she noticed she screamed and sank. Then she did it four more times on purpose.


      Here is the part I keep thinking about. I did not teach her anything. Everything

      I said was useless. Floating is not something you do, it is something you stop

      doing, and there is no way to explain that to a person. They have to be distracted

      into it.


      My mom taught me to float when I was six and I do not remember one thing she said.

      What I remember is the sound of being just under the water, how everything gets far

      away and close at the same time. That is probably all Dalia will remember too.


      She is a better floater than me now. She does it in the deep end with her arms out

      and her eyes shut, and she stays up as long as she wants, and when I ask her how

      she does it she says I don''t know, you just do it.


      Which is exactly right, and also completely useless, which I guess is the point.

      '
    annotations:
    - paragraph: 1
      note: 'Two sentences and the situation is complete: who, how old, what she wanted, how long she had been stuck. "Holding onto the wall" does the work that a paragraph of description would do badly. The piece begins where the story begins, with no throat-clearing about how the writer has always loved swimming.

        '
      dimension: organization
    - paragraph: 2
      note: '"Stiff like a board" is ordinary; "water went up her nose" is not, because it is what actually happens and most writers would leave it out as unglamorous. "She came up mad at me" is the first sign the writer will not tidy the event into a success story.

        '
      dimension: development_and_detail
    - paragraph: 3
      note: 'Three failed explanations listed in three parallel sentences, then a joke the material earned: nobody has ever relaxed from being told to relax. This is voice — an observation the writer made rather than borrowed. The prompt asked for what did not work, and this paper treats that instruction as the interesting part rather than an obligation.

        '
      dimension: voice_and_originality
    - paragraph: 4
      note: 'The longest paragraph sits on the moment that matters, which is correct proportioning. The run-on in the middle — "and her ears were under and her stomach was up and she was completely floating" — imitates the rush of noticing. "I have never wanted to say something so much in my life" is restraint described rather than claimed.

        '
      dimension: development_and_detail
    - paragraph: 5
      note: 'Sixteen words after an eighty-word paragraph. The contrast gives the sentence its weight, and "four more times on purpose" conveys the child''s delight without narrating it.

        '
      dimension: language_and_vocabulary
    - paragraph: 6
      note: 'The reflection arrives as a genuine puzzle rather than a lesson: the writer concludes that the teaching failed and the learning happened anyway. "Floating is not something you do, it is something you stop doing" is the paper''s real idea, and it is specific to floating rather than a general moral that could be pasted onto any story.

        '
      dimension: voice_and_originality
    - paragraph: 7
      note: 'Widening the frame at exactly the right moment. The writer''s own memory contains no instruction either, which quietly confirms the idea instead of restating it. "Everything gets far away and close at the same time" is the one lyrical sentence in the piece, and it works because the writer has spent eight paragraphs earning it.

        '
      dimension: development_and_detail
    - paragraph: 8
      note: 'Dalia''s own words, unquoted and unpunctuated, land better than dialogue with quotation marks would. The detail that she is now better than the writer is generous and slightly funny, and a weaker paper would have kept the writer at the centre.

        '
      dimension: voice_and_originality
    - paragraph: 9
      note: 'Ends on a shrug rather than a conclusion, and is the stronger for it. Compare the version this paper avoided: "I learned that teaching someone is really about patience." The ending it has is truer and sounds like a person; the ending it avoided is what most papers do.

        '
      dimension: organization
    why_this_sits_in_the_top_band: 'The mechanics are sound but unremarkable, and that is not what earns the score. What earns it is that the paper reports a failure honestly, arrives at an idea the writer clearly reached rather than retrieved, proportions its paragraphs to what matters, and sounds like one specific twelve-year-old throughout. A reader could pick this paper out of a hundred.

      '
  common_pitfalls:
  - pitfall: The tacked-on moral
    description: 'The paper narrates an event competently and then closes with a sentence stating what was learned, in language borrowed from adults: teaching taught me patience, I realised helping others is its own reward. The reflection sits on top of the story rather than growing out of it, and readers spot it instantly because the register changes in the final line.

      '
    what_to_do_instead: 'Let the thinking happen inside the story. If the writer cannot say what the experience showed them without sounding like a greeting card, the honest move is to describe what puzzled them about it, as the model does.

      '
  - pitfall: Events without weight
    description: 'A list of what happened, in order, with every stage given the same amount of space. First we went to the pool, then I showed her, then she tried, then she did it, then we went home. Nothing is wrong and nothing is chosen.

      '
    what_to_do_instead: 'Find the single moment the story is actually about and give it the most room. Everything before it is setup and can be brief.

      '
  - pitfall: Choosing an impressive subject over a real one
    description: 'Reaching for something that sounds significant — teaching a younger sibling to read, helping a grandparent through an illness — and then having nothing specific to say about it, because it was chosen for how it sounds rather than for what the writer remembers.

      '
    what_to_do_instead: 'Pick the memory with the most detail attached to it, however small the subject. A paper about teaching someone to whistle, told precisely, beats a vague paper about something momentous.

      '
  - pitfall: Vocabulary worn as decoration
    description: 'Large words inserted to signal effort, often slightly misused, in sentences that are otherwise plain. A word that came from a vocabulary list rather than from the writer''s own speech is visible immediately and works against the paper.

      '
    what_to_do_instead: 'Use the word that is exactly right, which is usually a plain one. Precision reads as sophistication; reaching does not.

      '
math_rebuild_note: QR (Q01-Q37) and MA (M01-M47) were regenerated as construct-faithful structural twins of the real ISEE-ML / Hunter-sample math items in the project dataset. Each item's source_ref names the real item it twins; 'construct' states the latent skill. PT-QR-6/28/31 and PT-MA-7/8/39 were the six dataset items dropped to fit the 37+47 form.
