    D: last_step_trap
  distractor_trace:
    A: solves for y = 4 and reports that
    B: reports the given quantity 3y − 2 = 12 after finding 3y
    D: doubles to get 6y = 24 but forgets the − 4
  explanation: 'Notice that 6y − 4 is exactly twice 3y − 2. Since 3y − 2 = 10, doubling both sides gives 6y − 4 = 20, with no need to find y. (Checking: 3y − 2 = 10 gives y = 4, and 6·4 − 4 = 20.) A reports y itself; B reports the original 12; D forgets to subtract 4. Verified: 20.'
