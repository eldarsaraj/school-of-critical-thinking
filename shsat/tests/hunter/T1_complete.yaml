  question_text: '[VISUAL: four coordinate graphs, each showing one straight line. (A) a line rising gently, slope about 1; (B) a line rising steeply, slope about 3; (C) a line falling steeply, slope about −3; (D) a line falling gently, slope about −1.] For which line does the y-value increase at the greatest rate as x increases?'
