  choice_a: are waiting for someone else to arrive
  choice_b: are so held by the sight that they forget the cold
  choice_c: cannot get the car to start
  choice_d: are afraid to move while the birds are near
  choice_e: are in the middle of an argument
  correct_answer: B
  distractor_types:
    A: misidentified_detail
    C: wrong_concept
