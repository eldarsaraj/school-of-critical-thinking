  vocab_words_tested: none
  register_collision_check: 'Checked against all three corpus poems. H1-B and H2-D are both Chicago, both mid-20th century, both first-person and both built on a family pair (mother and son; nephew and uncle). H2-B is a figurative journey with a first-person speaker and the "men with maps." This poem takes none of those: a gymnasium rather than a street, office or road; present day rather than mid-century; first-person plural rather than singular; and a community of strangers rather than a family pair. No fourth first-person-boy narrator — the one child in the poem is observed, not narrating. It also avoids landscape, which would have run at H1-E and H2-C. Internal check against the four generated passages: an earlier candidate, a poem on the painted outline a demolished building leaves on its neighbour, was rejected because its subject (absence as a record) would have echoed T1-P1 on damage as evidence. This poem''s subject is inherited order persisting, which nothing else in the form touches.

    '
  text: "    The cots came in on Tuesday, forty of them,\n    and the men who carried them set each one down\n    inside a painted line, because the lines were there.\n    Nobody told them to. By morning the whole floor\n5   had arranged itself: a row along the baseline,\n    two rows in the key, one cot at center court\n    where a woman sleeps with her arm across her eyes.\n\n    The scoreboard is dark. It has been dark for days\n    and still we look at it, the way you check a clock\n10  whose hands you know have stopped. Someone has stacked\n    the folded bleachers to the wall. Someone else\n    has swept, though there is nothing here to sweep,\n    only the shine the floor keeps giving back.\n\n    At six the light comes through the high windows\n15  in four long rectangles and lies down on the boards\n    like something let in for the night. A boy of eight\n    walks the center circle heel to toe, arms out,\n    the way you would cross a log above a creek.\n    He has never seen a game played here. He does not know\n20  what the circle was for. He only knows it is a line\n    and that a line asks you to follow it.\n\n    Mr. Alvarez has put his shoes at the free-throw stripe,\n    squared, the toes exactly on the paint.\n    He is eighty-one and he has not played anything\n25  in fifty years. When I asked him why, he shrugged\n    and said a man likes to know where his feet go.\n\n    Outside, the water is still deciding where to stop.\n    Inside, the room keeps saying: stand here, wait there,\n    this is your part of the floor, this is where you start.\n30  We came in with nothing arranged\n    and the floor arranged us, in a language\n    none of us was taught and all of us can read.\n"
- id: T1-P6
  test_id: Test 1 (baseline)
  slot: 6
  title: Jam Wave
  genre: contemporary_informational
  era: contemporary
  source_type: original
  source_citation:
  setting_place: a multi-lane highway; no named location
  setting_period: present day
  narrator_pov: third-person expository, with brief second-person address to the reader
  central_relationship: none — expository
  topic: why a traffic jam can form, travel and persist with no obstruction anywhere in it
  mood: brisk, explanatory, mildly wry
  word_count: 450
  line_count: 41
  fk_grade: 9.6
  mean_sentence_length: 21.4
  n_items: 8
  skills_covered: main_idea; supporting_detail; vocabulary_in_context; inference; authors_purpose
  vocab_words_tested: absorb; signal
  register_collision_check: 'Nearest collision is internal, with T1-P1: both are contemporary informational prose in a third-person expository voice, and that pairing was unavoidable once the form was set at three contemporary passages. The two are kept apart on every other axis. T1-P1 argues a position about how repairs ought to be made and closes on a value claim; this passage explains a mechanism and closes on why a known remedy goes unused. This one addresses the reader directly ("You crawl for twenty minutes"), which T1-P1 never does, and it is science rather than ethics. Against the corpus, H1-E is a first-person essayist meditating on a natural wonder; this has no first person, no landscape and no wonder. Neither "absorb" nor "signal" appears in vocab_words_tested.

    '
  text: "    Nothing happened. That is the strangest feature of the ordinary traffic\n    jam, and the part most drivers refuse to believe. You crawl\n    for twenty minutes, you round a curve braced for the wreckage\n    that must be causing it, and there is nothing there: no\n5   collision, no stalled truck, no lane closed for work. The road\n    opens and you drive away wondering what you sat in. Traffic\n    engineers have a name for it: they call it a jam\n    wave, and the word wave is doing real work in that\n    phrase. What moved backward through the highway was a disturbance travelling\n10  through the cars, in the way a ripple travels through water\n    without carrying the water along with it. Here is how one\n    begins. Traffic is dense but flowing, every driver a little closer\n    to the next than judgment would advise. One driver taps the\n    brake for reasons of his own, and the driver behind him\n15  is following too closely to respond gently, so she brakes somewhat\n    harder. The next brakes harder still. Because each driver reacts a\n    fraction of a second late and overcorrects slightly to make up\n    for it, the disturbance grows as it travels backward, and perhaps\n    twenty cars behind the first tap, someone is brought to a\n20  complete stop. That stopping point is the jam, and the stopping\n    point moves. As the cars at its front accelerate away and\n    fresh cars pile in at its back, the jam slides backward\n    along the road at roughly twelve miles an hour, steady and\n    indifferent, while every car inside it is travelling forward. Follow it\n25  long enough and none of the vehicles caught in the original\n    slowdown is still in it. The jam has outlived its own\n    contents. This is why the search for a cause fails so\n    reliably. The tap on the brake that began the whole thing\n    happened twenty minutes ago and four miles up the road, and\n30  the driver who made it noticed nothing and is home by\n    now. The same reasoning points to a remedy that feels like\n    surrender. A driver who leaves a wide gap ahead of her\n    can absorb the wave instead of passing it on: when the\n    car in front stops, she coasts, spending the gap rather than\n35  the brake, and the cars behind her never receive the signal.\n    Experiments on test tracks, and measurements taken from instrumented highways, suggest\n    that a small fraction of drivers doing this can smooth the\n    flow for everyone behind them. The obstacle is human rather than\n    technical, since the gap looks to every other driver like an\n40  invitation to merge, and to the driver keeping it like ground\n    she has already paid for and is now giving away.\n"
