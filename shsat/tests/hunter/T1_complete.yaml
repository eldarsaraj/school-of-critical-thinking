  text: "    A museum conservator's most useful tool is not a brush or\n    a solvent but a decision,\
    \ made early and defended for decades,\n    about what a damaged object is for. For most of the\n\
    \    history of collecting that decision was easy: a chipped Greek cup\n5   was filled and painted\
    \ to match, a darkened canvas was scrubbed\n    bright, and the goal in both cases was wholeness.\
    \ An object\n    should look the way its maker had meant it to look,\n    and the repair should be\
    \ invisible; restorers took real pride in\n    work that no visitor could detect. That standard has\
    \ been abandoned,\n10  and not because conservators became less skilled at meeting it. They\n    became\
    \ less confident, on purpose. Every generation of restorers has been\n    certain it knew what an\
    \ object originally looked like, and every\n    generation has been corrected by the one that followed\
    \ it. Nineteenth-century\n    restorers gave armless Roman statues new arms in poses the sculptors\n\
    15  never used, and cleaners stripped away varnish that turned out to\n    be original glaze. Each\
    \ of those mistakes was made carefully, by\n    experts, with confidence. So the field adopted a rule\
    \ that sounds\n    like modesty and works like a wager: any treatment must be\n    reversible. The\
    \ fill must come out, the varnish must dissolve, the\n20  added arm must unscrew. A conservator today\
    \ assumes that someone in\n    2150 will know things she does not, and she works to\n    leave that\
    \ person room. The rule has a stranger consequence, and\n    it is the one visitors notice. If a repair\
    \ must be\n    undoable it helps enormously for the repair to be findable, and\n25  so the best modern\
    \ fills announce themselves. A missing section of\n    a Roman mosaic is replaced with plain gray\
    \ plaster, tinted close\n    enough that the eye does not snag on it but never\n    close enough to\
    \ fool anyone. Step nearer and the seam appears.\n    The vase is whole from across the room and frankly\
    \ broken\n30  from three feet away. This unsettles visitors who expect a museum\n    to show them\
    \ the thing itself, but the alternative is worse\n    than ugly, because damage is evidence. A crack\
    \ records a fall,\n    a fire, a route through a war. Smooth it away and\n    the object looks sound\
    \ and still answers questions, except that it\n35  now answers them wrongly, with a confidence it\
    \ has not earned.\n    A seamless restoration offers a claim about the injuries as though\n    the\
    \ claim itself were the object. Conservators sometimes describe their work\n    as arrested rather\
    \ than finished, and the phrasing is exact, because\n    they stop a process without concluding it.\
    \ The visible mend is\n40  the discipline's way of saying so out loud, a line drawn\n    across an\
    \ object to mark where our knowledge ends and someone\n    else's begins.\n"
