- id: T1-P1
  test_id: Test 1 (baseline)
  slot: 1
  title: The Useful Blur
  genre: contemporary_informational
  era: contemporary
  source_type: original
  source_citation:
  setting_place: none — an essay about maps and description
  setting_period: present day
  narrator_pov: third-person expository; unnamed essayist
  central_relationship: none — expository
  topic: why a useful description must leave the right things out
  mood: measured, analytical, lightly provocative
  word_count: 508
  line_count: 48
  fk_grade: 11.2
  mean_sentence_length: 24.2
  n_items: 9
  skills_covered: main_idea; authors_purpose; structure; vocabulary_in_context; inference
  vocab_words_tested: faithful; contrived
  text: |2
       A map that reproduced everything would be worthless, and the reason
       repays a moment's attention, because it runs against instinct. We are
       trained to admire a description for its thoroughness, as if the
       best account of a thing were the one that left nothing
     5 out. The mapmaker understands otherwise. Picture a map drawn to the
       scale of the country itself, a full mile of paper for
       every mile of ground, each fence and ditch and blade of
       grass marked exactly where it lies. Such a map would be
       a marvel of accuracy and of no earthly use. To consult
    10 it you would first have to spread it across the very
       landscape it copied, and then you would find yourself standing in
       the ordinary world again, no wiser than before. The map would
       have duplicated the territory rather than explaining it.
       The usefulness of a map derives from the very material it
    15 consents to omit. A road map suppresses the forests so that
       the road can be followed; a subway map disregards the real
       distances and forces the tangled rails into tidy parallel lines so
       that a passenger may grasp, in a single glance, where one
       route crosses another. Each such map is a species of deliberate
    20 untruth, and each untruth is committed in the service of a
       clarity the traveler actually requires. The cartographer's art consists not in
       the capacity to observe everything but in the discernment to decide
       what can be sacrificed without penalty, a decision that means nothing
       except in relation to the particular question the map has been
    25 made to settle. A chart invaluable to a hiker is useless
       to an airline pilot, not because either is the more faithful
       to the land beneath it, but because the two have elected
       to disregard entirely different things.
       The lesson is an uncomfortable one, because omission wears the outward
    30 appearance of neglect. The student filling a notebook longs to preserve
       the entire lecture; the researcher with a sensitive new instrument is
       tempted to register every digit it will surrender. Yet a note
       that transcribes a lecture word for word has not been taken
       at all, and a quantity reported to more decimal places than
    35 the problem demands is not the more exact, only the more
       laborious to read. Information in excess of the purpose at hand
       does not refine a picture; it obscures it. The understanding, no
       less than the map, arrives at the meaning of a thing
       chiefly by retaining a handful of its features and permitting the
    40 remainder to recede.
       So when some streamlined diagram appears to condescend to your intelligence,
       entertain the possibility that its author performed the more demanding labor,
       the labor of exclusion. Addition asks little of anyone. Only a
       settled sense of the destination can disclose which of a thousand
    45 particulars will prove to be so much clutter along the way.
       The worthiest map is to be judged less by the abundance
       it manages to carry than by the abundance it has contrived,
       with purpose and with skill, to leave behind.
- id: T1-P2
  test_id: Test 1 (baseline)
  slot: 2
  title: Off Season
  genre: contemporary_literary_fiction
  era: contemporary
  source_type: original
  source_citation:
  setting_place: a miniature-golf course on a highway, on the last day of the season
  setting_period: present day, the last Sunday in October
  narrator_pov: first-person, a girl (the narrator), same-day narration
  central_relationship: niece and uncle
  topic: closing a miniature-golf course for winter; the uncle leaves the windmill running
  mood: watchful, affectionate, withheld
  word_count: 575
  line_count: 56
  fk_grade: 6.8
  mean_sentence_length: 22.1
  n_items: 8
  skills_covered: figurative_craft; vocabulary_in_context; inference; tone_attitude; point_of_view
  vocab_words_tested: careful
  text: |2
       My uncle Ray runs the miniature golf on Route 9, and
       on the last Sunday in October I go with him to
       put it to bed. That is what he calls it, putting
       it to bed, as though the eighteen little greens were children
     5 who would wake in April. We pull the flags and stack
       the clubs by color along the fence. We carry the plywood
       covers out to the holes and lower them over the cups
       so that the leaves will not pack down into them all
       winter. Uncle Ray lays the covers himself. He will not let
    10 me, because, he says, you have to set them down and
       not drop them, and there is a difference between the two.
       The course sits between a car wash and a field that
       used to be something and is now only weeds taller than
       I am. In summer there are birthday parties, and boys who
    15 swing the little clubs too hard, and a line at the
       window where Ray sells taffy and hands out the putters and
       keeps the score cards in an old cigar box. On the
       last Sunday of the season there is nobody at all but
       the two of us and the cars going by on their
    20 way to somewhere else. The artificial grass has worn flat and
       colorless straight down the middle of every hole, where a whole
       summer of sneakers has crossed it, and it has stayed a
       bright unnatural green only along the edges that nobody has any
       reason to walk, so that you can read the season in
    25 the carpet the way you can read a path worn across
       a lawn.
       He saves the windmill for last. It is the eighth hole,
       a wooden windmill as tall as I am, painted blue, its
       four sails turned by a motor, with a gap at the
    30 bottom the ball has to slip through when the sails swing
       up out of the way. All afternoon it has been turning
       over an empty green. When everything else is covered and the
       clubs are locked inside and the taffy is counted into its
       tin, Uncle Ray stands in front of the windmill with his
    35 hands in his jacket and looks at it a long moment.
       Then he walks around behind it, and I hear the small
       motor catch, and the sails keep turning.
       "You're leaving it on," I said. It was nearly dark by
       then.
    40 "Costs about nothing," he said, which was not really an answer.
       He is careful with his money. He counts the taffy quarters
       into paper rolls at his kitchen table on Sunday nights.
       We stood there a while without saying anything more. The sails
       went around, blue against a sky that had gone the color
    45 of a nickel, and threw a slow shadow that swept over
       the covered holes and the flattened grass and over the two
       of us and around again. A car slowed on Route 9
       and I thought for a second it was turning in, but
       it was only somebody reading the sign, and then it drove
    50 on.
       "All right," Uncle Ray said at last, though no one had
       asked him anything. He did not turn the windmill off. We
       climbed into the truck and left it turning behind us in
       the dark, and he did not say why, and I did
    55 not ask him, because there are things you can see your
       uncle would rather keep to himself.
- id: T1-P3
