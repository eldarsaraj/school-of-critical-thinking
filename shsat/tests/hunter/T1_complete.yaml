    D: solves correctly but reports the nickels
  explanation: 'Swapping turns each nickel into a dime (+5¢) and each dime into a nickel (−5¢), so the change is 5 × (nickels − dimes) = 20¢, giving nickels − dimes = 4. With nickels + dimes = 12, there are 8 nickels and 4 dimes. D reports the nickels. Verified: 8 nickels, 4 dimes, swap gain 20¢.'
