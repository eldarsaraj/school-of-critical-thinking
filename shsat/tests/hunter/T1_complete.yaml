- id: T1-Q21
  section: quantitative_reasoning
  item_type: word_problem
  question_number: 21
  skill: Data Analysis & Probability
  construct: 'Reason about properties of statistics: the mode is always an actual data value and the range is not a measure of central tendency, while the median of an even-sized set is the average of the two middle values and need not equal any recorded value.'
  difficulty: hard
  dok: 3
  question_text: A coach recorded the number of goals her team scored in each of 20 games and displayed the results. Which measure of central tendency is NOT guaranteed to equal one of the 20 individual game scores?
  column_a:
  column_b:
  choice_a: mean
  choice_b: median
  choice_c: mode
  choice_d: range
  choice_e:
  correct_answer: B
  distractor_types:
    A: wrong_setup
    C: fast_pattern_match
    D: wrong_setup
  distractor_trace:
    A: forgets that the mean is also asked as a value that could match
    C: picks the mode, which is by definition one of the scores
    D: picks the range, forgetting it is not a measure of central tendency
  explanation: 'With 20 scores (an even number), the median is the average of the 10th and 11th values, so it can land between two whole scores and match none of them. The mode is by definition the most frequent recorded value, so it is always one of the scores; the range is a spread, not a measure of central tendency, so it does not belong to the list of centers. That leaves the median as the measure not guaranteed to equal an actual score. Verified logically: even n makes the median a two-value average.'
  source_ref:
  - SQ-QR-7
