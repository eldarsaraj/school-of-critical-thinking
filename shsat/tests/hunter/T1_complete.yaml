    D: thinks 'could have received' leaves the count open, though the minimum is fixed
  explanation: 'Use as many large coins as possible: 7 quarters make $1.75, leaving $0.12, which is 1 dime and 2 pennies. That is 7 + 1 + 2 = 10 coins, and no combination of quarters, dimes, and pennies makes $1.87 with fewer. Since 10 is greater than 9, Column A is greater. Verified: greedy minimum for 187 cents is 10 coins.'
