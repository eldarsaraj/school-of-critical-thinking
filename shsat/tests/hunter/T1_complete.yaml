  question_text: The tone of the passage is best described as
  choice_a: gentle and reassuring
  choice_b: bitter and without hope
  choice_c: light and joking
  choice_d: challenging and questioning
  choice_e: hesitant and unsure
  correct_answer: D
  distractor_types:
    A: opposite
    B: partly_true_but_wrong
    C: wrong_concept
    E: opposite
  explanation: |-
    The speaker presses the reader to doubt inherited ways and to see that 'it is never too late to give up our prejudices' — a challenging, questioning voice. A softens him; B stops at the 'desperation' and misses the summons to change; D mistakes his sharpness for jokes; E denies the confidence of his flat pronouncements.
