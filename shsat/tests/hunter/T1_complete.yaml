  text: "    My grandfather sells at the swap meet in the parking lot\n    behind the roller rink, first\
    \ Sunday of the month, and I\n    go with him because somebody has to make change. He does\n    not\
    \ trust the app on my phone. He keeps a cigar\n5   box with a rubber band around it and counts out\
    \ bills\n    like he is dealing cards. We sell tools, and not new\n    ones. Planes and chisels and\
    \ squares, most of them older than\n    he is, laid out on a folding table with a green\n    blanket\
    \ over it. He is particular about the blanket. He says\n10  a tool on bare metal looks like it is\
    \ being got\n    rid of. There was a plane he never sold. A big\n    one, a jointer, almost as long\
    \ as my arm, with a\n    knob at the front worn down on one side from the\n    way somebody used to\
    \ hold it. Men came for it. There\n15  is a man named Dennis who comes every month in a\n    truck\
    \ with his name painted on the door, who calls me\n    young lady every single time as though he has\
    \ just thought\n    of it, and every month he asks about the jointer, and\n    every month my grandfather\
    \ says it is not for sale, and\n20  Dennis laughs like it is a joke the two of them\n    are doing\
    \ together. That Sunday a kid came. Not a kid,\n    a man, but young, maybe twenty, in a work shirt\
    \ with\n    paint on the cuffs. He picked up three things and put\n    them all back. Then he stood\
    \ in front of the jointer\n25  for a while without touching it. \"What's this one do,\" he\n    said.\
    \ My grandfather told him. Then he told him more than\n    that. He showed him how the blade sat,\
    \ and he ran\n    his thumb along the edge the way he tells me never\n    to do, and the edge was\
    \ keen, because he had dressed\n30  it Saturday night at the kitchen table with the whetstone and\n\
    \    the little dish of oil, which I had not thought about\n    until then. The young man said he\
    \ was fixing up a\n    house. He said the floors were bad. He asked what a\n    thing like this would\
    \ cost, and my grandfather said sixty dollars.\n35  I said, \"Grandpa.\" He did not look at me. Dennis\
    \ had\n    offered four hundred in March. I was there. I wrote it\n    in the book. The young man\
    \ counted out the money in\n    tens, and my grandfather wrapped the plane in newspaper, which he\n\
    \    does not do for anything else, and carried it out to\n40  the car himself, and I watched them\
    \ from behind the table,\n    two men bent over an open trunk, my grandfather's hands going\n    the\
    \ way they go when he is explaining. When he came\n    back he did not say anything about it. He moved\
    \ the\n    block plane over to where the jointer had been, and then\n45  the squares, and then the\
    \ level, closing up the space so\n    that you would not know. He straightened the blanket. Then he\n\
    \    sat down in his chair and looked out at the lot\n    for a while, at the people going by with\
    \ their arms\n    full, and he said, \"Cold for June.\" It was not cold.\n"
