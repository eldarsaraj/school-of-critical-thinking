  question_number: 47
  skill: vocabulary_in_context
  construct: Vocabulary in context; common wrong sense ('spoken') trap.
  difficulty: medium
  dok: 2
  target_word: pronounced
  question_text: As used in line 22, "pronounced" most nearly means
  choice_a: spoken out loud
  choice_b: more clearly marked
  choice_c: declared final
  choice_d: made straight
  choice_e: worn shallow
  correct_answer: B
  distractor_types:
    A: surface_match
    C: less_precise
    D: opposite
    E: wrong_concept
  explanation: |-
