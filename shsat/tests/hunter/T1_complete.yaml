  difficulty: medium
  dok: 3
  question_text: Bill has 12 coins, all nickels and dimes. If each of his nickels were a dime and each of his dimes were a nickel, his coins would be worth 20 cents more. How many dimes does Bill have? (1 nickel = $0.05; 1 dime = $0.10.)
