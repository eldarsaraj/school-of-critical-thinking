- id: T1-R42
  passage_id: T1-P5
  section: reading_comprehension
  item_type: reading_mc
  question_number: 42
  skill: main_idea
  difficulty: hard
  dok: 3
  target_word: null
  question_text: Throughout the poem, the speaker comes to see that
  choice_a: a storm can force strangers together
  choice_b: a gym makes a poor shelter
  choice_c: the boy has learned something new
  choice_d: old lines still arrange new people
  choice_e: the people long to go home
  correct_answer: D
  distractor_types:
    A: too_broad
    B: opposite
    C: too_narrow
    E: inference_leap
  explanation: 'Every scene in the poem is the same discovery made again. Men lay beds inside markings
    nobody enforces. A boy treats a circle as a beam. An old man sets his shoes on a stripe. The last
    stanza names what they have in common: the floor arranged us. Markings made for a game are still telling
    people where to be, and D says so. A is true of the situation and would be true of any shelter anywhere;
    it does not touch the lines, which are what the poem keeps returning to. B reverses the poem''s finding,
    since the room turns out to serve these people better than they expected. C takes one figure of the
    four and makes him the subject, and the boy is presented as an instance rather than a learner. E supplies
    a longing the poem never voices — nobody in it speaks of home.

    '
  source_ref:
  - H2-Q19
  - H2-Q30
- id: T1-R43
  passage_id: T1-P6
  section: reading_comprehension
  item_type: reading_mc
  question_number: 43
  skill: main_idea
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The passage is best described as an explanation of
  choice_a: why highways are built too narrow
  choice_b: how drivers can avoid being late
  choice_c: why a jam can outlast its cause
  choice_d: what happens when drivers follow closely
  choice_e: why drivers brake more than they should
  correct_answer: C
  distractor_types:
    A: wrong_concept
    B: inference_leap
    D: too_narrow
    E: partly_true_but_wrong
  explanation: 'The whole passage is built to answer one question: how can you sit in a jam for twenty
    minutes and then find nothing at the end of it? The answer is that the jam is a wave rather than a
    place, that it travels away from whatever started it, and that the cause was gone long before you
    arrived. C names that. A blames the road, which the passage never does; the highway in it is working
    normally. B treats the piece as advice for the reader, but the remedy near the end helps the drivers
    behind rather than the one who applies it. D names the condition a jam wave needs, and the passage
    does say that drivers travel closer to one another than judgment advises. But that is the setup rather
    than the subject, and everything the passage finds interesting happens after it. E names something
    the passage explicitly describes — drivers do overcorrect — but that is one step in the mechanism,
    not what the passage sets out to explain.

    '
  source_ref:
  - H1-Q38
  - H2-Q19
- id: T1-R44
  passage_id: T1-P6
  section: reading_comprehension
  item_type: reading_mc
  question_number: 44
  skill: supporting_detail
  difficulty: medium
  dok: 2
  target_word: null
  question_text: According to lines 12-20, the disturbance grows as it travels backward because each driver
  choice_a: reacts late and brakes too hard
  choice_b: is driving faster than the one ahead
  choice_c: wants to leave a larger gap
  choice_d: cannot see the road far enough ahead
  choice_e: is distracted by something in the car
  correct_answer: A
  distractor_types:
    B: wrong_concept
    C: opposite
    D: inference_leap
    E: misidentified_detail
  explanation: 'The passage states the mechanism directly: each driver reacts a fraction of a second late
    and overcorrects slightly to make up for the delay. Lateness plus overcorrection is what makes each
    braking a little sharper than the one before it, until someone twenty cars back has to stop. B substitutes
    a difference in speed for a difference in timing; the passage has the traffic flowing evenly before
    the first tap. C reverses the situation, since the cars are following closer than judgment would advise,
    and leaving a larger gap is the remedy offered at the end. D supplies an explanation for the late
    reaction that the passage does not give and does not need. E fastens on the phrase "for reasons of
    his own," which the passage uses to withhold the first driver''s reason rather than to identify it,
    and which in any case applies to one driver instead of each.

    '
  source_ref:
  - H1-Q35
  - H1-Q40
- id: T1-R45
  passage_id: T1-P6
  section: reading_comprehension
  item_type: reading_mc
  question_number: 45
  skill: vocabulary_in_context
  difficulty: medium
  dok: 2
  target_word: absorb
  question_text: As used in line 33, "absorb" most nearly means
  choice_a: soak up spilled water
  choice_b: pass along to others
  choice_c: come to understand fully
  choice_d: reduce gradually over time
  choice_e: take in and hold
  correct_answer: E
  distractor_types:
    A: surface_match
    B: opposite
    C: wrong_concept
    D: less_precise
  explanation: 'The sentence sets absorbing against passing on. The driver receives the disturbance and
    does not send it further: she coasts, spends her gap, and the cars behind her get nothing. To take
    the wave in and keep it is E. A is the meaning the word carries most often, and the passage has already
    compared traffic to water, which makes the wrong sense unusually easy to reach for here — but no liquid
    is involved. B is the exact behaviour the sentence rules out with the words "instead of." C is the
    sense in "absorb a lesson," which cannot apply to a wave in traffic. D is close and one step off:
    the wave is stopped at this driver rather than worn down slowly, and the passage gives no span of
    time over which it fades.

    '
  source_ref:
  - H1-Q33
  - H1-Q29
- id: T1-R46
  passage_id: T1-P6
  section: reading_comprehension
  item_type: reading_mc
  question_number: 46
  skill: inference
  difficulty: hard
  dok: 3
  target_word: null
  question_text: The statement in lines 20-27 that the jam has outlived its own contents means that
  choice_a: the jam has lasted longer than expected
  choice_b: the drivers have grown tired of waiting
  choice_c: no original car remains inside the jam
  choice_d: the jam has moved past where it formed
  choice_e: the cars inside it are no longer moving
  correct_answer: C
  distractor_types:
    A: wrong_concept
    B: inference_leap
    D: partly_true_but_wrong
    E: opposite
  explanation: 'Cars enter the jam at its back and leave from its front while the jam itself slides the
    other way. Given enough time, every car that was in the original slowdown has driven off, and the
    jam is still there, made entirely of vehicles that arrived later. The thing has survived a complete
    change of parts. A reads "outlived" as merely lasting a long time and loses the comparison the word
    is making — the jam has outlived something specific. B moves the sentence from the jam to the drivers''
    patience, which the passage never discusses. D is true and is the closest miss: the jam does travel
    backward from where it began. But moving away from a place is not the same as replacing everything
    inside it, and it is the second that "contents" names. E contradicts the same sentence, which says
    every car inside the jam is travelling forward.

    '
  source_ref:
  - H1-Q32
  - H2-Q8
- id: T1-R47
  passage_id: T1-P6
  section: reading_comprehension
  item_type: reading_mc
  question_number: 47
  skill: inference
  difficulty: medium
  dok: 3
  target_word: null
  question_text: The passage suggests that a driver who looks for the cause of a jam is likely to
  choice_a: find a stalled vehicle further ahead
  choice_b: find nothing where the jam ends
  choice_c: blame the driver directly in front
  choice_d: reach home later than expected
  choice_e: discover a lane closed for work
  correct_answer: B
  distractor_types:
    A: opposite
    C: inference_leap
    D: true_but_irrelevant
    E: misidentified_detail
  explanation: 'The passage opens on exactly this search and reports its result: you round the curve braced
    for wreckage and there is nothing there. It then explains why the search must fail — the tap that
    started the jam happened twenty minutes ago and four miles back, and the driver who made it is home.
    A and E are the two things the passage lists in order to say they are absent; a stalled truck and
    a closed lane are named as what you do not find. C supposes a reaction the passage does not describe,
    and the driver in front is as blameless as everyone else in the wave. D is true of anyone stuck in
    traffic and has nothing to do with searching for a cause.

    '
  source_ref:
  - H1-Q32
  - H1-Q19
- id: T1-R48
  passage_id: T1-P6
  section: reading_comprehension
