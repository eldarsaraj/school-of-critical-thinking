  text: "    The cots came in on Tuesday, forty of them,\n    and the men who carried them set each one\
    \ down\n    inside a painted line, because the lines were there.\n    Nobody told them to. By morning\
    \ the whole floor\n5   had arranged itself: a row along the baseline,\n    two rows in the key, one\
    \ cot at center court\n    where a woman sleeps with her arm across her eyes.\n\n    The scoreboard\
    \ is dark. It has been dark for days\n    and still we look at it, the way you check a clock\n10 \
    \ whose hands you know have stopped. Someone has stacked\n    the folded bleachers to the wall. Someone\
    \ else\n    has swept, though there is nothing here to sweep,\n    only the shine the floor keeps\
    \ giving back.\n\n    At six the light comes through the high windows\n15  in four long rectangles\
    \ and lies down on the boards\n    like something let in for the night. A boy of eight\n    walks\
    \ the center circle heel to toe, arms out,\n    the way you would cross a log above a creek.\n   \
    \ He has never seen a game played here. He does not know\n20  what the circle was for. He only knows\
    \ it is a line\n    and that a line asks you to follow it.\n\n    Mr. Alvarez has put his shoes at\
    \ the free-throw stripe,\n    squared, the toes exactly on the paint.\n    He is eighty-one and he\
    \ has not played anything\n25  in fifty years. When I asked him why, he shrugged\n    and said a man\
    \ likes to know where his feet go.\n\n    Outside, the water is still deciding where to stop.\n  \
    \  Inside, the room keeps saying: stand here, wait there,\n    this is your part of the floor, this\
    \ is where you start.\n30  We came in with nothing arranged\n    and the floor arranged us, in a language\n\
    \    none of us was taught and all of us can read.\n"
