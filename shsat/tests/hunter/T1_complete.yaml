  construct: 'Apply order of operations to a negative sign and an exponent: −a² negates after squaring, while (−a)² squares the negative.'
  difficulty: medium
  dok: 3
  question_text: Compare the quantity in Column A with the quantity in Column B.
  column_a: −5²
  column_b: (−5)²
  choice_a: The quantity in Column A is greater.
  choice_b: The quantity in Column B is greater.
  choice_c: The two quantities are equal.
  choice_d: The relationship cannot be determined from the information given.
  choice_e:
  correct_answer: B
  distractor_types:
    A: sign_error
    C: sign_error
    D: picks_D_when_determinable
  distractor_trace:
    A: reads −5² as (−5)² = 25 and, treating Column B the same, picks the wrong larger one
    C: computes both as 25 and calls them equal, missing that −5² = −25
    D: thinks the sign makes the comparison undeterminable
  explanation: 'Column A: −5² means −(5 × 5) = −25, because the exponent applies before the negative sign. Column B: (−5)² = (−5)(−5) = 25. Since 25 is greater than −25, Column B is greater. Verified: −25 vs 25.'
  source_ref:
