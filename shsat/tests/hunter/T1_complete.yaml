  question_text: According to the passage, sand is dropped and a small beach is built up on the ___ of a bend.
  choice_a: outer side, where the water runs fastest
  choice_b: both sides equally
  choice_c: narrow neck of land between two loops
  choice_d: very bottom of the channel
  choice_e: inner side, where the current slackens
