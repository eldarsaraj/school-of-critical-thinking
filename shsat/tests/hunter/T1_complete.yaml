  title: Murmuration
  genre: poem
  era: contemporary
  source_type: original
  source_citation:
  setting_place: a parking lot behind a closed garden center, at dusk
  setting_period: present day
  narrator_pov: first-person, a child, with the father beside
  central_relationship: a child and a father watching together
  topic: a starling murmuration — order without a leader, and a wonder too large to speak
  mood: hushed, wondering
  line_count: 26
  stanza_count: 6
  fk_grade: 7.6
  mean_sentence_length: 25.4
  n_items: 8
  skills_covered: main_idea; tone_attitude; figurative_craft; inference
  vocab_words_tested: none
  text: |2
       At the hour the streetlights decide to come on
       the starlings gather above the parking lot
       behind the closed garden center — a few at first,
       then a hundred, then a number no one keeps.

     5 They appoint no leader. Watch how the whole flock
       leans, and folds, and pours itself
       out of one shape and into the next:
       now a fist, now a sheet snapped sideways
       by a wind that stirs nothing else in the sky.

    10 No single bird decides it. Each one only
       holds its small distance from the seven nearest,
       and out of seven thousand of those small minds
       a larger mind assembles over the traffic,
       with no head in which to think, and thinks.

    15 My father says they are only going to roost.
       He says it the way you name the smaller thing
       to keep from naming the other, the one
       with no fact in it to hold. We stand by the car
       in the cold and do not get in. The cloud
    20 tightens and frays, tightens and frays,
       and then, as though a held breath were released,
       comes down all at once into a single tree,
       and the tree is suddenly loud with the sound
       of a thousand birds pretending to be leaves,
    25 and the sky where they had hung is the sky again,
       and we drive home, and neither of us says what we saw.
- id: T1-P6
  test_id: Test 1 (baseline)
  slot: 6
  title: Why Rivers Wander
  genre: contemporary_informational
  era: contemporary
  source_type: original
  source_citation:
  setting_place: none — an explanation of river behavior
  setting_period: present day
  narrator_pov: third-person expository
  central_relationship: none — expository
  topic: why a river on flat ground bends, and why the bends keep growing
  mood: explanatory, unhurried
  word_count: 461
  line_count: 43
  fk_grade: 9.8
  mean_sentence_length: 27.1
  n_items: 8
  skills_covered: main_idea; authors_purpose; supporting_detail; vocabulary_in_context; inference
  vocab_words_tested: scoured; pronounced
  text: |2
       A river crossing a flat plain ought, by any simple logic,
       to run straight. The shortest path from the hills to the
       sea is a line, and the water is drawn on by
       nothing but gravity, which plays no favorites among directions. Yet the
     5 rivers on the flattest ground are the most crooked of all,
       looping back on themselves in long, unhurried bends; and the reason
       a river bends turns out to explain why, once the bending
       has begun, it can hardly be made to stop.
       Begin with a channel that runs very nearly straight, and grant
    10 it one small imperfection: a fallen log, a patch of softer
       soil, a curve so faint the eye would pass over it.
       Where the water rounds even the gentlest turn, it is forced
       to travel a little faster along the outer side than the
       inner, in the way the outer horse on a carousel must
    15 cover the greater distance. Faster water carries more force, and force
       wears at the bank. So the outer bank is scoured and
       cut back, while along the inner side, where the current slackens,
       the river lets fall the sand it can no longer carry,
       and a small beach is built up. The curve, in short,
    20 deepens itself.
       Each bend digs away its own outer edge and fills in
       its own inner one, and so becomes more pronounced with every
       season, a slight accident enlarged by the water into something like
       a law. Follow the process far enough and the loops swing
    25 out so extravagantly that two of them nearly touch. In a
       flood the river may at last leap the narrow neck of
       land left between them, deserting the long way around for the
       shortcut, and the stranded loop is left behind as a curved
       pond, an oxbow lake, drying at the river's side like a
    30 sleeve cut from a coat. The river has edited itself, striking
       out the passage it no longer had a use for.
       None of this asks for a slope to bring it about,
       or a mountain, or a design. It asks only for moving
       water, a bank soft enough to be worn, and time, of
    35 which a river commands a great deal. What looks from above
       like indecision, all that patient wandering, is the steadiest habit the
       river owns, as dependable as its falling downhill. Engineers who straighten
       a river to win back the land inside its curves discover
       this the hard way, for the water, given the first excuse,
    40 sets about curving once more, rebuilding the very bends they had
       filled. That wandering is the river obeying the single rule that
       moving water on yielding ground is bound to obey: to seek
       out the smallest reason to turn, and then to exaggerate it.
