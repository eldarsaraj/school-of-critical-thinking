  choice_c: The mean is greater than the median by 5.
  choice_d: The mean and the median are equal.
  choice_e: ''
  correct_answer: A
  explanation: 'Compute both, then compare. The seven readings total 154, so the mean is 154
    ÷ 7 = 22. The readings are already in order and there are seven of them, so the median
