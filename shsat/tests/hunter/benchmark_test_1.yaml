  passage_title: The Lamp-Room (original passage in nineteenth-century style)
  passage_text: 'The lamp-room stood at the head of the last stair, and it was Mr. Arbuthnot''s
    practice to visit it at four o''clock, whatever the weather and whatever the season, and
    to remain there until the wicks were trimmed to his satisfaction. He had performed this
    office for thirty-one years. In that period the shipping had altered, the town below had
    doubled itself, and a railway had come as far as the church and stopped, apparently in
    disappointment; but the wicks were trimmed at four.


    His niece, who had come to keep his house in the spring, could not at first discover whether
    he loved the work or merely could not leave off doing it. She was a young woman of a decided
    turn of mind, and she disliked a question she could not settle.


    She observed that he did not hurry. She observed, further, that he did not linger, and
    that when the last of the eight lamps had been attended to he descended without looking
    back at them, as a man walks away from a letter he has posted. He never spoke of the lamps
    at table. When a neighbour, meaning to be civil, praised the light as a great comfort
    to the boats, her uncle replied that it was of no comfort whatever to the boats, since
    the boats could not see it above three miles, and that the comfort belonged entirely to
    the people on shore who liked to imagine it seen. Then he asked for the potatoes.


    She thought this severe, and said so, later, on the stair.


    "It is not severe," he said. "It is only exact. A thing does not become useful by being
    admired."


    "Then why do you go up?"


    He considered the question long enough that she supposed he had decided against answering
    it. "Because at four o''clock," he said at last, "the lamps want trimming."


    This struck her, at the time, as no answer at all, and she carried her irritation with
    her for the better part of a fortnight, taking it out now and then to examine it. But
    in the last week of May there came a night of weather such as she had not seen, and she
    woke to a noise she took for the roof going, and found the house empty, and the door at
    the head of the last stair standing open on a room full of wind.


    He was there, of course. He had wedged himself between the frame and the great brass housing,
    and he was holding a hand across the nearest flame, which was doing its best to lie down
    and go out, and he did not turn round when she came in; he only said, without any particular
    emphasis, that she might shut the door if she was going to stand in it.


    She shut the door. She stayed until six. And it was not until the following winter, when
    she had occasion to describe her uncle to somebody who had never met him, that she discovered
    she could not tell the story of that night without also telling the story of the potatoes,
    and that the two, which she had once thought to be entirely separate matters, had somehow
    become the same matter, and that she had been slow.'
