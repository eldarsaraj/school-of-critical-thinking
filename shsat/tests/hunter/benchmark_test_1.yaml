  passage_title: Low Tide
  passage_text: 'The bay goes out at four

    and leaves the whole floor of itself

    lying there, embarrassed,


    the way a room looks

    when someone lifts the rug.

    Here are the ribs of a boat


    nobody has thought about

    since before I was born.

    Here is a tyre. Here is a channel


    the water cut and forgot,

    still running, still going somewhere

    on business of its own.


    The gulls come down and walk

    where they are not supposed to walk,

    their feet making the small


    triangular writing

    they never explain.

    And I stand on the wall and think


    I am being shown something,

    though the bay has not shown me

    one thing it holds -


    only the shape of the holding,

    the sag and the slope of it,

    the dark places where the dark is deeper.


    At six the water comes back

    the way it always comes back,

    not hurrying, not sorry,


    and covers the ribs, the tyre,

    the writing, the channel

    going about its business,


    and the bay is a bay again,

    flat and blue and finished,

    and gives nothing away,


    and I go in for supper

    knowing exactly the same amount

    and knowing it differently.'
  question_text: The poem is mainly about
  choice_a: the damage that people have done to a quiet stretch of water
  choice_b: the speaker's memories of a bay visited in childhood
  choice_c: the habits of the gulls that feed on the exposed mud
  choice_d: seeing more of something without understanding it any better
  choice_e: the speaker's wish that the tide would stay out longer
  correct_answer: D
  explanation: The bay uncovers everything it has, and the speaker admits that it 'has not
    shown me / one thing it holds - / only the shape of the holding', and goes in to supper
    'knowing exactly the same amount / and knowing it differently'. That is D. A takes the
    tyre and treats pollution as the subject. C stops at one image. B invents a memory the
    poem never reports; the boat's ribs are older than the speaker but the visit is present-tense.
    E supplies a wish the poem does not express.
  distractor_types:
    A: misidentified_detail
    B: inference_leap
    C: too_narrow
    E: wrong_concept
