  choice_c: 4n + 22
  choice_d: 8n + 2
  choice_e: ''
  correct_answer: C
  explanation: 'Distribute both products, watching the minus sign in front of the second one:
    3(2n + 4) = 6n + 12, and −2(n − 5) = −2n + 10. Adding gives 4n + 22. Checking at n = 1:
    the original is 3(6) − 2(−4) = 18 + 8 = 26, and 4 + 22 = 26. The traps: A carries the
    second product through as −2n − 10, a sign error; B distributes the −2 to the n but not
    to the −5; D subtracts the n-terms in the wrong direction.'
