  passage_group_id: T2-P1
  passage_title: The Rule That Never Says No
  passage_text: 'A friend of mine keeps a horoscope taped inside her locker. It promises that
    this week she will meet an obstacle, that patience will be required of her, and that an
    old friendship may yet surprise her. She reports, with some satisfaction, that it has
    been right every week since September.


    I do not doubt her. That is the difficulty.


    Consider what the horoscope would have to say in order to be wrong. An obstacle is guaranteed
    to anyone who leaves the house; patience is required of anyone who waits for a bus; and
    a friendship, being a thing with a history, may always be said to have surprised us if
    we look at it in a certain light. The prediction cannot fail, because there is no week
    it could not describe. A claim that fits every week fits no week in particular. It has
    purchased its perfect record by giving up the only thing that would have made the record
    worth having, which is the risk of being caught out.


    Set beside it a claim of another kind. A doctor says that a certain medicine will bring
    down a fever within three hours in most patients who take it. This is a far less impressive
    promise. It does not cover every case; it concedes exceptions before anyone has asked
    for them; it names a span of time short enough to be inconvenient. But because it forbids
    something, namely a ward full of patients whose fevers do not fall, it tells us something.
    We know what would count against it. We could go and look.


    This is the test I have come to apply to nearly everything I am told, and I recommend
    it to anyone who would rather not be pleasantly fooled. Ask what the world would have
    to look like for the claim to be false. If you cannot answer, the claim is decoration.
    It may be handsome decoration. It may even be true, in the way that a hunch is sometimes
    true. But it is not yet knowledge, because nothing in the world is holding it in place.


    The habit is uncomfortable to acquire, since our warmest beliefs are often the ones that
    have been most carefully hedged. We say that a person is good at heart, and then we file
    every unkindness under a bad day and every kindness under proof; whatever he does, the
    verdict stands undisturbed. We say a plan will work if only it is given time, and no quantity
    of time is ever quite enough to settle the matter. In each case the belief has been made
    safe, and safety, in a belief, is a kind of death. What cannot be argued with cannot be
    leaned on either.


    I am not urging suspicion. Suspicion is only credulity turned inside out, and just as
    lazy, since it also spares us the trouble of looking. I am urging a single question, asked
    early and without heat: what would change your mind? A claim that has an answer to that
    question is standing on ground. A claim with no answer at all is standing on nothing,
    however firmly it appears to stand.'
  question_text: As used in the passage, 'hedged' ('the ones that have been most carefully
    hedged') most nearly means
  choice_a: enclosed by a boundary
  choice_b: expressed in polite language
  choice_c: planted and tended over time
  choice_d: qualified so that nothing can disprove them
  choice_e: kept hidden from other people
  correct_answer: D
  explanation: 'The examples that follow show what the hedging does: every unkindness is filed
    under a bad day, and no length of time is ever enough, so the belief can never be shown
    to be wrong. That is D. A is the literal garden sense of the word, and it is the strongest
    trap here because the passage is not talking about boundaries at all. B and C reach for
    other everyday senses. E confuses a belief that cannot be disproved with one that is concealed.'
  distractor_types:
    A: too_literal
    B: wrong_concept
    C: wrong_concept
    E: changes_meaning
