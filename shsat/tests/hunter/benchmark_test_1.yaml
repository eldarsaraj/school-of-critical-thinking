  passage_group_id: T2-P6
  passage_title: Why Ice Is Slippery
  passage_text: 'For most of the twentieth century, schoolbooks gave a tidy answer to why
    ice is slippery, and the answer was wrong.


    The tidy answer went like this. Water is unusual: unlike almost every other substance,
    it expands when it freezes, so ice takes up more room than the water it came from. Squeeze
    ice hard enough and you push it back toward the more compact state, which is to say you
    melt it. A skater''s whole weight rests on two thin blades, so the pressure under those
    blades is enormous, and a film of water forms, and the skater glides on it. The explanation
    had everything one wants: it was surprising, it used a real property of water, and it
    fitted the case it was invented for.


    It failed on the arithmetic. Run the numbers for a skater of ordinary weight on ordinary
    blades and the pressure lowers the melting point by a fraction of a degree - nowhere near
    enough to melt ice on a rink kept several degrees below freezing, and hopelessly short
    of what would be needed on a pond at twenty below. Worse, the explanation predicts something
    we can check without any apparatus at all. If pressure is what makes ice slippery, then
    a person standing still in flat boots, spreading their weight over a wide area, should
    find the ice no more slippery than a tiled floor. Anyone who has stepped onto a frozen
    puddle knows otherwise.


    Friction was the next candidate, and it does part of the work. A blade dragged across
    ice heats what it touches, and the heat melts a little water, and the water lubricates
    the blade. This is sound, and it explains why skating gets easier once you are moving.
