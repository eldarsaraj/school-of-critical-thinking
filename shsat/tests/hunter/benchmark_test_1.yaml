  question_text: Class A has 12 students with a mean score of 75. Class B has 18 students
    with a mean score of 85. What is the mean score of all 30 students together?
  choice_a: '79'
  choice_b: '80'
  choice_c: '85'
  choice_d: '81'
  choice_e: ''
  correct_answer: D
  explanation: 'A mean of means is not the mean of the whole group unless the groups are the
    same size — and here they are not. Rebuild the totals: Class A scores total 12 × 75 =
    900 and Class B total 18 × 85 = 1,530, so all 30 students total 2,430 and the overall
    mean is 2,430 ÷ 30 = 81. The result sits nearer 85 than 75 because the larger class is
    the higher-scoring one. The traps: B averages the two means (75 + 85) ÷ 2; A attaches
    each mean to the wrong class size; C reports the higher class mean.'
  distractor_types:
