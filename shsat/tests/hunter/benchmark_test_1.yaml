  explanation: 'First add what the two jobs used: 1,875 + 2,043 = 3,918 sheets. Then subtract
    from the starting stack: 4,206 − 3,918 = 288 sheets left. The traps: D stops at the paper
    used and never subtracts, C subtracts only the first job, and B is a regrouping slip in
    the final subtraction.'
