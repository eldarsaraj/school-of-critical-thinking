  explanation: 'Two steps. First recover the base: volume = base area × height, so the square
    base has area 400 ÷ 16 = 25 cm² and therefore an edge of 5 cm. Then find the four sides:
    each is 5 cm by 16 cm, so together they cover 4 × 5 × 16 = 320 cm². The traps: C adds
    the top and bottom, giving the whole surface area (320 + 50); B gives one side face; A
    stops at the base area.'
