  question_text: "People often say that you should never give up. It is good advice most of\
    \ the time, and it is not always good advice. Sometimes the sensible thing, and the hard\
    \ thing, is to stop.\n\nThink of a time you decided to stop doing something - a club,\
    \ an instrument, a sport, a project, a plan you had been sure about, an argument you had\
    \ been winning. Perhaps you chose to stop. Perhaps somebody else decided for you and you\
    \ had to accept it.\n\nWrite an essay or tell a true story about a time you stopped doing\
    \ something.\nIt does not need to be a big thing, and it does not need to have been the\
    \ right decision.\n\nYour essay or story must:\n\n  - describe what you had been doing\
    \ and why you had started\n  - use specific detail so the reader can picture the moment\
    \ you stopped\n  - show what made stopping difficult, including anything you have not\
    \ told people\n  - make clear how you think about that decision now."
