  question_text: Each equation below represents a straight line. For which line does the y-value
    decrease most rapidly as x increases?
  choice_a: 2y + 9x = 6
  choice_b: y = −4x + 1
  choice_c: 3y − 15x = 12
  choice_d: y = 7 − 2x
  choice_e: ''
  correct_answer: A
  explanation: '"Decreases most rapidly" means the slope that is most negative, so every equation
    has to be put in the form y = mx + b first. A rearranges to y = −4.5x + 3, a slope of
    −4.5. B has slope −4. C rearranges to y = 5x + 4, a slope of +5 — the steepest line of
    the four, but it rises rather than falls. D has slope −2. Since −4.5 is below −4 and −2,
    the answer is A. The trap in C is exactly the steepness-without-direction error; B is
    the closest decrease and catches anyone who never rearranges A; D confuses the constant
    7 for the rate.'
  distractor_types:
    B: estimation_failure
    C: sign_error
    D: wrong_setup
