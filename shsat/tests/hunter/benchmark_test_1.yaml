  question_text: '[VISUAL]: A rectangle 20 cm wide and 12 cm tall. A semicircle is cut out
    of the left-hand 12 cm side and another semicircle is cut out of the right-hand 12 cm
    side, so that each semicircle has its flat edge on a short side of the rectangle and a
    diameter of 12 cm. The two removed semicircles are shown unshaded; the rest of the rectangle
    is shaded.


    A rectangular sheet of metal measures 20 cm by 12 cm. A semicircle of diameter 12 cm is
    cut away from each of the two shorter sides. What is the area of the metal that remains?
    (Area of a circle = pi times r squared.)'
  choice_a: 240 − 72π cm²
  choice_b: 36π cm²
  choice_c: 240 − 36π cm²
  choice_d: 240 − 18π cm²
  choice_e: ''
  correct_answer: C
  explanation: 'Two steps. First find the area removed: each semicircle has diameter 12 cm,
    so its radius is 6 cm, and the two semicircles together make one full circle of area π
    × 6² = 36π cm². Then subtract from the rectangle: 20 × 12 = 240 cm², so the metal left
    is 240 − 36π cm² (about 127 cm²). The traps are all real: D removes only one semicircle,
    A uses the diameter 12 as the radius, and B hands back the piece that was thrown away
    instead of the piece that remains.'
  distractor_types:
    A: wrong_formula
    B: last_step_trap
    D: partial_answer
