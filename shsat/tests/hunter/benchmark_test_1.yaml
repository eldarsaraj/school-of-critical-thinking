  question_text: Three machines start their cycles together at the same instant. Machine A
    finishes a cycle every 8 seconds, Machine B every 12 seconds, and Machine C every 20 seconds.
    In the 5 minutes after that start, how many times do all three machines finish a cycle
    at the same instant?
  choice_a: '1'
  choice_b: '2'
  choice_c: '3'
  choice_d: '5'
  choice_e: ''
  correct_answer: B
  explanation: 'Two steps. First find how often the three line up: that is the least common
    multiple of 8, 12, and 20. Factoring gives 8 = 2³, 12 = 2²·3, 20 = 2²·5, so the LCM is
    2³·3·5 = 120 seconds. Then count how many of those instants fall inside 5 minutes: 5 minutes
    is 300 seconds, and the shared finishes come at 120 s and 240 s — two of them. The traps:
    C counts the starting instant itself, which happened before the 5 minutes began; D uses
    the LCM of only 12 and 20 (60 seconds); A stops at the first shared finish.'
  distractor_types:
    A: partial_answer
    C: wrong_setup
    D: procedure_substitution
