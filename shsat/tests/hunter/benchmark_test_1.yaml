  question_text: Five quiz scores have a mean of 82. Four of the scores are 78, 91, 85, and
    70. How far above the mean is the fifth score?
  choice_a: '4'
  choice_b: '21'
  choice_c: '82'
  choice_d: '86'
  choice_e: ''
  correct_answer: A
  explanation: 'Two steps. First recover the missing score: the five scores must total 5 ×
    82 = 410, and the four given scores total 324, so the fifth score is 410 − 324 = 86. Then
    answer what was asked: 86 − 82 = 4 above the mean. The sharpest trap is D, which stops
    at the score itself; C hands back the mean; B gives the range of the four listed scores
    (91 − 70).'
  distractor_types:
    B: wrong_setup
    C: fast_pattern_match
    D: partial_answer
