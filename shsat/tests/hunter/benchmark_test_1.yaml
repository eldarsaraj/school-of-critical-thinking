  passage_text: ''
  question_text: The perimeter of a rectangle is given by P = 2(L + W). Which expression gives
    W in terms of P and L?
  choice_a: (P − L)/2
  choice_b: P/2 − L
  choice_c: P/2 + L
  choice_d: P − 2L
  choice_e: ''
  correct_answer: B
  explanation: 'Divide both sides by 2 first: P/2 = L + W. Then subtract L from both sides:
    W = P/2 − L. Check with a 3 by 5 rectangle: P = 16, and 16/2 − 5 = 3, the width. Choice
    A divides only part of the expression by 2 (it subtracts L before halving), C reverses
    the last operation, and D never divides by 2 at all.'
  distractor_types:
    A: order_of_operations
    C: sign_error
    D: wrong_setup
