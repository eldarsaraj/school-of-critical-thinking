  question_text: A coat priced at $60 is marked up by 20%. A week later the new price is marked
    down by 20%. What is the final price?
  choice_a: $57.60
  choice_b: $60.00
  choice_c: $62.40
  choice_d: $72.00
  choice_e: ''
  correct_answer: A
  explanation: 'Work the two changes in order. The mark-up gives 60 × 1.20 = $72. The mark-down
    is then taken on $72, not on $60: 72 × 0.80 = $57.60. Because the 20% cut is figured on
    a larger number than the 20% rise was, the coat ends up cheaper than it started. The main
    trap is B, which assumes the two 20% changes cancel; D stops after the mark-up; C is a
    slip that treats the pair as a net 4% gain.'
  distractor_types:
    B: procedure_substitution
    C: arithmetic_slip
    D: last_step_trap
