  question_text: '[VISUAL]: A rhombus drawn with its two diagonals shown as dashed lines crossing
    at the centre. The longer diagonal, running from the left vertex to the right vertex,
    is labelled 24 cm. The shorter diagonal, running from the top vertex to the bottom vertex,
    is labelled 10 cm. The four sides are unlabelled.


    The diagonals of a rhombus measure 24 cm and 10 cm. What is the perimeter of the rhombus?'
  choice_a: 26 cm
  choice_b: 34 cm
  choice_c: 120 cm
  choice_d: 52 cm
  choice_e: ''
  correct_answer: D
  explanation: 'The diagonals of a rhombus cut each other in half and meet at a right angle,
    so each side of the rhombus is the hypotenuse of a right triangle with legs 12 cm and
    10 ÷ 2 = 5 cm. That gives a side of √(12² + 5²) = √169 = 13 cm, and the perimeter is 4
    × 13 = 52 cm. The traps: C computes the area (½ × 24 × 10 = 120) and offers it as a length;
    B adds the two half-diagonals and doubles (12 + 5, then × 2); A gives only two sides.'
  distractor_types:
    A: partial_answer
    B: wrong_setup
    C: wrong_formula
