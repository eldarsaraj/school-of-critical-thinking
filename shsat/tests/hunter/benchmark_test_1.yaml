  passage_title: The Loan
  passage_text: 'My father keeps the hardware store on Delaney Street, and on Saturdays I
    work the register while he is in the back cutting keys. I am eleven and I am good at the
    register. What I am not good at is the part of the job that has no rules, which is most
    of it.


    A man named Mr. Sopko comes in about every third Saturday. He does not buy anything. He
    borrows. A pipe wrench once, a level, a heat gun in February, and each time my father
    writes nothing down. He hands the tool across the counter the way you would hand someone
    a coat, and says, when you''re done with it, and Mr. Sopko says, sure, Ed, and that is
    the whole of the transaction.


    The tools come back. Not always soon. The level was gone the better part of a summer and
    came back with paint on it, and my father wiped it on his apron and set it on the shelf
    without a word about the paint.


    I asked him once why he did not keep a list. He said a list would make it a different
    thing. I said it would make it a thing you could get back. He said that was what he meant.


    Mr. Sopko had a shop of his own two doors down, before I can remember. My mother has said
    this twice, both times while looking at something else.


    In March he came in for a socket set and stood a long while by the paint chips, which
    he has no use for, turning the little cards over as though he were choosing. My father
    was in the back. I could hear the key machine, that high sound it makes, and then the
    quiet when it stops. Mr. Sopko put the cards down in the wrong slots, greens among the
    blues.


    When my father came out he did not go to the counter. He went to the paint chips and stood
    beside him and the two of them looked at the wall together, and my father said something
    I did not hear, and Mr. Sopko laughed, once, not a real laugh but the shape of one, and
