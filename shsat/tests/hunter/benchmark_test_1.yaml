  choice_d: The relationship cannot be determined from the information given.
  choice_e: ''
  correct_answer: A
  explanation: 'There are 36 equally likely rolls. A product is odd only when both numbers
    are odd, and each cube shows an odd number in 3 of 6 ways, so that happens 3 × 3 = 9 times:
    a probability of 9/36 = 1/4. A product greater than 30 needs 36 itself, since 5 × 6 =
    30 is not greater than 30; only the roll (6, 6) works, a probability of 1/36. Since 1/4
    is greater than 1/36, Column A is greater. The trap is counting 30 as "greater than 30,"
    which would still leave Column B smaller, and guessing that odd products are rare.'
