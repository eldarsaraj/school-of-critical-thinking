  topic: ''
  passage_group_id: T2-P4
  passage_title: The Case for the Cracked Pot
  passage_text: 'Walk through the ceramics room of almost any museum and you will pass a hundred
    perfect bowls. They sit on their little stands with the lighting arranged to flatter them,
    and the label tells you the century, the kiln, and the glaze. Then, in a corner, there
    is usually one that has been broken and put back together, and it is nearly always the
    one people stop at.


    Curators have long treated damage as a defect to be apologised for. I want to argue that
    they have it backwards, and that a mended object is often the more informative of the
    two.


    Consider what a perfect bowl can tell you. It can tell you what its maker intended. That
    is a real thing to know, and not a small one. But intention is only half of an object''s
    life, and it is the half that ends the moment the bowl leaves the workshop. Everything
    afterwards, every year the bowl spent being carried and filled and set down, has left
    no mark on it at all, because nothing happened to it. A flawless survival is, in a sense,
    an object that was never used.


    The mended bowl has the other half. The break tells you it was in service; the pattern
    of the break tells you how it fell, and therefore roughly where it was kept and what it
    was doing. And the repair, which is the part worth attending to, tells you something no
    glaze can: that when it broke, somebody decided it was worth the trouble.


    That decision is evidence, and it is evidence of a kind we are otherwise very short of.
    Museums are full of things people valued enough to bury with the dead or lock in a treasury.
    They are much thinner on things people valued in the ordinary way, over years, without
    ceremony. A staple of iron driven through a crack by an unknown hand is a record of exactly
    that sort of valuing, and it was made by somebody who left no other record of anything.


    The objection is obvious, and I do not think it holds. Damage, it will be said, obscures
    the maker''s work. Sometimes it does. But we do not refuse to read a letter because the
    ink has faded in places, and we do not throw out a photograph because one corner is gone.
    We read what is left and we treat the damage itself as part of the document. A crack is
    not the absence of information. It is information about a different subject, arriving
    in a form we were not looking for and have therefore been slow to recognise.


    The perfect bowls will keep. They have kept for four hundred years, which is rather the
    problem. Put the mended one in the middle of the room.'
  question_text: The passage suggests that the mended bowl draws visitors chiefly because
  choice_a: it carries the marks of having been part of somebody's life
  choice_b: visitors enjoy looking for faults in what museums show them
  choice_c: it is displayed in a corner where the lighting is unusual
  choice_d: it is older than the perfect bowls around it
  choice_e: museums have made it difficult to see the other bowls properly
  correct_answer: A
  explanation: 'The opening notes that the mended bowl ''is nearly always the one people stop
    at'', and the rest of the essay explains what such a bowl has that the others lack: use,
    accident, and the decision to repair. That is A. C takes a detail of placement and makes
    it the cause. D assumes greater age, which the passage never claims. B and E supply unflattering
    motives and complaints about display that the passage does not make.'
  distractor_types:
    B: wrong_concept
    C: misidentified_detail
    D: inference_leap
    E: too_broad
