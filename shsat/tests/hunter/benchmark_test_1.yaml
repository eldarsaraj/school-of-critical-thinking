  question_text: A wall is built in rows of blocks. Row 1 has 4 blocks and row 4 has 19 blocks,
    and each row adds the same number of blocks as the row before. How many blocks are in
    row 9?
  choice_a: '39'
  choice_b: '44'
  choice_c: '49'
  choice_d: '124'
  choice_e: ''
  correct_answer: B
  explanation: 'First recover the rule. Going from row 1 to row 4 is three steps and adds
    19 − 4 = 15 blocks, so each row adds 15 ÷ 3 = 5 blocks. Then extend it: row 9 is eight
    steps past row 1, so it has 4 + 8 × 5 = 44 blocks. (Checking from row 4: 19 + 5 × 5 =
    44.) The traps: A stops at row 8, C counts nine steps instead of eight, and D never divides
    the 15 by the three rows it was spread across.'
  distractor_types:
    A: last_step_trap
    C: arithmetic_slip
    D: wrong_setup
