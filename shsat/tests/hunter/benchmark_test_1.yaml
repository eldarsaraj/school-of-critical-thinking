  question_text: A teacher recorded the number of books read by each of 25 students. Every
    recorded number is a whole number, and the numbers are not all the same. Which of the
    following must be true?
  choice_a: The median is equal to one of the 25 recorded numbers.
  choice_b: The mean is equal to one of the 25 recorded numbers.
  choice_c: The mode is greater than the median.
  choice_d: The range is equal to one of the 25 recorded numbers.
  choice_e: ''
  correct_answer: A
  explanation: With an odd number of values, the median is simply the middle value once the
    list is ordered — here the 13th of 25 — so it is always one of the recorded numbers. None
    of the others is guaranteed. The mean can land between whole numbers (for instance, a
    set totalling 60 across 25 students gives 2.4). The mode can sit anywhere relative to
    the median, above it, below it, or on it. And the range is a difference between two values,
    which need not itself appear in the list.
  distractor_types:
    B: wrong_setup
    C: wrong_setup
    D: fast_pattern_match
