  passage_title: The Animals That Make Their Own Light
  passage_text: 'On a dark night, the surface of the ocean can suddenly flash with blue-green light, as if the waves were full of cold fire. Sailors have described the sight for centuries. The glow comes from living things that make their own light, an ability scientists call bioluminescence. It is one of the most common forms of communication on Earth, and most of it happens in places where humans almost never look: the deep sea.


    Bioluminescence is not the same as glowing in the dark after sitting in the sun. A glow-in-the-dark sticker simply stores light and releases it slowly. A bioluminescent animal makes new light through a chemical reaction inside its own body. When a substance called luciferin combines with oxygen, helped along by a special protein, the reaction releases energy as light instead of heat. This is why the light feels cold to the touch — almost none of the energy is wasted as warmth, unlike an ordinary light bulb, which gives off far more heat than light.


    Animals use their light for very different purposes, and the purpose usually explains the design. Some use it to find food. The anglerfish, which lives where sunlight never reaches, dangles a glowing lure in front of its mouth; smaller fish swim toward the light and become a meal. Others use light for defense. Certain squid, when threatened, eject a cloud of glowing particles instead of dark ink, leaving a bright blur in the water while the squid itself slips away into the dark. The light, in this case, is not meant to attract anything — it is meant to confuse a predator long enough for escape.


    Still other animals use light to find one another. Fireflies, which most people have seen, flash in patterns that work like a code. Each species has its own rhythm of flashes, and a firefly searching for a mate watches for the pattern that matches its own. A flash that comes at the wrong moment, or in the wrong rhythm, is ignored. In this way the light carries a specific message — not simply "here I am," but "here I am, and I am one of you."


    The deep ocean is where bioluminescence truly rules. In that vast darkness, where there are no plants and few places to hide, the great majority of animals can produce their own light. For them it is not a rare trick but an ordinary tool, as common as sound is for animals on land. A creature drifting in the deep may use its light to hunt, to hide, to startle an attacker, and to signal to its own kind, all with the same glowing organs.


    For a long time, scientists could study these animals only by hauling them up in nets, which usually killed them and left their light extinguished. Today, remote-controlled vehicles carry cameras thousands of feet down and record the animals glowing in their own world, undisturbed. What those cameras reveal is a deep sea far busier and more talkative than anyone once imagined — a place where, in near-total darkness, countless living things are quietly speaking to one another in light.'
