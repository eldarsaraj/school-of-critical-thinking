  passage_title: What the River Keeps
  passage_text: 'When I was a child, my grandfather told me that the river had no memory, and I believed him for almost twenty years before I understood that he had meant the opposite of what he said.


    He was a practical man, not given to riddles, and the remark came in the middle of a practical lesson. We were standing on the bank of the slow brown river that ran past his farm, and I had asked him — I must have been seven — whether the water going past us was the same water that had gone past yesterday. No, he said. That water was gone, in the sea by now, or close to it. The river you see is never the river you saw. It keeps nothing. It has no memory. Then he handed me a stick and told me to throw it in and watch how fast it left us, which I did, and which seemed to settle the matter.


    It did not occur to me until much later that the river my grandfather was standing beside that afternoon was, in every way that mattered to him, profoundly full of memory. He had been born in the house behind us. He had learned to swim in that water, had nearly drowned in it once, had buried a dog on its bank and a wife not far off. The river had no memory of these things, true enough; the particular molecules that had closed over his head when he was a boy were, as he said, long gone to the sea. But he had not been talking about the water. He had been talking, without knowing it, or perhaps knowing it perfectly well, about the difference between what a place holds and what we hold about a place — and he had given the whole of it to the water in order, I think, not to have to say it about himself.


    This is the strange double life of the things we attach our memories to. The river forgets; the bank remembers; and we, standing between them, cannot always tell which is which. We say a house "holds memories," and it does not — a house holds nothing, is indifferent to whoever lived and died in it, will shelter the next family as faithfully as the last. The memory is entirely ours. And yet to stand again in a room one has not entered for thirty years is to feel the past returned with a force no act of deliberate remembering can produce, as though the room had been keeping it all along and had only been waiting for us to come back and collect it. We know this is not true. We know the room kept nothing. We feel, against all knowing, that it did.


    My grandfather has been dead now for many years, and the farm is sold, and I have not seen the river since the day of his funeral, when I stood on the bank for a while and threw a stick in and watched it leave, as fast as ever, keeping nothing. I understood, finally, what he had been telling me. He had not been correcting a child''s confusion about water. He had been teaching me, in the only language a practical man could bear to use, that the river would carry everything away and remember none of it, and that this was precisely why we had to — that forgetting was the river''s work and remembering was ours, and that he was handing me the second of these the way a man hands his grandson a tool he will need after he is gone.


    The water I watched that day is in the sea by now. So is the water of my childhood. The river is never the river I saw. It keeps nothing, and I have come to think this is the most generous thing about it: that it leaves the keeping to us, who can, and to whom it matters, and who will not always be here to do it either.'
  question_text: Which statement best expresses the central insight the narrator reaches by the end of the passage?
  choice_a: The narrator concludes that places genuinely do hold the memories of those who lived in them.
  choice_b: The narrator regrets having believed his grandfather's lesson about the river.
  choice_c: Rivers are scientifically incapable of storing any information, which the grandfather wanted the narrator to understand, and his whole purpose that afternoon by the bank was simply to correct a young child's mistaken idea about water and memory.
  choice_d: The grandfather's claim that the river 'has no memory' was really a way of saying that forgetting is the river's work and remembering is ours — a duty he was handing down.
  correct_answer: D
  explanation: 'The narrator finally understands the grandfather meant ''the opposite of what he said'': the river carries everything away precisely so that the keeping is left ''to us.'' C is the literal surface the narrator moves beyond; A contradicts ''We know the room kept nothing''; B misreads the tone.'
  distractor_types:
    C: partly_true_but_wrong
    A: partly_true_but_wrong
    B: wrong_concept
