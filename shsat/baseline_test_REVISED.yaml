    None of this argues for taking choices away from people, which would carry costs of its own and replace one error with another. What it argues for is humility about a value we have been encouraged to hold without limit. The man standing before a wall of forty mustards is exercising a freedom his grandparents did not have. Whether he is, in that moment, better off is a question the freedom itself cannot answer — and one we are oddly reluctant to ask.'
