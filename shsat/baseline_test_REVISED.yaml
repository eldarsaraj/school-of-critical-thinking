  passage_group_id: ela_e_p3
  passage_title: The Woman Who Mapped the Ocean Floor
  passage_text: 'For most of human history, the bottom of the ocean was a blank. People knew the sea was deep, but its floor was hidden under miles of water, and no one had ever seen it. In the middle of the twentieth century, a scientist named Marie Tharp helped change that — not by diving into the ocean, but by carefully turning columns of numbers into a picture.


    Tharp trained as a geologist at a time when few women were allowed to do such work, and fewer still were taken seriously. When she joined a research laboratory in New York, she was not permitted to go out on the ships that gathered the data. That work was reserved for men. Instead, Tharp was given the numbers the ships brought back and told to make sense of them at her desk.


    The numbers came from a device called an echo sounder, which sent a pulse of sound down through the water and measured how long it took to bounce back. A quick echo meant the floor was close; a slow echo meant it was far. Reading thousands of these measurements, Tharp could calculate the depth of the ocean at each point along a ship''s path. Then, line by line, she drew the shape of the hidden floor.


    As her maps took form, Tharp noticed something no one expected. Running down the middle of the Atlantic Ocean was a long mountain range, and splitting that range was a deep valley, like a crack. To Tharp, the crack suggested that the ocean floor was being pulled apart, with the seafloor on either side slowly moving away. This idea fit with a theory, then widely dismissed, that the continents themselves drift over time.


    When Tharp showed the valley to her research partner, Bruce Heezen, he dismissed it at first as "girl talk" — a guess unworthy of a real scientist. The notion that continents could move was deeply unpopular, and Heezen did not want to be associated with it. But Tharp kept finding the valley, again and again, in line after line of data. The crack was not an error. It was really there, and it ran for thousands of miles.


    In time, the evidence became too strong to ignore, and Heezen came to accept what Tharp''s maps had shown. The great valley she had traced is now understood to be a place where new ocean floor is constantly being created as the earth''s plates pull apart — a discovery that helped overturn the old belief that the continents were fixed in place. The theory Tharp''s map supported, once treated as nonsense, became one of the foundations of modern geology.


    Tharp received little public credit during the years when the discovery was being made; the maps often went out under her partner''s name. Recognition came mostly late, and from a later generation of scientists who looked back and saw how much had begun at her desk. She had never set foot on the ocean floor she made visible. She had simply refused to look away from what her numbers were telling her, even when the people around her insisted it could not be true.'
  question_text: Which statement best expresses the central idea of the passage?
  choice_a: Bruce Heezen made all of the important discoveries described in the passage described in the passage, working out the shape of the hidden ocean floor himself and grasping the meaning of the great valley before Tharp did.
  choice_b: Marie Tharp turned columns of measurements into maps that revealed an unknown feature of the ocean floor and helped overturn an old scientific belief, despite receiving little credit at the time.
  choice_c: Marie Tharp was the first woman ever to work as a geologist.
  choice_d: Marie Tharp personally explored the ocean floor in a research submarine.
  correct_answer: B
  explanation: The passage centers on Tharp's mapping work, the valley she found, its scientific importance, and her lack of recognition. C and D contradict the text (she was not allowed on ships and never reached the floor); A credits the wrong person.
  distractor_types:
    C: partly_true_but_wrong
    D: wrong_concept
    A: wrong_concept
