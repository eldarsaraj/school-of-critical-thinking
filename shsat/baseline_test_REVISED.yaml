- section: ELA
  stage: hard_module
  question_number: 1
  question_type: multiple_choice
  skill: central_idea
  difficulty: hard
  topic: ''
  passage_group_id: ela_h_p1
  passage_title: The Paradox of Choice
  passage_text: 'It is taken almost as an article of faith in modern life that more choice is better than less. A market that offers a hundred varieties of a product is assumed to serve its customers better than one offering three; a society that multiplies its citizens'' options is assumed, by that fact alone, to have enlarged their freedom. The assumption is so deeply held that we rarely state it, much less examine it. But a body of research from psychology suggests that the relationship between choice and well-being is far less straightforward than the assumption allows, and that beyond a certain point additional options can leave people not more satisfied but less.


    The most cited demonstration of this effect is deceptively modest. In a now-famous study, researchers set up a tasting booth in a grocery store, offering shoppers a chance to sample jams. On some days the booth displayed six varieties; on others, twenty-four. The larger display, unsurprisingly, attracted more passing interest: more shoppers stopped to look. But when it came time to actually purchase, the pattern reversed. Shoppers who had encountered the small display bought jam at roughly ten times the rate of those who had faced the large one. The abundance that drew people in also, it seemed, drove them away from deciding at all.


    Why should a wider field of options make a decision harder rather than easier? Part of the answer lies in the simple cost of evaluation. Each additional option must be considered, compared, and weighed, and attention is finite; past a certain number, the labor of choosing well comes to outweigh the value of choosing at all, and the mind, sensing this, prefers to defer. But the more interesting part of the answer has less to do with the difficulty of deciding than with how we feel about the decision once it is made.


    When we select one option from twenty-four, we do not simply gain the one we chose; we also, in a sense, forgo the other twenty-three, and each of those forgone alternatives represents a possibility we have closed off. The more alternatives there were, the easier it becomes to imagine that one of them might have been better than the choice we settled on, and the more room there is for the particular regret that the psychologist Barry Schwartz calls "the curse of high expectations." A person who buys the only sweater in a shop has nothing to compare it against and may wear it happily. A person who chooses one sweater from fifty may find the same garment faintly disappointing, haunted by the fifty roads not taken — not because the sweater is worse, but because the act of choosing it has been surrounded by alternatives that make satisfaction harder to feel.


    This suggests a distinction that the celebration of choice tends to ignore: between the freedom to choose and the experience of having chosen. Expanding options reliably increases the former. It does not reliably increase the latter, and may diminish it. The point is not that constraint is preferable to freedom, nor that we would be happier with no options at all; a world of three jams is not obviously superior to a world of six. The point is narrower and easier to overlook. The value of additional choice is not constant. It is large when one is moving from few options to several, and it shrinks, and can turn negative, as the number climbs into the dozens — so that a culture which treats the multiplication of options as an unmixed good has mistaken a curve that rises and then falls for a line that only rises.


    None of this argues for taking choices away from people, which would carry costs of its own and replace one error with another. What it argues for is humility about a value we have been encouraged to hold without limit. The man standing before a wall of forty mustards is exercising a freedom his grandparents did not have. Whether he is, in that moment, better off is a question the freedom itself cannot answer — and one we are oddly reluctant to ask.'
  question_text: Which statement best expresses the central claim of the passage?
  choice_a: The freedom to choose has no relationship to a person's well-being.
  choice_b: 'The value of additional choice is not constant: it is large at first but shrinks and can become negative as options multiply, so treating more choice as always better mistakes a curve for a straight line.'
  choice_c: More choice always makes people less happy, so societies should work to reduce the number of options available to their citizens, deliberately limiting the goods, services, and everyday decisions people face in order to spare them the burden of choosing.
  choice_d: People who face many options simply need more time to evaluate them before deciding.
  correct_answer: B
  explanation: The passage's thesis is that choice's value rises then falls — 'a curve that rises and then falls,' not a line. C overstates ('always') and recommends restricting choice, which the passage explicitly declines to do; D and A misstate the argument.
  distractor_types:
    C: partly_true_but_wrong
    D: wrong_concept
    A: wrong_concept
