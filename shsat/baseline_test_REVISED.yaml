- section: ELA
  stage: hard_module
  question_number: 13
  question_type: multiple_choice
  skill: central_idea
  difficulty: hard
  topic: ''
  passage_group_id: ela_h_p3
  passage_title: Should We Bring Back Lost Species? Two Views
  passage_text: 'Passage 1


    The extinction of a species has always seemed the most final of losses, a door that closes and cannot be reopened. Advances in genetics now call that finality into question. By recovering DNA from preserved remains and editing it into the genome of a living relative, scientists have begun to imagine reconstructing creatures the world has not seen for thousands of years — the woolly mammoth foremost among them. To those who find the prospect troubling, it is worth asking what, exactly, the trouble is.


    The strongest case for de-extinction is not sentimental but ecological. Many extinctions, particularly recent ones, were caused by human activity, and many left holes in ecosystems that have never properly healed. The mammoth was not merely a passenger on the northern tundra; it was an engineer of it. Herds trampled and grazed the landscape in ways that maintained grassland and slowed the thawing of frozen soil. Their disappearance helped transform a vast carbon-storing grassland into the mossy, shrubby terrain we see today. To restore such a creature, in this view, is not to indulge a fantasy but to repair a machine we ourselves broke, and perhaps to enlist an ancient ally against a modern danger.


    There is, too, a matter of obligation. If we accept that human beings drove these animals out of existence — and for many species the evidence is strong — then the power to undo that harm is not a temptation to be resisted but a responsibility to be weighed. We do not praise a person who breaks a thing and, offered the means to mend it, declines on the grounds that breaking is more natural than mending. The objection that de-extinction is "playing God" assumes a clean line between acting and refraining that the history of conservation has long since erased. We are already managing nature everywhere; the only question is whether we manage it well.


    Passage 2


    The case for resurrecting lost species rests on an appealing image — the mended machine, the ancient wrong set right — and appealing images are exactly what should make us cautious. The first difficulty is that de-extinction does not, in fact, bring anything back. What the techniques can produce is not a mammoth but a modified elephant carrying some mammoth genes: an approximation, raised without a herd to teach it how to be what it resembles, released into a tundra that is no longer the tundra its ancestors shaped. To call this restoration is to mistake a likeness for a return.


    The deeper problem is one of attention and resources. Conservation operates under brutal scarcity; every dollar and every hour spent on one effort is unavailable for another. Thousands of living species stand on the edge of extinction right now, many of them needing nothing more exotic than protected habitat and the will to leave them alone. To divert money and brilliance toward reconstructing the dead, while the living slip away for want of far cheaper help, is not a triumph of responsibility but a failure of priorities dressed in the costume of one.


    And there is a subtler cost, harder to measure but real. The promise that extinction might be reversible threatens to corrode the one conviction that has done the most to protect endangered life: the belief that extinction is forever, and that to lose a species is to lose it for good. Remove that finality, even in theory, and we weaken the urgency that finality creates. Why fight so hard to save what we are told we can someday remake? The advocates of de-extinction offer us a door reopened. They do not always notice that the same door, left ajar, makes it easier to let the next one close.'
  question_text: Which statement best describes the central disagreement between Passage 1 and Passage 2?
  choice_a: They disagree about whether human activity ever caused any species to go extinct.
  choice_b: Passage 1 holds that reviving lost species can responsibly repair ecological and moral harm, while Passage 2 holds that it cannot truly restore them and would misdirect scarce conservation effort while weakening the urgency to protect living species.
  choice_c: They disagree only about which extinct animal should be brought back first.
  choice_d: Passage 1 argues extinction is reversible, while Passage 2 argues that no animals are currently endangered, and that conservation should therefore spend its money and attention managing the species already alive rather than recreating ones that vanished long ago.
  correct_answer: B
  explanation: P1 frames de-extinction as repair and responsibility; P2 counters that it produces only an approximation, drains resources from living species, and erodes the conviction that extinction is final. A and D misstate both authors; C trivializes the dispute.
  distractor_types:
    A: misidentified_detail
    C: too_narrow
    D: wrong_concept
