  passage_text: '(1) Almost everyone yawns, yet scientists still do not fully agree on why. (2) For a long time, the most popular explanation was that yawning supplies the brain with extra oxygen when we are tired. (3) According to this view, a yawn is essentially a deep breath that corrects a shortage of oxygen in the blood. (4) Careful experiments, however, have failed to support it. (5) When researchers gave volunteers air enriched with oxygen, the rate at which the volunteers yawned did not change. (6) A newer explanation proposes that yawning helps cool the brain. (7) The deep intake of air and the stretching of the jaw increase blood flow and draw in cooler air, which may lower the brain''s temperature slightly. (8) This theory would explain a curious finding: people yawn more often in warm rooms than in cool ones. (9) It would also account for the strange power of contagious yawning, since a yawning person may signal to others that conditions call for a cooling response. (10) Most researchers caution that the evidence remains incomplete. (11) Yawning may well serve more than one purpose at once. (12) What once seemed like one of the body''s simplest acts has turned out to be one of its most stubborn puzzles.'
