    My grandfather has been dead now for many years, and the farm is sold, and I have not seen the river since the day of his funeral, when I stood on the bank for a while and threw a stick in and watched it leave, as fast as ever, keeping nothing. I understood, finally, what he had been telling me. He had not been correcting a child''s confusion about water. He had been teaching me, in the only language a practical man could bear to use, that the river would carry everything away and remember none of it, and that this was precisely why we had to — that forgetting was the river''s work and remembering was ours, and that he was handing me the second of these the way a man hands his grandson a tool he will need after he is gone.


    The water I watched that day is in the sea by now. So is the water of my childhood. The river is never the river I saw. It keeps nothing, and I have come to think this is the most generous thing about it: that it leaves the keeping to us, who can, and to whom it matters, and who will not always be here to do it either.'
  question_text: The narrator calls the river's keeping nothing 'the most generous thing about it.' This is best understood to mean that
  choice_a: by carrying everything away, the river leaves the work of remembering to the people for whom that work has meaning.
  choice_b: the river generously preserves the memory of everyone who has lived beside it who has lived beside it, holding on to their experiences within its waters so that nothing of their lives is ever truly lost.
  choice_c: the narrator believes forgetting is always better than remembering.
  choice_d: the river is generous because it gives water to the farms along its banks.
  correct_answer: A
