  passage_title: What the Crows Remember
  passage_text: 'For years, the biologist John Marzluff was puzzled by a problem that had nothing to do with biology and everything to do with grudges. Crows on his university campus seemed to single out particular people for harassment — diving at them, scolding them with harsh calls — while ignoring others who walked the very same paths. The targeted people had usually done something the crows disliked, such as disturbing a nest. But crows live for decades and range over wide territories, and Marzluff could not believe that every bird in the area had personally witnessed each offense. Something stranger seemed to be happening: the birds appeared to know faces they had never seen misbehave.


    To test whether crows could in fact recognize individual human faces, Marzluff designed an experiment that depended on a simple disguise. Researchers wearing a rubber "caveman" mask trapped and banded several wild crows — an unpleasant but harmless procedure — and then released them. A second group of researchers, wearing a different "neutral" mask, walked the same area without bothering the birds at all. In the weeks that followed, the team strolled the campus in both masks and recorded how the crows reacted.


    The results were striking. Crows scolded the caveman mask fiercely, dive-bombing and mobbing whoever wore it, even when that person had never trapped a single bird. The neutral mask was almost entirely ignored. Because the only thing the offending and innocent wearers shared was the mask itself, the birds could not have been reacting to a person''s height, clothing, or walk. They were reacting to a face.


    More surprising was what happened over time. The number of crows that scolded the caveman mask did not fade as the original trapped birds died or moved away. It grew. Crows that had never been captured — including young birds that had not yet hatched at the time of the original trapping — joined in the mobbing. The hostility was spreading through the population faster than direct experience could explain.


    Marzluff concluded that the crows were learning about the dangerous face from one another. A young crow watching its parents shriek at a particular mask appears to absorb the lesson without ever testing it personally, much as a child learns to fear a hot stove from a parent''s warning rather than from a burn. Information about a specific threat, in other words, was being passed from bird to bird and from one generation to the next. This is a form of social learning, and it allows a piece of knowledge to outlive the individual who first acquired it.


    It would be a mistake, however, to imagine that the crows were keeping some deliberate written record of their enemies. Nothing in the experiment suggests planning or shared intention. What the birds possessed was a powerful memory for faces, a strong tendency to react to threat, and a habit of paying close attention to what other crows were doing. Out of those ordinary ingredients, an extraordinary result emerged: a kind of collective grudge, maintained by a community, against a face that most of its members had never personally encountered doing anything wrong.


    The finding matters beyond the question of whether crows can hold a grudge. It suggests that the boundary between learning from experience and learning from others is not as sharp as we tend to assume, and that animals we rarely credit with much of an inner life may be quietly transmitting knowledge across generations. The crow that scolds you may not be remembering you at all. It may be remembering what another crow, long dead, once decided about a face that happened to resemble yours.'
  question_text: Which statement best expresses the central idea of the passage?
  choice_a: Crows can transmit knowledge of a specific threat to one another, so that information about a danger can spread and persist beyond the birds who first experienced it.
  choice_b: Crows are unusually aggressive birds that will mob any human who comes near their nests, regardless of whether that person has harmed them, and they keep up this behavior throughout the year toward anyone who happens to pass nearby.
  choice_c: Marzluff's experiment proved that crows are capable of deliberate planning and keep a shared record of the humans they consider enemies.
  choice_d: Because crows live for several decades, a single crow is able to remember and recognize every human it has ever encountered.
  correct_answer: A
  explanation: The passage builds to the conclusion that crows learn about a dangerous face from one another and pass the knowledge across generations, so a threat can be known by birds who never met it. A is that idea.
  distractor_types:
    B: partly_true_but_wrong
    C: wrong_concept
    D: misidentified_detail
