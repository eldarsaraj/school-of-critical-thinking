  passage_title: The Clockmaker's Daughter
  passage_text: 'Mira had grown up among clocks, and so she had never learned to find their ticking restful. To her it was the sound of impatience — a thousand small voices counting, counting, never satisfied. Her father did find it restful, or claimed to. He sat at his bench from the moment the shop''s shutters came up until long after the street outside had gone dark, a brass eyepiece screwed into one socket, coaxing some stalled mechanism back to life with movements so small they seemed not to happen at all.


    "A clock that runs fast is lying," he liked to say, "and a clock that runs slow is honest about being broken. The fast ones are harder to forgive." Mira had heard this so many times that she could mouth it along with him, though she had never been certain what it meant, or whether her father believed it or only enjoyed the sound of it.


    On the afternoon the woman in the grey coat came in, Mira was supposed to be dusting. Instead she was watching her father''s hands. The woman set a small carriage clock on the counter, its gilt worn to bronze at the corners, and said only that it had stopped, and that she needed it to run again by Friday. She did not say why Friday. Her father turned the clock over, opened its back, and went very still in the way he did when a thing was either trivial or impossible and he had not yet decided which.


    "This hasn''t run in some time," he said.


    "No," the woman agreed.


    "Longer than you''ve owned it, I''d guess."


    The woman''s face did something complicated and brief, and then settled. "It was my mother''s," she said. "I wound it every night for a year after she died. Then one night I forgot, and after that it seemed easier not to start again." She looked at the clock as if it had wronged her. "I''d like it to keep time. That''s all."


    Mira''s father nodded slowly and set the clock down with unusual care, as though it had become heavier. He did not say that the repair was simple, though Mira, who knew the inside of a carriage clock as well as she knew the inside of her own coat pocket, could see that it was. He did not name a price. He only said that Friday would be no trouble, and that the woman should not wind it on the way home — that she should let him see to it first.


    When the woman had gone, Mira asked why he had told her not to wind it. The mechanism was sound; a turn of the key would have started it on the spot. Her father took up his eyepiece again and bent over the bench, and for a while she thought he would not answer at all.


    "Some things you don''t hurry back into use," he said finally. "A clock that''s been stopped a long time, you let it remember how to run. You wind it a little, you wait, you wind it a little more." He glanced at her, and there was something in his face she could not name. "It isn''t really about the clock," he added, and then said nothing else, and the shop filled up again with the sound of a thousand small voices, counting.'
  question_text: It can best be inferred that the father tells the woman not to wind the clock on her way home because
  choice_a: he is worried she will not return to pay him if the clock works immediately, and he would rather keep the finished repair in the shop until she comes back, so that he can be certain of receiving payment.
  choice_b: the clock's mechanism is broken and winding it would cause further damage.
  choice_c: he senses that the clock matters to her for reasons beyond timekeeping and wants to handle it with the care that meaning deserves.
  choice_d: he does not yet know whether he can repair it and needs time to decide.
  correct_answer: C
  explanation: Mira notes the repair is simple and a turn of the key would start it, yet the father acts as if the clock has 'become heavier' after hearing it was the woman's mother's. His final remark ('It isn't really about the clock') confirms C.
  distractor_types:
    B: wrong_concept
    D: partly_true_but_wrong
    A: misidentified_detail
