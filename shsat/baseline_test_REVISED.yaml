  passage_title: The Great Migration
  passage_text: 'Between roughly 1916 and 1970, some six million Black Americans left the rural South and moved to the cities of the North, Midwest, and West. Historians call this movement the Great Migration, and it ranks among the largest internal migrations in the nation''s history. Yet for a long time it was told as a simple story: people fled the poverty and violence of the South and were pulled toward the jobs and freedoms of the North. That story is not wrong, but it is incomplete, and the parts it leaves out are the parts that explain the most.


    The "push" was real. In the early twentieth century, the rural South offered most Black families little but tenant farming under a system that kept them perpetually in debt, alongside the daily humiliations and dangers of legalized segregation. The "pull" was real too. The First World War had slowed European immigration to a trickle just as Northern factories were straining to fill wartime orders, and for the first time those factories opened their gates to Black workers they had previously refused to hire.


    But a push and a pull do not by themselves set six million people in motion. What turned a trickle into a flood was information, and the chief carrier of that information was the Black press. Newspapers such as the Chicago Defender were smuggled south in the luggage of railroad porters and passed hand to hand until a single copy had been read by dozens of people. The Defender printed train schedules, listed factories that were hiring, and ran the names and new addresses of people who had already gone north and prospered. A family thinking of leaving did not have to gamble on a rumor; they could often write to a cousin who had made the journey the year before.


    This points to a truth that the simple "push and pull" account obscures: migration is rarely a leap into the unknown. People move along paths that others have already cleared. The first to leave a town faced the greatest uncertainty, but each departure made the next one easier, supplying the newcomers who followed with a place to stay, a contact at the plant, and proof that the thing could be done at all. The Great Migration was less a single wave than a chain, each link drawing the next.


    The North that migrants found was not the promised land the newspapers sometimes implied. Factory jobs were real but often the dirtiest and most dangerous on offer, and the freedom was partial: Northern cities had their own rigid patterns of segregation, enforced less by law than by custom, violence, and the boundaries of where a Black family was permitted to rent or buy. Many migrants traded one set of hardships for another.


    And yet the migration transformed the country in ways that outlasted the disappointments. It remade the populations of cities such as Chicago, Detroit, and New York. It carried with it the music, cooking, and churches of the rural South and planted them in new soil, where they grew into something that reshaped American culture as a whole. It built the urban communities that would, a generation later, supply much of the energy and leadership of the civil rights movement. The people who boarded those northbound trains were not merely escaping a place. Whether they intended it or not, they were redrawing the map of American life.'
  question_text: Which statement best captures the central argument of the passage?
  choice_a: The familiar 'push and pull' explanation of the Great Migration is incomplete; information networks and the chain-like nature of migration are needed to explain its scale.
  choice_b: The Great Migration failed to improve the lives of the people who took part in it.
  choice_c: The Chicago Defender was the single cause of the Great Migration.
  choice_d: The Great Migration was caused entirely by the violence of the South and would have happened the same way without any other factors, which makes the pull of the North and the spread of information through the press largely irrelevant to explaining its scale.
  correct_answer: A
  explanation: The passage grants that push and pull were real but argues they cannot by themselves move six million people, emphasizing information (the Black press) and migration as a self-reinforcing chain. D and C overstate single causes; B contradicts the final paragraph.
  distractor_types:
    D: wrong_concept
    B: wrong_concept
    C: too_narrow
