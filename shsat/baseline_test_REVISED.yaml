  correct_answer: D
  explanation: Sentence 3 states the oxygen theory; sentence 4 reports that experiments undercut it — a contrast, which 'however' correctly marks. 'Therefore,' 'similarly,' and 'for instance' would each assert a relationship (result, agreement, example) that does not hold.
