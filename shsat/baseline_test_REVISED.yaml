  passage_title: The Lighthouse Keeper
  passage_text: 'The Lighthouse Keeper


    Each evening when the gulls had gone to roost

    and the long light leaned gold across the bay,

    old Hollis climbed the stair he knew by heart,

    two hundred steps he counted anyway.


    He lit the lamp. He did it as he''d done

    for forty years, the match, the steady flame,

    and never once, in all those forty years,

    had any captain thanked him, or his name.


    He did not mind. Or said he did not mind.

    The ships went by; he watched their lanterns swing

    and vanish where the dark sea meets the dark,

    and felt, he thought, no need for anything.


    But once a year, when autumn storms came down

    and tore the water white against the stone,

    a ship would falter, lost, and find the light,

    and turn, and live — and Hollis, watching, alone,


    would feel the old stair tremble under him

    as if the tower itself had caught its breath.

    He never spoke of this. He only climbed,

    and lit the lamp, and kept the dark from death.


    They have a beacon now that needs no man,

    that turns all night and asks for nothing more.

    The stair is locked. The little house is sold.

    The gulls come back, and no one climbs, before


    the evening leans its gold across the bay

    and leaves it there, ungathered, on the stone —

    the way a thing of value can remain

    when there is no one left to call it one.'
  question_text: What can best be inferred from the lines describing the new beacon 'that needs no man, / that turns all night and asks for nothing more'?
  choice_a: The new beacon does not actually work.
  choice_b: Hollis was asked to operate the new beacon.
  choice_c: The new beacon is more dangerous than the old lamp, and passing ships are now far more likely to be lost at sea than they were when a keeper still watched over the light.
  choice_d: The work Hollis did has been replaced by a machine, which does the task without any of the human devotion he brought to it.
  correct_answer: D
  explanation: The automatic beacon performs the lighting Hollis once did, but the poem frames it as lacking the human element ('needs no man'). C and A are unsupported; B contradicts the locked stair and sold house.
  distractor_types:
    C: inference_leap
    A: wrong_concept
    B: misidentified_detail
