  passage_text: (1) Composting is a simple way to turn kitchen scraps into rich food for a garden. (2) To start, you need a bin or a corner of the yard and a mix of two kinds of material. (3) "Green" materials, such as fruit peels and coffee grounds, add nitrogen. (4) "Brown" materials, such as dry leaves and shredded paper, add carbon. (5) A good pile contains roughly equal amounts of both. (6) Once you have a pile, you must keep it slightly moist and turn it every week or two. (7) Turning the pile mixes in air, the tiny organisms that break down the scraps need oxygen to do their work. (8) Without enough air, a pile can begin to smell unpleasant. (9) In a few months, the bottom of the pile will turn into dark, crumbly compost. (10) You can then spread it around your plants. (11) Composting reduces the amount of garbage a household sends to the landfill. (12) For these reasons, more and more families are giving it a try.
  question_text: 'Sentence 7: "Turning the pile mixes in air, the tiny organisms that break down the scraps need oxygen to do their work." Which revision best corrects the error?'
  choice_a: Turning the pile mixes in air, and the tiny organisms that break down the scraps, need oxygen to do their work.
  choice_b: Turning the pile mixes in air the tiny organisms that break down the scraps need oxygen to do their work.
  choice_c: Turning the pile mixes in air, the tiny organisms, that break down the scraps, need oxygen to do their work.
  choice_d: Turning the pile mixes in air; the tiny organisms that break down the scraps need oxygen to do their work.
  correct_answer: D
  explanation: The original is a comma splice; a semicolon correctly joins the two related independent clauses. A adds an incorrect comma after 'scraps'; B removes punctuation and creates a run-on; C adds unnecessary commas around the essential clause.
  distractor_types:
    A: introduces_new_error
    B: misattributed_error_location
    C: overcorrection
