  choice_a: modified elephants would be more useful to ecosystems than real mammoths than real mammoths ever were, doing a noticeably better job of maintaining the northern grassland than the original animals managed.
  choice_b: the technique is scientifically impossible and will never work at all.
  choice_c: what the technique can create is an approximation rather than a true return of the lost animal, so calling it 'restoration' is misleading.
  choice_d: elephants and mammoths are completely unrelated animals.
