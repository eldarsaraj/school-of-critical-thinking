    When the woman had gone, Mira asked why he had told her not to wind it. The mechanism was sound; a turn of the key would have started it on the spot. Her father took up his eyepiece again and bent over the bench, and for a while she thought he would not answer at all.


    "Some things you don''t hurry back into use," he said finally. "A clock that''s been stopped a long time, you let it remember how to run. You wind it a little, you wait, you wind it a little more." He glanced at her, and there was something in his face she could not name. "It isn''t really about the clock," he added, and then said nothing else, and the shop filled up again with the sound of a thousand small voices, counting.'
