  question_text: After spending 2/5 of her money on books and 1/3 of what remained
    on lunch, Lena has $48 left. How much money did Lena start with?
  choice_a: $80
  choice_b: $120
  choice_c: $180
  choice_d: $240
  correct_answer: B
  explanation: "Work through the problem step by step, tracking what remains after\
    \ each purchase. Let x = the amount Lena started with. After spending 2/5 on books,\
    \ she has 3x/5 left. She then spends 1/3 of that remainder on lunch, leaving 2/3\
    \ of 3x/5 = 2x/5. That final amount is $48: 2x/5 = 48 → x = 120.\r\n\r\n(A) finds\
    \ the right fraction remaining (2/5) but flips it, solving 3x/5 = 48 instead of\
    \ 2x/5 = 48. After both purchases, 2 out of every 5 parts remain — not 3. Double-check\
    \ by tracing the fractions: 3/5 survives books, then 2/3 of that survives lunch:\
    \ (2/3)(3/5) = 2/5.\r\n\r\n(C) adds the two fractions together — 2/5 + 1/3 = 11/15\
    \ total spent — and applies both to the original. But the second fraction doesn't\
    \ apply to the original amount. It applies to what's left after the first purchase.\
    \ \"1/3 of what remained\" is 1/3 of 3x/5, not 1/3 of x.\r\n\r\n(D) misreads the\
    \ second step as keeping 1/3 of what remained rather than spending it. If Lena\
    \ kept 1/3 of the remainder, only x/5 would be left, giving a starting amount\
