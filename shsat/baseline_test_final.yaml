  question_text: "Which edit should be made to the sentence below?\r\n\r\nThe team\
    \ played good during the championship game and won by three points."
  choice_a: Change 'good' to 'well'
  choice_b: Insert a comma before 'and won by three points'
  choice_c: Change 'good' to 'better'
  choice_d: No change is needed
  correct_answer: A
  explanation: 'The word "good" is an adjective — it describes nouns. But in this
    sentence, "good" is being used to describe how the team played, which is the work
    of an adverb. The correct adverb is "well." (B) tries to fix the sentence by adding
    a comma, but the sentence doesn''t need one — "and won by three points" continues
    the description of what the team did, sharing the same subject. (C) recognizes
    that "good" is the problem but applies the wrong rule: "better" would make sense
    only if the sentence were comparing the team''s play to something else. (D) is
    tempting because "played good" sounds fine in everyday speech, but in standard
    written English, the adverb "well" is correct.'
