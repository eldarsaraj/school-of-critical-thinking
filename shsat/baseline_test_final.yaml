  question_text: A rectangular garden has a length that is 3 meters more than twice
    its width. If the width is 5 meters, what is the perimeter of the garden?
  choice_a: '18'
  choice_b: '23'
  choice_c: '36'
  choice_d: '65'
  correct_answer: C
  explanation: "Start by finding the length. The problem says the length is 3 meters\
    \ more than twice the width. Width = 5, so length = 2 × 5 + 3 = 10 + 3 = 13 meters.\
    \ Now apply the perimeter formula for a rectangle: P = 2(L + W) = 2(13 + 5) =\
    \ 2(18) = 36 meters.\r\n\r\n(A) finds L + W = 13 + 5 = 18 correctly but stops\
    \ there, skipping the final multiplication by 2. A rectangle has two lengths and\
    \ two widths — the formula requires doubling the sum.\r\n\r\n(B) adds the length\
    \ once and the width twice: 13 + 5 + 5 = 23. This uses only three sides of the\
    \ rectangle instead of four. Perimeter means all the way around — both lengths\
    \ and both widths must be included.\r\n\r\n(C) computes the area instead of the\
    \ perimeter: 13 × 5 = 65. Area and perimeter are easy to mix up under pressure.\
    \ The question asks how far around the garden — that's perimeter. If it asked\
    \ how much space is inside, that would be area."
