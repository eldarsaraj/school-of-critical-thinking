  question_text: According to the passage, what was the broader significance of the
    Montgomery Bus Boycott beyond Montgomery itself?
  choice_a: It directly convinced the federal government to outlaw segregation on
    all forms of public transportation across the South.
  choice_b: It established Rosa Parks as the most influential civil rights leader
    of the next two decades after Montgomery.
  choice_c: It showed that organized nonviolent protest could force institutional
    change and helped launch the broader civil rights movement.
  choice_d: It convinced Black workers across the South to refuse to use public buses
    until full racial equality was achieved.
  correct_answer: C
  explanation: The passage's last two paragraphs explain what the boycott meant beyond
    Montgomery. Paragraph 5 says it "demonstrated, perhaps for the first time on a
    national scale, that organized, sustained, nonviolent protest could force institutional
    change." It also "introduced Martin Luther King Jr. as a national leader and laid
    the groundwork for the broader civil rights movement of the 1960s." Choice C captures
    both ideas together. (A) goes too far by saying the boycott directly caused federal
    anti-segregation laws — the passage says the boycott "laid the groundwork" for
    what eventually became the Civil Rights Act of 1964, a long chain of events later.
