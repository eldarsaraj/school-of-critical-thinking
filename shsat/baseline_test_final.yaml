    \ volume is 10 × 10 × 10 = 1,000 cm³. The hole is a square prism — its opening\
    \ is 4 cm by 4 cm, and because it's cut all the way through the cube, its length\
    \ is the full 10 cm. So the removed volume is 4 × 4 × 10 = 160 cm³. What's left\
    \ is 1,000 − 160 = 840 cm³.\r\n\r\n(C) is the key trap: imagining the hole as\
    \ a small 4 × 4 × 4 cube. But \"straight through, from one face to the opposite\
    \ face\" means the hole spans the entire 10 cm depth of the cube. Its third dimension\
    \ is 10, not 4 — so it removes 160 cm³, not 64.\r\n\r\n(A) gives the volume of\
    \ the hole itself — the part taken away, not the part remaining. (D) is the cube\
