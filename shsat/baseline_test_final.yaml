  question_text: "Solve the system of equations:\r\n2x + y = 10\r\nx − y = 2"
  choice_a: x = 3, y = 4
  choice_b: x=2, y=6
  choice_c: x = 4, y = 2
  choice_d: x = 5, y = 0
  correct_answer: C
  explanation: "The cleanest way to solve this system is elimination. Notice that\
    \ the first equation has +y and the second has −y — so adding the equations cancels\
    \ y entirely: (2x + y) + (x − y) = 10 + 2 gives 3x = 12, so x = 4. Substitute\
    \ back into either equation: 2(4) + y = 10 → y = 2. The solution is x = 4, y =\
    \ 2, and it satisfies both equations.\r\n\r\nThis question is built so that every\
    \ wrong choice satisfies the first equation, 2x + y = 10 — check them: (3,4),\
    \ (2,6), and (5,0) all give 10. So testing only the first equation tells you nothing;\
    \ all four pass. The second equation, x − y = 2, is what separates them, and only\
    \ x = 4, y = 2 satisfies it (4 − 2 = 2).\r\n\r\nThe lesson: a solution to a system\
    \ must satisfy every equation at once, not just one. Whether you solve algebraically\
    \ or test answer choices, always verify against both equations before committing\
    \ — a pair that fits one equation can easily fail the other."
  distractor_types:
    A: partial_answer
    B: partial_answer
    D: partial_answer
