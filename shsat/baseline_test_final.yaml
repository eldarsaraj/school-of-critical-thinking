  question_text: At a concession stand, 3 hot dogs and 2 drinks cost $13, while 2
    hot dogs and 4 drinks cost $14. What is the cost of one hot dog?
  choice_a: $2
  choice_b: $2.60
  choice_c: $3
  choice_d: $5
  correct_answer: C
  explanation: "This needs a system of two equations. Let h be the price of a hot\
    \ dog and d the price of a drink. The two purchases give 3h + 2d = 13 and 2h +\
    \ 4d = 14. To eliminate the drinks, make the d-terms match: multiply the first\
    \ equation by 2, giving 6h + 4d = 26. Now subtract the second equation (2h + 4d\
    \ = 14): the drink terms cancel, leaving 4h = 12, so h = 3. (Substituting back\
    \ gives d = 2, and 2(3) + 4(2) = 14 confirms it.)\r\n\r\n(A) is the most common\
    \ miss: doing all the algebra correctly but reporting the drink price ($2) instead\
    \ of the hot dog price. With systems, label your variables and re-read which one\
    \ the question asks for before answering.\r\n(B) treats the five items in the\
    \ first purchase as identical, dividing $13 by 5 to get $2.60. But hot dogs and\
    \ drinks have different prices — that's the whole reason two equations are needed.\
    \ You can't average across different items.\r\n\r\n(D) adds the two equations\
    \ instead of subtracting to eliminate a variable. Adding gives 5h + 6d = 27, which\
    \ doesn't isolate anything; the student then conflates this with h + d = 5 (the\
    \ true combined price of one of each) and reports 5. Elimination requires making\
    \ one variable's coefficients match and subtracting, not adding unmatched equations."
  distractor_types:
    A: last_step_trap
    B: wrong_concept
    D: wrong_formula
