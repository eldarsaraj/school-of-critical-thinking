  question_text: What is the value of −12 + 4 × (−3) − (−8)?
  choice_a: −32
  choice_b: '-16'
  choice_c: '8'
  choice_d: '32'
  correct_answer: B
  explanation: "This problem combines two skills that students tend to trip over together: order of operations and the rules for signed numbers. Order of operations (PEMDAS) requires that multiplication be done before any addition or subtraction, so start there: 4 × (−3) = −12. The expression is now −12 + (−12) − (−8), worked left to right. Adding −12 gives −24, and the final term is the classic trap: subtracting a negative is the same as adding a positive, so −(−8) becomes +8. That gives −24 + 8 = −16.\r\n\r\n(A) −32 makes the most common error on this kind of problem — treating −(−8) as −8 instead of +8. Two negatives in a row cancel to a positive, so subtracting −8 adds 8; it does not subtract 8.\r\n\r\n(C) 8 makes a sign error on the multiplication, computing 4 × (−3) as +12 instead of −12. A positive times a negative is always negative.\r\n\r\n(D) 32 ignores order of operations entirely and works strictly left to right: (−12 + 4) × (−3) − (−8). Multiplication is not sequential here — it must be carried out before the surrounding addition and subtraction, no matter where it appears in the expression."
  distractor_types:
    A: sign_error
    C: sign_error
    D: order_of_operations
