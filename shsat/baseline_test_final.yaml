  explanation: 'The central idea of the passage is that the Great Migration was a
    real but complicated escape — the North offered opportunity, but it was not free
    of racism. Paragraphs 3 and 4 work as a pair to build exactly this idea. Paragraph
    3 shows what migrants built: the Harlem Renaissance, Black-owned businesses, newspapers
    like the Chicago Defender. Paragraph 4 shows what migrants still faced: redlining,
    hostility, and the 1919 Chicago riot. Reading them together, you see both sides
    at once — achievement and obstacle — which is the heart of the passage''s message.
    (B) uses real words from the passage but claims the cultural flowering "soon faded,"
