  question_text: A survey of 180 students found that 100 play a sport, 70 play an
    instrument, and 30 play both. How many students play neither?
  choice_a: '40'
  choice_b: '10'
  choice_c: '70'
  choice_d: '140'
  correct_answer: A
  explanation: "The trap in any \"both/neither\" problem is double-counting. The 30\
    \ students who play both a sport and an instrument are already included in the\
    \ 100 sport-players and again in the 70 instrument-players. If you just add 100\
    \ + 70, you've counted those 30 twice. So the number doing at least one activity\
    \ is 100 + 70 − 30 = 140. Everyone else does neither: 180 − 140 = 40.\r\n\r\n\
    (B) is the central error — adding the two groups without removing the overlap,\
    \ getting 170 for \"at least one.\" That overcounts by exactly the 30 who were\
    \ double-counted, which makes \"neither\" come out too small (10 instead of 40).\r\
    \n(C) overcorrects, subtracting the 30 twice. The overlap is removed just once\
    \ — it's counted twice in the addition, so subtracting it a single time fixes\
    \ the double-count exactly.\r\n\r\n(D) reports 140, the number who play at least\
    \ one activity. That's the union, the opposite of what's asked. \"Neither\" is\
    \ everyone left over after removing the union from the total."
  distractor_types:
    B: fast_pattern_match
    C: wrong_concept
    D: partial_answer
