  question_text: A student scored 76, 84, 88, and 72 on four tests. What score does
    she need on her fifth test so that her mean score is exactly 82?
  choice_a: '90'
  choice_b: '80'
  choice_c: '82'
  choice_d: '100'
  correct_answer: A
  explanation: "To find the required fifth score, work backwards from the target mean.\
    \ If the mean of 5 tests must be 82, the five scores must sum to 82×5 = 410. The\
    \ four known scores sum to 76+84+88+72 = 320. So the fifth score must be 410−320\
    \ = 90.\r\n\r\n(B) computes the current mean of the four scores: 320÷4 = 80, and\
    \ reports that. The current mean tells you where things stand now — it doesn't\
    \ tell you what score is needed next. The question asks for the fifth score, which\
    \ requires one more step.\r\n(C) reports 82 — the target mean itself — as the\
    \ required score. This would only work if the four existing scores already averaged\
    \ exactly 82. They don't: they average 80. A score of 82 on the fifth test would\
    \ pull the mean up slightly, but not all the way to 82.\r\n\r\n(D) sets up the\
    \ problem correctly — 82×5 = 410 — but makes an arithmetic error when adding the\
    \ four scores, arriving at 310 instead of 320, and then computes 410−310 = 100.\
    \ Always double-check your addition before the final step: 76+84 = 160, 88+72\
    \ = 160, 160+160 = 320."
  distractor_types:
    B: last_step_trap
    C: wrong_concept
    D: computation_error
