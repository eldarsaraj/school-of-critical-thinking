  correct_answer: C
  explanation: "Losing 15% each year means keeping 85% each year, so you multiply\
    \ by 0.85 once per year. Starting at $20,000: after one year it's worth 20,000\
    \ × 0.85 = $17,000, and after the second year it's 17,000 × 0.85 = $14,450. The\
    \ depreciation compounds — the second year's drop is based on the lower value\
    \ the car already fell to.\r\n\r\n(A) is the central trap, the same idea as the\
    \ growth version: treating the decline as simple rather than compound. Taking\
    \ 15% of the original $20,000 ($3,000) for both years gives $14,000. But the second\
    \ year's 15% is taken from $17,000, which is only $2,550 — a smaller loss, because\
    \ there's less value left to lose. That's why the true value ($14,450) is a bit\
    \ higher than the simple estimate ($14,000).\r\n\r\n(D) stops after one year,\
    \ giving $17,000. The car depreciates across two full years, so the ×0.85 happens\
    \ twice. (B) comes from squaring 0.85 carelessly — 0.85 × 0.85 is 0.7225, not\
