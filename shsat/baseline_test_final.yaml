- section: ELA
  stage: easy_module
  question_number: 1
  question_type: multiple_choice
  skill: sentence_structure
  difficulty: easy
  topic: ''
  passage_group_id: ''
  passage_title: ''
  passage_text: ''
  question_text: "Which edit should be made to the sentence below?\r\n\r\n  After\
    \ studying for hours in the quiet library, the test that had seemed so difficult\
    \ last week now felt manageable to Carlos."
  choice_a: Change 'studying' to 'having studied'
  choice_b: Change 'the test that had seemed so difficult' to 'Carlos found that the
    test, which had seemed so difficult,'
  choice_c: Change 'After studying for hours' to 'After he studied for hours'
  choice_d: No change is needed
  correct_answer: B
  explanation: The opening phrase 'After studying for hours in the quiet library'
    is a dangling modifier — it appears to describe 'the test,' but a test cannot
    study. Choice B fixes this by making Carlos (the actual subject who studied) the
    subject of the main clause.
  distractor_types:
    A: overcorrection
    C: misattributed_error_location
    D: semantic_over_syntactic
- section: ELA
  stage: easy_module
  question_number: 2
  question_type: multiple_choice
  skill: usage_agreement
  difficulty: easy
  topic: ''
  passage_group_id: ''
  passage_title: ''
  passage_text: ''
  question_text: "Which revision corrects the error in the sentence?\r\n\r\n  The\
    \ committee, which had been meeting since September, are expected to release its\
    \ recommendations next week."
  choice_a: Change 'which' to 'who'
  choice_b: Change 'are' to 'is'
  choice_c: Change 'its' to 'their'
  choice_d: Delete the comma after 'September'
  correct_answer: B
  explanation: '''Committee'' is a collective noun treated as singular in standard
    American English (note the singular pronoun ''its'' later in the sentence). The
    verb should be ''is,'' not ''are.'' The sentence already correctly uses ''which''
    for a non-human collective and ''its'' as a singular pronoun.'
  distractor_types:
    A: overgeneralized_rule
    C: misattributed_error_location
    D: overcorrection
- section: ELA
  stage: easy_module
  question_number: 3
  question_type: multiple_choice
  skill: usage_agreement
  difficulty: medium
  topic: ''
  passage_group_id: ela_e_reb
  passage_title: Learning a New Language
  passage_text: 1) Learning a new language is one of the most rewarding things a person
    can do. (2) Studies show that bilingual people have better memory and focus, this
    advantage may even delay age-related cognitive decline. (3) Children often learn
    languages more easily than adults because their brains are still developing. (4)
    However, adults can also become fluent with regular practice and dedication.
  question_text: "Which revision of sentence 2 corrects the error?\r\n\r\n (2) Studies\
    \ show that bilingual people have better memory and focus, this advantage may\
    \ even delay age-related cognitive decline."
  choice_a: No change is needed.
  choice_b: Replace the comma after "focus" with a semicolon.
  choice_c: Insert a comma after "advantage."
  choice_d: 'Insert "however" after the comma: "...memory and focus, however this
    advantage may even delay..."'
  correct_answer: B
  explanation: 'Sentence 2 contains a comma splice: two independent clauses joined
    by only a comma. A semicolon correctly links two closely related independent clauses,
    fixing the error.'
  distractor_types:
    A: semantic_over_syntactic
    C: overcorrection
    D: overgeneralized_rule
- section: ELA
  stage: easy_module
  question_number: 4
  question_type: multiple_choice
  skill: sentence_structure
  difficulty: medium
  topic: ''
  passage_group_id: ''
  passage_title: ''
  passage_text: ''
  question_text: "Which revision best corrects the error in the sentence?\r\n\r\n\
    Although Marcus prepared diligently for the debate tournament, his opponent's\
    \ arguments were more persuasive than him."
  choice_a: Change "than him" to "than his."
  choice_b: Change "than him" to "than he was."
  choice_c: Change "more persuasive" to "the most persuasive."
  choice_d: No change is needed.
  correct_answer: A
  explanation: 'The sentence compares "his opponent''s arguments" to "him" — arguments
    and a person cannot be logically compared. "Than his" means "than his arguments,"
    making the comparison parallel: arguments compared to arguments.'
  distractor_types:
    B: misattributed_error_location
    C: overgeneralized_rule
    D: semantic_over_syntactic
- section: ELA
  stage: easy_module
  question_number: 5
  question_type: multiple_choice
  skill: supporting_detail
  difficulty: easy
  topic: ''
  passage_group_id: ela_e_p1
  passage_title: Honeybees and Their Hive
  passage_text: "Honeybees are remarkable insects that live and work together in large\
    \ colonies. A single hive can contain up to 60,000 bees, the vast majority of\
    \ which are female worker bees. These workers do nearly all of the labor in the\
    \ colony — collecting nectar from flowers, producing honey, building and repairing\
    \ the wax comb, cleaning the hive, and caring for the developing young, called\
    \ larvae. A single worker bee may visit thousands of flowers in a single day,\
    \ traveling miles from the hive in search of food.\r\n\r\nThe queen bee, by contrast,\
    \ has one main job: to lay eggs. During the warmest summer months, a healthy queen\
    \ can produce up to 2,000 eggs per day. The colony's third caste consists of male\
    \ bees, called drones, whose sole purpose is to mate with the queen of another\
    \ colony. After mating, drones die. Those that survive the summer face a harsh\
    \ fate in autumn, when worker bees push them out of the hive to conserve food\
    \ during the lean winter months.\r\n\r\nPerhaps the most fascinating behavior\
    \ of the honeybee is the way it communicates. When a forager bee discovers a productive\
    \ patch of flowers, she returns to the hive and performs an elaborate movement\
    \ called the waggle dance. The angle at which the bee dances on the vertical surface\
    \ of the comb indicates the direction of the flowers relative to the sun. The\
    \ duration of the central \"waggle\" portion of the dance indicates how far away\
    \ the flowers are. Other workers attend to the dance, then fly out and locate\
    \ the food source with surprising accuracy. Scientists did not fully understand\
    \ this system until the Austrian researcher Karl von Frisch decoded it in the\
    \ 1940s, work for which he later won the Nobel Prize. Some biologists have called\
    \ the waggle dance the most sophisticated nonhuman communication system ever discovered.\r\
    \n\r\nThe importance of honeybees extends far beyond the hive. They pollinate\
    \ approximately one-third of all the food humans eat, including apples, almonds,\
    \ blueberries, cucumbers, and many other crops. Without bees to transfer pollen\
    \ between flowers, these plants cannot produce the fruits and seeds that feed\
    \ both humans and livestock. In economic terms, honeybee pollination contributes\
    \ an estimated fifteen billion dollars annually to American agriculture alone.\r\
    \n\r\nIn recent decades, however, beekeepers have grown alarmed. Beginning around\
    \ 2006, hives across North America and Europe began collapsing at unprecedented\
    \ rates — a phenomenon scientists named Colony Collapse Disorder. The causes appear\
    \ to be multiple and interconnected: parasitic mites that weaken hives, pesticides\
    \ that impair bees' ability to navigate, viral diseases, and the loss of wildflower\
    \ habitat to industrial farming. Some critics argue that fears about honeybee\
    \ decline have been overstated, noting that the global number of managed honeybee\
    \ colonies has actually increased since 2006 thanks to beekeeping efforts. But\
    \ entomologists counter that this figure obscures the larger picture: native wild\
    \ bees, which also play crucial roles in pollination, continue to vanish, and\
    \ managed honeybee colonies require ever more intensive human intervention simply\
    \ to survive.\r\n\r\nWhat is clear is that the relationship between humans and\
    \ honeybees is older and deeper than most people realize. Cave paintings from\
    \ over 8,000 years ago depict humans gathering honey from wild hives, and ancient\
    \ Egyptian tombs contain jars of honey still preserved after millennia. Today,\
    \ the question is not whether humans need bees — that has long been settled —\
    \ but whether modern agricultural systems can be redesigned to keep them alive."
  question_text: Which detail from the passage best supports the claim that worker
    bees are essential to a hive's survival?
  choice_a: '"A single worker bee may visit thousands of flowers in a single day."'
  choice_b: '"These workers do nearly all of the labor in the colony."'
  choice_c: '"The vast majority of bees are female worker bees."'
  choice_d: '"Without bees to transfer pollen between flowers, these plants cannot
    produce the fruits and seeds that feed both humans and livestock."'
  correct_answer: B
  explanation: The claim is that worker bees are essential to the hive's survival.
    Choice B directly states that workers do "nearly all of the labor," supporting
    that claim. The other choices contain accurate passage details but address different
    ideas.
  distractor_types:
    A: too_narrow
    C: true_but_irrelevant
    D: misidentified_detail
