  passage_text: "Well, son, I'll tell you:\r\nLife for me ain't been no crystal stair.\r\
    \nIt's had tacks in it,\r\nAnd splinters,\r\nAnd boards torn up,\r\nAnd places\
    \ with no carpet on the floor —\r\nBare.\r\nBut all the time\r\nI'se been a-climbin'\
    \ on,\r\nAnd reachin' landin's,\r\nAnd turnin' corners,\r\nAnd sometimes goin'\
    \ in the dark\r\nWhere there ain't been no light.\r\nSo boy, don't you turn back.\r\
    \nDon't you set down on the steps\r\n'Cause you finds it's kinder hard.\r\nDon't\
    \ you fall now —\r\nFor I'se still goin', honey,\r\nI'se still climbin',\r\nAnd\
    \ life for me ain't been no crystal stair."
  question_text: Which line from the poem most strongly supports the idea that the
    mother speaks from inside her own ongoing struggle, not from a position of having
    finished it?
  choice_a: '"Life for me ain''t been no crystal stair."'
  choice_b: '"It''s had tacks in it, / And splinters, / And boards torn up,"'
  choice_c: '"But all the time / I''se been a-climbin'' on,"'
  choice_d: '"For I''se still goin'', honey, / I''se still climbin'',"'
  correct_answer: D
  explanation: 'Evidence-selection questions require you to match a specific claim
    to the specific words in the text that establish it. The question asks for evidence
    that the mother is still inside her struggle — not finished, still going. That
    requires a line in the present tense that says she is currently climbing. Only
    one line in the poem does this: "For I''se still goin'', honey, / I''se still
    climbin''." The word "still" appears twice, and both verbs are present-tense —
    that''s choice D. (A) is the poem''s most famous line, but it says her life has
    been hard; it doesn''t say whether she''s done with the climbing or not. (B) describes
    the specific hardships of her life (tacks, splinters), which proves her life has
    been difficult — but again says nothing about her present state. (C) is the closest
    trap: "I''se been a-climbin'' on" uses a continuous verb, so it looks like ongoing
    climbing. But "been a-climbin''" is past tense — it describes her past life as
    one of constant climbing. The line "all the time" tells you this is a summary
    of her past effort. Only D, with its repeated "still" and present-tense verbs,
    establishes that she is climbing now.'
  distractor_types:
    A: too_literal
    B: too_narrow
    C: true_but_irrelevant
