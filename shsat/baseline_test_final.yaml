  question_text: What's the function of sentence 10 from the second paragraph?
  choice_a: To summarize the problem Black Americans were facing
  choice_b: To summarize the complex causes of The Great Migration
  choice_c: To explain labor shortages that affected the North
  choice_d: To explain why opportunities in the North were attractive to Black Americans
  correct_answer: B
  explanation: 'The sentence (10) "The pull of opportunity in the North met the push
    of fear and poverty in the South" summarizes the entire (complex) nature of The
    Great Migration: Black Americans moved North not only because the poverty and
    discrimination in South made them do so, but also because there were many employment
    opportunities in the North. It does not summarize the problems of the Black American
    community, that''s too broad. It also doesn''t explain the labor shortages in
    the North, that is just one of the issues mentioned. It also doesn''t explain
    why opportunities in the North were attractive to Black Americans: the focus of
