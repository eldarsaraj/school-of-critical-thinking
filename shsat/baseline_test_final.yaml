  question_text: In a coordinate plane, what is the distance between the points (−2,
    3) and (4, −5)?
  choice_a: '6'
  choice_b: '8'
  choice_c: '10'
  choice_d: '14'
  correct_answer: C
  explanation: "The distance between two points is the length of the straight line\
    \ connecting them, which forms the hypotenuse of a right triangle. The triangle's\
    \ legs are the horizontal and vertical changes between the points. Horizontal\
    \ change: from x = −2 to x = 4 is 4 − (−2) = 6. Vertical change: from y = 3 to\
    \ y = −5 is −5 − 3 = −8 (a length of 8). Apply the Pythagorean theorem: distance\
    \ = √(6² + 8²) = √(36 + 64) = √100 = 10.\r\n\r\n(D) is the key trap: adding the\
    \ legs (6 + 8 = 14). That would be the distance if you traveled along the grid\
    \ — right 6, then down 8. But the straight-line distance is shorter than going\
    \ around two sides of a triangle, and it's found with the Pythagorean theorem,\
    \ not by adding. The hypotenuse (10) is always less than the sum of the legs (14).\r\
    \n\r\n(A) and (B) each use only one leg. The two points differ in both x and y,\
    \ so both changes contribute. Using just the horizontal (6) or just the vertical\
    \ (8) gives the length of one side of the triangle, not the diagonal connecting\
    \ the points.\r\nOne care point with the signs: the change values can be negative\
    \ (the vertical change here is −8), but squaring removes the sign — (−8)² = 64\
    \ — so the distance comes out positive either way."
  distractor_types:
    A: partial_answer
    B: partial_answer
    D: wrong_formula
