  passage_group_id: ela_h_p2
  passage_title: The Migrant
  passage_text: "My grandmother carried two things across the Atlantic: a rosary whose\
    \ beads she had worn smooth by the time she reached the harbor, and a silence\
    \ she never surrendered. She had left a village in Croatia in 1923, at seventeen,\
    \ with a name that the immigration officer at Ellis Island could not spell and\
    \ therefore did not try. He wrote something else in the ledger, and that something\
    \ else became us.\r\n\r\nShe learned English from labels on soup cans and from\
    \ the radio on Sunday mornings. She learned it without accent — or rather, she\
    \ learned it with an accent that sounded like nobody's home country, a voice that\
    \ belonged to no map. She was proud of this, I think, though she never said so.\
    \ She did not say much about anything that had happened before.\r\n\r\nI found\
    \ her photographs only after she died — a box of them, unlabeled, faces I could\
    \ not name. A village church. A field. A group of young women standing with their\
    \ arms around each other, squinting into Adriatic sunlight, laughing at something\
    \ just outside the frame. My grandmother is among them — I know her jaw, her way\
    \ of standing — but she is eighteen in the photograph, and she looks like she\
    \ belongs entirely to that moment, to that place, to those women whose names I\
    \ will never know.\r\n\r\nI have thought about that photograph for thirty years.\
    \ I think it is not simply a record of a lost past. I think it is evidence of\
    \ a self that crossed the ocean and did not arrive — or arrived differently, changed\
    \ by the passage itself. Immigration is not, as I was taught, a journey from one\
    \ place to another. It is a kind of interior translation, a rendering of oneself\
    \ into a language that was never quite designed for you."
  question_text: "In the last paragraph, when describing her thoughts about the picture\
    \ of the grandmother, the narrator first says the grandmother's self \"did not\
    \ arrive,\" then immediately revises this to \"or arrived differently, changed\
    \ by the passage itself.\" \r\n\r\nThis self-correction most strongly suggests\
    \ that the narrator is —"
  choice_a: admitting that she cannot truly know what became of the self her grandmother
    had once been
  choice_b: 'refining a stark claim into a more exact one: the grandmother''s self
    was not erased but remade'
  choice_c: softening a painful idea out of tenderness toward her grandmother's memory
  choice_d: 'describing two stages: a self that was first lost and a new self that
    slowly formed'
  correct_answer: B
  explanation: 'None can be eliminated by "you only read half the sentence." Each
    is a genuine theory of why a writer revises mid-thought — to confess uncertainty
    (A), to refine a claim (B), to soften a blow (C), or to narrate a sequence (D)
    — and three of them draw real support from the essay''s own features (its pervasive
    not-knowing, its tenderness, its theme of gradual change). The student has to
    recognize that this particular revision is doing the precision job: it replaces
    an overstatement (erased) with the exact idea (transformed). The sharpest trap
    is A, because the essay''s dominant mood is unknowability — but the unknowability
    is about the grandmother''s past, not about whether the self was erased or remade,
    which the narrator asserts with conviction.'
