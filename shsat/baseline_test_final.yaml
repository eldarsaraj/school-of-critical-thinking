  question_text: A square has an area of 144 cm². If the side length is increased
    by 3 cm, what is the new perimeter?
  choice_a: 48 cm
  choice_b: 60 cm
  choice_c: 51 cm
  choice_d: 225 cm²
  correct_answer: B
  explanation: "Work through the problem in order. The area of a square equals side²,\
    \ so find the side by taking the square root: √144 = 12 cm. The side is then increased\
    \ by 3: 12+3 = 15 cm. The perimeter of a square is 4 times the side length: 4×15\
    \ = 60 cm.\r\n(A) finds the original side (12 cm) and original perimeter (48 cm)\
    \ but stops before applying the increase. The problem asks for the new perimeter\
    \ after the change — one more step is needed.\r\n\r\n(C) takes the original perimeter\
    \ (48 cm) and adds 3 directly, getting 51 cm. But it's the side that increases\
    \ by 3, not the perimeter. Since all four sides grow by 3 cm each, the perimeter\
    \ grows by 4×3 = 12 cm, not 3. The correct new perimeter is 48+12 = 60.\r\n\r\n\
    (D) correctly finds the new side as 15 cm but then squares it instead of multiplying\
    \ by 4: 15² = 225. That's the new area, not the new perimeter. A square with side\
    \ 15 has perimeter 4×15 = 60 — always multiply by 4 for perimeter, square for\
    \ area."
  distractor_types:
    A: last_step_trap
    C: wrong_formula
    D: wrong_formula
