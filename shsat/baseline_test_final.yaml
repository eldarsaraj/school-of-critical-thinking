  question_text: "Which edit should be made to the sentence below?\r\n\r\nThe series\
    \ of lectures on ancient civilizations, attended by hundreds of students each\
    \ semester, have become one of the university's most popular offerings."
  choice_a: No change is needed.
  choice_b: Change 'The series of lectures' to 'The lectures in the series'
  choice_c: Change 'have become' to 'have remained'
  choice_d: Change 'have become' to 'has become'
  correct_answer: D
  explanation: 'The subject of this sentence is "The series" — singular (one series
    of lectures). Everything between it and the verb describes the series, and the
    two plural words right before the verb ("civilizations" and "students") make the
    plural "have become" sound correct. But a singular subject needs a singular verb:
    "has become." (A) is the most tempting wrong answer because the sentence sounds
    fine when you read it aloud — but sounding right isn''t the same as being right;
    the agreement is off. (B) does fix the disagreement, but in the wrong way: it
    rewrites the subject to be plural ("The lectures... have become"), which changes
    the meaning — the sentence is about the series being popular, not the individual
    lectures — and rewrites more than necessary. (C) changes the verb but in the wrong
    way: "have remained" is still plural, so the agreement error is still there. The
    only edit that fixes the actual problem with the smallest change is making the
    verb singular.'
  distractor_types:
    A: semantic_over_syntactic
    B: misattributed_error_location
    C: misidentified_detail
- section: ELA
  stage: hard_module
  question_number: 2
