    likely means
  choice_a: Memory of what the student has been working on
  choice_b: The brain's ability to remember multiple things
  choice_c: The brain's capacity to do manage multiple tasks
  choice_d: The brain's ability to concentrate on a single task
  correct_answer: C
  explanation: According to passage B, research suggest that smartphones reduce working
    memory -- the brain's ability to keep attention on multiple details of some complex
    tasks. It's not memory of what the student has been working on (that's too literal).
