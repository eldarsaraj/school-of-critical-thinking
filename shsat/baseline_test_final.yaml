    \ 3 oranges. Second, and more subtly, the apples must come out to a whole number:\
    \ 2a = 24 − 3o has to be even, which forces 3o to be even, so o itself must be\
    \ even. The smallest even number that's at least 3 is 4. With o = 4, 2a = 24 −\
    \ 12 = 12, so a = 6.\r\n\r\n(B) is the heart of the problem. Setting oranges to\
    \ the bare minimum of 3 seems to maximize apples, giving a = 7.5 — but you can't\
