  question_text: A bag contains 4 red marbles, 5 blue marbles, and 3 green marbles.
    If one marble is drawn at random, what is the probability that it is NOT blue?
  choice_a: 5/12
  choice_b: 1/2
  choice_c: 7/12
  choice_d: 2/3
  correct_answer: C
  explanation: "Total marbles = 4 + 5 + 3 = 12. The question asks for the probability\
    \ of NOT drawing blue, so count everything except blue: 4 red + 3 green = 7 non-blue\
    \ marbles. P(not blue) = 7/12.\r\n\r\n(A) finds P(blue) = 5/12 instead of P(not\
    \ blue). The word \"NOT\" flips the question — instead of counting blue marbles,\
    \ count all the others. A quick check: P(blue) + P(not blue) must equal 1. 5/12\
    \ + 7/12 = 1. ✓\r\n(B) counts only red marbles as \"not blue,\" getting 4/12 =\
    \ 1/3. There are two colors that are not blue — red and green — and both must\
    \ be included. \"Not blue\" means anything other than blue, not just the first\
    \ non-blue color you think of.\r\n\r\n(C) counts 2 non-blue colors out of 3 total\
    \ colors: 2/3. This treats each color as an equally likely outcome, but probability\
    \ depends on the number of individual marbles, not the number of color categories.\
    \ Red and green together account for 7 marbles, not 2 — the marble counts are\
    \ what matter."
  distractor_types:
    A: misread_question
    B: partial_answer
    D: wrong_concept
