  question_text: A positive integer is tripled, then decreased by 7. The result is
    a number between 20 and 30, inclusive. What is the largest such positive integer?
  choice_a: '7'
  choice_b: '12'
  choice_c: '9'
  choice_d: '13'
  correct_answer: B
  explanation: "Set up a compound inequality: the result of tripling n and subtracting\
    \ 7 must fall between 20 and 30 inclusive, so 20 ≤ 3n−7 ≤ 30. Add 7 to all three\
    \ parts: 27 ≤ 3n ≤ 37. Divide by 3: 9 ≤ n ≤ 12.33. Since n must be a positive\
    \ integer, the valid values are 9, 10, 11, and 12. The largest is 12.\r\n\r\n\
    (A) makes a sign error when clearing the −7: subtracts instead of adds, getting\
    \ 3n ≤ 30−7 = 23, then n ≤ 7.67 → 7. To isolate 3n, you undo the −7 by adding\
    \ 7 to both sides — not subtracting.\r\n(C) finds the correct range 9 ≤ n ≤ 12\
    \ but reports 9 — the smallest valid integer — instead of the largest. Re-read\
    \ the question before writing your answer. \"Largest\" and \"smallest\" are easy\
    \ to swap under time pressure.\r\n\r\n(D) reaches n ≤ 12.33 correctly but rounds\
    \ up to 13. Check: 3(13)−7 = 32, which is greater than 30 — outside the allowed\
    \ range. When a non-integer answer must be rounded to satisfy a maximum condition,\
    \ always round down."
  distractor_types:
    A: sign_error
    C: misread_question
    D: estimation_failure
