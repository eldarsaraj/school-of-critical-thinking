  question_text: Class A has 20 students with a mean test score of 78. Class B has
    30 students with a mean test score of 88. What is the mean score of all 50 students
    combined?
  choice_a: '82'
  choice_b: '83'
  choice_c: '84'
  choice_d: '88'
  correct_answer: C
  explanation: "You cannot average the two class means directly — the classes are\
    \ different sizes, so they don't contribute equally to the combined mean. Instead,\
    \ find the total points scored in each class. Class A: 20×78 = 1,560. Class B:\
    \ 30×88 = 2,640. Combined total = 4,200. Divide by the total number of students:\
    \ 4,200÷50 = 84.\r\n\r\n(A) uses the right method but swaps the class sizes —\
    \ multiplies Class A's mean by 30 and Class B's mean by 20: 30×78 + 20×88 = 4,100.\
    \ 4,100÷50 = 82. Always match each mean to its correct class size before multiplying.\r\
    \n\r\n(B) averages the two class means: (78+88)÷2 = 83. This only works when both\
    \ groups are the same size. Here Class B has 30 students versus Class A's 20 —\
    \ it's larger, so its mean of 88 should pull the combined result closer to 88\
    \ than to 78. The answer of 84 is indeed closer to 88 than to 78, which is a useful\
    \ sanity check.\r\n\r\n(D) reports 88 — the higher class mean. The combined mean\
    \ of two groups always falls strictly between the two individual means, never\
    \ equal to either one (as long as both groups are non-empty). 84 sits between\
    \ 78 and 88, closer to 88 because that class is larger."
  distractor_types:
    A: proportion_inversion
    B: fast_pattern_match
    D: misread_question
