  question_text: The passage repeatedly emphasizes Tomás's relationship to being asked
    about himself. Based on the passage, which statement best describes his feelings
    about being questioned by others?
  choice_a: He resents adults like his mother who insist on giving him advice about
    making friends.
  choice_b: He prefers to be approached by people who don't expect him to justify
    how he feels.
  choice_c: He has grown defensive about his move and refuses to discuss it with anyone
    new.
  choice_d: He is afraid that explaining his feelings to others will make those feelings
    worse.
  correct_answer: B
  explanation: 'The passage shows that being asked about himself feels like a burden
    to Tomás. He is "grateful" when Sasha doesn''t ask why he looks sad, "tired of
    being the new boy who had to explain," and Sasha''s final invitation — "You don''t
    have to. But you could" — gives him space without pressure. He doesn''t resent
    his mother (A), he doesn''t refuse to talk about the move (C), and the passage
    shows confusion, not fear (D). What he wants is what Sasha gives him: someone
    who shows up kindly without demanding an explanation.'
