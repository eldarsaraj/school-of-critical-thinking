  question_text: What is the value of |−7 + 3| − 2 × |2 − 9|?
  choice_a: −10
  choice_b: '-4'
  choice_c: '10'
  choice_d: '14'
  correct_answer: A
  explanation: "Three things have to happen in the right order. First, evaluate inside\
    \ each set of absolute value bars: −7 + 3 = −4 and 2 − 9 = −7. Then apply the\
    \ absolute values, which make both results positive: |−4| = 4 and |−7| = 7. Now\
    \ the expression is 4 − 2 × 7. Order of operations requires multiplying before\
    \ subtracting: 2 × 7 = 14, then 4 − 14 = −10.\r\n\r\n(B) makes the classic absolute-value\
    \ mistake: splitting |−7 + 3| into |−7| + |3| = 10. Absolute value applies to\
    \ the result of what's inside, not to each piece separately. You must combine\
    \ −7 + 3 = −4 first, then take the absolute value: |−4| = 4, not 10.\r\n(C) drops\
    \ the bars and works with the raw signed values. The absolute value bars change\
    \ the result — they turn −4 into 4 and −7 into 7. Ignoring them leaves the negatives\
    \ in play and lands on a completely different value.\r\n\r\n(D) handles the absolute\
    \ values correctly but breaks order of operations, subtracting 4 − 2 = 2 before\
    \ multiplying by 7. Multiplication comes before subtraction: the 2 × 7 = 14 must\
    \ be computed first, then subtracted from 4."
  distractor_types:
    B: wrong_concept
    C: wrong_formula
    D: order_of_operations
