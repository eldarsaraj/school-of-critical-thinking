  question_text: As used in paragraph 4, the word "weathered" most nearly means —
  choice_a: broken down gradually by exposure to natural elements over long periods
  choice_b: damaged by harsh rain, wind, or temperature changes
  choice_c: preserved through changing seasons and varying climate conditions
  choice_d: tested or strengthened through difficult experiences
  correct_answer: A
  explanation: The word "weathered" comes from the noun "weather," but it has a more
    specific meaning in science. When something is "weathered," it has been slowly
    broken down by exposure to natural elements — wind, water, temperature changes
    — over very long periods of time. The passage's clue is "weathered into soil"
    — the lava's minerals don't just get rained on; they become transformed into something
    new (soil). (B) catches the meteorological association but misses that weathering
    is a transformation process, not just damage. (C) goes the wrong direction — weathering
    breaks things down, not preserves them. (D) picks up a figurative meaning of "weathered"
    (as in "a weathered traveler") that doesn't fit a description of literal minerals
    becoming soil.
