  question_text: Why does the author most likely include the detail that Karl von
    Frisch won the Nobel Prize for decoding the waggle dance in 1940?
  choice_a: To show that Karl von Frisch was a respected scientist
  choice_b: To emphasize the scientific significance of bee communication
  choice_c: To establish when scientists first developed a complete understanding
    of the waggle dance
  choice_d: To suggest that the waggle dance is the most sophisticated form of communication
    ever observed in nature
  correct_answer: B
  explanation: The Nobel Prize detail signals to readers that the waggle dance is
