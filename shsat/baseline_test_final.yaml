  question_text: A jacket originally costs $75. The store increases the price by 20%,
    then holds a sale and reduces the new price by 20%. What is the final price?
  choice_a: '60'
  choice_b: '75'
  choice_c: '90'
  choice_d: '72'
  correct_answer: D
  explanation: "Apply the two percent changes one at a time, using the result of each\
    \ step as the starting point for the next. First, a 20% increase on $75: $75 ×\
    \ 1.2 = $90. Then a 20% decrease on the new price of $90: $90 × 0.8 = $72.\r\n\
    \r\n(A) applies a net −20% to the original price: $75 × 0.8 = $60. But the two\
    \ percent changes don't combine into a single −20% operation. Each one must be\
    \ applied to the price that exists at that moment — not to the original.\r\n\r\
    \n(B) assumes a 20% increase followed by a 20% decrease returns to the starting\
    \ price. This feels logical but is wrong. The increase adds 20% of $75 = $15.\
    \ The decrease removes 20% of $90 = $18. More dollars come off than went on, so\
    \ the final price is lower than the original.\r\n\r\n(C) correctly finds the price\
    \ after the increase — $75 × 1.2 = $90 — but stops there. The problem has two\
    \ steps. Always read to the end of the question before writing your answer."
