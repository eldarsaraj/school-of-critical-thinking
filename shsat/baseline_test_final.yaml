  passage_group_id: ela_e_p3
  passage_title: How Volcanoes Work
  passage_text: "A volcano is an opening in Earth's surface through which molten rock,\
    \ ash, and gases escape from deep underground. The molten rock is called magma\
    \ when it remains beneath the surface and lava once it emerges into the open air.\
    \ Lava can reach temperatures above 2,000 degrees Fahrenheit — hot enough to melt\
    \ many of the metals humans use to build cars and buildings. Despite these extreme\
    \ conditions, volcanoes are not random or chaotic features of the planet. Their\
    \ locations follow clear geological patterns.\r\n\r\nVolcanoes form most often\
    \ at the boundaries between tectonic plates — the enormous slabs of rock that\
    \ make up Earth's outer shell. Where two plates collide, one is often forced downward\
    \ into the hot mantle, where it begins to melt. The resulting magma is less dense\
    \ than the surrounding rock, so it rises slowly upward, sometimes over thousands\
    \ of years, until it bursts through the surface. A second type of volcano forms\
    \ where plates pull apart, allowing magma to rise into the gap. A third type,\
    \ called a hotspot volcano, forms over a stationary plume of hot material deep\
    \ within Earth; as the plate above slowly drifts, a chain of volcanoes — like\
    \ the Hawaiian Islands — is created.\r\n\r\nNot all volcanic eruptions look or\
    \ behave the same way. Shield volcanoes, such as those that built the Hawaiian\
    \ Islands, erupt relatively gently. Their lava is thin and fast-flowing, and it\
    \ tends to travel long distances over the landscape rather than exploding upward.\
    \ While such eruptions can destroy property, they rarely kill people, because\
    \ the slow-moving lava gives residents time to evacuate. Stratovolcanoes, by contrast,\
    \ are far more dangerous. Their lava is thick and traps gas under enormous pressure.\
    \ When that pressure is released, the result is a violent explosion that can send\
    \ ash, rock, and superheated gas miles into the atmosphere. The 1980 eruption\
    \ of Mount St. Helens in Washington State destroyed more than 200 square miles\
    \ of forest in a matter of minutes and killed 57 people. The 1815 eruption of\
    \ Mount Tambora in Indonesia was even more devastating: it ejected so much ash\
    \ into the atmosphere that global temperatures dropped, and the following year\
    \ became known across the Northern Hemisphere as \"the year without a summer,\"\
    \ causing crop failures and famine thousands of miles from the volcano itself.\r\
    \n\r\nYet to think of volcanoes only as destroyers is to misunderstand them. Volcanic\
    \ eruptions also create. The minerals released by lava, once weathered into soil,\
    \ are extraordinarily fertile, which is why some of the most productive farmland\
    \ in the world — the slopes of Mount Vesuvius in Italy, the highlands of Java,\
    \ the foothills of Mount Kilimanjaro — sits in the shadow of active volcanoes.\
    \ Entire islands, including the Hawaiian chain and Iceland, were built by repeated\
    \ eruptions over millions of years. Even the air we breathe owes something to\
    \ volcanoes: scientists believe that gases released by volcanic activity during\
    \ Earth's early history helped form the planet's first atmosphere, setting the\
    \ stage for the evolution of life itself.\r\n\r\nLiving near a volcano, then,\
    \ has always been a calculated risk. Farmers accept the danger of eruption in\
    \ exchange for the richness of the soil. Coastal communities in Iceland accept\
    \ periodic disruption in exchange for geothermal energy that heats their homes\
    \ nearly for free. Modern volcanologists work to make this trade safer by monitoring\
    \ tremors, gas emissions, and surface deformations that often precede eruptions\
    \ by days or weeks. The science is far from perfect, but it has saved thousands\
    \ of lives. Volcanoes will keep erupting — that much is certain. What has changed\
    \ is humanity's growing ability to listen for the warning."
  question_text: What is the main purpose of paragraph 2?
  choice_a: To compare the three types of volcanoes and rank them by how dangerous
    each one is
  choice_b: To explain that tectonic plates are constantly moving and changing Earth's
    geography
  choice_c: To demonstrate that volcanoes form through specific and identifiable geological
    mechanisms
  choice_d: To introduce the Hawaiian Islands as the most famous example of volcanic
    activity
  correct_answer: C
  explanation: 'Paragraph 1 ends with the claim that volcanoes "are not random or
    chaotic features of the planet. Their locations follow clear geological patterns."
    Paragraph 2 then delivers on this claim by laying out the three specific mechanisms
    by which volcanoes form: collision of tectonic plates, plates pulling apart, and
    hotspots. The paragraph''s purpose is to show that volcanoes are a system with
    identifiable causes, not arbitrary events. (A) catches that the paragraph describes
    three types, but the paragraph doesn''t rank them by danger — that comes later.
    (B) picks up on the tectonic-plate references, but the focus is volcanoes, not
    plate tectonics generally. (D) is drawn in by the memorable Hawaiian Islands example,
    but Hawaii appears only briefly as an illustration of the hotspot type, not as
    the paragraph''s main topic.'
  distractor_types:
    A: misidentified_detail
    B: inference_leap
    D: surface_match
- section: ELA
  stage: easy_module
  question_number: 23
  question_type: multiple_choice
  skill: inference
  difficulty: easy
  topic: ''
  passage_group_id: ela_e_p4
  passage_title: Rosa Parks and the Montgomery Bus Boycott
  passage_text: "On the evening of December 1, 1955, Rosa Parks, a 42-year-old seamstress\
    \ and longtime civil rights activist, boarded a city bus in Montgomery, Alabama,\
    \ after a long day of work. She paid her fare, took a seat in the \"colored section\"\
    \ toward the back of the bus, and rode in silence as the bus filled with passengers.\
    \ When the white section in front filled up, the driver ordered Parks and three\
    \ other Black passengers to give up their seats. The other three complied. Parks\
    \ did not. When the driver threatened to call the police, she replied that he\
    \ could go ahead. Within minutes, she was arrested and taken to the city jail.\r\
    \n\r\nHer arrest was not the spontaneous act of a tired woman, as it has often\
    \ been described in textbooks. Parks had been an active member of the National\
    \ Association for the Advancement of Colored People (NAACP) for over a decade,\
    \ serving as secretary of the Montgomery chapter. She had attended workshops at\
    \ the Highlander Folk School, an interracial training center for civil rights\
    \ organizers in Tennessee. She knew Montgomery's Black ministers and community\
    \ leaders, and they knew her.\r\n\r\nJust as importantly, Montgomery's civil rights\
    \ leaders had been waiting for someone like her. For years, E. D. Nixon, the former\
    \ head of the local NAACP chapter, had been searching for a \"test case\" — an\
    \ arrest that could be used to challenge bus segregation in federal court. Earlier\
    \ in 1955, a 15-year-old named Claudette Colvin had been arrested for the same\
    \ offense, but organizers had hesitated to build a movement around her case. When\
    \ Parks was arrested that December evening, Nixon recognized her immediately as\
    \ the figure he had been hoping to find: a respected, courageous, \"above reproach\"\
    \ activist whose case could carry the moral weight of the entire community. The\
    \ arrest itself was not arranged. But the response was ready.\r\n\r\nWithin days,\
    \ a young minister named Martin Luther King Jr., newly arrived in Montgomery and\
    \ not yet famous, agreed to lead a boycott of the city's bus system. The Women's\
    \ Political Council, led by Jo Ann Robinson, distributed 35,000 flyers overnight.\
    \ Most Black residents of Montgomery depended on public buses to get to work,\
    \ and many had no other way to travel the long distances between their neighborhoods\
    \ and the white households or businesses where they were employed. To make the\
    \ boycott work, organizers established a network of carpools, recruited Black\
    \ taxi drivers willing to charge bus-fare rates, and arranged for those who could\
    \ not get a ride to walk. Some walked many miles each day, in heat and in winter\
    \ rain, for over a year.\r\nThe boycott lasted 381 days. During that time, the\
    \ city's bus company lost the majority of its riders and suffered serious financial\
    \ damage. White segregationists responded with intimidation: King's home was bombed,\
    \ leaders received death threats, and many participants lost their jobs. Yet the\
    \ boycott held. In November 1956, the United States Supreme Court ruled in Browder\
    \ v. Gayle that segregation on Montgomery's buses was unconstitutional. On December\
    \ 20, 1956, Montgomery's buses were officially desegregated, and the boycott ended\
    \ in triumph.\r\n\r\nThe significance of the Montgomery Bus Boycott extended far\
    \ beyond the city itself. It demonstrated, perhaps for the first time on a national\
    \ scale, that organized, sustained, nonviolent protest could force institutional\
    \ change in the American South. It introduced Martin Luther King Jr. as a national\
    \ leader and laid the groundwork for the broader civil rights movement of the\
    \ 1960s, including the Greensboro lunch-counter sit-ins, the Freedom Rides, and\
    \ ultimately the Civil Rights Act of 1964.\r\n\r\nRosa Parks herself paid a steep\
    \ personal price. She lost her job at a Montgomery department store and was unable\
    \ to find steady work in Alabama. She and her husband eventually moved to Detroit,\
    \ where she lived for the rest of her life. In her autobiography, published decades\
    \ later, Parks pushed back gently against the popular image of her arrest as a\
    \ single, isolated act of exhaustion. \"I was not tired physically,\" she wrote.\
    \ \"The only tired I was, was tired of giving in.\" That sentence captures what\
    \ the historical record shows: a deliberate act, by a trained organizer, that\
    \ activated a response her movement had been preparing for years."
  question_text: Based on the passage, the description of Rosa Parks's arrest as "spontaneous"
    is misleading for which of the following reasons?
  choice_a: Parks was a trained activist, and Montgomery's civil rights organizers
    had been preparing the boycott response for years before her arrest.
  choice_b: Parks had been instructed by E. D. Nixon to refuse her seat on a Montgomery
    bus on December 1, 1955.
  choice_c: Parks's arrest had been timed by NAACP leaders to coincide with the Supreme
    Court's review of segregation laws.
  choice_d: Parks had refused to give up her seat on several earlier occasions, finally
    provoking arrest on December 1.
  correct_answer: A
  explanation: The passage carefully distinguishes between two different kinds of
    preparation. First, Parks herself was a longtime NAACP activist — she had been
    trained at workshops, served as chapter secretary, and worked closely with Montgomery's
    civil rights leaders for years. Second, those leaders, especially E. D. Nixon,
    had been waiting for exactly the right person to be arrested — searching for a
    "test case" they could use to challenge segregation in court. So when Parks was
    arrested, neither her courage nor the boycott was improvised in the moment. (B)
    goes too far — the passage says the response was ready, but the arrest itself
    "was not arranged." Nixon recognized Parks's arrest as the test case after it
    happened; he didn't instruct her to do it. (C) invents coordination with the Supreme
    Court that the passage doesn't describe. (D) confuses Parks with Claudette Colvin,
    the 15-year-old whose earlier arrest the passage mentions — but Parks herself
    isn't described as having refused before.
  distractor_types:
    B: inference_leap
    C: inference_leap
    D: misidentified_detail
