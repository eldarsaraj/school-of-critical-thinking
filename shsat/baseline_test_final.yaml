  passage_title: The Paper Crane
  passage_text: "On the first day of middle school, Tomás sat alone in the cafeteria\
    \ with his lunch tray and a library book he was not actually reading. The words\
    \ blurred on the page. Around him, clusters of students laughed and traded snacks\
    \ and made plans he was not part of. The cafeteria smelled like tomato sauce and\
    \ floor polish, and the noise of it felt like weather — something happening to\
    \ him rather than something he was in.\r\n\r\nHe had moved from San Diego only\
    \ three weeks ago, after his mother accepted a new job. The move had been sudden,\
    \ and although his mother kept saying he would make friends soon, soon felt like\
    \ a country he could not find on any map. In San Diego he had known the route\
    \ from the bus stop to his locker, the seat at the lunch table that was always\
    \ his, the boys who waved at him in the hallway even when they were busy. Here,\
    \ he knew the combination to his locker and not much else.\r\n\r\nA paper crane\
    \ landed on his tray.\r\n\r\nHe looked up. A girl with paint-stained fingers and\
    \ a curl of dark hair falling into her eyes was standing across the table, smiling\
    \ at him as if they were already friends.\r\n\r\n\"I make them when I'm nervous,\"\
    \ she said, gesturing at the crane. \"I have a whole flock at home. You look like\
    \ you might need one more than I do.\"\r\n\r\nHer name was Sasha. She sat down\
    \ without being invited, set her own tray beside his, and began to talk — about\
    \ the art teacher who let students use the supply closet at lunch, about the math\
    \ teacher who always wore mismatched socks on Fridays for reasons no one understood,\
    \ about the creek behind the school where nobody was supposed to go but everybody\
    \ did. She did not ask Tomás why he looked sad, and he was grateful. He did not\
    \ yet have the words for it himself, and he was tired of being the new boy who\
    \ had to explain.\r\n\r\nHe noticed, after a while, that he had been listening.\
    \ His sandwich was half gone, though he could not remember eating it. Sasha was\
    \ describing a project she was making out of cardboard tubes and aluminum foil\
    \ — something to do with a science fair, or maybe just for fun, he was not entirely\
    \ sure. The point seemed to be the making of it, not the purpose.\r\n\r\nWhen\
    \ the bell rang, students began scraping back their chairs and gathering their\
    \ things. Sasha stood, balanced her tray on one hand, and said, \"I'm in the art\
    \ room at lunch tomorrow if you want to come find me. You don't have to. But you\
    \ could.\"\r\n\r\nThen she was gone, threading her way through the crowd.\r\n\r\
    \nTomás picked up the paper crane carefully. It was small — no bigger than his\
    \ thumb — and made from a piece of music paper, so that tiny black notes ran across\
    \ its folded wings. He did not know whether he would go to the art room tomorrow.\
    \ He thought he probably would.\r\n\r\nHe tucked the crane into his jacket pocket\
    \ as he walked out into the hallway. It was small, but it made a shape against\
    \ his chest that felt, somehow, like company. He thought of the flock of cranes\
    \ Sasha had described, sitting on shelves and windowsills in a house he had never\
    \ seen, and for the first time since the move, the idea of tomorrow did not feel\
    \ quite so heavy."
  question_text: The description of the cafeteria as 'something happening to him rather
    than something he was in' most strongly suggests that Tomás —
  choice_a: is annoyed by how loud the other students are being
  choice_b: feels disconnected from the world around him
  choice_c: prefers to be alone rather than around large groups of people
  choice_d: is overwhelmed by the unfamiliar sights and sounds of the cafeteria
  correct_answer: B
  explanation: The figurative comparison treats the cafeteria as weather — external,
    impersonal, surrounding him but not including him. This captures Tomás's sense
    of being outside the social world of the school rather than a part of it. The
    detail is about emotional isolation, not noise or comprehension.
  distractor_types:
    A: surface_match
    C: inference_leap
    D: too_literal
