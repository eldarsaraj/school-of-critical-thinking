  question_text: Based on the passage, what physical property of lava most directly
    determines whether a volcanic eruption will be explosive?
  choice_a: The temperature the lava reaches once it emerges from the volcano
  choice_b: The total volume of lava produced by an eruption
  choice_c: The distance the lava travels across the landscape after erupting
  choice_d: The thickness of the lava as it moves from inside the volcano to the surface
  correct_answer: D
  explanation: 'To find the answer, look closely at how the passage contrasts the
    two volcano types. Shield volcanoes have lava that is "thin and fast-flowing"
    — and they rarely explode. Stratovolcanoes have lava that is "thick and traps
    gas under enormous pressure" — and they explode violently. The key difference
    between them isn''t temperature, volume, or how far the lava travels — it''s the
    thickness of the lava itself, which determines whether gas can escape as the lava
    flows or whether it gets trapped and builds up pressure. (A) catches a true fact
    about lava (it is very hot) but the passage doesn''t link temperature to explosiveness.
    (B) sounds reasonable — more lava might seem more dangerous — but the passage
    doesn''t claim volume determines explosiveness. (C) confuses cause and effect:
    shield lava travels far because it''s thin; the distance isn''t what makes it
    safe.'
  distractor_types:
    A: misidentified_detail
    B: inference_leap
