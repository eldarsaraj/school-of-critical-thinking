  question_text: An isosceles triangle has a perimeter of 44 cm. The base is 4 cm
    shorter than each of the two equal sides. What is the length of the base?
  choice_a: 12 cm
  choice_b: 16 cm
  choice_c: 18 cm
  choice_d: 38 cm
  correct_answer: A
  explanation: "Let each equal side = x. Since the base is 4 cm shorter than each\
    \ equal side, the base = x − 4. The perimeter is the sum of all three sides: x\
    \ + x + (x − 4) = 44. Simplify: 3x − 4 = 44. Add 4 to both sides: 3x = 48. Divide\
    \ by 3: x = 16. But x is the equal side — the question asks for the base: 16 −\
    \ 4 = 12 cm.\r\n\r\n(B) correctly solves for x = 16 but stops there, reporting\
    \ the length of the equal sides rather than the base. Always re-read what the\
    \ question is actually asking before writing your answer.\r\n\r\n(C) sets up the\
    \ equation with only two sides: x + (x − 4) = 44, giving x = 24 and base = 20.\
    \ A triangle has three sides — the isosceles triangle here has two equal sides\
    \ and a base, so the equation needs three terms.\r\n\r\n(D) subtracts 4 directly\
    \ from the perimeter: 44 − 4 = 40. The \"4 cm shorter\" describes the relationship\
    \ between the base and the equal sides — it doesn't come directly out of the perimeter.\
    \ You need to set up an equation to use that relationship correctly."
