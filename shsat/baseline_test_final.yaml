  question_text: The sentence near the end of the passage — 'It was small, but it
    made a shape against his chest that felt, somehow, like company' — mainly suggests
    that —
  choice_a: the small physical weight of the crane was a noticeable presence as Tomás
    walked
  choice_b: Tomás carried with him a tangible reminder that he was no longer alone
    in the world
  choice_c: something Tomás could feel against his chest gave him a sense of not being
    alone
  choice_d: Sasha's friendship had permanently changed how Tomás felt about being
    a new student
  correct_answer: C
  explanation: 'The closing line describes a small object — the paper crane — that
    Tomás can physically feel in his jacket pocket. The passage tells us it "felt,
    somehow, like company." That word "somehow" is important: even Tomás is surprised
    by the feeling. The crane is not his friend, and the loneliness is not gone forever,
    but something he can touch is making him feel less alone in that moment. Choice
    C captures this: a physical thing giving him a feeling. (A) reads the description
    as being about physical weight only; (B) goes too far by saying he is "no longer
    alone in the world"; (D) treats the change as permanent, but the next sentence
    specifies "for the first time since the move, the idea of tomorrow did not feel
