  passage_title: ''
  passage_text: ''
  question_text: "Which edit should be made to the sentence below?\r\n\r\nThe committee\
    \ awarded the prize to whomever demonstrated the greatest innovation."
  choice_a: Change 'whomever' to 'whoever'
  choice_b: Change 'to whomever' to 'to the person who'
  choice_c: Change 'whomever demonstrated' to 'whomever had demonstrated'
  choice_d: No change is needed.
  correct_answer: A
  explanation: 'This sentence tests one of the trickiest pronoun rules in English:
    whoever vs. whomever. The word "to" makes it tempting to use "whomever," because
    we''re taught that object pronouns follow prepositions. But here, the object of
    "to" is the entire clause — "whoever demonstrated the greatest innovation" — not
    the pronoun by itself. Inside that clause, the pronoun is the subject of the verb
    "demonstrated," so it needs the subject form: "whoever." (D) is the most common
    mistake: students apply the rule "use whomever after a preposition" without noticing
    that the pronoun has its own job inside the clause. (B) rewrites the sentence
    to avoid the problem ("to the person who"), which is grammatical but sidesteps
    the actual fix rather than making the simple, intended correction. (C) keeps "whomever"
    and changes the verb tense instead — but the verb was never the problem; the pronoun
    case is.'
  distractor_types:
    B: overcorrection
    C: misattributed_error_location
    D: semantic_over_syntactic
- section: ELA
  stage: hard_module
  question_number: 3
  question_type: multiple_choice
  skill: authors_craft
  difficulty: hard
  topic: ''
  passage_group_id: ela_h_reb
  passage_title: The Ethics of Artificial Intelligence
  passage_text: "(1) Artificial intelligence systems are now capable of performing\
    \ tasks once thought to require human judgment, from diagnosing diseases to writing\
    \ legal briefs to deciding who receives a loan or a job interview. (2) These capabilities\
    \ raise profound ethical questions that society has not yet answered. (3) As these\
    \ systems move from research laboratories into hospitals, courtrooms, and classrooms,\
    \ the stakes of getting the answers right continue to rise.\r\n\r\n(4) One of\
    \ the most serious concerns is bias. (5) Critics argue that AI systems can perpetuate\
    \ and even amplify existing societal biases, particularly when they are trained\
    \ on historical data that reflects past injustices. (6) An algorithm that learns\
    \ from decades of hiring decisions, for instance, may quietly absorb the prejudices\
    \ embedded in those decisions and reproduce them at a scale no individual manager\
    \ ever could. (7) Facial recognition software has been shown to misidentify dark-skinned\
    \ individuals at rates far higher than light-skinned individuals, raising alarm\
    \ about its use by police departments. (8) Proponents counter that AI, when properly\
    \ designed, can reduce human bias by applying consistent rules across all cases\
    \ rather than relying on the unpredictable moods and assumptions of individual\
    \ people.\r\n\r\n(9) Nowhere is the debate more visible to young people than in\
    \ education. (10) Tools that can write a passable essay in seconds have forced\
    \ schools to confront an uncomfortable question: what is the purpose of an assignment\
    \ if a machine can complete it? (11) Some teachers treat these tools as a form\
    \ of cheating to be detected and punished. (12) Others argue that resisting the\
    \ technology is futile, and that schools should instead teach students to use\
    \ it thoughtfully, the way earlier generations learned to use calculators. (13)\
    \ Both responses assume something that is far from settled — that educators can\
    \ reliably tell the difference between work done by a student and work done by\
    \ a machine.\r\n\r\n(14) A deeper problem lurks beneath all of these debates:\
    \ accountability. (15) When a human makes a harmful decision, we know whom to\
    \ hold responsible. (16) But when an AI system denies someone a mortgage or recommends\
    \ a harsher prison sentence, responsibility becomes difficult to locate. (17)\
    \ Is it the engineers who wrote the code, the company that sold the system, the\
    \ institution that chose to use it, or no one at all? (18) Critics warn that without\
    \ clear answers, powerful institutions may use the complexity of these systems\
    \ as a shield, deflecting blame onto a process that no single person claims to\
    \ control.\r\n\r\n(19) What is undeniable is that the decisions made about how\
    \ to develop, deploy, and regulate these systems in the next decade will shape\
    \ the distribution of power and opportunity for generations to come. (20) The\
    \ technology itself is neither good nor evil; it is a mirror, reflecting the values\
    \ — and the blind spots — of the people who build and govern it."
  question_text: "Sentence 8 presents the proponents' response to the critics' argument\
    \ about bias. Which revision, if any, would best strengthen the sentence's function\
    \ as a counterargument?\r\n\r\n(8) Proponents counter that AI, when properly designed,\
    \ can reduce human bias by applying consistent rules across all cases rather than\
    \ relying on the unpredictable moods and assumptions of individual people."
  choice_a: No revision would strengthen it.
  choice_b: Proponents counter that AI, when properly designed, eliminates human bias
    entirely by removing flawed human judgment from important decisions.
  choice_c: Proponents counter that AI, when properly designed, can reduce human bias,
    a claim supported by the many companies that now rely on such systems.
  choice_d: Proponents counter that AI, when properly designed, can reduce human bias,
    though critics remain unconvinced that truly unbiased design is possible.
  correct_answer: A
  explanation: 'A counterargument''s job is to push back against the opposing view
    with a claim that is both clear and defensible. Sentence 8 already does this:
    it signals the contrast ("counter that"), makes a reasonable claim (AI can reduce
    bias — not eliminate it), and explains the mechanism (consistent rules instead
    of individual people''s moods). No revision improves it. (B) sounds stronger by
    saying AI "eliminates human bias entirely," but that overstatement is actually
    weaker — the passage has just given real examples of AI bias, so an absolute claim
    is easy to knock down. (C) adds that "many companies rely on such systems," which
    looks like evidence but isn''t: companies adopt technology for many reasons, and
    popularity doesn''t prove the claim about reducing bias. (D) adds "though critics
    remain unconvinced," which sounds fair and balanced — but a sentence meant to
    counter the critics shouldn''t hand them the last word inside its own argument.
    The original is the strongest version.'
  distractor_types:
    D: too_narrow
