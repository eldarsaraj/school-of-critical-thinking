  question_text: Two numbers have a sum of 50 and a difference of 14. What is the
    larger number?
  choice_a: '18'
  choice_b: '25'
  choice_c: '36'
  choice_d: '32'
  correct_answer: D
  explanation: "Set up two equations. Call the larger number a and the smaller b.\
    \ Their sum: a + b = 50. Their difference: a − b = 14. Add the two equations together\
    \ — the b terms cancel: 2a = 64 → a = 32. Check: 32 + 18 = 50 ✓ and 32 − 18 =\
    \ 14 ✓.\r\n\r\nAlternatively, use the shortcut directly: larger number = (sum\
    \ + difference) ÷ 2 = (50 + 14) ÷ 2 = 32. Smaller number = (sum − difference)\
    \ ÷ 2 = (50 − 14) ÷ 2 = 18.\r\n(A) finds both numbers correctly — 32 and 18 —\
    \ but reports 18. Always re-read the question before writing your final answer.\
    \ \"Larger\" and \"smaller\" are easy to swap, especially after doing the algebra\
    \ correctly.\r\n\r\n(B) divides the sum by 2: 50÷2 = 25. This finds the average\
    \ of the two numbers — what each number would be if they were equal — but doesn't\
    \ use the difference at all. Both the sum and the difference are needed to pin\
    \ down the individual values.\r\n\r\n(C) computes 50−14 = 36. This subtracts the\
    \ difference from the sum, but that's not part of any standard equation here.\
    \ To find the larger number, you add the sum and the difference: 50+14 = 64, then\
    \ divide by 2: 32."
  distractor_types:
    A: last_step_trap
    B: partial_answer
    C: wrong_formula
