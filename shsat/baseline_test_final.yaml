  question_text: What is the value of x² − 4x + 3 when x = −2?
  choice_a: '-9'
  choice_b: '-1'
  choice_c: '7'
  choice_d: '15'
  correct_answer: D
  explanation: "Substitute x = −2 into the expression, handling each sign carefully.\
    \ The first term is (−2)² — squaring a negative gives a positive: (−2)(−2) = 4.\
    \ The second term is −4(−2) — a negative times a negative is positive: +8. The\
    \ last term is +3. Add them: 4 + 8 + 3 = 15.\r\n\r\n(C) mishandles the squaring,\
    \ treating (−2)² as −4. But the exponent applies to the whole −2, including its\
    \ sign: (−2)(−2) = +4. A negative number squared is always positive.\r\n(B) mishandles\
    \ the middle term, computing −4 × (−2) as −8. Two negatives multiply to a positive,\
    \ so −4 × (−2) = +8. With +8 instead of −8, the result is 4 + 8 + 3 = 15.\r\n\r\
    \n(A) makes both sign errors at once — a negative square and a negative product\
    \ — landing on −9. The whole challenge of this problem is sign discipline: every\
    \ time a negative is squared or multiplied by another negative, the result turns\
    \ positive."
