    \nDon't you set down on the steps\r\n'Cause you finds it's kinder hard.\r\nDon't\
    \ you fall now —\r\nFor I'se still goin', honey,\r\nI'se still climbin',\r\nAnd\
    \ life for me ain't been no crystal stair."
  question_text: "The mother lists \"tacks,\" \"splinters,\" and \"boards torn up\"\
    \ as features of her staircase, but then adds, \"And sometimes goin' in the dark\
    \ / Where there ain't been no light.\" \r\n\r\nWhat kind of hardship does the\
    \ dark passage describe that differs from the others?"
  choice_a: Times when she had lost hope and could see no better future ahead of her.
  choice_b: Times when she faced uncertainty about the future but kept moving nonetheless.
  choice_c: Times when she had no one to guide her or show her what to do next.
  choice_d: Times of deep sadness and despair that made her difficult life feel even
    heavier.
  correct_answer: B
  explanation: 'All four answers are figurative readings of "the dark" — they all
    use a common pairing of "light" with something else: hope, guidance, sadness,
    visibility. The question is which one fits the specific metaphor this poem is
    running. The whole poem compares life to a staircase you climb. Climbing in the
    dark means you can''t see the next step or where you''re going — you''re uncertain
    about the path — but you have to keep moving anyway. That''s choice B. (A) reads
    "no light" as "no hope," which is a very common figurative pairing — but the mother
    is talking about not seeing what''s ahead, not about despairing of the future.
    (C) reads "no light" as "no one to guide me," another familiar pairing — but you
    can be guided and still in the dark, or unguided and still see clearly; what climbing
    in the dark threatens is visibility, not help. (D) reads "dark" as sadness — the
    most common figurative use of the word — but the line says "where there ain''t
    been no light," and light is what lets you see, not what makes you feel happy.
    The poem is about moving forward without being able to see, not about feeling
    sad.'
  distractor_types:
    A: too_literal
    C: inference_leap
    D: referent_slippage
