  question_text: As used in the final paragraph, 'interior translation' most nearly
    means —
  choice_a: the deliberate effort an immigrant makes to reinvent themselves in order
    to succeed in a new country
  choice_b: the complete transformation into a new person who fully belongs in the
    new culture
  choice_c: the inner reshaping of the self that immigration forces on a person, never
    quite fitting
  choice_d: the adjustment of one's outward habits and customs to match those of the
    new country
  correct_answer: C
  explanation: 'The narrator explains "interior translation" right after using it:
    immigration is "a rendering of oneself into a language that was never quite designed
    for you." Break that down and you get three ideas — the change is inner ("interior,"
    "oneself"), it''s forced by the experience of immigrating (not a project the person
    chooses), and it never quite fits ("never quite designed for you"). Choice C captures
    all three. (A) makes it sound like a deliberate self-reinvention for success,
