  passage_title: The Clockmaker's Daughter
  passage_text: "Maya had spent every Saturday of her childhood in her grandfather's\
    \ clock shop. The smell of machine oil and cedar shavings was, to her, the smell\
    \ of safety. She knew every clock by name — not the manufacturer's name stamped\
    \ on the face, but the names she and her grandfather had given them: Grumbling\
    \ Gerald, who ran a few seconds slow each day no matter what was done to him;\
    \ Miss Ticksworth, whose pendulum swung with what her grandfather called \"a librarian's\
    \ certainty\"; and the Colonel, the tall mahogany grandfather clock by the window,\
    \ who chimed each hour with the seriousness of a man making an announcement.\r\
    \n\r\nWhen her grandfather died and left the shop to her, Maya's friends assumed\
    \ she would sell it. The building was valuable; the neighborhood had transformed\
    \ around it. Sleek coffee shops and fitness studios had replaced the hardware\
    \ stores and tailors of her grandfather's time. The clock shop looked like a missing\
    \ tooth in a polished smile. A real estate broker named Daniel left his card on\
    \ the counter once a week, smiling and apologizing for being persistent. \"Take\
    \ your time,\" he always said, in a way that suggested time was the one thing\
    \ she was running out of.\r\n\r\nBut Maya could not bring herself to sell. Each\
    \ morning she opened the shop at eight, wound the clocks that needed winding,\
    \ and waited for customers who rarely came. Sometimes she sat for hours doing\
    \ nothing but listening — to Gerald's complaining stutter, to Miss Ticksworth's\
    \ confident measure, to the Colonel's deeper sweep. She told herself she was honoring\
    \ her grandfather's memory. She told herself the shop had been part of him, and\
    \ that selling it would be like undoing some piece of who he had been. These reasons\
    \ were not exactly wrong. They were not exactly the whole truth either.\r\n\r\n\
    On an afternoon in late October, a girl of perhaps ten came in alone and stood\
    \ still in the center of the room, eyes wide, listening to the layered ticking\
    \ as though she had never heard anything so astonishing. She did not speak for\
    \ a long time. Maya watched her without moving, the way she might have watched\
    \ a deer that had wandered onto her porch.\r\n\r\n\"They all say different things,\"\
    \ the girl said at last.\r\n\r\n\"Yes,\" Maya said, surprised. \"They do.\"\r\n\
    \r\nThe girl walked to the Colonel and put her hand flat against the wood. \r\n\
    \r\n\"He sounds like he's reading something out loud,\" she said. Then she pointed\
    \ at Gerald. \"That one's worried about being late.\" She smiled, looking pleased\
    \ with herself, and walked out without buying anything.\r\n\r\nThat evening Maya\
    \ sat behind the counter long after she should have locked up. She turned Daniel's\
    \ most recent card over in her hand, then set it down again. She was thinking\
    \ about what her grandfather had said once, years ago, when she had asked him\
    \ why he didn't just sell the clocks he repaired and let other people deal with\
    \ them. He had thought for a while before answering. \"Anyone can keep something,\"\
    \ he said finally. \"It takes more to let something keep being itself.\"\r\n\r\
    \nShe had not understood him then. Now she thought she might be beginning to.\
    \ She was thinking about what it meant to keep something alive — not preserved,\
    \ the way a museum keeps things, but alive the way her grandfather had kept it:\
    \ open to the world, waiting for the right ear to hear it."
  question_text: The author's use of personal names for the clocks (Grumbling Gerald,
    Miss Ticksworth, the Colonel) functions in the passage primarily to —
  choice_a: recall the nostalgic atmosphere of the grandfather's era through small,
    vivid details
  choice_b: show that Maya and her grandfather had built a long-running shared activity
    over many years
  choice_c: help the reader distinguish each clock from the others as the passage
    refers back to them
  choice_d: reframe the clocks as living companions, transforming the question of
    selling into one of loss
  correct_answer: D
  explanation: 'When characters in a story have names, we treat them differently than
    when they''re anonymous — names turn things into someones. The author of this
    passage gives the clocks human names (Grumbling Gerald, Miss Ticksworth, the Colonel),
    and once a clock has a name and a personality, it stops being just merchandise.
