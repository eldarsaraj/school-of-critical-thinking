    \ in the dark\r\nWhere there ain't been no light.\r\nSo boy, don't you turn back.\r\
    \nDon't you set down on the steps\r\n'Cause you finds it's kinder hard.\r\nDon't\
    \ you fall now —\r\nFor I'se still goin', honey,\r\nI'se still climbin',\r\nAnd\
