  question_text: A rectangular box has a volume of 96 cm³. Its length is 3 cm and
    its width is twice its height. What is the height of the box?
  choice_a: 4 cm
  choice_b: 8 cm
  choice_c: 16 cm
  choice_d: 32 cm
  correct_answer: A
  explanation: "Let height = h. Width = 2h. Plug into the volume formula: 3 × 2h ×\
    \ h = 96. Simplify: 6h² = 96. Divide both sides by 6: h² = 16. Take the square\
    \ root: h = 4 cm.\r\n\r\n(B) works through every step correctly — 6h² = 96 → h\
    \ = 4 — but then reports the width: 2 × 4 = 8. The question asks for height, not\
    \ width. Label your variables carefully before writing the final answer.\r\n(C)\
    \ sets up 6h² = 96 correctly but then drops one factor of h, solving 6h = 96 →\
    \ h = 16. The volume formula multiplies all three dimensions — height appears\
    \ as its own dimension and also inside the width (2h), so h is squared. Both factors\
    \ must stay.\r\n\r\n(D) divides volume by length only: 96 ÷ 3 = 32. That leaves\
    \ width × height = 32 still unseparated. You need the relationship between width\
    \ and height to find either one individually."
