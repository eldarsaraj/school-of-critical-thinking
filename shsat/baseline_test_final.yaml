    \ of the pool each hour. To find the time for one full pool, divide 1 by the combined\
    \ rate: 1 ÷ (5/12) = 12/5 = 2.4 hours.\r\n\r\n(D) is the most tempting miss —\
    \ averaging the times to get 5. But here's the sanity check that kills it instantly:\
