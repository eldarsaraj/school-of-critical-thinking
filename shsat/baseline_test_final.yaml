  question_text: A recipe calls for 2/3 cup of flour and 3/4 cup of sugar. How much
    flour and sugar are needed in total?
  choice_a: 5/7 cup
  choice_b: 1 1/12 cups
  choice_c: 1 5/12 cups
  choice_d: 1 1/2 cups
  correct_answer: C
  explanation: "To add fractions with different denominators, you need a common denominator\
    \ — a number both 3 and 4 divide into evenly. The least common denominator is\
    \ 12. Convert each fraction: 2/3 = 8/12 (multiply top and bottom by 4) and 3/4\
    \ = 9/12 (multiply top and bottom by 3). Now add: 8/12 + 9/12 = 17/12. Convert\
    \ to a mixed number: 17 ÷ 12 = 1 remainder 5, so 17/12 = 1 5/12 cups.\r\n(A) adds\
    \ the numerators and denominators separately — 2+3 = 5 on top, 3+4 = 7 on the\
    \ bottom, giving 5/7. This is a tempting shortcut but it's wrong: you can't add\
    \ fractions by stacking the pieces that way. The denominators tell you the size\
    \ of each piece, and they have to match before you can combine.\r\n(B) finds the\
    \ right common denominator of 12 and converts correctly, but makes an arithmetic\
    \ slip when adding: 8 + 9 = 13 instead of 17, giving 13/12 = 1 1/12. If you chose\
    \ this, you knew the method — double-check your addition.\r\n(D) likely comes\
    \ from converting 3/4 to 6/12 (multiplying by 2 instead of 3) and then adding\
    \ 8/12 + 6/12 = 14/12 = 1 2/12 = 1 1/6, or from a different slip in the conversion\
    \ step. The key check: 3 × 3 = 9, not 6, so 3/4 = 9/12."
  distractor_types:
    A: wrong_formula
    B: computation_error
    D: computation_error
