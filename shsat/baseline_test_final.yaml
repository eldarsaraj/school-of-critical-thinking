  choice_d: 36π
  correct_answer: B
  explanation: "Work backward through the sector relationship, then through the circle\
    \ formulas. A 90° central angle covers 90/360 = 1/4 of the full circle, so the\
    \ sector's area is one-quarter of the circle's total area: (1/4)πr² = 9π. Multiply\
    \ both sides by 4: πr² = 36π. Divide by π: r² = 36, so r = 6. Now find the circumference:\
    \ C = 2πr = 2π(6) = 12π cm.\r\n(A) uses πr instead of 2πr for circumference. The\
    \ circumference formula is C = 2πr (equivalently πd, using the diameter). Dropping\
    \ the 2 halves the answer.\r\n\r\n(C) correctly finds r = 6 but then plugs the\
    \ diameter (12) into 2πr, double-counting. The radius is 6; the formula already\
    \ accounts for the full diameter through the factor of 2. Use r = 6, not d = 12.\r\
    \n\r\n(D) computes the circle's area (πr² = 36π) and reports it. Area and circumference\
    \ are different measures — area is in square units (cm²), circumference in linear\
    \ units (cm). The question asks for circumference, so use 2πr, not πr²."
