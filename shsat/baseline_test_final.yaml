  question_text: 'A class received these scores: 70, 72, 72, 73, 74, 90, 91, 92, 93,
    94. If the teacher removes the lowest score, which measure of center changes the
    most?'
  choice_a: The mode
  choice_b: The mean
  choice_c: Both the mean and the median
  choice_d: The median
  correct_answer: D
  explanation: "The instinct is to pick the mean, since the mean reacts to every value.\
    \ But look at where each measure sits. The data splits into a low cluster (70–74)\
    \ and a high cluster (90–94) with a big gap between them. The original median\
    \ is the average of the 5th and 6th values — (74 + 90)/2 = 82 — sitting right\
    \ in that gap. When the lowest score is removed, only 9 values remain, so the\
    \ median becomes the single 5th value: 90. It leaps across the gap from 82 to\
    \ 90, a change of 8.\r\n\r\nThe mean, by contrast, barely moves. The removed score\
    \ (70) is close to the other low scores and not far below the mean of 82.1, and\
    \ there are still 9 scores left to average. So the mean only rises to about 83.4\
    \ — a change of roughly 1.3.\r\n\r\n(B) is the trap precisely because the \"mean\
    \ is most sensitive\" rule is usually true for extreme outliers far from the data.\
    \ Here the removed value isn't an extreme outlier, and the median happens to be\
    \ balanced on the edge of a gap, so removing one value swings it dramatically.\
    \ (A) The mode never changes — 72 stays the most frequent value. (C) is wrong\
    \ because the two changes (≈1.3 and 8) aren't close to equal."
  distractor_types:
    A: wrong_concept
    B: wrong_concept
    C: wrong_concept
