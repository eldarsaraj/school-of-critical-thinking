  passage_title: 'The Great Migration: A Turning Point in American History'
  passage_text: "(1) Between 1910 and 1970, approximately six million African Americans\
    \ left the rural South and relocated to cities in the North, Midwest, and West.\
    \ (2) Historians call this movement the Great Migration. (3) It was one of the\
    \ largest demographic shifts in United States history. (4) It transformed both\
    \ the regions people left behind and the cities they moved to.\r\n\r\n(5) The\
    \ causes of the migration were deeply intertwined. (6) In the South, sharecropping\
    \ trapped many Black farmers in cycles of debt that were almost impossible to\
    \ escape. (7) Jim Crow laws enforced racial segregation in every part of daily\
    \ life, from schools and restaurants to drinking fountains and railroad cars.\
    \ (8) Lynching and other racial violence occurred with terrifying frequency; between\
    \ 1880 and 1930, more than three thousand African Americans were murdered by lynch\
    \ mobs in the Southern states. (9) At the same time, World War I created labor\
    \ shortages in Northern factories, and recruiters from companies like the Pennsylvania\
    \ Railroad traveled South to offer jobs. (10) The pull of opportunity in the North\
    \ met the push of fear and poverty in the South.\r\n\r\n(11) Migrants arrived\
    \ in cities such as Chicago, Detroit, New York, and Pittsburgh and built vibrant\
    \ communities. (12) Harlem in New York City became a cultural capital, giving\
    \ rise to the Harlem Renaissance — a flowering of African American literature,\
    \ music, and art. (13) Writers such as Langston Hughes and Zora Neale Hurston,\
    \ composers such as Duke Ellington, and a generation of painters, dancers, and\
    \ intellectuals reshaped American art from the rooftops of Harlem outward. (14)\
    \ Black-owned businesses, newspapers, and civic organizations multiplied in cities\
    \ across the country. (15) The Chicago Defender, a Black-owned newspaper, was\
    \ circulated secretly throughout the South and openly encouraged readers to come\
    \ north.\r\n\r\n(16) But the North was not the promised land that the recruiters'\
    \ posters had suggested. (17) Migrants faced widespread housing discrimination,\
    \ confined to overcrowded neighborhoods through a practice called redlining, in\
    \ which banks and government agencies refused to issue mortgages in areas where\
    \ Black residents lived. (18) They encountered hostility from white workers who\
    \ feared job competition. (19) Race riots broke out in cities including Chicago\
    \ in 1919, where dozens of Black residents were killed and thousands were left\
    \ homeless. (20) The dream of escape from racial violence proved more complicated\
    \ than many migrants had hoped, though most chose to stay rather than return.\r\
    \n(21) Despite these obstacles, the Great Migration fundamentally reshaped American\
    \ life. (22) It changed the geography of Black America, moving the center of the\
    \ African American population from the rural South to the urban North within a\
    \ few generations. (23) It transformed American culture and music — its influence\
    \ is felt in jazz, blues, gospel, and later, rock and roll. (24) It shifted political\
    \ power: in Northern cities where Black voters could vote freely for the first\
    \ time, African Americans began electing representatives, joining unions, and\
    \ building the organizations that would lead the civil rights movement. (25) The\
    \ migration was both a journey and a transformation — one that remade not only\
    \ the people who undertook it but the entire country that received them."
  question_text: "Which is the best way to combine sentences 3 and 4?\r\n\r\n(3) It\
    \ was one of the largest demographic shifts in United States history. (4) It transformed\
    \ both the regions people left behind and the cities they moved to."
  choice_a: It was one of the largest demographic shifts in United States history,
    and it transformed both the regions people left behind and the cities they moved
    to.
  choice_b: One of the largest demographic shifts in United States history, the Great
    Migration transformed both the regions people left behind and the cities they
    moved to.
  choice_c: It was one of the largest demographic shifts in United States history,
    it transformed both the regions people left behind and the cities they moved to.
  choice_d: Being one of the largest demographic shifts in United States history,
    and having transformed both the regions people left behind and the cities they
    moved to.
  correct_answer: B
  explanation: When you combine two sentences, the goal is to make the relationship
    between their ideas clearer and to reduce repetition. Sentences 3 and 4 both start
    with "It," and they make related claims about the migration — its size (3) and
    its effects (4). Choice B turns the first claim into a describing phrase ("One
    of the largest demographic shifts in United States history") that modifies the
