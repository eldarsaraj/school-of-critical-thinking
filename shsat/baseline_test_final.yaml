  question_text: A right triangle has a hypotenuse of 17 cm and one leg of 8 cm. What
    is the area of the triangle?
  choice_a: 15 cm
  choice_b: 60 cm²
  choice_c: 68 cm²
  choice_d: 120 cm²
  correct_answer: B
  explanation: "The question asks for area, but you first need to find the missing\
    \ leg. Use the Pythagorean theorem: a² + b² = c², where c is the hypotenuse. 8²\
    \ + b² = 17² → 64 + b² = 289 → b² = 225 → b = 15 cm. Now find the area of the\
    \ right triangle: Area = ½ × leg₁ × leg₂ = ½ × 8 × 15 = 60 cm².\r\n\r\n(A) finds\
    \ the missing leg correctly — 15 cm — but stops there. The question asks for area,\
    \ not side length. Whenever a question gives you a geometric shape and asks for\
    \ area, check that your final answer has square units (cm², not cm).\r\n\r\n(C)\
    \ sets up the area formula correctly but uses the hypotenuse (17) instead of the\
    \ missing leg (15): ½ × 8 × 17 = 68. The area of a right triangle uses the two\
    \ legs — the sides that form the right angle — not the hypotenuse.\r\n\r\n(D)\
    \ correctly finds both legs (8 and 15) and multiplies them, but forgets to multiply\
    \ by ½: 8 × 15 = 120. The area of any triangle is half the base times the height.\
    \ For a right triangle, the two legs serve as base and height — but the ½ is still\
    \ required."
  distractor_types:
    A: last_step_trap
    C: last_step_trap
