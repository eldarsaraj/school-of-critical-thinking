- section: ELA
  stage: routing
  question_number: 24
  question_type: multiple_choice
  skill: supporting_detail
  difficulty: easy
  topic: ''
  passage_group_id: ela_r_p4
  passage_title: Should Students Have Smartphones in School? — Two Views
  passage_text: "Passage A: The Case for Allowing Smartphones\r\n\r\n(1) Smartphones\
    \ are often described as distractions, yet supporters argue that they are also\
    \ valuable educational tools. (2) A student who can search effectively, evaluate\
    \ online sources, and organize digital information is developing skills increasingly\
    \ required in modern workplaces. (3) From this perspective, banning smartphones\
    \ treats technology as an enemy rather than recognizing that learning to use technology\
    \ responsibly is itself part of education.\r\n(4) Teachers who incorporate smartphones\
    \ into classroom activities frequently report higher levels of student participation\
    \ and engagement. (5) Students may use their devices to conduct quick research,\
    \ collaborate on shared assignments, or access educational applications during\
    \ lessons. (6) Supporters also note that smartphones can improve organization\
    \ by allowing students to photograph notes, set reminders, and manage deadlines\
    \ efficiently. (7) In many professions, employees already depend on digital devices\
    \ to communicate, schedule tasks, and retrieve information instantly. (8) Schools,\
    \ advocates argue, should prepare students for that reality rather than attempt\
    \ to isolate them from it. (9) According to this view, the problem is not the\
    \ existence of smartphones but the failure to teach students how to use them wisely\
    \ and responsibly.\r\n\r\nPassage B: The Case for Restricting Smartphones\r\n\r\
    \n(10) Critics of smartphones in schools argue that the devices undermine concentration\
    \ and weaken learning. (11) Research suggests that even the mere presence of a\
    \ smartphone on a desk can reduce working memory and cognitive performance. (12)\
    \ Although many students believe they can multitask between social media and academic\
    \ work, psychologists argue that the brain does not truly multitask during complex\
    \ activities. (13) Instead, attention rapidly shifts from one task to another,\
    \ and each shift carries a cognitive cost. (14) As concentration becomes fragmented,\
    \ information is processed less deeply and retained less effectively. (15) Opponents\
    \ therefore reject the idea that smartphones are neutral tools whose effects depend\
    \ entirely on individual choice. (16) Many applications are intentionally designed\
    \ to capture and hold attention for as long as possible. (17) Critics argue that\
    \ schools are among the few environments where students can still practice sustained\
    \ focus without constant digital interruption. (18) Permitting unrestricted smartphone\
    \ use, they claim, risks weakening one of education’s most valuable functions:\
    \ the cultivation of disciplined attention."
  question_text: 'Which sentence best summarizes passage A:'
  choice_a: The problem with smartphones in school is not the smartphones themselves,
    but how students use them.
  choice_b: Smartphones should be allowed in school because they are beneficial if
    used properly.
  choice_c: Students should know how to use smartphones if they want to succeed in
    life.
  choice_d: Research shows that students who use smartphones participate in class
    more
  correct_answer: B
  explanation: 'Passage A argues that smartphones should be allowed in school, but
    only if used properly, so B is correct. A is too narrow: yes, it''s true that
    the passage claims that the problem is in the usage of smartphones, but that is
    only used to support the main claim; it''s not the main claim itself. Same goes
    for C. D, however is incorrect: the passage A never mentioned any research.'
  distractor_types:
    A: too_narrow
    C: misidentified_detail
    D: misidentified_detail
