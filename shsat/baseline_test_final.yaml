  passage_group_id: ela_h_p1
  passage_title: The Paradox of Choice
  passage_text: "In the closing decades of the twentieth century, the dominant assumption\
    \ in Western consumer culture was that freedom of choice was intrinsically good.\
    \ More options meant more freedom; more freedom meant more happiness. The expansion\
    \ of choice was therefore not merely a feature of the market but a moral achievement\
    \ — evidence of a society that trusted its citizens to know what they wanted.\r\
    \n\r\nPsychologist Barry Schwartz challenged this assumption with what he called\
    \ the 'paradox of choice.' Drawing on research in behavioral economics and cognitive\
    \ psychology, Schwartz argued that beyond a certain threshold, additional choices\
    \ do not increase satisfaction but actively undermine it. Faced with fifty varieties\
    \ of yogurt, consumers leave the store less satisfied with their selection than\
    \ they would have been had they chosen from five. The reason is twofold: first,\
    \ evaluating large choice sets imposes a cognitive burden that drains mental energy;\
    \ second, a greater range of options raises the standard against which any chosen\
    \ option is measured, making it easier to imagine that a better option was left\
    \ behind.\r\n\r\nSchwartz distinguished between two types of decision-makers.\
    \ 'Maximizers' seek the objectively best option and therefore must evaluate all\
    \ possibilities; they tend to experience high regret, because any unsatisfying\
    \ outcome could theoretically have been avoided. 'Satisficers,' by contrast, choose\
    \ the first option that meets a defined threshold of acceptability; they tend\
    \ to report higher life satisfaction despite — or rather because of — their less\
    \ exhaustive approach.\r\n\r\nThe implications of this research challenge liberal\
    \ individualism's most cherished assumption: that autonomy, in every domain, promotes\
    \ well-being. Schwartz is careful not to advocate for authoritarianism — he does\
    \ not suggest that choice should be removed. But he does propose that individuals\
    \ can benefit from self-imposed constraints, and that social institutions might\
    \ consider whether expanding options in every domain is, in fact, the kindest\
    \ or most effective thing they can offer."
  question_text: Based on the passage, which of the following would a 'satisficer'
    most likely do when buying a new pair of shoes?
  choice_a: Philipp buys the first comfortable, affordable pair he tries on, then
    keeps browsing online that night to see whether he could have done better.
  choice_b: Aubrey decides in advance what she needs in a shoe, buys the first pair
    that meets those requirements, and does not look further.
  choice_c: Sam grabs the first pair he sees without trying them on, figuring one
    pair is as good as another.
  choice_d: Arielle sets a budget and a style she wants, but keeps trying on pairs
    that fit it, looking for the best of the ones that qualify.
  correct_answer: B
  explanation: 'A "satisficer," in Schwartz''s terms, does three things: decides in
    advance what counts as acceptable, picks the first option that meets that standard,
    and then stops. Aubrey does exactly this. The trick in this question is that every
    wrong answer gets part of it right. (A) Philipp buys quickly — but then keeps
    checking that night to see if he could have done better. That ongoing comparison
    and second-guessing is the mark of a maximizer; satisficers are satisfied because
    they don''t do this. (C) Sam decides fast, but he has no standard at all — he
    grabs any pair, figuring they''re all the same. Satisficing isn''t carelessness;
    it requires a real threshold the option has to meet. (D) Arielle is the subtlest
    case: she sets criteria, which sounds right, but then she keeps searching for
    the best pair among the ones that qualify. Looking for the best — even within
    a narrowed group — is maximizing. A satisficer takes the first one that''s good
    enough, not the best of the acceptable ones.'
  distractor_types:
    A: misidentified_detail
    C: misidentified_detail
    D: misidentified_detail
