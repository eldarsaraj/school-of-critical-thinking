  passage_title: 'The Deep Ocean: Earth''s Final Frontier'
  passage_text: "The deep ocean remains one of the least explored places on Earth.\
    \ Scientists estimate that more than eighty percent of the ocean floor has never\
    \ been mapped, observed, or studied. This vast darkness lies below the sunlit\
    \ zone, where photosynthesis is impossible and pressure reaches crushing extremes.\r\
    \n\r\nDespite these harsh conditions, life thrives in the deep sea. Creatures\
    \ such as the anglerfish, giant squid, and bioluminescent jellyfish have evolved\
    \ remarkable adaptations. The anglerfish, for instance, dangles a glowing lure\
    \ above its mouth to attract prey in the pitch-black water. Many deep-sea organisms\
    \ produce their own light through a chemical process called bioluminescence, which\
    \ serves purposes ranging from attracting mates to confusing predators.\r\n\r\n\
    Exploration of the deep sea has historically been limited by technology and cost.\
    \ Early researchers lowered instruments by rope, receiving only indirect data\
    \ about conditions far below. The development of remotely operated vehicles, or\
    \ ROVs, transformed the field. These underwater robots can withstand pressures\
    \ that would instantly crush a human diver, and they relay live video to scientists\
    \ at the surface.\r\n\r\nRecent ROV expeditions have turned up startling discoveries.\
    \ Entire ecosystems cluster around hydrothermal vents — cracks in the ocean floor\
    \ that release superheated, mineral-rich water. Bacteria that convert chemicals,\
    \ not sunlight, into energy form the base of these food chains. This process,\
    \ called chemosynthesis, was unknown to science until 1977. Its discovery forced\
    \ scientists to reconsider the basic requirements for life — a question with implications\
    \ that stretch far beyond Earth's oceans."
  question_text: The author includes the statistic that "more than eighty percent
    of the ocean floor has never been mapped, observed, or studied" most likely to
    support which claim?
  choice_a: The deep ocean contains conditions that no human diver could survive.
  choice_b: Recent scientific discoveries have changed how we think about life.
  choice_c: Most of the deep ocean remains unknown to humans.
  choice_d: Marine creatures have evolved in remarkable ways to survive deep-sea conditions.
  correct_answer: C
  explanation: 'When you see a statistic in a passage, ask: what claim is this number
    used to prove? Here, the "more than eighty percent" figure is about how much of
    the ocean floor has never been mapped, observed, or studied — in other words,
    how much remains unknown. The passage does make other claims — about harsh conditions
    (A), about life-changing discoveries (B), and about creatures'' adaptations (D)
    — but those claims are supported by different evidence elsewhere in the passage,
    not by this specific statistic. The trap in each wrong answer is matching a real
    passage claim with the wrong piece of evidence.'
  distractor_types:
    A: misidentified_detail
    B: misidentified_detail
    D: misidentified_detail
