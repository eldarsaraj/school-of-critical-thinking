    \ Their sum is 84: n + (n+4) + (n+8) = 84, which simplifies to 3n + 12 = 84. Subtract\
    \ 12: 3n = 72. Divide by 3: n = 24. The three multiples are 24, 28, and 32, and\
    \ the largest is 32.\r\n\r\n(A) and (B) come from solving correctly but reporting\
    \ the wrong member of the set — 24 is the smallest, 28 is the middle. The question\
    \ asks for the largest, which is n + 8 = 32. After solving for n, always check\
    \ which value the question wants.\r\n\r\n(C) is the most instructive miss: the\
    \ student spaces the numbers 2 apart instead of 4, as if they were consecutive\
    \ even integers. That gives 26, 28, 30 (largest 30). But \"multiples of 4\" jump\
    \ by 4 each time, not 2. The gap between consecutive multiples equals the number\
    \ itself — multiples of 4 are 4 apart, multiples of 5 are 5 apart, and so on."
