    \ denominator of 3 and 4, which is 12. Each term gets multiplied: (12)(x/3) +\
    \ (12)(x/4) = 12×14. Simplify: 4x + 3x = 168. Combine: 7x = 168. Divide: x = 24.\
    \ Always check: 24/3 + 24/4 = 8 + 6 = 14. ✓\r\n\r\n(A) sets up 7x/12 = 14 correctly\
    \ but then takes 7x = 14 — dropping the 12 on the right side. Multiplying through\
    \ by 12 applies to both sides of the equation. The right side becomes 14×12 =\
    \ 168, not 14.\r\n\r\n(C) reads x/3 + x/4 as two separate conditions and only\
    \ uses the first: x/3 = 14 → x = 42. Both terms involve x — they must be combined,\
    \ not treated independently. Substituting back checks this: 42/3 + 42/4 = 14 +\
    \ 10.5 = 24.5 ≠ 14.\r\n\r\n(D) adds the denominators 3 and 4 to get 7, rewriting\
    \ the left side as x/7. Fraction addition doesn't work by adding denominators\
