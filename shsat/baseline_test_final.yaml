    \ is positive). Combine: 18 + 9 = 27.\r\n\r\n(A) computes (−3)² as −9, treating\
    \ the square of a negative as negative. But squaring means multiplying the number\
    \ by itself: (−3)(−3) = +9. Two negatives multiply to a positive. With the correct\
