  question_text: Train A leaves a station at 8:00 AM traveling at 60 mph. Train B
    leaves the same station at 9:00 AM on a parallel track traveling at 80 mph in
    the same direction. At what time will Train B catch up to Train A?
  choice_a: 10:00 AM
  choice_b: 11:00 AM
  choice_c: 12:00 PM
  choice_d: 1:00 PM
  correct_answer: C
  explanation: "This is a chase: Train B starts behind (in time) but moves faster,\
    \ so it slowly reels Train A in. Two pieces are needed — the size of the gap and\
    \ the speed at which it closes. By the time Train B starts at 9:00 AM, Train A\
    \ has already driven for one hour at 60 mph, putting it 60 miles ahead. From then\
    \ on, Train B travels 80 mph and Train A 60 mph, so B closes the distance at 80\
    \ − 60 = 20 miles every hour (the relative speed). Closing a 60-mile gap at 20\
    \ miles per hour takes 60 ÷ 20 = 3 hours. Since the chase clock starts at 9:00\
    \ AM, catch-up happens at 12:00 PM.\r\n\r\n(D) is the conceptual trap: using 80\
    \ mph to compute Train A's head start. The head start is Train A's distance during\
    \ its lone hour, so it's 60 miles, not 80. Using 80 inflates the gap and pushes\
    \ the answer an hour late.\r\n\r\n(B) is the timing slip — solving everything\
    \ correctly but adding the 3 hours to 8:00 AM. The 3 hours are measured from when\
    \ the chase begins (9:00 AM, Train B's start), not from Train A's departure. \r\
    \n\r\n(A) confuses the 20 mph closing rate with a head-start distance; the two\
    \ are different quantities, and mixing up their units collapses the problem."
