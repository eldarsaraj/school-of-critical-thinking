  question_text: After a 25% discount, a jacket costs $54. What was the original price
    of the jacket before the discount?
  choice_a: $67.50
  choice_b: $72.00
  choice_c: $79.00
  choice_d: $216.00
  correct_answer: B
  explanation: 'A 25% discount means the customer pays the remaining 75% of the original
    price. So $54 is 75% of the original. To find the original, divide: $54 ÷ 0.75
    = $72. (A) makes the mistake of adding 25% back to $54, getting $54 × 1.25 = $67.50.
    But that''s not how discount-reversal works — adding 25% of the sale price isn''t
    the same as undoing 25% off the original. (C) treats "25% off" as "subtract $25,"
    computing $54 + $25 = $79. The 25% has to be calculated relative to a base, not
    used as a flat dollar amount. (D) is the classic inverse error: the student sets
    up 0.25 × p = $54 (using the discount percent), getting $216. But 25% is the amount
    off, not the amount paid — the $54 corresponds to 75% (what''s left after the
    discount), not 25%.'
