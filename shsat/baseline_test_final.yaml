  question_text: The product of two integers is −36, and their sum is −5. What are
    the two integers?
  choice_a: 4 and −9
  choice_b: −4 and 9
  choice_c: 6 and −6
  choice_d: 3 and −12
  correct_answer: A
  explanation: "Two conditions must hold at once: the product is −36 and the sum is\
    \ −5. Notice that all four answer choices already multiply to −36 — so checking\
    \ the product alone won't tell you anything. The sum is what separates them. Test\
    \ it: 4 + (−9) = −5. ✓ That's the only pair satisfying both.\r\n\r\nA negative\
    \ product means the two integers have opposite signs (one positive, one negative).\
    \ A sum of −5 means the negative number is larger in size than the positive one.\
    \ The pair 4 and −9 fits: opposite signs give the negative product, and the −9\
    \ outweighs the +4 to produce a negative sum.\r\n\r\n(B) flips the signs to −4\
    \ and 9. The product is unchanged (−36), but now the positive number is larger,\
    \ so the sum flips to +5. When a problem specifies the sign of the sum, you have\
    \ to verify it — a correct product isn't enough.\r\n\r\n(C) and (D) both have\
    \ the right product but the wrong sum (0 and −9, respectively). This is the trap\
    \ the question is built around: it's tempting to lock onto the product condition\
    \ and stop, but the answer must satisfy both conditions simultaneously. Always\
    \ check the second condition before committing."
