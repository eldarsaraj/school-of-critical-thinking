  passage_title: The History of Public Libraries
  passage_text: (1) Public libraries have served communities for hundreds of years.
    (2) The first free public library in the United States opened in Peterborough,
    New Hampshire, in 1833. (3) Over time, the idea of a library open to everyone,
    regardless of wealth, spread across the country. (4) Businessman Andrew Carnegie
    donated money to build over 2,500 libraries worldwide. (5) Today, libraries offer
    far more than books, they provide internet access, community programs, and spaces
    for quiet study.
  question_text: "Which sentence would best be added between sentences 3 and 4 to\
    \ improve the passage?\r\n\r\n(3) Over time, the idea of a library open to everyone,\
    \ regardless of wealth, spread across the country.\r\n\r\n(4) Businessman Andrew\
    \ Carnegie donated money to build over 2,500 libraries worldwide."
  choice_a: These early libraries depended on volunteers and local taxes to stay open.
  choice_b: Across many states, citizens began to see libraries as essential public
    resources.
  choice_c: By 1900, thousands of new libraries had opened in towns across the United
    States.
  choice_d: In the late 1800s, wealthy donors helped expand the library system further.
  correct_answer: D
  explanation: A good bridge sentence moves the passage forward — it connects the
    previous idea to the next one. Sentence 3 says the idea of free libraries spread
    across the country; sentence 4 introduces Andrew Carnegie's donations. The bridge
    needs to take us from a general trend to a specific donor — naming the time period
    and the kind of person who helped expand libraries. (A) talks about libraries'
    funding, but it points backward to the earliest libraries' funding sources rather
    than forward to wealthy donors. (B) sounds connecting, but it restates what sentence
    3 already says (the idea was spreading and becoming widespread) without advancing
    toward Carnegie. (C) describes the result of donor activity — thousands of new
    libraries — but a bridge sentence should set up what's coming next, not summarize
    its outcome.
