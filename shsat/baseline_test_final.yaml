  question_text: The passage describes serious consequences faced by boycott participants
    — bombings, death threats, and lost jobs — and then states, "Yet the boycott held."
    What does this contrast most strongly suggest about the participants?
  choice_a: Most participants felt they had no other choice but to continue, despite
    the danger.
  choice_b: The participants relied on protection from federal authorities to safely
    continue the boycott.
