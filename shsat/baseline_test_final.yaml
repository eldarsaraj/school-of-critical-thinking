    \ the second calculation to the 30 students who passed the first test, not the\
    \ whole class.\r\n\r\n(C) correctly finds 30 students passed the first test, but\
    \ then subtracts 40% of 30 instead of keeping it: 30−12 = 18. \"40% also passed\
    \ the second test\" means 40% passed it — not that 40% failed. Keep the 40%, don't\
    \ subtract it.\r\n\r\n(D) reports 30 — the result of the first calculation. The\
    \ question asks how many passed both tests, not just the first. \"Both\" requires\
