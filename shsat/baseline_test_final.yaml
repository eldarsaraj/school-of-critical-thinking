  question_text: 'The temperatures (°F) recorded over 5 days were: 68, 73, 65, 79,
    and 70. By how much does the mean exceed the median?'
  choice_a: '0'
  choice_b: '1'
  choice_c: '3'
  choice_d: '14'
  correct_answer: B
  explanation: "This question requires two separate calculations before you can find\
    \ the answer. First, find the mean: add all five temperatures (68 + 73 + 65 +\
    \ 79 + 70 = 355) and divide by 5: 355 ÷ 5 = 71°F. Then find the median: sort the\
    \ values from least to greatest — 65, 68, 70, 73, 79 — and take the middle value.\
    \ With five values, the middle is the 3rd: 70°F. Finally, subtract: 71 − 70 =\
    \ 1.\r\n\r\n(B) comes from assuming the mean and median of any data set are always\
    \ equal, so the answer must be 0. They aren't always equal — mean is pulled by\
    \ extreme values while median is purely positional. These five temperatures happen\
    \ to produce values close together, but not identical.\r\n\r\n(C) comes from sorting\
    \ correctly but picking the wrong position: the 2nd value in the sorted list (68)\
    \ instead of the 3rd (70). With five data points, the middle value is always at\
    \ position 3, not position 2. Then 71 − 68 = 3.\r\n\r\n(D) computes the range\
    \ — the gap between the highest and lowest values: 79 − 65 = 14. Range measures\
    \ the spread of the data, not the difference between mean and median. Re-read\
    \ the question carefully: it asks specifically about mean versus median."
  distractor_types:
    A: wrong_concept
    C: partial_answer
    D: wrong_concept
