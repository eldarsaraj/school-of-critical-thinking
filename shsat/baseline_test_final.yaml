  question_text: How do paragraphs 3 and 4 work together to convey the central idea
    of the passage?
  choice_a: Paragraph 3 shows the culture migrants built, while paragraph 4 shows
    the discrimination they still faced — together revealing that the North offered
    opportunity but not a full escape.
  choice_b: Paragraph 3 describes the vibrant culture of Harlem, while paragraph 4
    explains that this flowering of art and business soon faded as discrimination
    increased in Northern cities.
