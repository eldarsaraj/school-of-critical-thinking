  question_text: The passage implies that maximizers experience more regret than satisficers
    primarily because —
  choice_a: having evaluated all the options, they know exactly what better alternatives
    they passed up
  choice_b: they set higher standards and are therefore more often disappointed by
    the outcomes they get
  choice_c: the effort of weighing so many options leaves them mentally drained and
    dissatisfied afterward
  choice_d: they can never be fully certain that the option they chose was truly the
    best one available
  correct_answer: A
  explanation: 'The passage says maximizers "must evaluate all possibilities" and
    that for them "any unsatisfying outcome could theoretically have been avoided."
    Put those together: because a maximizer looked at everything, they know exactly
    what better options were out there — so when their choice disappoints, the regret
    is sharp and specific. That''s choice A. (B) is tempting and partly true — maximizers
    do have high standards — but the passage points to knowing what you missed, not
    just being generally hard to please. (C) borrows a real idea from earlier in the
    passage (evaluating many options is mentally draining), but that drain is about
    feeling tired while choosing, not about the regret that comes afterward. (D) is
    the trickiest: it says maximizers regret because they can never be sure they chose
    the best — but the passage''s point is the opposite. Their problem isn''t uncertainty;
    it''s that they do know what better options existed.'
