  question_text: "Which edit should be made to the sentence below?\r\n\r\nShe returned\
    \ the book to the library that her cousin had borrowed."
  choice_a: Change the verb "returned" to "is returning"
  choice_b: Add a comma after the word "library"
  choice_c: Move the phrase "that her cousin had borrowed" after "book"
  choice_d: Leave the sentence unchanged
  correct_answer: C
  explanation: 'The phrase "that her cousin had borrowed" is meant to describe the
    book — but the way it''s positioned in the sentence, it appears to describe the
    library. The sentence as written sounds like her cousin borrowed the library,
    which doesn''t make sense. The fix is to move the phrase right next to "book,"
    the thing it actually describes: "She returned the book that her cousin had borrowed
    to the library." This is called a misplaced modifier — a phrase that''s grammatically
    attached to the wrong noun. (A) changes the verb tense, but the tense isn''t the
    problem. (B) adds a comma that doesn''t fix the misplaced phrase. (D) is tempting
    because the sentence reads smoothly enough that you might not notice the logical
    mix-up — but a careful reader will catch that her cousin couldn''t have borrowed
    a library.'
