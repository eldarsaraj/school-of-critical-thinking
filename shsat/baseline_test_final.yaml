  passage_title: Langston Hughes — "Mother to Son"
  passage_text: "Well, son, I'll tell you:\r\nLife for me ain't been no crystal stair.\r\
    \nIt's had tacks in it,\r\nAnd splinters,\r\nAnd boards torn up,\r\nAnd places\
    \ with no carpet on the floor —\r\nBare.\r\nBut all the time\r\nI'se been a-climbin'\
    \ on,\r\nAnd reachin' landin's,\r\nAnd turnin' corners,\r\nAnd sometimes goin'\
    \ in the dark\r\nWhere there ain't been no light.\r\nSo boy, don't you turn back.\r\
    \nDon't you set down on the steps\r\n'Cause you finds it's kinder hard.\r\nDon't\
    \ you fall now —\r\nFor I'se still goin', honey,\r\nI'se still climbin',\r\nAnd\
    \ life for me ain't been no crystal stair."
  question_text: In the poem, the "crystal stair" most likely represents —
  choice_a: a life so fragile that it could be easily broken or shattered
  choice_b: a life clear and easy to understand from beginning to end
  choice_c: a life of luxury, comfort, and great wealth
  choice_d: a life smooth and untroubled, free of hardship
  correct_answer: D
  explanation: The phrase "crystal stair" is a metaphor, and the poem tells you what
    it means by showing you what it's contrasted with. The mother's actual staircase
    has tacks, splinters, torn-up boards, no carpet — and stretches of darkness. All
    of those are signs of roughness and obstruction. So when she says her life "ain't
    been no crystal stair," she means it hasn't been smooth and easy — that's choice
    D. The other answers each grab a different real property of crystal and apply
    it as the metaphor, but they don't fit what the poem actually describes. (A) picks
    crystal's fragility — but the staircase she describes isn't broken, it's rough
    and difficult. (B) picks crystal's clarity/transparency — but the contrast is
    about ease of climbing, not understanding. (C) picks crystal's expensiveness —
    but the staircase she describes isn't a poor person's stair vs. a rich person's;
    it's a hard stair vs. a smooth one. Poverty and ease are different things; the
    mother is talking about ease.
  distractor_types:
    A: too_literal
    B: misidentified_detail
    C: misidentified_detail
