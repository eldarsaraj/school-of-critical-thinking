  question_text: Arielle has $50 to spend on art supplies. Tubes of paint cost $4
    each and paintbrushes cost $7 each. She must buy exactly 5 tubes of paint. What
    is the maximum number of paintbrushes she can also buy?
  choice_a: '4'
  choice_b: '3'
  choice_c: '5'
  choice_d: '7'
  correct_answer: A
  explanation: "Start by accounting for the required purchase. Five tubes of paint\
    \ cost 5×$4 = $20. Subtract from the budget: $50−$20 = $30 remaining. Now divide\
    \ by the brush price: $30÷$7 = 4.28. Since Arielle can only buy whole brushes,\
    \ take the largest whole number that doesn't exceed the budget: 4. Check: 4 brushes\
    \ cost $28, and $20+$28 = $48 ≤ $50. ✓\r\n\r\n(B) swaps the prices — uses $7 as\
    \ the paint price and $4 as the brush price: $50−$7×5 = $15, then $15÷$4 = 3.75\
    \ → 3. Always map each price to the correct item before calculating.\r\n\r\n(C)\
    \ gets 4.28 brushes correctly but rounds up to 5. With money problems, rounding\
    \ up means overspending: 5 brushes cost $35, and $20+$35 = $55 — $5 over budget.\
    \ When the question asks for the maximum you can buy, always round down to the\
    \ nearest whole number.\r\n\r\n(D) divides the entire $50 by $7, getting 7. This\
    \ ignores the $20 already committed to paint. The budget has two parts — you can't\
    \ spend the same dollars twice."
