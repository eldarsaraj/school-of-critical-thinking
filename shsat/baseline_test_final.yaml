  question_text: Two parallel lines are cut by a transversal. One of the eight angles
    formed measures 110°. What is the measure of the same-side interior angle?
  choice_a: 20°
  choice_b: 55°
  choice_c: 70°
  choice_d: 110°
  correct_answer: C
  explanation: "When two parallel lines are cut by a transversal, different pairs\
    \ of angles have different relationships. Same-side interior angles — the two\
    \ angles that sit between the parallel lines and on the same side of the transversal\
    \ — are supplementary, meaning they add up to 180°. So if one measures 110°, the\
    \ other measures 180° − 110° = 70°.\r\n\r\n(A) uses 90° instead of 180° as the\
    \ target sum: 110° − 90° = 20°. That would be true if the angles were complementary\
    \ — but complementary angles sum to 90°, and no standard angle pair on parallel\
    \ lines has that property. Same-side interior angles are supplementary, not complementary.\r\
    \n(B) divides 110° by 2, arriving at 55°. There's no geometric rule here — halving\
    \ the given angle doesn't correspond to any angle relationship on parallel lines.\
    \ If this felt intuitive, it's worth reviewing the four angle pair types: corresponding,\
    \ alternate interior, alternate exterior, and same-side interior.\r\n\r\n(D) reports\
    \ 110° — the same measure as the original angle. This is the correct answer for\
    \ alternate interior angles or corresponding angles, both of which are equal when\
    \ lines are parallel. Same-side interior angles are different: they sit on the\
    \ same side of the transversal, which makes them supplementary rather than equal."
  distractor_types:
    A: wrong_formula
    B: fast_pattern_match
    D: misidentified_detail
