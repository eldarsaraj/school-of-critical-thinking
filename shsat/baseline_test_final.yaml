  question_text: A florist has 36 roses and 48 tulips. She wants to make identical
    bouquets using all the flowers, with none left over and every bouquet the same.
    What is the greatest number of bouquets she can make?
  choice_a: '6'
  choice_b: '12'
  choice_c: '84'
  choice_d: '144'
  correct_answer: B
  explanation: "The phrase \"greatest number of identical bouquets using all the flowers\"\
    \ is the signal for greatest common factor. Each bouquet must contain a whole\
    \ number of roses and a whole number of tulips, and the number of bouquets must\
    \ divide both 36 and 48 evenly. The largest number that does so is GCF(36, 48).\
    \ Factoring: 36 = 2²·3² and 48 = 2⁴·3, so the GCF takes the lowest power of each\
    \ shared prime: 2²·3 = 12. Twelve bouquets, each with 3 roses and 4 tulips.\r\n\
    \r\n(D) is the central trap — confusing GCF with LCM. They sound similar but answer\
    \ opposite questions. The GCF (12) is the largest number that divides into both,\
    \ which is what \"splitting into equal groups\" needs. The LCM (144) is the smallest\
    \ number both divide into, used for problems like \"when do two repeating events\
    \ line up.\" Here we're dividing flowers into groups, so GCF is the tool.\r\n\r\
    \n(A) is a true common factor but not the greatest — 6 divides both 36 and 48,\
    \ but so does 12, and the question asks for the most bouquets possible. \r\n\r\
    \n(C) adds the flowers into one pile of 84, which ignores that they must be split\
    \ into equal bouquets."
