  question_text: A town has 8,000 residents. Each year for 3 years, the population
    increases by 25% over the previous year. What is the population after 3 years?
  choice_a: 10,000
  choice_b: 12,500
  choice_c: 14,000
  choice_d: 15,625
  correct_answer: D
  explanation: "The phrase \"25% over the previous year\" means each year's population\
    \ is built on the previous year's total, not the original — this is compounding.\
    \ Multiplying by 1.25 each year: 8,000 → 10,000 → 12,500 → 15,625.\r\n\r\n(C)\
    \ is the central miss: treating the growth as simple, adding 25% of the original\
    \ 8,000 (which is 2,000) three times to get 14,000. But after year 1 the town\
    \ has 10,000 people, so year 2's increase is 25% of 10,000 = 2,500 — bigger than\
    \ 2,000. Each year's increase grows because it's based on a larger total. That's\
    \ why the compound result (15,625) exceeds the simple one (14,000).\r\n\r\n(A)\
    \ and (B) apply the increase too few times — once and twice, respectively. The\
    \ population grows for three full years, so the multiplication by 1.25 happens\
