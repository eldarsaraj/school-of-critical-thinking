  question_text: "A student wants to add the following sentence to the passage:\r\n\
    \r\n\"For instance, some hiring platforms now remove names, ages, and photographs\
    \ from applications before an algorithm reviews them, so that candidates are judged\
    \ on qualifications alone.\"\r\n\r\nWhere would the sentence best be placed?"
  choice_a: After sentence 6, to give another example of how algorithms absorb past
    prejudice
  choice_b: After sentence 7, to extend the discussion of bias in facial recognition
    systems
  choice_c: After sentence 13, to show how technology is changing education
  choice_d: After sentence 8, to illustrate the proponents' claim that AI can reduce
    bias
  correct_answer: D
  explanation: 'When you add an example to an argument, it has to land next to the
    claim it actually supports. The new sentence describes a hiring system that removes
    personal details so the algorithm judges people fairly — in other words, an example
    of AI reducing bias. That''s the proponents'' argument, which appears in sentence
    8. So the sentence belongs right after sentence 8. (A) is the trickiest wrong
    answer: sentence 6 is also about hiring algorithms, so it feels like a match —
    but sentence 6 says hiring algorithms reproduce bias, the exact opposite of what
    the new sentence says, so placing it there would contradict the paragraph. (B)
    attaches it to the facial-recognition example, but that''s also evidence for the
    critics, not the proponents. (C) drops it into the paragraph about AI and schools,
    which is about a completely different issue. The key is to ask not just "is this
