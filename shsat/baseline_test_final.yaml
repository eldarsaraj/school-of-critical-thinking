  question_text: "Which edit should be made to the sentence below?\r\n\r\nNeither\
    \ the students nor the teacher were ready for the surprise fire drill."
  choice_a: Change 'were' to 'was'
  choice_b: Change 'Neither' to 'Both'
  choice_c: No change is needed
  choice_d: Change 'were' to 'are'
  correct_answer: A
  explanation: 'This sentence sounds fine in everyday speech, and many native speakers
    would say "Neither the students nor the teacher were ready" without noticing anything
    wrong. But in formal written English (what the SHSAT tests), a specific rule applies:
    with "neither... nor...," the verb agrees with the subject closest to it — here,
    "the teacher," which is singular, so "was" is correct. (B) inverts the meaning.
    (C) is the most tempting answer because the sentence sounds natural in conversation,
    but the test enforces the formal rule. (D) doesn''t fix the agreement and adds
    a tense problem.'
