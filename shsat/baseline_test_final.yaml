  question_text: Bella runs a 10-kilometer race in 50 minutes. What is her average
    speed in miles per hour? (Use the approximation 1 mile ≈ 1.6 kilometers.)
  choice_a: '6.25'
  choice_b: '12'
  choice_c: '19.2'
  choice_d: '7.5'
  correct_answer: D
  explanation: "This problem requires two separate unit conversions, so work through\
    \ it one step at a time. First, convert the time to hours: 50 minutes ÷ 60 = 5/6\
    \ of an hour. Then find the speed in km/h: 10 km ÷ (5/6 hr) = 10 × 6/5 = 12 km/h.\
    \ Finally, convert to miles per hour: since 1 mile = 1.6 km, divide by 1.6: 12\
    \ ÷ 1.6 = 7.5 mph.\r\n\r\n(A) skips the time step entirely and divides the distance\
    \ by the conversion factor: 10 ÷ 1.6 = 6.25. This mixes up two different steps.\
    \ The conversion factor converts kilometers to miles — it has nothing to do with\
    \ the time until the very last step.\r\n(B) correctly computes 12 km/h but stops\
    \ there without converting to mph. The question specifically asks for miles per\
    \ hour. Whenever a conversion factor is given in the problem, it's always needed\
    \ — that's why it's there.\r\n\r\n(C) finds 12 km/h correctly but then multiplies\
    \ by 1.6 instead of dividing: 12 × 1.6 = 19.2. Think about direction: 1 mile =\
    \ 1.6 km means a mile is longer than a kilometer, so your mph number should be\
    \ smaller than your km/h number. 7.5 < 12 ✓. If your answer is bigger than 12,\
    \ the conversion went the wrong way."
