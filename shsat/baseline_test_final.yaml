  question_text: A spinner has 4 equal sections numbered 1, 2, 3, and 4. The spinner
    is spun 3 times. What is the probability that it lands on an even number all 3
    times?
  choice_a: 1/64
  choice_b: 1/8
  choice_c: 1/4
  choice_d: 1/2
  correct_answer: B
  explanation: "Two things have to be handled in order. First, the probability of\
    \ an even number on one spin: the even sections are 2 and 4, which is 2 of the\
    \ 4 equal sections, so P(even) = 2/4 = 1/2. Second, the spinner is spun three\
    \ separate times, and each spin is independent — the result of one doesn't affect\
    \ the others. For all three to be even, multiply the per-spin probability three\
    \ times: 1/2 × 1/2 × 1/2 = 1/8.\r\n\r\n(A) is the conceptual trap: using 1/4 as\
    \ the chance of \"even.\" 1/4 is the probability of landing on one specific number.\
    \ But \"even\" covers two of the four numbers, so its probability is doubled to\
    \ 2/4 = 1/2. Cubing the wrong base (1/4 instead of 1/2) gives 1/64.\r\n\r\n(C)\
    \ uses the right per-spin probability but only multiplies it twice. Three spins\
    \ means three factors of 1/2 — the exponent matches the number of trials.\r\n\r\
    \n(D) stops at a single spin. The question asks about three consecutive spins\
    \ all being even, so one spin's probability has to be compounded across all three."
  distractor_types:
    A: wrong_concept
    C: wrong_formula
    D: partial_answer
