  question_text: Why does the author specify in the last paragraph that 'Schwartz
    is careful not to advocate for authoritarianism'?
  choice_a: To concede that Schwartz's argument has a serious weakness he was unable
    to resolve.
  choice_b: To establish an evenhanded, moderate tone before the passage reaches its
    conclusion.
  choice_c: To prepare the reader for the proposal about self-imposed constraints
    in the next sentence.
  choice_d: To head off the likely objection that his argument implies choice should
    be taken away from people.
  correct_answer: D
