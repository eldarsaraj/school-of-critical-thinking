  question_text: Why does the author most likely include the example of the 1815 eruption
    of Mount Tambora?
  choice_a: To show how a single eruption can affect places thousands of miles away
    from the volcano itself
  choice_b: To establish that volcanic activity has been a significant cause of global
    climate variation
  choice_c: To present a more historically devastating eruption than the Mount St.
    Helens example
  choice_d: To highlight the dramatic phrase "the year without a summer" as evidence
    of the eruption's lasting cultural memory
  correct_answer: A
  explanation: 'When an author includes a specific example, it''s worth asking: what
    argument is the example helping to make? In this paragraph, the author has just
    described the Mount St. Helens eruption — which destroyed forest and killed 57
    people locally. The Tambora example then extends the argument: this eruption caused
    famine "thousands of miles from the volcano itself." So the purpose is to show
    that volcanic danger isn''t always local. (B) confuses what the example contains
    (climate change) with what it''s used for (showing geographic reach). (C) treats
    Tambora as a "worse version" of St. Helens, but really both examples together
    push the argument from local to global. (D) is drawn in by a memorable phrase,
    but the phrase serves the argument — it isn''t the author''s purpose.'
  distractor_types:
    B: causal_confusion
    C: misidentified_detail
    D: surface_match
