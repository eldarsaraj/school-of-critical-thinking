  question_text: The sum of the first n positive integers is given by n(n+1)/2. What
    is the sum of the integers from 21 to 40?
  choice_a: '210'
  choice_b: '610'
  choice_c: '630'
  choice_d: '820'
  correct_answer: B
  explanation: "The formula gives the sum starting from 1, but this problem starts\
    \ at 21 — so you can't apply it directly. The trick is to take the sum of all\
    \ integers from 1 to 40, then subtract the part you don't want (1 to 20). Sum\
    \ from 1 to 40: 40(41)/2 = 820. Sum from 1 to 20: 20(21)/2 = 210. The difference\
    \ is the sum from 21 to 40: 820 − 210 = 610.\r\n\r\n(D) stops at the sum from\
    \ 1 to 40 (820). That total includes the integers 1 through 20, which aren't part\
    \ of the requested range. You have to remove them by subtracting their sum (210).\r\
    \n(A) computes the sum from 1 to 20 (210) — the part being removed, not the answer.\
    \ It's an intermediate value, not the final result.\r\n\r\n(C) miscounts the range\
    \ as 20 to 40 instead of 21 to 40, including an extra term. From 21 to 40 there\
    \ are exactly 20 integers (40 − 21 + 1 = 20). Including 20 adds a 21st term and\
    \ a value of 20, inflating the sum to 630."
