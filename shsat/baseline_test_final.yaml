  explanation: "Average speed is total distance divided by total time — never an average\
    \ of the speeds. Compute each leg's time. First leg: 120 ÷ 60 = 2 hours. Second\
    \ leg: 60 ÷ 20 = 3 hours. Total distance = 120 + 60 = 180 miles. Total time =\
    \ 2 + 3 = 5 hours. Average speed = 180 ÷ 5 = 36 mph.\r\n\r\n(C) averages the two\
    \ speeds: (60+20)÷2 = 40. This only works when equal time is spent at each speed.\
    \ Here Anna spends more time on the slow leg (3 hours) than the fast leg (2 hours),\
    \ so the average is pulled below 40.\r\n(A) uses the harmonic mean: 2·60·20 ÷\
    \ (60+20) = 30. That formula is correct for a round trip where the two distances\
    \ are equal — but here the distances differ (120 vs 60 miles), so it doesn't apply.\
    \ Memorizing a shortcut isn't enough; you have to know the conditions under which\
    \ it's valid.\r\n\r\n(D) adds the speeds: 60 + 20 = 80. Speeds only add when motions\
    \ happen at the same time in the same direction. These are sequential legs of\
