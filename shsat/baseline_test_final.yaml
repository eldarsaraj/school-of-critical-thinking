  question_text: The author places Parks's quoted statement — "I was not tired physically.
    The only tired I was, was tired of giving in" — in the final paragraph rather
    than earlier in the passage. What is the most likely reason for this placement?
  choice_a: The quotation is the most dramatic moment of the story, and the author
    saves it to provide an emotional climax.
  choice_b: The author needed to wait until after describing the boycott's outcome
    to use a quotation from Parks herself.
  choice_c: After building the case through historical evidence, the author lets Parks
    confirm in her own words what the passage has argued.
  choice_d: The quotation contradicts the historical evidence presented earlier, and
    the author wants readers to notice the contradiction.
  correct_answer: C
  explanation: 'This question is about placement, not just meaning. The passage spends
    six paragraphs presenting evidence — Parks''s activism, the NAACP''s preparation,
    the boycott, the Supreme Court ruling — to argue that her arrest was a deliberate
    act, not the exhaustion of a tired seamstress. Then, in the final paragraph, the
    author lets Parks confirm this in her own voice: "I was not tired physically."
    Her words agree with the historical evidence and seal the argument. (A) treats
    the passage as a story building to a dramatic climax, but it''s actually an argument,
    and the quote''s job is to reinforce the argument. (B) imagines that some piece
    of earlier content was needed before the quote could appear, but the quote could
    fit logically in several places — the choice to put it last is about argumentative
    power, not prerequisite. (D) misreads the relationship between Parks''s words
    and the historical evidence; they agree, not contradict.'
