  question_text: What is the value of (−2)³ + (−3)² − (−4)?
  choice_a: −13
  choice_b: −3
  choice_c: '5'
  choice_d: '21'
  correct_answer: C
  explanation: "Evaluate each term carefully, paying attention to sign rules. (−2)³\
    \ means (−2)(−2)(−2): three negatives multiplied together. Negative × negative\
    \ = positive, then positive × negative = negative, so (−2)³ = −8. (−3)² means\
    \ (−3)(−3): two negatives multiplied together give a positive, so (−3)² = +9.\
    \ The last term is −(−4): subtracting a negative is the same as adding a positive,\
    \ so −(−4) = +4. Now combine: −8 + 9 + 4 = 5.\r\n\r\n(A) treats (−3)² as −(3²)\
    \ = −9, as if the negative sign sits outside the exponent rather than inside.\
    \ But the parentheses put the negative inside — the entire −3 gets squared: (−3)(−3)\
    \ = +9, not −9. Then −8 + (−9) + 4 = −13.\r\n\r\n(B) gets the first two terms\
    \ right — (−2)³ = −8 and (−3)² = +9 — but treats −(−4) as −4, missing the double\
    \ negative flip. Subtracting a negative is the same as adding a positive: −(−4)\
    \ = +4. Then −8 + 9 + (−4) = −3 instead of the correct −8 + 9 + 4 = 5.\r\n\r\n\
    (D) evaluates (−3)² and −(−4) correctly but treats (−2)³ as 2³ = 8, dropping the\
    \ negative on the base. A negative base raised to an odd power stays negative:\
    \ (−2)³ = −8, not +8. The even/odd rule for powers: even exponent → positive result,\
    \ odd exponent → keeps the sign of the base. Then 8 + 9 + 4 = 21."
  distractor_types:
    A: sign_error
    B: sign_error
    D: sign_error
