  question_text: As used in the passage, the word 'preserved' most nearly means —
  choice_a: protected from damage or decay
  choice_b: kept fixed and untouched by the world
  choice_c: made widely available to the public
  choice_d: documented and recorded for future generations
  correct_answer: B
  explanation: The word "preserved" usually means "protected from damage" — like a
    preserved photograph or preserved food. That's the everyday meaning. But the passage
    uses the word in a more specific way. Maya contrasts being "preserved, the way
    a museum keeps things" with being "alive... open to the world, waiting for the
    right ear to hear it." So in this passage, "preserved" means kept fixed, static,
    separate from the world — something looked at from behind glass, not engaged with.
    (A) gives the common dictionary meaning, but it misses what the passage's contrast
    establishes — preservation here isn't about damage protection, it's about distance
    from the world. (C) actually leans toward the alive side of the contrast, not
    the preserved side; the passage frames "preserved" as the opposite of being available
    to people. (D) confuses "the way a museum keeps things" with documentation, but
    the passage's meaning is about display under glass, not about recording or cataloging.
