  passage_title: Langston Hughes — "Mother to Son"
  passage_text: "Well, son, I'll tell you:\r\nLife for me ain't been no crystal stair.\r\
    \nIt's had tacks in it,\r\nAnd splinters,\r\nAnd boards torn up,\r\nAnd places\
    \ with no carpet on the floor —\r\nBare.\r\nBut all the time\r\nI'se been a-climbin'\
    \ on,\r\nAnd reachin' landin's,\r\nAnd turnin' corners,\r\nAnd sometimes goin'\
    \ in the dark\r\nWhere there ain't been no light.\r\nSo boy, don't you turn back.\r\
    \nDon't you set down on the steps\r\n'Cause you finds it's kinder hard.\r\nDon't\
    \ you fall now —\r\nFor I'se still goin', honey,\r\nI'se still climbin',\r\nAnd\
    \ life for me ain't been no crystal stair."
  question_text: "The mother first describes her own difficult life and then turns\
    \ to telling her son to keep going. \r\n\r\nWhy does the mother most likely tell\
    \ her son about her own life before urging him to keep going?"
  choice_a: As proof that she has earned the authority to give him advice, since she
    has lived through what she is now warning him about.
  choice_b: As a demonstration that climbing through hardship is possible, since she
    is doing exactly what she is asking him to do.
  choice_c: As a cautionary tale showing him the kind of life he should work hard
    to avoid for himself.
  choice_d: As a shared experience that binds them together through the hardships
    their family has known.
  correct_answer: B
  explanation: 'Why does the mother tell her son about her own life before telling
    him to keep going? Look at what she says about herself at the climax: "For I''se
    still goin'', honey, / I''se still climbin''." That''s present-tense — she''s
    currently doing the very thing she''s asking him to do. So her life isn''t being
    offered as a credential ("I''ve been through this, so listen"), and it isn''t
    a warning ("learn from my hardship"). It''s a demonstration: climbing through
    hardship is possible — and the proof is right in front of him, in her ongoing
    climb. That''s choice B. (A) reads her account as an authority claim — but the
    mother never asserts authority; she never says "trust me" or "listen because."
    Her hardships aren''t a credentials check. (C) reads her life as a cautionary
    tale — but she''s not warning him away from her path; she''s encouraging him to
    keep going on it, just as she is. (D) reads the recounting as family bonding through
    shared hardship — but the poem doesn''t suggest her son has lived through what
    she has; it''s forward-looking, about his climb still to come. The mother offers
    her life as evidence: this is possible. I am doing it.'
  distractor_types:
    A: surface_match
    C: opposite
    D: inference_leap
