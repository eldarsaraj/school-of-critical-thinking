  question_text: Which best describes the tone the mother takes as she speaks to her
    son in the poem?
  choice_a: The wise tone of an elder who has finished her own climb and looks back
    to instruct the next generation.
  choice_b: The pleading tone of someone asking her son to recognize and honor the
    suffering she has endured.
  choice_c: The plain tone of a fellow climber, still on the stairs herself, urging
    her son to keep going without promising it will get easier.
  choice_d: The reassuring tone of a mother who wants to comfort her son with the
    promise that hardship eventually gives way to better times.
  correct_answer: C
  explanation: 'The mother in this poem speaks with a very specific kind of voice,
    and the question is to identify what makes it distinctive. Three things stand
    out: (1) she names her hardships briefly and then turns entirely to her son —
    she doesn''t dwell on what she''s been through; (2) she''s still climbing herself
    — she hasn''t finished and isn''t speaking from above; and (3) she never promises
    her son that things will get better — she only insists he keep going. That combination
    — plainspoken, still-on-the-stairs, no-promises — is choice C. (A) reads her as
    a wise elder dispensing lessons from a finished life, but she ends the poem with
    "I''se still goin'', I''se still climbin''" — she''s not done. (B) reads her as
    wanting her son to recognize what she''s endured — like a guilt-trip — but she
    doesn''t ask for anything for herself; her life is evidence, not a claim. (D)
    is the closest trap: it reads her as comforting him with the promise that hardship
    gives way to better times. But the poem never says it gets better — the closing
    line repeats the opening one, and the only thing she tells him is to keep going.
    The absence of comfort is part of the poem''s honesty.'
  distractor_types:
    A: too_broad
    B: misidentified_detail
    D: opposite
