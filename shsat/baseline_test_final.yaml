    \ 6 cm, doubling gives 12 cm, and 12² = 144 cm².\r\n\r\n(C) is the most important\
    \ miss: assuming that doubling the side doubles the area (36 × 2 = 72). Area is\
    \ two-dimensional — when you double the side, you double it in both directions,\
