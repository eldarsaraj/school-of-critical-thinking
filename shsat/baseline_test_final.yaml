  question_text: Which best describes how the author organizes the information in
    the passage?
  choice_a: The passage moves in strict chronological order, from the early years
    of Parks's activism through the final desegregation ruling.
  choice_b: The passage opens with the central event, then provides historical and
    strategic background, before resuming the chronological story.
  choice_c: The passage compares the boycott to other civil rights protests, highlighting
    what made it distinctive.
  choice_d: The passage alternates between Parks's personal experiences and political
    analysis throughout, without a clear time frame.
