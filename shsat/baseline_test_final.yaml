  choice_b: ordered or commanded by an authority
  choice_c: demanded urgent attention from other scientists
  choice_d: required as a result of new evidence
  correct_answer: D
  explanation: 'The word "forced" most often refers to physical force ("forced the
    door open") or to someone making another person do something ("forced him to apologize").
    But the word also has a figurative meaning: when evidence or facts leave you no
    choice but to change your thinking. That''s how the passage uses it here — the
    discovery of chemosynthesis didn''t physically push scientists or order them to
    think differently; it gave them new information that required them to reconsider
    what life needs. (A) reads "forced" literally as physical compulsion, but no one
    applied physical force. (B) reads it as a command from an authority, but no authority
    gave any order — the evidence itself was the compelling factor. (C) extends "forced"
    to mean "demanded public attention," but the passage is about scientists'' rethinking,
    not public response.'
