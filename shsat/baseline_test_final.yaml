  question_text: As used in sentence 10, the word "measured" most nearly means —
  choice_a: carefully calculated and planned out in advance
  choice_b: examined and judged for its moral significance
  choice_c: kept within reasonable bounds and not allowed to grow excessive
  choice_d: small in size and unlikely to cause any serious effect
  correct_answer: C
  explanation: 'The word "measured" can mean several things — calculated, evaluated,
    modest in size — so you need the passage to choose the right one. Murphy says
    resentment "in measured amounts" is healthy, and a few sentences later (sentence
    13) the passage tells you the opposite of measured: resentment that "rarely remains
    measured for long" — it "grows, it consumes." So "measured" here means kept within
    proper bounds, not allowed to grow excessive. That''s choice C. (A) "carefully
    calculated and planned" is a real sense of "measured" (as in "a measured response"),
    but Murphy isn''t saying resentment is strategic — he''s saying it should be proportionate.
    (B) "examined and judged" plays on the root of the word ("measure" = to assess),
    but the phrase "in measured amounts" is about amount, not about evaluating something.
    (D) is close but wrong: "measured" doesn''t mean small; it means not growing out
    of bounds. Even substantial resentment can be "measured," as long as it stays
    proportionate.'
