  question_text: Two machines complete a cycle at regular intervals. Machine A completes
    a cycle every 8 seconds and Machine B every 12 seconds. If both start a cycle
    at the same moment, after how many seconds will they next start a cycle together?
  choice_a: '4'
  choice_b: '24'
  choice_c: '48'
  choice_d: '96'
  correct_answer: B
  explanation: "The machines align whenever the elapsed time is a multiple of both\
    \ 8 and 12 at once. The first time this happens is the least common multiple (LCM).\
    \ Break each number into prime factors: 8 = 2×2×2 and 12 = 2×2×3. The LCM takes\
    \ the highest power of each prime that appears: 2³ × 3 = 24 seconds. Check: in\
    \ 24 seconds, Machine A completes 3 cycles and Machine B completes 2 — both land\
    \ exactly at 24.\r\n\r\n(A) finds the greatest common factor (4) instead of the\
    \ least common multiple. GCF answers \"what's the largest number that divides\
    \ both\" — useful for simplifying, but not for finding when repeating events line\
    \ up. For events recurring together, you need the LCM.\r\n\r\n(C) finds 48, which\
    \ is a common multiple — both 8 and 12 divide it — but not the least one. The\
    \ machines align at 24 first, then again at 48, 72, and so on. The question asks\
    \ for the next time, which is the smallest common multiple.\r\n\r\n(D) multiplies\
    \ the two intervals: 8×12 = 96. Multiplying always produces a common multiple,\
    \ but it overshoots the least one whenever the numbers share a factor. Since 8\
    \ and 12 share a factor of 4, the LCM is 96÷4 = 24 — much sooner than 96."
  distractor_types:
    A: wrong_formula
    C: fast_pattern_match
    D: wrong_formula
