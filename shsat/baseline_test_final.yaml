  explanation: 'Work inside the absolute value bars first, then apply order of operations.
    |−6 + (−4)| = |−10| = 10 (the bars turn negative numbers positive). Multiply:
    10 × 3 = 30. Then |2 − 5| = |−3| = 3. Finally 30 − 3 = 27. (A) ignores the absolute
    value bars and keeps the negatives: (−10)(3) − (−3) = −27. (B) makes a common
    conceptual mistake — treating absolute value like it distributes over addition,
    so |−6 + (−4)| becomes |−6| + |−4| = 10 (same result here, but really 6 + 4) —
    then with order of operations: 6 + 4 × 3 − 3 = 15. But absolute value of a sum
    is not the same as the sum of absolute values: you must combine the numbers inside
    the bars first. (D) does the absolute values correctly but adds instead of subtracts
