  question_text: Based on the passage, which statement best describes the narrator's
    attitude toward her grandmother's silence about the past?
  choice_a: She is frustrated by the silence and wishes her grandmother had passed
    down more of her story.
  choice_b: She has come to understand the silence as part of what immigration did
    — a past that became hard to put into words.
  choice_c: She admires the silence as a sign of her grandmother's strength and refusal
    to complain..
  choice_d: She feels sorrow for her grandmother, sensing that the silence hid years
    of private suffering.
  correct_answer: B
  explanation: 'By the end of the essay, the narrator isn''t angry, admiring, or sad
    about her grandmother''s silence — she has come to understand it. Her big idea
    is that immigration is "interior translation... a rendering of oneself into a
    language that was never quite designed for you." Seen that way, the silence makes
    sense: her grandmother''s old life became something she couldn''t fully translate
    into her new one, so it went unspoken. That''s choice B. (A) captures a real feeling
    — the narrator does wish she knew more — but the essay resolves into understanding,
    not frustration with her grandmother. (C) puts a heroic spin on the silence, calling
