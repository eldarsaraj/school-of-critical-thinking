    passage_text: |
      Maps are among the oldest human artifacts, predating writing by thousands of years.
      The earliest known map, carved on a mammoth tusk found in present-day Ukraine, dates
      to approximately 14,000 BCE and depicts a landscape of hills, rivers, and human
      settlements. From the beginning, maps have served a dual purpose: to record what is
      known and to communicate it to others.

      For most of history, maps were instruments of power. Controlling geographic knowledge
      meant controlling trade routes, military strategy, and colonial expansion. European
      powers in the fifteenth and sixteenth centuries closely guarded their navigational
      charts — Portuguese cartographers were legally forbidden from sharing their charts of
      the African coast. An accurate map of a coastline or a river system was as valuable
      as a military secret.

      The invention of the printing press transformed cartography. Before the press, each
      map was a unique handmade object, owned by rulers or wealthy merchants. After it,
      maps could be reproduced and distributed, democratizing geographic knowledge. By the
      seventeenth century, map-making had become a commercial enterprise, with publishers
      in Amsterdam producing atlases sold across Europe.

      Modern cartography is defined by satellite technology and digital mapping. GPS-based
      systems have made accurate real-time location available to anyone with a mobile device,
      a development that would have seemed extraordinary to the cartographers who once
      guarded their knowledge at the price of their careers. Yet even today, the question
      of how to represent a three-dimensional world on a flat surface involves choices that
      carry political and perceptual consequences. Every map projection distorts something.
      Choosing what to distort — size, shape, distance, or direction — reflects priorities
      that are never purely technical.
