    passage_text: |
      Marie Curie was born Maria Sklodowska in Warsaw, Poland, in 1867, at a time when
      women were barred from attending universities in her home country. She moved to
      Paris at age 24 to study at the Sorbonne, where she became the first woman to earn
      a doctorate in physics in France. Her academic path was defined as much by
      determination as by brilliance: she worked as a governess for years to fund her
      own and her sister's education.

      Curie's most significant scientific contribution was her research into radioactivity —
      a term she coined. Working alongside her husband Pierre, she discovered two new
      elements: polonium (named for her homeland) and radium. Her work demonstrated that
      radioactivity was an atomic property — a finding that contradicted the prevailing
      scientific belief that atoms were indivisible and unchanging.

      The personal cost of her research was severe. Curie worked with radioactive materials
      without understanding the health risks, and she carried test tubes of radioactive
      isotopes in her coat pockets. She died in 1934 of aplastic anemia, almost certainly
      caused by her prolonged exposure to radiation. Her original laboratory notebooks are
      still radioactive today and are stored in lead-lined boxes. Researchers who wish to
      examine them must sign a waiver acknowledging the health risk.

      Despite the obstacles she faced, Curie became the first person to win Nobel Prizes
      in two different sciences — physics in 1903 (shared with Pierre and Henri Becquerel)
      and chemistry in 1911. She remains the only person to have achieved this distinction.
      Her legacy includes not only her discoveries but the institutions she founded for
      cancer research and treatment.
