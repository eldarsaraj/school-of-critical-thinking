  # Passage 1: Urban Heat Islands
  - number: 5
    stage: routing
    skill: literal_comprehension
    difficulty: medium
    type: multiple_choice
    topic: Reading Comprehension
    passage_id: routing_p1
    passage_title: "Urban Heat Islands"
    passage_text: |
      An urban heat island (UHI) is a metropolitan area that is significantly warmer than
      its surrounding rural areas due to human activities and the built environment. Cities
      replace natural land cover with pavement, buildings, and other surfaces that absorb
      and retain heat. Dark road and rooftop surfaces absorb solar radiation during the day
      and release it slowly at night, preventing the overnight cooling that rural areas
      naturally experience.

      Vegetation plays a critical role in this dynamic. Plants cool the air through
      evapotranspiration, a process in which water evaporates from leaf surfaces and
      absorbs heat in the process. When cities replace trees and grass with concrete and
      asphalt, they eliminate this natural cooling mechanism. Researchers have documented
      that city centers can be anywhere from 1 to 7 degrees Celsius warmer than surrounding
      suburbs and countryside, depending on the size of the city and local weather patterns.

      The consequences extend beyond personal discomfort. Higher temperatures increase the
      demand for air conditioning, which raises electricity consumption and, in cities
      dependent on fossil fuels, produces more greenhouse gas emissions. This creates a
      reinforcing cycle: more energy use means more heat generated by power plants, which
      raises urban temperatures further. Heat waves become especially dangerous in dense
      urban neighborhoods. During Chicago's 1995 heat wave, more than 700 people died,
      with fatalities concentrated in areas with little tree cover.

      Urban planners have responded with several strategies: cool roofs (coated with
      reflective materials), green roofs planted with vegetation, and expanded urban
      forestry programs. The city of Los Angeles has committed to planting 90,000 trees
      and replacing dark road surfaces with lighter, reflective pavement — measures designed
      not only to reduce temperatures but to limit the energy demand that worsens the cycle.
    question: |
      According to the passage, what is the primary reason city centers are warmer than
      surrounding rural areas?
    choices:
      A: "Cities use more air conditioning, generating heat from electrical equipment."
      B: "Human activities and the built environment replace natural land cover with
          surfaces that absorb and retain heat."
      C: "Rural areas benefit from natural wind patterns that cool the air."
      D: "Factories and industrial plants release large amounts of heat directly into the air."
    answer: B
    distractors:
      A: misidentified_detail
      C: unsupported
      D: unsupported
    explanation: |
      The passage directly states in the first paragraph that UHIs occur "due to human
      activities and the built environment" which replace natural cover with heat-absorbing
      surfaces. Choice A mentions air conditioning, which is a consequence of UHIs, not the
      primary cause. Choices C and D are not mentioned in the passage.

