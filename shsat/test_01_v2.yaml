  - number: 1
    stage: routing
    skill: grammar_mechanics
    difficulty: medium
    type: multiple_choice
    topic: Subject-Verb Agreement
    question: |
      Which of the following is the best correction of the grammatical error in the sentence below?

      "Each of the students enrolled in the advanced seminars are required to submit
      a research proposal before the end of the semester."
    choices:
      A: "Each of the students enrolled in the advanced seminars is required to submit a research proposal before the end of the semester."
      B: "Each of the students enrolled in the advanced seminars are requiring to submit a research proposal before the end of the semester."
      C: "Each of the students enrolled in the advanced seminars were required to submit a research proposal before the end of the semester."
      D: "Each student enrolled in the advanced seminars are required to submit a research proposal before the end of the semester."
    answer: A
    distractors:
      B: wrong_fix
      C: wrong_fix
      D: wrong_fix
    explanation: |
      "Each" is an indefinite pronoun that always takes a singular verb. The phrase "of the
      students enrolled in the advanced seminars" is a prepositional phrase modifying "each"
      and does not affect verb agreement. The correct verb is "is required."
      Choice B changes "required" to "requiring" but keeps the wrong number.
      Choice C switches to past tense but keeps the plural verb.
      Choice D changes the subject phrase but fails to fix the verb.

  - number: 2
    stage: routing
    skill: grammar_mechanics
    difficulty: medium
    type: multiple_choice
    topic: Pronoun-Antecedent Agreement
    question: |
      Which of the following is the best revision of the underlined portion of the sentence below?

      "The committee announced that they would delay their decision until more evidence was reviewed."

      Underlined portion: "they would delay their decision"
    choices:
