  # Passage 6: The Origins of Written Language
  - number: 13
    stage: hard_module
    skill: literal_comprehension
    difficulty: hard
    type: multiple_choice
    topic: Reading Comprehension
    passage_id: hard_p2
    passage_title: "The Origins of Written Language"
    passage_text: |
      Writing was not invented once. It emerged independently in at least four locations:
      Mesopotamia (around 3400 BCE), Egypt (around 3200 BCE), China (around 1200 BCE),
      and Mesoamerica (around 900 BCE). Each system began not as a way to record speech but
      as a way to track things — grain quantities, cattle herds, tax obligations. The impulse
      behind writing was administrative, not literary.

      The earliest Mesopotamian writing, known as cuneiform, consisted of wedge-shaped marks
      pressed into clay tablets. At first, these marks were purely pictographic — a circle
      with lines might represent the sun, a head with a bowl might represent eating. Over
      centuries, the symbols became increasingly abstract, losing their visual resemblance
      to the things they represented. By around 2600 BCE, cuneiform had developed into a
      full writing system capable of recording complex grammatical structures, not just
      simple transactions.

      Writing and literacy, however, are not the same thing. For most of the history of
      writing, the ability to read and write was the exclusive possession of a small
      scribal class — specialists trained from childhood to serve the administrative needs
      of states and temples. In ancient Mesopotamia, literacy rates were probably well below
      one percent. The idea that literacy might be universal — that every member of a
      society should learn to read — is historically recent, emerging in earnest only in
      the eighteenth and nineteenth centuries, driven by the spread of printing, religious
      imperatives, and industrial economies that demanded a literate workforce.

      The implications of this history for how we understand the relationship between writing
      and thought are significant. The cognitive anthropologist Walter Ong argued that
      literacy does not merely give access to information — it restructures how the mind
      works. Literate cultures, he claimed, develop abstract, analytic thinking that oral
      cultures do not. If Ong is right, then the recent expansion of writing to include
