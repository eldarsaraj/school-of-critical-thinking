      B: "To gain practical experience before pursuing a career in science."
      C: "Because she was not yet old enough to attend the Sorbonne."
      D: "To save money to move from Poland to Germany."
    answer: A
    distractors:
      B: unsupported
      C: unsupported
      D: distortion
    explanation: |
      The passage states she "worked as a governess for years to fund her own and her
      sister's education." Choice A accurately restates this. The other choices introduce
      reasons not mentioned in the passage.

