  # Passage 5: The Paradox of Choice
  - number: 5
    stage: hard_module
    skill: literal_comprehension
    difficulty: hard
    type: multiple_choice
    topic: Reading Comprehension
    passage_id: hard_p1
    passage_title: "The Paradox of Choice"
    passage_text: |
      In classical economics, more options are always better. A rational agent, given two
      menus — one with five items, one with fifty — will always prefer the larger set: at
      worst, she can ignore forty-five options and choose from the same five. Her freedom
      has expanded. This logic seems airtight. And yet decades of psychological research
      have documented a pattern that contradicts it.

      The psychologist Barry Schwartz, drawing on earlier work by the economists Amos
      Tversky and Daniel Kahneman, popularized the term "paradox of choice" to describe
      the counterintuitive finding that beyond a certain point, having more options reduces
      satisfaction. Studies have shown that when shoppers choose from a small array of
      products, they report greater satisfaction with their choice than when they select
      from a much larger array — even if they end up selecting the same item.

      The psychological mechanism behind this involves what Schwartz calls opportunity cost
      of a more vivid kind. When options are few, we select and move on. When options are
      many, the unchosen alternatives remain salient: we imagine what the other options
      might have offered, and those imagined losses diminish our enjoyment of what we chose.
      Schwartz calls people who feel compelled to find the best possible option "maximizers";
      those who settle for a good-enough option are "satisficers." Research consistently
      finds that maximizers report lower well-being than satisficers despite making
      objectively better choices by standard measures.

      The implications extend beyond consumer behavior. In medical decision-making, patients
      given too many treatment options report higher anxiety and lower satisfaction with
      their chosen treatment than those given fewer, clearly framed options. The same
      pattern appears in hiring: candidates presented with many job offers report more
      decision-related stress than those with few. The paradox, in its most provocative
      form, suggests that institutions designed to maximize freedom of choice may be
      inadvertently undermining the satisfaction of the people they serve.
    question: |
      According to the passage, what does classical economics assume about having more options?
    choices:
      A: "More options always benefit a rational agent because she can ignore unwanted choices."
      B: "More options lead to better decision-making but at the cost of time."
      C: "Rational agents prefer simplicity over abundance in all decisions."
      D: "Having too many options will eventually lead to irrational behavior."
    answer: A
    distractors:
      B: unsupported
      C: opposite
      D: distortion
    explanation: |
      The passage states that in classical economics, "a rational agent... will always prefer
      the larger set: at worst, she can ignore forty-five options and choose from the same
      five." Choice A accurately captures this logic. The other choices introduce ideas
      the classical economics position does not hold.

