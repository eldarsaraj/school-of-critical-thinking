      conclusions cannot study data — this is a dangling modifier. Choice A correctly
      makes "the research team" the subject. Choice B places the phrase next to "conclusions"
      — still dangling. Choice C uses "After studying" but the subject is still "conclusions."
      Choice D is grammatically awkward and uses a passive-style construction unnecessarily.

