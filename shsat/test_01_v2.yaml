    question: |
      Which of the following is the best revision of the sentence below?

      "Having studied the data carefully, the conclusions seemed obvious to the research team."
    choices:
      A: "Having studied the data carefully, the research team found the conclusions obvious."
      B: "The conclusions, having studied the data carefully, seemed obvious to the research team."
