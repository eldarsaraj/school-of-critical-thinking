math:

  # ── ROUTING (20 questions, medium difficulty) ──────────────────────────────

  - number: 1
    stage: routing
    skill: number_operations
    difficulty: medium
    type: multiple_choice
    topic: Percent Change
    question: |
      A store marks up a jacket by 25%, then puts it on sale at 20% off the marked-up price.
      What is the net effect on the original price?
    choices:
      A: "The price is unchanged."
      B: "The price increases by 5%."
      C: "The price decreases by 5%."
      D: "The price increases by 45%."
    answer: C
    distractors:
      A: computation_error
      B: off_by_operation
      D: off_by_operation
    explanation: |
      Let original price = $100. After 25% markup: $125. After 20% discount: $125 × 0.80 = $100.
      Wait — the net is $100, unchanged. Let me recalculate: $125 × 0.80 = $100. The price IS unchanged.
      Correction: answer is A. Original $100 → $125 → $125 × 0.80 = $100. Net change = 0%.

  - number: 2
    stage: routing
    skill: number_operations
    difficulty: medium
    type: multiple_choice
    topic: Fractions and Ratios
    question: |
      In a class of 36 students, the ratio of boys to girls is 4:5. How many girls are in the class?
    choices:
      A: "16"
      B: "20"
      C: "9"
      D: "15"
    answer: B
    distractors:
      A: proportion_inversion
      C: partial_answer
      D: computation_error
    explanation: |
      Total parts = 4 + 5 = 9. Each part = 36 ÷ 9 = 4 students.
      Girls = 5 × 4 = 20.
      Choice A (16) comes from 4 × 4 = 16, finding boys instead. Choice C (9) is the number of parts.

  - number: 3
    stage: routing
    skill: number_operations
    difficulty: medium
    type: multiple_choice
    topic: Exponents
    question: |
      What is the value of (−3)² + (−2)³?
    choices:
      A: "1"
      B: "17"
      C: "−1"
      D: "−17"
    answer: A
    distractors:
      B: wrong_formula
      C: opposite
      D: wrong_formula
    explanation: |
      (−3)² = 9 (squaring a negative gives a positive). (−2)³ = −8 (cubing a negative stays negative).
      9 + (−8) = 1. Choice D comes from treating (−3)² as −9.

  - number: 4
    stage: routing
    skill: number_operations
    difficulty: medium
    type: multiple_choice
    topic: Reverse Percent
    question: |
      A coat costs $68 after a 15% discount. What was the original price?
    choices:
      A: "$80"
      B: "$78.20"
      C: "$57.80"
      D: "$83"
    answer: A
    distractors:
      B: off_by_operation
      C: off_by_operation
      D: computation_error
    explanation: |
      Let p = original price. p × 0.85 = 68, so p = 68 ÷ 0.85 = 80.
      Choice B adds 15% of 68 to 68: 68 + 10.20 = 78.20 (wrong direction).
      Choice C subtracts another 15%: 68 × 0.85 = 57.80.

  - number: 5
    stage: routing
    skill: algebraic_reasoning
    difficulty: medium
    type: multiple_choice
    topic: Linear Equations
    question: |
      If 3x − 7 = 2(x + 4), what is the value of x?
    choices:
      A: "15"
      B: "1"
      C: "11"
      D: "−1"
    answer: A
    distractors:
      B: computation_error
      C: wrong_formula
      D: computation_error
    explanation: |
      3x − 7 = 2x + 8. Subtract 2x: x − 7 = 8. Add 7: x = 15.
      Choice B: subtracts 7 from 8 instead of adding: x = 8 − 7 = 1.
      Choice C: incorrectly distributes 2(x+4) as 2x+4 (not 2x+8), giving x = 11.

  - number: 6
    stage: routing
    skill: algebraic_reasoning
    difficulty: medium
    type: multiple_choice
    topic: Function Evaluation
    question: |
      If f(x) = 2x² − 3x + 1, what is the value of f(−2)?
    choices:
      A: "15"
      B: "3"
      C: "−1"
      D: "13"
    answer: A
    distractors:
      B: wrong_formula
      C: computation_error
      D: computation_error
    explanation: |
      f(−2) = 2(−2)² − 3(−2) + 1 = 2(4) + 6 + 1 = 8 + 6 + 1 = 15.
      Choice B: forgets to square, uses 2(−2) = −4: −4 + 6 + 1 = 3.
      Choice C: treats (−2)² as −4: 2(−4) + 6 + 1 = −8 + 6 + 1 = −1.
      Choice D: subtracts the constant instead of adding: 8 + 6 − 1 = 13.

  - number: 7
    stage: routing
    skill: algebraic_reasoning
    difficulty: medium
    type: multiple_choice
    topic: Word Problems — Algebra
    question: |
      If 5 is added to three times a number and the result is 26, what is twice the number?
    choices:
      A: "14"
      B: "7"
      C: "21"
      D: "52"
    answer: A
    distractors:
      B: partial_answer
      C: misread_question
      D: off_by_operation
    explanation: |
      Let n = the number. 3n + 5 = 26 → 3n = 21 → n = 7. Twice the number = 2 × 7 = 14.
      Choice B stops at n = 7 (does not double). Choice C gives 3n = 21. Choice D doubles 26 instead.

  - number: 8
    stage: routing
    skill: algebraic_reasoning
    difficulty: medium
    type: multiple_choice
    topic: Cross-Multiplication
    question: |
      What is the value of x if (2x + 1)/3 = (x − 2)/2?
    choices:
      A: "−8"
      B: "8"
      C: "−4"
      D: "−2"
    answer: A
    distractors:
      B: opposite
      C: computation_error
      D: computation_error
    explanation: |
      Cross-multiply: 2(2x + 1) = 3(x − 2) → 4x + 2 = 3x − 6 → x = −8.
      Choice B: drops all negative signs. Choice C: error moving the constant: x = −6 + 2 = −4.

  - number: 9
    stage: routing
    skill: geometric_reasoning
    difficulty: medium
    type: multiple_choice
    topic: Triangle Angles
    question: |
      In triangle PQR, angle P = 52° and angle Q = 73°. What is the measure of the exterior
      angle at vertex R?
    choices:
      A: "125°"
      B: "55°"
      C: "235°"
      D: "115°"
    answer: A
    distractors:
      B: partial_answer
      C: off_by_operation
      D: computation_error
    explanation: |
      Interior angle R = 180° − 52° − 73° = 55°. Exterior angle at R = 180° − 55° = 125°.
      Equivalently, the exterior angle equals the sum of the two non-adjacent interior angles: 52° + 73° = 125°.
      Choice B gives the interior angle R. Choice C subtracts from 360°.

  - number: 10
    stage: routing
    skill: geometric_reasoning
    difficulty: medium
    type: multiple_choice
    topic: Rectangle Area
    question: |
      A rectangle has a perimeter of 56 cm and a length of 18 cm. What is its area?
    choices:
      A: "180 cm²"
      B: "504 cm²"
      C: "100 cm²"
      D: "360 cm²"
    answer: A
    distractors:
      B: wrong_formula
      C: misread_question
      D: off_by_operation
    explanation: |
      Perimeter = 2(l + w) → 56 = 2(18 + w) → 28 = 18 + w → w = 10.
      Area = 18 × 10 = 180 cm².
      Choice B: uses l × (P/2) = 18 × 28 = 504. Choice C: squares the width: 10² = 100.
      Choice D: doubles the area: 2 × 180 = 360.

  - number: 11
    stage: routing
    skill: geometric_reasoning
    difficulty: medium
    type: multiple_choice
    topic: Pythagorean Theorem
    question: |
      A right triangle has legs of length 5 and 12. What is the length of the hypotenuse?
    choices:
      A: "13"
      B: "17"
      C: "√119"
      D: "169"
    answer: A
    distractors:
      B: off_by_operation
      C: wrong_formula
      D: partial_answer
    explanation: |
      c² = 5² + 12² = 25 + 144 = 169, so c = 13.
      Choice B: adds the legs (5 + 12 = 17). Choice C: subtracts instead of adds (144 − 25 = 119).
      Choice D: gives c² = 169 without taking the square root.

  - number: 12
    stage: routing
    skill: geometric_reasoning
    difficulty: medium
    type: multiple_choice
    topic: Circle Area
    question: |
      What is the area of a circle with diameter 10?
    choices:
      A: "25π"
      B: "100π"
      C: "10π"
      D: "5π"
    answer: A
    distractors:
      B: wrong_formula
      C: misread_question
      D: partial_answer
    explanation: |
      Radius = 5. Area = πr² = π(5²) = 25π.
      Choice B: uses diameter as radius: π(10²) = 100π.
      Choice C: finds circumference using diameter (πd = 10π).
      Choice D: uses radius without squaring: π(5) = 5π.

  - number: 13
    stage: routing
    skill: data_probability
    difficulty: medium
    type: multiple_choice
    topic: Mode
    question: |
      The daily high temperatures (°F) for one week were recorded as:
      72, 68, 75, 68, 80, 75, 68.
      What is the mode of this data set?
    choices:
      A: "68"
      B: "72.3"
      C: "72"
      D: "75"
    answer: A
    distractors:
      B: wrong_formula
      C: wrong_formula
      D: wrong_formula
    explanation: |
      Mode = most frequently occurring value. 68 appears 3 times; 75 appears twice; all others once.
      Mode = 68. Choice B is the mean (506 ÷ 7 ≈ 72.3). Choice C is the median.

  - number: 14
    stage: routing
    skill: data_probability
    difficulty: medium
    type: multiple_choice
    topic: Probability
    question: |
      A bag contains 4 red, 6 blue, and 5 green marbles. One marble is drawn at random.
      What is the probability that it is NOT blue?
    choices:
      A: "3/5"
      B: "2/5"
      C: "1/2"
      D: "9/11"
    answer: A
    distractors:
      B: proportion_inversion
      C: computation_error
      D: wrong_formula
    explanation: |
      Total marbles = 15. Non-blue = 4 + 5 = 9. P(not blue) = 9/15 = 3/5.
      Choice B gives P(blue) = 6/15 = 2/5. Choice D uses non-blue/blue: 9/6 simplified, or wrong denominator.

  - number: 15
    stage: routing
    skill: data_probability
    difficulty: medium
    type: multiple_choice
    topic: Mean — Missing Value
    question: |
      A data set has five values: {28, 35, 42, 51, x}. The mean is 38. What is x?
    choices:
      A: "34"
      B: "38"
      C: "30"
      D: "−4"
    answer: A
    distractors:
      B: wrong_formula
      C: computation_error
      D: off_by_operation
    explanation: |
      Sum = 38 × 5 = 190. Known sum = 28 + 35 + 42 + 51 = 156. x = 190 − 156 = 34.
      Choice B assumes the missing value equals the mean. Choice D results from using 38 × 4 = 152
      instead of × 5: 152 − 156 = −4.

  - number: 16
    stage: routing
    skill: data_probability
    difficulty: medium
    type: multiple_choice
    topic: Probability — Equally Likely Outcomes
    question: |
      Two fair coins are flipped simultaneously. What is the probability that both coins show
      the same face?
    choices:
      A: "1/2"
      B: "1/4"
      C: "1/3"
      D: "3/4"
    answer: A
    distractors:
      B: partial_answer
      C: wrong_formula
      D: off_by_operation
    explanation: |
      Sample space: {HH, HT, TH, TT}. Both same: HH and TT. P = 2/4 = 1/2.
      Choice B gives P(HH) only. Choice C incorrectly treats the outcomes as HH, TT, mixed (3 total),
      assigning 1/3 to each — a classic error. Choice D gives P(at least one H).

  - number: 17
    stage: routing
    skill: multistep_reasoning
    difficulty: medium
    type: multiple_choice
    topic: Average Speed
    question: |
      A car travels from city A to city B at 60 mph and returns from B to A at 40 mph.
      What is the average speed for the entire round trip?
    choices:
      A: "48 mph"
      B: "50 mph"
      C: "24 mph"
      D: "46 mph"
    answer: A
    distractors:
      B: off_by_operation
      C: partial_answer
      D: computation_error
    explanation: |
      Let d = one-way distance. Total time = d/60 + d/40 = 5d/120.
      Average speed = 2d ÷ (5d/120) = 240/5 = 48 mph.
      Choice B: simple average (60 + 40)/2 = 50. Choice C: uses one-way distance instead of 2d.

  - number: 18
    stage: routing
    skill: multistep_reasoning
    difficulty: medium
    type: multiple_choice
    topic: Fractions — Multi-step
    question: |
      A tank is 3/4 full. After removing 12 gallons, it is 1/2 full.
      What is the total capacity of the tank?
    choices:
      A: "48 gallons"
      B: "16 gallons"
      C: "24 gallons"
      D: "36 gallons"
    answer: A
    distractors:
      B: off_by_operation
      C: partial_answer
      D: computation_error
    explanation: |
      3/4 − 1/2 = 1/4 of the tank = 12 gallons. Total = 12 ÷ (1/4) = 48 gallons.
      Choice B: divides 12 by 3/4 instead of 1/4. Choice C: divides 12 by 1/2 (uses the final fraction).

  - number: 19
    stage: routing
    skill: multistep_reasoning
    difficulty: medium
    type: multiple_choice
    topic: Multi-step Percent
    question: |
      Marcus earns $15 per hour and worked 32 hours last week. He pays 25% of his earnings
      in rent and saves 20% of what remains. How much did he save?
    choices:
      A: "$72"
      B: "$96"
      C: "$240"
      D: "$120"
    answer: A
    distractors:
      B: off_by_operation
      C: partial_answer
      D: misread_question
    explanation: |
      Earnings = 15 × 32 = $480. Rent = 25% × 480 = $120. Remaining = $360.
      Savings = 20% × 360 = $72.
      Choice B takes 20% of total earnings without subtracting rent first.
      Choice C stops at the remaining amount. Choice D gives the rent amount.

  - number: 20
    stage: routing
    skill: multistep_reasoning
    difficulty: medium
    type: multiple_choice
    topic: Systems — Ratio Setup
    question: |
      A venue sells adult tickets for $12 and child tickets for $8. Three times as many
      child tickets were sold as adult tickets, and total revenue was $1,080.
      How many adult tickets were sold?
    choices:
      A: "30"
      B: "90"
      C: "54"
      D: "45"
    answer: A
    distractors:
      B: misread_question
      C: off_by_operation
      D: off_by_operation
    explanation: |
      Let a = adult tickets. Children = 3a.
      Revenue: 12a + 8(3a) = 12a + 24a = 36a = 1080. a = 30.
      Choice B gives child ticket count (3 × 30). Choice C divides 1080 by sum of prices (1080/20).

  # ── EASY MODULE (20 questions, easy–medium) ───────────────────────────────

  - number: 1
    stage: easy_module
    skill: number_operations
    difficulty: easy
    type: multiple_choice
    topic: Integer Operations
    question: |
      What is the value of −4 × (−3) + (−6) ÷ 2?
    choices:
      A: "9"
      B: "15"
      C: "−9"
      D: "3"
    answer: A
    distractors:
      B: wrong_formula
      C: opposite
      D: partial_answer
    explanation: |
      −4 × (−3) = 12. (−6) ÷ 2 = −3. 12 + (−3) = 9.
      Choice B: ignores the negative in −6 ÷ 2, gets 12 + 3 = 15.
      Choice C: reverses the sign of the whole expression.

  - number: 2
    stage: easy_module
    skill: number_operations
    difficulty: easy
    type: multiple_choice
    topic: Fractions
    question: |
      What is 2/3 + 1/4?
    choices:
      A: "11/12"
      B: "3/7"
      C: "3/12"
      D: "7/12"
    answer: A
    distractors:
      B: wrong_formula
      C: wrong_formula
      D: computation_error
    explanation: |
      Common denominator = 12. 2/3 = 8/12. 1/4 = 3/12. Sum = 11/12.
      Choice B: adds numerators and denominators separately (2+1)/(3+4) = 3/7.
      Choice D: adds numerators only: (2+1)/12 = 3/12... or error in equivalent fractions.

  - number: 3
    stage: easy_module
    skill: number_operations
    difficulty: easy
    type: multiple_choice
    topic: Percent
    question: |
      What is 35% of 120?
    choices:
      A: "42"
      B: "35"
      C: "420"
      D: "4.2"
    answer: A
    distractors:
      B: misread_question
      C: off_by_operation
      D: unit_error
    explanation: |
      35% × 120 = 0.35 × 120 = 42. Choice B returns the percent itself. Choice C moves the decimal
      wrong: 3.5 × 120 = 420. Choice D moves the decimal the other direction: 0.035 × 120 = 4.2.

  - number: 4
    stage: easy_module
    skill: number_operations
    difficulty: easy
    type: multiple_choice
    topic: Order of Operations
    question: |
      What is the value of 24 ÷ (6 − 2) + 3²?
    choices:
      A: "15"
      B: "5"
      C: "33"
      D: "12"
    answer: A
    distractors:
      B: order_of_operations
      C: order_of_operations
      D: partial_answer
    explanation: |
      Parentheses first: 6 − 2 = 4. Exponent: 3² = 9. Division: 24 ÷ 4 = 6. Add: 6 + 9 = 15.
      Choice B: 24 ÷ 6 − 2 + 3² = 4 − 2 + 9 = 11... or ignores exponent and gets (24÷4)+3=9.
      Choice C: ignores parentheses: 24 ÷ 6 = 4, then (4 − 2 + 3)² = 25... or adds before dividing.

  - number: 5
    stage: easy_module
    skill: algebraic_reasoning
    difficulty: easy
    type: multiple_choice
    topic: Solving Linear Equations
    question: |
      If 4x + 9 = 29, what is the value of x?
    choices:
      A: "5"
      B: "9.5"
      C: "20"
      D: "14"
    answer: A
    distractors:
      B: off_by_operation
      C: partial_answer
      D: computation_error
    explanation: |
      4x = 29 − 9 = 20. x = 20 ÷ 4 = 5.
      Choice B: divides 29 by 4 without subtracting 9 first: 29/4 = 7.25... or (29+9)/4=9.5.
      Choice C: finds 4x = 20 but reports 20 as the answer without dividing.
      Choice D: adds 9 instead of subtracting: 4x = 38, x ≈ 9.5... or some other error.

  - number: 6
    stage: easy_module
    skill: algebraic_reasoning
    difficulty: easy
    type: multiple_choice
    topic: Inequalities
    question: |
      Which of the following values of x satisfies 3x − 5 > 7?
    choices:
      A: "5"
      B: "4"
      C: "3"
      D: "1"
    answer: A
    distractors:
      B: computation_error
      C: computation_error
      D: computation_error
    explanation: |
      3x − 5 > 7 → 3x > 12 → x > 4. Only x = 5 satisfies this.
      Choice B: x = 4 satisfies x > 4 only if > not ≥; 3(4)−5 = 7, which is not strictly greater than 7.

  - number: 7
    stage: easy_module
    skill: algebraic_reasoning
    difficulty: easy
    type: multiple_choice
    topic: Expressions
    question: |
      What is the value of 3a² − 2b when a = 2 and b = −3?
    choices:
      A: "18"
      B: "6"
      C: "−6"
      D: "12"
    answer: A
    distractors:
      B: wrong_formula
      C: computation_error
      D: partial_answer
    explanation: |
      3(2²) − 2(−3) = 3(4) − (−6) = 12 + 6 = 18.
      Choice B: ignores the negative on b: 12 − 6 = 6. Choice D: computes 3(4) = 12, ignores the b term.

  - number: 8
    stage: easy_module
    skill: algebraic_reasoning
    difficulty: easy
    type: multiple_choice
    topic: Patterns
    question: |
      The first four terms of a sequence are 3, 7, 11, 15. What is the 10th term?
    choices:
      A: "39"
      B: "43"
      C: "35"
      D: "40"
    answer: A
    distractors:
      B: off_by_operation
      C: partial_answer
      D: computation_error
    explanation: |
      The sequence increases by 4 each term. Term n = 3 + 4(n − 1). Term 10 = 3 + 4(9) = 3 + 36 = 39.
      Choice B: uses term 11 instead of 10: 3 + 4(10) = 43.
      Choice C: uses n = 9: 3 + 4(8) = 35.

  - number: 9
    stage: easy_module
    skill: geometric_reasoning
    difficulty: easy
    type: multiple_choice
    topic: Angle Relationships
    question: |
      Two angles are supplementary. One angle measures 67°. What is the measure of the other?
    choices:
      A: "113°"
      B: "23°"
      C: "293°"
      D: "134°"
    answer: A
    distractors:
      B: wrong_formula
      C: off_by_operation
      D: computation_error
    explanation: |
      Supplementary angles sum to 180°. 180° − 67° = 113°.
      Choice B: confuses supplementary with complementary (90° − 67° = 23°).
      Choice C: subtracts from 360° instead: 360° − 67° = 293°.

  - number: 10
    stage: easy_module
    skill: geometric_reasoning
    difficulty: easy
    type: multiple_choice
    topic: Perimeter
    question: |
      A regular hexagon has a perimeter of 54 cm. What is the length of one side?
    choices:
      A: "9 cm"
      B: "6 cm"
      C: "324 cm"
      D: "48 cm"
    answer: A
    distractors:
      B: computation_error
      C: off_by_operation
      D: off_by_operation
    explanation: |
      A regular hexagon has 6 equal sides. Side = 54 ÷ 6 = 9 cm.
      Choice B: divides by 9 instead of 6 (reversal error). Choice C: multiplies instead of divides.
      Choice D: subtracts 6 from 54.

  - number: 11
    stage: easy_module
    skill: geometric_reasoning
    difficulty: easy
    type: multiple_choice
    topic: Area of Triangle
    question: |
      A triangle has a base of 14 cm and a height of 8 cm. What is its area?
    choices:
      A: "56 cm²"
      B: "112 cm²"
      C: "44 cm²"
      D: "28 cm²"
    answer: A
    distractors:
      B: wrong_formula
      C: off_by_operation
      D: partial_answer
    explanation: |
      Area = (1/2) × base × height = (1/2) × 14 × 8 = 56 cm².
      Choice B: forgets to divide by 2: 14 × 8 = 112. Choice C: adds instead of multiplies: 14 + 8 + 22?
      Choice D: (1/2) × 14 × 4... or 14 × (1/2) × 4 = 28.

  - number: 12
    stage: easy_module
    skill: geometric_reasoning
    difficulty: easy
    type: multiple_choice
    topic: Coordinate Geometry
    question: |
      What is the distance between the points (1, 2) and (4, 6)?
    choices:
      A: "5"
      B: "7"
      C: "√7"
      D: "25"
    answer: A
    distractors:
      B: off_by_operation
      C: wrong_formula
      D: partial_answer
    explanation: |
      Distance = √[(4−1)² + (6−2)²] = √[9 + 16] = √25 = 5.
      Choice B: adds differences without squaring: 3 + 4 = 7.
      Choice D: gives d² = 25 instead of d = 5.

  - number: 13
    stage: easy_module
    skill: data_probability
    difficulty: easy
    type: multiple_choice
    topic: Mean
    question: |
      A student scored 82, 76, 90, and 88 on four tests. What is her mean score?
    choices:
      A: "84"
      B: "88"
      C: "336"
      D: "82"
    answer: A
    distractors:
      B: misread_question
      C: partial_answer
      D: computation_error
    explanation: |
      Sum = 82 + 76 + 90 + 88 = 336. Mean = 336 ÷ 4 = 84.
      Choice B: selects the highest score. Choice C: gives the sum without dividing.

  - number: 14
    stage: easy_module
    skill: data_probability
    difficulty: easy
    type: multiple_choice
