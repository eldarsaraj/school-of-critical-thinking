  passage_title: Is Zoning Reform the Solution to the Housing Crisis? — Two Views
  passage_text: |-
    Passage A: The Case for Zoning Reform

    The housing affordability crisis in American cities is, at its root, a supply problem. Decades of restrictive zoning — rules that prohibit apartment buildings in most residential areas and impose minimum lot sizes, setback requirements, and parking mandates — have made it illegal to build the kind of dense, affordable housing that millions of people need. The solution is straightforward if politically difficult: reform the rules. Upzoning neighborhoods to allow multifamily housing, eliminating single-family zoning, and permitting accessory dwelling units (ADUs) on existing properties would increase supply and, over time, moderate rents. Cities like Minneapolis and states like Oregon have already taken these steps with measurable results.

    Passage B: The Case for Caution

    Zoning reform advocates present their case with the confidence of those who have never had to live with the consequences of rapid neighborhood change. The historical record is clear: when low-income neighborhoods are upzoned, developers build luxury units — because luxury is where the profit margins are. Long-term residents are displaced by rising rents even before the new units are completed, a phenomenon documented extensively in the research literature. Supply-side solutions take years to affect rents, leaving vulnerable communities to absorb the pain of transition. Meaningful reform requires pairing upzoning with strong tenant protections, community land trusts, and investment in genuinely affordable housing — not the blunt instrument of market liberalization alone.
  question_text: What does Passage A identify as the primary cause of the housing affordability crisis?
  choice_a: A shortage of government investment in affordable housing
  choice_b: Restrictive zoning laws that prevent the construction of dense housing
  choice_c: The preference of developers for building luxury rather than affordable units
  choice_d: Rapid population growth in cities that outpaces available housing
  correct_answer: B
  explanation: 'Passage A states directly: ''The housing affordability crisis in American cities is, at its root, a supply
    problem'' caused by ''restrictive zoning — rules that prohibit apartment buildings in most residential areas.'''
  distractors:
    A: unsupported
    C: misidentified_detail
    D: unsupported
