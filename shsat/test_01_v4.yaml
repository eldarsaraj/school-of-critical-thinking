- question_number: 17
  stage: hard_module
  question_type: multiple_choice
  skill: inference_analysis
  difficulty: hard
  passage_group_id: ela_h_p3
  passage_title: The Trouble with Meritocracy
  passage_text: |-
    The idea of meritocracy — that social rewards should be distributed according to individual talent and effort rather than birth or privilege — is among the most widely shared values in contemporary democratic societies. Its appeal is intuitive: people should earn what they get, and everyone should have a fair chance to earn it. This seems obviously just, and yet the philosopher Michael Sandel has argued, with considerable force, that meritocracy may carry within it the seeds of its own moral failure.

    Sandel's critique runs as follows. In a genuine meritocracy, success is held to be deserved. If a society is truly meritocratic, those at the top have earned their position through superior ability and effort. But this creates a corresponding implication: those at the bottom have earned their position too. Failure becomes not merely an economic condition but a moral verdict. Poverty is recast as evidence of insufficient effort or intelligence, and the poor are held responsible for their own deprivation in a way that previous aristocratic arrangements did not require.

    The second problem is more subtle. The talents and capacities that a meritocracy rewards are not, in any straightforward sense, self-created. One's intelligence, temperament, and even work ethic are shaped by genetics, upbringing, and circumstance — factors over which individuals have limited control. If this is true, then the claim that successful people deserve their rewards becomes considerably less secure. We do not typically deserve credit for winning a race we were born to win.

    Sandel's remedy is not to abandon meritocracy but to temper it with a stronger sense of solidarity — an acknowledgment that success is never purely individual, and that the circumstances enabling talent to flourish are themselves partly a collective achievement deserving collective recognition.
  question_text: According to the passage, what is the 'moral failure' that meritocracy risks producing?
  choice_a: People work too hard and neglect their personal relationships.
  choice_b: Those at the top become arrogant and dismiss the concerns of those below them.
  choice_c: Failure is treated as a moral verdict rather than an economic condition, making poverty a source of shame.
  choice_d: Meritocratic societies become less competitive over time as people lose motivation.
  correct_answer: C
  explanation: The passage states that in a meritocracy, 'failure becomes not merely an economic condition but a moral verdict'
    and 'the poor are held responsible for their own deprivation.' This is the core moral danger Sandel identifies — poverty
    becomes a sign of personal failure rather than circumstance.
  distractors:
    A: unsupported
    B: distortion
    D: unsupported
