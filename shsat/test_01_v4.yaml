  passage_title: Honeybees and Their Hive
  passage_text: |-
    Honeybees are remarkable insects that live and work together in large colonies. A single hive can contain up to 60,000 bees, the vast majority of which are female worker bees. These workers do nearly all of the labor in the colony — collecting nectar from flowers, producing honey, building and repairing the wax comb, cleaning the hive, and caring for the developing young, called larvae. A single worker bee may visit thousands of flowers in a single day, traveling miles from the hive in search of food.

    The queen bee, by contrast, has one main job: to lay eggs. During the warmest summer months, a healthy queen can produce up to 2,000 eggs per day. The colony's third caste consists of male bees, called drones, whose sole purpose is to mate with the queen of another colony. After mating, drones die. Those that survive the summer face a harsh fate in autumn, when worker bees push them out of the hive to conserve food during the lean winter months.

    Perhaps the most fascinating behavior of the honeybee is the way it communicates. When a forager bee discovers a productive patch of flowers, she returns to the hive and performs an elaborate movement called the waggle dance. The angle at which the bee dances on the vertical surface of the comb indicates the direction of the flowers relative to the sun. The duration of the central "waggle" portion of the dance indicates how far away the flowers are. Other workers attend to the dance, then fly out and locate the food source with surprising accuracy. Scientists did not fully understand this system until the Austrian researcher Karl von Frisch decoded it in the 1940s, work for which he later won the Nobel Prize. Some biologists have called the waggle dance the most sophisticated nonhuman communication system ever discovered.

    The importance of honeybees extends far beyond the hive. They pollinate approximately one-third of all the food humans eat, including apples, almonds, blueberries, cucumbers, and many other crops. Without bees to transfer pollen between flowers, these plants cannot produce the fruits and seeds that feed both humans and livestock. In economic terms, honeybee pollination contributes an estimated fifteen billion dollars annually to American agriculture alone.

    In recent decades, however, beekeepers have grown alarmed. Beginning around 2006, hives across North America and Europe began collapsing at unprecedented rates — a phenomenon scientists named Colony Collapse Disorder. The causes appear to be multiple and interconnected: parasitic mites that weaken hives, pesticides that impair bees' ability to navigate, viral diseases, and the loss of wildflower habitat to industrial farming. Some critics argue that fears about honeybee decline have been overstated, noting that the global number of managed honeybee colonies has actually increased since 2006 thanks to beekeeping efforts. But entomologists counter that this figure obscures the larger picture: native wild bees, which also play crucial roles in pollination, continue to vanish, and managed honeybee colonies require ever more intensive human intervention simply to survive.

    What is clear is that the relationship between humans and honeybees is older and deeper than most people realize. Cave paintings from over 8,000 years ago depict humans gathering honey from wild hives, and ancient Egyptian tombs contain jars of honey still preserved after millennia. Today, the question is not whether humans need bees — that has long been settled — but whether modern agricultural systems can be redesigned to keep them alive.
  question_text: Which statement about worker bees can best be supported by the passage?
  choice_a: Worker bees are responsible for laying most of the colony's eggs.
  choice_b: Worker bees perform many different roles essential to the colony's survival.
  choice_c: Worker bees rarely leave the hive once they are full-grown.
  choice_d: Worker bees and drones do similar kinds of work during the summer.
  correct_answer: B
  explanation: The passage states that worker bees collect nectar, produce honey, build and repair comb, clean the hive, and
    care for larvae — a wide range of tasks essential to the colony. Choice A confuses workers with the queen; C contradicts
    the description of foragers traveling miles; D contradicts the description of drones, whose only role is mating.
  distractors:
    A: opposite
    C: opposite
    D: opposite
