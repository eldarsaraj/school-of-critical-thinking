  passage_title: The Migrant
  passage_text: |-
    My grandmother carried two things across the Atlantic: a rosary whose beads she had worn smooth by the time she reached the harbor, and a silence she never surrendered. She had left a village in Croatia in 1923, at seventeen, with a name that the immigration officer at Ellis Island could not spell and therefore did not try. He wrote something else in the ledger, and that something else became us.

    She learned English from labels on soup cans and from the radio on Sunday mornings. She learned it without accent — or rather, she learned it with an accent that sounded like nobody's home country, a voice that belonged to no map. She was proud of this, I think, though she never said so. She did not say much about anything that had happened before.

    I found her photographs only after she died — a box of them, unlabeled, faces I could not name. A village church. A field. A group of young women standing with their arms around each other, squinting into Adriatic sunlight, laughing at something just outside the frame. My grandmother is among them — I know her jaw, her way of standing — but she is eighteen in the photograph, and she looks like she belongs entirely to that moment, to that place, to those women whose names I will never know.

    I have thought about that photograph for thirty years. I think it is not simply a record of a lost past. I think it is evidence of a self that crossed the ocean and did not arrive — or arrived differently, changed by the passage itself. Immigration is not, as I was taught, a journey from one place to another. It is a kind of interior translation, a rendering of oneself into a language that was never quite designed for you.
  question_text: What does the narrator most likely mean by saying that her grandmother arrived 'with an accent that sounded
    like nobody's home country'?
  choice_a: Her grandmother's English was so poor that it was unrecognizable as any language.
  choice_b: Her grandmother spoke a blend of Croatian and English that confused native speakers of both.
  choice_c: Her grandmother's English was neutral, belonging to neither Croatia nor America — she had created a voice of her
    own.
  choice_d: Her grandmother was ashamed of her accent and worked hard to eliminate it entirely.
  correct_answer: C
  explanation: The narrator says the accent 'belonged to no map' — not Croatian, not conventionally American. The grandmother
    had created a voice that fit no single origin, which is distinct from having no accent (impossible) or being ashamed.
  distractors:
    A: distortion
    B: too_narrow
    D: distortion
