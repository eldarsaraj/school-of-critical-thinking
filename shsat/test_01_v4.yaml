  passage_group_id: ela_e_p4
  passage_title: Rosa Parks and the Montgomery Bus Boycott
  passage_text: |-
    On the evening of December 1, 1955, Rosa Parks, a 42-year-old seamstress and longtime civil rights activist, boarded a city bus in Montgomery, Alabama, after a long day of work. She paid her fare, took a seat in the "colored section" toward the back of the bus, and rode in silence as the bus filled with passengers. When the white section in front filled up, the driver ordered Parks and three other Black passengers to give up their seats. The other three complied. Parks did not. When the driver threatened to call the police, she replied that he could go ahead. Within minutes, she was arrested and taken to the city jail.

    Her arrest was not an accident, nor was it merely the spontaneous act of a tired woman, as it has often been described in textbooks. Parks had been an active member of the National Association for the Advancement of Colored People (NAACP) for over a decade. She had attended workshops at the Highlander Folk School, an interracial training center for civil rights organizers in Tennessee. She knew Montgomery's Black ministers and community leaders, and they knew her. When word of her arrest spread that night, the city's civil rights community recognized an opportunity they had been waiting for: a respected, courageous figure whose case could be used to challenge bus segregation in court.

    Within days, a young minister named Martin Luther King Jr., newly arrived in Montgomery and not yet famous, agreed to lead a boycott of the city's bus system. The plan was risky. Most Black residents of Montgomery depended on public buses to get to work, and many had no other way to travel the long distances between their neighborhoods and the white households or businesses where they were employed. To make the boycott work, organizers established a network of carpools, recruited Black taxi drivers willing to charge bus-fare rates, and arranged for those who could not get a ride to walk. Some walked many miles each day, in heat and in winter rain, for over a year.

    The boycott lasted 381 days. During that time, the city's bus company lost the majority of its riders and suffered serious financial damage. White segregationists responded with intimidation: King's home was bombed, leaders received death threats, and many participants lost their jobs. Yet the boycott held. In November 1956, the United States Supreme Court ruled in Browder v. Gayle that segregation on Montgomery's buses was unconstitutional. On December 20, 1956, Montgomery's buses were officially desegregated, and the boycott ended in triumph.

    The significance of the Montgomery Bus Boycott extended far beyond the city itself. It demonstrated, perhaps for the first time on a national scale, that organized, sustained, nonviolent protest could force institutional change in the American South. It introduced Martin Luther King Jr. as a national leader and laid the groundwork for the broader civil rights movement of the 1960s, including the Greensboro lunch-counter sit-ins, the Freedom Rides, and ultimately the Civil Rights Act of 1964.

    Rosa Parks herself paid a steep personal price. She lost her job at a Montgomery department store and was unable to find steady work in Alabama. She and her husband eventually moved to Detroit, where she lived for the rest of her life. In her autobiography, published decades later, Parks pushed back gently against the popular image of her arrest as a single, isolated act of exhaustion. "I was not tired physically," she wrote. "The only tired I was, was tired of giving in." That sentence, more than any other, captures what the historical record shows: a deliberate act, by a trained organizer, that changed a nation.
  question_text: Based on the passage, why is it inaccurate to describe Rosa Parks's act as a 'spontaneous' protest?
  choice_a: She had planned in advance to be arrested on December 1, 1955.
  choice_b: She had been an organized civil rights activist for years before her arrest.
  choice_c: She refused to give up her seat because she was angry at the bus driver personally.
  choice_d: She had already given up her seat several times before that evening.
  correct_answer: B
  explanation: The passage devotes its second paragraph to Parks's background as a longtime NAACP member who had attended
    civil rights training. The argument is not that the December 1 arrest was preplanned (it wasn't), but that the act came
    from a trained organizer rather than a random tired passenger. That's why 'spontaneous' is misleading.
  distractors:
    A: distortion
    C: unsupported
    D: unsupported
