  passage_title: How Volcanoes Work
  passage_text: |-
    A volcano is an opening in Earth's surface through which molten rock, ash, and gases escape from deep underground. The molten rock is called magma when it remains beneath the surface and lava once it emerges into the open air. Lava can reach temperatures above 2,000 degrees Fahrenheit — hot enough to melt many of the metals humans use to build cars and buildings. Despite these extreme conditions, volcanoes are not random or chaotic features of the planet. Their locations follow clear geological patterns.

    Volcanoes form most often at the boundaries between tectonic plates — the enormous slabs of rock that make up Earth's outer shell. Where two plates collide, one is often forced downward into the hot mantle, where it begins to melt. The resulting magma is less dense than the surrounding rock, so it rises slowly upward, sometimes over thousands of years, until it bursts through the surface. A second type of volcano forms where plates pull apart, allowing magma to rise into the gap. A third type, called a hotspot volcano, forms over a stationary plume of hot material deep within Earth; as the plate above slowly drifts, a chain of volcanoes — like the Hawaiian Islands — is created.

    Not all volcanic eruptions look or behave the same way. Shield volcanoes, such as those that built the Hawaiian Islands, erupt relatively gently. Their lava is thin and fast-flowing, and it tends to travel long distances over the landscape rather than exploding upward. While such eruptions can destroy property, they rarely kill people, because the slow-moving lava gives residents time to evacuate. Stratovolcanoes, by contrast, are far more dangerous. Their lava is thick and traps gas under enormous pressure. When that pressure is released, the result is a violent explosion that can send ash, rock, and superheated gas miles into the atmosphere. The 1980 eruption of Mount St. Helens in Washington State destroyed more than 200 square miles of forest in a matter of minutes and killed 57 people. The 1815 eruption of Mount Tambora in Indonesia was even more devastating: it ejected so much ash into the atmosphere that global temperatures dropped, and the following year became known across the Northern Hemisphere as "the year without a summer," causing crop failures and famine thousands of miles from the volcano itself.

    Yet to think of volcanoes only as destroyers is to misunderstand them. Volcanic eruptions also create. The minerals released by lava, once weathered into soil, are extraordinarily fertile, which is why some of the most productive farmland in the world — the slopes of Mount Vesuvius in Italy, the highlands of Java, the foothills of Mount Kilimanjaro — sits in the shadow of active volcanoes. Entire islands, including the Hawaiian chain and Iceland, were built by repeated eruptions over millions of years. Even the air we breathe owes something to volcanoes: scientists believe that gases released by volcanic activity during Earth's early history helped form the planet's first atmosphere, setting the stage for the evolution of life itself.

    Living near a volcano, then, has always been a calculated risk. Farmers accept the danger of eruption in exchange for the richness of the soil. Coastal communities in Iceland accept periodic disruption in exchange for geothermal energy that heats their homes nearly for free. Modern volcanologists work to make this trade safer by monitoring tremors, gas emissions, and surface deformations that often precede eruptions by days or weeks. The science is far from perfect, but it has saved thousands of lives. Volcanoes will keep erupting — that much is certain. What has changed is humanity's growing ability to listen for the warning.
  question_text: According to the passage, what is the main difference between magma and lava?
  choice_a: Magma is found in shield volcanoes; lava is found in stratovolcanoes.
  choice_b: Magma is hotter than lava.
  choice_c: Magma is molten rock below the surface; lava is molten rock that has reached the surface.
  choice_d: Magma forms at plate boundaries; lava forms at hotspots.
