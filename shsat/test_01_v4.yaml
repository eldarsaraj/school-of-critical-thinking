  passage_title: The Paradox of Choice
  passage_text: |-
    In the closing decades of the twentieth century, the dominant assumption in Western consumer culture was that freedom of choice was intrinsically good. More options meant more freedom; more freedom meant more happiness. The expansion of choice was therefore not merely a feature of the market but a moral achievement — evidence of a society that trusted its citizens to know what they wanted.

    Psychologist Barry Schwartz challenged this assumption with what he called the 'paradox of choice.' Drawing on research in behavioral economics and cognitive psychology, Schwartz argued that beyond a certain threshold, additional choices do not increase satisfaction but actively undermine it. Faced with fifty varieties of yogurt, consumers leave the store less satisfied with their selection than they would have been had they chosen from five. The reason is twofold: first, evaluating large choice sets imposes a cognitive burden that drains mental energy; second, a greater range of options raises the standard against which any chosen option is measured, making it easier to imagine that a better option was left behind.

    Schwartz distinguished between two types of decision-makers. 'Maximizers' seek the objectively best option and therefore must evaluate all possibilities; they tend to experience high regret, because any unsatisfying outcome could theoretically have been avoided. 'Satisficers,' by contrast, choose the first option that meets a defined threshold of acceptability; they tend to report higher life satisfaction despite — or rather because of — their less exhaustive approach.

    The implications of this research challenge liberal individualism's most cherished assumption: that autonomy, in every domain, promotes well-being. Schwartz is careful not to advocate for authoritarianism — he does not suggest that choice should be removed. But he does propose that individuals can benefit from self-imposed constraints, and that social institutions might consider whether expanding options in every domain is, in fact, the kindest or most effective thing they can offer.
  question_text: According to Schwartz's research, why do consumers feel less satisfied after choosing from a large selection
    than a small one?
  choice_a: Because large selections take longer to browse, making shoppers tired and irritable
  choice_b: Because evaluating many options is mentally draining and raises expectations, making it easier to regret the choice
    made
  choice_c: Because large supermarkets are less personal and customers feel anonymous
  choice_d: Because shoppers who see many options assume the products are lower quality
  correct_answer: B
  explanation: 'The passage gives two reasons: ''evaluating large choice sets imposes a cognitive burden that drains mental
    energy'' and ''a greater range of options raises the standard against which any chosen option is measured, making it easier
    to imagine that a better option was left behind.'' Choice B accurately captures both mechanisms.'
  distractors:
    A: too_narrow
    C: unsupported
    D: unsupported
