  passage_title: The History of Public Libraries
  passage_text: (1) Public libraries have served communities for hundreds of years. (2) The first free public library in the
    United States opened in Peterborough, New Hampshire, in 1833. (3) Over time, the idea of a library open to everyone, regardless
    of wealth, spreaded across the country. (4) Businessman Andrew Carnegie donated money to build over 2,500 libraries worldwide.
    (5) Today, libraries offer far more than books, they provide internet access, community programs, and spaces for quiet
    study.
  question_text: |-
    Which revision of sentence 3 uses the correct verb form?

    (3) Over time, the idea of a library open to everyone, regardless of wealth, spreaded across the country.
  choice_a: No change is needed.
  choice_b: Change 'spreaded' to 'spread'
  choice_c: Change 'spreaded' to 'has spread'
  choice_d: Change 'spreaded' to 'was spreading'
  correct_answer: B
  explanation: '''Spread'' is an irregular verb; its past tense is ''spread,'' not ''spreaded.'' The sentence describes a
    completed historical process, so the simple past ''spread'' is correct.'
  distractors:
    A: wrong_fix
    C: wrong_fix
    D: wrong_fix
