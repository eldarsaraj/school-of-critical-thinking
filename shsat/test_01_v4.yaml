  passage_title: 'The Deep Ocean: Earth''s Final Frontier'
  passage_text: |-
    The deep ocean remains one of the least explored places on Earth. Scientists estimate that more than eighty percent of the ocean floor has never been mapped, observed, or studied. This vast darkness lies below the sunlit zone, where photosynthesis is impossible and pressure reaches crushing extremes.

    Despite these harsh conditions, life thrives in the deep sea. Creatures such as the anglerfish, giant squid, and bioluminescent jellyfish have evolved remarkable adaptations. The anglerfish, for instance, dangles a glowing lure above its mouth to attract prey in the pitch-black water. Many deep-sea organisms produce their own light through a chemical process called bioluminescence, which serves purposes ranging from attracting mates to confusing predators.

    Exploration of the deep sea has historically been limited by technology and cost. Early researchers lowered instruments by rope, receiving only indirect data about conditions far below. The development of remotely operated vehicles, or ROVs, transformed the field. These underwater robots can withstand pressures that would instantly crush a human diver, and they relay live video to scientists at the surface.

    Recent ROV expeditions have turned up startling discoveries. Entire ecosystems cluster around hydrothermal vents — cracks in the ocean floor that release superheated, mineral-rich water. Bacteria that convert chemicals, not sunlight, into energy form the base of these food chains. This process, called chemosynthesis, was unknown to science until 1977. Its discovery forced scientists to reconsider the basic requirements for life — a question with implications that stretch far beyond Earth's oceans.
  question_text: According to the passage, what percentage of the ocean floor has never been mapped, observed, or studied?
  choice_a: More than fifty percent
  choice_b: More than sixty percent
  choice_c: More than eighty percent
  choice_d: One hundred percent
  correct_answer: C
  explanation: 'The passage states explicitly in the first paragraph: ''Scientists estimate that more than eighty percent
    of the ocean floor has never been mapped, observed, or studied.'''
  distractors:
    A: misidentified_detail
    B: misidentified_detail
    D: extreme_language
