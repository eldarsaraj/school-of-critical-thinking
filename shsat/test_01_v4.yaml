  passage_title: The Clockmaker's Daughter
  passage_text: |-
    Maya had spent every Saturday of her childhood in her grandfather's clock shop. The smell of machine oil and cedar shavings was, to her, the smell of safety. She knew every clock by name — not the manufacturer's name stamped on the face, but the names she and her grandfather had given them: Grumbling Gerald, Miss Ticksworth, the Colonel.

    When her grandfather died and left the shop to her, Maya's friends assumed she would sell it. The building was valuable; the neighborhood had transformed around it. Sleek coffee shops and fitness studios had replaced the hardware stores and tailors of her grandfather's time. The clock shop looked like a missing tooth in a polished smile.

    But Maya could not bring herself to sell. Each morning she opened the shop at eight, wound the clocks that needed winding, and waited for customers who rarely came. She told herself she was honoring her grandfather's memory. But on an afternoon in late October, a girl of perhaps ten came in alone and stood still in the center of the room, eyes wide, listening to the layered ticking as though she had never heard anything so astonishing.

    'They all say different things,' the girl said.

    'Yes,' Maya said, surprised. 'They do.'

    That evening Maya sat behind the counter long after she should have locked up. She was thinking about what it meant to keep something alive — not preserved, the way a museum keeps things, but alive the way her grandfather had kept it: open to the world, waiting for the right ear to hear it.
  question_text: According to the passage, why do Maya's friends expect her to sell the shop?
  choice_a: Because they know she has always disliked clocks
  choice_b: Because the building is valuable and the neighborhood has changed
  choice_c: Because her grandfather's will requires her to consider selling
  choice_d: Because the shop is losing money and she cannot afford to keep it
  correct_answer: B
  explanation: 'The passage states: ''The building was valuable; the neighborhood had transformed around it.'' This explains
    why her friends assumed she would sell — the financial opportunity was obvious.'
  distractors:
    A: opposite
    C: unsupported
    D: unsupported
