  passage_title: 'The Great Migration: A Turning Point in American History'
  passage_text: |-
    Between 1910 and 1970, approximately six million African Americans left the rural South and relocated to cities in the North, Midwest, and West. Historians call this movement the Great Migration. It was one of the largest demographic shifts in United States history and transformed both the regions people left and the cities they moved to.

    The causes of the migration were intertwined. In the South, sharecropping kept Black farmers in cycles of debt, and Jim Crow laws enforced racial segregation in every aspect of daily life. Lynching and other racial violence occurred with terrifying frequency. At the same time, World War I created labor shortages in Northern factories, and recruiters from companies like the Pennsylvania Railroad traveled South to offer jobs.

    Migrants arrived in cities such as Chicago, Detroit, New York, and Pittsburgh and built vibrant communities. Harlem in New York City became a cultural capital, giving rise to the Harlem Renaissance — a flowering of African American literature, music, and art that produced figures such as Langston Hughes, Zora Neale Hurston, and Duke Ellington. Black-owned businesses, newspapers, and civic organizations multiplied.

    But the North was not a promised land free of racism. Migrants faced housing discrimination, confined to overcrowded neighborhoods through a practice called redlining. They encountered hostility from white workers who feared job competition, and race riots broke out in cities including Chicago in 1919. Despite these obstacles, the Great Migration fundamentally reshaped American culture, politics, and music — an influence felt clearly in jazz, blues, gospel, and later, rock and roll.
  question_text: According to the passage, approximately how many African Americans participated in the Great Migration?
  choice_a: Two million
  choice_b: Four million
  choice_c: Six million
  choice_d: Ten million
  correct_answer: C
  explanation: 'The passage states in the first sentence: ''approximately six million African Americans left the rural South
    and relocated to cities in the North, Midwest, and West.'''
  distractors:
    A: misidentified_detail
    B: misidentified_detail
    D: misidentified_detail
