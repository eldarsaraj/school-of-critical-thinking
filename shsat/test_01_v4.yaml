  passage_title: Should Students Have Smartphones in School? — Two Views
  passage_text: |-
    Passage A: The Case for Allowing Smartphones

    Smartphones are not distractions — they are tools. A student who knows how to search effectively, evaluate sources, and organize information on a device is practicing exactly the skills the modern workforce demands. Banning phones from classrooms treats technology as an enemy rather than recognizing that learning to use it wisely is itself an education. Teachers who integrate smartphones into lessons report higher engagement. When students photograph notes, set reminders, or use educational apps, they are not cheating the learning process — they are extending it.

    Passage B: The Case for Restricting Smartphones

    The research is clear: the mere presence of a smartphone on a desk — even face down and silent — measurably reduces cognitive capacity and working memory. Students who believe they can multitask between social media and a math lesson are mistaken; the human brain does not multitask, it task-switches, and each switch carries a cost. Schools are one of the few places in modern life where sustained attention is still taught and practiced. Removing that environment by permitting phones surrenders one of education's most valuable gifts.
  question_text: According to Passage A, what is one reason teachers support allowing smartphones in class?
  choice_a: Smartphones help students avoid boredom during long lectures.
  choice_b: Teachers report higher engagement when smartphones are integrated into lessons.
  choice_c: Smartphones allow students to communicate with parents during emergencies.
  choice_d: Phones reduce the cost of buying traditional school supplies.
  correct_answer: B
  explanation: 'Passage A states: ''Teachers who integrate smartphones into lessons report higher engagement.'' This is a
    direct statement supporting the claim.'
  distractors:
    A: unsupported
    C: unsupported
    D: unsupported
