  question_text: In a music library, the ratio of pop songs to rock songs is 3 to
    4, and the ratio of rock songs to jazz songs is 2 to 5. If there are 40 jazz songs,
    how many pop songs are in the library?
  choice_a: '12'
  choice_b: '16'
  choice_c: '24'
  choice_d: '30'
  correct_answer: A
  explanation: 'The two ratios share "rock," but they describe rock with different
    numbers (4 in the first, 2 in the second), so make them agree first. Multiply
    the second ratio by 2: rock to jazz becomes 4 to 10. Now all three link up as
    pop : rock : jazz = 3 : 4 : 10. Since 40 jazz songs correspond to the 10 in the
    ratio, each part is 40 ÷ 10 = 4, so pop songs = 3 × 4 = 12. (Two-step check: 40
    jazz × 2⁄5 = 16 rock, then 16 rock × 3⁄4 = 12 pop.) Choice B, 16, stops at the
    number of rock songs without the final step to pop. Choice D, 30, applies the
    pop-to-rock ratio (3⁄4) straight to the 40 jazz songs, skipping the connection
    through rock. Choice C, 24, mixes the ratios into a wrong pop-to-jazz relationship
    of 3 to 5. The key is aligning the shared "rock" count before scaling.'
  distractor_types:
    B: partial_answer
    C: wrong_setup
    D: wrong_setup
