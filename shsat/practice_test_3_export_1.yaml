  question_text: Daniel reflects that he had known about his mother's separate existence
    "in the way one knows that the far side of the moon exists without ever troubling
    to picture it." This comparison mainly serves to
  choice_a: stress how remote and unreachable his mother has suddenly come to feel
    to him
  choice_b: convey that he has known only one side of his mother while her other side
    stayed hidden
  choice_c: suggest that certain truths about a person can never be known by anyone
    at all
  choice_d: mark the difference between holding a fact in the abstract and actually
    picturing it
  correct_answer: D
  explanation: 'The comparison is completed by the line that follows it: "But he had
    never pictured it." That contrast is the whole point — Daniel had always known,
    in a distant, unexamined way, that his mother had a life of her own, exactly as
    everyone "knows" the moon has a far side without ever stopping to imagine it.
    What changes tonight is not the fact but his sudden ability to picture it. D names
    that difference between abstract knowing and vivid realizing. B is the closest
    trap: it reads "far side" as a hidden half of her personality, which sounds reasonable,
    but the passage''s emphasis falls on knowing-without-picturing, not on a concealed
    side — the sentence right after makes imagining the issue, not hiddenness. A treats
    the astronomical image as a measure of emotional distance, how far away she feels,
    when the comparison is really about a kind of knowledge. C stretches it into a
    claim that such truths are unknowable to anyone, but the far side of the moon
    can perfectly well be pictured; the point is only that Daniel never had, not that
    it lies beyond all reach. Only D captures what the comparison is doing.'
  distractor_types:
    A: wrong_concept
    B: partly_true_but_wrong
    C: inference_leap
