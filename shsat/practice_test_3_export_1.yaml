  question_text: It can be inferred from the passage that counting touches allows
    the flytrap to respond correctly to prey because
  choice_a: the plant gradually learns, from many past captures, which insects are
    worth the effort to digest
  choice_b: a struggling insect presses the trigger hairs harder than wind or rain
    can, and the trap responds to that greater force
  choice_c: the brief delay before closing gives the plant time to identify the insect
    and judge whether it is worth trapping
  choice_d: the repeated contact of a living insect reliably sets it apart from a
    one-time gust or drop, so the plant has no need to sense what has actually touched
    it
  correct_answer: D
