    = 3w. Sunday is 2 times Saturday, so Sunday = 2 × 3w = 6w. Saturday and Sunday
    together are 3w + 6w = 9w, and that equals 27,000, so w = 27,000 ÷ 9 = 3,000.
    Since Tuesday is a typical weekday, it''s expected to sell w = 3,000 tickets.
    (Check: Saturday = 9,000, Sunday = 18,000, totaling 27,000.) Choice D, 9,000,
    is Saturday''s total, not the weekday''s. Choice C, 5,400, comes from reading
    "2 times Saturday" as "2 times a weekday," which would make Sunday 2w and the
    total 5w = 27,000. Choice B, 4,500, uses 27,000 ÷ 6, multiplying the two ratio
