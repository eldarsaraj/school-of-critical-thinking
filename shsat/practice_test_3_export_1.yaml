  question_text: Which statement best describes the central idea of the passage?
  choice_a: The seemingly simple act of observing is shot through with judgment and
    expectation, and whether it can ever be cleanly separated from theory is a genuinely
    open question.
  choice_b: The numbers a scientist writes down are never perfectly exact, so a measurement
    must be repeated many times before its real result can be trusted.
  choice_c: Because every observation a scientist makes is inevitably colored by her
    own expectations and prior beliefs, science cannot truly uncover any objective
    facts about the world, and its conclusions turn out to be little more than a matter
    of personal opinion.
  choice_d: A trained expert and an untrained newcomer, looking at the very same image
    such as a medical X-ray, will often notice completely different things.
  correct_answer: A
  explanation: 'The passage opens by describing the comfortable belief that science
    is "just looking," then spends the rest of its length complicating it — data isn''t
    the phenomenon and must be reasoned toward (the Millikan drops), what we notice
    is shaped by what we expect (the X-ray, the theory-built instruments), and thoughtful
    people still disagree about whether truly neutral observation is even possible.
    A pulls all of that together, which is what a central-idea answer must do. B captures
    only the first strand — that measurements scatter and must be repeated — and stops
    there, missing the deeper point about expectation and the unresolved debate; it''s
    true but too small. D does the same with a single example, the X-ray, mistaking
    one illustration for the whole argument. C is the most tempting trap because it
    echoes a real claim the passage makes — that observation is colored by expectation
    — but then races to a conclusion the passage openly rejects: the final paragraph
    insists that this does not mean "the world is simply whatever we wish it to be,
    or that patient observation is worthless." Turning a caution about the difficulty
    of observing into the sweeping verdict that science finds no facts and trades
    only in opinion overshoots the passage entirely.'
  distractor_types:
    B: too_narrow
    C: partly_true_but_wrong
    D: too_narrow
- section: ELA
  stage: hard_module
  question_number: 1
  question_type: multiple_choice
  skill: usage_agreement
  difficulty: hard
  topic: ''
  passage_group_id: ela_h_re
  passage_title: The Crossing That Never Says Stop
  passage_text: '(1) For most of the past century, the standard way to tame a dangerous
    intersection was to hang a traffic light above it and let the colors take turns.
    (2) A roundabout does the opposite, it strips out the signals entirely and keeps
    every car moving, slowly and without pause, around a central island. (3) At first
    the idea sounds reckless. (4) How could removing the very lights that impose order
    possibly make a crossing safer? (5) The answer has less to do with traffic than
    with geometry. (6) At an ordinary intersection, cars meet head-on or at right
    angles, and a driver who runs a red can strike another broadside at full speed,
    in the deadliest way two cars can meet. (7) A roundabout abolishes those angles.
    (8) Every car enters by curving in the same direction, so a collision, on the
    rare occasions one happens at all, becomes a slow scrape rather than a violent
    broadside. (9) Forced to slow down and yield before merging, the most dangerous
    crashes simply have no way to occur. (10) One large review concluded that a well-designed
    roundabout is safer than any intersection in the country. (11) Before the first
    modern roundabouts appeared, plenty of engineers distrusted them, but once the
    crash figures arrive, most of that doubt quietly dissolved. (12) A driver nearing
    the circle has to give way. (13) A driver nearing the circle must find a gap in
    the moving traffic. (14) The earliest electric traffic light, as it happens, was
    installed in 1914 and controlled only two directions. (15) Where the old intersections
    dared drivers to beat the light, the roundabout offers nothing to beat: no signal
    to outrun, only a gap to wait for. (16) The safest crossing ever devised, it seems,
    may be the one that never once tells a driver to stop.'
  question_text: Which revision of sentence 10 corrects the illogical comparison?
  choice_a: One large review concluded that a well-designed roundabout is safer than
    any other intersection in the country.
  choice_b: One large review concluded that a well-designed roundabout is safer than
    any intersection in the country is.
  choice_c: One large review concluded that a well-designed roundabout is the safest
    intersection in the country.
  choice_d: One large review concluded that a well-designed roundabout is safer than
    any other intersections in the country.
  correct_answer: A
  explanation: 'The sentence compares a roundabout with "any intersection in the country"
    — but a roundabout is itself one of the intersections in the country, so, taken
    literally, the sentence claims the roundabout is safer than itself. The repair
    is the single word "other," which lifts the roundabout out of the group it is
    being measured against; that is A. B only tacks "is" onto the end. That smooths
    the grammar of the comparison but does nothing about the real problem: the roundabout
    is still counted among the very intersections it is said to beat, so the impossible
    self-comparison survives. C sidesteps the comparison by turning it into a superlative
    — "the safest intersection" — which is a stronger and different claim than "safer
    than the others," and not the one the sentence sets out to make. D adds the needed
    "other" but then pairs the singular "any" with the plural "intersections"; "any"
    must take a singular noun here, so it has to be "any other intersection." Only
    A corrects the comparison and adds no new fault.'
  distractor_types:
    B: partly_true_but_wrong
    C: changes_meaning
    D: introduces_new_error
