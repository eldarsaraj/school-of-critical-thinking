    49 ends in 9, 7³ = 343 ends in 3, 7⁴ = 2,401 ends in 1 — and then it starts over
    (7⁵ ends in 7 again). So the cycle of last digits is 7, 9, 3, 1, repeating every
    4 powers. To find where 7²² lands, divide the exponent by 4: 22 ÷ 4 = 5 remainder
    2. A remainder of 2 points to the second digit in the cycle, which is 9. Choice
    C, 7, is the first digit in the cycle (the units digit of 7¹), the answer you''d
    get from a remainder of 1. Choice B, 3, is the third position, and choice A, 1,
