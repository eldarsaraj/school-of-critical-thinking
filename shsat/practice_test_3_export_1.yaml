    B: wrong_concept
    C: partly_true_but_wrong
- section: ELA
  stage: hard_module
  question_number: 20
  question_type: multiple_choice
  skill: authors_craft
  difficulty: hard
  topic: ''
  passage_group_id: ela_h_p2
  passage_title: The Hour Before
  passage_text: "Daniel woke while the house was still black and did not know why.\
    \ There had been no dream, no noise; he was simply, all at once, awake, in the\
    \ flat and complete way that sometimes happens before dawn and never happens later\
    \ in the day. He lay and listened. The furnace was not running. The street outside\
    \ made no sound at all. After a while, for no reason he could have named, he got\
    \ up and went down the stairs, keeping to the outer edges where the wood did not\
    \ creak, the way he had taught himself to do years ago and had somehow never stopped\
    \ doing, even now that no rule at home required it of him.\r\n\r\nThe kitchen\
    \ light was on — not the bright one overhead but the small bulb above the stove,\
    \ which laid a low pool of amber across the counter and left the corners of the\
    \ room in shadow. His mother was standing in it. She had her back half turned\
    \ to him and did not hear him stop on the bottom stair, and so for a moment, for\
    \ what turned out to be a surprisingly long moment, she went on being a person\
    \ who believed herself to be alone. She was eating cake. There was a plate on\
    \ the counter with a cut wedge of the birthday cake from two nights before, and\
    \ she was eating it not with a fork but with her fingers, in small quick pieces,\
    \ gazing at nothing, and there was on her face an expression that Daniel had never\
    \ seen there in his life and could not begin to read.\r\n\r\nHe should have said\
    \ something. On any ordinary day he would have — Mom? — and she would have turned\
    \ and become herself again, would have said his name and asked what on earth he\
    \ was doing awake, and the familiar machinery of the morning would have started\
    \ running hours too early. But he said nothing. He stood on the stair and watched\
    \ his mother eat cake with her fingers in the amber light, and the thing that\
    \ held his voice was neither politeness nor fear. It was a kind of astonishment.\
    \ It had never once occurred to him, in the entire course of his life, that his\
    \ mother was in the room when he was not there to see her in it.\r\n\r\nHe had\
    \ known it, of course, in the way one knows that the far side of the moon exists\
    \ without ever troubling to picture it. But he had never pictured it. He had never\
    \ imagined the house at four in the morning with only his mother awake inside\
    \ it, nor the particular way she might choose to stand, nor what her face might\
    \ do when there was no one present for whom it needed arranging. She had an entire\
    \ life that took place in the rooms he happened not to be in, running on all the\
    \ while, like a second story unfolding quietly in a book behind the one he thought\
    \ he was reading — and she had been living it, apparently, for as long as he had\
    \ been alive, without his ever once suspecting a thing. The woman beside the stove\
    \ was his mother. She was also, he saw now, someone he had never met.\r\n\r\n\
    She finished the last piece and stood for a while with her fingers resting on\
    \ the rim of the empty plate, as though she had forgotten it was under her hand.\
    \ Then she did a small thing that he would turn over in his mind for a long time\
    \ afterward without ever arriving at what it meant: she reached up and laid the\
    \ flat of her palm against the dark window above the sink, and held it there,\
    \ open against the glass and the black yard beyond it, for the space of three\
    \ or four slow breaths. Daniel could not have said what it was for. He was not\
    \ certain it was for anything that could be put into words. He turned and climbed\
    \ back up the stairs, edges only, and got into his cold bed, and lay there while\
    \ the window in his own room turned slowly from black to gray.\r\n\r\nAt breakfast\
    \ she was his mother again, wholly and without remainder. She poured the cereal\
    \ and located the missing shoe and reminded him twice to take a jacket, and she\
    \ did not look in the least like a woman who had stood alone in the dark with\
    \ her hand pressed to a window; she looked like someone who had slept the night\
    \ through. Daniel ate and watched her cross back and forth across the kitchen\
    \ and said not one word about any of it. He understood, though he could not have\
    \ explained it to anyone, that he had been handed something he had not earned\
    \ and could not give back — a look behind the ordinary face of the person he knew\
    \ better than anyone on earth, and with it the proof that even she was mostly\
    \ hidden from him, that everyone was, that the people we love most go on existing,\
    \ hour after hour, in rooms we are never going to enter. It did not make him love\
    \ her less. If anything it was the reverse, though the feeling was too new for\
    \ him to have any name ready for it. It felt a little like grief and a little\
    \ like awe, and it settled somewhere beneath everything else and stayed there,\
    \ all through that gray and perfectly ordinary day."
  question_text: Daniel watches his mother press her palm to the dark window but "could
    not have said what it was for," and the passage never explains the gesture. This
    refusal to explain it chiefly serves to
  choice_a: place her inner life finally beyond his reach, so that the reader, like
    Daniel, is denied the meaning behind what she does
  choice_b: hint that she is grieving something in private that the rest of the household
    knows nothing about
  choice_c: signal that a later moment in the story will reveal what the gesture was
    meant to express
  choice_d: show that she has quietly sensed her son on the stairs and is making a
    sign to him
  correct_answer: A
  explanation: 'The whole passage has been building toward the idea that the mother
    is a separate, hidden person, and this gesture is where that idea is sealed. By
    showing Daniel an action he cannot interpret — and by declining to interpret it
    for the reader either ("not certain it was for anything that could be put into
    words") — the passage puts her meaning permanently out of reach. We are left exactly
    where Daniel is left: certain we have seen something private, unable to say what.
    That shared exclusion is the point, so A is correct. B assigns the gesture a definite
    feeling, grief, that the text pointedly withholds; the power of the moment lies
    in its refusing any such label. C treats the withheld meaning as a setup for a
    later payoff, but the story never returns to explain it — the not-knowing is permanent,
    not suspense to be resolved. D reverses the situation entirely: the passage stresses
    that she "did not hear him" and "believed herself to be alone," so reading the
    gesture as a signal to Daniel undoes the very privacy the scene depends on. Only
    A recognizes that leaving the gesture undecoded is what makes her unknowable.'
  distractor_types:
    B: misidentified_detail
    C: inference_leap
    D: wrong_concept
