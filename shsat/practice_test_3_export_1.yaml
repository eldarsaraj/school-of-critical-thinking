  question_text: The least positive integer that is evenly divisible by each of the
    first 7 positive integers (1 through 7) is 420. What is the least positive integer
    that is evenly divisible by each of the first 9 positive integers (1 through 9)?
  choice_a: 30,240
  choice_b: 3,780
  choice_c: 2,520
  choice_d: '840'
  correct_answer: C
  explanation: 'Since 420 is already evenly divisible by 1 through 7, the only new
    requirements are to also make it divisible by 8 and by 9 — and we want to multiply
    by as little as possible. Start with 8. Is 420 divisible by 8? No: 420 ÷ 8 = 52.5.
    The number 8 is 2 × 2 × 2, but 420 contains only two 2s (420 = 4 × 105), so it''s
    short one factor of 2. Multiply by 2: 420 × 2 = 840, and now 840 ÷ 8 = 105. ✓
    Now 9. Is 840 divisible by 9? No: 840 ÷ 9 = 93.3. The number 9 is 3 × 3, but 840
    contains only one 3 (840 = 3 × 280), so it''s short one factor of 3. Multiply
    by 3: 840 × 3 = 2,520, and now 2,520 ÷ 9 = 280. ✓ So the least number is 2,520.
    Choice D, 840, fixes only the divisibility by 8 and forgets 9. Choice B, 3,780,
    multiplies 420 by a full 9, double-counting the factor of 3 that 420 already has
    (and it still isn''t divisible by 8). Choice A, 30,240, multiplies by a full 8
    and a full 9, far more than needed. You only multiply in the factors that are
    actually missing.'
