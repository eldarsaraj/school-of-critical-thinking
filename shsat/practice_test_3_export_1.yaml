  choice_b: Sentence 9
  choice_c: Sentence 10
  choice_d: Sentence 12
  correct_answer: C
  explanation: The passage traces how the escalator went from an amusement-park novelty
    to a practical machine that reshaped stores and the buildings around them. Sentence
    10 — that the stores' pastries were freshly baked each morning — says nothing
    about the escalator and drifts onto the stores' food instead, so it's the one
    to cut. The trap is that the other three can each feel skippable. Sentence 4 (riders
    paying a fee for the ride) looks like mere color, but it's the evidence that the
    first machines were built to entertain, which is the passage's opening point.
    Sentence 9 (nervous shoppers and the attendants who helped them) reads like a
    side anecdote, yet it shows how stores coaxed customers onto the new machine —
    part of the adoption story. Sentence 12 (architects designing wide central courts)
    directly develops the idea that the escalator reshaped buildings. Cutting any
    of those three would remove a real link in the argument; cutting sentence 10 removes
    only a digression.
