  correct_answer: D
  explanation: 'First recover the first cube''s edge. A cube has 6 equal square faces,
    so 6 × (edge)² = 96, giving (edge)² = 16 and edge = 4 cm. The second cube''s edge
    is twice that, 8 cm, so its volume is 8³ = 512 cubic centimeters. The deeper idea:
    doubling every edge multiplies the volume by 2³ = 8 (the first cube''s volume
    is 4³ = 64, and 64 × 8 = 512). Choice A, 64, is the first cube''s volume, forgetting
