  question_text: The mean weight of 6 parcels is 20 kilograms. One parcel that weighs
    10 kilograms is removed from the group. What is the mean weight of the 5 remaining
    parcels?
  choice_a: '10'
  choice_b: '20'
  choice_c: '22'
  choice_d: '26'
  correct_answer: C
  explanation: 'Means must be handled through totals. The 6 parcels together weigh
    6 × 20 = 120 kilograms. Removing the 10-kilogram parcel leaves 120 − 10 = 110
    kilograms spread over 5 parcels, so the new mean is 110 ÷ 5 = 22 kilograms. It
    makes sense that the mean rose: the removed parcel (10 kg) was lighter than the
    average, so taking it out pulls the average up. Choice B, 20, assumes removing
    a parcel leaves the mean unchanged. Choice A, 10, subtracts the removed weight
    straight from the mean (20 − 10). Choice D, 26, adds the 10 kilograms back into
    the total instead of removing it, then divides by 5. The reliable method is to
    adjust the total first, then divide by the new count.'
