  question_text: The passage most strongly suggests that the escape of the very smallest
    insects is
  choice_a: a minor flaw in a trap that is otherwise highly effective at holding its
    prey.
  choice_b: consistent with the same weighing of cost against reward that governs
    the rest of the trap's behavior.
  choice_c: evidence that the spines are spaced too far apart to work the way the
    passage describes.
  choice_d: the main reason the flytrap is forced to capture so many insects in order
    to survive.
  correct_answer: B
  explanation: 'This question asks the reader to connect one detail to the logic running
    through the whole passage. Again and again, the flytrap is shown weighing energy
    spent against energy gained: it ignores a single touch so it won''t waste a snap
    on a raindrop, it releases digestive fluid only in proportion to how much it has
    caught, and each closing is called "a wager the plant cannot afford to lose for
    nothing." When the passage says the smallest insects escape but adds that this
    is "no great loss," because such a morsel "would scarcely repay the cost of a
    meal," it is applying that very same cost-and-reward thinking — so B is the inference
    that fits. A is the intuitive trap: it''s true the trap is effective, but the
    passage never treats the escape as a defect; it presents it as the sensible result
    of not bothering with prey that isn''t worth the effort. C turns the detail into
    a contradiction of the text — the spacing isn''t a malfunction, it''s part of
    a design the passage admires. D leaps far beyond anything stated: the passage
    never claims the plant must catch large numbers of insects, nor that escapes are
    what drive such a need.'
