  question_text: "Read this sentence.\r\n\r\n\"The new engine's design made it clear\
    \ that the company valued fuel efficiency more than its competitors.\"\r\n\r\n\
    Which revision corrects the error in the sentence?"
  choice_a: The new engine's design made it clear that the company valued fuel efficiency
    more than their competitors.
  choice_b: The new engine's design made it clear that the company valued fuel efficiency
    more than its competitors did.
  choice_c: The new engine's design made it clear that the company valued fuel efficiency
    more than its competitors valued efficiency more.
  choice_d: The new engine's design made it clear that, more than its competitors,
    the company valued fuel efficiency.
  correct_answer: B
  explanation: As written, the sentence can be read two ways, and both are grammatical.
    It could mean the company valued fuel efficiency more than it valued its competitors
    — as if efficiency and rival firms were two things the company liked in different
    amounts — or it could mean the company valued efficiency more than its competitors
    did. The intended sense is the second, a comparison between what the company valued
    and what its competitors valued, and the sentence leaves that comparison unfinished.
    B completes it with the small but decisive word "did," which makes plain that
    the two sides being compared are the company and its competitors. A changes "its"
    to "their," which disagrees with the singular "company" and does nothing about
    the unfinished comparison. C tries to spell the comparison out but collapses into
    a garbled repetition ("valued efficiency more"), an error worse than the original.
    D reshuffles the sentence so that "more than its competitors" now sits beside
    "the company," which makes it sound as though the company itself — rather than
    how much it valued efficiency — is what exceeds the competitors, a different and
    still-muddled meaning. Only B closes the comparison cleanly.
  distractor_types:
    A: introduces_new_error
    C: introduces_new_error
    D: misattributed_error_location
