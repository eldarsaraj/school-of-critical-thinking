  question_text: Based on the passage, which statement about what we see when we look
    at the night sky must be true?
  choice_a: No portion of the night sky we observe can show us the universe as it
    exists at the present moment.
  choice_b: The stars we see are the closest ones, since only nearby light is quick
    enough to reach us intact.
  choice_c: The dark gaps we see are regions where stars once shone but have since
    burned out entirely.
  choice_d: A more powerful eye could take in the whole of the universe, right out
    to its farthest stars.
  correct_answer: A
  explanation: 'The passage establishes that light takes time to cross distance, so
    "when you look up at a star you do not see the star as it is now but only as it
    once was, at the moment its light first set out." If that holds for one star,
    it holds for every point of light in the sky: each arrives carrying an older image,
    none showing its source as it stands today. So nothing in the observed sky is
    a picture of the present — which is A. B misreads the finite speed of light as
    a filter that admits only nearby stars; the passage says light from far stars
    is not blocked or degraded but simply still in transit, so the stars we do see
    aren''t the near ones by virtue of speed — their light has merely had enough time
    to arrive. C treats the dark gaps as burned-out ruins, but the passage explains
    those gaps as places from which light "has not yet had the time to reach us,"
    light still on its way rather than light extinguished. D runs directly against
    the passage: because the universe is young, we can see "only so far out into space
    as light has yet contrived to reach us," a limit no sharper eye can pass, since
    the missing light has not arrived for any instrument to gather. Only A follows
    from the finite speed of light as the passage uses it.'
  distractor_types:
    B: wrong_concept
    C: inference_leap
    D: opposite
