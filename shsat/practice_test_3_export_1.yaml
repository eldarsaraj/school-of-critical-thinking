  question_text: The passage most strongly suggests that when a scientist observes
    the world through a microscope or telescope, she is
  choice_a: escaping her personal opinions at last and seeing the world exactly as
    it truly is
  choice_b: still relying on theory even as she looks, because the instrument itself
    was built on it
  choice_c: free of her own biases, though still limited by how sharp the instrument
    happens to be
  choice_d: unable to trust anything the instrument reveals, since the ideas behind
    it might be wrong
  correct_answer: B
  explanation: 'The passage says the instruments scientists trust "were dreamed up
    and built according to theories about how light and matter behave," and then draws
    the conclusion directly: peering through a microscope is "to look straight through"
    one''s ideas, not to leave them behind. The reader is meant to infer that reaching
    for an instrument doesn''t escape theory — the theory is baked into the tool itself.
    That''s B. A states the reverse of the passage''s whole point: the instrument
    doesn''t deliver a pure, opinion-free view; it carries assumptions along with
    it. C is the closest trap because it sounds reasonable, but it swaps the real
    issue for a lesser one — it treats the only remaining limit as the instrument''s
    sharpness, when the passage is making a deeper claim about the theory built into
    the device, not its resolution. D pushes far past what the text supports: the
    passage never says instrument readings can''t be trusted — elsewhere it grants
    that "careful measurement does carry us nearer" the truth — only that such readings
    aren''t free of theory.'
