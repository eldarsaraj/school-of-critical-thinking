  passage_title: The Trouble with Just Looking
  passage_text: "In a basement laboratory at the University of Chicago, a little over\
    \ a hundred years ago, a physicist named Robert Millikan spent his evenings staring\
    \ at falling drops of oil. Through the eyepiece of a small brass microscope, the\
    \ drops appeared as tiny points of light, drifting downward through a sliver of\
    \ air between two metal plates. By switching on an electric charge, Millikan could\
    \ halt a drop in midair, hold it trembling in place, and then let it fall again\
    \ — and from that delicate tug-of-war between gravity and electricity he hoped\
    \ to weigh something no one had ever weighed: the charge carried by a single particle\
    \ far too small to see. He measured one drop, then another, then hundreds more.\
    \ And here was the trouble. Almost every drop handed him a slightly different\
    \ number.\r\n\r\nThis is not what most of us imagine measurement to look like.\
    \ We picture a fact, if it is really a fact, as something that simply sits in\
    \ the world waiting to be read off, the way one reads the time from a clock. But\
    \ Millikan's notebook held no such fact. It held a scatter — a cloud of close\
    \ but quarreling numbers, no two exactly alike, each one nudged off course by\
    \ some small disturbance: a faint current of warm air, a stray speck of dust,\
    \ the unsteadiness of his own eye at the lens. The quantity he was truly chasing\
    \ appeared nowhere in that cloud. To find it, he had to study the whole untidy\
    \ collection, set aside the drops that had plainly misbehaved, and reason his\
    \ way toward the steady value he believed lay hidden underneath.\r\n\r\nPhilosophers\
    \ of science have a useful pair of words for the gap Millikan was crossing. On\
    \ one side sits the data — the actual marks a scientist collects: the wavering\
    \ numbers, the smudges on a photographic plate, the jagged line a machine scratches\
    \ onto a roll of paper. On the other side sits the phenomenon — the real, stable\
    \ feature of the world that the data is meant to reveal. The two are not the same,\
    \ and they are remarkably easy to confuse. Data is particular, messy, and shot\
    \ through with the fingerprints of whatever instrument produced it. A phenomenon\
    \ is the orderly thing we infer must lie behind the mess. No telescope ever shows\
    \ us \"a planet's orbit\"; it shows us a scattering of faint dots, from which\
    \ the orbit has to be reconstructed. The data is what we have; the phenomenon\
    \ is what we want; and the road between the two is paved, at every step, with\
    \ judgment.\r\n\r\nIf that were the whole story, it would be troubling enough.\
    \ But a second difficulty waits beneath it, and this one reaches all the way down\
    \ into the act of looking itself. Hand the same chest X-ray to a trained physician\
    \ and to someone who has never seen one, and the two will not see the same thing.\
    \ Where the newcomer finds a meaningless fog of gray, the doctor sees a cracked\
    \ rib as plainly as a word on this page. Both are staring at the very same picture;\
    \ the difference lies entirely in what each one brings to it. And this, it turns\
    \ out, is true of all looking. To notice anything at all, an observer must already\
    \ carry some idea of what is worth noticing and what may be safely ignored — some\
    \ faint expectation of what she is likely to find. Even the instruments scientists\
    \ trust were dreamed up and built according to theories about how light and matter\
    \ behave. To peer through a microscope is not to leave one's ideas behind; it\
    \ is, in a sense, to look straight through them.\r\n\r\nWhat follows from all\
    \ this is a question that has divided thoughtful people for a very long time.\
    \ To some, it amounts to a caution rather than a catastrophe. Observation may\
    \ never be perfectly innocent, they say, but a careful scientist can still labor\
    \ to keep her expectations honest — checking her instruments against one another,\
    \ repeating her measurements, inviting rivals to hunt for the errors she cannot\
    \ spot in herself — and so creep, one step at a time, toward something close to\
    \ a fair view of the facts. To others, the tangle simply cannot be undone. There\
    \ is no such thing, they argue, as a fact glimpsed from nowhere, washed clean\
    \ of every assumption; even the decision about what shall count as a fact is already\
    \ shaped by some picture of how the world works. On this view, observation and\
    \ theory are not two stages, one neatly following the other, but two threads twisted\
    \ so tightly together that no one can say where the seeing stops and the believing\
    \ begins.\r\n\r\nThe argument matters far beyond the seminar room. If observation\
    \ truly is the bedrock beneath everything else, then a disagreement in science\
    \ ought, sooner or later, to be settled by looking harder and measuring more carefully.\
    \ But if what we see is forever tinted by what we expect to see, then two careful\
    \ people, handed the very same evidence, may read it in opposite ways and never\
    \ be driven to agree — because, in a sense, they are not looking at the same thing\
    \ at all. How far we are entitled to trust our own eyes turns out, strangely,\
    \ to be one of the hardest questions science is forced to ask of itself.\r\n\r\
    \nBack in his basement, Millikan did at last arrive at his number, and a fine\
    \ number it was — close to the value scientists still rely on today. But it is\
    \ worth remembering how he reached it: not by passively receiving a fact the world\
    \ had handed him, but by watching, and weighing, and deciding which of his stubborn\
    \ little drops to believe. Between the world and the words we write about it stands\
    \ the observer — with her instruments, her expectations, and her stubbornly human\
    \ judgment — and she can never quite step out of the picture to see what the world\
    \ might look like when no one at all is there to look."
  question_text: The author describes the path from data to phenomenon as a road "paved,
    at every step, with judgment" (paragraph 3) mainly to stress that
  choice_a: turning a pile of raw measurements into a usable result is slow work,
    often requiring years of patient effort
  choice_b: scientists must follow strict, well-established procedures to turn their
    data into trustworthy conclusions
  choice_c: data, being so messy, can rarely reveal anything we should truly trust
    about the world
  choice_d: reaching the real phenomenon from raw data depends on interpretation and
    choice at every step
  correct_answer: D
  explanation: 'The metaphor pictures a road that is "paved … with judgment" — and
    crucially, "at every step." That phrasing insists the movement from raw data to
    the real phenomenon is never automatic; it takes human interpretation and decision-making
    the whole way, just as Millikan had to decide which drops to believe. That''s
    D. A hears "road" as a measure of time — a long journey taking years — but the
    emphasis is on judgment being required throughout, not on how long it lasts. B
    is the subtle trap: it keeps the idea of a careful process but replaces "judgment"
    with "strict procedures," which is nearly the reverse, since judgment means exercising
    discretion rather than following fixed rules, and the passage shows the scientist
    reasoning and choosing, not applying a formula. C stretches the image into a claim
    the passage rejects — that messy data can''t reveal anything trustworthy — while
    the text elsewhere grants that "careful measurement does carry us nearer" the
    truth; the point of the metaphor is the need for judgment, not the hopelessness
    of data.'
  distractor_types:
    A: wrong_concept
    B: partly_true_but_wrong
    C: inference_leap
