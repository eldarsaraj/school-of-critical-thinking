    together from the two rates it supplies. Energy grows faster than shaking — about
    thirty-twofold against tenfold with each step — so the two measures do not rise
    together; they pull steadily apart. With every step up the scale, the same increase
    in shaking corresponds to a larger and larger increase in energy. The practical
    result is that judging a quake by how hard it shakes will fall further and further
    short of how much energy it truly unleashed, and the larger the quake, the wider
    that shortfall grows. That is D. A imagines the two rates meeting, but two different
    steady multipliers never converge — they diverge without end. B reverses the relationship:
    energy does not slow down and level off; it is the faster-growing of the two.
