    \ confidently demanded; but the light of those stars is still crossing the immense\
    \ gulf between them and us, still somewhere in transit, not yet arrived and perhaps\
    \ for ages more to come. The darkness between the stars is not, then, an emptiness\
    \ at all. It is light that has not yet had the time to reach us.\r\n\r\nA second\
    \ reason, subtler than the first, deepens the darkness further. The universe is\
    \ not merely finite in its age; it is also expanding, with every distant object\
    \ drifting steadily away from every other. Light attempting to cross so continually\
    \ swelling a space is stretched as it travels, its waves drawn longer and longer,\
    \ its color sliding down and out of the visible altogether, past the red and into\
    \ wavelengths the human eye was never constructed to detect. What faint glow does\
    \ arrive from the farthest reaches arrives so stretched and cooled that we cannot\
    \ see it at all, having slipped beneath the lowest threshold of sight, so that\
    \ even the last dim edge of whatever might once have shone for us is erased from\
    \ the picture.\r\n\r\nSo the blackness overhead turns out to be the precise opposite\
    \ of nothing. It is a measurement — one plain enough for a child to make, and\
    \ ancient enough to have sat waiting since the first human being troubled to look\
    \ up. Its reading is set down in no numbers and calls for no instrument; it is\
    \ simply there, resting in the gaps between the stars, available to anyone who\
    \ thinks to wonder why those gaps should be dark. A child who asks that one small\
    \ question has, without the least awareness of having done so, asked among the\
    \ largest questions it is possible to ask: whether the universe has run on forever\
    \ or instead had a beginning. And the darkness, patient and unmistakable, returns\
    \ its answer. There was a beginning. The night has been telling us so the whole\
    \ time."
  question_text: The passage repeatedly treats the darkness, rather than the stars,
    as the thing demanding explanation. This choice of emphasis chiefly functions
    to
  choice_a: correct a common belief that stars matter more to astronomers than empty
    space does
  choice_b: make the reader feel small before the vastness and emptiness of the surrounding
    cosmos
  choice_c: turn a fact so ordinary it goes unnoticed into a genuine puzzle, so its
    resolution can carry real weight
  choice_d: build suspense by withholding the true cause of the darkness until the
    passage's final line
  correct_answer: C
  explanation: 'By insisting that the darkness — not the stars — is what needs accounting
    for, the passage takes something no one ordinarily thinks twice about and reframes
    it as a problem. That move is what gives the eventual answer its force: if the
    darkness were merely the plain, expected backdrop, then discovering that it proves
    the universe had a beginning would land as no surprise at all. The whole essay
    depends on first making the familiar strange, which is C. A treats the emphasis
    as a corrective to a belief about astronomers'' priorities, but the passage never
    argues about what astronomers care about; its subject is the sky itself, not the
    profession. B reads the darkness as an invitation to feel small, yet the passage
    uses it as evidence to be reasoned from, not as an occasion for awe or humility.
    D describes a suspense technique, and while the cause does emerge gradually, the
    reframing of darkness isn''t a matter of hiding the answer for a dramatic finish
    — it exists to establish that there is a question worth answering in the first
    place. Only C names what making darkness the subject actually accomplishes.'
