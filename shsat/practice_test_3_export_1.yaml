  correct_answer: D
  explanation: 'Let Maria''s current age be M and her son''s be S. "Five years ago"
    means subtract 5 from each: M − 5 = 3(S − 5). "In five years" means add 5 to each:
    M + 5 = 2(S + 5). Simplifying gives M = 3S − 10 and M = 2S + 5. Setting them equal,
    3S − 10 = 2S + 5, so S = 15, and then M = 2(15) + 5 = 35. (Check: five years ago
    Maria was 30 and her son 10, and 30 = 3 × 10; in five years she''ll be 40 and
    he''ll be 20, and 40 = 2 × 20.) Choice A, 15, is the son''s current age, the other
    unknown. Choice C, 30, is Maria''s age five years ago, and choice B, 20, is the
    son''s age five years from now — each is a correct value but for the wrong person
    or the wrong time. The two time shifts have to be applied to both ages before
    solving.'
