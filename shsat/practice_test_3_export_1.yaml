  passage_group_id: ela_h_p1
  passage_title: The Darkness Between the Stars
  passage_text: "The most important thing in the night sky is not the stars, but the\
    \ darkness that lies between them. We look up, register the bright points, and\
    \ take the black spaces entirely for granted — an empty background against which\
    \ the stars happen to be scattered, as unremarkable to us as the blank paper beneath\
    \ a drawing. Yet that darkness is neither background nor empty of meaning. It\
    \ is among the deepest facts in all of nature, and for the greater part of human\
    \ history no one suspected there was anything in it that needed explaining.\r\n\
    \r\nSuppose, as people did for a very long time, that the universe is infinite\
    \ and has always existed, its stars strewn more or less evenly throughout the\
    \ whole of it, on and on without any end. Now imagine standing somewhere near\
    \ the middle of such a universe and looking outward along a single direction —\
    \ straight overhead, let us say. The line of your sight leaves your eye and travels\
    \ away from you forever; and if the stars themselves go on forever as well, then\
    \ sooner or later, whether nearby or at some unimaginable remove, that line is\
    \ bound to run up against the burning surface of a star. It cannot miss. Choose\
    \ a second direction and precisely the same must hold; choose every direction\
    \ there is, and each one of them ends, at some distance or other, upon a star.\r\
    \n\r\nThe conclusion that follows is difficult to escape, and a good deal stranger\
    \ than it sounds at first hearing. In a universe both infinite and ageless, every\
    \ single point on the sky — not the majority of points but every last one of them\
    \ — would sit at the far end of a line terminating on a burning surface, so that\
    \ the night would not appear as a scatter of bright dots across a field of black.\
    \ It would instead be a seamless sheet of starlight, blazing in all directions\
    \ at once, as brilliant as the face of the sun, without a single gap of darkness\
    \ anywhere within it. Stand deep enough inside a forest and you will find no openings\
    \ there either: look between the nearest trunks and you meet farther ones behind\
    \ them, and between those farther ones, farther ones still, until at last the\
    \ receding trees close ranks into a solid, unbroken wall. An endless universe\
    \ crowded with stars ought, by the same reasoning, to wall us in — though in light\
    \ rather than in timber.\r\n\r\nAnd yet one has only to open one's eyes to see\
    \ that it does no such thing. The night is, overwhelmingly, dark. Between its\
    \ scattered stars lie enormous tracts of unrelieved black, and the sky at midnight\
    \ falls immeasurably short of the brightness of the sun — a fact so thoroughly\
    \ familiar that its underlying strangeness has become invisible to us. Something\
    \ in the chain of reasoning must therefore be broken somewhere, and one of the\
    \ quiet assumptions we allowed ourselves at the very outset cannot possibly be\
    \ true. It is not the assumption about the stars, which do genuinely appear to\
    \ be distributed fairly evenly through space. The fatal assumption is the other\
    \ one, the one that seemed far too obvious to be worth doubting — that the universe\
    \ has simply always been here.\r\n\r\nLight is exceedingly swift, but it is not\
    \ infinitely swift. It requires time to cross any distance, and the greater that\
    \ distance grows, the longer the crossing must take, so that when you look up\
    \ at a star you do not see the star as it is now but only as it once was, at the\
    \ moment its light first set out toward you, whether years or centuries or whole\
    \ ages ago. And if the universe is not in fact eternal, but began instead at some\
    \ definite moment in the finite past, then light has been granted only so much\
    \ time in which to travel since that beginning, and we can see only so far out\
    \ into space as light has yet contrived to reach us across. Beyond that edge there\
    \ may well be stars ranged in every direction, exactly as the older argument so\
    \ confidently demanded; but the light of those stars is still crossing the immense\
    \ gulf between them and us, still somewhere in transit, not yet arrived and perhaps\
    \ for ages more to come. The darkness between the stars is not, then, an emptiness\
    \ at all. It is light that has not yet had the time to reach us.\r\n\r\nA second\
    \ reason, subtler than the first, deepens the darkness further. The universe is\
    \ not merely finite in its age; it is also expanding, with every distant object\
    \ drifting steadily away from every other. Light attempting to cross so continually\
    \ swelling a space is stretched as it travels, its waves drawn longer and longer,\
    \ its color sliding down and out of the visible altogether, past the red and into\
    \ wavelengths the human eye was never constructed to detect. What faint glow does\
    \ arrive from the farthest reaches arrives so stretched and cooled that we cannot\
    \ see it at all, having slipped beneath the lowest threshold of sight, so that\
    \ even the last dim edge of whatever might once have shone for us is erased from\
    \ the picture.\r\n\r\nSo the blackness overhead turns out to be the precise opposite\
    \ of nothing. It is a measurement — one plain enough for a child to make, and\
    \ ancient enough to have sat waiting since the first human being troubled to look\
    \ up. Its reading is set down in no numbers and calls for no instrument; it is\
    \ simply there, resting in the gaps between the stars, available to anyone who\
    \ thinks to wonder why those gaps should be dark. A child who asks that one small\
    \ question has, without the least awareness of having done so, asked among the\
    \ largest questions it is possible to ask: whether the universe has run on forever\
    \ or instead had a beginning. And the darkness, patient and unmistakable, returns\
    \ its answer. There was a beginning. The night has been telling us so the whole\
    \ time."
  question_text: The passage ends by imagining a child who asks why the gaps between
    the stars are dark. This final turn works mainly by
  choice_a: insisting that children often notice profound truths that trained adults
    are prone to overlook
  choice_b: showing that the deepest question in the passage requires no expertise
    to pose, only the willingness to notice what is in plain sight
  choice_c: softening a difficult scientific argument with a warm, reassuring image
    before the passage closes
  choice_d: conceding that the darkness cannot be fully understood without the training
    a child does not yet have
  correct_answer: B
  explanation: 'Throughout, the passage has stressed that the evidence lies open to
    anyone — a reading "set down in no numbers" that "calls for no instrument," resting
    plainly "in the gaps between the stars." The closing child gathers that thread:
    the very question that opens onto whether the universe is eternal takes no learning
    to ask, only the readiness to wonder at something everyone can see. So the ending
    drives home that the profound and the plainly visible are, here, the same thing
    — which is B. A inflates this into a general claim that children routinely out-notice
    adults, a flattering idea the passage doesn''t make; its point is not that children
    see more, but that this particular truth is available to all, expert or not. C
    treats the child as mere decoration, a soft image to ease a hard argument, when
    the child actually delivers the argument''s payoff rather than cushioning it.
    D reverses the passage entirely: the whole force of the ending is that the darkness
    can be read without special training, so framing it as something a child is too
    untrained to grasp contradicts the point. Only B captures why the passage closes
    on that question.'
  distractor_types:
    A: inference_leap
    C: misidentified_detail
    D: opposite
