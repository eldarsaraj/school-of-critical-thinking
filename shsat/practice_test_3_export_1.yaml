  question_text: Which detail from the passage best supports the idea that true blue
    is very difficult for a living thing to produce?
  choice_a: Only a scattered handful of plants and animals have ever managed to make
    genuine blue pigment.
  choice_b: A blue butterfly's wing, ground into powder, loses its color and turns
    a dull brown.
  choice_c: Nature produces green, brown, and red with ease but yields true blue only
    rarely.
  choice_d: In the living world, blue is more often made by trickery than by actual
    pigment.
  correct_answer: B
  explanation: 'The claim is that a living thing struggles to make real blue pigment,
    and B is the detail that actually demonstrates it: when the wing is crushed, the
    blue disappears and only brown remains, proving the wing held no blue pigment
    at all — its blue came from structure instead, which is exactly what a creature
    falls back on when it cannot manufacture the pigment itself. The other three sound
    relevant because they all mention blue''s rarity, but each merely asserts the
    difficulty rather than showing it. A states that few living things make blue pigment
    — but that restates the claim rather than offering evidence for it. C compares
    blue to other colors in general terms, describing how rare blue is without explaining
