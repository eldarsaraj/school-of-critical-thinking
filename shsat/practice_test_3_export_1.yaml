    — what job, how much faster? B answers both: it names exactly what the machine
    did ("sorted the parcels") and by exactly how much it improved ("half the time"),
    turning a vague boast into a clear, checkable picture. That''s why it wins, and
    the key is not to be fooled into thinking the fanciest-sounding option is the
    most precise. A merely swaps in longer synonyms — "carried out its work at a considerably
    quicker pace" still says only that it worked faster. C reaches for the impressive
    word "efficient," but that''s more abstract, not less, since it never says at
