  question_text: If x and y are both negative integers with x < y, which expression
    has the least value?
  choice_a: x²y²
  choice_b: x³y²
  choice_c: x²y³
  choice_d: x³y³
  correct_answer: B
  explanation: 'First decide the sign of each expression, then compare sizes. An even
    power of a negative number is positive; an odd power keeps it negative. So x²y²
    (two even powers) is positive, and x³y³ = (xy)³ is positive too, since xy is a
    positive number cubed — neither can be the least. That leaves x³y² and x²y³, both
    negative (one odd power each). To find which is more negative, use x < y < 0,
    meaning x is farther from zero, so |x| > |y|. The expression x³y² carries three
