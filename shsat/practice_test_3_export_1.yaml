    After the change, the hardcovers become h + 12 and the paperbacks become 3h −
    12, and the new relationship is that paperbacks are twice the hardcovers: 3h −
    12 = 2(h + 12). Expanding the right side gives 3h − 12 = 2h + 24, so h = 36, which
    means the display began with 3 × 36 = 108 paperbacks. Choice A gives the starting
    number of hardcovers (36) instead of paperbacks — the right value of h, but the
    wrong quantity. Choice B comes from expanding 2(h + 12) incorrectly as 2h + 12,
    forgetting to multiply the 12 by 2, which gives h = 24 and 72 paperbacks. Choice
    C gives the number of paperbacks after the sale (96 = 108 − 12), answering for
    the wrong moment; the question asks how many there were "at first."'
