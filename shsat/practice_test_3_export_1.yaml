  question_text: Which version of sentence 9 is punctuated correctly?
  choice_a: Because some shoppers were nervous about stepping onto the moving steps
    stores hired attendants who stood at the top and offered a steadying hand.
  choice_b: Because some shoppers were nervous about stepping onto the moving steps,
    stores hired attendants who stood at the top and offered a steadying hand.
  choice_c: Because some shoppers were nervous about stepping onto the moving steps,
    stores hired attendants, who stood at the top and offered a steadying hand.
  choice_d: Because some shoppers were nervous about stepping onto the moving steps,
    stores hired attendants who stood at the top, and offered a steadying hand.
  correct_answer: B
  explanation: The sentence makes three punctuation decisions, and only B gets all
    three right. First, it opens with a dependent clause — "Because some shoppers
    were nervous … moving steps" — which needs a comma before the main clause begins;
    A drops that comma and runs the two parts together. Second, the clause "who stood
    at the top and offered a steadying hand" tells us which attendants are meant,
    so it's essential and takes no comma; C inserts one before "who," which turns
    the clause into a non-essential aside and quietly shifts the meaning toward attendants
    in general. Third, "stood … and offered" is one subject doing two things (a compound
    verb, not two full sentences), so no comma belongs before "and"; D adds one anyway.
    B keeps the single needed comma and nothing more.
  distractor_types:
    A: introduces_new_error
    C: changes_meaning
    D: introduces_new_error
