  question_text: If a and b are both negative integers with a < b, which expression
    has the greatest value?
  choice_a: a²b
  choice_b: ab²
  choice_c: −a²b
  choice_d: −ab²
  correct_answer: C
  explanation: 'Track the sign of each expression first. Because a and b are both
    negative, a² and b² are positive. So a²b (positive × negative) is negative, and
    ab² (negative × positive) is negative — neither can be the greatest. That leaves
    the two with a leading minus: −a²b and −ab², both positive. To choose between
    them, notice that a < b < 0 means a is farther from zero than b, so |a| > |b|.
    The expression −a²b uses two factors of the larger-magnitude a, while −ab² uses
    two factors of the smaller-magnitude b, so −a²b is the larger of the two positives.
    (Check with a = −4, b = −1: −a²b = 16 and −ab² = 4.) Choice A, a²b, is actually
    the least value of all four (−16 in the check) — it has the biggest size but a
    negative sign, so a student who compares only magnitudes and ignores the sign
    picks it by mistake. Choice B, ab², is also negative. Choice D, −ab², is positive
    but smaller, because it leans on the smaller-magnitude variable.'
  distractor_types:
    A: sign_error
    B: wrong_setup
    D: wrong_setup
