  question_text: A newspaper reports that a recent earthquake measured magnitude 7,
    while one from the year before measured magnitude 5. Drawing on both the passage
    and the table, which statement most accurately describes how the two compare?
  choice_a: The magnitude-7 quake released roughly 1,000 times the energy of the magnitude-5
    quake.
  choice_b: The magnitude-7 quake released roughly 100 times the energy of the magnitude-5
    quake.
  choice_c: The magnitude-7 quake released roughly 40 percent more energy than the
    magnitude-5 quake.
  choice_d: The magnitude-7 quake released roughly 64 times the energy of the magnitude-5
    quake.
  correct_answer: A
  explanation: 'The passage explains that energy climbs about thirty-two times with
    every single step up the scale, and the table puts numbers to it: in the "energy"
    column, a magnitude 7 stands at about 32,000 and a magnitude 5 at about 32. Comparing
    the two — 32,000 divided by 32 — gives roughly 1,000, so the magnitude-7 quake
    released on the order of a thousand times the energy. That is A. B, "about 100
    times," is the figure for how much harder the ground shook (a hundredfold across
    those two steps), not how much more energy was released; it confuses the passage''s
    two different measures. C, "40 percent more," is the everyday, linear way of reading
    the numbers — treating a 7 as just a bit above a 5, the way 7 is about 40 percent
    larger than 5 — which is exactly the misreading the passage warns against. D,
    "about 64 times," looks clever: it doubles thirty-two, as if two steps meant 32
    plus 32. But each step multiplies, so two steps is 32 times 32 — a little over
    a thousand — not 32 added to itself. Only A follows the multiplying rule the passage
    and table describe.'
  distractor_types:
    B: misidentified_detail
    C: wrong_concept
    D: inference_leap
