  passage_title: The Last Color
  passage_text: "We live beneath a blue sky and beside blue water, and so we take\
    \ it for granted that blue is among the most ordinary colors in the world. In\
    \ one sense it plainly is, arching over every afternoon and reaching to every\
    \ horizon at sea. Yet go looking for blue in the solid, touchable matter of the\
    \ earth — in flowers and feathers, in stones and skin and leaves — and it grows\
    \ strangely scarce. Nature turns out green and brown and red with the greatest\
    \ of ease, but true blue it yields only rarely, and more often by trickery than\
    \ by pigment. Of all the colors, blue is the one the living world seems least\
    \ able to make.\r\n\r\nConsider the shimmering wing of a blue morpho butterfly,\
    \ or the sudden flash of a jay against the snow. Grind either the wing or the\
    \ feather to powder, and the blue simply disappears, leaving a drab, sooty brown\
    \ behind. The color was never a dye soaked into the tissue at all; it was built\
    \ instead out of structure. Microscopic ridges and stacked layers, each one thinner\
    \ than a single wavelength of light, catch the incoming sun and scatter back only\
    \ its blue portion, much as a film of oil flings rainbows across a rain-wet street.\
    \ The creature is not so much colored blue as shaped to appear blue. Genuine blue\
    \ pigment, the kind that soaks into a surface and stays there, is among the most\
    \ difficult of all colors for a living thing to manufacture, and only a scattered\
    \ handful of plants and animals have ever contrived to produce it.\r\n\r\nPerhaps\
    \ it is because blue is so uncommon in the things people could gather and crush\
    \ and hold up to name that the color seems to have entered our languages later\
    \ than the others. When scholars sift patiently through the world's most ancient\
    \ surviving writings, they find black and white and red scattered generously across\
    \ the page, yet blue remains curiously, almost eerily, absent. The poet Homer,\
    \ singing of the Mediterranean that lapped at his own shores, called it not blue\
    \ but \"wine-dark,\" and nowhere in the whole of his vast epics does any plain\
    \ word for blue appear. He was not blind to the color; the sea had simply not\
    \ yet been granted that name. Across many unrelated languages, scattered over\
    \ distant continents and centuries, researchers keep turning up the same rough\
    \ order of appearance: a people settles first on words for black and white, then\
    \ red, then the greens and yellows, and only afterward, if it arrives there at\
    \ all, does it reach a separate word for blue. It is nearly as though blue were\
    \ the very last color that the human eye learned how to speak of.\r\n\r\nWhen\
    \ people did at last set out to manufacture blue for themselves, they found it\
    \ maddeningly difficult to pin down. The most magnificent blue known to the medieval\
    \ world was wrung from a single kind of stone, lapis lazuli, which had to be hauled\
    \ by caravan across thousands of miles from a few remote mountain valleys, then\
    \ ground down through a long and jealously guarded process into a fine powder\
    \ called ultramarine — a word meaning, quite literally, \"from beyond the sea.\"\
    \ So ruinously expensive was this powder that it commonly outpriced gold itself,\
    \ and painters hoarded their small supplies like misers, spreading the precious\
    \ blue across only the holiest or most exalted figure in a composition. To drape\
    \ a painted robe in ultramarine was to proclaim, before a single face had been\
    \ finished, that its wearer was sacred or royal. Cheaper blues could of course\
    \ be had, but they tended to dull, fade, or blacken as the years went by, and\
    \ not one of them could rival the deep, almost unearthly radiance of the genuine\
    \ stone.\r\n\r\nAnd so something curious came to pass. The very scarcity that\
    \ had made blue so hard to find, so slow to name, and so costly to produce became,\
    \ over the long unwinding of the centuries, the very wellspring of its prestige.\
    \ A color the earth could scarcely bring forth came, for that very reason, to\
    \ stand for the things that people valued most: the heavens above, the garments\
    \ of the divine, the far-off and the fathomless. Blue was expensive, and expense\
    \ hardened into prestige; blue was elusive, and elusiveness deepened into mystery.\
    \ What had begun as nothing grander than a shortage of usable pigment slowly set,\
    \ over generations, into an entire language of meaning, so that even today, long\
    \ after chemists learned to brew serviceable blue cheaply and by the barrelful,\
    \ some faint residue of its ancient preciousness still clings to the color.\r\n\
    \r\nThere is a paradox at the heart of all of this. The color we happen to see\
    \ most often, the very instant we lift our eyes — arching overhead through the\
    \ daylight, reaching to the edge of the world at sea — is the one that the living\
    \ earth most stubbornly withholds, the one our distant ancestors could not name,\
    \ the one their descendants would eventually grind whole mountains to possess.\
    \ Blue encircles us, and yet it forever slips between our fingers, hanging just\
    \ out of reach in the sky and the water. It may be, in the end, at once the most\
    \ abundant of all the colors and the very rarest."
  question_text: Which statement best describes the central idea of the passage?
  choice_a: Because people prized blue so highly, they searched hard to find it in
    nature, to name it, and to manufacture it.
  choice_b: Blue is scarce in nature, in language, and in pigment, and that scarcity
    is what made it a color of lasting value.
  choice_c: Blue has been treasured above every other color for as long as human beings
    have made art.
  choice_d: Blue surrounds us in the sky and sea, yet it is so hard to produce that
    it has stayed genuinely rare to this day.
  correct_answer: B
  explanation: 'B states the argument correctly: three kinds of scarcity, and value
    growing out of that scarcity. The traps each sound right but break in a specific
    place. A reverses the passage''s cause and effect: it says people valued blue
    and therefore chased it, whereas the passage argues the opposite — blue''s scarcity
    is what produced its value ("scarcity … became the very wellspring of its prestige").
    C contradicts the middle of the passage: blue was not treasured from the start
    of art, it was named late and long overlooked, so "above every other color for
    as long as human beings have made art" is false. D is the subtlest, because its
    first half is accurate — but it claims blue "has stayed genuinely rare to this
    day," when the passage says chemists now "brew serviceable blue cheaply and by
    the barrelful," and it also stops at scarcity without reaching the passage''s
    real point, its meaning. Only B is both accurate and the full size of the argument.'
  distractor_types:
    A: causal_confusion
    C: partly_true_but_wrong
    D: partly_true_but_wrong
