  question_text: "Which revision of the sentence below best corrects the error?\r\n\
    \r\n\"After the storm finally passed, the crew discovered that the old footbridge\
    \ collapses and that several roads were blocked by fallen branches.\""
  choice_a: After the storm finally passes, the crew discovered that the old footbridge
    collapsed and that several roads were blocked by fallen branches.
  choice_b: After the storm finally passed, the crew discovers that the old footbridge
    collapses and that several roads were blocked by fallen branches.
  choice_c: After the storm finally passed, the crew discovered that the old footbridge
    collapsed and that several roads were blocked by fallen branches.
  choice_d: After the storm finally passed, the crew discovered that the old footbridge
    had collapsed and that several roads had been blocked by fallen branches.
  correct_answer: C
  explanation: 'The whole sentence describes a finished event in the past — "passed,"
    "discovered," and "were blocked" are all past tense — so the lone present-tense
    verb, "collapses," is the error. The clean fix is the simple past "collapsed,"
    which sits in parallel with "were blocked," and that''s all C changes. D is the
    trap for a careful reader: it does fix "collapses," but it then forces both clauses
    into the past perfect ("had collapsed … had been blocked"), over-marking the time
    order and making the sentence heavier than it needs to be when plain past is right.
    A also fixes the footbridge verb, but it breaks a different one — changing "passed"
    to "passes" puts a new present-tense clash into the opening clause, so it repairs
    one verb and damages another. B is the reverse of what''s needed: it shifts the
    main verb to "discovers" and leaves "collapses" untouched, anchoring the sentence
    in the present tense the rest of it rejects.'
  distractor_types:
    A: introduces_new_error
    B: wrong_concept
    D: overcorrection
