  question_text: For a board game, 90 blue tokens and 120 red tokens are to be sorted
    into identical piles. Every token must be used, each pile must have the same number
    of blue tokens, and each pile must have the same number of red tokens. What is
    the greatest number of piles that can be made?
  choice_a: '6'
  choice_b: '10'
  choice_c: '15'
  choice_d: '30'
  correct_answer: D
  explanation: 'The number of piles must divide both 90 and 120 evenly, so the greatest
    possible number of piles is the greatest common factor of 90 and 120. Breaking
    each into prime factors, 90 = 2 × 3 × 3 × 5 and 120 = 2 × 2 × 2 × 3 × 5; the factors
    they share are one 2, one 3, and one 5, so the greatest common factor is 2 × 3
    × 5 = 30. (Each pile then holds 90 ÷ 30 = 3 blue and 120 ÷ 30 = 4 red tokens.)
    The three wrong answers each catch a shared factor but miss one of the others:
    choice A, 6, uses only the 2 and the 3; choice B, 10, uses only the 2 and the
    5; choice C, 15, uses only the 3 and the 5. Each of these divides both numbers,
    but none is the greatest such number — only using all three shared factors gives
    30.'
