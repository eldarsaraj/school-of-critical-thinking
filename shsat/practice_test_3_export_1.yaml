  question_text: "Read this sentence.\r\n\r\n\"Rushing to finish before the storm,\
    \ the last row of tomatoes was planted by the volunteers.\"\r\n\r\nHow should\
    \ this sentence be revised?"
  choice_a: Rushing to finish before the storm, that afternoon the last row of tomatoes
    was planted by the volunteers.
  choice_b: That afternoon, rushing to finish before the storm, the last row of tomatoes
    was planted by the volunteers.
  choice_c: The volunteers, that afternoon rushing to finish before the storm, planted
    the last row of tomatoes.
  choice_d: Rushing to finish before the storm, the volunteers planted the last row
    of tomatoes that afternoon.
  correct_answer: D
  explanation: 'The opening phrase, "Rushing to finish before the storm," describes
    whoever is doing the rushing — and a row of tomatoes cannot rush; only the volunteers
    can. As written, the sentence attaches that phrase to "the last row of tomatoes,"
    so it reads, strictly, as though the tomatoes were rushing. The repair is to place
    the phrase directly before the people it actually describes. D does this: "Rushing
    to finish before the storm, the volunteers planted…" — now the phrase sits right
    beside "the volunteers." A and B only relocate the words "that afternoon" and
    leave the sentence in the passive voice, so the phrase still attaches to the tomatoes,
    unfixed. C does move "the volunteers" to the front, correctly making them the
    ones rushing, but it then wedges "that afternoon rushing to finish before the
    storm" into the middle of the sentence as a clumsy interruption that''s hard to
    follow. Only D attaches the phrase to the volunteers and reads cleanly.'
