  question_text: The detail of the mother eating the cake with her fingers, "in small
    quick pieces," most strongly suggests that
  choice_a: she has been overtaken by a hunger she was too busy to satisfy earlier
    in the day
  choice_b: in private she permits herself an unguarded, appetite-driven self that
    her son never gets to see
  choice_c: she is anxious about something and is eating without noticing that she
    does it
  choice_d: she wants to finish the cake quickly before anyone can come downstairs
    and catch her
  correct_answer: B
  explanation: 'The force of the image is in what it violates. The fingers instead
    of a fork, the "small quick pieces," the gazing at nothing — this is a way of
    eating no one performs for an audience, and the passage frames the whole moment
    as one she believed unobserved, wearing "an expression that Daniel had never seen
    there in his life." So the detail reveals a version of her that exists only when
    she is alone: informal, hungry, unpoliced, nothing like the mother who pours cereal
    and finds shoes. That is B. A reduces it to simple hunger, a practical matter
    of a skipped meal, which flattens the strangeness the passage is building; the
    point is not that she is hungry but that she is someone else here. C reads in
    anxiety and absent-mindedness, but the passage offers no worry — only a private
    absorption — and eating "without noticing" contradicts the deliberate, savoring
    quality of small quick pieces eaten by hand. D supplies a motive of secrecy and
    haste, as though she were hiding a transgression, yet nothing suggests she fears
    being caught; she simply believes, wrongly, that she is alone, which is a different
    thing from sneaking. Only B reads the detail as the glimpse of a hidden self that
    the passage plainly intends.'
