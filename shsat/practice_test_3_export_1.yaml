  question_text: If x = −2, what is the value of |x² + x³| − |x + 2x + 3x| ?
  choice_a: '-16'
  choice_b: '-8'
  choice_c: '0'
  choice_d: '8'
  correct_answer: B
  explanation: 'Work out each absolute value separately, then subtract. Inside the
    first: x² + x³ = (−2)² + (−2)³ = 4 + (−8) = −4, and |−4| = 4. Inside the second:
    x + 2x + 3x = 6x = 6(−2) = −12, and |−12| = 12. So the expression equals 4 − 12
    = −8 — a negative result, since a difference of two absolute values can be negative
    even though each piece is positive. Choice C, 0, comes from mishandling a sign
    in a power — for instance, treating (−2)³ as +8, which makes the first absolute
    value 12 and cancels the two. Choice A, −16, forgets the absolute-value bars on
    the first part, keeping it as −4 instead of 4. Choice D, 8, either drops both
    sets of bars or subtracts in the wrong order (12 − 4). The care points are the
    sign of the odd power and applying each absolute value before combining.'
  distractor_types:
    A: wrong_setup
    C: sign_error
    D: wrong_setup
