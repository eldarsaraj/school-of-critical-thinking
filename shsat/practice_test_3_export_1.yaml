  question_text: "Read this sentence.\r\n\r\n\"Unlike most other planets in the solar\
    \ system, the surface of Venus is hot enough to melt lead.\"\r\n\r\nWhich revision\
    \ corrects the error in the sentence?"
  choice_a: Unlike most other planets in the solar system, Venus has a surface hot
    enough to melt lead.
  choice_b: Unlike most other planets in the solar system, the surface of Venus can
    reach temperatures high enough to melt lead.
  choice_c: The surface of Venus, unlike most other planets in the solar system, is
    hot enough to melt lead.
  choice_d: Unlike the surfaces of most other planets in the solar system, Venus is
    hot enough to melt lead.
  correct_answer: A
  explanation: 'The phrase "Unlike most other planets" promises a comparison, so whatever
    the sentence puts forward as its subject has to be something that can be compared
    to planets — namely, another planet. The original fails this: its subject is "the
    surface of Venus," so it lines a surface up against planets, two different kinds
    of things. A fixes it by making the subject "Venus," so the sentence compares
    Venus with the other planets, as intended. Every option reads smoothly, so the
    ear is no help; the test is purely whether like is compared with like. B just
    reworks the wording while keeping "the surface of Venus" as the subject, so the
    mismatched comparison survives. C slides the "unlike" phrase into the middle of
    the sentence, which rearranges the words but leaves the surface as the thing being
    compared to planets. D is the mirror image of the original error: it now compares
    "Venus," a planet, with "the surfaces of most other planets" — a planet against
    surfaces — so the two sides still don''t match. Only A compares one planet with
    other planets.'
  distractor_types:
    B: partly_true_but_wrong
    C: misattributed_error_location
    D: introduces_new_error
