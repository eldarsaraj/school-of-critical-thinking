  question_text: In the parallelogram, one interior angle measures (3x + 10)° and
    the angle next to it, along the same side, measures 2x°. What is the value of
    x?
  choice_a: '16'
  choice_b: '34'
  choice_c: '36'
  choice_d: '38'
  correct_answer: B
  explanation: In a parallelogram, two angles that sit next to each other along the
    same side are supplementary — they add up to 180°. So (3x + 10) + 2x = 180. Combining
    the x-terms gives 5x + 10 = 180, then 5x = 170, so x = 34. Choice A, 16, comes
    from using 90° instead of 180°, treating the angles as complementary — but only
    their two-angle sum along a side reaching a straight line makes 180°. Choice C,
    36, drops the "+ 10," solving 5x = 180 as if the angles were just 3x and 2x. Choice
    D, 38, subtracts the 10 instead of adding it when isolating x. The setup hinges
    on the 180° relationship and on carrying the constant term correctly.
  distractor_types:
    A: wrong_setup
    C: wrong_setup
    D: sign_error
