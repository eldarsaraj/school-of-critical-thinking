  question_text: A community choir's membership increased by 30% one year and then
    decreased by 30% the following year. If the choir started with 200 members, how
    many members did it have after these two years?
  choice_a: '140'
  choice_b: '182'
  choice_c: '200'
  choice_d: '260'
  correct_answer: B
  explanation: 'The two percent changes apply to different amounts, so they can''t
    just cancel. After the 30% increase, the choir has 200 × 1.30 = 260 members. The
    30% decrease then applies to 260, not to the original 200: 260 × 0.70 = 182 members.
    Choice C, 200, is the trap — assuming that going up 30% and down 30% returns to
    the start; but the decrease is taken from the larger 260, so it removes more than
    the increase added, leaving fewer than 200. Choice D, 260, is the count after
    only the first year, forgetting the second change. Choice A, 140, applies the
    30% drop to the original 200 (200 × 0.70), ignoring the increase that came first.
    Each percent change must be applied to the amount that exists at that moment.'
