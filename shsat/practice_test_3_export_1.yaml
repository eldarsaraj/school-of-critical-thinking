  question_text: What is the prime factorization of 300?
  choice_a: 2² · 3 · 25
  choice_b: 2² · 15 · 5
  choice_c: 2² · 3 · 5²
  choice_d: 2² · 75
  correct_answer: C
  explanation: 'A prime factorization must break the number down until every factor
    is prime. Working it out: 300 = 4 × 75 = 2² × 75, and 75 = 3 × 25 = 3 × 5², so
    300 = 2² × 3 × 5². That is choice C, where every factor — 2, 3, and 5 — is prime.
    Each of the other choices multiplies back to 300, so the value is right, but each
    still hides a composite number that could be broken down further: choice A leaves
    25 (which is 5²), choice B leaves 15 (which is 3 × 5), and choice D leaves 75
    (which is 3 × 5²). Getting the correct product is not enough — the factorization
    isn''t finished until nothing but primes remains.'
  distractor_types:
    A: wrong_setup
    B: wrong_setup
    D: wrong_setup
