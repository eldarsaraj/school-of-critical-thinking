- section: ELA
  stage: easy_module
  question_number: 1
  question_type: multiple_choice
  skill: sentence_structure
  difficulty: easy
  topic: ''
  passage_group_id: ela_e_re
  passage_title: The Staircase That Moved
  passage_text: (1) Today the escalator is so ordinary that most people step onto
    one without a second thought. (2) When the first moving stairways appeared more
    than a hundred years ago, however, they struck onlookers as something close to
    magic. (3) The earliest moving stairways were not built to carry shoppers or commuters,
    they were built to entertain. (4) At seaside amusement parks, curious visitors
    paid a small fee just to ride the strange new machine to the top and back down
    again. (5) A rider stepped onto the bottom step. (6) The moving stairs carried
    the rider smoothly upward. (7) Department stores were among the first businesses
    to recognize what such a machine could really do. (8) A moving staircase could
    lift a steady stream of customers past shelves of merchandise without anyone having
    to climb or wait. (9) Because some shoppers were nervous about stepping onto the
    moving steps, stores hired attendants who stood at the top and offered a steadying
    hand. (10) The pastries sold in many of these stores were freshly baked each morning.
    (11) As moving stairways spread, it slowly reshaped the buildings that held them.
    (12) Architects laid out wide central courts where the rivers of passengers flowing
    between floors would have room to move. (13) In little more than a generation,
    a contraption invented for amusement had become part of the machinery of everyday
    city life.
  question_text: Which revision of sentence 3 best corrects the error in sentence
    structure while keeping the contrast between the two ideas?
  choice_a: The earliest moving stairways were not built to carry shoppers or commuters,
    they were instead built to entertain.
  choice_b: The earliest moving stairways were built not to carry shoppers or commuters
    but to entertain.
  choice_c: The earliest moving stairways were not built to carry shoppers or commuters,
    so they were built to entertain.
  choice_d: The earliest moving stairways were not built to carry shoppers or commuters;
    but they were built to entertain.
  correct_answer: B
  explanation: 'Sentence 3 splices two complete thoughts together with only a comma.
    B recasts them as a single sentence — "built not to carry … but to entertain"
    — which removes the splice while keeping the contrast exactly. C is the trap that
    survives a quick grammar check: comma-plus-"so" is a legal way to join two clauses,
    so the splice is gone, but "so" means as a result, turning the intended contrast
    into cause-and-effect the passage never states. A adds "instead" to sharpen the
    meaning, yet the comma splice is left untouched — the real error was structural,
    not a missing word. D repairs the splice with a semicolon but then adds "but";
    a semicolon already does a conjunction''s job, so using both at once is incorrect.'
  distractor_types:
    A: misattributed_error_location
    C: wrong_logical_relation
    D: introduces_new_error
