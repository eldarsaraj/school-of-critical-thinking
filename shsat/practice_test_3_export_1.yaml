  question_text: What is the best way to combine sentences 5 and 6?
  choice_a: A rider stepped onto the bottom step and was carried smoothly upward by
    the moving stairs.
  choice_b: A rider stepped onto the bottom step, and the moving stairs carried the
    rider smoothly upward.
  choice_c: Stepping onto the bottom step, the moving stairs carried the rider smoothly
    upward.
  choice_d: Although a rider stepped onto the bottom step, the moving stairs carried
    the rider smoothly upward.
  correct_answer: A
  explanation: 'A folds the two sentences into one with a compound verb — "stepped
    … and was carried" — and keeps the moving stairs as the agent ("by the moving
    stairs") without repeating "the rider." B is fully grammatical, so it can''t be
    ruled out on a quick read; it''s just the weaker version, naming "the rider" twice
    where one mention does the job. C looks like the tightest, most economical option,
    and it''s the shortest — but the opening phrase "Stepping onto the bottom step"
    attaches to the nearest noun, "the moving stairs," which leaves the stairs doing
    the stepping. D joins the two cleanly but inserts "Although," inventing a contrast:
    there''s nothing surprising about a rider being carried after stepping on, so
    the logical relation is wrong.'
  distractor_types:
