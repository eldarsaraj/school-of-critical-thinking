  question_text: "Which revision corrects the faulty comparison?\r\n\r\n\"The population\
    \ of Toronto is larger than any city in Canada.\""
  choice_a: The population of Toronto is larger than any other city in Canada.
  choice_b: The population of Toronto is the largest of any city in Canada.
  choice_c: The population of Toronto is larger than that of any other city in Canada.
  choice_d: The population of Toronto is larger than that of any city in Canada.
  correct_answer: C
  explanation: 'The original hides two separate errors, and neither can be heard —
    every version rolls off the tongue. First, it compares a population (a number)
    to a city (a place): "larger than any city" measures Toronto''s population against
    a city rather than against another population, so the fix needs "that of" — the
    population of those cities. Second, Toronto is itself a city in Canada, so "any
    city in Canada" already includes Toronto, making the sentence claim Toronto''s
    population is larger than its own; that requires "any other city." Only C repairs
    both. The traps each fix exactly one error and leave the other standing: A adds
    "other" (no more self-comparison) but still pits a population against a city;
    D adds "that of" (population against population) but drops "other," so Toronto
    is compared to itself again; B sidesteps the comparison with "the largest of any
    city," a construction that''s illogical in its own right. Sounding them out gets
    a student nowhere — the only way through is to check what is actually being compared
    to what.'
  distractor_types:
    A: partly_true_but_wrong
    B: introduces_new_error
    D: partly_true_but_wrong
