  passage_group_id: ela_r_p3
  passage_title: Every Step a Leap
  passage_text: "When word of an earthquake reaches us, it almost always arrives in\
    \ the form of a single number — a magnitude 5, we are told, or a magnitude 7 —\
    \ and the number carries a reassuring air of simplicity, as though it were a plain\
    \ and self-evident measure of how violent the event had been. Most of us read\
    \ it much as we read a temperature or a test score. A 7 registers as a little\
    \ worse than a 6, and a fair bit worse than a 5, yet all three seem to belong\
    \ to more or less the same neighborhood of severity. That comfortable impression\
    \ is almost wholly mistaken, and the distance separating those modest-looking\
    \ figures is enormously greater than it first appears.\r\n\r\nThe reason lies\
    \ buried in the way the scale itself is constructed. It does not ascend in even\
    \ increments, the way the markings on a ruler do, where the gap between 5 and\
    \ 6 is identical to the gap between 6 and 7. Each step upward, rather than adding\
    \ some fixed amount, multiplies whatever came before it. Rise a single point in\
    \ magnitude — from a 5 to a 6 — and the shaking measured in the ground does not\
    \ merely inch higher; it grows fully ten times greater. Rise one further point,\
    \ from a 6 to a 7, and it swells tenfold once again, so that a magnitude 7 shakes\
    \ the earth a hundred times as violently as a magnitude 5. A scale that advances\
    \ by repeated multiplication in this manner is called logarithmic, and its great\
    \ peculiarity is that it can fold staggering differences into what looks, written\
    \ out on a page, like a short and unremarkable climb.\r\n\r\nThe trembling of\
    \ the ground, moreover, tells only half the story. The energy an earthquake actually\
    \ discharges — the truest gauge of its power to topple towers, buckle highways,\
    \ and heave the solid ground apart — mounts faster still than the shaking does.\
    \ With each single step up the scale, the energy set loose multiplies not by ten\
    \ but by roughly thirty-two. A magnitude 6, accordingly, unleashes something like\
    \ thirty-two times the energy of a magnitude 5; a magnitude 7, about thirty-two\
    \ times that figure again. What began as an unremarkable difference between two\
    \ small numbers has swollen, in the space of only two steps, into a difference\
    \ of a thousandfold in sheer destructive force.\r\n\r\nHere lies the reason these\
    \ tidy little figures can deceive so thoroughly. Someone informed that one quake\
    \ measured 6 while another measured 8 might sensibly conclude that the second\
    \ was somewhat the stronger of the two — perhaps a third again as forceful, in\
    \ the way that the number 8 is a third larger than the number 6. In reality the\
    \ magnitude-8 quake releases on the order of a thousand times the energy of the\
    \ magnitude-6: not the difference between a strong quake and a slightly stronger\
    \ one, but the difference between a serious tremor and an outright cataclysm.\
    \ The largest earthquakes ever recorded, near magnitude 9, unleash forces so far\
    \ beyond ordinary experience that no everyday comparison can hold them. It is\
    \ exactly this hidden ferocity, lurking behind an unassuming digit, that keeps\
    \ engineers and public officials awake over what may strike everyone else as a\
    \ trivial shift in a decimal point.\r\n\r\nThe error, in the end, is an understandable\
    \ one. We pass our lives among numbers that mount in even, orderly steps, and\
    \ a scale that vaults ahead by multiplying feels alien to the habits of everyday\
    \ arithmetic. Yet earthquakes are far from the only domain in which such scales\
    \ are put to work. The loudness of sounds and the brightness of the stars are\
    \ each reckoned in much the same multiplying fashion, and in every case an innocent-looking\
    \ string of numbers conceals differences too vast for the mind to picture with\
    \ any comfort. To read such a scale rightly, one must set aside the imaginary\
    \ ruler and hold fast to a single stubborn truth: here, every step is not a stride\
    \ but a leap. The table below sets out just how swiftly those leaps compound."
  question_text: According to the table, the ground shaking of a magnitude 8 earthquake
    is about how many times as strong as the ground shaking of a magnitude 6 earthquake?
  choice_a: About 10,000 times
  choice_b: About 2 times
  choice_c: About 1,000,000 times
  choice_d: About 100 times
  correct_answer: D
  explanation: 'The question compares two different magnitudes, so no single box in
    the table holds the answer — you have to weigh two rows against each other. In
    the "ground shaking" column, a magnitude 8 is listed as 10,000 times a magnitude
    4, and a magnitude 6 as 100 times a magnitude 4. Since both are measured against
    the same magnitude-4 baseline, that baseline cancels out, and the magnitude 8
    shakes 10,000 ÷ 100 = 100 times as hard as the magnitude 6. That is D. A, "about
    10,000 times," simply copies the magnitude-8 box without comparing it to the magnitude
    6. C, "about 1,000,000 times," is taken from the wrong column entirely — that''s
    the magnitude-8 figure for energy, not shaking. B, "about 2 times," is the trap
    the passage is built to expose: it treats the scale as though its steps added
    up evenly, so that an 8 would be only a little more than a 6. But the scale multiplies
    rather than adds, and two steps up means ten times and ten times again — a hundredfold,
    not a doubling.'
  distractor_types:
    A: misidentified_detail
    B: wrong_concept
    C: misidentified_detail
