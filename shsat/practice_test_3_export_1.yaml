  question_text: In Passage 2, the writer compares becoming excellent to a gardener
    who "grows one magnificent branch only by cutting away the dozen that would have
    split the tree's strength." This image works chiefly to present quitting as
  choice_a: a painful sacrifice that a person must reluctantly accept as the price
    of success
  choice_b: the active method by which excellence is produced, rather than a mere
    absence of effort
  choice_c: a decision best made slowly, only after every other option has been carefully
    weighed
  choice_d: a natural process that will occur on its own if a person simply waits
    long enough
  correct_answer: B
  explanation: A gardener's cutting is not damage or loss; it is the technique that
    produces the single great branch. By casting quitting as pruning, the passage
    reframes it as the very thing that builds mastery — a deliberate act of creation,
    not a failure to keep going. That is B, and it matches the passage's surrounding
    claim that "achievement… grew straight out of that long sequence of quittings."
    A reads the image as reluctant sacrifice, something endured with regret, but pruning
    carries no such sorrow here; it is presented as skillful and generative, the gardener's
    craft rather than a wound. C recommends slow, exhaustive deliberation, which runs
    against the passage's insistence on quitting "early," before the sunk cost hardens
    — the gardener cuts decisively, not after endless weighing. D imagines pruning
    as something that happens by itself if one waits, but a branch is cut by a gardener's
    hand, and the passage's whole point is that release takes active, difficult judgment.
    Only B captures what the gardening image is doing.
