  question_text: "Which revision best expresses the idea without unnecessary words?\r\
    \n\r\n\"The scientist repeated the experiment again a second time in order to\
    \ make certain and confirm that the surprising result had not been caused simply\
    \ by random chance.\""
  choice_a: The scientist repeated the experiment to confirm that the surprising result
    had not been caused by chance.
  choice_b: The scientist repeated the experiment again to make certain and confirm
    the surprising result had not been caused by random chance.
  choice_c: The scientist repeated the experiment.
  choice_d: To make certain, the scientist confirmed the surprising result by repeating
    the experiment a second time.
  correct_answer: A
  explanation: 'The original is padded with pairs that say the same thing twice: "repeated
    … again a second time," "make certain and confirm," and "random chance" (chance
    is already random). A strips every one of those redundancies while keeping the
    full idea intact — that she ran it a second time and why: to rule out chance.
    That balance is the whole test. C is the trap for anyone who thinks "shortest
    equals most concise": "The scientist repeated the experiment" is indeed the fewest
    words, but it throws away the essential point — why she repeated it — so it''s
    not concise, it''s incomplete. B trims a little but leaves two redundancies untouched
    ("again" on top of "repeated," and "make certain and confirm"). D rearranges the
    sentence into an awkward shape and keeps "a second time," which "repeated" already
    implies. Only A cuts the fat without cutting the meaning.'
