    or a falling drop will seldom pass, but that a crawling insect, jostling the hairs
    again and again, can hardly fail." The clue the plant needs — is this real prey?
    — is carried by the pattern of contact itself: living things touch over and over,
    while a drop or a gust usually touches once. So the count alone sorts the real
    from the false, and the plant never has to perceive what landed on it — which
    matters, since it has "no nerves and no brain." That''s D. C is the subtle trap:
