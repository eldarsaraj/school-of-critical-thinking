  question_text: A box contains 4 green tiles and 6 yellow tiles. Two tiles are drawn
    at random, one after the other, without replacing the first before drawing the
    second. What is the probability that at least one of the two tiles drawn is green?
  choice_a: 2/15
  choice_b: 1/3
  choice_c: 2/5
  choice_d: 2/3
  correct_answer: D
  explanation: '"At least one green" covers many cases (green then yellow, yellow
    then green, green then green), so the fastest route is the opposite: find the
    chance of no green — both yellow — and subtract from 1. Both yellow is (6/10)
    × (5/9) = 30/90 = 1/3, since after removing one yellow, 5 of the remaining 9 tiles
    are yellow. So at least one green is 1 − 1/3 = 2/3. Choice B, 1/3, is that "both
    yellow" probability with the final "1 minus" step forgotten. Choice A, 2/15, computes
    "both green," (4/10) × (3/9) = 12/90, mistaking "at least one" for "both." Choice
    C, 2/5, is just the chance the first tile is green (4/10), ignoring the second
    draw. The key is recognizing that "at least one" is easiest as one minus "none."'
  distractor_types:
    A: wrong_setup
    B: last_step_trap
    C: partial_answer
