  question_text: Maya wants to make clear that Ben was the only person she told about
    the surprise — she told him and no one else. Which sentence most clearly expresses
    that meaning?
  choice_a: Only Maya told Ben about the surprise.
  choice_b: Maya only told Ben about the surprise.
  choice_c: Maya told only Ben about the surprise.
  choice_d: Maya told Ben about only the surprise.
  correct_answer: C
  explanation: Every one of these sounds perfectly natural read aloud, so the ear
    is no help at all — the answer depends entirely on what the word "only" is attached
    to. The intended meaning is that Ben was the sole person told, which means "only"
    must sit right before "Ben." That's C. In A, "only" lands on "Maya," so the sentence
    now says Maya was the only teller — no one besides her told Ben — which is a different
    claim. B is the trap, because in everyday speech people do say "only told Ben"
    to mean this; but placed before the verb, "only" strictly limits the action, saying
    Maya merely told him (rather than, say, showed him), which blurs the point instead
    of nailing it. In D, "only" attaches to "the surprise," making it the sole topic
    — Maya told Ben about nothing except the surprise — again a different meaning.
    The sentence turns on placement, not sound, which is exactly why it can't be solved
    by ear.
  distractor_types:
    A: changes_meaning
    B: partly_true_but_wrong
    D: changes_meaning
