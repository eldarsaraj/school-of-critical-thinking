  question_text: "Read this paragraph.\r\n\r\n(1) The lyrebird, a shy resident of\
    \ Australian forests, possesses one of the most astonishing voices in the animal\
    \ world. (2) Able to imitate not only other birds but chainsaws, camera shutters,\
    \ and car alarms, almost any sound the lyrebird hears can be reproduced with startling\
    \ accuracy. (3) Males perform these imitations during elaborate courtship displays.\
    \ (4) Scientists believe the ability may help females judge a mate's fitness.\r\
    \n\r\nWhich sentence contains an error in its construction and should be revised?"
  choice_a: sentence 1
  choice_b: sentence 2
  choice_c: sentence 3
  choice_d: sentence 4
  correct_answer: B
  explanation: 'Sentence 2 opens with the phrase "Able to imitate not only other birds
    but chainsaws, camera shutters, and car alarms." A phrase like this describes
    the noun that immediately follows it, so whatever comes next must be the thing
    that is able to imitate those sounds — which can only be the lyrebird. But the
    sentence puts "almost any sound the lyrebird hears" in that spot, so it reads
    as though the sounds are able to imitate chainsaws and car alarms, which is impossible;
    the sounds are what gets imitated, not what does the imitating. That misattachment
    is the error, so B is correct. Sentence 1 is sound: its opening description, "a
    shy resident of Australian forests," correctly describes the lyrebird right beside
    it. Sentences 3 and 4 are both straightforward, complete statements with no such
    flaw. The difficulty is that sentence 2 reads smoothly and its meaning is easy
    to guess, so the mistake is easy to slide past unless you check what its opening
    phrase actually attaches to.'
  distractor_types:
    A: misattributed_error_location
    C: misattributed_error_location
    D: misattributed_error_location
- section: ELA
  stage: hard_module
  question_number: 11
  question_type: multiple_choice
  skill: main_idea
  difficulty: hard
  topic: ''
  passage_group_id: ela_h_p1
  passage_title: The Darkness Between the Stars
  passage_text: "The most important thing in the night sky is not the stars, but the\
    \ darkness that lies between them. We look up, register the bright points, and\
    \ take the black spaces entirely for granted — an empty background against which\
    \ the stars happen to be scattered, as unremarkable to us as the blank paper beneath\
    \ a drawing. Yet that darkness is neither background nor empty of meaning. It\
    \ is among the deepest facts in all of nature, and for the greater part of human\
    \ history no one suspected there was anything in it that needed explaining.\r\n\
    \r\nSuppose, as people did for a very long time, that the universe is infinite\
    \ and has always existed, its stars strewn more or less evenly throughout the\
    \ whole of it, on and on without any end. Now imagine standing somewhere near\
    \ the middle of such a universe and looking outward along a single direction —\
    \ straight overhead, let us say. The line of your sight leaves your eye and travels\
    \ away from you forever; and if the stars themselves go on forever as well, then\
    \ sooner or later, whether nearby or at some unimaginable remove, that line is\
    \ bound to run up against the burning surface of a star. It cannot miss. Choose\
    \ a second direction and precisely the same must hold; choose every direction\
    \ there is, and each one of them ends, at some distance or other, upon a star.\r\
    \n\r\nThe conclusion that follows is difficult to escape, and a good deal stranger\
    \ than it sounds at first hearing. In a universe both infinite and ageless, every\
    \ single point on the sky — not the majority of points but every last one of them\
    \ — would sit at the far end of a line terminating on a burning surface, so that\
    \ the night would not appear as a scatter of bright dots across a field of black.\
    \ It would instead be a seamless sheet of starlight, blazing in all directions\
    \ at once, as brilliant as the face of the sun, without a single gap of darkness\
    \ anywhere within it. Stand deep enough inside a forest and you will find no openings\
    \ there either: look between the nearest trunks and you meet farther ones behind\
    \ them, and between those farther ones, farther ones still, until at last the\
    \ receding trees close ranks into a solid, unbroken wall. An endless universe\
    \ crowded with stars ought, by the same reasoning, to wall us in — though in light\
    \ rather than in timber.\r\n\r\nAnd yet one has only to open one's eyes to see\
    \ that it does no such thing. The night is, overwhelmingly, dark. Between its\
    \ scattered stars lie enormous tracts of unrelieved black, and the sky at midnight\
    \ falls immeasurably short of the brightness of the sun — a fact so thoroughly\
    \ familiar that its underlying strangeness has become invisible to us. Something\
    \ in the chain of reasoning must therefore be broken somewhere, and one of the\
    \ quiet assumptions we allowed ourselves at the very outset cannot possibly be\
    \ true. It is not the assumption about the stars, which do genuinely appear to\
    \ be distributed fairly evenly through space. The fatal assumption is the other\
    \ one, the one that seemed far too obvious to be worth doubting — that the universe\
    \ has simply always been here.\r\n\r\nLight is exceedingly swift, but it is not\
    \ infinitely swift. It requires time to cross any distance, and the greater that\
    \ distance grows, the longer the crossing must take, so that when you look up\
    \ at a star you do not see the star as it is now but only as it once was, at the\
    \ moment its light first set out toward you, whether years or centuries or whole\
    \ ages ago. And if the universe is not in fact eternal, but began instead at some\
    \ definite moment in the finite past, then light has been granted only so much\
    \ time in which to travel since that beginning, and we can see only so far out\
    \ into space as light has yet contrived to reach us across. Beyond that edge there\
    \ may well be stars ranged in every direction, exactly as the older argument so\
    \ confidently demanded; but the light of those stars is still crossing the immense\
    \ gulf between them and us, still somewhere in transit, not yet arrived and perhaps\
    \ for ages more to come. The darkness between the stars is not, then, an emptiness\
    \ at all. It is light that has not yet had the time to reach us.\r\n\r\nA second\
    \ reason, subtler than the first, deepens the darkness further. The universe is\
    \ not merely finite in its age; it is also expanding, with every distant object\
    \ drifting steadily away from every other. Light attempting to cross so continually\
    \ swelling a space is stretched as it travels, its waves drawn longer and longer,\
    \ its color sliding down and out of the visible altogether, past the red and into\
    \ wavelengths the human eye was never constructed to detect. What faint glow does\
    \ arrive from the farthest reaches arrives so stretched and cooled that we cannot\
    \ see it at all, having slipped beneath the lowest threshold of sight, so that\
    \ even the last dim edge of whatever might once have shone for us is erased from\
    \ the picture.\r\n\r\nSo the blackness overhead turns out to be the precise opposite\
    \ of nothing. It is a measurement — one plain enough for a child to make, and\
    \ ancient enough to have sat waiting since the first human being troubled to look\
    \ up. Its reading is set down in no numbers and calls for no instrument; it is\
    \ simply there, resting in the gaps between the stars, available to anyone who\
    \ thinks to wonder why those gaps should be dark. A child who asks that one small\
    \ question has, without the least awareness of having done so, asked among the\
    \ largest questions it is possible to ask: whether the universe has run on forever\
    \ or instead had a beginning. And the darkness, patient and unmistakable, returns\
    \ its answer. There was a beginning. The night has been telling us so the whole\
    \ time."
  question_text: Which statement best captures the central idea of the passage?
  choice_a: The night sky is dark because most of the universe is empty space rather
    than stars, and even the light of the nearest stars is faint by the time it reaches
    Earth.
  choice_b: The darkness of the night sky, reasoned through carefully, cannot occur
    in a universe that is both infinite and eternal, and so it stands as evidence
    that the universe had a beginning.
  choice_c: The expansion of the universe stretches the light of distant stars until
    it slides out of the visible range, which is the reason so little starlight ever
    reaches our eyes.
  choice_d: Ordinary observations that people overlook can, when examined by scientists
    with the proper instruments, turn out to hold profound truths about the cosmos.
  correct_answer: B
  explanation: 'The whole passage builds one argument: if the universe were infinite
    and had always existed, every direction would end on a star and the sky would
    blaze without a single dark gap; since the sky is instead dark, one of those assumptions
    must be false, and the false one is that the universe is eternal — so the darkness
    itself proves the universe began. B states exactly that chain and its conclusion.
    A sounds reasonable but contradicts the passage''s core reasoning: the argument
    shows that empty space cannot explain the darkness, because in an infinite eternal
    universe even the empty-looking directions would still end on distant stars; the
    real cause is the universe''s finite age, not its emptiness. C names a real point
    from the passage — the stretching of light by expansion — but the passage presents
    that only as the second and subtler reason, "deepen[ing]" a darkness the finite
    age already explains, so it is a supporting detail, not the central idea. D climbs
    to a vague generality about overlooked observations, and it even misstates the
    passage, which stresses that this particular reading requires "no instrument"
    at all; a central-idea answer must be the size of this argument, not a slogan
    that could head almost any science article.'
  distractor_types:
    A: partly_true_but_wrong
    C: too_narrow
    D: too_broad
- section: ELA
  stage: hard_module
  question_number: 12
  question_type: multiple_choice
  skill: inference
  difficulty: hard
  topic: ''
  passage_group_id: ela_h_p1
  passage_title: The Darkness Between the Stars
  passage_text: "The most important thing in the night sky is not the stars, but the\
    \ darkness that lies between them. We look up, register the bright points, and\
    \ take the black spaces entirely for granted — an empty background against which\
    \ the stars happen to be scattered, as unremarkable to us as the blank paper beneath\
    \ a drawing. Yet that darkness is neither background nor empty of meaning. It\
    \ is among the deepest facts in all of nature, and for the greater part of human\
    \ history no one suspected there was anything in it that needed explaining.\r\n\
    \r\nSuppose, as people did for a very long time, that the universe is infinite\
    \ and has always existed, its stars strewn more or less evenly throughout the\
    \ whole of it, on and on without any end. Now imagine standing somewhere near\
    \ the middle of such a universe and looking outward along a single direction —\
    \ straight overhead, let us say. The line of your sight leaves your eye and travels\
    \ away from you forever; and if the stars themselves go on forever as well, then\
    \ sooner or later, whether nearby or at some unimaginable remove, that line is\
    \ bound to run up against the burning surface of a star. It cannot miss. Choose\
    \ a second direction and precisely the same must hold; choose every direction\
    \ there is, and each one of them ends, at some distance or other, upon a star.\r\
    \n\r\nThe conclusion that follows is difficult to escape, and a good deal stranger\
    \ than it sounds at first hearing. In a universe both infinite and ageless, every\
    \ single point on the sky — not the majority of points but every last one of them\
    \ — would sit at the far end of a line terminating on a burning surface, so that\
    \ the night would not appear as a scatter of bright dots across a field of black.\
    \ It would instead be a seamless sheet of starlight, blazing in all directions\
    \ at once, as brilliant as the face of the sun, without a single gap of darkness\
    \ anywhere within it. Stand deep enough inside a forest and you will find no openings\
    \ there either: look between the nearest trunks and you meet farther ones behind\
    \ them, and between those farther ones, farther ones still, until at last the\
    \ receding trees close ranks into a solid, unbroken wall. An endless universe\
    \ crowded with stars ought, by the same reasoning, to wall us in — though in light\
    \ rather than in timber.\r\n\r\nAnd yet one has only to open one's eyes to see\
    \ that it does no such thing. The night is, overwhelmingly, dark. Between its\
    \ scattered stars lie enormous tracts of unrelieved black, and the sky at midnight\
    \ falls immeasurably short of the brightness of the sun — a fact so thoroughly\
    \ familiar that its underlying strangeness has become invisible to us. Something\
    \ in the chain of reasoning must therefore be broken somewhere, and one of the\
    \ quiet assumptions we allowed ourselves at the very outset cannot possibly be\
    \ true. It is not the assumption about the stars, which do genuinely appear to\
    \ be distributed fairly evenly through space. The fatal assumption is the other\
    \ one, the one that seemed far too obvious to be worth doubting — that the universe\
    \ has simply always been here.\r\n\r\nLight is exceedingly swift, but it is not\
    \ infinitely swift. It requires time to cross any distance, and the greater that\
    \ distance grows, the longer the crossing must take, so that when you look up\
    \ at a star you do not see the star as it is now but only as it once was, at the\
    \ moment its light first set out toward you, whether years or centuries or whole\
    \ ages ago. And if the universe is not in fact eternal, but began instead at some\
    \ definite moment in the finite past, then light has been granted only so much\
    \ time in which to travel since that beginning, and we can see only so far out\
    \ into space as light has yet contrived to reach us across. Beyond that edge there\
    \ may well be stars ranged in every direction, exactly as the older argument so\
    \ confidently demanded; but the light of those stars is still crossing the immense\
    \ gulf between them and us, still somewhere in transit, not yet arrived and perhaps\
    \ for ages more to come. The darkness between the stars is not, then, an emptiness\
    \ at all. It is light that has not yet had the time to reach us.\r\n\r\nA second\
    \ reason, subtler than the first, deepens the darkness further. The universe is\
    \ not merely finite in its age; it is also expanding, with every distant object\
    \ drifting steadily away from every other. Light attempting to cross so continually\
    \ swelling a space is stretched as it travels, its waves drawn longer and longer,\
    \ its color sliding down and out of the visible altogether, past the red and into\
    \ wavelengths the human eye was never constructed to detect. What faint glow does\
    \ arrive from the farthest reaches arrives so stretched and cooled that we cannot\
    \ see it at all, having slipped beneath the lowest threshold of sight, so that\
    \ even the last dim edge of whatever might once have shone for us is erased from\
    \ the picture.\r\n\r\nSo the blackness overhead turns out to be the precise opposite\
    \ of nothing. It is a measurement — one plain enough for a child to make, and\
    \ ancient enough to have sat waiting since the first human being troubled to look\
    \ up. Its reading is set down in no numbers and calls for no instrument; it is\
    \ simply there, resting in the gaps between the stars, available to anyone who\
    \ thinks to wonder why those gaps should be dark. A child who asks that one small\
    \ question has, without the least awareness of having done so, asked among the\
    \ largest questions it is possible to ask: whether the universe has run on forever\
    \ or instead had a beginning. And the darkness, patient and unmistakable, returns\
    \ its answer. There was a beginning. The night has been telling us so the whole\
    \ time."
  question_text: Which conclusion about the sightline argument does the passage most
    strongly support?
  choice_a: The brightness of the sky in an infinite, eternal universe would depend
    on how densely the stars were packed together.
  choice_b: In an infinite, eternal universe, the sky's brightness would come from
    a few enormously large stars rather than from all of them.
  choice_c: In an infinite, eternal universe, a star's distance would make no difference
    to whether that direction of the sky ended up bright.
  choice_d: The stars nearest to us would contribute far more to the sky's total brightness
    than the countless stars beyond them.
  correct_answer: C
  explanation: 'The argument''s force comes from a claim about every direction, not
    most: however far you must go, a line of sight in an infinite, eternal universe
    must eventually strike a star''s surface, so distance is powerless to leave any
    direction dark — it only pushes the star that closes off that direction farther
    away. C states exactly this: distance cannot decide whether a direction ends bright,
    because sooner or later every direction ends on a star regardless. A brings in
    packing density, but the argument''s conclusion doesn''t hinge on how tightly
    stars are spaced; even a sparse but endless scattering guarantees that every line
    eventually lands on one, so the sky fills with light either way. B invents a special
    role for a few giant stars, a distinction the passage never draws; in its reasoning
    the light comes from all of them, near and far alike. D reverses the argument''s
    whole point — that the far stars matter as much as the near ones. It is precisely
    because the endless ranks of distant stars keep filling in every remaining gap
    (as the farther and farther trees do in the forest) that no darkness can survive;
    treating the near stars as what count misses why the conclusion is inescapable.'
  distractor_types:
    A: wrong_concept
    B: misidentified_detail
    D: inference_leap
