    B: wrong_concept
    C: too_literal
    D: inference_leap
- section: ELA
  stage: easy_module
  question_number: 12
  question_type: multiple_choice
  skill: supporting_detail
  difficulty: medium
  topic: ''
  passage_group_id: ela_e_p1
  passage_title: A Plant That Keeps Count
  passage_text: "IIn the boggy lowlands of the Carolinas grows a plant that seems\
    \ to ignore the rules the rest of its kind obey. The Venus flytrap does not stand\
    \ quietly in the sun and wait for nourishment to arrive on the breeze. It hunts.\
    \ Each of its leaves ends in a pair of hinged lobes, fringed with interlocking\
    \ spines, that can swing shut around an insect in a fraction of a second — among\
    \ the swiftest movements any plant is known to perform. Yet the trap's true marvel\
    \ is not its speed, remarkable as that is. It is the strange, almost deliberate\
    \ manner in which the plant decides the precise moment to spring.\r\n\r\nA flytrap\
    \ hunts because the ground beneath it cannot nourish it adequately. The waterlogged\
    \ soil of its native bogs holds very little nitrogen, the nutrient most plants\
    \ draw up through their roots to manufacture leaves and stems. Where the soil\
    \ falls short, the flytrap compensates by capturing animals instead. A single\
    \ visiting insect supplies the nitrogen the roots cannot extract from the mud,\
    \ and so a plant that might have starved in its barren surroundings instead turns\
    \ the tables, dining on the very creatures that wander across it.\r\n\r\nThe snap\
    \ itself is a small feat of engineering. While a trap waits, its two lobes are\
    \ held open under tension, bowed gently outward like a sheet of plastic pressed\
    \ into a curve. The faintest trigger flips them the other way in an instant, from\
    \ curving outward to curving inward, and the trap slams closed before a startled\
    \ insect can react. The spines along the rims then mesh together like the bars\
    \ of a tiny cage. The very smallest insects can still squeeze between them and\
    \ escape — no great loss, since such a morsel would scarcely repay the cost of\
    \ a meal — while anything larger is sealed inside, and the lobes press flat to\
    \ form a chamber in which digestion can begin.\r\nClosing a trap, however, is\
    \ expensive, and one that snaps shut on a raindrop or a windblown speck squanders\
    \ energy the plant can ill afford. To guard against such errors, the flytrap counts.\
    \ On the inner surface of each lobe stand a few slender hairs, so fine that a\
    \ careless eye slides right over them. A single touch accomplishes nothing, and\
    \ the trap remains open. Only when a second touch arrives within roughly half\
    \ a minute of the first do the lobes finally close — a simple test that a lone\
    \ gust or a falling drop will seldom pass, but that a crawling insect, jostling\
    \ the hairs again and again, can hardly fail.\r\n\r\nEach time one of those hairs\
    \ is bent, it discharges a faint pulse of electricity across the leaf, much like\
    \ the signals that travel along the nerves of an animal. The flytrap, however,\
    \ possesses no nerves and no brain, nothing a person would recognize as a mind;\
    \ the pulses are merely how it keeps its tally. Nor does the counting cease once\
    \ the trap has shut. As the captured insect goes on struggling, every fresh contact\
    \ adds to the count, and the higher that number climbs, the more digestive fluid\
    \ the plant secretes. A trap registering only a touch or two barely stirs, while\
    \ one that feels a prolonged struggle floods itself with the chemicals that dissolve\
    \ a meal. In effect, the plant estimates the size of its catch and invests only\
    \ as much effort as the catch is likely to repay.\r\n\r\nNone of this can be repeated\
    \ indefinitely. A single trap closes only a handful of times before it wears out\
    \ and is shed, replaced by a fresh leaf, so every snap is a wager the plant cannot\
    \ afford to lose for nothing. Viewed in that light, the flytrap's hesitation begins\
    \ to look less like sluggishness than like sound judgment. What appears at first\
    \ to be a mindless jaw, poised to slam, behaves instead like a meticulous bookkeeper,\
    \ tallying its accounts in flickers of electricity and declining to pay for a\
    \ meal it has not caught. The plant cannot think. And yet, in the single currency\
    \ that truly matters to it — energy — it spends with a caution that many a thinking\
    \ creature might do well to envy."
  question_text: According to the passage, what happens at the instant a trap is triggered?
  choice_a: Its spines mesh together and the lobes press flat, sealing in the prey.
  choice_b: It sends a pulse of electricity down through its stem to the roots.
  choice_c: It gradually tightens its grip on the insect over the course of several
    minutes.
  choice_d: Its lobes reverse their curve, snapping from bowed outward to bowed inward.
  correct_answer: D
  explanation: 'Paragraph 3 describes a waiting trap as held "bowed gently outward,"
    and says the faintest trigger "flips them the other way in an instant, from curving
    outward to curving inward." That reversal of the curve is the snap, which makes
    D correct. A names a real detail but the wrong stage: the spines meshing and the
    lobes pressing flat happen after the trap has closed, to seal a meal in — not
    at the moment of triggering. B borrows the electrical pulse from a later paragraph
    and then sends it the wrong direction; the passage says the pulse runs "across
    the leaf," not down a stem to the roots. C runs against the passage''s whole emphasis
    on speed — the trap "slams closed before a startled insect can react," so a slow,
    minutes-long tightening is the opposite of what happens; the only slow process
    described is digestion, which comes later.'
  distractor_types:
    A: misidentified_detail
    B: misidentified_detail
    C: opposite
