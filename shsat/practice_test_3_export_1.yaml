  explanation: 'Days of the week repeat every 7 days, so only the remainder after
    dividing by 7 matters. Since 200 = 28 × 7 + 4, the 200 days amount to 28 full
    weeks plus 4 extra days. Twenty-eight full weeks land back on the same weekday,
    so blooming day is just 4 days ahead of planting day. Because we know the blooming
    day (Friday) and want the earlier planting day, we count 4 days backward: Friday
    → Thursday → Wednesday → Tuesday → Monday. So the tree was planted on a Monday.
    Choice C, Tuesday, counts the 4 days forward from Friday instead of backward —
    the most common mistake, since "200 days later" tempts you to add. Choice D, Thursday,
    uses a remainder of 1 instead of 4 (miscomputing 200 ÷ 7), and choice A, Sunday,
    uses a remainder of 5 — each an error in finding how many extra days are left
