    negative: −4(3 − x) = −12 + 4x, so the right side is 2x − 12 + 4x = 6x − 12. The
    inequality becomes 4x − 18 > 6x − 12. Move the x-terms to one side: 4x − 6x >
    −12 + 18, which is −2x > 6. Now divide both sides by −2 — and because that divisor
    is negative, the inequality sign flips — giving x < −3. Choice B, x > −3, has
    the right boundary but keeps the sign as ">", forgetting to flip when dividing
    by the negative — the single most common error here. Choice A, x > 1, comes from
    a distribution slip, writing −4(3 − x) as −12 − 4x. Choice D, x < 15, comes from
    combining the constants wrong (−12 − 18 instead of −12 + 18). The two care points
    are distributing the negative correctly and flipping the sign when dividing by
    −2.'
