  question_text: According to the passage, why did Millikan's repeated measurements
    fail to settle on a single, consistent number?
  choice_a: Because the electric charge he switched on to hold each drop in place
    shifted slightly from one trial to the next
  choice_b: Because tiny, unavoidable interferences knocked each reading a little
    off the mark
  choice_c: Because the true value he was chasing was itself drifting while he worked
  choice_d: Because oil drops of different sizes fall at different speeds, making
    one shared number impossible
  correct_answer: B
  explanation: 'The passage explains that each reading was thrown off by small disturbances
    Millikan couldn''t fully control — a bit of moving warm air, a speck of dust,
    his own unsteady eye at the lens. B captures that cause without copying the wording,
    so it can''t be found by matching phrases; a student has to understand that the
    scatter came from outside interference. The other three deliberately reuse the
    passage''s vocabulary while getting the idea wrong. A points at the electric charge,
    but the passage treats the field as a tool Millikan switched on to control the
    drops, not something wavering on its own. C contradicts a key line: the value
    he sought is called the "steady value hidden underneath," fixed rather than drifting.
    D borrows "oil drops" and "fall" and sounds like real physics, but the passage
    never blames drop size — it blames disturbance — so that explanation isn''t supported
    by the text.'
  distractor_types:
    A: misidentified_detail
    C: wrong_concept
    D: partly_true_but_wrong
