  explanation: Averages have to be handled through totals, not the averages themselves.
    To average 20 stops over 5 days, the driver needs 20 × 5 = 100 stops in all. The
    first 4 days already produced 18 × 4 = 72 stops. So the fifth day must supply
    100 − 72 = 28 stops. Choice C, 20, assumes the fifth day just equals the target
    average, but a single high day is needed to pull the average up, so it must exceed
    20. Choice A, 8, uses 4 days for the target total (20 × 4 = 80, then 80 − 72),
    and choice B, 10, uses 5 days for the days already completed (18 × 5 = 90, then
    100 − 90) — each mismatches the number of days in one of the two totals. Only
    lining up 5 days for the goal and 4 days for what's done gives 28.
