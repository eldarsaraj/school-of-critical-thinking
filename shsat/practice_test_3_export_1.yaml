    instead of the two collection totals — comparing one binder to one binder rather
    than the whole collection to the whole new capacity. Choices C and D, 370 and
    380, are close to the right answer but come from a small slip in one of the two
    multiplications (for example, computing 6 × 340 as 2,030 or 2,020). The safe path
