  question_text: "Read the paragraph, then answer the question.\r\n\r\n(1) After Rosa\
    \ and her sister Marta finished planting the garden, they went inside to make\
    \ lunch. (2) Rosa washed the vegetables while Marta set the table. (3) When the\
    \ meal was ready, she called their parents to come and eat. (4) Everyone agreed\
    \ that the fresh salad was the best part of the day.\r\n\r\nWhich revision of\
    \ sentence 3 most clearly corrects the unclear reference?"
  choice_a: When the meal was ready, she called their parents to come and eat quickly.
  choice_b: When the meal was ready, they called their parents to come and eat.
  choice_c: When the meal was ready, Rosa called their parents to come and eat.
  choice_d: When it was ready, she called their parents to come and eat.
  correct_answer: C
  explanation: 'The paragraph puts two sisters, Rosa and Marta, side by side, both
    busy in the kitchen — so when sentence 3 says "she called their parents," the
    word "she" could point to either one. That''s an unclear pronoun reference, and
    the fix is to replace the vague "she" with a specific name while leaving everything
    else alone. C does exactly that. A edits the wrong part of the sentence entirely:
    it tacks on "quickly" but leaves "she" every bit as ambiguous as before. B trades
    one problem for another — "they" not only still fails to say who made the call,
    it changes the meaning, suggesting both sisters called together. D swaps "the
    meal" for "it," which adds a second murky pronoun instead of clearing up the first,
    so now both "it" and "she" are unclear. Only C removes the ambiguity without creating
    a new one.'
