  question_text: A cylindrical tank has a radius of 5 feet and a height of 14 feet.
    When full, the tank is drained at a steady rate of 22 cubic feet per minute. How
    many minutes does it take to empty the full tank? (Use π ≈ 22⁄7.)
  choice_a: '10'
  choice_b: '50'
  choice_c: '200'
  choice_d: 1,100
  correct_answer: B
  explanation: 'First find the tank''s volume with V = π r² h. Using π ≈ 22⁄7: V =
    (22⁄7)(5²)(14) = (22⁄7)(25)(14). Since 25 × 14 = 350 and 350 ÷ 7 = 50, the volume
    is 22 × 50 = 1,100 cubic feet. Then divide by the drain rate: 1,100 ÷ 22 = 50
    minutes. Choice D, 1,100, is the volume itself, forgetting to divide by the rate.
    Choice A, 10, uses π r h instead of π r² h — forgetting to square the radius,
    the most common cylinder-volume slip. Choice C, 200, uses the diameter (10) in
    place of the radius, which multiplies the volume by four and the time along with
    it.'
  distractor_types:
    A: wrong_formula
    C: wrong_setup
    D: partial_answer
