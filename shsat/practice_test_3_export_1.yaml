  passage_text: ''
  question_text: "Which edit should be made to the sentence below?\r\n\r\n\"The crate\
    \ of antique tools and rusted hinges were hauled out of the old barn.\""
  choice_a: Change "crate" to "crates."
  choice_b: Change "hinges" to "hinge."
  choice_c: Change "were hauled" to "was being hauled."
  choice_d: Change "were" to "was."
  correct_answer: D
  explanation: 'The subject of the sentence is "crate," which is singular, so the
    verb must be "was." The plural words that pull the ear the other way — "tools"
    and "hinges" — sit inside the phrase "of antique tools and rusted hinges," which
    describes the crate but doesn''t control the verb. D fixes exactly that. A is
    the sharp trap: making the subject "crates" does technically agree with "were,"
    but it repairs the sentence by changing the meaning — one crate becomes several
    — rather than correcting the verb. B edits a noun buried in the prepositional
    phrase, a word that was never the subject, and leaves the real disagreement untouched.
    C is tempting because it does fix the number ("was"), but it goes further than
    the error requires, trading the plain past tense for a drawn-out progressive and
    changing how the action reads.'
  distractor_types:
    A: changes_meaning
    B: misattributed_error_location
    C: overcorrection
