  question_text: The passage is careful to give ground shaking and released energy
    two different growth rates — shaking rising tenfold per step, energy about thirty-twofold.
    This difference implies that, as earthquakes grow larger,
  choice_a: the shaking and the energy eventually climb at the same rate and converge
  choice_b: the energy released begins to level off while the shaking keeps on climbing
  choice_c: the shaking becomes an ever more reliable measure of a quake's true power
