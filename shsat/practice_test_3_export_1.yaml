  question_text: How would the writer of Passage 1 most likely respond to the pianist
    example in Passage 2?
  choice_a: By agreeing that the pianist's success proves excellence depends on abandoning
    nearly everything one begins.
  choice_b: By pointing out that the pianist did not quit the piano itself, but pushed
    through its difficult middle while giving up the rest.
  choice_c: By arguing that the pianist would have led a fuller life had she kept
    up the soccer, the chess, and the other instruments.
  choice_d: By questioning whether a single childhood talent can really demand the
    surrender of every other interest.
  correct_answer: B
  explanation: 'Passage 2 offers the pianist as proof that mastery comes from quitting
    — she gave up soccer, chess, and three other instruments. But Passage 1''s whole
    argument is about the one thing a person doesn''t quit: the piano, in this case,
    whose trough the pianist must have ground through to become great. So Passage
    1''s writer would seize on the half of the story Passage 2 leaves quiet — that
    the pianist quit everything except the piano, and reached mastery by refusing
    to abandon that one pursuit when it grew hard. That is B, and it turns the same
    example to the opposite purpose. A has Passage 1 simply conceding Passage 2''s
    point, which abandons its own thesis; Passage 1 would never grant that success
    is mainly about quitting. C imagines Passage 1 recommending that the pianist keep
    all her activities, but Passage 1 never argues against focus or in favor of doing
    everything — it argues against giving up when things get difficult, a different
