  question_text: The passage suggests that the late appearance of a word for blue
    in human languages was most likely due to
  choice_a: the inability of people in ancient times to see the color blue as we see
    it now.
  choice_b: early languages being too simple to hold as many color words as modern
    ones do.
  choice_c: blue being naturally harder for the human eye to tell apart than red or
