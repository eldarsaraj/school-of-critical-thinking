  passage_text: '(1) Today almost every product for sale is marked with a small block
    of black and white stripes, and a checkout scanner can read that pattern in a
    fraction of a second. (2) The design looks thoroughly modern, yet the idea behind
    it is surprisingly old. (3) In the late 1940s, two inventors set out to find a
    way of encoding a product''s information in a form that a machine could read on
    its own. (4) One of them, sitting on a beach one afternoon, drew a set of lines
    in the sand, adapting the dots and dashes of Morse code into stripes of varying
    width. (5) The idea was ingenious, however, the machines that might have put it
    to use did not yet exist. (6) Reading such a code quickly demanded lasers and
    computers, and in those early years that equipment remained far too bulky, too
    slow, and too costly for an ordinary shop. (7) And so the invention waited for
    nearly twenty years. (8) Eventually the technology caught up. (9) Computers shrank,
    lasers grew cheaper, and scanners at last became small and reliable enough to
    earn a place beside the cash register. (10) A group of competing companies then
    did something they had rarely done before: they agreed on a single standard pattern.
    (11) Printed according to that one shared standard, a scanner anywhere in the
    country could read the very same code. (12) The benefit of these codes to busy
    retailers were obvious. (13) The first product ever swept across a checkout scanner,
    in the early 1970s, was an ordinary pack of chewing gum. (14) Chewing gum, as
    it happens, has been enjoyed in one form or another for thousands of years. (15)
    Almost without anyone noticing, a pattern once scratched idly into the sand had
    become one of the most common symbols on Earth.'
  question_text: Which revision of sentence 5 best corrects the error?
  choice_a: The idea was ingenious; however, the machines that might have put it to
    use did not yet exist.
  choice_b: The idea was ingenious, the machines that might have put it to use, however,
    did not yet exist.
  choice_c: The idea was ingenious, but, the machines that might have put it to use
    did not yet exist.
  choice_d: Although the idea was ingenious, however, the machines that might have
    put it to use did not yet exist.
  correct_answer: A
  explanation: 'Sentence 5 joins two complete statements — "The idea was ingenious"
    and "the machines … did not yet exist" — with only a comma and the word "however."
    But "however" is a linking adverb, not a true conjunction, so it can''t splice
    two full sentences together that way. The fix is a semicolon before it and a comma
    after, which is exactly what A does. B is the cleverest trap: it slides "however"
    into the middle of the second statement, which reads smoothly, but the two main
    clauses are still held together by nothing more than the comma after "ingenious"
    — the splice is untouched, just disguised. C reaches for the right tool, the coordinating
    conjunction "but," which would join the clauses correctly — and then spoils it
    with a stray comma after "but," fixing one problem while creating another. D piles
    a second contrast word onto the first: "Although" already signals the contrast,
    so adding "however" on top of it is redundant and ungrammatical, an overcorrection
    that two-times a job meant for one word.'
