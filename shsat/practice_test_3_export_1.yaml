  question_text: Marcus made p bracelets. Dana made four times as many bracelets as
    Marcus. Together, Marcus and Dana made 6 fewer bracelets than Elena. Which expression
    shows how many bracelets Elena made?
  choice_a: 4p² + 6
  choice_b: 5p + 6
  choice_c: 5p − 6
  choice_d: 6 − 5p
  correct_answer: B
  explanation: Marcus made p bracelets and Dana made four times that, 4p, so together
    they made p + 4p = 5p. The phrase "Marcus and Dana made 6 fewer bracelets than
    Elena" means their total is 6 less than Elena's, so 5p = Elena − 6. Adding 6 to
    both sides gives Elena = 5p + 6. Choice C, 5p − 6, subtracts the 6 instead of
    adding it — that would make Elena the one with fewer, the opposite of what the
    problem says. Choice D, 6 − 5p, reverses the relationship entirely. Choice A,
    4p² + 6, comes from multiplying Marcus's and Dana's amounts (p × 4p = 4p²) instead
    of adding them, since "together" means a sum, not a product.
