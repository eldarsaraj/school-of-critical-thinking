    \ the plant secretes. A trap registering only a touch or two barely stirs, while\
    \ one that feels a prolonged struggle floods itself with the chemicals that dissolve\
    \ a meal. In effect, the plant estimates the size of its catch and invests only\
    \ as much effort as the catch is likely to repay.\r\n\r\nNone of this can be repeated\
    \ indefinitely. A single trap closes only a handful of times before it wears out\
    \ and is shed, replaced by a fresh leaf, so every snap is a wager the plant cannot\
    \ afford to lose for nothing. Viewed in that light, the flytrap's hesitation begins\
    \ to look less like sluggishness than like sound judgment. What appears at first\
    \ to be a mindless jaw, poised to slam, behaves instead like a meticulous bookkeeper,\
    \ tallying its accounts in flickers of electricity and declining to pay for a\
    \ meal it has not caught. The plant cannot think. And yet, in the single currency\
    \ that truly matters to it — energy — it spends with a caution that many a thinking\
    \ creature might do well to envy."
  question_text: Which statement best describes the central idea of the passage?
  choice_a: Though it has no mind, the flytrap hunts with striking economy, reading
    the pattern of an insect's touches to spend its scarce energy only where the reward
    is worth it.
  choice_b: The Venus flytrap can shut its lobes around an insect faster than almost
    any other plant in the world can move.
  choice_c: Forced to weigh each catch and choose its meals wisely, the Venus flytrap
    has developed a simple kind of intelligence that lets it reason a capture through
    before acting.
  choice_d: Because the boggy soil it grows in holds so little nitrogen, the Venus
    flytrap survives by catching insects rather than feeding through its roots alone.
  correct_answer: A
  explanation: 'The passage builds toward one idea: the flytrap''s real wonder isn''t
    how fast it snaps but how carefully it spends energy — ignoring single touches,
    closing only on a repeated pattern, and digesting in proportion to its catch —
    all while having "no nerves and no brain." A gathers that whole arc into one sentence.
    B states something true, but it names the very feature the passage sets aside
    in paragraph 1 ("the trap''s true marvel is not its speed"), so it elevates a
    side point to the main one. C is the strongest trap, because the passage does
    make the plant seem to choose wisely — yet it ends by insisting "The plant cannot
    think," so crediting the flytrap with "intelligence" that lets it "reason" directly
    contradicts the text''s central paradox. D captures only the setup from paragraph
    2 — why the plant hunts — and stops there, missing the counting and energy-economy
    that the rest of the passage is actually about.'
  distractor_types:
    B: too_narrow
    C: partly_true_but_wrong
    D: too_narrow
- section: ELA
  stage: easy_module
  question_number: 17
  question_type: multiple_choice
  skill: authors_craft
  difficulty: medium
  topic: ''
  passage_group_id: ela_e_p2
  passage_title: Not Ready Yet
  passage_text: "Every afternoon that July, Nadia climbed the splintery steps to her\
    \ grandfather's garage, where the old rowboat sat propped on two sawhorses like\
    \ a patient waiting for surgery. Pop had been restoring it for as long as she\
    \ could remember — longer, maybe, than she had been alive. The hull was the soft,\
    \ flaked gray of driftwood, and each day the two of them sanded another stretch\
    \ of it down to honey-colored wood, the fine dust settling on Nadia's arms like\
    \ pollen. She had wanted to spend the summer at the public pool with her friends,\
    \ the way she did every other year. Instead she was here, in the smell of sawdust\
    \ and old paint, sanding.\r\n\r\n\"When will it be done?\" she asked, the way\
    \ she asked most days.\r\n\r\nPop ran his thumb slowly along a seam and frowned,\
    \ as though the boat had murmured something only he could hear. \"Not ready yet,\"\
    \ he said. \"She'll let us know.\"\r\n\r\nNadia humored him at first, taking the\
    \ sandpaper with a sigh and watching the clock on the wall crawl toward five.\
    \ There was always one more seam to seal, one more soft spot to find, one more\
    \ coat of varnish that had to cure before the next could go on. The lake was only\
    \ twenty minutes down the road, blue and wide and waiting, and yet the boat never\
    \ seemed to get any nearer to it.\r\n\r\nOn the workbench, half hidden under a\
    \ jar of stiff brushes, lay a photograph curled at its corners. In it a young\
    \ man and a laughing woman sat together in the very same boat, the water behind\
    \ them bright as crumpled foil. Nadia knew without asking that the woman was her\
    \ grandmother, who had died before Nadia was born and whom Pop almost never mentioned.\
    \ But when he worked, he sometimes hummed a tune that seemed to have no name,\
    \ and his rough hands moved over the wood the way a person smooths a blanket across\
    \ someone who has fallen asleep. Nadia would watch him and feel that she had wandered\
    \ into the middle of a conversation she could not quite hear.\r\n\r\nOne slow\
    \ afternoon she ran her palm across a patch of the hull and found it already perfectly\
    \ smooth, smoother than the rest, and she said so out loud. Pop looked at the\
    \ spot for what felt like a long time. Then he reached up, took the stub of a\
    \ pencil from behind his ear, and drew a small gray circle right in the middle\
    \ of the good, finished wood. \"Looks like we missed one,\" he said quietly, and\
    \ set to sanding the place that did not need sanding at all. And that was the\
    \ moment Nadia understood something she could not yet have put into words. Pop\
    \ was not racing to finish the boat so they could carry it down to the lake. He\
    \ was doing the very opposite. Carefully, patiently, he was making the work last.\r\
    \n\r\nAfter that, the afternoons felt different, even though nothing about them\
    \ actually changed. They sanded the same gray boat down to the same warm wood;\
    \ Pop still said \"not ready yet\" whenever she asked, and Nadia simply stopped\
    \ waiting for him to say anything else. She began, instead, to notice things —\
    \ the way the late light leaned in sideways through the garage door at five o'clock\
    \ and turned the floating dust to gold, the grain of the wood opening up beneath\
    \ her hand like the fine lines of a palm, the steady and companionable weight\
    \ of her grandfather's silence beside her. The boat, she had begun to suspect,\
    \ might never once touch the water. And she was no longer certain that this was\
    \ the point. Some afternoons now, when Pop had stepped away or wasn't watching,\
    \ Nadia would hunt out a smooth and finished place of her own — and quietly sand\
    \ it all over again."
  question_text: The author compares the rowboat to "a patient waiting for surgery"
    (paragraph 1) most likely to suggest
  choice_a: a sense of dread that the boat may not survive the work being done to
    it
  choice_b: Nadia's impatience with a chore she would rather not be doing
  choice_c: the patient, exacting care with which the boat is treated, as though it
    were something to be healed
  choice_d: that the boat is too fragile and far gone to be worth the effort
  correct_answer: C
  explanation: The image shows the boat propped up and motionless, attended to the
    way a patient is readied for surgery — slow, precise, serious work done in order
    to heal. That comparison signals how tenderly and patiently Pop treats the restoration,
    and it sets the unhurried, careful mood that runs through the whole passage, which
    makes C correct. A overreads the word "surgery" as life-or-death and turns a gentle
    image into suspense and dread, a feeling the passage never creates. B reaches
    for a fact that is true elsewhere — Nadia would rather be at the pool — but this
    simile is about how the boat is handled, not about her mood; the comparison would
    mean the same thing no matter who was holding the sandpaper. D twists "waiting
    for surgery" into "beyond saving," yet a patient awaiting surgery is being cared
    for in hope of recovery, not given up on, so reading hopelessness into the image
    works against its sense of devoted attention.
  distractor_types:
    A: inference_leap
    B: misidentified_detail
    D: partly_true_but_wrong
