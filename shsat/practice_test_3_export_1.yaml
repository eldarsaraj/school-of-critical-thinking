    than Monday's, so the drop is 15% of $120 = $18. Choice A, $6.00, is the amount
    the price rose from Monday to Tuesday (5% of 120 = 126 − 120), not the amount
    it fell by Wednesday. Choice C, $18.90, takes 15% of Tuesday's $126 instead of
    Monday's $120 — the wrong starting amount. Choice D, $24.00, compares the wrong
    two days, subtracting Wednesday's $102 from Tuesday's $126. The two care points
