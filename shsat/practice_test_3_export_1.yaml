    chocolates are ⅓ of T, which leaves ⅔ of T remaining. Milk chocolates are ⅗ of
    that remainder, so milk = ⅗ × ⅔T = ⅖T. White chocolates are whatever is left of
    the remainder: ⅔T − ⅖T = 10⁄15 T − 6⁄15 T = 4⁄15 T. Setting 4⁄15 T = 24 gives
    T = 90. (Check: 30 dark, then of the 60 remaining, 36 milk and 24 white — totaling
    90.) Choice D, 360, treats milk as ⅗ of the whole box instead of ⅗ of the remainder,
    which shrinks white to 1⁄15 of the total. Choice A, 36, treats the 24 white chocolates
    as all the chocolates left after the dark ones, forgetting the milk chocolates.
