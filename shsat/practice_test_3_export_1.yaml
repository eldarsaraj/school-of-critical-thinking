  passage_title: Night Train
  passage_text: "Some nights the freight comes through past two,\r\nlong after the\
    \ town has folded itself to sleep,\r\nand I wake to the rails beginning to hum—\r\
    \nfirst one low note, then a rising ache of steel,\r\nthen the horn, unspooling\
    \ down the tunnel of the dark.\r\n\r\nI have never seen the place it's going to.\r\
    \nI know it only by the sound: how it swells\r\nagainst the window, works the\
    \ loose glass in its frame,\r\nand drags some stubborn part of me along behind—\r\
    \na part that wants to be a boxcar in that line,\r\nloaded and gone, addressed\
    \ to a town with no name I could find.\r\n\r\nThe house does not move. It never\
    \ has.\r\nThe porch light keeps its one small vigil;\r\nthe dog next door barks\
    \ once, then lets it go;\r\nand the silence settles back along the rails\r\nthe\
    \ way dust settles back on a shelf just cleaned.\r\n\r\nBy morning I can't be\
    \ sure the train was real.\r\nThe tracks lie cold and offer no reply,\r\naimed\
    \ at the two directions they have always aimed—\r\none running outward, one running\
    \ home—\r\nand I have never once been sure which one leads out."
  question_text: Which statement best expresses a central theme of the poem?
  choice_a: The comfort of home always proves stronger in the end than the temptation
    to leave it.
  choice_b: The speaker is torn between a longing to be carried off somewhere new
    and a life that stays fixed in place.
  choice_c: The sights and sounds of a passing train can stir the imagination of anyone
    who hears them.
  choice_d: The speaker deeply regrets never having left the small town in which the
    poem is set.
  correct_answer: B
  explanation: 'The poem sets two forces against each other and never settles them.
    On one side is the train and the "stubborn part" of the speaker that "wants to
    be a boxcar … loaded and gone"; on the other is the house that "does not move"
    and the town that stays as it always has. The final line — the speaker "never
    once … sure which one leads out" — leaves the tension open, which is exactly what
    B describes. A picks one side and declares it the winner ("home always proves
    stronger"), but the poem reaches no such conclusion; the longing to leave is still
    alive in the last line. C is true of trains in general but drifts away from this
    speaker''s specific inner conflict, flattening a personal struggle into a broad
    observation about "anyone." D overstates the feeling into "deeply regrets": the
    speaker yearns and wonders, but nothing says the choice to stay is settled or
    mourned — the whole point is that it remains undecided. Only B holds both sides
    of the tension the way the poem does.'
  distractor_types:
    A: partly_true_but_wrong
    C: too_broad
    D: inference_leap
