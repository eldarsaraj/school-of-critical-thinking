    in the things people could gather and crush and hold up to name" that it entered
    speech late — there were simply few blue things to point at and label. That''s
    D. The distractors are each a tempting rival theory the passage doesn''t support.
    A is the famous misconception, and the trap the question is built around: many
    people have heard that the ancients "couldn''t see blue," but the passage rules
