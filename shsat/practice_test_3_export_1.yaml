  question_text: As it is used in the third paragraph ("the familiar machinery of
    the morning would have started running hours too early"), the word "machinery"
    most nearly means
  choice_a: the ordinary, repeating routine by which the morning gets under way
  choice_b: the appliances and devices used to prepare a morning meal
  choice_c: the noise and commotion of a house once everyone is awake
  choice_d: the struggle of forcing oneself out of bed early in the day
  correct_answer: A
  explanation: 'Here "machinery" is not literal; there are no machines in the sentence.
    It is applied to the morning itself — the fixed, automatic sequence of things
    that happens once the day begins: his mother saying his name, asking what he''s
    doing up, the household clicking into its usual motions. Calling that routine
    "machinery" pictures it as something mechanical that "start[s] running," so the
    word means the ordinary, repeating workings of the morning, which is A. B takes
    the word at face value, as kitchen appliances, exactly the literal reading the
    sentence isn''t using. C hears "machinery" as loud, clattering activity and swaps
    in "noise and commotion," but the word points to the routine that unfolds, not
    to the sound it makes. D pulls toward the effort of waking early, a meaning "machinery"
    doesn''t carry; the phrase is about the day''s habitual operations, not the difficulty
    of getting up. Only A fits the figurative sense the sentence intends.'
  distractor_types:
    B: wrong_concept
    C: partly_true_but_wrong
    D: misidentified_detail
- section: ELA
  stage: hard_module
  question_number: 23
  question_type: multiple_choice
  skill: main_idea
  difficulty: medium
  topic: ''
  passage_group_id: ela_h_p3
  passage_title: 'Two Views: Should You Finish What You Start?'
  passage_text: "Passage 1\r\n\r\nAnyone who has tried to learn the violin knows the\
    \ sound of the second month. The first few weeks are almost fun: the instrument\
    \ is new, the mistakes are expected, and every scratch of the bow counts as forward\
    \ motion. Then a longer, stranger season sets in. The ear sharpens faster than\
    \ the hands, so the player can suddenly hear, with cruel clarity, the whole distance\
    \ between the note intended and the note actually produced — and that distance\
    \ refuses to close for a very long time. This is the stretch in which most violins\
    \ go silent and slide under the bed. The same stretch turns up everywhere: in\
    \ a language somewhere past its first hundred words, in a sport once the easy\
    \ gains are spent, in any craft demanding enough to deserve the name. Call it\
    \ the trough — the flat, discouraging middle of learning that every hard skill\
    \ seems to run through, and the exact place where most people, mistaking discouragement\
    \ for a verdict, give up.\r\n\r\nThe trouble is that the trough waits at the same\
    \ depth in every field. Abandon each pursuit the moment the fun drains out and\
    \ you arrive, over and over, at the same early wall, turning back always at the\
    \ same height, having learned only what beginnings feel like. Across a lifetime\
    \ this breeds a curious poverty: a hundred opening chapters and no finished books,\
    \ easy familiarity with the shallow front end of a great many things and real\
    \ knowledge of none. From the outside the variety can look like a rich and adventurous\
    \ life. From the inside it is a single short experience, the frustrating first\
    \ taste of mastery, lived again and again and never once carried through.\r\n\r\
    \nWhatever waits on the far side is a reward the beginning cannot counterfeit.\
    \ The pleasure of playing music well shares almost nothing with the pleasure of\
    \ playing music newly; the two differ in kind, and only one of them can be purchased\
    \ by grinding through the middle where everything is labor and nothing is fun.\
    \ That grind asks for something specific and deeply uncomfortable — a tolerance\
    \ for being visibly, measurably bad at a thing you love, judged against a standard\
    \ you can already perceive but cannot yet reach, for far longer than pride can\
    \ easily bear. Most people decline to pay, which is the plain reason most rewards\
    \ go unclaimed. The old advice to finish what you start earns its keep right here:\
    \ the best experiences a life contains sit stubbornly beyond a stretch of tedium,\
    \ and every road to them runs directly through it.\r\n\r\n\r\nPassage 2\r\n\r\n\
    There is a well-documented flaw in human judgment that grows stronger the more\
    \ we have already spent. Walk out of a bad film after ten minutes and you feel\
    \ nothing; sit through ninety and you will stay to the bitter end, all because\
    \ you have already sat through ninety. Economists call it the sunk-cost fallacy,\
    \ and it ranges far beyond the movie theater. The abandoned-but-not-quite project,\
    \ the joyless hobby maintained for years, the friendship that curdled a decade\
    \ ago and staggers on out of habit — such things survive less on their merits\
    \ than on their sheer accumulated weight. Three hundred pages read, two years\
    \ given over, half a childhood spent: the size of the existing investment drowns\
    \ out the evidence, frequently overwhelming, that the whole enterprise is carrying\
    \ us somewhere we would rather not go. Pressing on can feel like loyalty, or strength\
    \ of character, when it is often only the fallacy wearing a more flattering coat.\r\
    \n\r\nThe habit is expensive, and its expense hides inside a blind spot. Whatever\
    \ you pour into the wrong endeavor costs more than the hours it swallows; it costs\
    \ every rival endeavor those same hours might have fed — the unwritten thing,\
    \ the untried road, deducted in silence from a life allotted some fixed and unknown\
    \ number of hours to begin with. We can keep a careful ledger of what we spend\
    \ and no ledger at all for what we forgo, so the arithmetic forever seems to recommend\
    \ continuing. The road not taken sends no invoice. That absence is what makes\
    \ it so easy to overpay.\r\n\r\nThe gospel of grit skips the part where excellence\
    \ is actually assembled. To grow genuinely superb at any one thing, a person has\
    \ to surrender nearly everything else, and surrender it early, before the sunk\
    \ cost hardens into an identity. The pianist an audience admires spent her childhood\
    \ giving things up: the soccer team, the chess club, three other instruments set\
    \ down one by one, until a single talent could absorb every last ray of light\
    \ and drop of water available to it. Her mastery grew straight out of that long\
    \ sequence of quittings, each abandonment clearing more ground. Pruning is the\
    \ unglamorous engine underneath: a gardener grows one magnificent branch only\
    \ by cutting away the dozen that would have split the tree's strength among them.\
    \ Holding on is the easy part — a mule can hold on. What almost no one is ever\
    \ taught is the harder discipline of release: letting go of a great many good\
    \ things, in good time, so that one of them can become great, and seeing clearly,\
    \ before your own investment clouds the glass, which of them has earned the right\
    \ to be the one."
  question_text: Which statement best expresses the central claim of Passage 1?
  choice_a: Learning any instrument is most discouraging in the stage when one's ear
    improves faster than one's hands.
  choice_b: People abandon new skills too readily, usually well before they have given
    themselves a real chance to improve.
  choice_c: The genuine rewards of a skill lie beyond a difficult middle stretch,
    and reaching them requires enduring that stretch rather than quitting.
  choice_d: A life spread across many pursuits is shallower and less satisfying than
    one devoted to mastering a single thing.
  correct_answer: C
  explanation: 'Passage 1 builds a single argument: every hard skill has a discouraging
    middle — the "trough" — and the deep rewards sit only on its far side, so they
    go to the people who push through it rather than quitting. C states exactly that
    shape. A takes the violinist''s "second month," which the passage uses only as
    an opening illustration, and mistakes that one example for the whole thesis. B
    softens the argument into ordinary impatience — people quitting "too readily"
    — and loses the passage''s specific and central point, that the best rewards are
    located past the trough and cannot be reached any other way. D is the subtlest
    trap: the passage does criticize a life of endless fresh starts ("a hundred opening
    chapters and no finished books"), which makes "devoted to mastering a single thing"
    sound right, but the passage never prescribes narrowing to one pursuit — its remedy
    is to finish what you begin by grinding through each trough, something a person
    with several interests could equally do. That idea of surrendering everything
