  question_text: "Which word best completes the sentence below?\r\n\r\n\"This year's\
    \ festival drew far ______ visitors than last year's, but each one stayed much\
    \ longer.\""
  choice_a: less
  choice_b: lesser
  choice_c: fewer
  choice_d: fewest
  correct_answer: C
  explanation: '"Visitors" are individual people you can count, so the word that compares
    their number is "fewer"; the phrase "than last year''s" confirms a comparison
    is being made. A, "less," is the everyday slip — it''s the right word for amounts
    you measure rather than count (less water, less time), but not for countable things
    like visitors. B, "lesser," is a real word, which is what makes it tempting, but
    it means lower in importance or quality, not smaller in number, so it changes
    what the sentence is saying. D, "fewest," is the correct family of word but the
    wrong form: "fewest" is the superlative for three or more, while comparing exactly
    two years — this one and last — calls for the comparative "fewer."'
  distractor_types:
    A: wrong_concept
    B: changes_meaning
    D: changes_meaning
