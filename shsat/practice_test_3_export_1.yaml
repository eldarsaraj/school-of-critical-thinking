  question_text: The author most likely compares the flytrap to a "meticulous bookkeeper"
    (paragraph 6) in order to
  choice_a: imply that the plant deliberately decides which meals are worth its effort,
    much as a person would
  choice_b: suggest that the plant keeps a lasting record of every insect it has ever
    captured
  choice_c: make the plant's careful, economical use of energy vivid while underscoring
    that it manages this without any ability to think
  choice_d: argue that the designs found in nature are generally more efficient than
    those invented by people
  correct_answer: C
  explanation: 'By the last paragraph the author has already shown the flytrap "counting,"
    "gauging," and "investing" energy, and the bookkeeper image pulls all of that
    into one familiar picture — a careful accountant who tallies every entry and refuses
    to spend on what won''t pay off. The comparison makes an invisible, chemical process
    feel concrete and deliberate, and it''s placed right beside the blunt line "The
    plant cannot think," so its real job is to dramatize that paradox: economical
    behavior with no mind behind it. That''s C. A is the close trap — the metaphor
    does make the plant seem to decide, but the passage flatly denies real choice,
    so reading in genuine, person-like deliberation goes one step too far. B takes
    the accounting image literally: a bookkeeper keeps written records, yet nothing
    in the passage says the plant stores any lasting tally — "accounts" is just a
    figure for its moment-to-moment economy. D blows a single example up into a sweeping
    claim about all of nature versus all human invention, a generalization the passage
    never makes.'
