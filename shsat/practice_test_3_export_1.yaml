  question_text: Sam can mow a lawn in 4 hours. Dana can mow the same lawn in 6 hours.
    If they mow the lawn together, how long will it take them to finish?
  choice_a: 2 hours
  choice_b: 2 2⁄5 hours
  choice_c: 5 hours
  choice_d: 10 hours
  correct_answer: B
  explanation: 'Add their rates of work, not their times. In one hour Sam mows 1⁄4
    of the lawn and Dana mows 1⁄6, so together they mow 1⁄4 + 1⁄6 = 3⁄12 + 2⁄12 =
    5⁄12 of the lawn per hour. The time to finish one whole lawn is the reciprocal
    of that rate: 1 ÷ 5⁄12 = 12⁄5 = 2 2⁄5 hours (2 hours 24 minutes). A good sanity
    check: working together must be faster than either person alone, so the answer
    has to be less than 4 hours — which rules out choices C (5 hours) and D (10 hours)
    immediately. Choice D adds the two times (4 + 6), choice C averages them ((4 +
    6) ÷ 2), and choice A subtracts them (6 − 4) — but times can''t simply be combined
    that way; only the hourly rates add.'
  distractor_types:
    A: wrong_setup
    C: wrong_setup
    D: wrong_setup
