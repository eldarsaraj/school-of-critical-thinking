  passage_group_id: ela_e_p2
  passage_title: Not Ready Yet
  passage_text: "Every afternoon that July, Nadia climbed the splintery steps to her\
    \ grandfather's garage, where the old rowboat sat propped on two sawhorses like\
    \ a patient waiting for surgery. Pop had been restoring it for as long as she\
    \ could remember — longer, maybe, than she had been alive. The hull was the soft,\
    \ flaked gray of driftwood, and each day the two of them sanded another stretch\
    \ of it down to honey-colored wood, the fine dust settling on Nadia's arms like\
    \ pollen. She had wanted to spend the summer at the public pool with her friends,\
    \ the way she did every other year. Instead she was here, in the smell of sawdust\
    \ and old paint, sanding.\r\n\r\n\"When will it be done?\" she asked, the way\
    \ she asked most days.\r\n\r\nPop ran his thumb slowly along a seam and frowned,\
    \ as though the boat had murmured something only he could hear. \"Not ready yet,\"\
    \ he said. \"She'll let us know.\"\r\n\r\nNadia humored him at first, taking the\
    \ sandpaper with a sigh and watching the clock on the wall crawl toward five.\
    \ There was always one more seam to seal, one more soft spot to find, one more\
    \ coat of varnish that had to cure before the next could go on. The lake was only\
    \ twenty minutes down the road, blue and wide and waiting, and yet the boat never\
    \ seemed to get any nearer to it.\r\n\r\nOn the workbench, half hidden under a\
    \ jar of stiff brushes, lay a photograph curled at its corners. In it a young\
    \ man and a laughing woman sat together in the very same boat, the water behind\
    \ them bright as crumpled foil. Nadia knew without asking that the woman was her\
    \ grandmother, who had died before Nadia was born and whom Pop almost never mentioned.\
    \ But when he worked, he sometimes hummed a tune that seemed to have no name,\
    \ and his rough hands moved over the wood the way a person smooths a blanket across\
    \ someone who has fallen asleep. Nadia would watch him and feel that she had wandered\
    \ into the middle of a conversation she could not quite hear.\r\n\r\nOne slow\
    \ afternoon she ran her palm across a patch of the hull and found it already perfectly\
    \ smooth, smoother than the rest, and she said so out loud. Pop looked at the\
    \ spot for what felt like a long time. Then he reached up, took the stub of a\
    \ pencil from behind his ear, and drew a small gray circle right in the middle\
    \ of the good, finished wood. \"Looks like we missed one,\" he said quietly, and\
    \ set to sanding the place that did not need sanding at all. And that was the\
    \ moment Nadia understood something she could not yet have put into words. Pop\
    \ was not racing to finish the boat so they could carry it down to the lake. He\
    \ was doing the very opposite. Carefully, patiently, he was making the work last.\r\
    \n\r\nAfter that, the afternoons felt different, even though nothing about them\
    \ actually changed. They sanded the same gray boat down to the same warm wood;\
    \ Pop still said \"not ready yet\" whenever she asked, and Nadia simply stopped\
    \ waiting for him to say anything else. She began, instead, to notice things —\
    \ the way the late light leaned in sideways through the garage door at five o'clock\
    \ and turned the floating dust to gold, the grain of the wood opening up beneath\
    \ her hand like the fine lines of a palm, the steady and companionable weight\
    \ of her grandfather's silence beside her. The boat, she had begun to suspect,\
    \ might never once touch the water. And she was no longer certain that this was\
    \ the point. Some afternoons now, when Pop had stepped away or wasn't watching,\
    \ Nadia would hunt out a smooth and finished place of her own — and quietly sand\
    \ it all over again."
  question_text: In the final paragraph, Nadia's habit of finding "a smooth and finished
    place of her own — and quietly sand[ing] it all over again" most strongly suggests
    that she
  choice_a: has grown bored and is sanding at random simply to pass the time
  choice_b: has decided to prove to Pop that she can find flaws he has missed
  choice_c: has come to share Pop's wish to stretch out their time together, and joins
    in without needing to say so
  choice_d: is worried the boat will never be finished and is trying to hurry the
    work along
  correct_answer: C
  explanation: 'Nadia''s action deliberately mirrors Pop''s earlier one — she now
    does exactly what she once watched him do, sanding wood that needs no sanding,
    and she does it "quietly," without being asked. Since the passage has just shown
    that Pop sands finished wood to make the work last, Nadia copying him means she
    has understood that purpose and embraced it: the unfinished boat is really shared
    time, and she wants more of it. That''s C, and the detail that the afternoons
    now "felt different, even though nothing about them actually changed" confirms
    the shift is inside her. A misreads the quiet, purposeful gesture as aimless boredom
    — the very impatience she has clearly grown out of. B turns a tender, wordless
    act into a competition, inventing a wish to outdo Pop that the passage never shows.
    D reverses her meaning entirely: she is prolonging the work, not rushing it, and
    the passage states she''s no longer sure finishing is even the point.'
  distractor_types:
    A: opposite
    B: misidentified_detail
    D: opposite
