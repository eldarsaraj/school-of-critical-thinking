    there leaves "this" with no advantage to refer to. C drops it after the detail
    about nervous shoppers and attendants, where "this" would wrongly point to the
    attendants and the flow would jump backward to a point already made. D lands it
    among the architects and central courts, a different topic entirely, where "this"
    no longer fits.'
