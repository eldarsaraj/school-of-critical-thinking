  question_text: Which revision of sentence 9 most clearly expresses the intended
    meaning?
  choice_a: Forced to slow down and yield before merging, the crashes that are most
    dangerous simply have no way to occur.
  choice_b: Because drivers are forced to slow down and yield before merging, the
    most dangerous crashes simply have no way to occur.
  choice_c: Forced to slow down and yield before merging, there is no way for the
    most dangerous crashes to occur.
  choice_d: The most dangerous crashes, forced to slow down and yield before merging,
    simply have no way to occur.
  correct_answer: B
  explanation: 'The opening phrase "Forced to slow down and yield before merging"
    is meant to describe whoever actually slows down and yields — the drivers. As
    written, though, the phrase sits next to "the most dangerous crashes," so the
    sentence reads as if the crashes are the ones slowing down and yielding, which
    makes no sense. The clearest fix names the real actor by turning the phrase into
    a full clause: "Because drivers are forced to slow down and yield," which is B.
    A only reshuffles the ending and leaves the opening phrase still pointing at the
    crashes. C swaps the crashes for "there," so the phrase now describes nothing
    at all, since an empty "there" cannot be what slows down and yields. D moves the
    crashes right into the phrase, stating outright the very thing that was wrong
    — that the crashes slow down and yield. Only B attaches the description to the
    drivers, where it belongs.'
  distractor_types:
    A: misattributed_error_location
    C: introduces_new_error
    D: changes_meaning
- section: ELA
  stage: hard_module
  question_number: 3
  question_type: multiple_choice
  skill: usage_agreement
  difficulty: hard
  topic: ''
  passage_group_id: ela_h_re
  passage_title: The Crossing That Never Says Stop
  passage_text: '(1) For most of the past century, the standard way to tame a dangerous
    intersection was to hang a traffic light above it and let the colors take turns.
    (2) A roundabout does the opposite, it strips out the signals entirely and keeps
    every car moving, slowly and without pause, around a central island. (3) At first
    the idea sounds reckless. (4) How could removing the very lights that impose order
    possibly make a crossing safer? (5) The answer has less to do with traffic than
    with geometry. (6) At an ordinary intersection, cars meet head-on or at right
    angles, and a driver who runs a red can strike another broadside at full speed,
    in the deadliest way two cars can meet. (7) A roundabout abolishes those angles.
    (8) Every car enters by curving in the same direction, so a collision, on the
    rare occasions one happens at all, becomes a slow scrape rather than a violent
    broadside. (9) Forced to slow down and yield before merging, the most dangerous
    crashes simply have no way to occur. (10) One large review concluded that a well-designed
    roundabout is safer than any intersection in the country. (11) Before the first
    modern roundabouts appeared, plenty of engineers distrusted them, but once the
    crash figures arrive, most of that doubt quietly dissolved. (12) A driver nearing
    the circle has to give way. (13) A driver nearing the circle must find a gap in
    the moving traffic. (14) The earliest electric traffic light, as it happens, was
    installed in 1914 and controlled only two directions. (15) Where the old intersections
    dared drivers to beat the light, the roundabout offers nothing to beat: no signal
    to outrun, only a gap to wait for. (16) The safest crossing ever devised, it seems,
    may be the one that never once tells a driver to stop.'
  question_text: Which version of sentence 11 is written correctly?
  choice_a: Before the first modern roundabouts appear, plenty of engineers distrusted
    them, but once the crash figures arrived, most of that doubt soon dissolved.
  choice_b: Before the first modern roundabouts appeared, plenty of engineers distrusted
    them, but once the crash figures arrive, most of that doubt soon dissolves.
  choice_c: Before the first modern roundabouts appeared, plenty of engineers distrusted
    them, but once the crash figures arrived, most of that doubt soon dissolved.
  choice_d: Before the first modern roundabouts appeared, plenty of engineers distrusted
    them, but once the crash figures had arrived, most of that doubt had soon dissolved.
  correct_answer: C
  explanation: Everything in the sentence takes place in the past — the roundabouts
    "appeared," the engineers "distrusted" them, the doubt "dissolved" — so the one
    word that breaks the pattern is "arrive," which describes something happening
    in the present. It should be "arrived," and C makes exactly that single change.
    A fixes "arrive" but then breaks the beginning of the sentence instead, changing
    "appeared" to "appear" and dropping in a new present-tense word where a past one
    belongs. B never repairs "arrive" and, on top of that, changes "dissolved" to
    "dissolves," leaving two words out of step with the rest. D does put "arrive"
    into the past, but it rewrites both actions as "had arrived" and "had soon dissolved,"
    a heavier construction than the sentence needs, and "had soon dissolved" reads
    awkwardly. Only C corrects the single word that was wrong and leaves the rest
    untouched.
