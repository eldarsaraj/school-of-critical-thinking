  explanation: "The claim is about what converts a doubter — not a clever argument, but having been flooded oneself. No quote says that outright; you read it from the arc. B does: Cho dismissed the program (\"a lot of paperwork for a puddle\") until \"Ida flooded my garage, and I stopped laughing\" — skepticism turned to belief by the flood itself. \r\n\r\nA is a real change of heart, but Reyes's shift is the satisfaction of watching her finished garden work, not a doubter won over by being flooded. C is the strongest trap: Abramowitz does convince doubters (\"asking if it really works\"), but she wins them with visible proof — \"come look the next time it pours\" — not by their own flooding; the claim specifies firsthand experience of flooding, which her neighbors haven't necessarily had. D states the program's logic and has nothing to do with changing minds."
