  question_text: The way the passage presents the octopus's short, solitary life most strongly suggests that the author finds the octopus's intelligence —
  choice_a: disappointing, since the octopus has so little time to put its abilities to use.
  choice_b: alarming, given that it squirts water at the keepers it dislikes.
  choice_c: puzzling, because such intelligence usually appears in animals that live longer and learn from others.
  choice_d: unremarkable, since plenty of animals live only a year or two.
  correct_answer: C
  explanation: "This asks you to infer the author's attitude from how the short, solitary life is framed. The passage builds to an open question — \"Why so much intelligence should have evolved in a creature with so little time to use it, and no one to pass it on to, is a question scientists cannot yet answer\" — which only makes sense if intelligence is normally expected to come with a longer life and learning handed down from others. That unstated expectation is what makes the octopus puzzling, so C is correct. \r\n\r\nA misreads the tone: \"so little time to use it\" can sound like waste, but the author is curious, not let down. B seizes on a real detail — the water-squirting — that has nothing to do with why the intelligence is surprising. \r\n\r\nD turns the \"year or two\" detail against the passage's clear sense of wonder; the brevity is part of the puzzle, not a reason the octopus is ordinary."
  distractor_types:
    A: inference_leap
    B: true_but_irrelevant
    D: opposite
