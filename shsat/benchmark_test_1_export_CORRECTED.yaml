  question_text: "Which edit should be made to the sentence below?\r\n\r\n\"The coach reminded Diego and I to stretch carefully before every practice.\""
  choice_a: Change "Diego and I" to "Diego and myself"
  choice_b: Change "Diego and I" to "I and Diego"
  choice_c: Change "reminded" to "was reminding"
  choice_d: Change "I" to "me"
  correct_answer: D
  explanation: "\"Diego and I\" is the object of the verb \"reminded\" — the coach reminded them — so it takes the object pronoun: \"Diego and me.\" Drop the other name and your ear confirms it: you'd say \"reminded me,\" never \"reminded I.\" That's D. \r\n\r\nA is the most revealing wrong answer: faced with the I/me choice, many students grab \"myself\" because it sounds formal and dodges the decision — but a reflexive like \"myself\" needs a matching subject earlier in the clause (\"I reminded myself\"), and the subject here is \"the coach,\" so \"myself\" is equally wrong. B senses something is off and reorders the names but leaves the wrong case (\"I\") in place — and by convention the other person goes first anyway. C changes a verb that has no error and ignores the pronoun altogether. The whole item turns on resisting the \"and I sounds proper\" reflex."
  distractor_types:
    A: overcorrection
    B: wrong_concept
    C: misidentified_detail
