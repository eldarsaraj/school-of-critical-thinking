  difficulty: medium
  topic: ''
  passage_group_id: ''
  passage_title: ''
  passage_text: ''
  question_text: '"The young engineer whom the others believed had designed the bridge was, in fact, only an assistant."'
  choice_a: Change "had designed" to "designed."
  choice_b: Change "whom" to "who."
  choice_c: Insert a comma after "engineer."
  choice_d: Change "believed" to "had believed."
  correct_answer: B
  explanation: "A pronoun's case depends on its job in its own clause, not on the words that interrupt it. Set aside \"the others believed,\" and the clause reads \"[who] had designed the bridge\" — the pronoun is the subject of \"had designed,\" so it must be \"who,\" not \"whom.\" Quick test: you'd say \"they had designed the bridge,\" not \"them had designed the bridge.\" So B. The trap is reading \"whom the others believed\" as though the pronoun were the object of \"believed\"; that inserted phrase is parenthetical and doesn't govern the case. \r\n\r\nA and D change verbs that are already correct — \"had designed\" properly places the design before the later revelation, and \"believed\" is the right past tense — so neither touches the real error. C treats it as punctuation, but the clause is restrictive (it identifies which engineer) and takes no comma; adding one leaves the who/whom error in place."
  distractor_types:
    A: overcorrection
    C: wrong_concept
    D: misidentified_detail
- section: ELA
  stage: hard_module
  question_number: 3
  question_type: multiple_choice
  skill: authors_craft
  difficulty: hard
  topic: ''
  passage_group_id: ela_h_p5
  passage_title: The Promise and Peril of De-Extinction
  passage_text: "(1) For as long as species have vanished from the Earth, their disappearance has been treated as final. (2) Extinction, in the famous phrase, is forever. (3) A small but growing group of scientists now argues that this may no longer be entirely true — or at least, not as true as it once was. (4) Using rapid advances in genetics, they hope to return vanished species, or something closely resembling them, to the living world, a project known as de-extinction. (5) Yet the very phrase conceals a difficulty that shapes the entire debate, for what these scientists propose to create may not be the lost animals themselves so much as living imitations of them.\r\n\r\n(6) The reason lies in the methods now under development. (7) Cloning, the technique that produced Dolly the sheep, requires living cells, and for a creature that vanished thousands of years ago no such cells survive. (8) Researchers therefore pursue a subtler approach: they read the fragmentary genetic code preserved\
    \ in frozen remains and museum specimens, identify the genes responsible for the lost animal's defining traits, and edit those genes into the DNA of its closest living relative. (9) To approximate the woolly mammoth, for instance, scientists would alter the genome of the Asian elephant — the mammoth's nearest surviving cousin — adding instructions for dense hair, thick fat, small ears, and blood that carries oxygen in extreme cold. (10) The animal that resulted would not be a mammoth revived from its own flesh but an elephant engineered to live a mammoth's life: a hybrid, its makers concede, rather than a resurrection.\r\n\r\n(11) Advocates argue that de-extinction is, above all, a matter of repair. (12) Human beings caused many extinctions, they point out, and so bear a responsibility to undo that damage where the means now exist. (13) The benefits, they insist, would be ecological rather than sentimental. (14) Consider the mammoth's proposed role in the Arctic. (15) Large grazers,\
    \ by trampling shrubs and packing down insulating snow, expose the ground to the bite of winter air; the colder the ground, the more firmly the permafrost beneath it stays frozen; and frozen permafrost locks away immense quantities of carbon that, if released by thawing, would escape into the atmosphere as gases that warm the planet further. (16) Restore the grazers, the argument runs, and you may slow a dangerous cycle. (17) Each link in that chain, however, depends on the one before it, and not one has yet been demonstrated at the scale the argument requires.\r\n\r\n(18) Critics are far less persuaded. (19) The simplest objection concerns money: every dollar spent resurrecting the dead, they argue, is a dollar not spent rescuing the many thousands of species still clinging to existence, the living elephants among them. (20) A subtler objection concerns what de-extinction can actually deliver. (21) A species, critics observe, is more than a sequence of genes. (22) Much of what an animal\
    \ is — where it migrates, what it eats, how it raises its young — is learned from others of its kind and cannot be written into a genome. (23) The passenger pigeon, a bird once so abundant that its flocks darkened American skies before hunting ended it in 1914, may have depended for survival on the sheer size of those flocks, which overwhelmed predators by their numbers; a handful of laboratory-born birds, lacking both the multitude and the knowledge their ancestors possessed, might not constitute a functioning species at all. (24) What de-extinction produces, such critics conclude, is at best a proxy — an organism that performs some of the vanished species' role without truly being it. (25) Advocates reply that, for an ecosystem, function is precisely what matters: if a proxy keeps the tundra frozen, the question of whether it deserves the old name is one for philosophers, not biologists.\r\n\r\n(26) Beneath the scientific dispute lies an uneasy question about human ambition. (27) The\
    \ promise that extinction might be undone could, paradoxically, make extinction easier to tolerate. (28) If a species can always be rebuilt, the urgency of protecting it now — and the laws that draw their force from extinction's finality — may steadily weaken. (29) The same power offered as a remedy might thus become an excuse, loosening the very resolve that conservation depends upon. (30) De-extinction forces us to decide not only what we are able to do but what we ought to do, and those have never been the same question. (31) Should the power to reverse extinction ever truly arrive, it will test not only our science but our wisdom."
  question_text: Which statement best expresses the central idea of the passage?
  choice_a: Advances in gene-editing now allow scientists to recreate an extinct animal's traits in the body of a living relative.
  choice_b: De-extinction may be coming within reach, yet what it could truly accomplish — and whether we ought to pursue it — remains unresolved.
  choice_c: The deepest problem with de-extinction is that even a perfect effort would produce only an imitation, never the species that was truly lost.
  choice_d: However impressive its methods, de-extinction is unlikely to restore what was lost and may even weaken our will to protect the species that survive.
  correct_answer: B
  explanation: "All four are plausible summaries — that's what makes the item hard; the distinction is one of altitude and stance. The passage builds the promise (methods, ecological repair) and the perils (cost, the proxy problem, moral hazard) and deliberately reaches no verdict, so B captures the whole arc: a real prospect, unsettled on both feasibility and ethics.\r\n\r\nA is true and fills much of the passage, but it names the mechanism that drives the debate, not the debate's point — a how, not a so-what. C states the subtlest idea in the piece, yet the passage frames the proxy objection as contested (advocates answer it head-on in sentence 25) and as one peril among several — calling it \"the deepest problem\" promotes a single thread to the whole. D reads the cautionary ending as a conclusion; but the author withholds judgment and gives advocates equal standing, so asserting that de-extinction \"is unlikely to restore what was lost\" makes a claim the passage refuses to make."
  distractor_types:
    A: too_narrow
    C: partly_true_but_wrong
    D: inference_leap
