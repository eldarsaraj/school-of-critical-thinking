  question_text: The combination of the program's one-time grant and its five-year maintenance requirement most strongly suggests that —
  choice_a: the city expects to keep paying owners as long as the gardens last
  choice_b: most owners will stop maintaining their gardens once five years pass
  choice_c: the city gains a lasting benefit while owners bear the upkeep
  choice_d: the maintenance rule mainly exists to limit how many owners apply
  correct_answer: C
  explanation: "Put the two features together. The grant is paid once — a reimbursement \"up to a fixed cap\" — but the owner must keep the garden working \"for at least five years,\" and the garden sits on the owner's own land. So the city makes a single payment and, in exchange, gets years of flood protection that residents themselves have to maintain; as Anand puts it, \"we're buying a benefit that has to last.\" That division of burden is C. \r\n\r\nA misreads the grant as ongoing — but the reimbursement is one-time and capped, not a continuing payment. B leaps to a prediction the article never makes about owner behavior after five years. D mistakes the rule's purpose: the passage ties maintenance to keeping the benefit alive (\"a rain garden full of weeds is just a hole\"), not to capping the number of applicants."
