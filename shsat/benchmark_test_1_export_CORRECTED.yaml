  question_text: The passage's final sentence — "The ice that took thousands of years to carve these landscapes is now vanishing within a single human lifetime" — achieves its effect mainly by
  choice_a: contrasting the glacier's slow, ancient work with the swiftness of its loss
  choice_b: exaggerating the speed of the melting in order to alarm the reader
  choice_c: circling back to the specific glacier introduced at the start
  choice_d: predicting that the glacier will disappear entirely very soon
  correct_answer: A
  explanation: "This asks how the closing sentence creates its effect, so the answer has to name the technique, not just what the sentence says. The sentence sets two wildly different time scales side by side — \"thousands of years to carve\" against \"a single human lifetime\" to vanish — and that contrast is what makes the present pace feel so striking, which is A. \r\n\r\nB mistakes the device: a sharp contrast isn't the same as exaggeration, and the passage's tone is measured and observational rather than alarmist. C is a close-reading trap — the sentence speaks of \"these landscapes\" in general, not the Aletsch from the opening, so it doesn't circle back to that one glacier. D reads the sentence as a literal forecast of total disappearance \"very soon,\" but its power lies in the contrast between two time scales, not in predicting a date."
  distractor_types:
    B: wrong_concept
    C: misidentified_detail
    D: inference_leap
