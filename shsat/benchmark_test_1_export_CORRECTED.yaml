  choice_d: to prove that a glacier which appears motionless is in fact moving
  correct_answer: D
  explanation: "The opening sets up a small surprise: \"Spend an afternoon beside it and you will see nothing move at all. Yet researchers … return years later to find them dragged far down the valley.\" Those displaced stakes are concrete proof that the seemingly frozen, still glacier is actually creeping along, which is why D is correct. \r\n\r\nA confuses two different measurements — the stakes track movement, not age (the passage ties age to the trapped air bubbles, not the stakes). B introduces a danger the passage never raises. C seizes on the opening's size detail, \"more than twenty kilometers,\" and inflates it into a claim the passage doesn't make; the stakes are about motion, not about being the biggest."
