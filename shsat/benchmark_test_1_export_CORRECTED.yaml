  question_text: Throughout the passage, the author keeps measuring the octopus against the human case ("In a human being … In an octopus …"; "the way you command your hand"). This pattern mainly works to —
  choice_a: argue that humans and octopuses think in much the same way
  choice_b: show that the author understands the human mind better than the octopus's
  choice_c: make the octopus's strangeness clearer by setting it against the familiar
  choice_d: prove that the human brain is more advanced than the octopus's
  correct_answer: C
  explanation: "Notice how often the passage explains the octopus by holding it up against us — \"In a human being, nearly all the neurons are packed into the brain. In an octopus, most of them are not\"; \"the way you command your hand.\" Measuring the unfamiliar against the familiar is what makes the octopus's strangeness graspable, so C is correct. \r\n\r\nA reverses the purpose: the comparisons exist to highlight how different the two minds are, not how alike. \r\n\r\nB turns a writing device into a claim about the author's own knowledge, which the passage never makes. D imports a ranking — the human brain as \"more advanced\" — that the passage deliberately avoids; its point is that the octopus's mind is different, not lesser."
