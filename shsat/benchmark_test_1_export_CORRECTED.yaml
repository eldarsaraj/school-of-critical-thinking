  passage_title: 'Bioluminescence: Living Light'
  passage_text: "To a person standing on a dark beach, the ocean at night looks like the emptiest place on Earth — a black expanse with nothing in it but the reflection of the stars. The truth is closer to the opposite. Across much of the sea, and especially in its vast dark interior, living things are making their own light. A breaking wave may flare blue-green where billions of microscopic organisms flash at once; far below, in water the sun never reaches, creatures drift past one another like slow constellations. Scientists estimate that in the deep ocean — by volume, the largest living space on the planet — the majority of animals can produce light. Darkness, not light, turns out to be the exception there.\r\n\r\nThe light itself comes from a remarkably simple chemical event. A molecule called luciferin reacts with oxygen, and the energy of that reaction is released almost entirely as light rather than as heat. This is why bioluminescence is sometimes called \"cold light\": a candle\
    \ flame wastes most of its energy warming the air around it, but a glowing animal loses almost none. What is stranger is how often nature has arrived at this same solution. Fireflies, certain fungi, deep-sea fish, and glowing plankton are only distantly related, separated by hundreds of millions of years of evolution, yet each has independently stumbled onto a version of the luciferin reaction. A trick this useful, it seems, is one that life keeps reinventing.\r\n\r\nUseful for what, though, depends entirely on the animal. The same faint glow that helps one creature survive helps another hunt. The anglerfish dangles a luminous lure in front of its jaws, and a curious smaller fish, swimming toward the only bright thing in a lightless world, swims straight into them. A threatened squid does the reverse, turning light into an escape: rather than the dark ink released by a shallow-water octopus, it sprays out a cloud of glowing liquid that hangs in the water like a false target, dazzling\
    \ a predator long enough for the squid itself to vanish into the black. Other animals use light not to hunt or hide but to be found, flashing private patterns that only the right mate will recognize.\r\n\r\nSome of the subtlest uses are the hardest to picture. Many deep-sea animals glow faintly on their undersides, not to stand out but to disappear. Seen from below, an animal's body would otherwise show as a dark shape against the dim light filtering down from the surface; by glowing just enough to match that downwelling light, the animal erases its own silhouette and becomes nearly invisible to whatever is hunting from beneath. It is a strange idea — producing light in order not to be seen — and it shows how far a single chemical reaction can be bent toward opposite ends.\r\n\r\nFor most of human history, none of this was visible to us; the deep sea kept its light to itself. That changed when researchers realized they could borrow it. By taking the gene for a glowing protein first found\
    \ in a jellyfish and inserting it into other living cells, scientists gained a way to make specific structures inside the body light up — to watch a nerve fire or a cancer cell spread in processes that had always been completely invisible. A glow that evolved to lure prey, confuse predators, and whisper to distant mates had been turned to an entirely new purpose. The light that living things had been making in the dark for hundreds of millions of years became, almost overnight, one of the most powerful ways we have of seeing."
  question_text: Which statement best supports the idea that bioluminescence developed more than once over the course of evolution, rather than only a single time?
  choice_a: Insects and deep-sea fish glow using the very same chemical, inherited from a single common ancestor.
  choice_b: In the deep sea, the great majority of animals can produce their own light.
  choice_c: Insects, fungi, and fish each came to glow on their own, far apart on life's tree.
  choice_d: A glowing animal gives off light while wasting almost none of its energy as heat.
  correct_answer: C
  explanation: "The claim is that the glow arose several separate times rather than once. That requires lineages that did not inherit it from a shared ancestor each developing it on their own — which is what C says: insects, fungi, and fish, \"far apart on life's tree,\" \"each came to glow on their own.\" \r\n\r\nA is built precisely for the surface-matcher: it names the same kinds of creatures and talks about evolution, but it claims they share the trait through a common ancestor — which would mean the glow arose once and was passed down, the opposite of the claim (and the opposite of what the passage actually says). B shows the trait is widespread, but a common trait can spread from a single origin. D is a true fact about how efficiently the light is made and says nothing about how many times it evolved."
  distractor_types:
    A: opposite
    B: wrong_concept
    D: true_but_irrelevant
