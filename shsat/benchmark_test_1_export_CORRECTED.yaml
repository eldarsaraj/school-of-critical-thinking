    \ own carefully crafted rules, trust, and mutual oversight. The tragedy, her research suggested, is not inevitable. But it remains a warning that haunts any society that depends, as every society does, on something held in common."
  question_text: The final sentence of the passage suggests that the tragedy of the commons —
  choice_a: has been completely solved by modern science
  choice_b: applies only to small farming villages of the past
  choice_c: was entirely disproved by Elinor Ostrom's research
  choice_d: remains a real risk for any society that depends on shared resources
  correct_answer: D
  explanation: The closing line calls it 'a warning that haunts any society that depends, as every society does, on something held in common.' Choices A and B are directly contradicted. Choice C overreads Ostrom, who showed the tragedy can be avoided, not that it cannot occur.
  distractor_types:
    A: opposite
    B: too_narrow
    C: inference_leap
