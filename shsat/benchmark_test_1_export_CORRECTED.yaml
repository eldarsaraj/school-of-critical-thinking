  correct_answer: D
  explanation: "The passage never states a general rule, but every part points to one: John Roebling, who \"never saw a stone of it laid,\" gives the bridge its name; Emily, who ran the work for over a decade, and the laborers, who were maimed building it, are \"left below the waterline of memory.\" Put together, the implied claim is that recognition attaches to those who conceived a great work, not to those who actually built and paid for it — D. \r\n\r\nA seizes on the danger in the caisson section and inflates it into a different thesis; danger is part of the story, not the point the whole passage builds toward. B is true to the spirit but too small — it shrinks a claim about everyone whose work went unremembered down to a single two-person comparison. C is a tempting \"what if,\" but the passage gives no hint about how John's survival would have changed the timeline; the text doesn't license that guess."
