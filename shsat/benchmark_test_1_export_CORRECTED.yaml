  question_text: When the author writes that a melting glacier "leaves its signature everywhere," the word "signature" mainly suggests that —
  choice_a: the traces a glacier leaves behind are faint and easily overlooked
  choice_b: a glacier deliberately marks the land to claim it as its own
  choice_c: the features it leaves are distinctive marks of a glacier's past presence
  choice_d: every glacier leaves behind exactly the same kinds of features
  correct_answer: C
  explanation: "A signature is the distinctive, identifying mark a person leaves on something — your signature is recognizably yours. By calling moraines, stranded boulders, and glacier-carved basins a glacier's \"signature,\" the author casts them as identifying traces, the tell-tale marks by which we know a glacier was once there. That makes C correct. \r\n\r\nA reverses the connotation: a signature is meant to be recognizable, and the passage stresses these features are \"everywhere,\" not faint. B takes the metaphor too literally, turning \"signing\" into a deliberate act of claiming territory — personifying the ice in a way the passage doesn't intend. D over-reads \"signature\" as \"identical mark,\" but signatures are distinctive, and the passage never claims every glacier leaves the very same features."
