  passage_title: Rivers of Ice
  passage_text: "High in the Swiss Alps, the Great Aletsch Glacier stretches for more than twenty kilometers, a frozen river of ice deep enough in places to swallow a skyscraper. Spend an afternoon beside it and you will see nothing move at all. Yet researchers who drive a line of stakes into its surface return years later to find them dragged far down the valley and tilted out — proof that the entire vast mass is, however quietly, on the move.\r\n\r\nA glacier begins, improbably, as snow. In places where more snow falls each winter than melts the following summer, the snow never entirely disappears. Layer settles upon layer, and the weight above slowly presses the snow below into dense ice, much as a snowball grows harder the tighter you squeeze it. Once the ice is thick enough — often hundreds of feet deep — gravity takes hold, and the whole frozen mass begins, almost imperceptibly, to flow downhill.\r\n\r\nSlow as it is — advancing, in many glaciers, only a few inches a day — the ice\
    \ is far from idle. Boulders frozen into its underside turn it into an enormous sheet of sandpaper, grinding away the rock beneath and gouging out valleys hundreds of feet deep. Where a river cuts a narrow, V-shaped notch, a glacier widens and deepens it into a broad U-shaped trough. The sheer cliffs of Yosemite and the deep fjords of Norway, among the most dramatic scenery on the planet, were shaped this way — not by any sudden violence, but by ice creeping downhill more slowly than the hands of a clock.\r\n\r\nWhat makes glaciers stranger still is that much of their work survives them. When a glacier melts, it leaves its signature everywhere: ridges of rubble called moraines, boulders the size of houses stranded far from any rock resembling them, and basins that fill with water to become lakes. The Great Lakes of North America, which together hold about a fifth of the world's fresh surface water, sit in hollows that vanished glaciers scooped out during the last ice age. Stand almost\
    \ anywhere across the northern half of the continent, and you are likely standing on ground that ice once shaped, though the ice melted away long before any human saw it.\r\n\r\nThat same ice keeps an unlikely record of the past. Tiny bubbles trapped deep within a glacier hold samples of ancient air, letting scientists read what the planet's atmosphere was like tens of thousands of years ago. But this archive is now disappearing. Around the world, glaciers are shrinking, many retreating faster than at any time in recorded history. As they melt, they release fresh water that whole regions depend on — and they erase, a little at a time, the record they have kept for so long. \r\n\r\nThe ice that took thousands of years to carve these landscapes is now vanishing within a single human lifetime."
  question_text: Which statement is best supported by the passage?
  choice_a: The glacier's length has barely changed since the year 1880.
  choice_b: The glacier is shrinking, and its retreat has sped up recently.
  choice_c: The glacier will have disappeared completely by the year 2040.
  choice_d: The glaciers will disappear within a single human lifetime.
  correct_answer: B
  explanation: "This question lives in the graph, not the prose, so you have to read the curve itself. The line drifts down only slightly through the mid-1900s and then drops sharply after about 1980 — a glacier that is shrinking, and shrinking faster over time, which is exactly B. \r\n\r\nA contradicts the graph outright; the length clearly falls, especially in recent decades. C is the over-reach: a steep recent decline doesn't let you predict a precise year of total disappearance, something the graph says nothing about. D is an inference leap: there is nothing in the passage suggesting that the glaciers will disappear during a single lifetime."
  distractor_types:
    A: opposite
    C: inference_leap
    D: inference_leap
