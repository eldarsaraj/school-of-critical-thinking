  question_text: "Which edit should be made to the sentence below?\r\n\r\n\"The school's new principal, along with several veteran teachers, were invited to address the graduating class.\""
  choice_a: Change "along with" to "and"
  choice_b: Change "teachers" to "teacher"
  choice_c: Change "were" to "was"
  choice_d: Remove both commas from the sentence
  correct_answer: C
  explanation: "The subject is \"principal,\" which is singular. The phrase \"along with several veteran teachers\" is set off by commas as a nonessential aside — and phrases led by along with, as well as, or together with add information but do not turn a singular subject plural. So the verb must be singular: \"was invited.\" That's C. \r\n\r\nA is the discriminating trap: it assumes \"along with\" joins a true compound subject (\"principal and teachers\"), which would take \"were\" — but that rewrites the sentence to fit the verb instead of fixing the verb, and misreads how \"along with\" works. This is exactly the choice a borderline student takes, because they read the sentence as plural to begin with. B applies the verb to the nearest noun, \"teachers,\" when agreement is governed by the true subject, not the closest word. D treats it as a punctuation problem, but the commas are correct and removing them leaves the agreement error untouched."
  distractor_types:
    A: overcorrection
    B: misattributed_error_location
    D: wrong_concept
