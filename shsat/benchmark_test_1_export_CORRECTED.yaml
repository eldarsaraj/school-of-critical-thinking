  passage_text: "\"Hope\" is the thing with feathers\r\nThat perches in the soul,\r\nAnd sings the tune without the words,\r\nAnd never stops at all,\r\n\r\nAnd sweetest in the gale is heard;\r\nAnd sore must be the storm\r\nThat could abash the little bird\r\nThat kept so many warm.\r\n\r\nI've heard it in the chillest land,\r\nAnd on the strangest sea;\r\nYet, never, in extremity,\r\nIt asked a crumb of me."
  question_text: As used in the second stanza ("sore must be the storm / That could abash the little Bird"), the word "abash" most nearly means —
  choice_a: to embarrass or make self-conscious
  choice_b: to encourage or strengthen
  choice_c: to chill or freeze
  choice_d: to discourage or subdue
  correct_answer: D
  explanation: "The lines say \"sore [grievous] must be the storm / That could abash the little Bird\" — it would take a terrible storm even to abash this bird that \"kept so many warm.\" In context, \"abash\" has to mean dishearten, subdue, or beat down, so D. \r\n\r\nA is the trap for students who half-know the word: in everyday use \"abash\" often means to embarrass or fluster, but a storm doesn't embarrass a bird — it overpowers it, and the context must override the familiar dictionary sense. B reverses the meaning: the storm would weaken the bird, not strengthen it. C borrows the cold-and-storm imagery and guesses \"freeze,\" but the line is about crushing the bird's spirit, not lowering its temperature."
  distractor_types:
    A: too_literal
    B: opposite
    C: surface_match
