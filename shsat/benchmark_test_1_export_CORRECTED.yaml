  question_text: The passage contrasts the deep-sea squid's glowing cloud with the shallow-water octopus's dark ink. This contrast most strongly suggests that —
  choice_a: in the dark deep sea, a glow distracts a predator where dark ink could not
  choice_b: the squid's glowing cloud is really just a more advanced form of the octopus's ink
  choice_c: the squid glows because it cannot produce ink the way an octopus can
  choice_d: in the deep sea, dark ink would hide a squid even better than a glow
  correct_answer: A
  explanation: "The passage sets the squid's glowing cloud against the octopus's dark ink — the squid \"does the reverse.\" Why opposite tactics? Because a decoy has to stand out from its background, and the backgrounds differ: in the lit shallows, dark ink stands out and obscures; in the lightless deep, only a burst of light would stand out, so the squid dazzles its predator with a glowing false target and \"vanish[es] into the black.\" That environmental logic is A. \r\n\r\nB reads the two as rungs on one ladder — glow as an upgrade on ink — but the passage presents them as opposite solutions fitted to opposite settings. C invents a limitation: nothing says the squid can't make ink; it makes a different choice suited to the dark. D is the seductive miss — it carries the shallow-water rule (\"ink hides you\") into the deep, where dark ink against blackness would do nothing to distract a predator."
