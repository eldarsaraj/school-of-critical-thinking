  passage_group_id: ela_h_p2
  passage_title: Night Shift
  passage_text: "My father worked nights for most of my childhood, and so I grew up in a house organized around his sleep. The curtains in his room were lined with something heavy and black, and we learned to move through the afternoon as though the floorboards themselves might wake him. To me, this seemed not strange but simply the shape of the world: fathers were people who slept while the sun was up and disappeared into the dark while you dreamed.\r\n\r\nHe drove a delivery truck through the empty streets of a city that, in my imagination, belonged to him alone after midnight. I pictured the traffic lights changing for no one, the storefronts dark, my father moving through it all like the last man awake on Earth. In the morning I would find evidence of his return, a jacket over a chair, a cup still warm, the newspaper opened to a page I had not opened. He was a presence assembled from clues, a man I reconstructed each dawn from the things he left behind.\r\n\r\nOn Sundays the spell broke.\
    \ He woke when we woke, and for one strange, bright day he belonged to the ordinary world of daylight and noise. I remember being almost shy with him on those days, this rumpled stranger at the breakfast table who knew, somehow, the names of all my teachers. I did not understand then what those Sundays cost him, the body forced back onto a schedule it had unlearned, the Monday night that must have felt like climbing out of a warm bed into freezing water.\r\n\r\nI am older now than he was then, and I understand at last that the man I had invented, the solitary king of the midnight streets, was simply tired. He was not living a secret adventure. He was earning the daylight the rest of us spent so freely. What I had mistaken for mystery was only love, performed in the dark, where I was not awake to see it."
  question_text: The narrator's description of a house 'organized around his sleep' mainly conveys that the father's night work —
  choice_a: made the family wealthy and comfortable
  choice_b: was a secret kept hidden from the children
  choice_c: shaped the daily rhythms of the entire household
  choice_d: lasted for only a single summer
  correct_answer: C
  explanation: Blackout curtains, hushed afternoons, and careful tiptoeing show that the household's daily life bent around the father's daytime sleep. Choice A is not the point of the description. Choice B is wrong, since the children clearly knew, even if they misunderstood. Choice D contradicts 'most of my childhood.'
  distractor_types:
    A: inference_leap
    B: misidentified_detail
    D: opposite
