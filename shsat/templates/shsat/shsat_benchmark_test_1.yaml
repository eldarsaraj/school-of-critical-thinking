  passage_text: "Nature's first green is gold,\r\nHer hardest hue to hold.\r\nHer early leaf's a flower;\r\nBut only so an hour.\r\nThen leaf subsides to leaf.\r\nSo Eden sank to grief,\r\nSo dawn goes down to day.\r\nNothing gold can stay."
  question_text: How does the poem's movement from a spring leaf to "Eden" and then to "dawn" contribute to its meaning?
  choice_a: It shows that the seasons follow a fixed, predictable order.
  choice_b: It contrasts the beauty of nature with the sadness of human history.
  choice_c: It argues that people once lived in a more perfect age.
  choice_d: It widens a small natural change into a pattern found everywhere.
  correct_answer: D
  explanation: "Frost builds the poem as a chain of parallels — \"So Eden sank to grief, / So dawn goes down to day\" — linking the fading of a single spring leaf to the loss of paradise and to the close of every dawn. By moving from the tiniest natural detail outward to the mythic and then to the daily, the poem makes its claim universal: the fading of the golden isn't just a fact about leaves but a pattern that holds at every scale — D. \r\n\r\nA shrinks the poem to a point about the orderly cycle of seasons, but Eden and dawn aren't seasons; the reach is far wider. B reads \"Eden\" as setting human sadness against natural beauty, yet the \"So… So…\" parallels draw leaf, Eden, and dawn into one shared pattern rather than contrasting them. C over-reads the Eden image into a claim about a lost golden age of humankind — a historical argument the poem never makes; Eden is simply one more example of the golden that couldn't last."
