  passage_title: The Blue Door
  passage_text: "For as long as Maya could remember, the door of the house next to hers had been blue, the deep, chipped blue of an old rowboat. The woman who lived behind it was named Mrs. Okafor, and she was, in Maya's opinion, the slowest person in the world. It took Mrs. Okafor a full minute to climb her three front steps. It took her even longer to fit her key into the lock, and Maya, racing past on her bicycle, often wondered how anyone could move so carefully through a day.\r\n\r\nThat summer, Maya's mother began sending her next door with covered plates—rice and stew on Sundays, slices of cake on birthdays. \"Stay and talk a little,\" her mother always said. \"She lives alone.\" Maya did not want to stay and talk. She wanted to be at the park, where the others were already choosing teams without her.\r\n\r\nThe first afternoon, she handed over the plate at the blue door and turned to leave. \"You are in a great hurry,\" Mrs. Okafor said. It was not a question. Maya stopped. \"Come.\
    \ You can spare an old woman ten minutes.\" Her voice was warm but left no room for argument.\r\n\r\nInside, the apartment smelled of cloves and old paper. Every surface held something: small carved animals, photographs in mismatched frames, a clock that ticked too loudly. Mrs. Okafor lowered herself into a chair as slowly as ever and gestured for Maya to sit. Then she picked up a wooden bird from the table and turned it over in her hands. \"My husband carved this,\" she said. \"He was a teacher. He could not sit still either, when he was young. Like you.\" She smiled at Maya as if they shared a secret.\r\n\r\nShe began to talk—about the country she had left long ago, about the ship that had carried her across an ocean, about learning a new language one stubborn word at a time. Maya, who had meant to leave after ten minutes, found that an hour had passed and she had not once thought about the park.\r\n\r\nShe came back the next day without being sent. And the day after that. Mrs. Okafor\
    \ taught her to fold paper into cranes and to say \"thank you\" in three languages. Maya taught Mrs. Okafor the names of the players on her favorite team, and Mrs. Okafor pretended, badly, to care. Some afternoons they simply sat, the loud clock ticking, and said nothing at all.\r\n\r\nIt was on one of those quiet afternoons that Maya understood something. Mrs. Okafor did not move slowly because she was old and tired. She moved slowly because she had decided, somewhere along the way, that the small things—the key in the lock, the bird in her hands, the face of a child at her door—were worth the time it took to notice them.\r\n\r\nWhen Maya rode past the blue door now, she did not race. She slowed down, and sometimes she stopped, and the summer, which she had been so afraid of wasting, did not feel wasted at all."
  question_text: Which detail best shows that Olivia's feelings about the visits have changed?
  choice_a: She came back down the hall without being sent and "did not once glance at the stove."
  choice_b: She thought about Mrs. Okafor's wish "more than she expected to."
  choice_c: Her fourth paper crane "was not crooked at all."
  choice_d: She could hear the older kids "calling names across the asphalt."
  correct_answer: A
  explanation: "This is an evidence question, so the job is to find the detail that most directly proves a change in feeling about the visits — and the trap is that three of the four are real signals of something. A is correct: coming back on her own, when before she had to be sent, and not once checking the clock, when before she counted the minutes, reverses the two behaviors the story used to mark her reluctance. That double reversal is the clearest proof her feelings have changed. \r\n\r\nB is a genuine early sign — she's beginning to care — but it's an internal flicker partway through, weaker than the decisive end-state evidence in A. \r\n\r\nC is a true before-and-after, yet it shows her getting better at folding — a change in skill, not in feeling. D is emotionally loaded, since the games are exactly what she used to wish she were part of, but the detail is about the other kids, not Olivia; her change is shown by what she does instead, not by the games going on."
  distractor_types:
    B: partly_true_but_wrong
    C: misidentified_detail
    D: true_but_irrelevant
