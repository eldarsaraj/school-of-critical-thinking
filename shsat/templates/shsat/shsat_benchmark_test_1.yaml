  question_text: Which detail best shows that, at first, Olivia did not want to spend time with Mrs. Okafor?
  choice_a: By four-fifteen the older kids had split into teams, "calling names across the asphalt, none of them hers."
  choice_b: She counted the minutes on the clock until leaving "would not be rude."
  choice_c: She set the plate down and answered three questions about school.
  choice_d: She asked about the cranes "before she remembered she did not care."
  correct_answer: B
  explanation: "All four are real details, and each carries a whiff of Olivia's reluctance or disengagement — that's what makes them hard to separate. \r\n\r\nB is correct because counting the minutes until she can leave without being rude directly shows she doesn't want to be spending that time. \r\n\r\nA shows Olivia feeling left out, but that feeling is aimed at the other kids and at being new, not at Mrs. Okafor — true, but the wrong target. C is just the bare routine of the visit; doing the polite minimum isn't the same as wishing to be gone. D is the closest trap: \"before she remembered she did not care\" sounds like indifference — but it's indifference to the cranes specifically, and the very next lines undercut it (\"She thought about it more than she expected to\"). \r\n\r\nSo D is a flicker of disinterest the story immediately complicates, while B plainly shows her waiting for the visit to end."
