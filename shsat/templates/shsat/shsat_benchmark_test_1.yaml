  question_text: The passage's statement that octopuses are "almost certainly colorblind and somehow match their surroundings anyway" most strongly suggests that —
  choice_a: octopuses can see far more colors than humans can.
  choice_b: octopuses change color only when they are hiding from predators.
  choice_c: octopuses carefully study their surroundings to choose the right colors.
  choice_d: scientists do not fully understand how octopuses match colors they apparently cannot see.
  correct_answer: D
  explanation: "The clue words are \"somehow\" and \"anyway\": the octopus is \"almost certainly colorblind and somehow match[es] their surroundings anyway.\" That phrasing presents the color-matching as a genuine puzzle, which is why D is the best inference. \r\n\r\nA flips the passage outright — the octopus is colorblind, not blessed with extra color vision. B narrows the behavior to a single purpose the passage never claims; the text says the skin \"ripples through thousands of colors and textures,\" not that it does so only to hide. C is the trap for readers who try to explain the mystery away — if the octopus cannot see color, it cannot be \"studying\" colors to choose them, which is exactly what makes the matching so puzzling."
