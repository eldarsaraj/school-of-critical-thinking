    \ of his apartment in Brooklyn.\r\n\r\nA chief engineer who could not visit his own bridge would seem to be no chief engineer at all. That the work went on — for more than a decade — was owing in large part to his wife, Emily Warren Roebling. She taught herself the mathematics of the cables, the behavior of materials under strain, the details of a construction her husband could only describe to her. Day after day she carried his instructions to the site, met with the assistant engineers and the doubting city officials, and answered their technical questions herself. To the men building the bridge, she was, in practice, the voice of the chief engineer. When it finally opened, Emily Roebling was the first to ride across.\r\n\r\nEven the finished structure kept its secrets. Partway through, it came to light that a contractor had supplied defective wire for the cables, some of it already spun into place and impossible to remove. Rather than start over, Washington Roebling ordered enough\
    \ additional wire added that the cables would hold regardless — and so the bridge that carries traffic today is, by deliberate design, far stronger than its builders strictly needed it to be. The flaw is still up there, woven invisibly into the span.\r\n\r\nThe public, of course, saw none of this. They saw two soaring Gothic towers and a glittering web of cable, and they made the bridge an instant emblem of the age — of steel, of ambition, of a young country certain it could build anything. The names fixed to that emblem were the names of the men who had designed it. The hands that finished it, and the bodies that paid for it, were mostly left below the waterline of memory, where so much of the bridge's true work had always been done."
  question_text: The closing image — that the workers were "left below the waterline of memory" — is most effective because it —
  choice_a: reminds readers that the deepest work took place underwater
  choice_b: shows that all great achievements are eventually forgotten
  choice_c: ties the hidden underwater labor to its being forgotten
  choice_d: warns the bridge may fail because of the flaw hidden beneath it
  correct_answer: C
  explanation: "\"Below the waterline of memory\" works on two levels at once. Literally, the bridge's foundational labor was done below the water, in the caissons; figuratively, the people who did it have sunk out of memory. The clause \"where so much of the bridge's true work had always been done\" welds the two together, so that being forgotten is pictured as the very same submersion as the unseen work itself — C. \r\n\r\nA catches only the literal half: the deepest work was underwater, but read as a plain reminder of that fact, the image loses its metaphorical force. B stretches the line into a universal truth that everything fades, dropping the passage's pointed contrast between the remembered designers and the forgotten builders. D mistakes which hidden thing the closing means — it reaches back to the defective wire and reads a warning of collapse, but the final image is about people and memory, not the structure's safety."
  distractor_types:
    A: too_literal
    B: too_broad
    D: wrong_concept
