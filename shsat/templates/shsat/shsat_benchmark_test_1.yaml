  question_text: The passage author's attitude toward Goodall is best described as —
  choice_a: open admiration for a researcher the author plainly regards as a hero
  choice_b: quiet doubt about a reputation the author thinks was overblown
  choice_c: respect tempered by a refusal to simplify her story
  choice_d: detached neutrality toward a career the author won't judge
  correct_answer: C
  explanation: "The author's stance is built from two pulls held in balance. On one side is real respect — Goodall \"sat still long enough to see what better-equipped people had walked past,\" and \"was right about a good deal of it.\" On the other is a steady refusal to tidy the story: the author grants that the critics' objection \"was not foolish,\" airs the feeding-station problem that \"might have altered what there was to notice,\" and calls the boundary one she \"is said to have moved.\" \r\n\r\nC names both halves at once. A hears only the respect and inflates it into hero-worship, ignoring how carefully the author complicates the picture. B hears only the reservations and turns them into doubt about her worth — but the author plainly thinks she got the important things right. D notices the even-handedness on the unsettled questions and mistakes it for having no view at all; the regard underneath is unmistakable."
