  passage_text: "If you wanted to imagine a mind utterly unlike your own, you could hardly do better than an octopus. It has three hearts, blue blood, and no bones at all, so that a creature the size of a large dog can pour its entire body through a gap no wider than a coin. For centuries, sailors told stories of monstrous octopuses dragging ships beneath the waves. The truth is stranger than the legends, and far more interesting: the octopus is one of the most intelligent animals on Earth, yet its intelligence took shape along a branch of the tree of life almost unimaginably distant from our own.\r\n\r\nThat distance matters. The last common ancestor of humans and octopuses lived more than five hundred million years ago and was, most scientists believe, a simple wormlike creature with little more than a smudge of nerve cells. Whatever cleverness the octopus possesses, it did not inherit from the same source we did. It evolved a mind, in effect, from scratch — which is why that mind is so\
    \ hard for us to recognize, and so fascinating once we do.\r\n\r\nConsider where the octopus keeps its thinking. In a human being, nearly all the neurons are packed into the brain. In an octopus, most of them are not. The majority of its nerve cells are spread throughout its eight arms, so that each arm can taste, touch, and even make small decisions on its own, without waiting for instructions from the central brain. An octopus does not simply command its arms the way you command your hand; it cooperates with them. Cut free from the body, an octopus arm will still reach out and grasp at food. It is tempting to say the animal has nine brains rather than one, though the truth is subtler than that.\r\n\r\nThe behavior that follows from this strange anatomy has astonished the scientists who study it. Octopuses have unscrewed jars to reach the food inside, found their way through mazes, and squirted jets of water at laboratory keepers they apparently disliked while behaving warmly toward\
    \ those who fed them. Some carry coconut shells across the seafloor to assemble into portable shelters — a use of tools once thought to belong to humans and a few clever birds alone. Their skin, meanwhile, ripples through thousands of colors and textures in less than a second, a feat made stranger still by the fact that octopuses are almost certainly colorblind and somehow match their surroundings anyway.\r\n\r\nAnd yet, for all these gifts, the octopus lives a short and solitary life, rarely longer than a year or two. It does not raise its young or learn from its elders; a mother octopus guards her eggs faithfully and dies, usually, around the time they hatch. Each octopus, in a sense, must invent the world alone. Why so much intelligence should have evolved in a creature with so little time to use it, and no one to pass it on to, is a question scientists cannot yet answer. The octopus remains, in the end, a reminder that a mind can take forms we are only beginning to understand."
  question_text: Why does the author point out that the last common ancestor of humans and octopuses lived more than five hundred million years ago?
  choice_a: To prove that octopuses are older and more advanced than human beings.
  choice_b: To support the idea that the octopus's intelligence developed separately from our own.
  choice_c: To explain how octopuses came to have three hearts and blue blood.
  choice_d: To suggest that humans and octopuses are, despite appearances, closely related.
  correct_answer: B
  explanation: "This is an author's-purpose question, so the task is to see what work the detail does in the passage. The ancient common ancestor — \"a simple wormlike creature with little more than a smudge of nerve cells\" — sets up the central claim that \"whatever cleverness the octopus possesses, it did not inherit from the same source we did,\" and so it \"evolved a mind, in effect, from scratch.\" That makes B correct. \r\n\r\nA tempts because a long timeline can suggest \"older, therefore superior,\" but the passage never ranks octopuses above humans — its point is that the two minds are different, not that one is better. C grabs unrelated details (three hearts, blue blood) that the ancestor sentence has nothing to do with. D is the trap for readers who see the word \"ancestor\" and assume \"closely related,\" when the whole point of five hundred million years is how vast the distance is."
  distractor_types:
    A: inference_leap
    C: misidentified_detail
    D: opposite
