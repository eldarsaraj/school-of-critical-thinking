  passage_group_id: ela_e_p2
  passage_title: The Blue Door
  passage_text: "The summer the Acostas moved to Linden Street, Olivia learned to tell time by the sounds of other people's fun. At four o'clock the older kids dragged the soccer net into the lot behind the building; by four-fifteen they had split into teams, calling names across the asphalt, none of them hers. She was new, and being new, she was discovering, was a kind of weather you simply had to wait out.\r\n\r\nSo when her mother began sending her down the hall with covered plates — \"Just bring this to Mrs. Okafor, and stay a little, it's polite\" — Olivia went the way you go to a dentist. Mrs. Okafor lived behind the only blue door on the floor, and she opened it slowly, always, as though the hallway might hold a surprise she wanted time to prepare for. Inside, the apartment smelled of cloves and old paper.\r\nEverything Mrs. Okafor did, she did slowly. She crossed the small kitchen as if the floor were something to be considered. She poured tea in a thin, unhurried line and set the\
    \ pot down without a sound. At first Olivia took the slowness for the ordinary slowness of the old — the careful, shuffling pace of someone whose knees have begun to argue with the stairs. She would set the plate down, answer three questions about school, and count the minutes on the clock above the stove until enough of them had passed that leaving would not be rude.\r\n\r\nIt was on her fourth or fifth visit that she noticed the cranes. They hung from a thread strung across the window, dozens of folded paper birds turning in the draft, and each one, she saw when she looked closely, had a tiny number inked on its wing. 617. 618. 619.\r\n\"Why do you number them?\" Olivia asked, before she remembered she did not care.\r\nMrs. Okafor did not look up from the square of paper she was creasing. \"So I know how far I have left to go,\" she said. \"A thousand. When you have folded a thousand, you are permitted to wish for one thing.\" She pressed a wing flat with her thumbnail, slowly, as\
    \ though the bird might bruise. \"It must be the same wish each time, I am told, or it does not count.\"\r\n\r\nOlivia thought about that. She thought about it more than she expected to. \"What will you wish for?\"\r\n\r\nThe old woman's hands went still for a moment. Then they started again. \"That,\" she said, \"is between me and the cranes.\"\r\n\r\nShe taught Olivia to fold one before the plate was empty — the valley folds, the reverse folds, the sharp last pull that makes a flat sheet stand up and become a bird. Olivia's hands flew, and her first three cranes came out lopsided, one wing always larger than the other. Mrs. Okafor watched without comment. \"Fast hands make crooked birds,\" she said at last, and folded another of her own, so slowly that Olivia could follow every crease. Olivia tried again, slower this time. Her fourth crane was not crooked at all. That was the first afternoon she forgot to look at the clock.\r\n\r\nThe next day, Olivia came back down the hall without\
    \ being sent. The net was already up in the lot; she could hear the names being called across the asphalt. She knocked on the blue door anyway and waited while it opened, slowly, the way it always did, and she did not once glance at the stove. On the thread by the window a new bird had appeared since the day before. Olivia found a square of paper, sat down, and began, carefully, to fold. Past her shoulder the number on the newest crane read 622."
  question_text: "At first Olivia takes Mrs. Okafor's slowness for \"the ordinary slowness of the old.\" \r\n\r\nTaken together, the careful way Mrs. Okafor folds, her remark about \"fast hands,\" and Olivia's own improvement when she slows down most strongly suggest that Mrs. Okafor's slowness is —"
  choice_a: a sign that she is too frail to move any faster
  choice_b: a deliberate way of doing things with full attention and care
  choice_c: a habit she is embarrassed about but cannot break
  choice_d: a trick meant to make Olivia stay longer than she wants
  correct_answer: B
  explanation: "The passage first offers the frailty reading — \"the ordinary slowness of the old\" — and then silently overturns it. The thumbnail crease made \"as though the bird might bruise,\" the line \"fast hands make crooked birds,\" and Olivia's straight fourth crane once she slows down all point to slowness as a chosen, attentive way of doing things, which is why B is correct. \r\n\r\nA is exactly the assumption the passage sets up and then revises, so it traps readers who stop at the first explanation given. C invents an embarrassment the text never hints at. D misreads her motive — nothing suggests she is trying to detain Olivia; in fact, Olivia later comes back on her own."
  distractor_types:
    A: opposite
    C: inference_leap
    D: inference_leap
