  choice_c: real and genuine
  choice_d: straight or upright
  correct_answer: D
  explanation: "This is a vocabulary-in-context item built on a less common sense of a familiar word, so the meaning you reach for first is the trap. The stakes were planted upright and are later found \"dragged far down the valley and tilted\" — to be \"out of true\" is to be out of straight, upright alignment, which is why D is correct (the same sense a carpenter means when a board is \"true\"). \r\n\r\nA is the biggest pull: \"true\" usually means accurate or factual, but a stake can't be \"tilted out of honesty.\" B and C reach for other everyday senses — true as loyal (\"a true friend\"), true as genuine (\"true gold\") — neither of which fits a leaning stake. Only the alignment sense makes sense of \"tilted.\""
