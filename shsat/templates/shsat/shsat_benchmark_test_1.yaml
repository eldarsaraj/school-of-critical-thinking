  question_text: Near the end of the passage, the author sets the famous, public Goodall against the obscure young observer she once was. This contrast mainly works to —
  choice_a: turn attention from her fame toward the work that mattered
  choice_b: show how completely her life changed once she grew famous
  choice_c: suggest her later fame was the truest measure of her work
  choice_d: remind readers that she lacked the training other scientists had
  correct_answer: A
  explanation: "The author splits Goodall in two — the figure on \"magazine covers and television specials,\" the one \"most people picture,\" set against \"the earlier one,\" who \"is harder to make out\" yet \"was right about a good deal of it.\" Placing the famous figure beside the obscure young watcher pulls the reader's eye away from the celebrity and toward the substance the fame has overshadowed, so A. \r\n\r\nB treats the contrast as a simple before-and-after of her life — true on the surface, but it misses that the author is ranking the two, not just charting a change. C inverts the author's view: the passage treats the fame as what most people picture, not as the real measure of her work. D fastens onto one detail — that she lacked credentials — and mistakes it for what the whole contrast is doing."
