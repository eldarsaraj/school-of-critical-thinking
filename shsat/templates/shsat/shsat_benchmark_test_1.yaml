  passage_title: Nothing Gold Can Stay — Robert Frost
  passage_text: "Nature's first green is gold,\r\nHer hardest hue to hold.\r\nHer early leaf's a flower;\r\nBut only so an hour.\r\nThen leaf subsides to leaf.\r\nSo Eden sank to grief,\r\nSo dawn goes down to day.\r\nNothing gold can stay."
  question_text: Which statement best expresses the central idea of "Nothing Gold Can Stay"?
  choice_a: The newest and most beautiful things last the shortest time.
  choice_b: Plants and leaves look their most golden in early spring.
  choice_c: Ordinary things slowly grow more precious as time passes.
  choice_d: Every change that happens in nature is a cause for sorrow.
  correct_answer: A
  explanation: "Every image in the poem pairs something precious with its quick loss: the \"first green is gold\" but is \"her hardest hue to hold\"; the early leaf is \"a flower\" but \"only so an hour\"; \"dawn goes down to day\"; even \"Eden sank to grief.\" Together they say the finest, newest things are exactly the ones that vanish fastest — A, which is why \"Nothing gold can stay.\" \r\n\r\nB takes the gold literally, as if the poem reports the color of spring plants; \"gold\" stands for what is precious and new, not a hue. C reverses the poem's whole direction — its movement is from gold down to ordinary green, from dawn down to day, precious things fading rather than plain things improving. D inflates the poem into a claim that all natural change is sad; it mourns one specific thing — how briefly the best moments last — not change in general."
  distractor_types:
    B: too_literal
    C: opposite
    D: too_broad
