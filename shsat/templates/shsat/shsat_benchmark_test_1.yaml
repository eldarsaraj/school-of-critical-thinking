  question_text: As used in the passage, the word "command" most nearly means —
  choice_a: to earn or deserve
  choice_b: to direct or control
  choice_c: to gently ask for
  choice_d: to work together with
  correct_answer: B
  explanation: "In context, the octopus \"does not simply command its arms the way you command your hand,\" and the sentence immediately sets commanding against cooperating — so \"command\" here means to direct or control, B. \r\n\r\nD is the sharpest trap: because the sentence contrasts \"command\" with \"cooperates with them,\" a hasty reader may borrow the meaning of the contrasting word and pick \"work together with,\" which is actually the opposite of command. \r\n\r\nA reaches for the familiar phrase \"command respect,\" where the word means to earn or deserve — a real sense of \"command,\" but not the one the sentence uses. C softens a forceful word into a polite request, which doesn't fit the contrast either."
  distractor_types:
    A: surface_match
    C: wrong_concept
    D: opposite
