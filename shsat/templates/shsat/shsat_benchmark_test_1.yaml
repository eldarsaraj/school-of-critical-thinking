  passage_title: Jane Goodall and the Chimpanzees of Gombe
  passage_text: "In July of 1960, a twenty-six-year-old Englishwoman named Jane Goodall stepped off a boat onto the eastern shore of Lake Tanganyika, in what was then the British colony of Tanganyika, and set about doing something no one had managed before: living close enough to wild chimpanzees to learn how they actually behaved. She had no university degree, no training in animal behavior, and no theory she meant to prove. She also, by order of the colonial authorities, could not be there alone — a young woman in the bush required a chaperone — so for the first months her mother camped beside her. What Goodall had brought of her own was a notebook, a pair of binoculars, and a willingness to sit on a hillside, day after day, until the animals stopped fleeing at the sight of her. That took the better part of a year.\r\n\r\nThe man who had arranged the expedition, the anthropologist Louis Leakey, had wanted exactly this kind of recruit. A conventionally trained scientist, he argued, would\
    \ arrive already certain of what an animal could and could not do, and would notice only what that certainty allowed; a patient observer with no such baggage might see more. Leakey would go on to send two other untrained young women into the field to study gorillas and orangutans, convinced — on grounds he never fully explained — that women made the steadier watchers. Whether his reasoning was insight or hunch is hard to say. In Goodall's case, at least, it paid off quickly.\r\n\r\nThe discovery came within months. Goodall watched a chimpanzee she had taken to calling David Greybeard select a slender stem, strip away its leaves, and poke it into a termite mound, then draw it back out and eat the insects clinging to it. He had not picked up a tool; he had made one. At the time, toolmaking was widely held to be the very thing that separated human beings from every other animal, and the observation traveled fast. Leakey's much-quoted reply was that science must now redefine \"tool,\" redefine\
    \ \"man,\" or else admit the chimpanzee to the family — a line that has the ring of a man aware it would be repeated. The National Geographic Society, which had begun funding the work, sent a photographer; the films and magazine spreads that followed would make Goodall, and her chimpanzees, famous.\r\n\r\nFame did not bring the approval of her field. When Leakey arranged for her to pursue a doctorate at Cambridge — extraordinary for someone who had never earned a bachelor's degree — her new colleagues informed her that she had done everything wrong. She should not have given the chimpanzees names; she should have assigned them numbers, to keep sentiment at a safe distance. She should not have written of their personalities, their friendships, their apparent grief. To attribute such inner lives to an animal was, they told her, not science. The objection was not foolish. The hazard of reading human feeling into a creature is that one is so often mistaken, and there was no reliable way\
    \ to separate Goodall's careful descriptions from hopeful ones.\r\n\r\nThe harder question was whether Goodall, in getting close, had changed the very thing she meant to study. To keep the chimpanzees near her camp, she had begun setting out bananas — a feeding station that drew them in reliably but also, some researchers later argued, crowded them together and sharpened their competition in ways the forest never would have. When a prolonged and lethal conflict broke out between two groups in the 1970s, with one community slowly destroying the other, observers disagreed about what they were seeing: a glimpse of how chimpanzees behave when left to themselves, or a disturbance of her own making. The dispute has never been fully settled, and it cuts to the center of her method. The closeness that let her notice what others had missed was the same closeness that might have altered what there was to notice.\r\n\r\nAnd yet much of what she reported did hold up. Later and more guarded studies\
    \ confirmed that chimpanzees form lasting bonds, comfort one another in distress, use and make a variety of tools, and possess emotional lives far richer than science had been prepared to grant them. The particular claims were borne out, even if the broader principle — how much one may safely infer about the mind of an animal — remained, and remains, unresolved.\r\nIn the decades after, Goodall left the hillside for the lecture hall. She became a fixture on magazine covers and television specials, the founder of a youth movement now active in more than sixty countries, a figure who stood, in the public mind, for the protection of wild things in general. It is this later Goodall most people picture. The earlier one is harder to make out — a young woman with no particular qualifications who sat still long enough to see what better-equipped people had walked past, and who was right about a good deal of it. Whether the boundary she is said to have moved has stayed where she left it is, perhaps,\
