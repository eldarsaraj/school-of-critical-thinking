  passage_title: Rivers of Ice
  passage_text: "High in the mountains and across the frozen poles lie some of the most powerful sculptors on Earth. They do not work with hammers or chisels. They are glaciers, enormous and slow-moving rivers of ice, and over thousands of years they have carved deep valleys, ground down mountains, and shaped much of the land we live on today.\r\n\r\nA glacier is born from snow. In places where more snow falls each winter than melts away each summer, the snow never fully disappears. Instead, layer piles upon layer, year after year. The weight of the snow above slowly presses the snow below into dense ice, much as a snowball packs tighter the harder you squeeze it. When the ice grows thick and heavy enough, often hundreds of feet deep, something remarkable happens. Pulled steadily by gravity, the entire frozen mass begins, very slowly, to move.\r\n\r\nThere are two main kinds of glaciers. Valley glaciers flow downhill through mountain valleys like frozen streams. Continental glaciers, also\
    \ called ice sheets, are vast domes of ice that can bury an entire landmass; today they cover most of Greenland and Antarctica. During the last ice age, ice sheets thousands of feet thick spread across much of North America and Europe before melting back to where they remain today.\r\n\r\nGlaciers move so slowly that the motion is almost impossible to see. Many creep forward only a few inches a day. Yet over centuries this patient movement reshapes the world. As a glacier flows, it behaves like a giant sheet of sandpaper. Rocks frozen into the bottom of the ice grind against the ground, gouging out deep grooves and crushing solid stone into fine powder. A valley that began as a narrow, V-shaped notch cut by a stream is slowly widened and deepened into a broad, U-shaped trough with steep walls. Many of the most dramatic landscapes on Earth, from the deep fjords of Norway to the towering cliffs of Yosemite Valley, were sculpted in exactly this way.\r\n\r\nWhen a glacier finally melts,\
    \ it leaves behind clues that tell its story. It drops the rocks and dirt it has carried for miles, sometimes piling them into long ridges called moraines. Occasionally it strands a boulder the size of a house far from any rock like it, a puzzle that once baffled scientists who could not imagine what force had carried it there. Meltwater fills the hollows the ice scooped out, forming lakes. The Great Lakes of North America, which together hold about one-fifth of the world's fresh surface water, sit in enormous basins carved by glaciers during the last ice age.\r\n\r\nToday, many of the world's glaciers are shrinking, and scientists study them with growing concern. Glaciers store huge amounts of fresh water that whole regions depend on, releasing it slowly each summer as they melt. The ice also holds a frozen record of the distant past. Bubbles trapped deep within a glacier contain tiny samples of ancient air, allowing researchers to learn what the planet's atmosphere was like many thousands\
    \ of years ago. These rivers of ice move far too slowly for us to watch, yet they have written much of the story of our planet, and they are still writing it today."
  question_text: The final paragraph most strongly suggests that the disappearance of glaciers is a loss in part because —
  choice_a: the valleys and fjords that glaciers carved will gradually fill back in
  choice_b: future generations will have no way at all to study Earth's history
  choice_c: it erases a record of the distant past that nothing else preserves
  choice_d: glaciers will no longer be able to carve out new valleys
  correct_answer: C
  explanation: "This one asks you to read past the obvious. The final paragraph names two costs of melting — lost fresh water and a vanishing \"archive\": bubbles in the ice \"hold samples of ancient air, letting scientists read what the planet's atmosphere was like tens of thousands of years ago,\" a record the melting will \"erase.\" The subtle point is that this record exists nowhere else in the same form, so once the ice is gone it can't be recovered — C. \r\n\r\nA is the trap that depends on remembering an earlier paragraph: it feels plausible that melting would undo the glacier's carving, but the passage already said \"much of their work survives them\" — the valleys and fjords remain even after the ice is gone. B takes the loss of the glacial record and overstates it into losing \"history at all,\" when glaciers are only one archive among others. D names a real consequence — no new carving — but that isn't the loss this paragraph is about, which is the vanishing record of the past,\
    \ not future landscapes."
  distractor_types:
    A: opposite
    B: too_broad
    D: inference_leap
