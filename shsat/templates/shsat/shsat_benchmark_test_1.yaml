    \ hint of emptiness, has in a sense lost the ability to keep himself company. He is never quite alone with his mind, because he never lets his mind be quiet long enough to hear it. We may be raising a generation superbly skilled at avoiding boredom and strangely unpracticed at the thing boredom was always secretly teaching: how to sit with oneself.\r\n\r\nNone of this is an argument for manufacturing misery, or for romanticizing the dull. It is only a plea for restraint. The next time you find yourself waiting, with nothing to do and the familiar itch to reach for the screen, you might try, just once, to do nothing instead. Let the boredom come. Let the mind grow restless and then watch where it goes. You may find that the empty minute was not empty after all, and that we were never meant to fill every silence the instant it appeared."
  question_text: As used in the passage, the word "banish" most nearly means —
  choice_a: to warmly welcome
  choice_b: to carefully measure
  choice_c: to clearly remember
  choice_d: to drive away
  correct_answer: D
  explanation: To say boredom 'can now be banished instantly and forever' is to say it can be driven away or gotten rid of. Choice A is the opposite, and choices B and C do not fit the sentence.
  distractor_types:
    A: opposite
    B: inference_leap
    C: inference_leap
