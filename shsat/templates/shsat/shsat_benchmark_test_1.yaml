  question_text: The author sets Olivia's "fast hands" against Mrs. Okafor's slow, careful folding mainly in order to —
  choice_a: show that Mrs. Okafor is a more experienced crane-folder than Olivia
  choice_b: suggest that doing things slowly is always better than doing them quickly
  choice_c: contrast two ways of doing things — hurried and patient — and prepare for the change in Olivia
  choice_d: establish that Olivia is simply an impatient person
  correct_answer: C
  explanation: "This is an author's-purpose question, so the task is to name what the contrast is for, not just what it literally compares. \r\n\r\nC is correct: the gap between Olivia's flying, crooked-bird hands and Mrs. Okafor's deliberate folding sets up two ways of doing things, and it's planted precisely so that Olivia's later shift — slowing down, her straight fourth crane, forgetting the clock — registers as a real change. \r\n\r\nA is true on its face (Mrs. Okafor is more practiced), which is exactly why it tempts, but a skill comparison isn't the reason the author builds the contrast. D grabs only the \"before\" half: yes, Olivia starts out hurried, but the contrast exists to set up her transformation, not merely to label her. \r\n\r\nB is the tempting \"moral\" — the passage clearly values patient attention here, yet it never claims slowness is always better, so B inflates one specific moment into a blanket rule."
