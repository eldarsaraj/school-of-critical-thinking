  question_text: The author would most likely agree that the decision about whether to pursue de-extinction —
  choice_a: should be left entirely to the scientists who have the technology
  choice_b: depends as much on human judgment and values as on scientific ability
  choice_c: has already been settled in favor of bringing species back
  choice_d: matters only to people who study extinct animals
  correct_answer: B
  explanation: The passage closes that de-extinction 'forces us to decide not only what we are able to do, but what we ought to do' and will 'test not only our science but our wisdom,' stressing values alongside ability. Choice A contradicts that framing of a shared moral choice. Choice C is wrong because the passage treats the question as unresolved. Choice D narrows a question the author presents as broadly human.
  distractor_types:
    A: inference_leap
    C: opposite
    D: too_narrow
- section: ELA
  stage: hard_module
  question_number: 5
  question_type: multiple_choice
  skill: supporting_detail
  difficulty: medium
  topic: ''
  passage_group_id: ela_h_p1
  passage_title: The Tragedy of the Commons
  passage_text: "Imagine a village whose families share a single open pasture, a common field on which anyone may graze cattle. To each herder, the logic of self-interest seems clear. Adding one more cow brings that herder the full benefit of a fatter animal to sell, while the cost, a slight thinning of the shared grass, is divided among everyone. So each herder, acting sensibly, adds another cow, and another. The grass, asked to feed more animals than it can sustain, is grazed down to bare dirt, and the pasture that might have fed the village for generations is destroyed in a single season.\r\n\r\nThis scenario, popularized by the ecologist Garrett Hardin in 1968, has come to be known as the tragedy of the commons. Its power lies in an unsettling paradox: ruin arrives not because any individual behaves wickedly or foolishly, but precisely because each behaves rationally. The herder who shows restraint and keeps a small herd does not save the pasture; he merely surrenders his share of it\
    \ to those who do not. Individual reason and collective welfare pull in opposite directions, and the commons is the casualty.\r\n\r\nThe idea has proven disturbingly general. The world's oceans are a commons, and fish populations have collapsed as fleets compete to catch what they can before rivals do. The atmosphere is a commons into which every nation is tempted to release its waste, since the harm is shared globally while the benefit is captured locally. In each case, the same structure appears: a shared resource, individuals who gain privately from overusing it, and a cost that is spread so thinly that no single user feels compelled to stop.\r\n\r\nHardin's own proposed solutions were controversial, and later scholars complicated his gloomy conclusion. The political scientist Elinor Ostrom, who won a Nobel Prize for her work, showed that communities around the world have in fact governed shared resources successfully for centuries, not through distant authority but through their\
    \ own carefully crafted rules, trust, and mutual oversight. The tragedy, her research suggested, is not inevitable. But it remains a warning that haunts any society that depends, as every society does, on something held in common."
  question_text: According to the passage, the tragedy of the commons occurs because each herder —
  choice_a: behaves cruelly toward the other herders in the village
  choice_b: is forbidden from grazing any animals on the field
  choice_c: refuses to add even a single animal to the pasture
  choice_d: gains the full benefit of an added animal while sharing only a small part of the cost
  correct_answer: D
  explanation: The passage explains that 'adding one more cow brings that herder the full benefit ... while the cost ... is divided among everyone,' and this imbalance drives overuse. Choice A contradicts the passage's insistence that ruin comes from rational, not wicked, behavior. Choices B and C reverse the situation the passage describes.
  distractor_types:
    A: opposite
    B: opposite
    C: opposite
