  passage_group_id: ela_r_re
  passage_title: The Invention of Braille
  passage_text: (1) For most of history, blind people had no easy way to read on their own. (2) That changed because of a French boy named Louis Braille, who lost his sight in an accident at the age of three. (3) As a teenager, Braille invented a system of raised dots that a reader could feel with the fingertips. (4) Each pattern of dots stands for a letter, a number, or even a musical note. (5) Today, the system he created is used in nearly every language on Earth, it has opened the world of reading to millions of people.
  question_text: Which is the best way to combine sentences 1 and 2?
  choice_a: Louis Braille, the French boy who at last gave blind people a way to read on their own, lost his sight in an accident at age three.
  choice_b: For most of history, blind people had no easy way to read on their own, until Louis Braille — a French boy blinded in an accident at age three — changed that.
  choice_c: For most of history, blind people had no way to read at all, until a French boy named Louis Braille, blinded in an accident at age three, taught them.
  choice_d: For most of history, blind people had no easy way to read on their own, so a French boy named Louis Braille, who lost his sight in an accident at age three, invented one for them.
  correct_answer: B
  explanation: "All four are grammatical; the task is judging which combination keeps the meaning, emphasis, and logic intact most cleanly. B does: it preserves the exact claim (\"no easy way to read on their own\"), lands the emphasis on the change Braille brought, and links the ideas with \"until,\" which captures a situation that persisted and was then resolved. \r\n\r\nA is fully grammatical and includes every fact, but it makes Braille's blindness the main clause and demotes his actual achievement to a modifier — the sentence ends up stressing the wrong idea. C reads smoothly but quietly alters two details: \"no way to read at all\" overstates the passage's careful \"no easy way to read on their own\" (text could still be read to them), and \"taught them\" misstates what Braille did — he invented a system, he didn't personally teach readers. D is the subtlest: \"so\" inserts a cause-and-effect the passage never claims — that the historical lack of access is what prompted the invention.\
    \ The text presents the invention as what changed the situation, not as something caused by it."
  distractor_types:
    A: wrong_concept
    C: misidentified_detail
    D: causal_confusion
