  question_text: Which quotation best supports the idea that the men leading the project were exposed to the same physical dangers as the workers themselves?
  choice_a: '"Many were struck by a mysterious and agonizing illness: joints locked, bodies doubled over in pain."'
  choice_b: '"His foot was crushed between an incoming ferry and the dock; he died of infection within weeks."'
  choice_c: '"...watching the towers rise through a telescope from the window of his apartment in Brooklyn."'
  choice_d: '"Washington Roebling, who went down into the caissons himself, was among those it crippled."'
  correct_answer: D
  explanation: "The claim isn't stated in any single line — you have to connect a leader to the workers' specific peril. D does both: Washington \"went down into the caissons himself,\" into the very chambers where the laborers toiled, and \"was among those it crippled,\" struck by the same illness. \r\n\r\nA names the danger vividly, but it's about the workers, not about a leader sharing it. B is the subtle trap: John Roebling was a leader and he did die — yet his fatal injury came from a ferry while surveying, not from the caisson work the laborers faced, so it's a different danger, not \"the same.\" C points to Washington as well, but it shows him watching from a distance through a telescope, removed from the danger — the opposite of being exposed to it."
