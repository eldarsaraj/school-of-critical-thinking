  passage_group_id: ela_r_p4
  passage_title: On a Flood-Prone Block, a Garden Fights Back
  passage_text: "A city program pays Rego Park homeowners to turn pavement into rain gardens — and residents say it's working.\r\n\r\nREGO PARK, Queens — On the night the remnants of Hurricane Ida poured down on Queens, Marisol Reyes stood at the top of her basement stairs and watched the water climb toward the third step. By morning it had ruined the boiler, the washing machine, and a lifetime of boxed photographs.\r\n\r\nToday a corner of Ms. Reyes's small front yard on 63rd Drive looks like an ordinary flower bed — a shallow, planted dip filled with black-eyed Susans and switchgrass. It is, in fact, a piece of city flood-control infrastructure. When it rains, the water that once sheeted off her roof and driveway into the overwhelmed sewer now gathers in the dip, called a rain garden, and soaks slowly into the soil. \"I used to dread the forecast,\" Ms. Reyes said, standing beside it. \"Now I almost want it to rain, just to watch it work.\"\r\n\r\nShe is one of a growing number of Rego\
    \ Park residents taking part in Rain-Ready Blocks, a city program that pays property owners to trade hard, water-shedding surfaces — concrete, asphalt, bare roof runoff — for features that absorb rainfall instead. The reasoning behind it begins underground.\r\n\r\nFor most of the last century, the city has carried rain and sewage through the same pipes. On a dry day the system works smoothly. But during a heavy storm, when rain arrives faster than the pipes can drain it, the overloaded system spills the excess — a mixture of stormwater and untreated waste — straight into the nearest waterway. Neighborhoods like Rego Park, built low and paved over, flood first and worst. The conventional remedy, tearing up the streets to lay larger pipes, would cost billions and take decades.\r\n\r\nSo the city has bet on a different idea: thousands of small fixes in place of one enormous one. A single rain garden absorbs only a little. But scattered across the blocks that flood most, program officials\
    \ argue, enough of them can hold back the surge that drives the sewers past their limit. \"We're asking the neighborhood to become part of the drainage system,\" said Priya Anand, who manages the program for the city's environmental department. \"Every yard that drinks its own rain is a yard the sewer doesn't have to.\"\r\n\r\nNot everyone signed on at first. Daniel Cho, who replaced the concrete driveway two blocks away with permeable pavers that let water seep through, admits he was skeptical. \"It sounded like a lot of paperwork for a puddle,\" he said. \"Then Ida flooded my garage, and I stopped laughing.\" His new driveway, he says, drank a recent downpour while the street still glittered with standing water.\r\n\r\nThe program's rules can look strict, and they are deliberate. Grants go only to properties inside designated priority zones — the low-lying blocks where flooding is worst and where each garden does the most good. Applicants must have a minimum patch of pavement or bare\
    \ ground to convert, because a garden too small to hold much water is not worth the public expense. And every grant carries a condition that catches some owners off guard: a written promise to maintain the installation for at least five years. \"A rain garden full of weeds is just a hole,\" Ms. Anand said. \"We're buying a benefit that has to last.\"\r\n\r\nThe full list of requirements appears in the program's eligibility guide, reproduced below. Owners who qualify are reimbursed for most of the cost of the work, up to a fixed cap. Those who fall just outside a priority zone are urged to reapply in a later round; the zone lines are redrawn each year as new flooding data comes in, and a block left out this year may be eligible the next.\r\n\r\nFor Rego Park, much of which already sits inside a priority zone, the timing is good. The current application round is open through the fall, and outreach workers have been going door to door on the blocks hit hardest by Ida. The pitch is simple:\
    \ the work is mostly paid for, the gardens are modest to keep up, and the alternative is another ruined basement.\r\n\r\nEsther Abramowitz, who has lived on her block for forty years and signed up last spring, puts it more plainly. \"My neighbors keep asking if it really works,\" she said, nodding toward the native grasses where her driveway used to drain. \"I tell them to come look the next time it pours. The street floods. My yard doesn't.\""
  question_text: Based on the eligibility guide, which property owner would be turned down for a grant?
  choice_a: A homeowner in a priority zone whose property already has a city rain garden.
  choice_b: A homeowner in a priority zone with 220 square feet of driveway to convert.
  choice_c: A renter in a priority zone who has the property owner's written consent.
  choice_d: A homeowner in a priority zone willing to be reimbursed for 90% of the cost.
  correct_answer: A
  explanation: "You have to run each applicant against every line of the guide. A is turned down: the guide requires that a property \"not already be served by a city-installed green infrastructure project,\" and this one already has a city rain garden — disqualified, regardless of being in a priority zone. \r\n\r\nThe other three only look disqualifying. B's 220 square feet clears the 200-square-foot minimum, so the area is fine. C is a renter — but the guide expressly allows renters who include the owner's written consent, which this applicant has. D is reimbursed 90% of the cost, yet 90% is the maximum the program offers, not a shortfall that bars eligibility. Each wrong choice dangles a detail that looks like a disqualifier but that the guide actually permits."
  distractor_types:
    B: misidentified_detail
    C: too_broad
    D: partly_true_but_wrong
