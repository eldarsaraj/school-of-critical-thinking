  question_text: As used in the second paragraph ("a trick this useful"), the word "trick" most nearly means —
  choice_a: a deception that fools another creature
  choice_b: a clever, effective technique
  choice_c: an impressive, surprising feat
  choice_d: a mischievous prank or joke
  correct_answer: B
  explanation: "In the passage, \"trick\" names the light-making process itself — fireflies and deep-sea fish use \"nearly the same chemical trick,\" and \"a trick this useful… life keeps reinventing.\" That's a clever method or technique for producing light, so B. \r\n\r\nA is the trap the passage almost lays on purpose: bioluminescence really is used to deceive — luring prey, confusing predators — so \"deception\" feels contextually right; but \"the chemical trick\" refers to how the light is made, not to any act of fooling. C reads \"trick\" as an impressive feat and D as a prank — both are genuine meanings of the word, but neither fits a sentence about a repeatable chemical reaction. The item rewards reading \"trick\" in its own sentence rather than borrowing the deceptive behavior described elsewhere in the passage."
