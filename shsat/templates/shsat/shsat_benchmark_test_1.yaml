  question_text: "Which edit should be made to the sentence below?\r\n\r\n\"Among the documents in the archive is several letters written by the architect.\""
  choice_a: Change "letters" to "letter."
  choice_b: Change "documents" to "document."
  choice_c: Change "is" to "are."
  choice_d: Change "is" to "was."
  correct_answer: C
  explanation: "The sentence is inverted — the subject comes after the verb. Strip the opening phrases (\"Among the documents in the archive\") and the core is \"…is several letters,\" whose real subject is \"several letters,\" which is plural. The verb must be \"are\": \"Among the documents in the archive are several letters.\" So C. \r\n\r\nA is the classic inverted-sentence trap: instead of fixing the verb, it makes the subject singular (\"letter\") so \"is\" seems to fit — rewriting the meaning to suit the error. B changes \"documents,\" a noun buried in the opening prepositional phrase, which was never the subject. D spots that the verb is wrong but fixes the wrong feature — \"was\" is still singular, and the problem is number, not tense."
  distractor_types:
    A: overcorrection
    B: misattributed_error_location
    D: partly_true_but_wrong
- section: ELA
  stage: hard_module
  question_number: 2
  question_type: multiple_choice
