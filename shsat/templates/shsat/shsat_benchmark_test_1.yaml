  passage_title: Emily Dickinson, "Hope is the thing with feathers"
  passage_text: "\"Hope\" is the thing with feathers\r\nThat perches in the soul,\r\nAnd sings the tune without the words,\r\nAnd never stops at all,\r\n\r\nAnd sweetest in the gale is heard;\r\nAnd sore must be the storm\r\nThat could abash the little bird\r\nThat kept so many warm.\r\n\r\nI've heard it in the chillest land,\r\nAnd on the strangest sea;\r\nYet, never, in extremity,\r\nIt asked a crumb of me."
  question_text: The way the poem describes the bird most strongly suggests that hope —
  choice_a: is fragile and easily silenced when hardship arrives
  choice_b: stays quietly present through good times and bad alike
  choice_c: grows strongest when a person's circumstances are worst
  choice_d: can shield a person from any real danger or harm
  correct_answer: C
  explanation: "The poem's images don't merely say hope endures — they say it's loudest when life is hardest: hope is \"sweetest - in the Gale,\" and \"sore must be the storm / That could abash\" it (only a terrible storm could even discourage it). The bird is at full song precisely in the worst weather, so C. \r\n\r\nA reads the little bird as fragile, the opposite of what the poem insists — it takes an overwhelming storm to subdue it, and even then barely. B is the subtle miss: \"never stops\" does make hope constant, but \"stays quietly present… alike\" flattens the poem's stronger claim that hope is sweetest in the gale, not merely always around. D overreaches — the poem says hope comforts (\"kept so many warm\") and endures, never that it shields anyone from actual harm."
