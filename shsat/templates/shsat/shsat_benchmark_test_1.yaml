  passage_title: Building the Brooklyn Bridge
  passage_text: "When the Brooklyn Bridge opened in May of 1883, fourteen years in the making, it was the longest suspension bridge in the world, and to many who crossed it that first day it seemed less a piece of engineering than a kind of miracle — a roadway hung in the air over the East River on cables of steel, joining the city of Brooklyn to Manhattan for the first time. What the crowds could not see, walking the great span between its two stone towers, was how much of the bridge's real story lay out of sight: in the riverbed beneath their feet, and in the lives it had inevitably cost.\r\n\r\nThe bridge had been the vision of John Roebling, a German-born engineer who had spent his career proving that a roadway could be hung from spun-steel cable. He never saw a stone of it laid. While surveying the site in 1869, his foot was crushed between an incoming ferry and the dock; he died of infection within weeks, before construction had truly begun. The work passed to his son, Washington Roebling,\
    \ who had trained at his father's side and understood the design as well as anyone alive.\r\n\r\nThe first task was the hardest and the most dangerous. To anchor the towers, workers had to dig down through the river mud to solid bedrock, and they did so inside enormous airtight wooden chambers called caissons — sunk to the bottom and pumped full of compressed air to hold back the water. Men labored by lamplight in this strange pressurized world, hauling out rock and mud, and when they climbed back to the surface too quickly, many were struck by a mysterious and agonizing illness: joints locked, bodies doubled over in pain. No one yet understood what we now call decompression sickness, \"the bends,\" brought on by the sudden change in pressure. Washington Roebling, who went down into the caissons himself, was among those it crippled. For the rest of the project he was a near-invalid, unable to walk the site or speak for long, watching the towers rise through a telescope from the window\
    \ of his apartment in Brooklyn.\r\n\r\nA chief engineer who could not visit his own bridge would seem to be no chief engineer at all. That the work went on — for more than a decade — was owing in large part to his wife, Emily Warren Roebling. She taught herself the mathematics of the cables, the behavior of materials under strain, the details of a construction her husband could only describe to her. Day after day she carried his instructions to the site, met with the assistant engineers and the doubting city officials, and answered their technical questions herself. To the men building the bridge, she was, in practice, the voice of the chief engineer. When it finally opened, Emily Roebling was the first to ride across.\r\n\r\nEven the finished structure kept its secrets. Partway through, it came to light that a contractor had supplied defective wire for the cables, some of it already spun into place and impossible to remove. Rather than start over, Washington Roebling ordered enough\
    \ additional wire added that the cables would hold regardless — and so the bridge that carries traffic today is, by deliberate design, far stronger than its builders strictly needed it to be. The flaw is still up there, woven invisibly into the span.\r\n\r\nThe public, of course, saw none of this. They saw two soaring Gothic towers and a glittering web of cable, and they made the bridge an instant emblem of the age — of steel, of ambition, of a young country certain it could build anything. The names fixed to that emblem were the names of the men who had designed it. The hands that finished it, and the bodies that paid for it, were mostly left below the waterline of memory, where so much of the bridge's true work had always been done."
  question_text: Which detail best supports the idea that the engineers and officials treated Emily Roebling as an authority in her own right, not merely as a helper?
  choice_a: She carried her husband's written instructions to the site each day.
  choice_b: Officials and engineers put their technical questions directly to her.
  choice_c: She taught herself the mathematics behind the cables.
  choice_d: She was chosen to ride across the finished bridge first.
  correct_answer: B
  explanation: "The claim is about how others regarded her — whether the men running the project looked to her as an authority, not merely a go-between. B shows exactly that: officials and engineers brought their technical questions straight to her, meaning they turned to her, not past her, for answers — she was \"in practice, the voice of the chief engineer.\" \r\n\r\nA is a real detail but the wrong one: carrying her husband's instructions casts her as a messenger, the very role the claim asks us to see beyond. C shows she had the knowledge to be an authority, but teaching herself the math is about her own preparation, not how the leadership treated her. D is a genuine honor and a famous fact, yet riding across first marks recognition after the bridge was finished, not engineering authority during the work."
  distractor_types:
    A: misidentified_detail
    C: partly_true_but_wrong
    D: true_but_irrelevant
