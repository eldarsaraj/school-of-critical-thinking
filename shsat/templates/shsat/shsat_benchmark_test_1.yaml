  question_text: "Which revision best corrects the error in the sentence below?\r\n\r\n\"On weekends my brother enjoys hiking in the park, riding his bike, and to swim at the public pool.\""
  choice_a: Change "to swim at the public pool" to "swimming at the public pool."
  choice_b: Change "riding his bike" to "to ride his bike."
  choice_c: Change "enjoys" to "enjoy."
  choice_d: Change "to swim at the public pool" to "swim at the public pool."
  correct_answer: A
  explanation: Items in a series must share the same grammatical form (parallel structure). "Hiking" and "riding" are -ing (gerund) forms, so the odd item, "to swim," must become "swimming" to match — Choice A does this. Choice B converts a correctly formed item ("riding") into an infinitive, matching the list to the odd item instead of fixing it. Choice C invents a subject-verb error; "my brother enjoys" is already correct. Choice D deletes "to" but leaves the bare verb "swim," which still isn't parallel with the gerunds.
  distractor_types:
    B: overcorrection
    C: introduces_new_error
    D: less_precise
- section: ELA
  stage: easy_module
  question_number: 2
  question_type: multiple_choice
  skill: usage_agreement
  difficulty: easy
  topic: ''
  passage_group_id: ''
  passage_title: ''
  passage_text: ''
  question_text: "Which edit should be made to the sentence below?\r\n\r\n\"Each of the players on the two teams were given a medal after the tournament.\""
  choice_a: Change "were" to "was."
  choice_b: Change "Each" to "All."
  choice_c: Change "players" to "player."
  choice_d: Change "were given" to "are given."
  correct_answer: A
  explanation: "The subject is \"Each,\" which is always singular, so the verb must be \"was given\" — the nearby plurals \"players\" and \"teams\" sit inside prepositional phrases and don't control the verb. A is correct. \r\n\r\nB is the strong trap: \"All of the players … were given\" is perfectly grammatical, but it fixes the sentence by changing the meaning (every individual versus the group as a whole) rather than correcting the actual error, the verb. C changes the wrong word — \"players\" isn't the subject, and \"each of the player\" isn't even idiomatic. \r\n\r\nD is tempting because the verb really is where the problem lives, but switching to \"are given\" only swaps the tense (wrongly, too, since the tournament is over) while leaving the verb plural, so it still doesn't agree with \"Each.\""
  distractor_types:
    B: overcorrection
    C: misattributed_error_location
    D: partly_true_but_wrong
- section: ELA
  stage: easy_module
  question_number: 3
  question_type: multiple_choice
  skill: sentence_structure
  difficulty: easy
  topic: ''
  passage_group_id: ela_e_re
  passage_title: The First Sandwich
  passage_text: (1) The sandwich is one of the most popular foods in the world. (2) It is named after an English nobleman, the Earl of Sandwich, who lived in the 1700s. (3) According to the story, the earl loved card games so much that he did not want to leave the table to eat. (4) He asked a servant to bring him slices of meat tucked between two pieces of bread, this clever idea let him keep playing while he ate.
  question_text: "Which revision of sentence 4 best corrects the error?\r\n\r\n(4) He asked a servant to bring him slices of meat tucked between two pieces of bread, this clever idea let him keep playing while he ate."
  choice_a: Delete the comma after "bread."
  choice_b: Add a comma after "meat."
  choice_c: Replace the comma after "bread" with a semicolon.
  choice_d: Replace the comma after "bread" with the word "because."
  correct_answer: C
  explanation: "Sentence 4 is a comma splice — \"…two pieces of bread\" and \"this clever idea let him…\" are each complete sentences joined by only a comma. A semicolon correctly links two closely related independent clauses, so C is correct. \r\n\r\nB fixes a spot that isn't broken (no comma belongs after \"meat\") and leaves the splice in place. A deletes the comma entirely, which turns the comma splice into a run-on with no break at all. D is the trickiest: swapping in \"because\" technically removes the splice by making the second part subordinate — but it forces an illogical cause-and-effect, since the \"clever idea\" is the sandwich, so he didn't ask for the sandwich \"because\" of it. It fixes the grammar by breaking the meaning. The semicolon keeps the two ideas balanced, exactly as the original intends."
  distractor_types:
    A: too_broad
    B: misattributed_error_location
    D: wrong_concept
- section: ELA
  stage: easy_module
  question_number: 4
  question_type: multiple_choice
  skill: sentence_structure
  difficulty: easy
  topic: ''
  passage_group_id: ''
  passage_title: ''
  passage_text: ''
  question_text: "Which revision best corrects the error in the sentence below?\r\n\r\n\"The new librarian mentioned that our school's collection of graphic novels is now larger than the public library.\""
  choice_a: Change "is" to "are."
  choice_b: Change "larger" to "the largest."
  choice_c: Change "than the public library" to "than the public library's."
  choice_d: Change "than" to "then."
  correct_answer: C
  explanation: "As written, the sentence compares a \"collection\" to \"the public library\" itself — a collection and a building can't be logically compared. The apostrophe in \"the public library's\" makes it shorthand for \"the public library's collection,\" so the comparison finally lines up: collection to collection. C is correct. \r\n\r\nA is the classic agreement trap: \"collection of graphic novels\" tempts you toward \"are,\" but the subject is the singular \"collection,\" so \"is\" is already right, and switching to \"are\" would create an error rather than fix one. \r\n\r\nB feels right because \"larger\" seems like the locus of the problem, yet the superlative \"the largest\" doesn't repair the faulty comparison (and would wrongly imply three or more things). D treats \"than\" as a spelling slip and swaps in \"then,\" which is simply wrong in a comparison and does nothing about the illogical comparison itself."
  distractor_types:
    A: misattributed_error_location
    B: wrong_concept
    D: wrong_concept
- section: ELA
  stage: easy_module
  question_number: 5
  question_type: multiple_choice
  skill: supporting_detail
  difficulty: medium
  topic: ''
  passage_group_id: ela_e_p1
  passage_title: The Amazing Octopus
  passage_text: "If you wanted to imagine a mind utterly unlike your own, you could hardly do better than an octopus. It has three hearts, blue blood, and no bones at all, so that a creature the size of a large dog can pour its entire body through a gap no wider than a coin. For centuries, sailors told stories of monstrous octopuses dragging ships beneath the waves. The truth is stranger than the legends, and far more interesting: the octopus is one of the most intelligent animals on Earth, yet its intelligence took shape along a branch of the tree of life almost unimaginably distant from our own.\r\n\r\nThat distance matters. The last common ancestor of humans and octopuses lived more than five hundred million years ago and was, most scientists believe, a simple wormlike creature with little more than a smudge of nerve cells. Whatever cleverness the octopus possesses, it did not inherit from the same source we did. It evolved a mind, in effect, from scratch — which is why that mind is so\
    \ hard for us to recognize, and so fascinating once we do.\r\n\r\nConsider where the octopus keeps its thinking. In a human being, nearly all the neurons are packed into the brain. In an octopus, most of them are not. The majority of its nerve cells are spread throughout its eight arms, so that each arm can taste, touch, and even make small decisions on its own, without waiting for instructions from the central brain. An octopus does not simply command its arms the way you command your hand; it cooperates with them. Cut free from the body, an octopus arm will still reach out and grasp at food. It is tempting to say the animal has nine brains rather than one, though the truth is subtler than that.\r\n\r\nThe behavior that follows from this strange anatomy has astonished the scientists who study it. Octopuses have unscrewed jars to reach the food inside, found their way through mazes, and squirted jets of water at laboratory keepers they apparently disliked while behaving warmly toward\
    \ those who fed them. Some carry coconut shells across the seafloor to assemble into portable shelters — a use of tools once thought to belong to humans and a few clever birds alone. Their skin, meanwhile, ripples through thousands of colors and textures in less than a second, a feat made stranger still by the fact that octopuses are almost certainly colorblind and somehow match their surroundings anyway.\r\n\r\nAnd yet, for all these gifts, the octopus lives a short and solitary life, rarely longer than a year or two. It does not raise its young or learn from its elders; a mother octopus guards her eggs faithfully and dies, usually, around the time they hatch. Each octopus, in a sense, must invent the world alone. Why so much intelligence should have evolved in a creature with so little time to use it, and no one to pass it on to, is a question scientists cannot yet answer. The octopus remains, in the end, a reminder that a mind can take forms we are only beginning to understand."
  question_text: According to the passage, which statement about the octopus's nervous system is accurate?
  choice_a: The octopus has no central brain at all; all of its neurons are spread through its arms.
  choice_b: Each of its arms holds a complete, separate copy of its brain.
  choice_c: Its arms cannot grasp or move unless the central brain signals them.
  choice_d: Most of its nerve cells lie in its arms rather than in its central brain.
  correct_answer: D
  explanation: "The passage says that in an octopus \"the majority of its nerve cells are spread throughout its eight arms,\" not packed into the central brain, so D is supported. \r\n\r\nThe trap is that A, B, and C each push that same point a little too far. A overstates it — the passage plainly refers to a \"central brain\" that the arms \"cooperate with,\" so it's false that there's no central brain. B takes the figurative line, that it's \"tempting to say the animal has nine brains,\" literally, even though the very next sentence warns \"the truth is subtler than that.\" \r\n\r\nC reverses the key idea: the arms \"make small decisions on its own\" without the central brain, and even a severed arm \"will still reach out and grasp at food,\" so they clearly don't wait on the brain's signals to move."
  distractor_types:
    A: too_broad
    B: too_literal
    C: opposite
