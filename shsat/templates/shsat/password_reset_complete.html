{% extends "shsat/base_shsat.html" %}

{% block title %}Password reset complete{% endblock %}

{% block shsat_content %}
<div class="shsat-auth">
  <h1 class="shsat-auth__title">Password reset complete</h1>
  <p class="shsat-auth__sub">Your password has been set. You can now log in with your new password.</p>

  <p style="margin-top:24px;">
    <a href="{% url 'shsat_login' %}" class="shsat-btn" style="display:inline-block; text-decoration:none;">Log in</a>
  </p>
</div>
{% endblock %}
