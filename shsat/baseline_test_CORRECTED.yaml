  passage_group_id: ela_e_p3
  passage_title: The Woman Who Mapped the Ocean Floor
  passage_text: "For most of human history, the floor of the ocean was a blank. People knew the sea was deep, but its bottom lay hidden beneath miles of water, and no human eye had ever seen it. In the middle of the twentieth century, a scientist named Marie Tharp helped change that. She did it not by descending into the ocean, but by sitting at a desk and patiently turning long columns of numbers into a picture.\r\n\r\nTharp had trained as a geologist at a time when the field was almost entirely closed to women. She had taken up the subject during the Second World War, when so many men had gone to fight that universities, short of students, briefly opened their geology programs to women they would otherwise have turned away. When she joined a research laboratory at Columbia University in New York, she found that the door had opened only partway. She was not permitted to sail on the research ships that gathered the ocean data. That work, it was assumed, was for men. Instead Tharp was handed\
    \ the numbers the ships brought back and told to make sense of them on dry land.\r\n\r\nThe numbers came from a device called an echo sounder. As a ship crossed the ocean, the instrument sent a pulse of sound straight down through the water and measured how long the sound took to bounce off the bottom and return. A quick echo meant the floor was near the surface; a slow echo meant it lay far below. From thousands of these measurements, taken one after another along a ship's path, Tharp could calculate the depth of the ocean at each point. Then, line by careful line, she began to draw the shape of the hidden floor, translating the dry figures into ridges and valleys on paper.\r\n\r\nAs her maps took form, Tharp noticed something that no one had expected. Running down the middle of the Atlantic Ocean was a great mountain range, thousands of miles long. That much had been suspected before. But splitting the range, right along its crest, ran a deep notch, a kind of canyon, that appeared\
    \ again and again in line after line of her data. To Tharp, the notch suggested something remarkable: that the ocean floor was being pulled apart along this seam, with the seabed on either side slowly drifting away in opposite directions. And if the seabed could move, then perhaps the continents could move too.\r\n\r\nThat last idea was, at the time, deeply unpopular. The notion that the continents drift slowly across the surface of the earth had been proposed decades earlier, but most geologists had dismissed it as fantasy. When Tharp showed the great notch to her research partner, Bruce Heezen, he waved it away. He called it \"girl talk,\" a guess unworthy of a serious scientist, and he did not want his name attached to a theory the profession had rejected. But Tharp kept finding the notch. It was not a smudge or an error in the data. It was really there, and it ran for thousands of miles down the center of the ocean, exactly where her maps said it should be.\r\n\r\nThe work demanded\
    \ extraordinary patience. The ships had crossed the ocean along separate tracks, and the gaps between those tracks were enormous, so Tharp could not simply trace a finished picture; she had to reconstruct the floor between the lines, reasoning from the shape of what the soundings did show to the likely form of what they did not. She worked for years over the same stretches of seabed, refining the ridges and deepening the valleys as new measurements arrived, checking each new profile against the ones already drawn. The great notch along the crest was not a single dramatic discovery but a conclusion that forced itself on her gradually, surfacing in one profile and then another and then a dozen more, until its reality could no longer be reasonably doubted.\r\n\r\nIn time the evidence grew too strong to ignore. Other measurements, gathered by other means, confirmed that the seam Tharp had traced was a place where molten rock rises from within the earth and hardens into new ocean floor, which\
    \ then spreads slowly outward on either side. This process, now called seafloor spreading, became one of the foundations of modern geology. It helped overturn the old belief that the continents were fixed in place and confirmed, in its essentials, the very theory of drifting continents that Heezen had been so reluctant to consider. He came, in the end, to accept what Tharp's maps had shown all along.\r\n\r\nWhat began with a single ocean did not stay there. Over the following years Tharp and Heezen extended their method to the other oceans of the world, and in 1977 they published a hand-painted map of the entire global seafloor, the first of its kind, which allowed anyone to take in at a glance the great ridges and trenches that encircle the planet. It changed the way a whole generation pictured the world beneath the waves.\r\n\r\nRecognition came slowly to Tharp, and from a distance. For years the maps she had drawn went out under her partner's name, and her share of the work was easy\
    \ for outsiders to overlook. Honors arrived mostly late in her life, and much of the fuller credit came only from a later generation of scientists who looked back, studied the record, and saw how much of a revolution in earth science had begun quietly at her drafting table. Late in her life the Library of Congress named her one of the great cartographers of the twentieth century, and the maps she had once been told were unworthy of a scientist's notice are now studied as landmarks in the history of the field. She had never set foot on the ocean floor she made visible to the world. She had simply refused to look away from what her numbers were telling her, even when the people around her insisted, with great confidence, that it could not possibly be true."
  question_text: The passage opens by stating that for most of history the ocean floor 'was a blank.' This opening mainly serves to
  choice_a: emphasize how vast and deep the ocean is, compared with the land humans know.
  choice_b: suggest that earlier generations had little interest in what lay at the bottom of the sea.
  choice_c: establish the unknown that Tharp's work would help to fill in.
  choice_d: create a sense of mystery that draws the reader into Tharp's story.
  correct_answer: C
  explanation: Opening with the floor as a long-standing blank sets up the unknown that the rest of the passage shows Tharp helping to fill (C). D notes the real mood of mystery the opening creates but mistakes that effect for its structural purpose; A fastens on the detail that the sea is deep, when the point is that its floor was unseen, not merely vast; B reads the 'blank' as a lack of interest, an inference the passage does not support—the floor was hidden beneath miles of water, not ignored.
  distractor_types:
    A: misidentified_detail
    B: inference_leap
    D: partly_true_but_wrong
