  passage_title: Why We Yawn
  passage_text: '(1) Almost everyone yawns, yet scientists still do not fully agree on why. (2) For a long time, the most popular explanation was that yawning supplies the brain with extra oxygen when we are tired. (3) According to this view, a yawn is essentially a deep breath that corrects a shortage of oxygen in the blood. (4) Careful experiments, however, have failed to support it. (5) When researchers gave volunteers air enriched with oxygen, the rate at which the volunteers yawned did not change. (6) A newer explanation proposes that yawning helps cool the brain. (7) The deep intake of air and the stretching of the jaw increase blood flow and draw in cooler air, which may lower the brain''s temperature slightly. (8) This theory would explain a curious finding: people yawn more often in warm rooms than in cool ones. (9) It would also account for the strange power of contagious yawning, since a yawning person may signal to others that conditions call for a cooling response. (10) Most
    researchers caution that the evidence remains incomplete. (11) Yawning may well serve more than one purpose at once. (12) What once seemed like one of the body''s simplest acts has turned out to be one of its most stubborn puzzles.'
  question_text: Which statement best reflects the new explanation reported in sentence 6?
  choice_a: Yawning is not caused by the lack of oxygen in the blood.
  choice_b: The purpose of yawning is not to bring in oxygen, but to cool the body.
  choice_c: If a person takes oxygen-enriched air, they will not yawn as much.
  choice_d: Yawning is more frequent in warmer places than in cooler ones.
  correct_answer: A
  explanation: A best reflects the explanation that yawning helps cool the brain because it contradicts the earlier theory about the shortage of oxygen. B is too broad, the explanation is only about cooling of the brain, not the entire body. C is partly true, and D is imprecise.
  distractor_types:
    B: too_broad
    C: partly_true_but_wrong
    D: less_precise
