  passage_title: The Great Migration
  passage_text: "Between 1916 and 1970, roughly six million Black Americans left the rural South for the cities of the North, the Midwest, and the West. Historians call this movement the Great Migration, and it stands among the largest internal migrations any nation has recorded. For much of the twentieth century it was told as a simple story of escape: people fled the poverty and violence of the South and were drawn toward the jobs and freedoms of the North. That account is not false. But it is incomplete, and the elements it leaves out are precisely the ones that explain the migration's staggering scale.\r\n\r\nThe forces pushing people out of the South were real and severe. In the early decades of the century, most Black families in the rural South worked the land as tenant farmers or sharecroppers, bound into a system of debt that left them with little to show for a year's labor. Over this economic arrangement lay the daily machinery of legalized segregation: separate and inferior schools,\
    \ the constant threat of violence, and a legal order that offered Black citizens almost no protection. The forces pulling people north were equally real. The First World War had abruptly cut off the stream of European immigrants who had long staffed Northern factories, and as wartime production surged, those factories opened their gates, for the first time, to Black workers they had previously refused to hire.\r\n\r\nYet a push and a pull, however powerful, do not by themselves set six million people in motion. Most people do not abandon the only place they have ever known on the strength of a distant rumor. What converted a trickle of departures into a sustained mass movement was information that was specific, trusted, and continually renewed, and the chief carrier of that information was the Black press.\r\n\r\nNo publication mattered more than the Chicago Defender. Founded by Robert Abbott, the son of formerly enslaved parents, the Defender grew into one of the most widely read Black\
    \ newspapers in the country, and it campaigned openly for migration. It printed railroad schedules and the names of factories that were hiring. It ran photographs of well-dressed men and women who had prospered in the North and published their new addresses. Above all, it reached deep into the South: copies were carried aboard the trains by Black Pullman porters and left in towns where the paper was unwelcome, then passed from hand to hand until a single issue had been read aloud to dozens of people. A family weighing whether to leave did not have to gamble blindly. They could read of others who had already gone, and they could often write directly to a cousin or a former neighbor who had made the journey only a year before.\r\n\r\nThis points to a truth the simple narrative obscures: migration is rarely a leap into the unknown. People move along paths that others have already cleared. The first to leave a town bore the greatest uncertainty, but each departure lowered the cost of the\
    \ next, supplying those who followed with a place to stay, a contact at the plant, and the plain proof that the thing could be done. Sociologists call this chain migration, and it explains why the movement, once begun, accelerated rather than exhausted itself. Each link drew the next, and entire networks of kin and community gradually relocated, transplanting themselves from one county in Mississippi to one neighborhood in Chicago.\r\n\r\nThe journey itself could be perilous, and leaving was not always permitted. Some Southern towns, alarmed at losing the cheap labor on which their economies depended, tried to halt the exodus by force. Black travelers were pulled from train platforms and arrested on invented charges; recruiters who came south to hire workers for Northern plants were jailed or driven out of town; in some places the very newspapers that carried word of the North were seized before they could be read. Families sometimes departed at night and in secret, telling no one of\
    \ their plans, boarding the train a station or two beyond their hometown so that no one would see them go.\r\n\r\nNor did the movement end with a single wave. The first surge, set off by the labor shortages of the First World War, slowed during the Depression of the 1930s, when work grew scarce everywhere. But a second and even larger wave followed during and after the Second World War, as the defense plants of cities such as Los Angeles, Oakland, and Detroit threw open their doors to Black workers. This later migration carried hundreds of thousands of people westward to the Pacific Coast, and by the time it had run its course the geography of Black America had been permanently redrawn, its center of gravity shifted decisively from the rural South to the cities of the North and West.\r\n\r\nThe North that the migrants reached, however, was not the promised land the newspapers sometimes implied. The factory jobs were real, but they were often the most dangerous and least desirable on\
    \ offer, and the freedom was partial at best. Northern cities practiced their own rigid segregation, enforced less by statute than by custom, by violence, and above all by the unwritten lines that decided where a Black family was permitted to rent or to buy a home. Confined to overcrowded neighborhoods and charged inflated rents, many migrants discovered that they had exchanged one set of hardships for another. The disappointment was genuine, and it would shape the politics of Northern cities for generations.\r\n\r\nAnd yet the migration transformed the country in ways that outlasted those disappointments. It remade the populations of cities such as Chicago, Detroit, New York, and Los Angeles, turning them into centers of Black life. It carried the music, the cooking, the churches, and the speech of the rural South into new soil, where they took root and grew into something that reshaped American culture as a whole: the blues and jazz that filled Northern clubs, the literary flowering\
    \ later known as the Harlem Renaissance, and the congregations that would supply much of the energy and leadership of the civil rights movement. The people who boarded those northbound trains were not merely fleeing a place they wished to leave. Whether they intended it or not, they were redrawing the map of American life, and the country that emerged on the far side of their journey was not the same one they had left behind."
  question_text: Which statement best captures the central argument of the passage?
  choice_a: The familiar account of flight and opportunity is incomplete; the migration's scale is better explained by the spread of trusted information and the self-reinforcing nature of the movement.
  choice_b: Conditions in the South were so harsh on their own that the migration would have unfolded in just the same way regardless of the wartime demand for labor, the Black press, or any of the other factors the passage describes.
  choice_c: The Black press, and the Chicago Defender above all, was responsible for setting the Great Migration in motion.
  choice_d: Although the North fell short of its promise, the migration reshaped the cities and culture of the country.
  correct_answer: A
  explanation: The passage grants the push-and-pull story but argues that information and chain migration are needed to explain the scale (A). B captures only the push and mistakes one factor for the whole; C overstates the Defender's role, which the passage ties to explaining scale rather than single-handedly causing the movement; D is true but describes a later point, not the central argument.
  distractor_types:
    B: wrong_concept
    C: partly_true_but_wrong
    D: misidentified_detail
