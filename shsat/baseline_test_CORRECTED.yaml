  question_text: A line passes through the points (1, 3) and (4, 12). What is the equation of the line?
  choice_a: y = 3x
  choice_b: y = 3x − 1
  choice_c: y = 9x − 6
  choice_d: y = − 3x + 6
  correct_answer: A
  explanation: "Two steps: find the slope, then find the y-intercept. Slope is the change in y divided by the change in x: (12 − 3)/(4 − 1) = 9/3 = 3. Now use the slope-intercept form y = 3x + b and plug in one of the points to find b. Using (1, 3): 3 = 3(1) + b, so b = 0. The equation is y = 3x. Verify with the other point: 3(4) = 12. ✓\r\n\r\n(C) is the most common slope error: taking just the rise (9) as the slope and skipping the division by the run. Slope is rise over run — both differences matter. Here the run is 3, so 9 ÷ 3 = 3.\r\n\r\n(D) gets the size of the slope right but the sign wrong. As you move from (1,3) to (4,12), y goes up as x goes up, which means a positive slope. A negative slope would describe a line falling from left to right.\r\n\r\n(B) finds the correct slope but stumbles on the intercept. After getting slope = 3, you must solve for b using an actual point: 3 = 3(1) + b forces b = 0. The line passes through the origin, so there's no constant term to add or subtract."
  distractor_types:
    B: wrong_formula
    C: wrong_formula
    D: sign_error
