  question_text: A jar contains 3 red, 4 blue, and 5 green marbles. Two marbles are drawn without replacement. What is the probability that the first marble is red and the second is green?
  choice_a: 5/48
  choice_b: 5/11
  choice_c: 5/44
  choice_d: 31/44
  correct_answer: C
  explanation: "This asks for a specific sequence — red first, then green — so two things happen in order, and \"and\" means multiply. The first draw: 3 of the 12 marbles are red, so P(first red) = 3/12 = 1/4. Now one red marble is gone and not replaced, leaving 11 marbles, of which 5 are still green. So P(second green) = 5/11. Multiply the two: 1/4 × 5/11 = 5/44.\r\n\r\n(D) is the operation trap: adding instead of multiplying. \"And\" (both events happening in sequence) calls for multiplication; adding would describe an \"or\" situation. Adding also gives 31/44, a probability far too large for two specific conditions both being met.\r\n(A) is the replacement trap — the single most common probability error. Using 5/12 for the second draw assumes the jar still holds 12 marbles, but the first marble was removed and kept out. The total drops to 11.\r\n\r\n(B) stops halfway, giving only the conditional probability of the second draw (5/11) and skipping the first draw entirely. Both draws have\
    \ to occur, so the first probability (1/4) must be included in the product."
