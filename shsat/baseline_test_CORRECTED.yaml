  question_text: If 3x − 7 = 2x + 5, what is the value of x?
  choice_a: '-12'
  choice_b: '2'
  choice_c: '5'
  choice_d: '12'
  correct_answer: D
  explanation: "To solve a linear equation with variables on both sides, gather the variable terms on one side and the constants on the other, then isolate the variable. Begin by subtracting 2x from both sides to collect the x terms: 3x − 2x − 7 = 5, which simplifies to x − 7 = 5. Now move the constant by adding 7 to both sides: x = 5 + 7 = 12. Check by substituting back: 3(12) − 7 = 29 and 2(12) + 5 = 29, so both sides match.\r\n\r\n(D) 5 is the last-step trap — stopping at x − 7 = 5 and reporting the 5 on the right side. That is only an intermediate result; the variable still has a −7 attached, so you must add 7 to finish the problem.\r\n\r\n(A) −12 comes from a sign error in the final step, computing x = −7 − 5 instead of x = 5 + 7. To undo a “− 7,” you add 7, and the constant on the right stays positive.\r\n\r\n(B) 2 also mishandles the signs, subtracting the two numbers (7 − 5) rather than adding them. Once the equation reads x − 7 = 5, the only correct move is to add 7 to both sides,\
    \ which gives 12."
