  question_text: If 4 workers can build a wall in 6 days, how many days would it take 3 workers to build the same wall, working at the same rate?
  choice_a: '4.5'
  choice_b: '8'
  choice_c: '18'
  choice_d: '24'
  correct_answer: B
  explanation: "This is an inverse relationship: more workers finish faster, fewer workers take longer. The quantity that stays constant is the total amount of work, measured in single worker days (how long would it take a single worker to build the wall). With 4 workers over 6 days, the wall would takes 4 × 6 = 24 days of labor for a single worker to build it. With 3 workers: 24 ÷ 3 = 8 days.\r\n\r\n(A) is the key miss: treating this as a direct proportion, scaling the days down with the workers (6 × 3/4 = 4.5). But that says reducing the workforce makes the job faster, which is backwards. With fewer people on the job, it takes longer — so the answer must be greater than 6, not less. Any answer below 6 fails this sanity check.\r\n\r\n(C) multiplies 6 × 3 = 18. This treats the relationship as \"days times workers,\" which has no meaning here. The fixed quantity is worker-days (4 × 6 = 24); you divide that by the new worker count, not multiply.\r\n\r\n(D) finds the total work correctly (24\
    \ worker-days) but reports it as the answer. That 24 is the total labor needed — it still has to be split among the 3 workers: 24 ÷ 3 = 8 days each."
  distractor_types:
    A: wrong_setup
    C: wrong_formula
    D: last_step_trap
