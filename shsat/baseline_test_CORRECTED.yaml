- section: ELA
  stage: easy_module
  question_number: 1
  question_type: multiple_choice
  skill: sentence_structure
  difficulty: easy
  topic: ''
  passage_group_id: ela_e_re
  passage_title: Starting a Compost Pile
  passage_text: (1) Composting is a simple way to turn kitchen scraps into rich food for a garden. (2) To start, you need a bin or a corner of the yard and a mix of two kinds of material. (3) "Green" materials, such as fruit peels and coffee grounds, add nitrogen. (4) "Brown" materials, such as dry leaves and shredded paper, add carbon. (5) A good pile contains roughly equal amounts of both. (6) Once you have a pile, you must keep it slightly moist and turn it from time to time. (7) Turning the pile mixes in air, the tiny organisms that break down the scraps need oxygen to do their work. (8) Without enough air, a pile can begin to smell unpleasant. (9) In a few months, the bottom of the pile will turn into dark, crumbly compost. (10) You can then spread it around your plants. (11) Composting also reduces the amount of garbage a household sends to the landfill. (12) For these reasons, more and more families are giving it a try.
  question_text: 'Sentence 7 reads: "Turning the pile mixes in air, the tiny organisms that break down the scraps need oxygen to do their work." Which revision best corrects the error?'
  choice_a: Turning the pile mixes in air the tiny organisms that break down the scraps need oxygen to do their work.
  choice_b: Turning the pile mixes in air, the tiny organisms, that break down the scraps, need oxygen to do their work.
  choice_c: Turning the pile, mixes in air, the tiny organisms that break down the scraps need oxygen.
  choice_d: Turning the pile mixes in air, which the tiny organisms that break down the scraps need to do their work.
  correct_answer: D
  explanation: The original splices two independent clauses; D fixes it by turning the second into a relative clause ('which ... need'). A removes the comma and creates a run-on; B adds commas around the essential clause 'that break down the scraps'; C adds a comma after 'pile' and still leaves a splice.
  distractor_types:
    A: misattributed_error_location
    B: overcorrection
    C: misattributed_error_location
