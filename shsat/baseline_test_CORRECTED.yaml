  passage_group_id: ela_e_re
  passage_title: Starting a Compost Pile
  passage_text: (1) Composting is a simple way to turn kitchen scraps into rich food for a garden. (2) To start, you need a bin or a corner of the yard and a mix of two kinds of material. (3) "Green" materials, such as fruit peels and coffee grounds, add nitrogen. (4) "Brown" materials, such as dry leaves and shredded paper, add carbon. (5) A good pile contains roughly equal amounts of both. (6) Once you have a pile, you must keep it slightly moist and turn it from time to time. (7) Turning the pile mixes in air, the tiny organisms that break down the scraps need oxygen to do their work. (8) Without enough air, a pile can begin to smell unpleasant. (9) In a few months, the bottom of the pile will turn into dark, crumbly compost. (10) You can then spread it around your plants. (11) Composting also reduces the amount of garbage a household sends to the landfill. (12) For these reasons, more and more families are giving it a try.
  question_text: "What is the best way to combine sentences 9 and 10?\r\n\r\n\"(9) In a few months, the bottom of the pile will turn into dark, crumbly compost. (10) You can then spread it around your plants.\""
  choice_a: In a few months, the bottom of the pile will turn into dark, crumbly compost that you can spread around your plants.
  choice_b: In a few months, the bottom of the pile will turn into dark, crumbly compost, you can then spread it around your plants.
  choice_c: In a few months, the bottom of the pile will turn into dark, crumbly compost, and then it can be spread around your plants.
  choice_d: In a few months, the entire pile will turn into dark, crumbly compost that you can spread around your plants.
  correct_answer: A
  explanation: A is tightest, folding the second sentence into a relative clause and dropping the redundant 'then' and 'it' (A). B joins the two with only a comma, creating a comma splice; C is grammatical but looser—the passive 'it can be spread' and the added 'and then' make it wordier than the relative clause; D changes the meaning, saying the entire pile becomes compost when the passage says only the bottom of the pile does.
  distractor_types:
    B: introduces_new_error
    C: less_precise
    D: changes_meaning
