  question_text: When Passage 2 says de-extinction would yield "not a mammoth but a modified elephant carrying a scattering of mammoth genes," the author's main point is that
  choice_a: the engineered animal would be indistinguishable from an ordinary elephant and so pointless to create.
  choice_b: editing only a scattering of genes is far too small a change to alter the elephant in any real way.
  choice_c: what the techniques can create is an approximation rather than a true return of the lost animal, so calling it 'restoration' is misleading.
  choice_d: scientists are knowingly deceiving the public by promising a mammoth they cannot actually deliver.
  correct_answer: C
  explanation: The line concedes that something can be built—a living, modified elephant—but insists it is only an approximation, so the proud word 'restoration' overstates what has been done (C). D turns that complaint about a misleading label into a charge of deliberate fraud the passage does not make, since it faults the claim, not the scientists' honesty; A slides from 'mostly elephant' to 'just an ordinary elephant,' missing that the point is the gap between this hybrid and a true mammoth, not that the creature is worthless; B treats 'a scattering of genes' as a claim that the edit is too small to have any effect, when the author grants the edit works and still denies it brings the mammoth back.
