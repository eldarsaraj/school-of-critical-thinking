  explanation: "Look at how the sequence grows from one term to the next: 2 → 6 → 18 → 54. Each term is exactly 3 times the one before it: 2 × 3 = 6, 6 × 3 = 18, 18 × 3 = 54. So the next term is 54 × 3 = 162.\r\n\r\n(A) comes from adding 3 instead of multiplying: 54 + 3 = 57. Adding 3 works for arithmetic sequences — sequences that grow by a fixed amount. This sequence grows by a fixed multiple, which makes it geometric. The gap between terms isn't constant; it keeps getting larger.\r\n\r\n(B) comes from multiplying by 2 instead of 3: 54 × 2 = 108. Doubling is the most familiar growth pattern, so it's easy to reach for — but check: 2 × 2 = 4, not 6. The multiplier here is 3, not 2.\r\n(D) comes from multiplying by 4: 54 × 4 = 216. This might happen if a student confuses the position of the term (it's the 4th term) with the ratio between terms. The position doesn't determine the rule — trace the actual jumps between consecutive terms to find it."
