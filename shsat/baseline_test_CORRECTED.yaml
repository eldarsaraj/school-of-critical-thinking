  question_text: A photograph is 4 inches wide and 6 inches tall. It is enlarged, keeping the same shape, so that its width becomes 12 inches. What is the area of the enlarged photograph?
  choice_a: 24 square inches
  choice_b: 72 square inches
  choice_c: 144 square inches
  choice_d: 216 square inches
  correct_answer: D
  explanation: "When two figures are similar, their areas scale by the square of the ratio of their sides — not by the ratio itself. The sides are in ratio 3:5, so the areas are in ratio 3²:5² = 9:25. Set up a proportion with the smaller area: 27/larger = 9/25. Cross-multiply: 9 × larger = 27 × 25, so larger = 675/9 = 75 cm². (A clean way to see it: 27 corresponds to the \"9\" part, so one part = 3, and the larger area is 25 parts = 75.)\r\n\r\n(A) is the key conceptual miss: scaling the area by 5/3, the linear ratio. That's how lengths scale, not areas. Because area is two-dimensional, both dimensions stretch by the ratio, so the area stretches by the ratio twice — i.e., squared. The factor is (5/3)² = 25/9, not 5/3.\r\n\r\n(C) and (D) multiply the area by a single side number (3 or 5), treating the ratio as a one-step multiplier. The relationship between the two areas isn't 3× or 5× — it's 25/9×. Both the squaring and the full ratio (not just one number) are needed."
  distractor_types:
    A: partial_answer
    B: wrong_setup
    C: wrong_formula
