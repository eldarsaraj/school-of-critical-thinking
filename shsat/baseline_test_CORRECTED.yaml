  question_text: Which version of the sentence is grammatically correct?
  choice_a: The program is designed not only to teach students the rules of debate but it also builds the confidence they need to speak before an audience.
  choice_b: The program is designed not only to teach students the rules of debate but also to build the confidence they need to speak before an audience.
  choice_c: The program is designed not only to teach students the rules of debate but to also build the confidence they need to speak before an audience.
  choice_d: The program is designed to not only teach students the rules of debate but also to build the confidence they need to speak before an audience.
  correct_answer: B
  explanation: Parallel structure requires the elements joined by 'not only ... but also' to take the same grammatical form and position. B pairs two infinitive phrases—'not only to teach ... but also to build'—so the halves match exactly (B). C keeps an infinitive but slides 'also' inside it, writing 'but to also build' instead of 'but also to build,' so the marker no longer sits where 'not only' does; D moves 'to' ahead of 'not only,' leaving the bare verb 'teach' to pair with the infinitive 'to build'; A drops the pattern altogether, turning the second half into a full clause, 'but it also builds.'
  distractor_types:
    A: introduces_new_error
    C: misattributed_error_location
    D: introduces_new_error
