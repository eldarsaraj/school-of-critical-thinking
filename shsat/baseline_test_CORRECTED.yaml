    \ = 8, dropping the negative on the base. A negative base raised to an odd power stays negative: (−2)³ = −8, not +8. The even/odd rule for powers: even exponent → positive result, odd exponent → keeps the sign of the base. Then 8 + 9 + 4 = 21."
