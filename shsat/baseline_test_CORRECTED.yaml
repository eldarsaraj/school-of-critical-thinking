  skill: main_idea
  difficulty: hard
  topic: ''
  passage_group_id: ela_h_p3
  passage_title: Should We Bring Back Lost Species? Two Views
  passage_text: "Passage 1\r\n\r\nThe extinction of a species has always seemed the most final of losses, a door that closes and cannot be reopened. Advances in genetics now call that finality into question. By recovering fragments of DNA from preserved remains and editing them into the genome of a living relative, scientists have begun to imagine reconstructing creatures the world has not seen for thousands of years, the woolly mammoth foremost among them. To those who find the prospect troubling, it is worth asking what, precisely, the trouble is.\r\n\r\nThe strongest case for de-extinction is not sentimental but ecological. Many extinctions, particularly recent ones, were caused by human activity, and many left holes in ecosystems that have never properly healed. The mammoth was not merely a passenger on the northern tundra; it was an engineer of it. Vast herds trampled and grazed the landscape in ways that maintained open grassland and slowed the thawing of the frozen soil beneath. Their\
    \ disappearance helped transform a productive, carbon-storing grassland into the mossy, shrubby terrain that covers much of the far north today. To restore such a creature, in this view, is not to indulge a fantasy but to repair a machine we ourselves broke, and perhaps to enlist an ancient ally against a modern danger.\r\n\r\nThere is, too, a question of obligation. If we accept that human beings drove these animals out of existence, and for many species the evidence is strong, then the power to undo that harm is not a temptation to be resisted but a responsibility to be weighed. We do not praise a man who breaks a thing and, offered the means to mend it, declines on the grounds that breaking is more natural than mending. The familiar objection that de-extinction amounts to \"playing God\" assumes a clean line between acting and refraining that the history of conservation erased long ago. We already manage nature everywhere, in what we plant and protect and permit; the only real question\
    \ is whether we manage it wisely.\r\n\r\nPassage 2\r\n\r\nThe case for resurrecting lost species rests on an appealing image, the mended machine, the ancient wrong set right, and appealing images are precisely what ought to make us cautious. The first difficulty is that de-extinction does not, in fact, bring anything back. What the techniques can produce is not a mammoth but a modified elephant carrying a scattering of mammoth genes: an approximation, raised without a herd of its own kind to teach it how to be what it resembles, and released, if it is released at all, onto a tundra that is no longer the tundra its ancestors shaped. To call this restoration is to mistake a likeness for a return.\r\n\r\nThe deeper problem is one of attention and resources. Conservation operates under brutal scarcity; every dollar and every hour devoted to one effort is unavailable for another. Thousands of living species stand at the edge of extinction at this moment, many of them needing nothing more\
    \ exotic than protected habitat and the patience to leave them alone. To divert money and scientific brilliance toward reconstructing the dead, while the living slip away for want of far cheaper help, is not a triumph of responsibility but a failure of priorities dressed in the costume of one.\r\n\r\nAnd there is a subtler cost, harder to measure but real. The promise that extinction might someday be reversed threatens to corrode the one conviction that has done more than any other to protect endangered life: the belief that extinction is forever, and that to lose a species is to lose it for good. Remove that finality, even as a distant possibility, and the urgency it creates begins to weaken. Why fight so fiercely to save what we are assured we can one day remake? The advocates of de-extinction offer us a door reopened. They do not always notice that the same door, left ajar, makes it easier to let the next one quietly close."
  question_text: Which statement best describes the central disagreement between Passage 1 and Passage 2?
  choice_a: They disagree mainly about whether the woolly mammoth once played a major role in shaping the northern tundra.
  choice_b: Passage 1 holds that reviving lost species can responsibly repair ecological and moral harm, while Passage 2 holds that it cannot truly restore them and would misdirect scarce effort while weakening the resolve to protect living species.
  choice_c: Passage 1 trusts that genetics can now rebuild an extinct animal, while Passage 2 doubts the technology can ever produce more than a rough copy.
  choice_d: Passage 1 sees de-extinction as a way to heal damaged ecosystems, while Passage 2 objects that humans should stop interfering with nature and let it take its course.
  correct_answer: B
  explanation: 'The real split is over worth, not possibility: Passage 1 casts de-extinction as a responsible repair of ecological and moral damage, while Passage 2 answers that it yields only an approximation, drains scarce conservation money, and saps the will to save species still alive (B). C relocates the quarrel to technical feasibility—whether the science can rebuild an animal—when both writers care less about whether it can be done than about whether it should be; D hands Passage 2 a ''leave nature alone'' stance it never takes, since it argues for spending the effort on living species, not for non-interference; A fastens on the mammoth''s role in the tundra, a supporting point in Passage 1, not the central matter in dispute.'
  distractor_types:
    A: wrong_concept
    C: partly_true_but_wrong
    D: wrong_concept
