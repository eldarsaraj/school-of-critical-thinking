  question_text: A water tank holds 600 liters. A pipe fills it at 30 liters per minute, while an open drain empties it at 10 liters per minute. If both are running and the tank starts empty, how many minutes until the tank is full?
  choice_a: 15 minutes
  choice_b: 20 minutes
  choice_c: 30 minutes
  choice_d: 60 minutes
  correct_answer: C
  explanation: "The pipe adds water while the drain removes it, so they work against each other. The tank's net filling rate is the fill rate minus the drain rate: 30 − 10 = 20 liters per minute. To fill 600 liters at a net 20 liters per minute: 600 ÷ 20 = 30 minutes.\r\n\r\n(A) is the key trap: adding the two rates to get 40, then 600 ÷ 40 = 15. Adding would be right if both pipes filled the tank (like the routing pipe problem). But here one fills and one empties — opposing actions subtract. Adding them overstates how fast the tank fills, giving a time that's too short.\r\n(B) ignores the drain entirely and uses only the 30 L/min fill rate. With the drain open, water leaves as it enters, so the tank fills more slowly than 30 L/min alone would suggest. The drain has to be accounted for.\r\n\r\n(D) uses the drain rate by itself (600 ÷ 10 = 60). The drain isn't filling the tank — it's removing water. The fill rate is what's adding water; the drain only reduces the net speed. The answer comes\
    \ from combining the two, not from either rate alone."
  distractor_types:
    A: wrong_setup
    B: partial_answer
    D: wrong_formula
