  passage_title: The Paradox of Choice
  passage_text: "It is taken almost as an article of faith in modern life that more choice is better than less. A market offering a hundred varieties of a product is assumed to serve its customers better than one offering three; a society that multiplies its citizens' options is assumed, by that fact alone, to have enlarged their freedom. The assumption runs so deep that we rarely state it outright, much less examine it. Yet a substantial body of research in psychology suggests that the relationship between choice and well-being is considerably less straightforward than the assumption allows, and that beyond a certain point additional options leave people not more satisfied but less.\r\n\r\nThe most frequently cited demonstration of the effect is deceptively modest. In a now-famous study conducted in a California grocery store, researchers set up a tasting booth offering shoppers a chance to sample jams. On some days the booth displayed six varieties; on others, twenty-four. The larger display,\
    \ unsurprisingly, attracted more passing interest: more shoppers stopped to look. But when the moment came to actually buy, the pattern reversed. Shoppers who had encountered the small display purchased jam at roughly ten times the rate of those who had faced the large one. The very abundance that drew people in appeared also to drive them away from deciding at all.\r\n\r\nWhy should a wider field of options make a decision harder rather than easier? Part of the answer lies in the simple cost of evaluation. Each additional option must be considered, compared, and weighed against the others, and human attention is finite. Past a certain number, the labor of choosing well begins to outweigh the value of choosing at all, and the mind, sensing this, prefers to defer or to walk away. But the more interesting part of the answer has less to do with the difficulty of reaching a decision than with how we feel about the decision once it has been made.\r\n\r\nWhen we select one option out of twenty-four,\
