  choice_b: the grandfather did not really believe his own remark and was speaking with deliberate irony.
  choice_c: the river, contrary to the grandfather's claim, does quietly hold on to the past after all.
  choice_d: the practical-sounding remark was really the grandfather's disguised way of speaking about his own buried losses.
  correct_answer: A
  explanation: The grandfather's flat 'the river has no memory' looked like a verdict that memory does not matter; the narrator later sees it carried the reverse—that because the water keeps nothing, the keeping falls to people (A). B reads 'the opposite' as insincerity, as if he had not believed his own words, though he did, since the further meaning sits beneath the literal one rather than against his belief; C takes 'opposite' literally, as though the river really does retain the past, which the passage flatly denies; D names a real undercurrent, the grandfather's hidden grief, but that is not the reversal the narrator points to, which is memory becoming the living's charge.
