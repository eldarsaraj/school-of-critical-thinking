  question_text: A circle has an area of 78.5 cm². What is its circumference? (Use π ≈ 3.14)
  choice_a: 15.7 cm
  choice_b: 31.4 cm
  choice_c: 78.5 cm
  choice_d: 157 cm
  correct_answer: B
  explanation: "This problem runs the circle formulas in reverse. Start from the area to find the radius, then use the radius to find the circumference. Area = πr², so 78.5 = 3.14 × r². Divide: r² = 78.5 ÷ 3.14 = 25. Take the square root: r = 5. Now compute circumference: C = 2πr = 2 × 3.14 × 5 = 31.4 cm.\r\n\r\n(A) uses C = πr instead of C = 2πr, getting 15.7 — exactly half the correct circumference. The circumference formula has a factor of 2: C = 2πr. (It's πd, where d is the diameter — and diameter is twice the radius, which is where the 2 comes from.)\r\n\r\n(C) reports 78.5, the area given in the problem. Area and circumference measure completely different things — area is the space inside (square units, cm²), circumference is the distance around (linear units, cm). The answer should be in cm, not cm².\r\n\r\n(D) plugs r² into the circumference formula: 2 × 3.14 × 25 = 157. The squared radius belongs in the area formula. Circumference uses r to the first power: 2πr, not 2πr². Mixing\
    \ the two is a common slip — keep them separate: area squares the radius, circumference doesn't."
  distractor_types:
    A: wrong_formula
    C: last_step_trap
    D: wrong_formula
