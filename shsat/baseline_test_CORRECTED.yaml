  passage_text: (1) Composting is a simple way to turn kitchen scraps into rich food for a garden. (2) To start, you need a bin or a corner of the yard and a mix of two kinds of material. (3) "Green" materials, such as fruit peels and coffee grounds, add nitrogen. (4) "Brown" materials, such as dry leaves and shredded paper, add carbon. (5) A good pile contains roughly equal amounts of both. (6) Once you have a pile, you must keep it slightly moist and turn it from time to time. (7) Turning the pile mixes in air, the tiny organisms that break down the scraps need oxygen to do their work. (8) Without enough air, a pile can begin to smell unpleasant. (9) In a few months, the bottom of the pile will turn into dark, crumbly compost. (10) You can then spread it around your plants. (11) Composting also reduces the amount of garbage a household sends to the landfill. (12) For these reasons, more and more families are giving it a try.
  question_text: Which transition, added to the beginning of sentence 8, would best connect it to sentence 7?
  choice_a: Instead, without enough air, a pile can begin to smell unpleasant.
  choice_b: In fact, without enough air, a pile can begin to smell unpleasant.
  choice_c: Nevertheless, without enough air, a pile can begin to smell unpleasant.
  choice_d: Meanwhile, without enough air, a pile can begin to smell unpleasant.
  correct_answer: B
  explanation: Sentence 8 reinforces sentence 7's point about the need for air, so 'In fact' fits. 'Nevertheless' signals contrast, 'Meanwhile' signals something happening at the same time, and 'Instead' signals a replacement—none matches the reinforcing relationship.
