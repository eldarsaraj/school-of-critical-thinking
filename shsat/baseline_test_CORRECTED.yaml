  question_text: Which version of the sentence keeps the verb tense consistent?
  choice_a: The river rose overnight, flooded the low fields, and leaves a thick layer of mud behind.
  choice_b: The river rises overnight, flooded the low fields, and left a thick layer of mud behind.
  choice_c: The river rose overnight, flooded the low fields, and left a thick layer of mud behind.
  choice_d: The river rose overnight, floods the low fields, and left a thick layer of mud behind.
  correct_answer: C
  explanation: 'All three actions belong to one past sequence, so every verb should be simple past: rose, flooded, left (C). Each other version leaves a single verb in the present tense—floods in D, leaves in A, rises in B—breaking the consistency even though the rest of the sentence stays in the past.'
