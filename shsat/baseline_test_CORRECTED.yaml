  passage_group_id: ela_h_p2
  passage_title: What the River Keeps
  passage_text: "When I was a child, my grandfather told me that the river had no memory, and I believed him for almost twenty years before I understood that he had meant the opposite of what he said.\r\n\r\nHe was a practical man, not given to riddles, and the remark came in the middle of a practical lesson. We were standing on the bank of the slow brown river that ran past his farm, and I had asked him, I must have been seven, whether the water going by us was the same water that had gone by yesterday. No, he said. That water was gone, in the sea by now, or close to it. The river you see is never the river you saw. It keeps nothing. It has no memory. Then he handed me a stick and told me to throw it in and watch how quickly it left us, which I did, and which seemed to settle the matter.\r\n\r\nIt did not occur to me until much later that the river my grandfather stood beside that afternoon was, in every way that mattered to him, saturated with memory. He had been born in the house behind\
    \ us. He had learned to swim in that water, had nearly drowned in it once as a boy, had buried a dog on its bank and a wife not far off. The river had no memory of these things, true enough; the particular molecules that had closed over his head when he was a boy were, as he said, long gone to the sea. But he had not been talking about the water. He had been talking, without seeming to know it, or perhaps knowing it perfectly well, about the difference between what a place holds and what we hold about a place, and he had handed the whole of it to the water in order, I think, not to have to say it about himself.\r\n\r\nThis is the strange double life of the things to which we fasten our memories. The river forgets; the bank remembers; and we, standing between them, cannot always tell which is which. We say a house \"holds memories,\" and it does not. A house holds nothing. It is indifferent to whoever lived and died inside it and will shelter the next family as faithfully as the last.\
    \ The memory is entirely ours. And yet to stand again in a room one has not entered for thirty years is to feel the past come rushing back with a force that no act of deliberate remembering can produce, as though the room had been keeping it all along and had only been waiting for us to return and collect it. We know this is not true. We know the room kept nothing. We feel, against all our knowing, that it did.\r\n\r\nMy grandfather has been dead now for many years, and the farm is sold, and I have not seen the river since the day of his funeral, when I stood on the bank for a while and threw a stick in and watched it go, as quickly as ever, keeping nothing. I understood, finally, what he had been telling me. He had not been correcting a child's confusion about water. He had been teaching me, in the only language a practical man could bear to use, that the river would carry everything away and remember none of it, and that this was precisely why we had to, that forgetting was the river's\
    \ work and remembering was ours, and that he was handing me the second of these the way a man hands his grandson a tool he will need after he is gone.\r\n\r\nThe water I watched that day is in the sea by now. So is the water of my childhood. The river is never the river I saw. It keeps nothing, and I have come to think this is the most generous thing about it: that it leaves the keeping to us, who can, and to whom it matters, and who will not always be here to do it either."
  question_text: Which statement best expresses the insight the narrator reaches by the end of the passage?
  choice_a: The grandfather spoke of the river so that he would not have to speak of his own losses—the home, the wife, and the dog he had buried near its bank.
  choice_b: Standing in an old room brings the past rushing back, so the narrator concludes that places really do keep the memories of those who lived in them.
  choice_c: Since the river keeps nothing and carries everything to the sea, the grandfather's lesson is to accept loss rather than cling to what is gone.
  choice_d: Because nothing in the world holds on to the past by itself, preserving it falls to the people who care—and the grandfather was quietly leaving the narrator that task to carry on after he was gone.
  correct_answer: D
  explanation: 'The passage builds to a meaning the grandfather never states outright: since nothing holds on to the past by itself, that work is left to the people who care, and his talk of the river was a way of handing the narrator that work for after he was gone (D). A fastens on a true mid-essay observation—that the grandfather displaced his own grief onto the water—but that is a step along the way, not the insight he finally reaches; B borrows the room that brings the past ''rushing back,'' the very feeling the passage raises and then flatly denies (''We know the room kept nothing''); C repeats the passage''s image of the river keeping nothing and carrying all to the sea, yet draws the opposite moral, resignation to loss, where the passage finds a charge to remember.'
  distractor_types:
    A: misidentified_detail
    B: wrong_concept
    C: partly_true_but_wrong
