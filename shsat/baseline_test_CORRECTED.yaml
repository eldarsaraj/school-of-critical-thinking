    \ climbs into the dozens. A culture that treats the multiplication of options as an unqualified good has therefore mistaken a curve that rises and then falls for a line that only ever rises.\r\n\r\nSome readers will object that people are free to ignore the options they do not want, to glance at the wall of mustards and simply take the nearest jar. In principle this is true. In practice it underestimates how much the mere presence of alternatives shapes our experience even when we do not engage with them. The shopper who grabs the nearest jar without comparing may still carry away a faint unease that a better jar was within reach, and the existence of the others quietly raises the standard against which the chosen jar is judged. Abundance does not politely wait to be consulted. It presses on us whether we attend to it or not.\r\n\r\nThe burden of abundance, moreover, does not fall on everyone equally. Psychologists distinguish between two broad styles of deciding. A \"satisficer\" settles\
    \ for an option that is good enough and moves on; a \"maximizer\" is driven to find the very best, examining the alternatives and refusing to commit until certain that nothing superior remains. For a satisficer, a few additional options are a mild convenience. For a maximizer, every added alternative is another thing to investigate, another way the eventual choice might fall short of the unseen ideal, and research suggests that maximizers, though they often choose objectively better than satisficers, end up less satisfied with what they have chosen. The more the world fills with options, the heavier the maximizer's task grows, and the wider the gap opens between the quality of the decision and the contentment it provides.\r\n\r\nThe stakes also rise with the importance of the choice. Selecting a jam is trivial, and the unease it produces is fleeting. But the same dynamic operates, greatly magnified, in decisions that matter a great deal. A worker confronted with dozens of retirement-savings\
    \ plans, or a patient asked to choose among several courses of treatment, faces not a pleasant array of possibilities but a genuinely paralyzing one, in which the cost of choosing wrongly is high and the labor of choosing well may exceed what any person can reasonably perform. In such cases the multiplication of options can lead people to postpone the decision indefinitely, or to hand it off to someone else, or to choose poorly out of sheer exhaustion, none of which much resembles the enlargement of freedom that abundance was supposed to provide.\r\n\r\nNone of this is an argument for taking choices away from people, which would carry costs of its own and would simply replace one error with another. What it argues for is humility about a value we have been encouraged to hold without limit. The expansion of choice has been one of the defining achievements of modern prosperity, and within bounds it has genuinely enlarged human life. But the assumption that more is always better, applied\
    \ without qualification, leads us to keep adding options long after they have stopped doing us any good, and to mistake the resulting paralysis and quiet dissatisfaction for failures of our own rather than predictable consequences of the abundance we have built. The man before the wall of forty mustards is exercising a freedom his grandparents did not enjoy. Whether he is the happier for it is a question we are, oddly, reluctant to ask."
  question_text: The jam study is presented mainly to demonstrate the surprising finding that
  choice_a: shoppers who chose from the larger display were less satisfied with the jam they bought.
  choice_b: the effort of comparing so many varieties is what drove shoppers to put off buying.
  choice_c: a larger array of options can attract more interest yet make people less likely to actually decide.
  choice_d: shoppers generally prefer to shop at stores that carry fewer products overall.
  correct_answer: C
  explanation: The booth drew more lookers at the 24-jam display but about a tenth as many buyers as the 6-jam display—interest rose while actual buying fell (C). D generalizes a single tasting booth into a claim about which stores shoppers prefer, which the study never examined; A swaps the study's measure for a different one, since the booth tracked whether people bought, not how satisfied they later felt with the jam; B states the essay's later explanation—the labor of comparing options—as if the study had isolated that cause, when all it showed was the drop in buying, not why it happened.
