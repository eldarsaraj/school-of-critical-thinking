  passage_text: (1) Today the bicycle is one of the most common forms of transportation in the world. (2) The machine we recognize now took nearly a century to develop, however. (3) The earliest version, built in Germany in 1817, had no pedals at all. (4) Riders pushed it along the ground with their feet. (5) This early machine moved much like a child's scooter. (6) It was made almost entirely of wood, including the wheels. (7) In the 1860s, French inventors added pedals to the front wheel. (8) This was a major improvement, riders could now move without touching the ground. (9) The design still had a serious drawback. (10) To go faster, makers built the front wheel larger and larger, until some wheels stood taller than the rider. (11) Bicycle racing became a popular sport in many European cities during these years. (12) These towering bicycles were dangerous, and riders fell often. (13) The safety bicycle of the 1880s solved the problem with two equal wheels and a chain that turned the rear
    wheel, and it is the direct ancestor of the bicycle we ride today.
  question_text: "The writer wants to add the following sentence to the passage:\r\n\r\n\"Because the rider sat so high above the ground, even a small bump could throw a person from the seat.\"\r\n\r\nWhere would the sentence best be placed?"
  choice_a: After sentence 7
  choice_b: After sentence 13
  choice_c: After sentence 10
  choice_d: After sentence 3
  correct_answer: C
  explanation: The sentence explains why the towering front wheel made the bicycle dangerous, so it belongs right after sentence 10, which introduces the oversized wheel, and leads naturally into sentence 12. Placed elsewhere, it separates the explanation from the design it describes.
  distractor_types:
    A: wrong_placement
    B: wrong_placement
    D: wrong_placement
