  topic: ''
  passage_group_id: ela_h_p1
  passage_title: The Paradox of Choice
  passage_text: "It is taken almost as an article of faith in modern life that more choice is better than less. A market offering a hundred varieties of a product is assumed to serve its customers better than one offering three; a society that multiplies its citizens' options is assumed, by that fact alone, to have enlarged their freedom. The assumption runs so deep that we rarely state it outright, much less examine it. Yet a substantial body of research in psychology suggests that the relationship between choice and well-being is considerably less straightforward than the assumption allows, and that beyond a certain point additional options leave people not more satisfied but less.\r\n\r\nThe most frequently cited demonstration of the effect is deceptively modest. In a now-famous study conducted in a California grocery store, researchers set up a tasting booth offering shoppers a chance to sample jams. On some days the booth displayed six varieties; on others, twenty-four. The larger display,\
    \ unsurprisingly, attracted more passing interest: more shoppers stopped to look. But when the moment came to actually buy, the pattern reversed. Shoppers who had encountered the small display purchased jam at roughly ten times the rate of those who had faced the large one. The very abundance that drew people in appeared also to drive them away from deciding at all.\r\n\r\nWhy should a wider field of options make a decision harder rather than easier? Part of the answer lies in the simple cost of evaluation. Each additional option must be considered, compared, and weighed against the others, and human attention is finite. Past a certain number, the labor of choosing well begins to outweigh the value of choosing at all, and the mind, sensing this, prefers to defer or to walk away. But the more interesting part of the answer has less to do with the difficulty of reaching a decision than with how we feel about the decision once it has been made.\r\n\r\nWhen we select one option out of twenty-four,\
    \ we do not simply gain the one we have chosen. We also, in a sense, give up the other twenty-three, and each of those forgone alternatives represents a possibility we have closed off. The more alternatives there were, the easier it becomes to imagine that one of them might have proved better than the option we settled on, and the more room there is for a particular species of regret. A person who buys the only sweater in a small shop has nothing against which to measure it and may wear it happily for years. A person who selects one sweater from fifty may find the very same garment faintly disappointing, haunted by the fifty roads not taken, not because the sweater is any worse, but because the act of choosing it was surrounded by alternatives that make satisfaction harder to feel.\r\n\r\nThis suggests a distinction the celebration of choice tends to ignore: the distinction between the freedom to choose and the experience of having chosen. Expanding the number of options reliably increases\
    \ the former. It does not reliably increase the latter, and it may actively diminish it. A person standing before forty varieties of mustard possesses a freedom that his grandparents, who could buy one or two, did not. Whether he is, in that moment, better off is a separate question, and not one the freedom itself can answer.\r\n\r\nIt is worth being precise about what this argument does and does not claim. It does not claim that constraint is preferable to freedom, nor that we would be happier with no options at all. A world of three jams is not obviously superior to a world of six; the move from very few options to several is generally a real gain, and few people would wish to return to the narrow shelves of an earlier age. The claim is narrower and easier to overlook. It is that the value of additional choice is not constant. That value is large when one is moving from a handful of options to a moderate number, and it shrinks steadily, and can eventually turn negative, as the number\
    \ climbs into the dozens. A culture that treats the multiplication of options as an unqualified good has therefore mistaken a curve that rises and then falls for a line that only ever rises.\r\n\r\nSome readers will object that people are free to ignore the options they do not want, to glance at the wall of mustards and simply take the nearest jar. In principle this is true. In practice it underestimates how much the mere presence of alternatives shapes our experience even when we do not engage with them. The shopper who grabs the nearest jar without comparing may still carry away a faint unease that a better jar was within reach, and the existence of the others quietly raises the standard against which the chosen jar is judged. Abundance does not politely wait to be consulted. It presses on us whether we attend to it or not.\r\n\r\nThe burden of abundance, moreover, does not fall on everyone equally. Psychologists distinguish between two broad styles of deciding. A \"satisficer\" settles\
    \ for an option that is good enough and moves on; a \"maximizer\" is driven to find the very best, examining the alternatives and refusing to commit until certain that nothing superior remains. For a satisficer, a few additional options are a mild convenience. For a maximizer, every added alternative is another thing to investigate, another way the eventual choice might fall short of the unseen ideal, and research suggests that maximizers, though they often choose objectively better than satisficers, end up less satisfied with what they have chosen. The more the world fills with options, the heavier the maximizer's task grows, and the wider the gap opens between the quality of the decision and the contentment it provides.\r\n\r\nThe stakes also rise with the importance of the choice. Selecting a jam is trivial, and the unease it produces is fleeting. But the same dynamic operates, greatly magnified, in decisions that matter a great deal. A worker confronted with dozens of retirement-savings\
    \ plans, or a patient asked to choose among several courses of treatment, faces not a pleasant array of possibilities but a genuinely paralyzing one, in which the cost of choosing wrongly is high and the labor of choosing well may exceed what any person can reasonably perform. In such cases the multiplication of options can lead people to postpone the decision indefinitely, or to hand it off to someone else, or to choose poorly out of sheer exhaustion, none of which much resembles the enlargement of freedom that abundance was supposed to provide.\r\n\r\nNone of this is an argument for taking choices away from people, which would carry costs of its own and would simply replace one error with another. What it argues for is humility about a value we have been encouraged to hold without limit. The expansion of choice has been one of the defining achievements of modern prosperity, and within bounds it has genuinely enlarged human life. But the assumption that more is always better, applied\
    \ without qualification, leads us to keep adding options long after they have stopped doing us any good, and to mistake the resulting paralysis and quiet dissatisfaction for failures of our own rather than predictable consequences of the abundance we have built. The man before the wall of forty mustards is exercising a freedom his grandparents did not enjoy. Whether he is the happier for it is a question we are, oddly, reluctant to ask."
  question_text: Which statement best expresses the central claim of the passage?
  choice_a: Because abundance tends to leave people anxious and dissatisfied, the passage concludes that businesses and governments alike ought to deliberately reduce the number of options they place before the public.
  choice_b: 'The value of additional choice is not constant: it rises at first but eventually shrinks and can turn negative, so treating more options as always better mistakes a curve for a straight line.'
  choice_c: People faced with many options simply need more time to compare them before they can decide well.
  choice_d: The freedom to choose among many options has little real connection to a person's happiness.
  correct_answer: B
  explanation: The thesis is that choice's value rises and then falls—'a curve that rises and then falls,' not a line (B). C captures one mechanism, not the central claim; D overstates—the passage says the freedom to choose increases even as the experience of choosing may not, not that choice and happiness are unrelated; A draws a policy conclusion the passage explicitly declines.
  distractor_types:
    A: wrong_concept
    C: misidentified_detail
    D: partly_true_but_wrong
