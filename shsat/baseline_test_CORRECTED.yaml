  choice_c: '3.0'
  choice_d: '5.0'
  correct_answer: B
  explanation: "You can't combine times directly — you combine rates. Each pipe's rate is the fraction of the pool it fills per hour: Pipe A fills 1/6 per hour, Pipe B fills 1/4 per hour. Together they fill 1/6 + 1/4 = 2/12 + 3/12 = 5/12 of the pool each hour. To find the time for one full pool, divide 1 by the combined rate: 1 ÷ (5/12) = 12/5 = 2.4 hours.\r\n\r\n(D) is the most tempting miss — averaging the times to get 5. But here's the sanity check that kills it instantly: with both pipes open, the pool must fill faster than with either pipe alone. The faster pipe alone takes 4 hours, so the combined time has to be less than 4. An answer of 5 (or even 3, though closer) should trigger a second look — and 2.4 correctly comes in under 4.\r\n\r\n(A) subtracts the times (6 − 4 = 2). There's no reason to subtract — both pipes are adding water, so their efforts combine, not cancel. Combining is done by adding rates, not subtracting times.\r\n\r\n(C) halves the slower time (6 ÷ 2 = 3) on the\
    \ intuition that a second pipe \"splits the work in half.\" But the two pipes aren't identical — Pipe B is faster than Pipe A, so the speedup is more than just halving. Adding the actual rates captures each pipe's true contribution."
