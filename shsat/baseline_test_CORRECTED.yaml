  question_text: According to the passage, Tharp determined the depth of the ocean floor at each point by
  choice_a: lowering a long weighted line over the side until it touched the bottom
  choice_b: recording the water pressure at the seabed with a sensor
  choice_c: using the time a sound pulse took to travel down and bounce back
  choice_d: measuring how loud the echo of a sound pulse was
  correct_answer: C
  explanation: The passage explains that the echo sounder timed how long a sound pulse took to travel down and bounce back, and from that time Tharp calculated the depth (C). D stays in the right domain—sound echoes—but it is the time a pulse takes, not its loudness, that reveals the depth; A describes the older lead-line method of sounding, which the passage does not mention; B describes a plausible pressure-based method the passage also never describes.
