  question_text: The mean of 5 numbers is 12. A sixth number is added, and the new mean becomes 14. What is the sixth number?
  choice_a: '2'
  choice_b: '10'
  choice_c: '14'
  choice_d: '24'
  correct_answer: D
  explanation: "The mean tells you the total when multiplied by the count, so work with sums. The original 5 numbers have a mean of 12, so their total is 5 × 12 = 60. After adding a sixth number, there are 6 numbers with a mean of 14, so the new total is 6 × 14 = 84. The sixth number is whatever was added to go from 60 to 84: 84 − 60 = 24.\r\n\r\n(A) reports 2 — the change in the mean. But the mean only shifted by 2 because the new number was spread across all six values. To pull the average up by 2, the added number has to be well above the old mean: here it's 24, far more than 2.\r\n(B) uses 5 instead of 6 for the new total: 5 × 14 = 70, then 70 − 60 = 10. Adding a number increases the count to 6, so the new mean of 14 is over 6 numbers, giving a total of 84. The count must match the number of values being averaged.\r\n\r\n(C) reports the new mean itself, 14. The sixth number and the new mean aren't the same thing — the new mean is the average of all six numbers, while the sixth number\
    \ is the single value that was added to shift that average from 12 to 14."
  distractor_types:
    A: wrong_setup
    B: wrong_formula
    C: last_step_trap
