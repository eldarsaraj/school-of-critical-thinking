  question_text: Both passages use the image of a "door." How does each passage use it?
  choice_a: Passage 1 presents extinction as a door that genetics may reopen; Passage 2 warns that the same door, left ajar, makes it easier to let other species quietly close.
  choice_b: Both passages use the door to celebrate genetics' new power to reopen what extinction had seemed to close forever, treating that reopening as a clear and welcome advance.
  choice_c: Passage 1 treats the door as one genetics can reopen, while Passage 2 warns that reopening it risks loosing long-extinct creatures and diseases back upon the modern world.
  choice_d: Passage 1 uses the door to insist that extinction is final and cannot be undone, while Passage 2 uses it to argue that this supposed finality can now be overcome.
  correct_answer: A
  explanation: Passage 1 opens with extinction as 'a door that closes and cannot be reopened,' a finality genetics now challenges; Passage 2 takes that same reopened door and warns that, left ajar, it loosens the resolve keeping other species' doors shut (A). B flattens the contrast, treating both writers as celebrating the reopening, when Passage 2 turns the image into a warning; C keeps the right shape—P1 reopens, P2 cautions—but invents P2's worry, which is the erosion of conservation urgency, not extinct creatures or diseases set loose; D swaps the roles, assigning Passage 1 the finality it raises only to overturn and handing Passage 2 the optimism it actually fears.
