  question_text: The author draws a distinction between "the freedom to choose and the experience of having chosen" chiefly in order to
  choice_a: show that expanding options reliably increases the one but not necessarily the other, which is the heart of the paradox.
  choice_b: grant that the expansion of options has brought a real and valuable gain in personal freedom.
  choice_c: give convenient names to two ideas so the reader can keep them straight through the rest of the essay.
  choice_d: establish that the freedom to choose is ultimately worth less than the contentment its expansion costs us.
  correct_answer: A
  explanation: 'The author names the two ideas precisely to drive a wedge between them: more options always enlarge the freedom to choose but not the experience of having chosen, and may even shrink it—that gap is the paradox (A). B keeps only the freedom half, treating the distinction as a concession to the value of choice rather than the contrast it sets up; C reduces the move to mere labeling, as if the names were for tidiness rather than to expose the gap; D pushes past what the passage claims, since it explicitly refuses to rank freedom as worth less overall, insisting only that the value of added choice rises and then falls.'
  distractor_types:
    B: partly_true_but_wrong
    C: wrong_concept
    D: too_broad
