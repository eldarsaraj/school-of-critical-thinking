  passage_title: What the Crows Remember
  passage_text: "For several years the biologist John Marzluff was troubled by a problem that seemed to belong less to science than to the study of grudges. On the campus where he worked, crows singled out particular people for harassment, diving at them and scolding them with harsh, rattling calls, while ignoring others who walked the same paths at the same hours. The targeted individuals had usually done something the birds disliked, such as disturbing a nest. But crows live for decades and range widely, and Marzluff could not bring himself to believe that every bird in the area had personally witnessed each offense. Something less obvious appeared to be at work. The crows seemed to recognize faces they had never seen do anything wrong.\r\n\r\nTo find out whether crows could in fact tell one human face from another, Marzluff designed an experiment that turned on a disguise. Wearing a rubber mask of a caveman, researchers trapped and banded several wild crows, an unpleasant but harmless\
    \ procedure, and released them. A second team, wearing a different and entirely neutral mask, walked the same ground without bothering the birds at all. In the weeks that followed, members of the group strolled the campus in one mask or the other and recorded how the crows responded.\r\n\r\nThe results were unambiguous. The crows mobbed and scolded the caveman mask fiercely, harassing whoever happened to be wearing it, even when that person had never trapped a single bird. The neutral mask drew almost no reaction. Because different people wore the same mask on different days, the birds could not have been responding to a person's height, gait, or clothing. They were responding to a face.\r\n\r\nMore striking was what happened as time passed. The number of crows that scolded the caveman mask did not dwindle as the originally trapped birds died or moved on. It grew. Crows that had never been captured joined the mobbing, among them young birds that had not yet hatched when the trapping\
    \ took place. The hostility was spreading through the population faster than firsthand experience could account for.\r\n\r\nMarzluff concluded that the crows were learning about the dangerous face from one another. A young crow that watches its parents shriek at a particular mask appears to absorb the lesson without ever testing it for itself, much as a child learns to fear a hot stove from a warning rather than a burn. Knowledge of a specific threat, in other words, was passing from bird to bird and from one generation to the next. Biologists call this social learning, and it allows a single piece of information to outlive the individual who first acquired it.\r\n\r\nIt would be a mistake, though, to picture the crows as keeping some deliberate record of their enemies. Nothing in the experiment points to planning or shared intention. What the birds possessed was a powerful memory for faces, a strong impulse to react to threat, and a habit of attending closely to what other crows were\
    \ doing. Out of those ordinary capacities an extraordinary result emerged: a kind of collective grudge, sustained by a community, against a face that most of its members had never personally encountered doing harm.\r\n\r\nThe finding reaches beyond the question of whether a crow can hold a grudge. It suggests that the line between learning from experience and learning from others is far less distinct than we tend to assume, and that animals we rarely credit with much inner life may be quietly handing knowledge down across generations. The crow that scolds you may not be remembering you at all. It may be remembering what another crow, perhaps long dead, once decided about a face that happened to resemble yours."
  question_text: The detail that crows which "had not yet hatched when the trapping took place" joined in mobbing the mask most directly supports the idea that
  choice_a: crows grow more aggressive toward people as their population increases.
  choice_b: the birds were acquiring their hostility from other crows rather than from their own experience.
  choice_c: young crows inherit their parents' specific fears through their genes.
  choice_d: the originally trapped crows had stayed in the area long enough to raise several broods.
  correct_answer: B
  explanation: Birds that did not exist at the time of the trapping could not have learned the threat firsthand, which points to learning from other crows (B). C names a different mechanism—genetic inheritance—than the observation the passage describes; D is plausible but does not address how inexperienced birds learned the threat; A is an unsupported generalization.
  distractor_types:
    A: misidentified_detail
    C: wrong_concept
    D: misidentified_detail
