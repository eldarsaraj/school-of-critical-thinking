  question_text: A spinner has 8 equal sections numbered 1 through 8. What is the probability of landing on a number that is even OR greater than 5?
  choice_a: 5/8
  choice_b: 3/8
  choice_c: 1/2
  choice_d: 7/8
  correct_answer: A
  explanation: "\"Even OR greater than 5\" means a number counts if it satisfies either condition (or both). List each group: even numbers are 2, 4, 6, 8; numbers greater than 5 are 6, 7, 8. Now combine them into one set, listing each number only once: {2, 4, 6, 7, 8}. That's 5 favorable outcomes out of 8, so P = 5/8.\r\n\r\n(D) is the key miss: adding the sizes of the two groups (4 + 3 = 7) without noticing they overlap. The numbers 6 and 8 are both even and greater than 5 — they're in both lists. If you just add, you count them twice. The fix is inclusion-exclusion: P(A or B) = P(A) + P(B) − P(both) = 4/8 + 3/8 − 2/8 = 5/8. The 2/8 you subtract is for the two numbers (6 and 8) that were double-counted.\r\n\r\n(B) and (C) each apply only one of the two conditions — (B) keeps just \"greater than 5,\" (C) keeps just \"even.\" The word \"or\" means a number qualifies if it meets either requirement, so both groups must be merged, not used separately."
  distractor_types:
    B: partial_answer
    C: partial_answer
    D: wrong_setup
