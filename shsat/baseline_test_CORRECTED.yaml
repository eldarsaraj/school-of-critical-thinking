  correct_answer: D
  explanation: "Start by isolating the variable. Subtract 5 from both sides: −2x + 5 − 5 ≥ 11 − 5, giving −2x ≥ 6. Now divide both sides by −2 to get x alone — but here's the critical rule: whenever you multiply or divide both sides of an inequality by a negative number, you must flip the direction of the inequality sign. Dividing −2x ≥ 6 by −2 gives x ≤ −3.\r\n\r\n(A) gets x ≥ 3 by dividing 6 by 2 without applying the negative, losing both the sign on the answer and the flip. Two errors cancel in a misleading way — the answer looks clean, but neither step was done correctly.\r\n(B) gets x ≤ 3 by flipping the inequality correctly but dividing 6 by positive 2 instead of negative 2 — the answer is −3, not 3. The flip was right; the division was off.\r\n\r\n(C) gets x ≥ −3 by dividing correctly — 6 ÷ (−2) = −3 — but forgetting to flip the inequality sign. This is the most common mistake on this type of problem. The answer is one symbol away from correct: ≥ should be ≤."
