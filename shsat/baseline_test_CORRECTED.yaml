  question_text: "What is the best way to combine the two sentences?\r\n\r\n\"The museum was crowded. We still managed to see every exhibit.\""
  choice_a: The museum was crowded, we managed to see every exhibit.
  choice_b: Since the museum was crowded, we managed to see every exhibit.
  choice_c: Despite the fact that the museum was crowded, we still managed to see every exhibit.
  choice_d: Although the museum was crowded, we still managed to see every exhibit.
  correct_answer: D
  explanation: The two ideas contrast—the museum was crowded, yet they saw everything—so the tight concessive 'Although' joins them best (D). A drops the conjunction and leaves a comma splice; B uses 'Since,' which makes the crowd the cause of their success rather than an obstacle to it; C states the contrast correctly but with the wordy 'Despite the fact that' where 'Although' is cleaner.
  distractor_types:
    A: introduces_new_error
    B: wrong_logical_relation
    C: less_precise
