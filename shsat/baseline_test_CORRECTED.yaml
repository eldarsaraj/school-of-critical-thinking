  question_text: If 3(x − 4) = 2(x + 1) + 5, what is the value of x?
  choice_a: '-5'
  choice_b: '11'
  choice_c: '17'
  choice_d: '19'
  correct_answer: D
  explanation: "Distribute on both sides first, multiplying the outside number by every term in the parentheses. Left side: 3(x − 4) = 3x − 12. Right side: 2(x + 1) + 5 = 2x + 2 + 5 = 2x + 7. The equation becomes 3x − 12 = 2x + 7. Subtract 2x from both sides: x − 12 = 7. Add 12 to both sides: x = 19. Always verify by substituting back: 3(19−4) = 45 and 2(19+1)+5 = 45. ✓\r\n\r\n(C) is the most common slip: distributing the 3 to the x but not to the −4, writing 3x − 4. The multiplier applies to both terms inside the parentheses: 3 × x and 3 × (−4) = −12. Dropping the second multiplication leaves the equation unbalanced and gives x = 11.\r\n\r\n(B) is the same error on the other side — distributing 2 to the x but not the +1, writing 2x instead of 2x + 2. The correct right side is 2x + 2 + 5 = 2x + 7. Using 2x + 5 gives x = 17.\r\n\r\n(D) distributes correctly but flips a sign while solving. After reaching 3x − 12 = 2x + 7, moving the −12 across should add 12 to the right (7 + 12 = 19). Subtracting\
    \ instead (7 − 12 = −5) reverses the operation. To undo \"− 12,\" you add 12 to both sides."
