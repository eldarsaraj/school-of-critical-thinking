    \ and an enzyme, luciferase, that hastens its combination with oxygen. What makes the process striking is its efficiency. An incandescent bulb squanders most of its energy as heat; the reaction inside a deep-sea animal releases almost none, which is why its light is famously cold.\r\n\r\nWhat the light is for varies with the animal, and form tends to follow function. The deep-sea anglerfish, suspended where no sunlight has ever reached, dangles a luminous lure above its jaws; prey drawn toward the glow swim directly into its mouth. Other species turn light to defense rather than attack. Certain squid, when seized, do not release dark ink, useless in an already black sea, but expel a luminous cloud, a flare of brightness that disorients a predator while the squid retreats unseen. Here the light is meant not to attract but to bewilder.\r\n\r\nStill other organisms use light to locate their own kind. The firefly, one of the few bioluminescent animals familiar to people on land, flashes\
    \ in species-specific patterns, a code of timing and rhythm. A male signals; a female of the same species answers only when the rhythm matches hers, and a flash offered out of sequence draws no reply. The signal therefore carries information more exact than mere presence: not simply here I am, but here I am, and I am one of you, a distinction on which the survival of the species can depend.\r\n\r\nFor most of the history of marine biology, the deep ocean's light went largely unexamined, because the only way to bring its creatures to the surface was in nets that crushed them and extinguished their glow. The picture changed with the arrival of remotely operated vehicles, robotic submersibles that descend thousands of meters and film animals undisturbed. The marine biologist Edith Widder, a pioneer of such observation, has argued that in the deep ocean bioluminescence is the rule rather than the exception; by some estimates, more than ninety percent of animals there produce light. The footage\
    \ these vehicles return reveals a sea far busier, and far more talkative, than anyone had supposed."
  question_text: Which detail best supports the idea that bioluminescence is a form of communication between animals?
  choice_a: A firefly answers a flash only when its rhythm matches that of its own species.
  choice_b: The anglerfish's glowing lure, dangled in the darkness above its waiting jaws, draws unsuspecting prey directly toward its open mouth.
  choice_c: The squid's luminous cloud disorients a predator.
  choice_d: The firefly is among the few bioluminescent animals that people on land can readily see.
  correct_answer: A
  explanation: The firefly exchange is a signal between animals of the same species, which is communication (A). B is predation and C is defense; D names a true fact about the firefly—its visibility to people on land—but not an instance of communication between animals.
  distractor_types:
    B: misidentified_detail
    C: misidentified_detail
    D: misidentified_detail
