  question_text: "Which of the following lists the numbers in order from least to greatest?\r\n\r\n 2/5, 0.45, 3/8, 42%"
  choice_a: 3/8, 2/5, 42%, 0.45
  choice_b: 3/8, 2/5, 0.45, 42%
  choice_c: 2/5, 3/8, 42%, 0.45
  choice_d: 3/8, 42%, 2/5, 0.45
  correct_answer: A
  explanation: "To compare numbers written in different forms — fractions, decimals, and percents — convert them all to a single common form first. Decimals are easiest here. 2/5 = 0.40 (since 2 ÷ 5 = 0.40); 0.45 is already a decimal; 3/8 = 0.375 (3 ÷ 8); and 42% = 0.42 (move the decimal point two places left). Now order the decimals: 0.375 < 0.40 < 0.42 < 0.45. Translating back to the original forms gives 3/8, 2/5, 42%, 0.45 — choice A.\r\n\r\n(C) places 2/5 before 3/8, judging by appearance rather than value. But 2/5 = 0.40 is actually larger than 3/8 = 0.375, so 3/8 has to come first. Fractions cannot be ranked by glancing at their numerators and denominators; they must be converted.\r\n\r\n(D) slots 42% ahead of 2/5, but 42% = 0.42 is larger than 2/5 = 0.40, so 2/5 comes first. A quick impression of where a percent falls is not reliable without converting it.\r\n\r\n(B) gets the first two correct but reverses the last pair, placing 0.45 before 42%. Since 0.45 is greater than 0.42, 42%\
    \ must come before 0.45. Converting every value to a decimal and ordering them end to end avoids all three mistakes."
  distractor_types:
    B: last_step_trap
    C: fast_pattern_match
    D: fast_pattern_match
