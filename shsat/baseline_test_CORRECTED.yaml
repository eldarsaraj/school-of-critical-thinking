  choice_a: suggest that the cold light made by living creatures is far more useful to human beings than the artificial light sources that we manufacture for ourselves.
  choice_b: emphasize how rarely people observe bioluminescence directly.
  choice_c: clarify that bioluminescent light is generated chemically on demand rather than stored and released slowly.
  choice_d: explain why bioluminescent light feels cold to the touch.
  correct_answer: C
