  question_text: The passage most strongly suggests that the first families to leave a Southern town
  choice_a: were by temperament bolder and more daring than the families who left in later years.
  choice_b: were less likely to succeed in the North than the families who came after them.
  choice_c: were quickly followed out of their hometowns by the rest of their community within the same year.
  choice_d: took on more risk than those who followed, because fewer paths had yet been cleared.
  correct_answer: D
