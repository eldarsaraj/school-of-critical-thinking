  choice_b: 'The committee, eager to finish before winter, scheduled visits to three sites: a flooded quarry near Albany, New York, an abandoned mill outside Lowell, Massachusetts, and a limestone cave above Reading, Pennsylvania.'
  choice_c: The committee, eager to finish before winter, scheduled visits to three sites; a flooded quarry near Albany, New York; an abandoned mill outside Lowell, Massachusetts; and a limestone cave above Reading, Pennsylvania.
  choice_d: 'The committee eager to finish before winter scheduled visits to three sites: a flooded quarry near Albany, New York; an abandoned mill outside Lowell, Massachusetts; and a limestone cave above Reading, Pennsylvania.'
  correct_answer: A
  explanation: Three punctuation jobs must all be right. First, the nonrestrictive phrase 'eager to finish before winter' is set off by a pair of commas; second, a colon, not a semicolon, introduces the list after the independent clause; third, because each item already contains a comma (city, state), the items must be separated by semicolons rather than commas. A does all three (A). B separates the items with commas, so the series blurs into one unreadable string of place names; C introduces the list with a semicolon where a colon belongs; D drops the commas around 'eager to finish before winter,' letting the modifier run into the sentence.
