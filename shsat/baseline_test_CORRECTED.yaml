  question_text: A bag contains 4 red and 2 blue marbles. Two marbles are drawn at random without replacement. What is the probability that both are red?
  choice_a: 2/5
  choice_b: 1/3
  choice_c: 4/9
  choice_d: 2/3
  correct_answer: A
  explanation: "\"Without replacement\" means the first marble stays out, so both the count of reds and the total change for the second draw. For the first draw, 4 of the 6 marbles are red: P = 4/6. Once a red is drawn and kept out, 3 reds remain among 5 total marbles: P = 3/5. Since you need both events to happen, multiply: (4/6) × (3/5) = 12/30 = 2/5.\r\n\r\n(C) is the central trap: using 4/6 twice, as if the first marble were put back. But the problem says without replacement — after the first red is removed, only 3 reds and 5 total remain. Reusing 4/6 describes a different scenario (drawing, replacing, then drawing again).\r\n\r\n(B) correctly lowers the red count to 3 for the second draw but leaves the total at 6: (4/6)(3/6). When a marble is removed, the whole bag shrinks — both the numerator (reds left) and the denominator (marbles left) go down. The second-draw probability is 3/5, not 3/6.\r\n\r\n(D) computes only the first draw (4/6 = 2/3) and stops. \"Both are red\" describes two\
    \ events happening in sequence, so you must account for the second draw too by multiplying."
  distractor_types:
    B: wrong_formula
    C: wrong_setup
    D: last_step_trap
