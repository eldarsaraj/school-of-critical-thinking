  passage_title: Why We Yawn
  passage_text: '(1) Almost everyone yawns, yet scientists still do not fully agree on why. (2) For a long time, the most popular explanation was that yawning supplies the brain with extra oxygen when we are tired. (3) According to this view, a yawn is essentially a deep breath that corrects a shortage of oxygen in the blood. (4) Careful experiments, however, have failed to support it. (5) When researchers gave volunteers air enriched with oxygen, the rate at which the volunteers yawned did not change. (6) A newer explanation proposes that yawning helps cool the brain. (7) The deep intake of air and the stretching of the jaw increase blood flow and draw in cooler air, which may lower the brain''s temperature slightly. (8) This theory would explain a curious finding: people yawn more often in warm rooms than in cool ones. (9) It would also account for the strange power of contagious yawning, since a yawning person may signal to others that conditions call for a cooling response. (10) Most
    researchers caution that the evidence remains incomplete. (11) Yawning may well serve more than one purpose at once. (12) What once seemed like one of the body''s simplest acts has turned out to be one of its most stubborn puzzles.'
  question_text: The writer wants to begin sentence 5 with a transition that makes its logical relationship to sentence 4 as clear as possible. Which choice is best?
  choice_a: '"As a result," because sentence 5 describes what the failure reported in sentence 4 brought about.'
  choice_b: '"In addition," because sentence 5 introduces a separate point beyond the one made in sentence 4.'
  choice_c: '"Even so," because sentence 5 qualifies the claim made in sentence 4.'
  choice_d: '"For example," because sentence 5 gives a specific instance of the experiments mentioned in sentence 4.'
  correct_answer: D
  explanation: Sentence 4 makes the general claim that careful experiments undercut the oxygen theory; sentence 5 reports one such experiment, the oxygen-enriched-air trial in which the yawn rate held steady—so it is an instance of sentence 4, which 'For example' marks (D). A casts sentence 5 as a consequence of the failure, but the unchanged rate is part of the evidence for that failure, not something it brought about; B treats the experiment as a separate, additional point when it is the very support for the claim just made; C signals a concession, as if sentence 5 qualified sentence 4, though it confirms rather than limits it.
  distractor_types:
    A: wrong_logical_relation
    B: less_precise
    C: wrong_logical_relation
