  explanation: "Express everyone in terms of the smallest share. Let Anna = x. Bella has twice as much, so Bella = 2x. Luka has three times as much, so Luka = 3x. Together they have $120: x + 2x + 3x = 120. Combine the parts: 6x = 120, so x = 20. Luka's share is 3x = 3(20) = 60. Check the total: 20 + 40 + 60 = 120. ✓\r\n\r\n(A) and (B) come from solving correctly but reporting the wrong person — 20 is Anna's share, 40 is Bella's. The question asks for Luka, who has 3x = 60. After finding x, always trace back to the specific quantity the question wants.\r\n\r\n(D) miscounts the total number of parts. Anna counts as 1 part (her x), Bella as 2, and Luka as 3 — that's 6 parts in total, not 5. Forgetting Anna's own part gives 5x = 120 and x = 24, leading to Luka = 72. Every person's share, including the baseline one, contributes to the total."
