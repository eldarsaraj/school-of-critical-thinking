  question_text: According to the passage, why might a person who chooses one sweater from fifty feel less satisfied than someone who buys the only sweater in a small shop?
  choice_a: The forty-nine other sweaters raise the standard against which the chosen one is judged, so it comes to seem inadequate.
  choice_b: The buyer is the sort of person who must find the very best sweater and so stays dissatisfied as long as untried options remain.
  choice_c: Choosing from fifty sweaters takes so much effort that the labor of deciding spoils the buyer's pleasure in the purchase.
  choice_d: The many rejected alternatives make it easier to imagine a better choice and to feel the regret of options not taken, even though the sweater itself is no worse.
  correct_answer: D
  explanation: 'The sweater paragraph traces the dissatisfaction to the forgone alternatives: with fifty rejected, it is easy to imagine one of them might have been better, leaving room for the regret of roads not taken even though the sweater is no worse (D). A borrows the passage''s ''raised standard'' idea, but the passage attaches that to the jar example, not to the sweater, whose dissatisfaction comes from imagined regret rather than a higher bar; B imports the maximizer, a personality the passage discusses later, though the sweater example makes a general claim about anyone choosing from many; C names the evaluation-cost mechanism, the labor of comparing, which the passage uses to explain difficulty in deciding, not the regret felt after a choice is made.'
  distractor_types:
    A: partly_true_but_wrong
    B: wrong_concept
    C: partly_true_but_wrong
