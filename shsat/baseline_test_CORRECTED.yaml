  passage_title: The Clockmaker's Daughter
  passage_text: "Mira had been raised among clocks, and for that reason she had never learned to hear their ticking as anything but restless. To her it was the sound of impatience, a thousand small voices counting and counting and never once satisfied. Her father heard it differently, or claimed to. He sat at his bench from the moment the shutters went up until long after the street outside had emptied into darkness, a brass eyepiece screwed into one socket, coaxing some stalled mechanism back into motion with movements so small they hardly seemed to occur.\r\n\r\n\"A clock that runs fast is lying,\" he was fond of saying, \"and a clock that runs slow is at least honest about being broken. The fast ones are the harder to forgive.\" Mira had heard the remark so often that she could mouth it along with him, though she had never been certain what it meant, or whether her father believed it or merely liked the shape of it in his mouth.\r\n\r\nOn the afternoon the woman in the grey coat came\
    \ in, Mira was meant to be dusting. Instead she was watching her father's hands. The woman set a small carriage clock on the counter, its gilt worn through to bronze at the corners, and said only that it had stopped, and that she needed it running again by Friday. She did not explain why Friday. Her father turned the clock over, opened its back, and went very still in the way he did when a thing was either trivial or impossible and he had not yet decided which.\r\n\r\n\"This hasn't run in some time,\" he said at last.\r\n\r\n\"No,\" the woman agreed.\r\n\r\n\"Longer than you've owned it, I'd guess.\"\r\n\r\nSomething moved across the woman's face, brief and complicated, and then settled. \"It was my mother's,\" she said. \"I wound it every night for a year after she died. Then one evening I forgot, and after that it seemed easier not to begin again.\" She regarded the clock as though it had wronged her. \"I'd like it to keep time. That's all.\"\r\n\r\nHer father nodded slowly and set\
    \ the clock down with unusual care, as if it had grown heavier in his hands. He did not say that the repair was a simple one, though Mira, who knew the inside of a carriage clock as well as she knew the inside of her own coat pocket, could see plainly that it was. He named no price. He said only that Friday would be no trouble, and that the woman should not wind the clock on her way home, that she should leave it to him to see to first.\r\n\r\nWhen the woman had gone, Mira asked why he had told her not to wind it. The mechanism was sound; a single turn of the key would have started it where it stood. For a while her father bent over the bench and she thought he would not answer at all.\r\n\r\n\"Some things you don't hurry back into use,\" he said finally. \"A clock that's been stopped a long while, you let it remember how to run. You wind it a little, you wait, you wind it a little more.\" He glanced up at her, and there was something in his face she could not name. \"It isn't really\
    \ about the clock,\" he added, and said nothing further, and the shop filled again with the sound of a thousand small voices, counting."
  question_text: It can best be inferred that the father tells the woman not to wind the clock on her way home because
  choice_a: he needs time to find a replacement part before the clock can be made to run.
  choice_b: he intends to wind it himself so that he can charge her for the service.
  choice_c: he understands that the clock matters to her in a way that calls for unusual care.
  choice_d: he believes that starting a long-stopped clock too quickly could damage the mechanism.
  correct_answer: C
  explanation: The father's unusual care and his closing remark, 'It isn't really about the clock,' show his caution is about the clock's meaning to the woman (C). D is the literal sense of what he says metaphorically ('you let it remember how to run'), but the passage signals the real reason lies elsewhere; A is contradicted because Mira sees the repair is simple; B is unsupported—he names no price.
  distractor_types:
    A: wrong_concept
    B: wrong_concept
    D: partly_true_but_wrong
