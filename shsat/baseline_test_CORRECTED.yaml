  question_text: If n is an odd integer, which of the following is always even?
  choice_a: n+2
  choice_b: 2n+1
  choice_c: n²
  choice_d: 3n+1
  correct_answer: D
  explanation: "The key rules for parity (odd/even) under operations: odd + even = odd; odd + odd = even; even × anything = even; odd × odd = odd. Apply each to an odd n.\r\n\r\nFor (D), 3n + 1: since n is odd and 3 is odd, 3n is odd × odd = odd. Adding 1 (odd + odd) gives even. So 3n + 1 is always even — this is the answer. Testing confirms it: n = 3 → 10, n = 5 → 16, both even.\r\n\r\n(A) n + 2: adding 2 (an even number) doesn't flip parity. An odd number plus an even number is still odd. The +2 shifts the value but not whether it's odd or even.\r\n\r\n(B) 2n + 1: the 2n part is always even (any integer times 2 is even), but adding 1 makes it odd. In fact, \"2n + 1\" is the standard algebraic way to write an odd number — it can never be even.\r\n\r\n(C) n²: squaring an odd number means multiplying it by itself, and odd × odd = odd. Squaring never changes a number's parity — odd stays odd, even stays even."
  distractor_types:
    A: wrong_setup
    B: wrong_setup
    C: wrong_setup
