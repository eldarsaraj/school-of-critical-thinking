  choice_a: the squid's body, unlike that of its shallow-water relatives, has lost the ability to produce any of the dark pigment that ordinary ink requires.
  choice_b: the glowing cloud attracts other squid that help drive the predator away.
  choice_c: a luminous cloud is faster for the squid to produce than ink would be.
  choice_d: in a lightless sea dark ink would conceal nothing, while a burst of light can disorient a predator.
  correct_answer: D
