  question_text: Passage 1 argues that the mammoth "was not merely a passenger on the northern tundra; it was an engineer of it." This metaphor chiefly supports the claim that
  choice_a: the mammoth physically built features of the landscape, much as a human engineer designs and constructs them.
  choice_b: the mammoth was extraordinarily well adapted to the harsh conditions of the northern tundra.
  choice_c: the tundra's grasslands provided exactly the conditions the mammoth needed to survive and thrive.
  choice_d: restoring the mammoth could repair an ecosystem that the animal once actively shaped and maintained.
  correct_answer: D
  explanation: To call the mammoth an 'engineer' rather than a 'passenger' is to say it actively shaped and held the grassland in place—its trampling and grazing kept the tundra open—so its return could mend a system its loss unbalanced (D). A takes 'engineer' literally, as deliberate construction, when the shaping was a byproduct of how the herds lived and fed; B gives the 'passenger' reading the metaphor sets itself against—that the mammoth was well suited to the tundra—rather than the engineer's reading, that it acted upon it; C reverses the relationship, making the tundra sustain the mammoth when the metaphor's point is that the mammoth sustained the tundra.
