  choice_b: Shops that carry fifty sweaters tend to charge more for each of them, and it is the higher price the buyer pays, rather than the sweater itself, that produces the later regret.
  choice_c: The buyer of one sweater from fifty did not have enough time to examine all of them.
  choice_d: The many rejected alternatives make it easier to imagine a better choice and to feel the regret of options not taken, even though the sweater itself is no worse.
  correct_answer: D
  explanation: The passage attributes the dissatisfaction to forgone alternatives and the regret they invite, stressing the garment is no worse (D). A contradicts that point; B is unsupported; C names the evaluation-cost mechanism, which is real in the passage but not the one this example illustrates—the regret of options not taken.
