  choice_a: Some gardeners prefer to buy finished compost rather than make their own.
  choice_b: Brown materials are usually easier to find in autumn, when leaves fall.
  choice_c: Keeping these two materials in balance helps the pile break down quickly and without odor.
  choice_d: Coffee grounds and fruit peels can be collected in a small container on the kitchen counter.
  correct_answer: C
  explanation: Sentence 5 introduces the balance of greens and browns, and C builds directly on that idea before the directions continue. D, A, and B are all on the subject of composting but pull the paragraph toward side points—collecting scraps, buying compost, and the seasons—rather than advancing the step-by-step instructions.
