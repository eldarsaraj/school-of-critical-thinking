  choice_d: Most researchers caution that the evidence remains incomplete, but yawning may well serve more than one purpose at once.
  correct_answer: C
  explanation: C joins the two cautious statements into one, keeping both as things researchers say. D inserts 'but,' implying a contrast that misstates the relationship; A's 'so' turns a tentative possibility into a stated conclusion, changing the meaning; B is a comma splice.
