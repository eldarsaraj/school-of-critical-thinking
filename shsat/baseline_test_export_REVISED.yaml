  passage_title: The Light Below
  passage_text: 'Most of the planet is dark. Sunlight reaches only the upper few hundred meters of the ocean; below that lies a cold, lightless expanse that forms the largest living space on Earth. For decades biologists assumed little of consequence occurred there. They were mistaken. In the deep sea, the majority of animals can manufacture their own light, and they do so constantly, to hunt, to hide, to startle, and to communicate. The phenomenon, called bioluminescence, may be the most common form of communication on the planet, and it unfolds almost entirely beyond human sight.


    Bioluminescence is often confused with the faint afterglow of a watch dial or a plastic star on a bedroom ceiling, but the two are unrelated. A glow-in-the-dark object is phosphorescent: it absorbs light and re-emits it slowly, fading once the source is gone. A bioluminescent organism generates light chemically, on demand. The reaction depends on a light-producing molecule, generically termed luciferin, and an enzyme, luciferase, that hastens its combination with oxygen. What makes the process striking is its efficiency. An incandescent bulb squanders most of its energy as heat; the reaction inside a deep-sea animal releases almost none, which is why its light is famously cold.


    What the light is for varies with the animal, and form tends to follow function. The deep-sea anglerfish, suspended where no sunlight has ever reached, dangles a luminous lure above its jaws; prey drawn toward the glow swim directly into its mouth. Other species turn light to defense rather than attack. Certain squid, when seized, do not release dark ink, useless in an already black sea, but expel a luminous cloud, a flare of brightness that disorients a predator while the squid retreats unseen. Here the light is meant not to attract but to bewilder.


    Still other organisms use light to locate their own kind. The firefly, one of the few bioluminescent animals familiar to people on land, flashes in species-specific patterns, a code of timing and rhythm. A male signals; a female of the same species answers only when the rhythm matches hers, and a flash offered out of sequence draws no reply. The signal therefore carries information more exact than mere presence: not simply here I am, but here I am, and I am one of you, a distinction on which the survival of the species can depend.


    For most of the history of marine biology, the deep ocean''s light went largely unexamined, because the only way to bring its creatures to the surface was in nets that crushed them and extinguished their glow. The picture changed with the arrival of remotely operated vehicles, robotic submersibles that descend thousands of meters and film animals undisturbed. The marine biologist Edith Widder, a pioneer of such observation, has argued that in the deep ocean bioluminescence is the rule rather than the exception; by some estimates, more than ninety percent of animals there produce light. The footage these vehicles return reveals a sea far busier, and far more talkative, than anyone had supposed.'
  question_text: Which statement best expresses the central idea of the passage?
  choice_a: Bioluminescence functions chiefly as a defense that lets vulnerable animals escape larger predators.
  choice_b: Many deep-sea animals chemically produce their own light and rely on it for a variety of essential purposes.
  choice_c: The light generated by deep-sea organisms is remarkably efficient, releasing almost no energy as heat.
  choice_d: New robotic submersibles have allowed scientists to study deep-sea animals that older collection methods destroyed.
  correct_answer: B
  explanation: The passage surveys how widespread bioluminescence is in the deep sea and the many uses it serves (B). C is a true but supporting point; D is true but describes how scientists learned about it, not the central idea; A treats one use as the whole when the passage stresses several.
  distractor_types:
    C: misidentified_detail
    D: misidentified_detail
    A: partly_true_but_wrong
