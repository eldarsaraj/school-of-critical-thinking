  passage_title: A Brief History of the Bicycle
  passage_text: (1) Today the bicycle is one of the most common forms of transportation in the world. (2) The machine we recognize now took nearly a century to develop, however. (3) The earliest version, built in Germany in 1817, had no pedals at all. (4) Riders pushed it along the ground with their feet. (5) This early machine moved much like a child's scooter. (6) It was made almost entirely of wood, including the wheels. (7) In the 1860s, French inventors added pedals to the front wheel. (8) This was a major improvement, riders could now move without touching the ground. (9) The design still had a serious drawback. (10) To go faster, makers built the front wheel larger and larger, until some wheels stood taller than the rider. (11) Bicycle racing became a popular sport in many European cities during these years. (12) These towering bicycles were dangerous, and riders fell often. (13) The safety bicycle of the 1880s solved the problem with two equal wheels and a chain that turned the rear wheel, and it is the direct ancestor of the bicycle we ride today.
  question_text: 'Sentence 8 reads: "This was a major improvement, riders could now move without touching the ground." Which revision best corrects the error in this sentence?'
  choice_a: This, was a major improvement, riders could now move without touching the ground.
  choice_b: This was a major improvement, riders could now move, without touching the ground.
  choice_c: 'This was a major improvement: riders could now move without touching the ground.'
  choice_d: This was a major improvement riders could now move without touching the ground.
  correct_answer: C
  explanation: The sentence joins two independent clauses with only a comma; a colon correctly links the statement to the explanation that follows. D removes the comma and produces a run-on rather than fixing the splice; A adds a comma after 'This' that does not address the splice; B inserts a comma after 'move' while leaving the splice in place.
