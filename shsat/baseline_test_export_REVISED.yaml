  passage_title: The Paradox of Choice
  passage_text: 'It is taken almost as an article of faith in modern life that more choice is better than less. A market offering a hundred varieties of a product is assumed to serve its customers better than one offering three; a society that multiplies its citizens'' options is assumed, by that fact alone, to have enlarged their freedom. The assumption runs so deep that we rarely state it outright, much less examine it. Yet a substantial body of research in psychology suggests that the relationship between choice and well-being is considerably less straightforward than the assumption allows, and that beyond a certain point additional options leave people not more satisfied but less.


    The most frequently cited demonstration of the effect is deceptively modest. In a now-famous study conducted in a California grocery store, researchers set up a tasting booth offering shoppers a chance to sample jams. On some days the booth displayed six varieties; on others, twenty-four. The larger display, unsurprisingly, attracted more passing interest: more shoppers stopped to look. But when the moment came to actually buy, the pattern reversed. Shoppers who had encountered the small display purchased jam at roughly ten times the rate of those who had faced the large one. The very abundance that drew people in appeared also to drive them away from deciding at all.


    Why should a wider field of options make a decision harder rather than easier? Part of the answer lies in the simple cost of evaluation. Each additional option must be considered, compared, and weighed against the others, and human attention is finite. Past a certain number, the labor of choosing well begins to outweigh the value of choosing at all, and the mind, sensing this, prefers to defer or to walk away. But the more interesting part of the answer has less to do with the difficulty of reaching a decision than with how we feel about the decision once it has been made.


    When we select one option out of twenty-four, we do not simply gain the one we have chosen. We also, in a sense, give up the other twenty-three, and each of those forgone alternatives represents a possibility we have closed off. The more alternatives there were, the easier it becomes to imagine that one of them might have proved better than the option we settled on, and the more room there is for a particular species of regret. A person who buys the only sweater in a small shop has nothing against which to measure it and may wear it happily for years. A person who selects one sweater from fifty may find the very same garment faintly disappointing, haunted by the fifty roads not taken, not because the sweater is any worse, but because the act of choosing it was surrounded by alternatives that make satisfaction harder to feel.


    This suggests a distinction the celebration of choice tends to ignore: the distinction between the freedom to choose and the experience of having chosen. Expanding the number of options reliably increases the former. It does not reliably increase the latter, and it may actively diminish it. A person standing before forty varieties of mustard possesses a freedom that his grandparents, who could buy one or two, did not. Whether he is, in that moment, better off is a separate question, and not one the freedom itself can answer.


    It is worth being precise about what this argument does and does not claim. It does not claim that constraint is preferable to freedom, nor that we would be happier with no options at all. A world of three jams is not obviously superior to a world of six; the move from very few options to several is generally a real gain, and few people would wish to return to the narrow shelves of an earlier age. The claim is narrower and easier to overlook. It is that the value of additional choice is not constant. That value is large when one is moving from a handful of options to a moderate number, and it shrinks steadily, and can eventually turn negative, as the number climbs into the dozens. A culture that treats the multiplication of options as an unqualified good has therefore mistaken a curve that rises and then falls for a line that only ever rises.


    Some readers will object that people are free to ignore the options they do not want, to glance at the wall of mustards and simply take the nearest jar. In principle this is true. In practice it underestimates how much the mere presence of alternatives shapes our experience even when we do not engage with them. The shopper who grabs the nearest jar without comparing may still carry away a faint unease that a better jar was within reach, and the existence of the others quietly raises the standard against which the chosen jar is judged. Abundance does not politely wait to be consulted. It presses on us whether we attend to it or not.


    The burden of abundance, moreover, does not fall on everyone equally. Psychologists distinguish between two broad styles of deciding. A "satisficer" settles for an option that is good enough and moves on; a "maximizer" is driven to find the very best, examining the alternatives and refusing to commit until certain that nothing superior remains. For a satisficer, a few additional options are a mild convenience. For a maximizer, every added alternative is another thing to investigate, another way the eventual choice might fall short of the unseen ideal, and research suggests that maximizers, though they often choose objectively better than satisficers, end up less satisfied with what they have chosen. The more the world fills with options, the heavier the maximizer''s task grows, and the wider the gap opens between the quality of the decision and the contentment it provides.


    The stakes also rise with the importance of the choice. Selecting a jam is trivial, and the unease it produces is fleeting. But the same dynamic operates, greatly magnified, in decisions that matter a great deal. A worker confronted with dozens of retirement-savings plans, or a patient asked to choose among several courses of treatment, faces not a pleasant array of possibilities but a genuinely paralyzing one, in which the cost of choosing wrongly is high and the labor of choosing well may exceed what any person can reasonably perform. In such cases the multiplication of options can lead people to postpone the decision indefinitely, or to hand it off to someone else, or to choose poorly out of sheer exhaustion, none of which much resembles the enlargement of freedom that abundance was supposed to provide.


    None of this is an argument for taking choices away from people, which would carry costs of its own and would simply replace one error with another. What it argues for is humility about a value we have been encouraged to hold without limit. The expansion of choice has been one of the defining achievements of modern prosperity, and within bounds it has genuinely enlarged human life. But the assumption that more is always better, applied without qualification, leads us to keep adding options long after they have stopped doing us any good, and to mistake the resulting paralysis and quiet dissatisfaction for failures of our own rather than predictable consequences of the abundance we have built. The man before the wall of forty mustards is exercising a freedom his grandparents did not enjoy. Whether he is the happier for it is a question we are, oddly, reluctant to ask.'
  question_text: The author draws a distinction between 'the freedom to choose and the experience of having chosen' chiefly in order to
  choice_a: show that expanding options reliably increases the one but not necessarily the other, which is the heart of the paradox.
  choice_b: argue that freedom and satisfaction amount, in the end, to the same thing.
  choice_c: concede that having more options does make people both freer and happier.
  choice_d: explain why the researchers chose to set out two displays of different sizes, one holding six jams and one holding twenty-four, in the grocery store.
  correct_answer: A
  explanation: The distinction lets the author say more options always increase the freedom to choose but may not increase—and can reduce—the experience of having chosen (A). B collapses the very distinction; C grants the 'happier' half the passage denies; D is a true study detail unrelated to the conceptual point.
  distractor_types:
    B: wrong_concept
    C: partly_true_but_wrong
    D: misidentified_detail
